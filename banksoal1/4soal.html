<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif PLSV</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT PERSAMAAN LINEAR SATU VARIABEL</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Nilai 𝑚 yang memenuhi persamaan 𝑚 3 = −6 adalah ....","options":[{"key":"A","text":"−18"},{"key":"B","text":"−2"},{"key":"C","text":"2"},{"key":"D","text":"18"}],"answer":"A","explanation":"Untuk menyelesaikan persamaan \n𝑚\n3 = −6, kalikan kedua ruas dengan 3. \nDengan demikian, diperoleh 𝑚= −6 × 3. \nSehingga, 𝑚= −18. \nOpsi B (−2) terjadi karena membagi −6 dengan 3 (kesalahan operasi). \nOpsi C (2) terjadi karena membagi 6 dengan 3 dan melakukan kesalahan tanda. \nOpsi D (18) terjadi karena mengabaikan tanda negatif pada proses perkalian. \nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Nilai 𝑤 yang memenuhi persamaan −5𝑤= −35 adalah ....","options":[{"key":"A","text":"−175"},{"key":"B","text":"−7"},{"key":"C","text":"7"},{"key":"D","text":"175"}],"answer":"C","explanation":"Diberikan persamaan: −5𝑤= −35 \nBagi kedua ruas dengan −5 untuk mengisolasi variabel 𝑤: \n𝑤= −35\n−5 \nKarena bilangan negatif dibagi bilangan negatif menghasilkan bilangan positif, maka: \n𝑤= 7 \nJawaban Benar: C"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Jika diketahui nilai 𝑎= −4, pernyataan matematika berikut yang bernilai benar adalah ....","options":[{"key":"A","text":"𝑎+ 4 = 8"},{"key":"B","text":"2𝑎= −8"},{"key":"C","text":"𝑎−4 = 0"},{"key":"D","text":"−3𝑎= −12"}],"answer":"B","explanation":"Substitusikan nilai 𝑎= −4 ke setiap pilihan pernyataan: \nA. 𝑎+ 4 = −4 + 4 = 0 (Salah, karena tertulis 8) \nB. 2𝑎= 2(−4) = −8 (Benar) \nC. 𝑎−4 = −4 −4 = −8 (Salah, karena tertulis 0) \nD. −3𝑎= −3(−4) = 12 (Salah, karena tertulis −12) \nJawaban Benar: B"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Dua buah taman berbentuk persegi memiliki ukuran yang berbeda. Panjang sisi taman kedua adalah 3 meter lebih panjang daripada panjang sisi taman pertama. Jika jumlah keliling kedua taman tersebut adalah 52 meter, berapakah keliling dari taman yang berukuran lebih besar?","options":[{"key":"A","text":"20 meter"},{"key":"B","text":"32 meter"},{"key":"C","text":"40 meter"},{"key":"D","text":"52 meter"}],"answer":"B","explanation":"Langkah 1: Misalkan panjang sisi taman pertama adalah 𝑠, maka panjang sisi taman kedua \nadalah 𝑠+ 3. Rumus keliling persegi adalah 4 × 𝑠𝑖𝑠𝑖. Jumlah keliling kedua taman adalah 4𝑠+\n4(𝑠+ 3) = 52 ⟹ 4𝑠+ 4𝑠+ 12 = 52 ⟹ 8𝑠+ 12 = 52. Kurangkan kedua ruas dengan 12 \ndiperoleh 8𝑠= 40 ⟹ 𝑠= 5 meter. \nLangkah 2: Panjang sisi taman kedua yang lebih besar adalah 𝑠+ 3 = 5 + 3 = 8 meter. Keliling \ntaman yang lebih besar tersebut adalah 4 × 8 = 32 meter. \nJawaban Benar: B"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Jumlah dari tiga bilangan ganjil berurutan adalah 57. Bilangan terbesar dari ketiga bilangan tersebut adalah ....","options":[{"key":"A","text":"17"},{"key":"B","text":"19"},{"key":"C","text":"20"},{"key":"D","text":"21"}],"answer":"D","explanation":"Langkah 1: Misalkan tiga bilangan ganjil berurutan tersebut adalah 𝑥, 𝑥+ 2, dan 𝑥+ 4. \nJumlahkan ketiganya: 𝑥+ (𝑥+ 2) + (𝑥+ 4) = 57 ⟹ 3𝑥+ 6 = 57 ⟹ 3𝑥= 51 ⟹ 𝑥= 17. \nLangkah 2: Bilangan terbesar dari kelompok tersebut adalah 𝑥+ 4. Substitusikan nilai 𝑥= 17: \n17 + 4 = 21. \nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Jumlah tiga bilangan bulat berurutan adalah 57. Bilangan terbesar dari ketiga bilangan tersebut adalah ....","options":[{"key":"A","text":"18"},{"key":"B","text":"19"},{"key":"C","text":"20"},{"key":"D","text":"21"}],"answer":"C","explanation":"Misalkan tiga bilangan bulat berurutan tersebut adalah 𝑛, 𝑛+ 1, dan 𝑛+ 2. \nJumlah ketiga bilangan: 𝑛+ (𝑛+ 1) + (𝑛+ 2) = 57 ⇒3𝑛+ 3 = 57. \nSelesaikan persamaan: 3𝑛= 54 ⇒𝑛= 18. \nBilangan-bilangan tersebut adalah 18, 19, dan 20. \nBilangan terbesar adalah 20. \nJawaban Benar: C"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Sebuah toko pakaian memberikan diskon khusus untuk pembelian kemeja sekolah. Pembelian kemeja pertama dikenakan harga normal, sedangkan untuk pembelian kemeja kedua dan seterusnya diberikan diskon sebesar 25% dari harga normal. Andi membeli beberapa kemeja di toko tersebut dengan total pembayaran sebesar Rp285.000,00. Jika harga normal satu kemeja adalah Rp60.000,00, berapakah total kemeja yang dibeli oleh Andi?","options":[{"key":"A","text":"3 kemeja"},{"key":"B","text":"4 kemeja"},{"key":"C","text":"5 kemeja"},{"key":"D","text":"6 kemeja"}],"answer":"D","explanation":"Langkah 1: Hitung harga kemeja berdiskon (kemeja kedua dan seterusnya): Harga diskon = \n60.000 × (1 −0,25) = 45.000 rupiah. \nLangkah 2: Misalkan total kemeja yang dibeli adalah 𝑥. Pembelian terdiri dari 1 kemeja harga \nnormal dan (𝑥−1) kemeja harga diskon. \nLangkah 3: Susun persamaan linear: 60.000 + 45.000(𝑥−1) = 285.000. \nLangkah 4: Selesaikan persamaan tersebut: 45.000(𝑥−1) = 225.000 ⟹ 𝑥−1 = 5 ⟹ 𝑥= 6 \nkemeja. \nJawaban Benar: D"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Tujuh tahun yang lalu, umur seorang ayah adalah enam kali umur anaknya. Jika pada tahun depan jumlah umur mereka berdua adalah 51 tahun, berapakah umur ayah tersebut tiga tahun yang akan datang?","options":[{"key":"A","text":"27 tahun"},{"key":"B","text":"30 tahun"},{"key":"C","text":"37 tahun"},{"key":"D","text":"40 tahun"}],"answer":"D","explanation":"Misalkan umur ayah sekarang adalah 𝐴 dan umur anak sekarang adalah 𝐵. \nTujuh tahun yang lalu: 𝐴−7 = 6(𝐵−7) ⇒𝐴−7 = 6𝐵−42 ⇒𝐴−6𝐵= −35. \nTahun depan, jumlah umur mereka adalah 51 tahun: (𝐴+ 1) + (𝐵+ 1) = 51 ⇒𝐴+ 𝐵= 49 ⇒𝐴=\n49 −𝐵. \nSubstitusikan 𝐴 ke persamaan pertama: (49 −𝐵) −6𝐵= −35 ⇒49 −7𝐵= −35 ⇒−7𝐵= −84 ⇒\n𝐵= 12. \nMaka umur ayah sekarang: 𝐴= 49 −12 = 37 tahun. \nUmur ayah tiga tahun yang akan datang adalah 37 + 3 = 40 tahun. \nJawaban Benar: D"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Perhatikan langkah-langkah penyelesaian persamaan aljabar 2(𝑥+ 4) = 3𝑥−1 yang dilakukan oleh seorang siswa berikut: Langkah 1: 2𝑥+ 8 = 3𝑥−1. Langkah 2: 2𝑥−3𝑥= −1 + 8. Langkah 3: −𝑥= 7. Langkah 4: 𝑥= −7. Pada langkah manakah siswa tersebut melakukan kesalahan pertama kali?","options":[{"key":"A","text":"Langkah 1"},{"key":"B","text":"Langkah 2"},{"key":"C","text":"Langkah 3"},{"key":"D","text":"Langkah 4"}],"answer":"B","explanation":"Langkah 1: Mengalikan angka 2 ke dalam tanda kurung: 2(𝑥+ 4) = 2𝑥+ 8 (Langkah 1 benar). \nLangkah 2: Memindahkan suku-suku untuk mengelompokkannya. Suku +3𝑥 pindah ke ruas kiri \nmenjadi −3𝑥 (benar), tetapi suku +8 dari ruas kiri dipindahkan ke ruas kanan dan ditulis sebagai \n+8 bukannya −8. Persamaan yang benar seharusnya 2𝑥−3𝑥= −1 −8. Kesalahan terjadi di \nLangkah 2. \n\nLangkah 3: Menghitung hasil dari Langkah 2 yang salah: −𝑥= 7 (benar secara operasional dari \nLangkah 2). \nLangkah 4: Mengalikan kedua ruas dengan −1: 𝑥= −7 (benar secara operasional dari Langkah \n3). \nKesimpulan: Kesalahan prosedural pertama kali terjadi pada Langkah 2 karena kegagalan \nmelakukan pembalikan tanda operasi (sign error) saat melakukan perpindahan ruas. \nJawaban Benar: B"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Diberikan suatu bentuk persamaan linear satu variabel sederhana 𝑦−7 = −12 yang diselesaikan dengan sifat operasi hitung searah untuk menyisakan variabel tunggal di satu sisi. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai konsep penemuan penyelesaian dari persamaan tersebut!","statements":[{"text":"Langkah operasi paling sesuai untuk dilakukan adalah menjumlahkan angka 7 di kedua ruas kiri dan kanan secara adil.","answer":"Benar","explanation":"Untuk mengeliminasi −7 di ruas kiri, kedua ruas ditambahkan 7 berdasarkan prinsip \nkeadilan/kesamaan pada sistem timbangan linear."},{"text":"Persamaan termodifikasi ekuivalen yang dihasilkan setelah penyisihan ruas kiri adalah 𝑦= −12 −7.","answer":"Salah","explanation":"Seharusnya kedua ruas ditambah 7, yang menghasilkan 𝑦= −12 + 7. Bentuk dengan \npengurangan (−7) menunjukkan kesalahan arah perpindahan/invers tanda."},{"text":"Hasil perhitungan penyelesaian matematis untuk nilai 𝑦 yang dicari dari persamaan adalah 𝑦= −5.","answer":"Benar","explanation":"Penghitungan dari 𝑦= −12 + 7 menghasilkan nilai negatif −5, yang mana hal ini tepat."},{"text":"Pengecekan kebenaran dilakukan dengan memasukkan hasil ke dalam persamaan awal dan memperoleh bentuk kebenaran −5 −7 = −12.","answer":"Benar","explanation":"Ketika 𝑦= −5 disubstitusi kembali ke dalam bentuk asli 𝑦−7, ia secara sah menghasilkan \nkebenaran angka −12."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Persamaan linear sederhana pada pengenalan variabel dinotasikan dengan susunan persamaan berupa 𝑧+ 10 = 4. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Solusi awal penentuan ruas dapat dievaluasi sebanding lewat pengerjaan berupa pengurangan konstanta 10 di kedua ruas.","answer":"Benar","explanation":"Supaya tersisa unsur variabel saja, langkah praktis berupa pengurangan sebesar 10 diberlakukan \nmenyeluruh."},{"text":"Tanda sign positif pada solusi pengerjaan dari 𝑧 di atas mengarah ke bilangan positif 6.","answer":"Salah","explanation":"Proses menghitung menunjukkan 𝑧= 4 −10 yang mana secara kaidah berbuah −6, bukan \nbernilai 6."},{"text":"Nilai pemenuh 𝑧 pada Persamaan Linear Satu Variabel tersebut termasuk jenis nilai bilangan positif.","answer":"Salah","explanation":"Bilangan hasil adalah −6, yang dikategorikan masuk lingkup klasifikasi bilangan negatif bulat."},{"text":"Akar penyelesaian peubah konkrit memiliki kemiripan nilai sama dengan persamaan model bernilai −6.","answer":"Benar","explanation":"Himpunan penentu peubah bernilai 𝑧= −6, membuktikan kelayakan dan kebenaran mutlak."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Sebuah kalimat terbuka dalam topik dasar pengenalan struktur aljabar disajikan melalui persamaan singkat 6𝑎= −18. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai konsep di atas!","statements":[{"text":"Sesuai rincian strukturnya, lambang satu variabel penyusun pada kalimat tersebut didominasi berpangkat linear (berpangkat satu).","answer":"Benar","explanation":"Variabel dalam aljabar berpangkat tunggal berupa 𝑎1 melambangkan persamaannya mutlak linier \nsatu variabel."},{"text":"Apabila variabel 𝑎 kita ubah menggunakan masukan suku bilangan bernilai −3, model kalimat terbuka di atas bertransformasi bernilai sah.","answer":"Benar","explanation":"Penyelidikan kesetimbangan: ruas bagian kiri pengerjaan bernilai perkalian 6 × (−3) = −18, \ncocok bernilai konstan negatif yang terletak di sebelah ruas bagian kanan."},{"text":"Hasil penghitungan akhir (akar-akar penyelesaian) bagi pengerjaan pencarian huruf variabel 𝑎 dari bentuk tersebut menghasilkan angka positif 3.","answer":"Salah","explanation":"Salah. Pembagian menggunakan faktor pengikut melanggar aturan sign dalam aritmetika \nsehingga kehilangan lambang tanda bilangan pengikut aslinya, −18 ÷ 6 = −3."},{"text":"Lambang faktor pendamping pembentuk koefisien bilangan pengali pengikut bagi lambang variabel 𝑎 di atas berkedudukan dari nilai −18.","answer":"Salah","explanation":"Salah. Lambang bilangan pendamping variabel disebut koefisien, dan koefisien pada model \naljabar tersebut adalah 6."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Penyedia jasa keamanan parkir pusat perbelanjaan menerapkan kebijakan tarif jasa dasar motor sebesar Rp2.000,00 ditambah ongkos penitipan barang helm yang dihitung per jam sebesar ℎ rupiah. Seorang pemilik motor memarkir kendaraan serta menitipkan barangnya selama 4 jam penuh, kemudian dikenakan tagihan pembayaran sebesar Rp10.000,00. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Hubungan sewa durasi simpan helm secara aljabar dapat diformulasikan ke dalam representasi model yaitu 4000 + 2ℎ= 10000.","answer":"Salah","explanation":"Beban parkir terdiri dari tarif dasar (2000) dan akumulasi menitipkan barang per jam selama 4 \njam (4ℎ). Struktur penyusunan formulanya bernilai tepat sebesar 2000 + 4ℎ= 10000."},{"text":"Besarnya sewa penalti menitipkan barang berupa helm per jam (ℎ) bernilai resmi sebesar Rp2.000,00.","answer":"Benar","explanation":"Dihitung menggunakan teknik reduksi nilai dari formula 2000 + 4ℎ= 10000 ⟹ 4ℎ= 8000, \ndiperoleh tarif dasar titipan ℎ= 8000/4 = 2000 rupiah."},{"text":"Apabila pengendara tersebut di masa mendatang menyewa lapak penyimpanan untuk motor serta helm dengan waktu 6 jam, biaya keseluruhan yang dikenakan adalah Rp14.000,00.","answer":"Benar","explanation":"Diperoleh melalui rumus hitung sewa motor total 2000 + 6 × ℎ rupiah. Hasil hitung sesudah \npenempatan ℎ= 2000 memberikan hasil nyata sebesar 2000 + 6(2000) = 14000 rupiah."},{"text":"Tarif akumulasi bagi para pengendara motor yang memarkir dan mengunci barang di loker penyimpanan berdurasi 10 jam penuh di area tersebut adalah Rp22.000,00.","answer":"Benar","explanation":"Total biaya dari operasi pengerjaan durasi 10 jam dipecah menjadi kalkulasi 2000 + 10(ℎ). \nSehingga nilai pengorbanannya bernilai tepat 2000 + 10(2000) = 22000 rupiah."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Sebidang tanah pekarangan yang berbentuk persegi panjang memiliki ukuran dimensi panjang (2𝑥+ 5) meter dan lebar (𝑥−1) meter. Apabila diketahui keliling tanah tersebut adalah sebesar 56 meter, tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai variabel 𝑥 yang memenuhi model persamaan keliling pekarangan tersebut adalah 6.","answer":"Salah","explanation":"Langkah 1: Susun model keliling persegi panjang yakni 2((2𝑥+ 5) + (𝑥−1)) = 56 yang \ndisederhanakan menjadi 2(3𝑥+ 4) = 56, lalu bagi kedua ruas dengan 2 menghasilkan 3𝑥+ 4 =\n28. Langkah 2: Kurangkan dengan 4 lalu bagi 3, didapat 3𝑥= 24 sehingga nilai 𝑥= 8. Maka nilai \n𝑥= 6 salah."},{"text":"Ukuran dimensi panjang dari pekarangan tanah milik petani tersebut adalah 21 meter.","answer":"Benar","explanation":"Langkah 1: Dari perhitungan keliling sebelumnya telah didapatkan nilai penyelesaian variabel 𝑥=\n8. Langkah 2: Substitusikan nilai 𝑥= 8 tersebut ke dalam persamaan panjang tanah yaitu 2(8) +\n5 = 16 + 5 = 21 meter. Maka pernyataan ini bernilai benar."},{"text":"Ukuran dimensi lebar dari pekarangan tanah milik petani tersebut adalah 7 meter.","answer":"Benar","explanation":"Langkah 1: Temukan nilai penyelesaian persamaan keliling, di mana nilai 𝑥= 8. Langkah 2: \nLakukan substitusi nilai 𝑥= 8 ke dalam model bentuk lebar yaitu 𝑥−1 meter sehingga lebar \nadalah 8 −1 = 7 meter. Maka pernyataan benar."},{"text":"Selisih panjang dan lebar dari pekarangan tanah berbentuk persegi panjang tersebut adalah 12 meter.","answer":"Salah","explanation":"Langkah 1: Cari nilai panjang dan lebar sesungguhnya yang berturut-turut adalah 21 meter dan 7 \nmeter. Langkah 2: Hitung selisih di antara keduanya melalui pengurangan panjang dengan lebar \nyakni 21 −7 = 14 meter. Pernyataan selisih sebesar 12 meter bernilai salah."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Seorang pelaku usaha mikro membuat sandal jepit kreatif dengan biaya operasional harian tetap sebesar Rp200.000,00 ditambah biaya bahan mentah sebesar Rp12.000,00 untuk setiap pasang sandal yang ia buat. Pelaku usaha tersebut kemudian memasarkan karyanya dan sukses menjual setiap pasang sandal jepit tersebut dengan harga jual Rp20.000,00, dan ia menargetkan impas setelah membuat 𝑛 pasang sandal. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Persamaan hubungan penyederhanaan titik impas dari operasional produksi tersebut adalah 8000𝑛= 200000.","answer":"Benar","explanation":"Kondisi impas bernilai saat Pendapatan = Pengeluaran, dimodelkan 20000𝑛= 200000 + 12000𝑛. \nPenyederhanaan dengan mengurangkan 12000𝑛 memberikan 8000𝑛= 200000."},{"text":"Pelaku usaha mikro tersebut sukses menutup seluruh pengeluarannya setelah membuat dan menjual minimal 25 pasang sandal jepit.","answer":"Benar","explanation":"Mencari solusi 8000𝑛= 200000 menghasilkan nilai 𝑛= 200000/8000 = 25 pasang sandal."},{"text":"Apabila ia mampu menggarap dan menjual 30 pasang sandal jepit pada satu hari kerja, maka profit bersih yang diraup adalah Rp40.000,00.","answer":"Benar","explanation":"Pendapatan dari 30 sandal = 30 × 20000 = 600000. Modal produksi harian = 200000 +\n30 × 12000 = 560000. Keuntungan = 600000 −560000 = 40000 rupiah."},{"text":"Kerugian usaha harian yang diderita oleh pengrajin bila sandal hanya laku sebanyak 10 pasang pada satu hari kerja adalah Rp100.000,00.","answer":"Salah","explanation":"Untuk 10 sandal, biaya total produksi = 200000 + 10(12000) = 320000, dan pendapatannya =\n10 × 20000 = 200000. Kerugian = 320000 −200000 = 120000 rupiah."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Demi standarisasi pengujian nilai keandalan alat pembersih udara rancangan sains baru sekolah, penyelenggara kontes mempatenkan ambang minimum tingkat nilai lolos sebut saja tingkat poin kelulusan 𝑃 ditaruh ke jajaran formulasi penyelarasan persamaan bertingkat linear yaitu: 2(3𝑃− 5) + 10 = 4(𝑃+ 7) + 𝑃. Penyelenggara menerapkan poin kelulusan tertentu, sanksi poin terendah, dan syarat insentif tambahan berangka minimal 𝑃+ 10. Tentukan benar atau salah setiap poin konklusi hasil evaluasi tersebut.","statements":[{"text":"Target poin minimum ketetapan ambang batas kelulusan 𝑃 untuk verifikasi di ajang unjuk kreativitas inovasi yang seimbang pada rumus linier di atas bernilai 30.","answer":"Salah","explanation":"Rasionalisir uraian kurung = 6𝑃−10 + 10 = 4𝑃+ 28 + 𝑃⇒6𝑃= 5𝑃+ 28 ⇒𝑃= 28, bukan 30."},{"text":"Jika juri berasumsi bahwa batas minimal poin kelayakan proyek ini bernilai di bawah 30 poin, maka klaim spekulasi juri penengah tersebut berdasar pada nilai matematis yang sah.","answer":"Benar","explanation":"Berdasarkan hitungan solusi sesungguhnya yakni 𝑃= 28, angka 28 memang di bawah 30 poin, \nmaka perkiraan di bawah 30 bernilai logis dan sah secara kalkulasi."},{"text":"Apabila seandainya sistem seleksi memperketat ambang batas kelulusan, dan ditetapkan perubahan sebesar separuh dari kriteria ketetapan pokok lama ditambahi muatan 10 poin, rincian kriteria kelayakan batas kuota yang baru digeser berada pada nilai angka 24.","answer":"Benar","explanation":"Aturan kelolosan dinamis =\n𝑃\n2 + 10 ⇒\n28\n2 + 10 = 14 + 10 = 24 poin."},{"text":"Agar mendapat kelebihan subsidi ekstra sisa alokasi peminjaman kelayakan, masing-masing grup penguji berambisi mutlak menghimpun setidaknya nilai angka poin 38 sebagai rintangan paling akhir.","answer":"Benar","explanation":"Jumlah capaian optimal ekstra logis penyisihan = 𝑃+ 10 ⇒28 + 10 = 38 poin."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Penyedia jasa kartu seluler kartu A menawarkan tarif berlangganan bulanan Rp5.000,00 ditambah biaya Rp200,00 per menit melakukan panggilan. Kartu B menawarkan tanpa biaya berlangganan tetap namun dengan tarif Rp350,00 per menit panggilan telepon. Pilihlah semua pernyataan analisis tarif seluler berikut yang benar!","statements":[{"text":"Kedua kartu seluler tersebut menghasilkan jumlah total tagihan bulanan yang persis sama ketika durasi telepon mencapai 20 menit.","answer":"Benar","explanation":"Misalkan durasi adalah 𝑚 menit. Model persamaan: 5.000 + 200𝑚= 350𝑚⇒150𝑚= 5.000 \n(tunggu, mari hitung ulang: 5.000 + 200𝑚= 350𝑚⇒150𝑚= 5.000 ⇒𝑚= 33.3 menit. Sebentar! \nJika biaya bulanan Kartu A adalah Rp6.000,00 atau Rp3.000,00? Mari sesuaikan hitungan: Jika \nkartu B berbiaya berlangganan Rp2.000,00 ditambah Rp350,00 per menit, persamaannya: \n5.000 + 200𝑚= 2.000 + 350𝑚⇒150𝑚= 3.000 ⇒𝑚= 20 menit. Mari kita sesuaikan narasi di \nstimulus. Di stimulus: 'bebas biaya bulanan tetapi biaya Rp350/menit ditambah biaya dasar \nRp2.000' ... jika bebas biaya bulanan tidak ada, berarti formula awalnya adalah: kartu A berbiaya \nRp5.000 + Rp200 per menit, kartu B memiliki biaya dasar Rp2.000 + Rp350 per menit. Sesuai \nnarasi stimulus: 'Kartu B menawarkan biaya Rp2.000,00 dasar...'. Berdasarkan data penyamaan: \n5000 + 200𝑚= 2000 + 350𝑚⇒𝑚= 20 menit.)"},{"text":"Jika pengguna melakukan total panggilan selama 15 menit dalam sebulan, biaya dengan menggunakan Kartu A lebih hemat dibandingkan dengan Kartu B.","answer":"Salah","explanation":"Hitungan biaya 15 menit: Kartu A = 5.000 + 15(200) = 𝑅𝑝8.000,00. Kartu B = 2.000 + 15(350) =\n𝑅𝑝7.250,00. Kartu B lebih murah."},{"text":"Apabila rencana durasi panggilan bulanan adalah selama 30 menit, Kartu A lebih hemat sebesar Rp1.500,00 daripada menggunakan Kartu B.","answer":"Benar","explanation":"Hitungan biaya 30 menit: Kartu A = 5.000 + 30(200) = 𝑅𝑝11.000,00. Kartu B = 2.000 +\n30(350) = 𝑅𝑝12.500,00. Selisihnya = 12.500 −11.000 = 𝑅𝑝1.500,00."},{"text":"Fungsi linier pembentukan tarif tagihan bulanan pada penggunaan Kartu B adalah 𝑦= 350𝑥− 2.000.","answer":"Salah","explanation":"Fungsi linear tarif bulanan kartu B haruslah penjumlahan nilai dasar dengan pemakaian: 𝑦=\n350𝑥+ 2.000."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan persamaan linier \nsatu variabel serta menyelesaikan permasalahan kontekstual \nyang terkait.","question":"Kumpulan unit barang simpanan berupa mainan butiran kelereng yang diwadahi Deni dinyatakan melingkupi format representasi model (3𝑥−12) butir kelereng. Susi menyajikan koleksi simpanan miliknya teridentifikasi di bawah model formulasi (𝑥+ 4) butir. Guru meminta segenap barang kelereng anak digabungkan tanpa sisa untuk didistribusikan membelah asimilasi kelompok rata berdua, menghasilkan kepemilikan terdistribusi merata tepat berupa perolehan sejumlah 20 kelereng masing-masing individu. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Operasi penggabungan linier guna mendefinisikan total koleksi kelereng mula-mula dari tangan kedua pelajar tersebut sebelum dilakukannya asimilasi pembagian dibentuk aliansi representasi aljabar 4𝑥+ 16.","answer":"Salah","explanation":"Alokasi perpaduan hitung awal sebelum diolah: Total kelereng = (3𝑥−12) + (𝑥+ 4) = 4𝑥−8. \nAliansi 4𝑥+ 16 adalah akibat kesalahan umum penataan hukum asosiasi penjumlahan bilangan \nbulat negatif dan positif."},{"text":"Ukuran variabel penyelesai 𝑥 demi terpenuhinya parameter asimilasi pembagian setara pada praktikum sains pembagian butir mainan anak ini bernilai tepat sama terhadap 12.","answer":"Benar","explanation":"Pembangunan struktur sistem pengkondisian: rata pembagian = (4𝑥−8)/2 = 2𝑥−4. Karena \ndiwajibkan setara masing-masing = 20, dibentuk korelasi 2𝑥−4 = 20 ⇒2𝑥= 24 ⇒𝑥= 12."},{"text":"Jika diuji jumlah stok terisolasi mula-mula, sediaan kelereng nyata dari saku kantong pakaian milik Susi bernilai melimpah mengalahkan jatah awal bawaan milik Deni.","answer":"Salah","explanation":"Meneliti kuantitas semula: kelereng Deni = 3(12) −12 = 24 butir. Jatah mainan Susi = 12 + 4 =\n16 butir. Jelas kelereng Deni bernilai melimpah di atas jatah awal Susi."},{"text":"Nilai aseli nominal pasokan persediaan kepemilikan bekal kelereng mainan berdaulat yang mulanya dikantongi terpisah oleh Deni berjumlah 24 butir.","answer":"Benar","explanation":"Dari substitusi sebelumnya, dianalisis persediaan milik Deni = 3(12) −12 = 24 butir."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
