<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif PTLSV</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT PERTIDAKSAMAAN LINEAR SATU VARIABEL</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Ibu membeli jeruk seberat 𝑥 kg di pasar tradisional. Jika berat jeruk yang dibeli Ibu kurang dari 5 kg, bentuk pertidaksamaan linear satu variabel yang tepat untuk situasi tersebut adalah ....","options":[{"key":"A","text":"𝑥< 5"},{"key":"B","text":"𝑥≤5"},{"key":"C","text":"𝑥> 5"},{"key":"D","text":"𝑥≥5"}],"answer":"A","explanation":"Berdasarkan informasi pada soal, berat jeruk dinyatakan dengan variabel 𝑥. \nKata kunci 'kurang dari' disimbolkan dengan tanda kurang dari (<). \nOleh karena itu, bentuk pertidaksamaan yang tepat adalah 𝑥< 5. \nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Batas nilai 𝑥 yang memenuhi pertidaksamaan 2𝑥+ 3 < 11 adalah ....","options":[{"key":"A","text":"𝑥> 7"},{"key":"B","text":"𝑥< 7"},{"key":"C","text":"𝑥> 4"},{"key":"D","text":"𝑥< 4"}],"answer":"D","explanation":"Kurangi kedua ruas dengan 3: 2𝑥< 11 −3 ⟹ 2𝑥< 8. \nBagi kedua ruas dengan 2: 𝑥<\n8\n2 ⟹ 𝑥< 4. \nJawaban Benar: D"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Seorang siswa di sebuah SMP di Jakarta dinyatakan lulus ujian jika memperoleh nilai matematika minimal 75. Jika nilai matematika siswa tersebut dinyatakan dengan 𝑛, bentuk pertidaksamaan yang tepat adalah ....","options":[{"key":"A","text":"𝑛< 70"},{"key":"B","text":"𝑛≤75"},{"key":"C","text":"𝑛> 80"},{"key":"D","text":"𝑛≥75"}],"answer":"D","explanation":"Syarat lulus ujian matematika adalah nilai minimal atau paling sedikit 75. \nKata 'minimal' berarti nilai harus 75 atau lebih besar dari 75, sehingga menggunakan tanda lebih \ndari atau sama dengan (≥). \nBentuk pertidaksamaannya adalah 𝑛≥75. \nJawaban Benar: D"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Seorang petani kelapa sawit di Riau menyewa truk dengan kapasitas angkut maksimal 4 ton (4.000 kg). Sopir dan kernet truk memiliki berat total 150 kg. Jika petani tersebut ingin mengangkut sejumlah keranjang kelapa sawit yang masing-masing beratnya 50 kg, berapa banyak keranjang maksimum yang dapat diangkut?","options":[{"key":"A","text":"75 keranjang"},{"key":"B","text":"77 keranjang"},{"key":"C","text":"80 keranjang"},{"key":"D","text":"85 keranjang"}],"answer":"B","explanation":"Langkah 1: Menentukan model pertidaksamaan. Misalkan 𝑥 adalah banyak keranjang sawit. Total \nberat keranjang sawit ditambah berat sopir dan kernet tidak boleh melebihi 4.000 kg, sehingga \n50𝑥+ 150 ≤4.000. \nLangkah 2: Menyelesaikan pertidaksamaan tersebut: 50𝑥≤3.850 ⟹ 𝑥≤77. Jadi, banyak \nkeranjang maksimum yang dapat diangkut adalah 77 keranjang. \nJawaban Benar: B"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Sebuah kartu ucapan berbentuk persegi panjang memiliki ukuran panjang (2𝑥+ 5) cm dan lebar 6 cm. Jika luas kartu ucapan tersebut tidak kurang dari 90 cm 2, nilai minimal untuk variabel 𝑥 adalah ....","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"6"},{"key":"D","text":"7"}],"answer":"B","explanation":"Langkah 1: Membuat model pertidaksamaan berdasarkan luas persegi panjang. \nLuas = 𝑝𝑎𝑛𝑗𝑎𝑛𝑔× 𝑙𝑒𝑏𝑎𝑟≥90. \n6(2𝑥+ 5) ≥90. \nLangkah 2: Menyelesaikan pertidaksamaan aljabar tersebut. \n12𝑥+ 30 ≥90 \n12𝑥≥60 \n𝑥≥5. \nJadi, nilai minimal untuk 𝑥 adalah 5. \nJawaban Benar: B"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Sebuah tangki air di perkebunan teh di Ciwidey memiliki kapasitas maksimum 1.200 liter. Saat ini, tangki tersebut telah berisi 300 liter air. Pengelola menyalakan pompa air yang dapat mengalirkan air sebanyak 45 liter per menit ke dalam tangki tersebut. Durasi waktu maksimal (dalam menit) pompa tersebut boleh dinyalakan agar air dalam tangki tidak meluap adalah ….","options":[{"key":"A","text":"15 menit"},{"key":"B","text":"20 menit"},{"key":"C","text":"25 menit"},{"key":"D","text":"30 menit"}],"answer":"B","explanation":"Langkah 1: Membuat model pertidaksamaan dari masalah tersebut. Misalkan 𝑡 menyatakan \ndurasi waktu dalam menit. Volume air setelah 𝑡 menit adalah 45𝑡+ 300, dan tidak boleh melebihi \nkapasitas tangki 1.200 liter, sehingga diperoleh pertidaksamaan: 45𝑡+ 300 ≤1200. \nLangkah 2: Menyelesaikan pertidaksamaan untuk mencari nilai 𝑡 maksimal. Kurangi kedua ruas \ndengan 300 sehingga diperoleh 45𝑡≤900. Bagi kedua ruas dengan 45 sehingga diperoleh 𝑡≤\n20. Jadi, durasi waktu maksimal pompa dinyalakan adalah 20 menit. \nJawaban Benar: B"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Sebuah keluarga di Makassar ingin menyewa gedung pertemuan untuk acara syukuran. Biaya sewa gedung adalah Rp2.000.000,00 dan biaya konsumsi adalah Rp50.000,00 per tamu. Jika jumlah tamu yang diundang minimal 100 orang, pihak gedung memberikan potongan harga langsung sebesar Rp500.000,00 dari total biaya. Keluarga tersebut mengalokasikan anggaran maksimal Rp15.000.000,00 untuk sewa gedung dan konsumsi. Batasan jumlah tamu 𝑛 (dengan 𝑛≥100) yang dapat diundang agar tidak melebihi anggaran adalah ....","options":[{"key":"A","text":"100 ≤𝑛≤250"},{"key":"B","text":"100 ≤𝑛≤260"},{"key":"C","text":"100 ≤𝑛≤270"},{"key":"D","text":"100 ≤𝑛≤280"}],"answer":"C","explanation":"Langkah 1: Tentukan fungsi biaya total untuk jumlah tamu 𝑛≥100: 𝐵𝑖𝑎𝑦𝑎= 2.000.000 +\n50.000𝑛−500.000 = 1.500.000 + 50.000𝑛. \nLangkah 2: Modelkan pertidaksamaan anggaran: 1.500.000 + 50.000𝑛≤15.000.000. \nLangkah 3: Selesaikan pertidaksamaan tersebut: 50.000𝑛≤13.500.000 ⟹ 𝑛≤270. \nLangkah 4: Gabungkan dengan syarat awal 𝑛≥100, sehingga diperoleh batas jumlah tamu: \n100 ≤𝑛≤270. \nJawaban Benar: C"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Panitia penghijauan di Jakarta memiliki anggaran Rp3.500.000,00 untuk membeli bibit pohon mahoni dan pohon ketapang. Harga satu bibit mahoni adalah Rp40.000,00 dan harga satu bibit ketapang adalah Rp60.000,00. Panitia memutuskan untuk membeli bibit ketapang sebanyak 15 pohon lebih sedikit dari dua kali lipat jumlah bibit mahoni. Jika jumlah pohon mahoni yang dibeli adalah 𝑥 batang, jumlah maksimal pohon mahoni yang dapat dibeli agar anggaran tersebut tidak terlampaui adalah ....","options":[{"key":"A","text":"20 batang"},{"key":"B","text":"24 batang"},{"key":"C","text":"25 batang"},{"key":"D","text":"27 batang"}],"answer":"D","explanation":"Langkah 1: Menyatakan jumlah bibit ketapang dalam variabel 𝑥. Jumlah ketapang = 2𝑥−15. \nLangkah 2: Membuat model pertidaksamaan total biaya pembelian agar tidak melebihi anggaran \nRp3.500.000,00. \n40.000𝑥+ 60.000(2𝑥−15) ≤3.500.000. \nLangkah 3: Menyelesaikan pertidaksamaan tersebut. \n40.000𝑥+ 120.000𝑥−900.000 ≤3.500.000 ⟹ 160.000𝑥≤4.400.000 ⟹ 𝑥≤27,5. \nKarena jumlah pohon harus berupa bilangan bulat, maka jumlah maksimal pohon mahoni (𝑥) \nyang dapat dibeli adalah 27 batang. \nJawaban Benar: D"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Pemilik jasa cuci kendaraan di Semarang menargetkan omset bersih harian sekurang-kurangnya Rp1.200.000,00 setelah dikurangi biaya operasional tetap sebesar Rp200.000,00 per hari. Tarif cuci mobil adalah Rp50.000,00 per unit dan sepeda motor adalah Rp20.000,00 per unit. Jika pada suatu hari terdapat 15 mobil yang dicuci, jumlah sepeda motor minimal yang harus dicuci agar target omset bersih tercapai adalah ....","options":[{"key":"A","text":"33 unit"},{"key":"B","text":"35 unit"},{"key":"C","text":"38 unit"},{"key":"D","text":"40 unit"}],"answer":"A","explanation":"Langkah 1: Hitung total pendapatan dari hasil mencuci mobil pada hari tersebut: 15 × 50.000 =\n750.000 rupiah. \n\nLangkah 2: Susun pertidaksamaan omset bersih harian (total pendapatan dikurangi biaya \noperasional tetap) untuk 𝑦 unit sepeda motor agar sekurang-kurangnya Rp1.200.000,00: \n(750.000 + 20.000𝑦) −200.000 ≥1.200.000. \nLangkah 3: Sederhanakan pertidaksamaan tersebut: 550.000 + 20.000𝑦≥1.200.000 ⇒\n20.000𝑦≥650.000. \nLangkah 4: Selesaikan nilai 𝑦: 𝑦≥\n650.000\n20.000 ⇒𝑦≥32,5. Karena jumlah kendaraan harus bilangan \nbulat, maka minimal sepeda motor yang harus dicuci adalah 33 unit. \nJawaban Benar: A"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Ibu memprediksi bahwa usia Adik (𝑎, dalam tahun) saat ini berumur tidak kurang dari 5 tahun. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai bentuk dan kemungkinan penyelesaian dari pernyataan ini!","statements":[{"text":"Kondisi batas usia adik tersebut dapat dituliskan sebagai model pertidaksamaan 𝑎≥5.","answer":"Benar","explanation":"Kata kunci 'tidak kurang dari' menandakan nilai minimal yang diperbolehkan adalah nilai tersebut \natau angka yang lebih besar dari itu. Maka representasinya adalah 𝑎≥5."},{"text":"Model pertidaksamaan matematika yang benar mewakili rentang usia tersebut adalah 𝑎≤5.","answer":"Salah","explanation":"Notasi 𝑎≤5 digunakan apabila frasa di soal bercirikan 'tidak lebih dari'. Seharusnya frasa 'tidak \nkurang dari' bersimbol lebih besar atau sama dengan (≥)."},{"text":"Rentang nilai usia adik di masa kini bisa saja bernilai 6 tahun.","answer":"Benar","explanation":"Nilai 6 memenuhi pertidaksamaan 𝑎≥5 (karena 6 ≥5), maka umur 6 tahun merupakan salah \nsatu kebenaran solusi logika usia adik."},{"text":"Angka usia 5 tahun dimasukkan sebagai bagian solusi nilai tebakan usia adik.","answer":"Benar","explanation":"Oleh karena adanya tanda ketidaksamaan yang menggunakan garis bawah (lebih besar atau \nsama dengan/≥), maka batas bawah yaitu 5 tahun bernilai benar sebagai selesaian."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Suatu kalimat terbuka matematika tertulis menjelaskan suatu misteri bilangan yang disimbolkan variabel 𝑦 jika ditambahkan 12 mempunyai total skor bernilai tidak kurang dari 20. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Pola rumusan perwujudan sistem relasi pertidaksamaan linear matematika kalimat di atas tertuang dalam format tulisan 𝑦+ 12 ≥20.","answer":"Benar","explanation":"Frasa istilah kunci 'tidak kurang dari' diganti pemodelannya menjadi operator matematis dari \nbatas rentang tanda berupa simbol ≥."},{"text":"Besar komponen nilai asli yang berada di tingkatan terendah agar dipastikan tetap lolos memenuhi model matematika aljabar di atas yaitu angka 8.","answer":"Benar","explanation":"Langkah penguraian matematika disajikan lewat jalan pengurangan ruas linear 𝑦≥20 −12 \ndidapat 𝑦≥8. Di mana 8 menjadi ambang titik batas terkecil."},{"text":"Keluaran bagi kelompok himpunan nilai asalnya diurutkan dan ditulis secara bulat terhitung maju sejak kehadiran permulaan urutan bernilai bilangan 7.","answer":"Salah","explanation":"Mengingat selesainya hubungan adalah rentang bernilai minimum 8 (𝑦≥8), maka rincian isi \nanggotanya didasarkan dari titik pertama bilangan bulat bernilai 8."},{"text":"Arah pertukaran logika pada rumusan model ketetapan aturan yang ditulis lewat tanda notasi aljabar lain berupa 𝑦+ 12 ≤20 bersifat tepat sasaran.","answer":"Salah","explanation":"Notasi bentuk kurang dari sama dengan (≤) menyangkal petunjuk instruksi soal awal yang \nmenuntut keluaran kondisi tidak kurang (≥)."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Diberikan pertidaksamaan −3𝑦+ 4 ≥−8 untuk 𝑦 anggota bilangan real. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Mengubah −3𝑦≥−12 ke dalam bentuk paling sederhana menghasilkan 𝑦≤4.","answer":"Benar","explanation":"Membagi kedua ruas pertidaksamaan dengan bilangan negatif −3 berakibat pada arah tanda \npertidaksamaan yang harus dibalik dari ≥ menjadi ≤."},{"text":"Nilai 𝑦= 5 merupakan bagian dari solusi pertidaksamaan.","answer":"Salah","explanation":"Nilai 𝑦 harus lebih kecil atau sama dengan 4 (𝑦≤4), maka 𝑦= 5 tidak termasuk ke dalam solusi \ntersebut."},{"text":"Nilai 𝑦= 2 merupakan salah satu penyelesaian dari pertidaksamaan tersebut.","answer":"Benar","explanation":"Karena 2 ≤4, maka nilai 𝑦= 2 memenuhi pertidaksamaan dengan hasil perhitungan akhir yang \nkonsisten."},{"text":"Ketika kedua ruas dikurangi 4, pertidaksamaan menjadi −3𝑦≥−12.","answer":"Benar","explanation":"Mengurangi bilangan 4 dari ruas kiri −3𝑦+ 4 menyisakan −3𝑦. Di ruas kanan, −8 −4 bernilai \n−12 tanpa mengubah arah tanda."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Rani memesan beberapa porsi bakso melalui aplikasi online seharga Rp25.000,00 per porsi. Biaya pengiriman yang semula Rp15.000,00 mendapat potongan diskon voucher menjadi hanya Rp5.000,00. Jika total pembayaran Rani untuk pemesanan sebanyak 𝑝 porsi tidak melebihi saku tabungannya sebesar Rp130.000,00, tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Persamaan model matematis dari pengeluaran total pesanan Rani adalah 25.000𝑝+ 5.000 ≤ 130.000.","answer":"Benar","explanation":"Langkah 1: Merancang harga seluruh pesanan porsi plus biaya pengiriman net, yaitu 25.000𝑝+\n5.000. Langkah 2: Membatasi dengan ketidaksamaan logis modal belanja yang ada, sehingga \nditulis sebagai 25.000𝑝+ 5.000 ≤130.000. Maka, pernyataan ini BENAR."},{"text":"Solusi atau himpunan batasan yang logis untuk kuantitas porsi pemesanan bakso tersebut berada dalam wilayah solusi 𝑝≤5.","answer":"Benar","explanation":"Langkah 1: Melakukan eliminasi bilangan rasionil kedua ruas 25.000𝑝≤125.000. Langkah 2: \nMenyelesaikan operasi aljabar dengan pembagi tersisa mendapatkan relasi batas penyelesaian \n𝑝≤5. Maka, pernyataan ini BENAR."},{"text":"Banyaknya porsi bakso paling maksimal yang dapat Rani dapatkan dari sistem kurir ekspedisi tersebut adalah 5 mangkuk.","answer":"Benar","explanation":"Langkah 1: Memanfaatkan keluaran batasan penyelesaian nilai variabel independen di mana 𝑝≤\n5. Langkah 2: Menyatakan bagian supremum tertinggi dari himpunan angka bulat penjelas dari \nsisa mangkuk yang boleh terbeli, yaitu 5 mangkuk. Maka, pernyataan ini BENAR."},{"text":"Seumpama Rani mengeset pemesanan makanan 6 porsi mangkuk bakso, nilai kekurangan biaya kasnya adalah senilai Rp20.000,00.","answer":"Salah","explanation":"Langkah 1: Menghitung pembelanjaan untuk 𝑝= 6 yaitu (25.000 × 6) + 5.000 = 𝑅𝑝155.000,00. \nLangkah 2: Pengurangan dari nilai isi modal mula-mula: 155.000 −130.000 = 𝑅𝑝25.000,00. \nKurangnya biaya riil seharusnya Rp25.000,00, bukan Rp20.000,00, sehingga pernyataan ini \nSALAH."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Sebuah taplak meja hias didesain berbentuk persegi panjang yang direncanakan memiliki keliling bahan pengerjaan tidak lebih dari 70 cm. Setelah dilakukan pengukuran sketsa produk, ditentukan panjang bidang kerjanya adalah (3𝑥−1) cm dengan lebar bidang taplak sepanjang (𝑥+ 4) cm. Jika variabel 𝑥 menyatakan pengali aljabar, beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Konstruksi matematis yang paling akurat dari kasus pembuat sketsa di atas dinyatakan lewat 8𝑥+ 6 ≤70.","answer":"Benar","explanation":"Langkah 1: Susun formula standar hitung keliling bangun datar geometris: 𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔=\n2(𝑃𝑎𝑛𝑗𝑎𝑛𝑔+ 𝐿𝑒𝑏𝑎𝑟) = 2((3𝑥−1) + (𝑥+ 4)) = 2(4𝑥+ 3) = 8𝑥+ 6. Langkah 2: Hubungkan hasil \nkonversi rumus ini dengan kriteria keliling meja hias tidak melebihi batas rancang (70 cm), \nsehingga menjadi pertidaksamaan linier 8𝑥+ 6 ≤70. Pernyataan benar."},{"text":"Batas paling besar bagi variabel bilangan pembentuk nilai panjang dan lebar 𝑥 di masalah sketsa taplak adalah 8.","answer":"Benar","explanation":"Langkah 1: Urai pertidaksamaan dari rancangan: 8𝑥+ 6 ≤70 ⟹ 8𝑥≤64. Langkah 2: \nSelesaikan dengan prinsip kalkulasi kedua ruas, diperoleh solusi pertidaksamaan bernilai 𝑥≤8. \nArtinya batas paling besar 𝑥 yang memenuhi adalah 8. Pernyataan benar."},{"text":"Saat pembuat skema memasang bilangan 𝑥= 5, ukuran panjang sketsa bernilai 14 cm sedangkan ukuran lebarnya sebesar 9 cm.","answer":"Benar","explanation":"Langkah 1: Masukkan pengganti variabel berupa angka 5 ke sisi fungsi panjang: 𝑝𝑎𝑛𝑗𝑎𝑛𝑔=\n3(5) −1 = 14 cm. Langkah 2: Hitung nilai aljabar sisi lebar ketika dialiri data variabel angka yang \nsama: 𝑙𝑒𝑏𝑎𝑟= 5 + 4 = 9 cm. Keduanya selaras sehingga pernyataan benar."},{"text":"Saat dioperasikan di level tertinggi yaitu variabel 𝑥= 8, nilai total dari keliling taplak meja persis menyentuh 64 cm.","answer":"Salah","explanation":"Langkah 1: Lakukan penggantian input nilai ke aljabar variabel model keliling: 𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔= 8(8) +\n6. Langkah 2: Proses matematika dasarnya memberikan nilai setinggi 64 + 6 = 70 cm. Karena \nnilai akhir adalah 70 cm bukan 64 cm, maka isi argumen pernyataan tidak tepat."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Budi memiliki tabungan Rp1.500.000,00 dan ingin membeli sebuah komputer genggam baru yang harganya Rp4.500.000,00. Ia bekerja sampingan dengan upah sebesar Rp25.000,00 per jam. Budi ingin menentukan batasan jam kerja ℎ yang dibutuhkan agar total uang tabungannya cukup untuk membeli komputer tersebut. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Pertidaksamaan yang mewakili kondisi keuangan Budi adalah 25.000ℎ+ 1.500.000 ≥ 4.500.000.","answer":"Benar","explanation":"Langkah 1: Rumuskan total uang yang dikumpulkan Budi: Tabungan awal Rp1.500.000,00 \nditambah hasil kerja sampingan 25.000 × ℎ. Langkah 2: Syarat uang cukup berarti total uang \nharus sekurang-kurangnya (lebih besar dari atau sama dengan) harga komputer, yaitu ≥\n4.500.000, diperoleh 25.000ℎ+ 1.500.000 ≥4.500.000. Pernyataan benar."},{"text":"Budi harus bekerja paling sedikit 100 jam untuk dapat membeli laptop tersebut.","answer":"Salah","explanation":"Langkah 1: Selesaikan pertidaksamaan keuangan: 25.000ℎ≥4.500.000 −1.500.000 ⟹\n 25.000ℎ≥3.000.000. Langkah 2: Bagi kedua ruas dengan 25.000 untuk mencari ℎ, diperoleh ℎ≥\n120 jam. Batas minimumnya adalah 120 jam, bukan 100 jam. Pernyataan salah."},{"text":"Jika Budi bekerja selama 100 jam, tabungan totalnya baru mencapai Rp3.500.000,00.","answer":"Salah","explanation":"Langkah 1: Hitung uang dari kerja sampingan 100 jam: 100 × 25.000 = 𝑅𝑝2.500.000,00. Langkah \n2: Tambahkan tabungan awal: 2.500.000 + 1.500.000 = 𝑅𝑝4.000.000,00. Hasil sebenarnya \nRp4.000.000,00, sehingga pernyataan salah."},{"text":"Jika ia memutuskan bekerja selama 150 jam, ia memiliki kelebihan sisa uang Rp750.000,00 setelah membeli komputer tersebut.","answer":"Benar","explanation":"Langkah 1: Hitung total uang jika bekerja 150 jam: 150 × 25.000 + 1.500.000 = 3.750.000 +\n1.500.000 = 𝑅𝑝5.250.000,00. Langkah 2: Cari sisa setelah dikurangi harga komputer: 5.250.000 −\n4.500.000 = 𝑅𝑝750.000,00. Pernyataan benar."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Pak Rahmat mengaktifkan pompa penyalur tangki pengisian budidaya pembenihan ikan hias di Bogor. Secara rancang bangun mesin tersebut didesain menyalurkan air sumur stabil bervolume kotor 15 liter setiap menit, tetapi kendala sedimentasi kotoran menyebabkan penurunan bersih debit riil tersumbat sejumlah 𝑥 liter tiap menitnya. Tangki penampung memiliki daya muat total 600 liter membutuhkan isi cadangan minimal 360 liter agar sirkulasi filtrasi berjalan lancar dalam tepat waktu pompa bekerja konstan selama 30 menit pengisian. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Format formulasional permodelan satu variabel linier dalam menyeleksi kapasitas batas bawah tampungan pemeliharaan mesin adalah 450 −30𝑥≥360.","answer":"Benar","explanation":"Debit bersih mengalir dari sedimentasi mesin adalah (15 −𝑥) liter/menit. Beroperasi dalam 30 \nmenit mengalirkan volume sebesar 30(15 −𝑥) ≥360, menghasilkan formula 450 −30𝑥≥360."},{"text":"Defisit pengurangan kebocoran dari pipa filter internal tersebut batas amannya maksimum diperbolehkan mengalami penurunan debit sebesar 3 liter setiap menitnya.","answer":"Benar","explanation":"Dari penyelesaian aljabar linear diperoleh pertidaksamaan −30𝑥≥360 −450 ⟹ −30𝑥≥−90. \nMengingat arah dibalik memberi hasil maksimum aman sedimentasi 𝑥≤3 liter per menit."},{"text":"Dengan tingkat sumbatan berimbas nilai kerusakan sirkulasi dinilai sebesar 𝑥= 4 liter per menit, volume cadangan genangan total waduk setelah dinyalakan selama 30 menit persis tumpah berkuantitas 320 liter.","answer":"Salah","explanation":"Kapasitas alir yang didistribusikan ketika sumbatan bernilai 𝑥= 4 liter per menit dalam 30 menit \nkonstan pengerjaan meluangkan kapasitas bersih setinggi 30 × (15 −4) = 330 liter."},{"text":"Syarat terjaganya keandalan sirkulasi budidaya, kapasitas neto aliran bersih air masuk dari pemompa minimal dilarang jatuh di bawah debit bersih 12 liter per menit.","answer":"Benar","explanation":"Debit awal penuh didapatkan 15 liter/menit. Nilai maksimal batas degradasi kemacetan sumbatan \n𝑥 telah dihitung stabil sebesar 3 liter/menit, sehingga menyisakan batas bawah masukan konstan \n15 −3 = 12 liter/menit."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Koperasi sekolah \"Maju Bersama\" di Yogyakarta menyediakan layanan diskon kelompok khusus untuk buku catatan seharga Rp12.000,00 per buku. Khusus pengurus OSIS resmi, koperasi memotong langsung harga tagihan sebesar Rp15.000,00 pada total seluruh pembayaran setelah belanja paling sedikit 5 buah buku. Saat ini bendahara OSIS memiliki ketersediaan pagu dana anggaran paling sedikit senilai Rp105.000,00 dan dibatasi maksimum belanja tidak melewati nominal Rp165.000,00. Tentukan benar atau salah asersi di bawah terkait kapasitas volume pembelian buku catatan OSIS (𝑏)!","statements":[{"text":"Jika seluruh satuan nilai uang diubah disetarakan ke satuan ribuan rupiah, model matematika kelayakan kas menjadi pertidaksamaan 105 ≤12𝑏−15 ≤165.","answer":"Benar","explanation":"Langkah 1: Biaya pembelian tanpa potongan belanja sebesar 12.000𝑏 rupiah. Langkah 2: \nTerapkan pemotongan koperasi senilai Rp15.000,00 menjadi: 𝐶= 12.000𝑏−15.000. Langkah 3: \nRentang kepatuhan kas keuangan diwakili oleh: 105.000 ≤12.000𝑏−15.000 ≤165.000. Jika \nsemuanya dibagi 1.000 diperoleh pertidaksamaan proporsionalnya adalah benar."},{"text":"Jumlah batasan kapasitas buku minimal paling sedikit yang boleh diusulkan dibeli pengurus adalah sejumlah 8 buah buku tulis.","answer":"Salah","explanation":"Langkah 1: Gunakan pertidaksamaan penjelas kas 105 ≤12𝑏−15 ≤165 dan disederhanakan \ndengan penambahan angka 15: 120 ≤12𝑏≤180. Langkah 2: Lakukan eliminasi nilai diperoleh: \n10 ≤𝑏≤15. Langkah 3: Jumlah terkecil yang bisa didapat adalah sebesar 10 buku, sehingga \npenegasan batas minimal 8 buku adalah tidak tepat."},{"text":"Pembelian volume unit maksimum mutlak yang sanggup dilayani oleh bendahara koperasi adalah sebatas maksimal 15 buah buku.","answer":"Benar","explanation":"Langkah 1: Melalui perolehan selang pertidaksamaan di atas, kapasitas rentang nilai dari 𝑏 \ndibatasi di bagian ujung kanan oleh interval penutup yaitu 𝑏≤15. Langkah 2: Berarti pengadaan \nunit buku tidak dapat melebih 15 buku, sehingga kesimpulan ini valid/benar."},{"text":"Seandainya transaksi struk tertulis resmi adalah tepat sebesar Rp141.000,00, maka dipastikan pengadaan inventaris tersebut berhasil mengoleksi 13 buah buku catatan.","answer":"Benar","explanation":"Langkah 1: Jika didapat 𝑏= 13, mari hitung kebenaran nilai biaya sesungguhnya. Langkah 2: \nSelesaikan rumus biaya 𝐶(13) = 12.000(13) −15.000 = 156.000 −15.000 = 𝑅𝑝141.000,00. \nDiperoleh hasil nominal uangnya sama persis."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan, memodelkan dan menemukan pertidaksamaan \nlinier satu variabel serta menyelesaikan permasalahan \nkontekstual yang terkait.","question":"Gudang distribusi merancang ekspor muatan beras karung berlabel 'Bulir Emas' menuju stasiun pelabuhan transit menggunakan dua jenis kriteria dimensi berat koli pembungkus, berupa karung kemasan merah berbobot 8 kg per unit dan kemasan hijau dengan berat 5 kg per unit. Selisih operasional menyatakan bahwa total dari keseluruhan kemasan hijau dipasok tepat 12 unit lebih berlimpah dibanding isi kontainer kemasan merah (misalkan lambang 𝑚 menandakan karung kemasan merah). Agar meminimalkan degradasi ban mobil pengangkut sekali tempuh rute tanjakan, distributor mematok kapasitas angkut tidak melebihi atau harus kurang dari 1150 kg secara komparatif. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Analisis penyederhanaan formulasi hubungan batas atas tonase pengantaran yang sahih dari distribusi ini dinyatakan melalui pertidaksamaan matematis 13𝑚+ 12 < 1150.","answer":"Salah","explanation":"Massa bumbu beras hijau = 5(𝑚+ 12). Jumlah berat = 8𝑚+ 5𝑚+ 60 = 13𝑚+ 60 kg. Model \nmatematika paling tepat digambarkan pertidaksamaan 13𝑚+ 60 < 1150."},{"text":"Batasan fisis logis pengangkutan menetapkan bahwa kuantitas paling ekstrem dari tipe karung kemasan merah yang boleh diangkut serentak dibatasi maksimum sebesar 83 buah.","answer":"Benar","explanation":"Dari 13𝑚< 1090, didapatkan batas berupa 𝑚< 83.85. Batas angka bilangan cacah dari \npengangkutan tipe merah yang sesuai di sirkuit adalah bernilai paling tinggi sebesar 83 buah \nkarung."},{"text":"Apabila diskenariokan mengangkut koli merah pada status batas atas optimalnya, kuantitas kontainer karung kemasan hijau wajib menyertai tepat di kuota 95 unit.","answer":"Benar","explanation":"Diketahui perbandingan konstan selisih sedia adalah 12 buah lebih tinggi. Atas kepastian nilai \nbulat tertinggi 𝑚= 83 karung merah, porsi kemasan hijau terpola: 83 + 12 = 95 unit."},{"text":"Jumlah kapasitas bobot riil secara nyata saat pemindahan pada level kapasitas termaksimal aman berada di tingkat seberat 1139 kg, mematuhi prasyarat pikap.","answer":"Benar","explanation":"Pada saat pengoptimalan isi merah diisi 83 serta isi hijau didistribusikan 95, bobot pengiriman \ntotal = 8(83) + 5(95) = 664 + 475 = 1139 kg. Memenuhi kualifikasi < 1150 kg."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
