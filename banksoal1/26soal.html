<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Bangun Ruang Sisi Lengkung</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT BANGUN RUANG SISI LENGKUNG</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 36</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Andi membuat tempat pensil berbentuk tabung tanpa tutup dari bahan plastik dengan jari-jari alas 10 cm dan tinggi 20 cm. Jika nilai 𝜋= 3,14, luas bahan plastik minimal yang dibutuhkan Andi adalah ….","options":[{"key":"A","text":"628 cm²"},{"key":"B","text":"1256 cm²"},{"key":"C","text":"1413 cm²"},{"key":"D","text":"1570 cm²"}],"answer":"D","explanation":"Langkah 1: Identifikasi rumus luas permukaan tabung tanpa tutup, yaitu 𝐿= 𝜋𝑟2 + 2𝜋𝑟𝑡. Langkah 2: Substitusikan nilai 𝑟= 10 cm, 𝑡= 20 cm, dan 𝜋= 3,14. Langkah 3: Hitung luas alas: 𝜋𝑟2 = 3,14 × 102 = 314 cm². Langkah 4: Hitung luas selimut: 2𝜋𝑟𝑡= 2 × 3,14 × 10 × 20 = 1256 cm². Langkah 5: Jumlahkan luas alas dan selimut: 𝐿= 314 + 1256 = 1570 cm²."},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Sebuah bola mainan anak-anak memiliki panjang jari-jari 21 cm. Jika nilai 𝜋= 22/7 , volume udara di dalam bola mainan tersebut adalah ….","options":[{"key":"A","text":"5544 cm³"},{"key":"B","text":"19404 cm³"},{"key":"C","text":"29106 cm³"},{"key":"D","text":"38808 cm³"}],"answer":"D","explanation":"Langkah 1: Identifikasi rumus volume bola, yaitu 𝑉= 4 3 𝜋𝑟3. Langkah 2: Substitusikan nilai 𝑟= 21 cm dan 𝜋= 22/7 ke dalam rumus. Langkah 3: Hitung hasilnya: 𝑉= 4 3 × 22/7 × 21 × 21 × 21 = 4 × 22 × 21 × 21 = 88 × 441 = 38808 cm³."},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Sebuah stoples kue kering berbentuk tabung memiliki panjang jari-jari alas 14 𝑐𝑚 dan tinggi 20 𝑐𝑚. Berapakah luas permukaan stoples tersebut jika digunakan nilai 𝜋= 22/7 ?","options":[{"key":"A","text":"2992 𝑐𝑚2."},{"key":"B","text":"2376 𝑐𝑚2."},{"key":"C","text":"1760 𝑐𝑚2."},{"key":"D","text":"1232 𝑐𝑚2."}],"answer":"A","explanation":"Langkah 1: Menghitung luas permukaan tabung lengkap menggunakan rumus 𝐿= 2𝜋𝑟(𝑟+ 𝑡). Substitusi nilai yang diketahui: 𝐿= 2 × 22/7 × 14 𝑐𝑚× (14 𝑐𝑚+ 20 𝑐𝑚). Hitung hasilnya: 𝐿= 28 × 2 × 34 = 88 × 34 = 2992 𝑐𝑚2."},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Sebuah bola mainan anak-anak memiliki luas permukaan 616 cm². Volume bola mainan tersebut adalah .... (Gunakan 𝜋= 22/7 )","options":[{"key":"A","text":"154,67 cm³"},{"key":"B","text":"718,67 cm³"},{"key":"C","text":"1.078,00 cm³"},{"key":"D","text":"1.437,33 cm³"}],"answer":"D","explanation":"Langkah 1: Menentukan jari-jari (𝑟) bola dari luas permukaannya. Luas permukaan 𝐿= 4𝜋𝑟2 ⇒ 616 = 4 × 22/7 × 𝑟2 ⇒𝑟2 = 49 ⇒𝑟= 7 cm. Langkah 2: Menghitung volume (𝑉) bola. 𝑉= 4 3 𝜋𝑟3 = 4 3 × 22/7 × 73 = 4.312 3 ≈1.437,33 cm³."},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Sebuah kaleng susu berbentuk tabung tanpa tutup memiliki kapasitas volume 1.540 cm³ dan tinggi 10 cm. Luas permukaan minimal pelat seng yang digunakan untuk membuat kaleng susu tersebut adalah .... (Gunakan 𝜋= 22/7 )","options":[{"key":"A","text":"440 cm²"},{"key":"B","text":"594 cm²"},{"key":"C","text":"748 cm²"},{"key":"D","text":"902 cm²"}],"answer":"B","explanation":"Langkah 1: Menentukan jari-jari (𝑟) kaleng susu dari volumenya. Volume 𝑉= 𝜋𝑟2𝑡⇒1.540 = 22/7 × 𝑟2 × 10 ⇒𝑟2 = 49 ⇒𝑟= 7 cm. Langkah 2: Menghitung luas permukaan tabung tanpa tutup. 𝐿= 𝜋𝑟2 + 2𝜋𝑟𝑡= ( 22/7 × 72) + (2 × 22/7 × 7 × 10) = 154 + 440 = 594 cm²."},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Seorang penjual tumpeng mini membuat cetakan tumpeng berbentuk kerucut dengan keliling alas cetakan sebesar 44 cm dan tingginya 18 cm. Berapakah volume cetakan tumpeng mini tersebut? (Gunakan 𝜋= 22/7 )","options":[{"key":"A","text":"924 cm³"},{"key":"B","text":"2.772 cm³"},{"key":"C","text":"3.696 cm³"},{"key":"D","text":"11.088 cm³"}],"answer":"A","explanation":"Langkah 1: Menentukan jari-jari (𝑟) alas kerucut dari kelilingnya. Keliling 𝐾= 2𝜋𝑟⇒44 = 2 × 22/7 × 𝑟⇒44 = 44 7 𝑟⇒𝑟= 7 cm. Langkah 2: Menghitung volume (𝑉) kerucut. 𝑉= 1/3 𝜋𝑟2𝑡= 1/3 × 22/7 × 72 × 18 = 154 × 6 = 924 cm³."},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Sebuah tenda penampungan berbentuk gabungan tabung dan kerucut di bagian atasnya. Tinggi dinding tabung adalah 4 meter, diameter tenda 14 meter, dan tinggi total tenda dari tanah sampai puncak kerucut adalah 28 meter. Berapakah luas terpal minimal yang dibutuhkan untuk membuat seluruh permukaan luar tenda tersebut (tanpa alas tenda)? (Gunakan 𝜋= 22/7 )","options":[{"key":"A","text":"550 m"},{"key":"B","text":"704 m"},{"key":"C","text":"726 m"},{"key":"D","text":"880 m"}],"answer":"C","explanation":"Langkah 1: Tentukan dimensi tenda. Jari-jari 𝑟= 7 meter. Tinggi dinding tabung ℎ= 4 meter. Tinggi kerucut 𝑡= 28 −4 = 24 meter. Langkah 2: Hitung panjang garis pelukis kerucut (𝑠): 𝑠= √𝑟2 + 𝑡2 = √72 + 242 = √49 + 576 = √625 = 25 meter. Langkah 3: Hitung luas selimut tabung (bagian dinding luar): 𝐿口𝑠𝑒𝑙𝑖𝑚𝑢𝑡 𝑡𝑎𝑏𝑢𝑛𝑔= 2𝜋𝑟ℎ= 2 × 22/7 × 7 × 4 = 176 m 2. Langkah 4: Hitung luas selimut kerucut (bagian atap): 𝐿口𝑠𝑒𝑙𝑖𝑚𝑢𝑡 𝑘𝑒𝑟𝑢𝑐𝑢𝑡= 𝜋𝑟𝑠= 22/7 × 7 × 25 = 550 m 2. Langkah 5: Jumlahkan luas dinding dan atap tenda: 𝐿𝑡𝑜𝑡𝑎𝑙= 176 + 550 = 726 m 2."},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Ibu sedang merancang hiasan dari daun pisang untuk menutup seluruh permukaan samping (selimut) nasi tumpeng berbentuk kerucut. Nasi tumpeng tersebut memiliki keliling alas 88 cm dan tinggi 48 cm. Berapakah luas minimal daun pisang yang harus disiapkan oleh Ibu? (Gunakan 𝜋= 22/7 )","options":[{"key":"A","text":"2112 cm²"},{"key":"B","text":"2150 cm²"},{"key":"C","text":"2200 cm²"},{"key":"D","text":"2816 cm²"}],"answer":"C","explanation":"Langkah 1: Cari jari-jari alas tumpeng (𝑟) dari keliling alasnya: 2𝜋𝑟= 88 ⟹ 2 × 22/7 × 𝑟= 88 ⟹ 𝑟= 14 cm. Langkah 2: Hitung panjang garis pelukis (𝑠) tumpeng menggunakan teorema Pythagoras: 𝑠= √𝑟2 + ℎ2 = √142 + 482 = √196 + 2304 = 50 cm. Langkah 3: Hitung luas selimut kerucut: 𝐿𝑠= 𝜋𝑟𝑠= 22/7 × 14 × 50 = 2200 cm²."},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Bu Rini mendapat pesanan untuk menghias bagian samping (selimut) dan alas dari 10 buah toples berbentuk tabung dengan kain flanel hias. Setiap toples tersebut memiliki diameter alas 20 cm dan tinggi 20 cm, sedangkan bagian tutup toples tidak dilapisi kain. Jika harga kain flanel adalah Rp20.000,00 per meter persegi, berapakah total biaya minimal yang harus dikeluarkan Bu Rini untuk membeli kain flanel kebutuhan toples tersebut? (Gunakan 𝜋= 3,14)","options":[{"key":"A","text":"Rp25.120,00"},{"key":"B","text":"Rp31.400,00"},{"key":"C","text":"Rp37.680,00"},{"key":"D","text":"Rp62.800,00"}],"answer":"B","explanation":"Langkah 1: Hitung jari-jari dari alas toples berbentuk tabung, yaitu 𝑟= 20 2 = 10 cm. Langkah 2: Tentukan luas kain pelapis untuk satu buah toples (hanya selimut dan alas, tanpa tutup), yaitu 𝐿= 𝜋𝑟2 + 2𝜋𝑟𝑡= 3,14 × 102 + 2 × 3,14 × 10 × 20 = 314 + 1256 = 1570 cm 2. Langkah 3: Hitung total luas kain flanel untuk 10 buah toples dan konversikan ke satuan meter persegi, yaitu 𝐿𝑡𝑜𝑡𝑎𝑙= 1570 × 10 = 15.700 cm 2 = 1,57 m 2. Langkah 4: Hitung total biaya minimal untuk membeli kain flanel tersebut, yaitu 1,57 × 20.000 = 𝑅𝑝31.400,00."},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Kakak mencetak nasi tumpeng mini berbentuk kerucut menggunakan wadah kayu tradisional yang mempunyai radius dasar 7 cm dan kedalaman tinggi tegak 12 cm. Perhitungan menggunakan konstanta 𝜋= 22/7 . Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai cetakan tersebut!","statements":[{"text":"Luas tapak bundar terbawah cetakan kerucut nasi adalah tepat 154 cm 2.","answer":"Benar","explanation":"Luas lingkaran tapak dihitung lewat rumus 𝐿𝑎= 𝜋𝑟2 = 22/7 × 72 = 154 cm 2."},{"text":"Daya muat volume maksimum nasi kuning padat dari satu buah cetakan tersebut adalah 616 cm 3.","answer":"Benar","explanation":"Volume cetakan dihitung memakai 𝑉= 1/3 𝜋𝑟2𝑡= 1/3 × 154 × 12 = 616 cm 3."},{"text":"Hasil pembagian atau perbandingan luas alas dengan volume wadah cetakan tersebut adalah senilai 1: 4.","answer":"Benar","explanation":"Perbandingan tersebut bernilai 154 616 = 1 4 atau 1: 4."},{"text":"Garis lengkung bagian dasar tepi dari cetakan monumen mini memiliki keliling melingkar sebesar 88 cm.","answer":"Salah","explanation":"Keliling lingkaran dihitung dari 𝐾= 2𝜋𝑟= 2 × 22/7 × 7 = 44 cm."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Balon gas penghias perhelatan pesta dimatangkan berbentuk mirip sferis bulat padu mirip bangun bola yang ditiup berukuran diameter membujur diagonal terlebar sebesar 6 cm. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan dengan volume isian di balik dinding elastis sferis penahan angin di bawah tetapan hampiran desimal 𝜋= 3,14!","statements":[{"text":"Garis bentang terhitung jejari melintang penarik di as letak lintasan utama balon elastis memiliki panjang senilai 3 cm.","answer":"Benar","explanation":"Melalui pendataan garis sumbu terbentang diameter selebar 6 cm, separuh bentang diagonal merupakan jangkauan letak penopang jejari radius senilai sejauh: 6 ÷ 2 = 3 cm."},{"text":"Volumetris penampung penumpuk molekul gas penakar dalam bola sferis mainan pesta ini mencapai tingkat muat berkapasitas senilai 113,04 cm³.","answer":"Benar","explanation":"Mengacu penemu daya tampung isi sferis penuh sferikal secara rumusan murni cepat diperoleh lewat: 𝑉= 4 3 𝜋𝑟3 = 4 3 × 3,14 × 33 = 4 × 3,14 × 9 = 36 × 3,14 = 113,04 cm³."},{"text":"Piringan lempengan datar lurus potong sekat internal bidang membujur memilah paling luas pertengahan inti balon luasnya teruji sepadan 28,26 cm².","answer":"Benar","explanation":"Daya piring melingkar didorong dari bagian sekat memilah tengah lewat inti merupakan luasan silinder sirkular terlebar yang diperoleh senilai: 𝐿𝑏= 𝜋𝑟2 = 3,14 × 32 = 3,14 × 9 = 28,26 cm²."},{"text":"Seumpama kondisi pengempesan hebat melanda dinding miring sehingga daya isi tersisa terhenti berkurang jauh sisa serongga muatan hanya di patok 1 cm³, ukuran radius jari-jari pembungkus balon kaku bertahan murni konstan 3 cm.","answer":"Salah","explanation":"Kecenderungan isi menyusut drastis berdaya satu persen beriring sebanding menyurutkan daya tarik sumbu letak diameter pinggir karet pembungkus meliut sempit, sehingga panjang radius ikut mengkerut berubah turun menyertai muat gas bervolumetry menyusut drastis."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Untuk membuat tempat tabung simpan koin praktis yang rapi dari baja galvanis ringan, digunakan tabung tertutup yang memiliki jari-jari dasaran pembagi horizontal 10 𝑐𝑚 dan berdimensi tinggi langsung setegak 20 𝑐𝑚. Jika disepakati untuk nilai parameter rasio keliling lingkar 𝜋= 3,14, tentukan nilai kebenaran dari setiap pernyataan berikut!","statements":[{"text":"Ruang kapasitas penimbun celengan itu maksimal menampung zat cair atau isi bersih sejumlah tepat 6.280 𝑐𝑚3.","answer":"Benar","explanation":"Isi wadah dicari via rumus dasar volume tabung silinder: 𝑉= 𝜋𝑟2𝑡= 3,14 × (10 𝑐𝑚)2 × 20 𝑐𝑚= 3,14 × 100 × 20 = 6.280 𝑐𝑚3. Maka, pernyataan ini benar."},{"text":"Besi selimut luar bidang tegak seputar tempat silinder mempunyai total luas permukaan seng sisi selimut senilai 1.256 𝑐𝑚2.","answer":"Benar","explanation":"Sisi tegak selubung silinder dicari via kalkulasi langsung rumus: 𝐿= 2𝜋𝑟𝑡= 2 × 3,14 × 10 𝑐𝑚× 20 𝑐𝑚= 6,28 × 200 = 1.256 𝑐𝑚2. Maka, pernyataan ini benar."},{"text":"Tingkat sebaran keliling terluas di bibir bagian atas penutup melingkar memiliki keliling lingkar berdimensi panjang hanya sepanjang 10 𝑐𝑚.","answer":"Salah","explanation":"Keliling lubang silinder dihitung dengan 𝐾= 2𝜋𝑟= 2 × 3,14 × 10 𝑐𝑚= 62,8 𝑐𝑚. Pengurangan ekstrem sisa bernilai 10 sangat keliru. Maka, pernyataan ini salah."},{"text":"Diameter lingkaran bagian alas datar ataupun bidang logam pembagi atas silinder tersebut berukuran lebar horizontal 20 𝑐𝑚.","answer":"Benar","explanation":"Sumbu tengah ditiup ganda 𝑑= 2𝑟= 2 × 10 𝑐𝑚= 20 𝑐𝑚. Maka, pernyataan ini benar."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Wadah kerajinan vas patung mini untuk etalase dekoratif berwujud model paduan kerucut tegak terpangkas kokoh bersisi horizontal pejal dengan rentang garis tengah lingkaran dasarnya bervolume 9 dm ke batas as dengan jarak tegak vertikal dari tapak datar menembus ujung tertinggi adalah 12 dm. Konstanta matematika diaplikasikan rasional bernilai 𝜋= 3,14. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Paling tidak miring sekeliling lereng tepi luar pelindung badan kerucut dipastikan membentang serasi searah garis s sejauh 15 dm.","answer":"Benar","explanation":"Mencari diagonal tumpuan miring dinding kerucut dipasang lewat formulasi Pythagoras: 𝑠= √92 + 122 = √81 + 144 = 15 dm. Isian bertitik selaras."},{"text":"Daerah alas lantai datar berongga penampungan pot monumen mencengkeram luas area penampang selebar tepat 282,6 dm 2.","answer":"Salah","explanation":"Luas tapak kaki wadah lingkaran yang terbawah: 𝐿𝑎= 3,14 × 𝑟2 = 3,14 × 81 = 254,34 dm 2."},{"text":"Rentang wilayah lapisan miring penutup kulit sebaran luar adalah sebesar 423,9 dm 2.","answer":"Benar","explanation":"Membongkar luas permukaan juring penutup pelapis kerucut samping: 𝐿𝑠𝑒𝑙= 𝜋𝑟𝑠= 3,14 × 9 × 15 = 423,9 dm 2."},{"text":"Keseluruhan kandungan isi volume busa kayu hias pembangun konstruksi ruang kokoh patung mini berada di kisaran 1.017,36 dm 3.","answer":"Benar","explanation":"Melacak perhitungan tampungan volume padat total dari pajangan kerucut adalah: 𝑉= 1/3 𝜋𝑟2𝑡= 1/3 × 3,14 × 81 × 12 = 3,14 × 27 × 12 = 1.017,36 dm 3, pengerjaannya valid."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Wadah kerajinan berbentuk padat kompak (pejal) dibelah menunjuk model ornamen setengah belahan bola penuh kayu jati pejal lingkar jari-jari di garis penahan alas datar berukuran 10 cm. Rencana dekoratif mencantumkan rona warna biru mengkilap dikondisikan pada seluruh daerah lengkung lengkung di sisi penutup kubah teratasnya, kemudian pada bagian pinggir bawah lingkaran direkat dengan stiker berbanderol nilai harga Rp200,00 per cm² luasan bidang lapis datarnya. Beri tanda centang (✓) pada setiap pernyataan yang benar dibantu asupan pengurang sisa nilai 𝜋= 3,14!","statements":[{"text":"Hamparan sisi yang perlu dilapisi siraman rona rona miring paling lengkung melengkung setengah atap lingkar didapat membentang murni selebar 628 cm².","answer":"Benar","explanation":"Lengkung bola terbuat dari selimut bola di setengah penampang saja, formulasinya = 2𝜋𝑟2. Jari- jarinya berkisar 10 cm, jadi hasil permukaan lekukan luar adalah sebesar 2 × 3,14 × 102 = 628 cm²."},{"text":"Keperluan rincian belanja pemasangan kelengkapan lempeng penutup bidang beralaskan ornamen tersebut menunjuk biaya pengeluaran sepadu sebesar Rp62.800,00.","answer":"Benar","explanation":"Lantai pelengkap bermakna luas lingkar bidang dasarnya sebasar 𝜋𝑟2 = 3,14 × (10)2 = 314 cm². Biaya dari keseluruhan bahan terpakai penempel alas lingkar bawah setinggi 314 × 𝑅𝑝200,00 = 𝑅𝑝62.800,00."},{"text":"Keluaran seluruh parameter luasan yang dimiliki miniatur solid kancing keramik itu didasari pada penataan gabungan murni sepadat 628 cm².","answer":"Salah","explanation":"Menaksir benda pajangan bertutup bawah yang diakumulasi harus menyatukan semua luas lekukan dan porsi lingkaran bawah dasar paku: 2𝜋𝑟2 + 𝜋𝑟2 = 3𝜋𝑟2 = 3 × 3,14 × 102 = 942 cm²."},{"text":"Rasio proporsional antara bidang dataran melingkar dengan luasan selimut kelopak melengkung samping membidik komparasi skala ideal bertinggi 1 banding 3.","answer":"Salah","explanation":"Perbandingan porsi alas terhadap wilayah melengkung atap adalah didapatkan dengan mengkomparasi 𝜋𝑟2 terhadap 2𝜋𝑟2. Perolehan angkanya mengunci di perbandingan bilangan pas 1 berbanding 2, bukan perbandingan angka 1 banding 3."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Bahan sediaan seng dibentuk lembar silindris tipis guna merancang model tangki tabung limbah kimia berbentuk tabung tanpa penutup melingkar di atasnya. Ukuran radius bibir kaleng bawah diputuskan seluas 7 cm dan didesain mendaki setinggi 20 cm dengan acuan matematis nilai konversi diidentifikasikan 𝜋= 22/7 . Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Ukuran lebar alas lembaran plat yang dipesan mengindikasikan bahwa dasar bejana terbawah harus menutup bidang seluas 154 cm 2.","answer":"Benar","explanation":"Menakar tapak bidang terbawah dasar lingkaran pembentuk kaleng diperoleh lewat rumus standar: 𝐿𝑎= 22/7 × 7 × 7 = 154 cm 2."},{"text":"Garis potong permukaan sisi plat bagian tengah selongsong lurus penampung tangki butuh area pembatas terbentang sejauh 880 cm 2.","answer":"Benar","explanation":"Luas area bentangan keliling samping adalah selimut logam: 𝐿𝑠= 2𝜋𝑟𝑡= 2 × 22/7 × 7 × 20 = 880 cm 2."},{"text":"Bilamana perancangan tersebut dimaksimalkan dengan dipasang tutup penutup atas utuh penuh maka seluruh logam terserap minimum tercatat senilai 1.034 cm 2.","answer":"Salah","explanation":"Untuk satu unit silinder penuh yang dilengkapi kelonggaran beratap utuh: 𝐿𝑓𝑢𝑙𝑙= 𝐿𝑎+ 𝐿𝑎+ 𝐿𝑠= 154 + 154 + 880 = 1.188 cm 2. Sehingga datanya keliru."},{"text":"Jumlah ketersediaan aluminium utama yang dialokasikan per buah wadah tabung terbuka diestimasi bernilai pas minimum yakni 1.034 cm 2.","answer":"Benar","explanation":"Logam material terintegrasi tabung terbuka adalah jajaran total gabungan 1 buah lingkaran bawah ditambah dinding menyilang samping, yaitu 154 + 880 = 1.034 cm 2. Berposisi sahih."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Seorang arsitek mendesain pilar tiang kayu silinder padat berbentuk tabung dengan diameter 20 cm dan tinggi 2 m. Agar lebih estetis, pilar tersebut diukir dengan cara melubangi kedua ujung alas datarnya dalam bentuk setengah bola yang menjorok ke dalam dengan diameter lubang sama persis dengan diameter tiang. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Ukiran lubang dekoratif di kedua ujung alas tiang silinder mengurangi total luas permukaannya sebanyak 200𝜋 cm².","answer":"Salah","explanation":"Luas pilar mula-mula (selimut + dua lingkaran alas) = 2𝜋⋅𝑟⋅𝐻+ 2𝜋⋅𝑟2 = 2𝜋(10)(200) + 2𝜋(102) = 4000𝜋+ 200𝜋= 4200𝜋 cm². Saat dilubangi berbentuk setengah bola di atas dan bawah, penutup datar hilang namun bertambah luas berupa kubah rongga bagian dalam pilar yang melengkung sebesar 2 ⋅2𝜋𝑟2 = 4𝜋⋅𝑟2 = 400𝜋 cm². Luas permukaan pilar akhir = 4000𝜋+ 400𝜋= 4400𝜋 cm². Sehingga ukiran justru meningkatkan total luas pilar sebanyak 200𝜋 cm², bukan menguranginya."},{"text":"Ukiran lubang dekoratif di kedua ujung tersebut malah meningkatkan luas permukaan luar- dalam dari tiang kayu sebanyak 200𝜋 cm².","answer":"Benar","explanation":"Melubangi bagian ujung dengan kedalaman kubah melengkung (setengah bola) mengganti bidang datar seluas 2𝜋𝑟2 menjadi bidang melengkung kubah sebesar 4𝜋𝑟2. Selisih pertambahannya adalah 400𝜋−200𝜋= 200𝜋 cm², sehingga luas permukaannya bertambah sebesar 200𝜋 cm²."},{"text":"Sisa volume kayu padat penyusun tiang pilar tersebut setelah selesai diukir adalah sebesar tepat 19000𝜋 cm³.","answer":"Salah","explanation":"Volume tabung awal = 𝜋⋅𝑟2 ⋅𝐻= 𝜋⋅102 ⋅200 = 20000𝜋 cm³. Lubang ukiran = 2 ⋅ (volume setengah bola dengan 𝑟= 10) = 1 ⋅ (volume bola utuh dengan 𝑟= 10) = 4 3 𝜋⋅103 = 4000 3 𝜋 cm³. Maka volume sisa pilar kayu adalah 20000𝜋− 4000 3 𝜋= 56000 3 𝜋≈18666.67𝜋 cm³, bukan 19000𝜋 cm³."},{"text":"Total seluruh luas permukaan pilar tiang kayu setelah selesai dilubangi ujung-ujungnya kini menjadi sebesar 4400𝜋 cm².","answer":"Benar","explanation":"Luas permukaan pilar yang baru terbentuk dari selimut silinder luar dan permukaan dalam rongga dua setengah bola = 2𝜋𝑟𝐻+ 4𝜋𝑟2 = 2𝜋(10)(200) + 4𝜋(102) = 4000𝜋+ 400𝜋= 4400𝜋 cm². Pernyataan ini benar."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Pihak teknisi fasilitas instalasi pabrik memetakan pembuatan satu tangki gas berbentuk tabung berkapasitas daya tampung tertutup rapat sebesar tepat 300𝜋 cm³. Ada dua bentuk model arsitektur alternatif baja dinding penyekat yang dirumuskan untuk dianalisis guna memilih struktur yang memerlukan plat permukaan yang paling ekonomis. Pola Desain I ditandai bertubuh tabung silinder tegak memanjang dengan ketinggian penampang tangki 12 cm. Adapun di sisi lain Desain II sengaja digambar model tangki pendek melebar berdiameter tabung setinggi penopang yang mungil hanya sepanjang 3 cm saja. Tentukan kebenaran dari perbandingan rancangan tangki silinder bertutup di bawah ini!","statements":[{"text":"Model tangki silinder tinggi langsing yang beralaskan opsi pola Desain I memiliki ukuran bentang jari-jari dasar tabung yang berukuran jauh lebih panjang dibanding jari-jari dari alternatif tabung Desain II.","answer":"Salah","explanation":"Untuk Desain I: 𝜋× 𝑟2 × 𝑡= 300𝜋 ⟹ 𝑟2 × 12 = 300 ⟹ 𝑟2 = 25 ⟹ 𝑟𝐼= 5 cm. Untuk Desain II: 𝜋× 𝑅2 × 3 = 300𝜋 ⟹ 𝑅2 × 3 = 300 ⟹ 𝑅2 = 100 ⟹ 𝑅𝐼𝐼= 10 cm. Sehingga diperoleh radius 𝑟𝐼< 𝑅𝐼𝐼, artinya Desain I bermulut lebih pendek lingkarannya."},{"text":"Jika diuji ketersediaannya, model pengerjaan fisik tertutup bervariasi mengikuti prinsip batasan spesifikasi Desain I mutlak menuntut pelat seng senilai area sekecil-kecilnya 170𝜋 cm².","answer":"Benar","explanation":"Luas seluruh permukaan penuh bejana silinder bertutup dengan 𝑟= 5 cm, 𝑡= 12 cm dihitung dengan rumus 𝐿𝐼= 2𝜋𝑟(𝑟+ 𝑡) = 2 × 𝜋× 5 × (5 + 12) = 170𝜋 cm²."},{"text":"Ada selisih luas area pasokan lembaran aluminium tegar minimum penyelimut wadah yang harus dicadangkan pengrajin tabung dari pemisahan porsi alternatif model di atas senilai tepat seluas 90𝜋 cm².","answer":"Benar","explanation":"Spesifikasi model tertutup wadah tabung dari model bervolume Desain II menggunakan 𝑅𝐼𝐼= 10 cm, 𝑡𝐼𝐼= 3 cm. Hasil bidang penampung utuh 𝐿𝐼𝐼= 2𝜋𝑅(𝑅+ 𝑡) = 2𝜋× 10 × (10 + 3) = 260𝜋 cm². Selisih minimal penyangga antara model adalah 260𝜋−170𝜋= 90𝜋 cm²."},{"text":"Pemilihan dengan penerapan tangki opsi konfigurasi tumpeng rupa konstruksi di spesifikasi alternatif Desain I menghasilkan peningkatan anggaran pembiayaan material luar seng dibanding tangki hemat Desain II.","answer":"Salah","explanation":"Karena kebutuhan total area besi kulit terluar 170𝜋 cm² lebih kecil nilainya dari wadah penampang bervolume identik di Desain II yang seluas 260𝜋 cm², rancangan bejana berpolakan tipe Desain I adalah rancangan konstruksi seng pelindung baja yang justru lebih ekonomis."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan luas permukaan dan volume bangun ruang sisi lengkung dan menyelesaikan masalah yang terkait.","question":"Sebuah wadah pelat plastik bening mika silindris pembungkus di laboratorium direncanakan sangat pas menyangga tempat kedudukan tiga butir buah bola tenis sirkular, sedemikian rupa sehingga semua bola itu disusun berhimpit tumpuk secara vertikal sekat membujur di dalam rongga silinder lurus tabung mika tersebut tanpa celah tersisa baik ke arah sisi mendatar melintang atau posisi tinggi batas atap tutup mika. Bola-bola tenis bulat itu masing-masing terbuat kencang dengan diameter sisi lintasan sepanjang 7 cm. Hal ini berakibat wadah penampung dirancang diameter 7 cm pula dan menjulang ke langit setinggi tepat tiga kali diameternya, bernilai 21 cm. Untuk kalkulasi murni, gunakan 𝜋= 22/7 . Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Rasio sela longgar celah lubang tak terisi benda padat tenis tempat berkumpulnya sirkulasi molekul gas (volume udara bebas) sisa pada keping kaleng tabung adalah sekadar kurang dari 100 𝑐𝑚3.","answer":"Salah","explanation":"Volume tabung silindris mika penampung = 22/7 × (3,5)2 × 21 = 808,5 𝑐𝑚3. Kandungan kelereng hias bola = 3 × ( 4 3 𝜋𝑅3) = 4𝜋𝑅3 = 4 × 22/7 × 3, 53 = 539 𝑐𝑚3. Nilai kosong adalah selisih = 808,5 − 539 = 269,5 𝑐𝑚3. Nilai tersebut terhitung lebih luas dari kriteria acuan 100."},{"text":"Pecahan fraksi relasi yang mengekspresikan luas tampung isi bola olahraga berongga murni terhadap persentase luas kapasitas seluruh bejana kaleng silinder adalah terhitung 1: 2.","answer":"Salah","explanation":"Fraksi efisiensi keterisian = 539 808,5 = 2 3, sebanding tepat kepada ratio bilangan pecahan pembulatan berbanding tepat 2: 3 (bukan bernilai seiras separuhnya)."},{"text":"Aparatus penahan mika mengurung keseluruhan bobot bodi jeroan bola karet sirkuler setotal kumulasi bodi padat volume sebesar 539 𝑐𝑚3.","answer":"Benar","explanation":"Total sumbangan materi olahraga dari gabungan unit adalah = 3 × 𝑉𝑏𝑜𝑙𝑎 𝑡𝑒𝑛𝑖𝑠= 3 × 4 3 𝜋𝑅3 = 4 × 22/7 × 3, 53 = 539 𝑐𝑚3. Benar secara komputasi."},{"text":"Kondisi rasio porsi sela terpasang tenis mantap bersanding dibanding sekat ruang longgar murni hampa sekat tersisanya menghasilkan pola perbandingan kuantitas bulat sempurna tepat 2: 1.","answer":"Benar","explanation":"Bidang penuh dari bodi padat tennis berukuran murni sebesar 539 𝑐𝑚3. Di lain hal volume longgar penangkap mika beralur adalah sebesar 269,5 𝑐𝑚3. Relasi keduanya bernilai berbanding bulat = 539: 269,5 = 2: 1."}]},{"number":19,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Dua buah kerucut mainan anak-anak sebangun memiliki perbandingan luas alas 4: 9. Berapakah perbandingan tinggi kerucut kecil terhadap tinggi kerucut besar?","options":[{"key":"A","text":"16 : 81."},{"key":"B","text":"8 : 27."},{"key":"C","text":"4 : 9."},{"key":"D","text":"2 : 3."}],"answer":"D","explanation":"Dua kerucut yang sebangun memiliki perbandingan luas (seperti luas alas) yang sebanding dengan kuadrat perbandingan dimensi tingginya (𝐴1: 𝐴2 = ℎ1 2: ℎ2 2). Maka perbandingan tinggi kedua kerucut tersebut adalah ℎ1: ℎ2 = √𝐴1: √𝐴2. Substitusikan perbandingan luas alas 4: 9, sehingga diperoleh perbandingan tingginya adalah √4: √9 = 2: 3."},{"number":20,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Kubah sebuah bangunan berbentuk setengah bola diperbesar dengan faktor skala 𝑘= 3. Jika luas permukaan kubah semula adalah 𝐿, berapakah luas permukaan kubah setelah diperbesar?","options":[{"key":"A","text":"3𝐿."},{"key":"B","text":"6𝐿."},{"key":"C","text":"9𝐿."},{"key":"D","text":"27𝐿."}],"answer":"C","explanation":"Luas permukaan kubah setengah bola sebanding dengan kuadrat dari faktor skala pembesaran, yaitu 𝐿′ = 𝑘2 × 𝐿. Substitusikan nilai 𝑘= 3 ke dalam rumus tersebut: 𝐿′ = 32 × 𝐿= 9𝐿."},{"number":21,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Sebuah produsen kue kering memperbesar ukuran stoples nastar berbentuk tabung secara proporsional dengan faktor skala 𝑘. Jika luas permukaan stoples setelah diperbesar menjadi 9 kali luas permukaan stoples semula, maka nilai faktor skala 𝑘 adalah ....","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4,5"},{"key":"D","text":"9"}],"answer":"B","explanation":"Langkah 1: Menggunakan hubungan skala luas permukaan 𝐿𝑏𝑎𝑟𝑢= 𝑘2 × 𝐿𝑙𝑎𝑚𝑎. Diketahui 𝐿𝑏𝑎𝑟𝑢= 9𝐿𝑙𝑎𝑚𝑎, sehingga 𝑘2 = 9 ⟹ 𝑘= √9 = 3."},{"number":22,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Sebuah topi caping petani berbentuk kerucut di Karawang memiliki luas permukaan 800 cm². Seorang pengrajin ingin membuat gantungan kunci berbentuk caping hiasan yang sebangun dengan memperkecil ukuran caping asli menggunakan faktor skala 𝑘= 1 4. Berapakah luas permukaan dari caping hiasan tersebut?","options":[{"key":"A","text":"50 cm²."},{"key":"B","text":"100 cm²."},{"key":"C","text":"200 cm²."},{"key":"D","text":"400 cm²."}],"answer":"A","explanation":"Langkah 1: Hubungan antara luas permukaan setelah perubahan skala ditentukan oleh 𝑘2 dengan 𝑘= 1 4. Langkah 2: Hitung luas permukaan caping hiasan baru (𝐴2). 𝐴2 = 𝑘2 × 𝐴1 = ( 1 4)2 × 800 = 1 16 × 800 = 50 cm². Jawaban Benar: A."},{"number":23,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Dua buah hiasan dinding berbentuk bola dari kayu jati di Jepara dibuat sebangun. Bola kayu pertama memiliki diameter 10 cm dan bola kayu kedua memiliki diameter 20 cm. Jika hiasan bola kayu pertama memerlukan biaya pengecatan sebesar Rp15.000,00, berapakah biaya pengecatan untuk bola kayu kedua dengan jenis cat yang sama?","options":[{"key":"A","text":"Rp60.000,00"},{"key":"B","text":"Rp45.000,00"},{"key":"C","text":"Rp30.000,00"},{"key":"D","text":"Rp15.000,00"}],"answer":"A","explanation":"Langkah 1: Tentukan faktor skala diameter (𝑘) dari kedua hiasan bola kayu tersebut. Diperoleh 𝑘= 20 10 = 2. Langkah 2: Karena biaya pengecatan bergantung pada luas permukaan bola, maka tentukan perbandingan luas kedua bola kayu dengan mengkuadratkan faktor skala diameter tersebut. Diperoleh perbandingan luas = 22 = 4. Langkah 3: Hitung biaya pengecatan bola kayu kedua. Biaya pengecatan = 4 × 𝑅𝑝15.000,00 = 𝑅𝑝60.000,00."},{"number":24,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Seorang pengrajin kayu di Jepara membuat dua buah gantungan kunci berbentuk bola kayu sebangun dengan perbandingan volume 1: 27. Jika permukaan bola yang lebih besar dicat seluruhnya dengan total biaya Rp27.000,00, berapakah perkiraan biaya pengecatan untuk bola yang lebih kecil?","options":[{"key":"A","text":"Rp1.000,00"},{"key":"B","text":"Rp3.000,00"},{"key":"C","text":"Rp6.000,00"},{"key":"D","text":"Rp9.000,00"}],"answer":"B","explanation":"Langkah 1: Menentukan faktor skala (𝑘) dari perbandingan volume. Perbandingan volume adalah 𝑘3 = 1 27, sehingga faktor skalanya adalah 𝑘= √ 1 27 3 = 1/3. Langkah 2: Menentukan perbandingan biaya berdasarkan perbandingan luas permukaan. Biaya sebanding dengan luas permukaan, yaitu 𝑘2 = ( 1/3)2 = 1 9. Maka, biaya pengecatan bola kecil adalah: 𝑅𝑝27.000,00 × 1 9 = 𝑅𝑝3.000,00."},{"number":25,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Sebuah katering membuat tumpeng nasi kuning berbentuk kerucut dengan volume awal 24 liter. Dikarenakan adanya penyesuaian anggaran, katering tersebut memutuskan untuk memperkecil ukuran tumpeng dengan mengurangi panjang jari-jari alas sebesar 25% dan mengurangi tingginya sebesar 40%. Selisih volume nasi kuning antara tumpeng sebelum diperkecil dan setelah diperkecil adalah ....","options":[{"key":"A","text":"8,1 liter"},{"key":"B","text":"14,4 liter"},{"key":"C","text":"15,9 liter"},{"key":"D","text":"16,2 liter"}],"answer":"C","explanation":"Langkah 1: Menentukan hubungan jari-jari dan tinggi baru terhadap ukuran semula. Diketahui jari-jari berkurang 25%, sehingga 𝑟2 = 0,75𝑟1 = 3 4 𝑟1. Tinggi berkurang 40%, sehingga 𝑡2 = 0,60𝑡1 = 3 5 𝑡1. Langkah 2: Menghitung volume tumpeng setelah diperkecil (𝑉2). Rumus volume kerucut adalah 𝑉= 1/3 𝜋𝑟2𝑡. Maka, 𝑉2 = 1/3 𝜋𝑟2 2𝑡2 = 1/3 𝜋( 3 4 𝑟1)2( 3 5 𝑡1) = 27 80 ( 1/3 𝜋𝑟1 2𝑡1) = 27 80 𝑉1. Langkah 3: Mensubstitusi nilai volume awal 𝑉1 = 24 liter ke dalam persamaan 𝑉2, sehingga didapatkan 𝑉2 = 27 80 × 24 = 8,1 liter. Langkah 4: Menghitung selisih (penghematan) volume nasi kuning: 𝛥𝑉= 𝑉1 −𝑉2 = 24 −8,1 = 15,9 liter. Jawaban Benar: C."},{"number":26,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Seorang perajin gerabah di Kasongan, Bantul, membuat dua jenis pot bunga berbentuk tabung tanpa tutup yang sebangun. Pot besar dirancang memiliki volume 8 kali lipat dari volume pot kecil. Jika pot besar membutuhkan tanah liat (luas permukaan wadah) sebesar 1.200 cm², berapakah luas tanah liat yang dibutuhkan untuk membuat pot kecil?","options":[{"key":"A","text":"300 cm²"},{"key":"B","text":"600 cm²"},{"key":"C","text":"1.200 cm²"},{"key":"D","text":"4.800 cm²"}],"answer":"A","explanation":"Langkah 1: Tentukan faktor skala panjang 𝑘 dari perbandingan volume: 𝑘= √8 3 = 2. Langkah 2: Hubungkan luas permukaan terhadap faktor skala: 𝐿𝑏𝑒𝑠𝑎𝑟= 𝑘2 × 𝐿𝑘𝑒𝑐𝑖𝑙= 4 × 𝐿𝑘𝑒𝑐𝑖𝑙. Langkah 3: Hitung luas tanah liat untuk pot kecil: 𝐿𝑘𝑒𝑐𝑖𝑙= 1.200 4 = 300 cm²."},{"number":27,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Sebuah bola dunia di sekolah Yogyakarta memiliki volume sebesar 8.000 cm³. Pihak sekolah ingin membeli bola dunia baru yang luas permukaannya 4 kali lipat dari luas permukaan bola dunia lama. Berapakah volume dari bola dunia baru tersebut?","options":[{"key":"A","text":"16.000 cm³."},{"key":"B","text":"32.000 cm³."},{"key":"C","text":"64.000 cm³."},{"key":"D","text":"128.000 cm³."}],"answer":"C","explanation":"Langkah 1: Temukan hubungan faktor skala panjang (𝑘) dari perbandingan luas permukaan. Diketahui perbandingan luas permukaan adalah 𝑘2 = 4, sehingga didapatkan faktor skala panjang 𝑘= √4 = 2. Langkah 2: Gunakan faktor skala panjang tersebut untuk mencari faktor skala volume yang bernilai 𝑘3 = 23 = 8. Langkah 3: Hitung volume bola dunia yang baru: 𝑉𝑏𝑎𝑟𝑢= 8 × 8.000 = 64.000 cm³."},{"number":28,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Seorang pengrajin gerabah membuat celengan berbentuk bola padat yang sempurna, lalu membuat replika mini yang diperkecil dengan faktor skala 𝑘= 1","statements":[{"text":"Tentukan benar atau salah untuk setiap pernyataan berikut! 1. Jari-jari bola replika menjadi 1 2 kali jari-jari bola semula.","answer":"Benar","explanation":"Setiap ukuran linier panjang dari bangun ruang sisi lengkung yang didilatasikan sebanding dengan faktor skala 𝑘. Maka jari-jari bola baru adalah 1 2 kali dari jari-jari semula."},{"text":"Luas permukaan bola replika menjadi 1 2 kali luas permukaan semula.","answer":"Salah","explanation":"Perubahan luas permukaan akibat penskalaan sebanding dengan 𝑘2. Dengan 𝑘= 1 2, luas permukaan bola replika harusnya menjadi ( 1 2)2 = 1 4 kali luas permukaan semula."},{"text":"Volume bola replika menjadi 1 8 kali volume semula.","answer":"Benar","explanation":"Perubahan volume akibat penskalaan sebanding dengan 𝑘3. Dengan faktor skala 𝑘= 1 2, volume bola replika menjadi ( 1 2)3 = 1 8 kali volume semula."},{"text":"Keliling lingkaran penampang terbesar bola replika menjadi 1 4 kali keliling penampang semula.","answer":"Salah","explanation":"Keliling lingkaran merupakan dimensi panjang satu dimensi (linier) sehingga perubahannya sebanding dengan faktor skala 𝑘= 1 2 kali semula, bukan 1 4 kali semula."}]},{"number":29,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Sebuah pabrik di Tangerang memproduksi bola plastik dengan berbagai ukuran. Bola plastik berukuran besar dibuat dengan memperbesar bola ukuran sedang secara proporsional menggunakan faktor skala 𝑘= 2. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Diameter bola plastik ukuran besar adalah 2 kali diameter bola ukuran sedang.","answer":"Benar","explanation":"Diameter adalah ukuran dimensi linear sehingga bertambah panjang proporsional langsung terhadap faktor skala 𝑘= 2."},{"text":"Luas kulit bola plastik ukuran besar adalah 2 kali luas kulit bola ukuran sedang.","answer":"Salah","explanation":"Luas permukaan bola adalah besaran dua dimensi yang berubah sesuai kuadrat faktor skala, yaitu 𝑘2 = 22 = 4 kali."},{"text":"Luas kulit bola plastik ukuran besar adalah 4 kali luas kulit bola ukuran sedang.","answer":"Benar","explanation":"Luas kulit bola berubah sebanding dengan kuadrat faktor skala, yaitu 𝑘2 = 22 = 4 kali semula."},{"text":"Volume bola plastik ukuran besar adalah 6 kali volume bola ukuran sedang.","answer":"Salah","explanation":"Volume berubah sebanding pangkat tiga dari faktor skala, yaitu 𝑘3 = 23 = 8 kali dari volume semula, bukan 6 kali."}]},{"number":30,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Katering menyiapkan variasi porsi makanan kerucut tumpeng mini untuk pemesanan anak-anak yang sebangun terhadap model standar keluarga. Jika perbandingan tinggi vertikal tumpeng anak dibanding tumpeng standar adalah 1: 2, tentukan benar atau salah pernyataan matematika berikut!","statements":[{"text":"Panjang keliling bawah dari kerucut makanan tumpeng kecil bernilai setengah kali keliling standar.","answer":"Benar","explanation":"Pada tumpeng sebangun, keliling lingkaran berskala linier mengikuti rasio tinggi (1: 2)."},{"text":"Alas permukaan tampung alas plastik pelapis makanan kecil memerlukan separuh ukuran luas standar.","answer":"Salah","explanation":"Sebagai luas bidang datar 2-D, perubahan penampangnya harus mengikuti skala kuadrat ( 1 2)2 = 1 4 luas standar."},{"text":"Isi kepadatan bahan baku tumpeng kecil membutuhkan beras dengan kapasitas volumetrik seperdelapan dari versi besar.","answer":"Benar","explanation":"Volume sebanding secara pangkat tiga dari rasio kesebangunan linier (𝑘3 = ( 1 2)3 = 1 8)."},{"text":"Luas seluruh selimut selongsong pisang pelindung luar versi besar setara empat kali luas kerucut tumpeng mini.","answer":"Benar","explanation":"Bidang kulit selimut luar diukur dalam unit persegi dan mengalami pembesaran berbanding kuadrat 22 = 4 kali."}]},{"number":31,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Seorang koki membuat cetakan nasi tumpeng tumpeng A berbentuk kerucut dengan diameter alas 20 cm dan tinggi 24 cm. Koki tersebut ingin membuat cetakan nasi tumpeng B yang sebangun dengan memperbesar diameter dan tingginya secara proporsional menggunakan faktor skala 1,5. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai ukuran cetakan tumpeng B dibandingkan cetakan tumpeng A!","statements":[{"text":"Jari-jari alas tumpeng B adalah 15 cm dan garis pelukisnya adalah 39 cm.","answer":"Benar","explanation":"Langkah 1: Menghitung jari-jari tumpeng A (𝑟1 = 10 cm) dan mencari jari-jari tumpeng B (𝑟2 = 1,5 × 10 = 15 cm), serta tinggi tumpeng B (𝑡2 = 1,5 × 24 = 36 cm). Langkah 2: Menggunakan rumus Pythagoras untuk menemukan garis pelukis B yaitu 𝑠2 = √152 + 362 = √225 + 1296 = 39 cm. Maka pernyataan ini benar."},{"text":"Luas selimut tumpeng B adalah 2,25 kali luas selimut tumpeng A.","answer":"Benar","explanation":"Langkah 1: Mengidentifikasi faktor skala luas akibat perubahan dimensi linier dengan skala 𝑘= 1,5 adalah 𝑘2. Langkah 2: Menghitung nilai skala perubahan luas permukaan yaitu 1, 52 = 2,25. Maka luas selimut tumpeng B memang menjadi 2,25 kali lipat dari semula, sehingga pernyataan benar."},{"text":"Volume tumpeng B menjadi 1,5 kali volume tumpeng A.","answer":"Salah","explanation":"Langkah 1: Mengidentifikasi pengaruh perubahan dimensi secara tiga dimensi (volume) yaitu sebanding dengan 𝑘3. Langkah 2: Menghitung 1, 53 = 3,375. Maka volume tumpeng B seharusnya menjadi 3,375 kali lipat dari volume tumpeng A, bukan 1,5 kali."},{"text":"Luas alas tumpeng B adalah 3 kali luas alas tumpeng A.","answer":"Salah","explanation":"Langkah 1: Mengidentifikasi bahwa luas alas tumpeng berbentuk lingkaran yang luasnya berubah secara proporsional terhadap kuadrat faktor skala (𝑘2). Langkah 2: Menghitung rasio luas alas yaitu 𝑘2 = 1, 52 = 2,25. Luas alas seharusnya menjadi 2,25 kali lipat, bukan 3 kali lipat."}]},{"number":32,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Kemasan es krim berbentuk kerucut memiliki diameter alas 14 cm dan tinggi 12 cm. Produsen merancang varian ukuran mini yang sebangun dengan memperkecil ukuran mula-mula dengan faktor skala 𝑘= 1","statements":[{"text":"Gunakan 𝜋= 22/7 dalam perhitungan Anda. Beri tanda centang (✓) pada setiap pernyataan yang benar! 1. Volume kemasan awal sebelum ukuran diperkecil adalah 616 cm 3.","answer":"Benar","explanation":"Diameter alas adalah 14 cm sehingga jari-jarinya adalah 7 cm. Volume kerucut awal adalah 𝑉= 1/3 𝜋𝑟2ℎ= 1/3 × 22/7 × 72 × 12 = 616 cm 3."},{"text":"Tinggi dari wadah kemasan baru yang berukuran mini adalah 6 cm.","answer":"Benar","explanation":"Tinggi awal kerucut adalah 12 cm. Karena diperkecil dengan faktor skala 𝑘= 1 2, tinggi baru kemasan mini adalah ℎ′ = 12 × 1 2 = 6 cm."},{"text":"Volume kemasan es krim varian baru yang berukuran mini adalah 308 cm 3.","answer":"Salah","explanation":"Volume varian baru seharusnya dihitung dari perbandingan kubik faktor skala, yaitu 𝑉𝑏𝑎𝑟𝑢= 𝑘3 × 𝑉𝑎𝑤𝑎𝑙= ( 1 2)3 × 616 = 1 8 × 616 = 77 cm 3."},{"text":"Rasio antara volume kemasan es krim baru dibandingkan kemasan es krim awal adalah 1: 8.","answer":"Benar","explanation":"Rasio volume setelah diperkecil terhadap volume sebelum diperkecil berdasar rumus perbandingan sebangun adalah 𝑘3 = ( 1 2)3 = 1 8, yang senilai dengan perbandingan 1: 8."}]},{"number":33,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Dua buah wadah silinder hias (tabung) memiliki bentuk sebangun. Wadah kecil memiliki jari-jari 5 cm dan tinggi 8 cm. Wadah besar dibuat dengan faktor skala perbesaran 𝑘= 4. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Volume wadah besar adalah 12.800𝜋 cm kubik.","answer":"Benar","explanation":"Step 1: Hitung volume tabung kecil yaitu 𝑉= 𝜋× 𝑟2 × 𝑡= 𝜋× 52 × 8 = 200𝜋 cm kubik. Step 2: Kalikan volume awal dengan faktor perubahan volume yaitu 𝑘3 = 43 = 64. Diperoleh volume besar 200𝜋× 64 = 12.800𝜋 cm kubik."},{"text":"Perbandingan luas alas wadah kecil terhadap wadah besar adalah 1: 16.","answer":"Benar","explanation":"Step 1: Identifikasi skala hubungan luas terhadap dimensi linier yaitu perbandingan luas alas sesuai dengan 𝑘2 dengan 𝑘= 4. Step 2: Perbandingan luas adalah 1: 𝑘2 = 1: 42 = 1: 16."},{"text":"Luas selimut wadah besar adalah 320𝜋 cm persegi.","answer":"Salah","explanation":"Step 1: Hitung luas selimut tabung kecil yaitu 2𝜋× 𝑟× 𝑡= 2𝜋× 5 × 8 = 80𝜋 cm persegi. Step 2: Gunakan perbandingan luas 𝑘2 = 16 untuk mendapatkan luas selimut wadah besar yaitu 80𝜋× 16 = 1.280𝜋 cm persegi (bukan 320𝜋 cm persegi, di mana 320𝜋 diperoleh jika hanya mengalikan skala 4 secara linier tanpa dipangkatkan)."},{"text":"Keliling alas wadah besar bertambah sebanyak 15𝜋 cm dari keliling alas semula.","answer":"Salah","explanation":"Step 1: Keliling alas lama = 2𝜋× 𝑟= 10𝜋 cm, dan keliling alas baru dengan skala 𝑘= 4 adalah 2𝜋× (5 × 4) = 40𝜋 cm. Step 2: Selisih (pertambahan) keliling alas adalah 40𝜋−10𝜋= 30𝜋 cm (bukan 15𝜋 cm)."}]},{"number":34,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Kedai makan penutup di Bali menyajikan krim gelato ke dalam cetakan berbentuk kerucut mini berbungkus waffle. Ukuran model corong standar dirancang berjari-jari alas 3 cm dan tingginya mencapai 10 cm. Khusus untuk dekorasi kompetisi, dapur menyajikan cetakan besar sebangun berselimut waffle lebar dengan rasio luasan selimut sembilan kali dibanding luas waffle versi biasa (𝑘2 = 9). Diasumsikan batas nilai gizi porsi es setara dengan kalori 4 kalori untuk tiap 1 cm 3 es yang tertampung penuh. Tentukan benar atau salah untuk setiap pernyataan menyangkut analisis corong tumpeng makanan penutup besar tersebut!","statements":[{"text":"Panjang ukuran dimensi tinggi tegak untuk tempat pembungkus kerucut besar yang dikembangkan tersebut adalah 20 cm.","answer":"Salah","explanation":"Rasio perluasan selimut berukuran 𝑘2 = 9 membuktikan skala faktor linier dari cetakan kerucut baru adalah 𝑘= 3. Berarti tinggi sesungguhnya yang dihasilkan dari perbesaran skala corong wadah adalah 3 × 10 = 30 cm, bukan 20 cm."},{"text":"Nilai kapasitas isi tampung ruang dari waffle es porsi raksasa untuk ajang perlombaan sebesar 270𝜋 cm 3.","answer":"Salah","explanation":"Sesuai hukum geometri dimensi ruang tiga, perbesaran volume mengikuti skala kubik 𝑘3. Kerucut standar bervolume 𝑉1 = 1/3 𝜋(3)2(10) = 30𝜋 cm 3. Volume kerucut besar 𝑉2 = 27 × 30𝜋= 810𝜋 cm 3. Opsi 270𝜋 adalah hasil perhitungan keliru dari perluasan kuadrat 𝑘2 × 𝑉1."},{"text":"Kapasitas isi ruang gelato maksimum untuk wadah saji kerucut yang diperbesar adalah senilai 810𝜋 cm 3.","answer":"Benar","explanation":"Volume kerucut pertama 𝑉1 = 1/3 𝜋× 𝑟2 × ℎ= 30𝜋 cm 3. Mengikuti aturan pengali berskala pangkat tiga 𝑘3 = (3)3 = 27, volume baru teoretis gelato yang terisi pada model adalah 27 × 30𝜋 cm 3 = 810𝜋 cm 3."},{"text":"Daya kalori total untuk seporsi hidangan kerucut es pelapis waffle jumbo dalam cetakan raksasa terisi bernilai tepat 3.240𝜋 kalori.","answer":"Benar","explanation":"Telah dihitung kapasitas maksimal penampungan gelato untuk porsi wadah jumbo adalah 810𝜋 cm 3. Diketahui kandungan per porsi volumetrik konstan sebesar 4 kalori per cm 3. Nilai nutrisinya bernilai 810𝜋× 4 = 3.240𝜋 kalori."}]},{"number":35,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Instalasi fisika udara di sleman mengembangkan prototipe alat ukur balon riset tebal kedap berwujud bola utuh berongga. Alat pertama berdimensi radius ukuran awal 2,1 𝑚𝑒𝑡𝑒𝑟. Para teknisi merevisi alat rancang sekunder berbentuk serupa sebangun dengan rasio pengecilan jari- jari senilai 0,7 kalinya dari rancangan balon yang pertama. Diketahui modal membeli isian bahan gas hidrogen sebesar Rp25.000,00 tiap meter kubik volume balonnya, serta material penguat kulit luarnya dinilai sebesar Rp80.000,00 untuk tiap satuan meter persegi selubung permukaannya. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Proporsi persentase luas penggunaan materi luar bahan pembalut Balon B dibanding bejana Balon A sebanding presisi berbanding 49: 100.","answer":"Benar","explanation":"Rasio kuadratik dimensi pada kesebangunan menuntut luas berelasi linier terhadap kuadrat dari rasionya. Jika faktor perbandingan 𝑘= 0,7, maka rasio perbandingan luas bidang Balon B terhadap Balon A adalah: 𝑘2 = (0,7)2 = 0,49 = 49/100."},{"text":"Keperluan tangki bejana gas helium hidrogen pada Balon B yang susut mengering bernilai pas kelipatannya sebesar 0,343 dari volume gas dasar pada model balon standar pertama.","answer":"Benar","explanation":"Kandungan kuantitas ruang balon berrelasi kubik terhadap dimensi rasionya. Kerucut model silinder B susut sepadat dimensi skala 𝑘= 0,7. Berarti rasio volumetrik: 𝑘3 = (0,7)3 = 0,343 kali kapasitas volum balon dasarnya."},{"text":"Lapisan luar permukaan bola hias bejana pembungkus teruji pada produk balon mini kedua Balon B berbentang total seluas 13,58 𝑚2 (Gunakan pendekatan 𝜋= 22/7 ).","answer":"Salah","explanation":"Radius Balon A: 𝑟1 = 2,1 𝑚. Luas bidang A: 4𝜋𝑟1 2 = 4 ⋅ 22/7 ⋅4,41 = 55,44 𝑚2. Balon B berluas 𝑘2 = 0,49 kali Balon A, sehingga: 𝐿𝐵𝑎𝑙𝑜𝑛 𝐵= 0,49 ⋅55,44 = 27,1656 𝑚2."},{"text":"Jika hidrogen penunjang disisikan menyelubung terpakai meluap penuh, ongkos belanja pengisi di tipe balon rancangan B tersebut berkuota modal separuhnya saja dari harga isi tangki dasar A yakni senilai Rp485.100,00.","answer":"Salah","explanation":"Isi Balon A: 𝑉1 = 4 3 𝜋𝑟1/3 = 4 3 ⋅ 22/7 ⋅(2,1)3 = 38,808 𝑚3. Ongkos isian balon A: 38,808 ⋅𝑅𝑝25.000,00 = 𝑅𝑝970.200,00. Maka ongkos bejana Balon B (0,343 kalinya): 0,343 ⋅𝑅𝑝970.200,00 = 𝑅𝑝332.778,60, bukan Rp485.100,00."}]},{"number":36,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan pengaruh perubahan skala bangun ruang sisi lengkung terhadap ukuran panjang, luas, dan/atau volume.","question":"Seorang pengrajin ingin mendesain lampion hias dengan merekayasa model aslinya yang berbentuk tabung. Lampion desain awal (Lampion A) memiliki ukuran jari-jari 4 cm dan tinggi 10 cm. Pengrajin tersebut kemudian membuat Lampion B dengan cara memperbesar jari-jarinya menjadi 3 kali lipat dari jari-jari Lampion A, sedangkan tingginya dikurangi sehingga hanya setengah dari tinggi Lampion A. Analisis seluruh ukuran dimensi baru dan nilai luas permukaan maupun volumenya untuk menilai kebenaran dari setiap pernyataan berikut!","statements":[{"text":"Perbandingan volume lampion B terhadap lampion A setelah dilakukan modifikasi dimensi adalah 3: 1.","answer":"Salah","explanation":"Langkah pertama menghitung dimensi lampion B, diperoleh jari-jari 𝑟2 = 12 cm dan tinggi 𝑡2 = 5 cm. Langkah kedua membandingkan volume dengan cara 𝑉2/𝑉1 = (𝑟2 2 × 𝑡2)/(𝑟1 2 × 𝑡1) = (144 × 5)/(16 × 10) = 720/160 = 9: 2 (atau 4.5: 1). Maka pernyataan perbandingan 3: 1 salah."},{"text":"Jika volume lampion A bernilai 160𝜋 cm³, maka volume dari lampion B yang telah dimodifikasi adalah 720𝜋 cm³.","answer":"Benar","explanation":"Melalui tiga langkah hitung: (1) Menghitung 𝑉1 = 𝜋× 𝑟1 2 × 𝑡1 = 𝜋× 16 × 10 = 160𝜋 cm³, (2) Mensubstitusi ukuran lampion B (𝑟2 = 12 cm dan 𝑡2 = 5 dm), (3) Menghitung 𝑉2 = 𝜋× 122 × 5 = 720𝜋 cm³. Hasilnya benar."},{"text":"Rasio perbandingan antara luas permukaan total (dengan kondisi tertutup) Lampion B terhadap Lampion A adalah tepat 51: 14.","answer":"Benar","explanation":"Langkah 1: Luas permukaan A adalah 2𝜋× 4 × (4 + 10) = 112𝜋 cm². Langkah 2: Luas permukaan B adalah 2𝜋× 12 × (12 + 5) = 408𝜋 cm². Langkah 3: Rasio pembagian 𝐿2/𝐿1 = 408𝜋/112𝜋= 51/14. Hubungan ini valid."},{"text":"Selisih luas selimut tabung pada Lampion B dengan Lampion A setelah perubahan tersebut dilakukan adalah 20𝜋 cm².","answer":"Salah","explanation":"Langkah 1: Hitung luas selimut A (𝐿𝑠1 = 2𝜋× 4 × 10 = 80𝜋 cm²). Langkah 2: Hitung luas selimut B (𝐿𝑠2 = 2𝜋× 12 × 5 = 120𝜋 cm²). Langkah 3: Selisihnya adalah 120𝜋−80𝜋= 40𝜋 cm². Pengecoh didasari oleh bias kesalahan perhitungan aritmetika parsial yang menghasilkan 20𝜋 cm²."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
