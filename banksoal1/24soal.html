<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Kesebangunan</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT KESEBANGUNAN</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 18</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 18</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 1 \n \nSaat kegiatan Pramuka di sekolah, seorang siswa mengukur bayangan benda. Sebuah tongkat \nsetinggi 160 cm memiliki bayangan sepanjang 120 cm. Jika panjang bayangan tiang bendera di \ndekatnya pada saat yang sama adalah 6 meter, berapakah tinggi tiang bendera tersebut \nsebenarnya?","options":[{"key":"A","text":"4,5 meter"},{"key":"B","text":"6,0 meter"},{"key":"C","text":"7,5 meter"},{"key":"D","text":"8,0 meter"}],"answer":"D","explanation":"Langkah 1: Gunakan perbandingan segitiga sebangun untuk tinggi dan bayangan: \n𝑇𝑖𝑛𝑔𝑔𝑖 𝑇𝑖𝑎𝑛𝑔\n𝑇𝑖𝑛𝑔𝑔𝑖 𝑇𝑜𝑛𝑔𝑘𝑎𝑡=\n𝐵𝑎𝑦𝑎𝑛𝑔𝑎𝑛 𝑇𝑖𝑎𝑛𝑔\n𝐵𝑎𝑦𝑎𝑛𝑔𝑎𝑛 𝑇𝑜𝑛𝑔𝑘𝑎𝑡. \nLangkah 2: Pastikan perbandingan satuan dalam meter atau sentimeter: \n𝑇𝑖𝑛𝑔𝑔𝑖 𝑇𝑜𝑛𝑔𝑘𝑎𝑡\n𝐵𝑎𝑦𝑎𝑛𝑔𝑎𝑛 𝑇𝑜𝑛𝑔𝑘𝑎𝑡=\n160 𝑐𝑚\n120 𝑐𝑚=\n4\n3. \nLangkah 3: Hitung tinggi tiang bendera dengan mengalikan panjang bayangan tiang bendera (6 \nmeter) dengan rasio tersebut: 𝑇𝑖𝑛𝑔𝑔𝑖 𝑇𝑖𝑎𝑛𝑔= 6 ×\n4\n3 = 8 𝑚𝑒𝑡𝑒𝑟. \nJawaban Benar: D"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 1 \n \nDua buah trapesium dinyatakan kongruen. Jika trapesium pertama memiliki sudut-sudut 70∘, \n110∘, 80∘, dan 100∘, maka salah satu besar sudut pada trapesium kedua yang kongruen dengan \ntrapesium tersebut adalah ....","options":[{"key":"A","text":"80∘"},{"key":"B","text":"90∘"},{"key":"C","text":"120∘"},{"key":"D","text":"150∘"}],"answer":"A","explanation":"Dua bangun yang kongruen memiliki sudut-sudut bersesuaian yang sama besar. \nSudut-sudut pada trapesium kedua harus sama persis dengan trapesium pertama, yaitu 70∘, \n110∘, 80∘, dan 100∘. \nDari pilihan yang tersedia, nilai yang sama adalah 80∘. \nJawaban Benar: A"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 1 \n \nJarak sebenarnya antara dua dermaga penyeberangan di Danau Toba adalah 12 km. Jika kedua \ndermaga tersebut digambar pada peta dengan jarak 4 cm, berapakah skala peta wisata tersebut?","options":[{"key":"A","text":"1: 3.000"},{"key":"B","text":"1: 30.000"},{"key":"C","text":"1: 150.000"},{"key":"D","text":"1: 300.000"}],"answer":"D","explanation":"Langkah 1: Ubah satuan jarak sebenarnya dari kilometer ke sentimeter: 12 𝑘𝑚= 1.200.000 𝑐𝑚. \nLangkah 2: Tentukan nilai perbandingan skala peta: 𝑆𝑘𝑎𝑙𝑎=\n𝐽𝑎𝑟𝑎𝑘 𝑝𝑎𝑑𝑎 𝑃𝑒𝑡𝑎\n𝐽𝑎𝑟𝑎𝑘 𝑆𝑒𝑏𝑒𝑛𝑎𝑟𝑛𝑦𝑎=\n4\n1.200.000. \nLangkah 3: Sederhanakan pecahan tersebut dengan membagi kedua nilai dengan 4: 𝑆𝑘𝑎𝑙𝑎=\n1\n300.000 atau 1: 300.000. \nJawaban Benar: D"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 2 \n \nBudi membuat maket sebuah taman bermain berbentuk persegi panjang dengan ukuran 10 cm × \n6 cm. Skala maket tersebut adalah 1: 150. Luas taman bermain sebenarnya adalah ....","options":[{"key":"A","text":"45 m²"},{"key":"B","text":"90 m²"},{"key":"C","text":"135 m²"},{"key":"D","text":"180 m²"}],"answer":"C","explanation":"Skala maket adalah 1: 150, artinya setiap 1 cm pada maket mewakili 150 cm pada kondisi \nsebenarnya. \nTentukan ukuran panjang sebenarnya: 10 × 150 = 1.500 cm = 15 meter. \nTentukan ukuran lebar sebenarnya: 6 × 150 = 900 cm = 9 meter. \nHitung luas sebenarnya: 15 × 9 = 135 m². \nJawaban Benar: C"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 2 \n \nSegitiga 𝐴𝐵𝐶 sebangun dengan segitiga 𝑃𝑄𝑅. Panjang sisi-sisi segitiga 𝐴𝐵𝐶 adalah 9 cm, 12 cm, \ndan 15 cm. Jika panjang sisi terpendek dari segitiga 𝑃𝑄𝑅 adalah 15 cm, berapakah panjang sisi \nterpanjang dari segitiga 𝑃𝑄𝑅?","options":[{"key":"A","text":"25 cm."},{"key":"B","text":"27 cm."},{"key":"C","text":"30 cm."},{"key":"D","text":"36 cm."}],"answer":"A","explanation":"Langkah 1: Cari faktor skala kesebangunan dengan membandingkan sisi terpendek kedua \nsegitiga tersebut. Sisi terpendek △𝐴𝐵𝐶 adalah 9 cm, sedangkan sisi terpendek △𝑃𝑄𝑅 adalah 15 \ncm. Faktor skala = \n15\n9 =\n5\n3. \nLangkah 2: Kalikan sisi terpanjang △𝐴𝐵𝐶 dengan faktor skala untuk mencari sisi terpanjang △\n𝑃𝑄𝑅. Sisi terpanjang △𝐴𝐵𝐶 adalah 15 cm. Sisi terpanjang △𝑃𝑄𝑅 = 15 ×\n5\n3 = 25 cm. \nJawaban Benar: A"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 2 \n \n\nSeorang anak dengan tinggi badan 120 cm berdiri di dekat tiang lampu jalan pada malam hari. \nPanjang bayangan anak tersebut oleh sinar lampu adalah 2 meter. Jika jarak mendatar dari posisi \nberdiri anak ke tiang lampu adalah 3 meter, tinggi tiang lampu jalan tersebut adalah ....","options":[{"key":"A","text":"3,0 meter"},{"key":"B","text":"3,6 meter"},{"key":"C","text":"4,0 meter"},{"key":"D","text":"4,5 meter"}],"answer":"A","explanation":"Tinggi anak adalah 120 cm = 1,2 meter. Jarak total dari tiang lampu ke ujung bayangan adalah \n2 + 3 = 5 meter. \nGunakan perbandingan kesebangunan pada segitiga sebangun yang terbentuk: \n𝑡𝑖𝑛𝑔𝑔𝑖 𝑡𝑖𝑎𝑛𝑔\n𝑡𝑖𝑛𝑔𝑔𝑖 𝑎𝑛𝑎𝑘=\n𝑗𝑎𝑟𝑎𝑘 𝑡𝑜𝑡𝑎𝑙\n𝑝𝑎𝑛𝑗𝑎𝑛𝑔 𝑏𝑎𝑦𝑎𝑛𝑔𝑎𝑛⇒\n𝑇\n1,2 =\n5\n2. \nSelesaikan persamaan untuk tinggi tiang (𝑇): 𝑇=\n5\n2 × 1,2 = 3,0 meter. \nJawaban Benar: A"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 3 \n \nPada peta tata ruang kota Bandung dengan skala 1: 25.000, terdapat sebuah kawasan hijau \nberbentuk trapesium dengan panjang sisi sejajar 4 cm dan 6 cm, serta jarak antara kedua sisi \nsejajar tersebut adalah 3 cm. Kawasan tersebut akan ditanami rumput dengan biaya perawatan \nbulanan sebesar Rp450.000,00 untuk setiap 1.500 m\n2. Berapakah total biaya perawatan \nbulanan yang harus dianggarkan untuk seluruh kawasan hijau tersebut pada keadaan \nsebenarnya?","options":[{"key":"A","text":"Rp11.250.000,00."},{"key":"B","text":"Rp28.125.000,00."},{"key":"C","text":"Rp112.500.000,00."},{"key":"D","text":"Rp281.250.000,00."}],"answer":"D","explanation":"Langkah 1: Hitung luas kawasan hijau pada peta. Luas peta = \n4+6\n2 × 3 = 15 cm\n2. \nLangkah 2: Konversi luas peta ke luas sebenarnya menggunakan kuadrat skala. Skala luas = \n1: 25.0002 = 1: 625.000.000. Luas sebenarnya = 15 × 625.000.000 = 9.375.000.000 cm\n2. \nKonversi ke m\n2 (dibagi 10.000): Luas sebenarnya = 937.500 m\n2. \nLangkah 3: Hitung total biaya perawatan bulanan. Total unit biaya = \n937.500\n1.500 = 625 unit. Total biaya \n= 625 × 𝑅𝑝450.000,00 = 𝑅𝑝281.250.000,00. \nJawaban Benar: D"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 3 \n \nSebuah maket gedung perkantoran dibuat dengan skala tertentu sehingga bentuknya sebangun \ndengan gedung sebenarnya. Diketahui luas alas gedung sebenarnya adalah 400 𝑚2, sedangkan \nluas alas pada maket adalah 100 𝑐𝑚2. Jika volume gedung sebenarnya adalah 2.400 𝑚3, volume \nmaket tersebut adalah ....","options":[{"key":"A","text":"150 𝑐𝑚3"},{"key":"B","text":"300 𝑐𝑚3"},{"key":"C","text":"600 𝑐𝑚3"},{"key":"D","text":"1.200 𝑐𝑚3"}],"answer":"B","explanation":"Langkah 1: Menyamakan satuan luas. Luas gedung sebenarnya = 400 𝑚2 = 400 × 10.000 𝑐𝑚2 =\n4.000.000 𝑐𝑚2. \nLangkah 2: Menentukan skala luas (𝑘2) dan skala linear (𝑘). 𝑘2 =\n𝐿𝑢𝑎𝑠 𝑚𝑎𝑘𝑒𝑡\n𝐿𝑢𝑎𝑠 𝑠𝑒𝑏𝑒𝑛𝑎𝑟𝑛𝑦𝑎=\n100\n4.000.000 =\n1\n40.000. \nMaka, skala linear 𝑘= √\n1\n40.000 =\n1\n200. \nLangkah 3: Menentukan skala volume (𝑘3). 𝑘3 = (\n1\n200)3 =\n1\n8.000.000. \nLangkah 4: Menghitung volume maket. Volume sebenarnya = 2.400 𝑚3 = 2.400 × 1.000.000 \n𝑐𝑚3 = 2.400.000.000 𝑐𝑚3. Maka, 𝑉𝑜𝑙𝑢𝑚𝑒 𝑚𝑎𝑘𝑒𝑡= 2.400.000.000 ×\n1\n8.000.000 = 300 𝑐𝑚3. \nJawaban Benar: B"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Level 3 \n \nDalam sebuah aula pertunjukan, langit-langit aula tersebut berbentuk trapesium 𝐴𝐵𝐶𝐷 dengan \nsisi sejajar 𝐴𝐵 dan 𝐶𝐷 di mana 𝐴𝐵∥𝐶𝐷. Diketahui panjang 𝐴𝐵= 5 meter dan 𝐶𝐷= 15 meter. \nKedua garis diagonal 𝐴𝐶 dan 𝐵𝐷 berpotongan di titik 𝑂, di mana pada titik tersebut dipasang \nsebuah lampu kristal gantung. Jika jarak tegak lurus dari sisi 𝐶𝐷 ke lampu gantung 𝑂 adalah 6 \nmeter, berapakah tinggi total aula tersebut (jarak tegak lurus dari 𝐴𝐵 ke 𝐶𝐷)?","options":[{"key":"A","text":"6,0 meter"},{"key":"B","text":"8,0 meter"},{"key":"C","text":"10,0 meter"},{"key":"D","text":"12,0 meter"}],"answer":"B","explanation":"Langkah 1: Mengidentifikasi segitiga yang sebangun. Pada trapesium 𝐴𝐵𝐶𝐷 dengan diagonal \nberpotongan di 𝑂, segitiga 𝐴𝑂𝐵 sebangun dengan segitiga 𝐶𝑂𝐷 karena sudut-sudutnya sama \nbesar (sudut berseberangan dalam). \nLangkah 2: Menggunakan perbandingan sisi kesebangunan untuk perbandingan tinggi masing-\nmasing segitiga tersebut dari titik 𝑂. Misalkan tinggi △𝐴𝑂𝐵 adalah ℎ1 dan tinggi △𝐶𝑂𝐷 adalah \nℎ2 = 6 meter. Perbandingannya adalah: \nℎ1\nℎ2 =\n𝐴𝐵\n𝐶𝐷. \nLangkah 3: Mensubstitusikan nilai yang diketahui ke persamaan perbandingan untuk mencari ℎ1: \nℎ1\n6 =\n5\n15 ⟹ \nℎ1\n6 =\n1\n3 ⟹ ℎ1 = 2 meter. \nLangkah 4: Menghitung tinggi total aula (𝐻) dengan menjumlahkan kedua tinggi segitiga: 𝐻=\nℎ1 + ℎ2 = 2 + 6 = 8 meter. \nJawaban Benar: B"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Sebuah pigura foto berbentuk persegi panjang memiliki ukuran panjang 12 cm dan lebar 8 cm. \nPemilik pigura ingin membandingkan pigura tersebut dengan beberapa bidang karton lain untuk \nmenentukan pasangan bangun yang sebangun secara langsung. Beri tanda centang (✓) pada \nsetiap pernyataan yang benar!","statements":[{"text":"Karton berukuran 6 cm × 4 cm sebangun dengan pigura foto tersebut.","answer":"Benar","explanation":"Rasio panjang banding lebar pigura asli adalah 12 ÷ 8 = 1,5, dan rasio karton baru adalah 6 ÷\n4 = 1,5. Karena rasionya sama dan sudutnya siku-siku, maka kedua bangun tersebut sebangun."},{"text":"Karton berukuran 24 cm × 16 cm sebangun dengan pigura foto tersebut.","answer":"Benar","explanation":"Rasio sisi-sisi karton baru adalah 24 ÷ 16 = 1,5, yang nilainya sama dengan rasio pigura asli \n(1,5). Maka keduanya sebangun."},{"text":"Karton berukuran 3 cm × 2 cm sebangun dengan pigura foto tersebut.","answer":"Benar","explanation":"Rasio sisi-sisi karton adalah 3 ÷ 2 = 1,5, yang nilainya sama dengan rasio pigura asli (1,5). Maka \nkeduanya sebangun."},{"text":"Karton berukuran 15 cm × 11 cm sebangun dengan pigura foto tersebut.","answer":"Salah","explanation":"Rasio sisi-sisi karton ini adalah 15 ÷ 11 ≈1,36, yang berbeda dengan rasio pigura asli sebesar \n1,5, sehingga kedua bangun tersebut tidak sebangun."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Diketahui segitiga PQR dan segitiga STU dengan hubungan ukuran sudut-sudutnya adalah besar \nsudut P = 60∘, sudut Q = 50∘, sudut S = 60∘, dan sudut T = 70∘. Tentukan benar atau salah untuk \nsetiap pernyataan berikut!","statements":[{"text":"Besar sudut R pada segitiga PQR adalah 70∘.","answer":"Benar","explanation":"Sebab jumlah total sudut dalam segitiga selalu 180∘. Besar sudut R adalah 180∘−(60∘+ 50∘) =\n70∘."},{"text":"Besar sudut U pada segitiga STU adalah 60∘.","answer":"Salah","explanation":"Besar sudut U pada segitiga STU adalah 180∘−(60∘+ 70∘) = 50∘."},{"text":"Kedua segitiga tersebut sebangun karena memiliki tiga pasang sudut yang sama besar.","answer":"Benar","explanation":"Syarat kesebangunan dipenuhi karena kedua segitiga memiliki sudut bersesuaian yang nilainya \npersis sama, yaitu 50∘, 60∘, dan 70∘."},{"text":"Kedua segitiga tersebut kongruen meskipun ukuran panjang sisinya berbeda.","answer":"Salah","explanation":"Meskipun memiliki sudut yang sama besar, syarat mutlak kongruen memerlukan ukuran panjang \nsisi yang harus sama pula."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Dua bangun berbentuk jajargenjang dinyatakan sebangun. Jajargenjang pertama 𝐴𝐵𝐶𝐷 memiliki \npanjang alas 10 cm dan tinggi 8 cm. Jajargenjang kedua 𝐸𝐹𝐺𝐻 memiliki tinggi 4 cm. Beri tanda \ncentang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Faktor skala penyusutan dari jajargenjang pertama ke kedua adalah 0,5.","answer":"Benar","explanation":"Rasio skala didasarkan pada perbandingan tinggi: \n4\n8 = 0,5."},{"text":"Panjang alas jajargenjang 𝐸𝐹𝐺𝐻 adalah 6 cm.","answer":"Salah","explanation":"Alas didapatkan melalui rasio pengalian, bukan mengurangkan secara linier: 10 × 0,5 = 5 𝑐𝑚."},{"text":"Perbandingan luas 𝐴𝐵𝐶𝐷 dengan luas 𝐸𝐹𝐺𝐻 adalah 2: 1.","answer":"Salah","explanation":"Perbandingan luas harus berupa kuadrat rasio linear: 22: 12 = 4: 1."},{"text":"Panjang alas jajargenjang 𝐸𝐹𝐺𝐻 adalah 5 cm.","answer":"Benar","explanation":"Alas 𝐸𝐹𝐺𝐻 adalah hasil kali alas jajargenjang pertama dengan faktor skala: 10 𝑐𝑚× 0,5 = 5 𝑐𝑚."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Pemilik taman memotong lahan miliknya yang berbentuk trapesium 𝐴𝐵𝐶𝐷 dengan sisi-sisi sejajar \n𝐴𝐵 sepanjang 12 m dan 𝐶𝐷 sepanjang 22 m. Tepat di bagian tengah lahan, dipasang garis lurus \npembatas jalan setapak 𝐸𝐹 yang sejajar dengan sisi 𝐴𝐵 dan memotong sisi miring lahan di titik 𝐸 \ndan 𝐹. Bagian tepi miring trapesium terbagi sedemikian rupa dengan perbandingan panjang \nsegmen sisi 𝐴𝐸: 𝐸𝐷= 2: 3. Tandailah setiap pernyataan yang bernilai benar!","statements":[{"text":"Panjang jalan setapak lurus pembatas 𝐸𝐹 yang terukur dari perhitungan kesebangunan adalah \n15 m.","answer":"Salah","explanation":"Menggunakan teorema kesebangunan trapesium: 𝐸𝐹=\n(𝐴𝐸⋅𝐶𝐷)+(𝐸𝐷⋅𝐴𝐵)\n𝐴𝐸+𝐸𝐷\n=\n(2⋅22)+(3⋅12)\n2+3\n=\n44+36\n5\n= 16 \nm."},{"text":"Berdasarkan prinsip pembagian sisi pada segitiga atau trapesium sebangun, perbandingan \nsegmen sisi miring sebelah kanan 𝐵𝐹: 𝐹𝐶 juga bernilai 2: 3.","answer":"Benar","explanation":"Menurut konsep garis-garis sejajar memotong transversal, perbandingan segmentasi pada kedua \nkaki trapesium akan selalu proporsional, yaitu 𝐴𝐸: 𝐸𝐷= 𝐵𝐹: 𝐹𝐶= 2: 3."},{"text":"Panjang aktual lintasan setapak 𝐸𝐹 tersebut adalah 16 m.","answer":"Benar","explanation":"Telah divalidasi dengan rumus penentuan garis bagi sejajar pada trapesium: 𝐸𝐹=\n44+36\n5\n= 16 m."},{"text":"Apabila perbandingan sisi dibalik sehingga titik penempatan 𝐸𝐹 menghasilkan 𝐴𝐸: 𝐸𝐷= 3: 2, \npanjang 𝐸𝐹 berubah menjadi 18 m.","answer":"Benar","explanation":"Jika rasio berubah menjadi 3: 2, 𝐸𝐹=\n(3⋅22)+(2⋅12)\n5\n=\n66+24\n5\n= 18 m."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Sebuah miniatur gedung perkantoran dibuat dengan perbandingan kesebangunan skala 1: 250. \nMiniatur gedung tersebut memiliki alas berbentuk persegi panjang dengan keliling 60 cm, di mana \npanjangnya 6 cm lebih dari lebarnya. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Lebar gedung sebenarnya adalah 30 meter.","answer":"Benar","explanation":"Misalkan lebar miniatur adalah 𝑥 cm, maka panjang miniatur = 𝑥+ 6 cm. Keliling = 2(𝑝+ 𝑙) →\n60 = 2(2𝑥+ 6) →30 = 2𝑥+ 6 →𝑥= 12 cm. Maka lebar gedung sebenarnya adalah 12 cm \n× 250 = 3.000 cm = 30 meter."},{"text":"Panjang gedung sebenarnya adalah 45 meter.","answer":"Benar","explanation":"Panjang miniatur = 12 + 6 = 18 cm. Panjang gedung sebenarnya adalah 18 cm × 250 = 4.500 \ncm = 45 meter."},{"text":"Luas tanah yang digunakan untuk dasar gedung sebenarnya adalah 1.350 meter persegi.","answer":"Benar","explanation":"Luas gedung sebenarnya = 45 meter × 30 meter = 1.350 meter persegi."},{"text":"Keliling dasar gedung sebenarnya adalah 180 meter.","answer":"Salah","explanation":"Keliling dasar gedung sebenarnya = 2 × (45 + 30) = 150 meter, bukan 180 meter."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Dalam sebuah laboratorium desain maket rancangan perumahan kota, dibuat miniatur kubah \ndome geologis melengkung berbahan kawat besi berbentuk kerucut sebangun jembatan alam \nasli. Kubah jembatan geologis asli berdiameter keliling busur dasarnya sebesar 30 𝑚 dan tinggi \ntegap bagian vertikal di bagian pusat puncak sedalam 6 𝑚. Adapun konstruksi model tiang \nminiatur kawat dome pada gambar maket diuji berdiri vertikal setinggi 12 𝑐𝑚. Beri tanda centang \n(✓) pada setiap pernyataan yang benar!","statements":[{"text":"Skala proporsi linier penyusunan yang diproses untuk membentuk keutuhan bentuk geologis \nmaket dibanding aslinya adalah sebesar 1: 50.","answer":"Benar","explanation":"Dihitung dari kesesuaian nilai bagian puncaknya tinggi model dengan aslinya: \n12 𝑐𝑚\n6 𝑚=\n12 𝑐𝑚\n600 𝑐𝑚=\n1: 50."},{"text":"Panjang lintasan rentang tali pembatas horizontal melingkar bawah keliling dasar melengkung \nmodel maket adalah sebesar 60 𝑐𝑚.","answer":"Benar","explanation":"Perubahan linearnya mengikat skala yang diperoleh: Keliling lingkaran pada maket: \n30 𝑚\n50 =\n3.000 𝑐𝑚\n50\n= 60 𝑐𝑚."},{"text":"Perbandingan perbesaran isi volume total model ruang rongga miniatur tersebut dibandingkan \naslinya bernilai sebesar 1: 125.000.","answer":"Benar","explanation":"Karena volume adalah ruang tiga dimensi yang terpengaruh rasio pangkat tiga linear skalanya: \n(\n1\n50)3 = 1: 125.000."},{"text":"Jika di atas jembatan aslinya terdapat lekuk permukaan tebing geologis bertinggi 1 𝑚, \nukurannya di maket setinggi 4 𝑐𝑚.","answer":"Salah","explanation":"Tinggi tonjolan detail kubah mini jembatan maket seharusnya disederhanakan dalam nilai \nkonversi setinggi \n100 𝑐𝑚\n50\n= 2 𝑐𝑚, bukan 4 𝑐𝑚."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Dua pengrajin tembaga membuat pajangan dinding hias berupa papan tembaga berbentuk \nsegitiga siku-siku yang sebangun untuk pesanan eksklusif di Boyolali. Pajangan papan pertama \nberukuran sisi alas siku-siku mendatar 24 cm dan sisi tegak 32 cm. Pajangan papan kedua \ndirancang dengan sisi alas mendatar berukuran 12 cm. Para pengrajin hendak menambahkan list \nperak mewah pada pinggiran seluruh sisi pajangan papan kedua dengan biaya Rp800,00 per \nmilimeter (1 𝑐𝑚= 10 𝑚𝑚). Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Sisi tegak pada pajangan dinding tembaga kedua yang dihasilkan adalah 16 cm.","answer":"Benar","explanation":"Skala pengecilan dimensi didapat dengan pembagian alas: \n12\n24 = 0,5. Maka, panjang bagian sisi \ntinggi penampang dari papan hias kedua adalah sebesar 32 x 0,5 = 16 cm."},{"text":"Keliling penuh pajangan papan kedua yang akan diberi list perak adalah sepanjang 96 cm.","answer":"Salah","explanation":"Mengasumsikan keliling hias kedua bernilai 96 cm didapat apabila lupa mengalikan sisi-sisi ke \nskala 0,5. Keliling sesungguhnya harus bernilai setengah keliling papan satu yaitu 48 cm."},{"text":"Biaya yang dibayarkan pengrajin tembaga untuk memasang list perak hias tersebut adalah \nsebesar Rp38.400,00.","answer":"Salah","explanation":"Nominal tersebut timbul ketika salah dalam pemrosesan operasional penggantian nilai centimeter \nke milimeter (didapat faktor perkalian sepuluh kali lipat lebih kecil). Hasil perhitungan \nsesungguhnya adalah Rp384.000,00."},{"text":"Pemasangan hiasan list perak secara melingkar di sekeliling papan kedua tersebut \nmemerlukan total dana Rp384.000,00.","answer":"Benar","explanation":"Mencari sisi miring papan pertama: √242 + 322 = 40 cm, maka sisi miring kedua adalah 20 cm. \nTotal keliling hias kedua: 12 + 16 + 20 = 48 cm = 480 mm. Total biaya: 480 x Rp800,00 = \nRp384.000,00."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Sebuah foto keluarga berukuran 30 cm × 45 cm ditempelkan pada selembar karton abu-abu \nberbentuk persegi panjang. Di bagian sebelah kiri, kanan, dan atas foto, masih terdapat sisa \nkarton yang tidak tertutupi foto masing-masing selebar 3 cm. Diketahui bahwa foto tersebut \ndipasang sedemikian rupa sehingga bentuk seluruh lembar karton sebangun dengan bentuk foto \ntersebut. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai sisa ukuran \nkarton dan proporsi keseluruhannya!","statements":[{"text":"Sisa lebar permukaan karton yang menggantung bebas di batas paling bawah foto adalah \nsejauh 6 cm.","answer":"Benar","explanation":"Karena foto berdimensi 30 cm × 45 cm sebangun dengan karton pendukung, hitung lebar karton \n= 30 + 3 + 3 = 36 cm. Dari konsep sebangun, rasio sisi \n45\n30 = 1.5. Berarti tinggi total karton =\n36 × 1.5 = 54 cm. Sisa margin bawah = 𝑇𝑖𝑛𝑔𝑔𝑖 𝐾𝑎𝑟𝑡𝑜𝑛−(𝑇𝑖𝑛𝑔𝑔𝑖 𝐹𝑜𝑡𝑜+ 𝑀𝑎𝑟𝑔𝑖𝑛 𝐴𝑡𝑎𝑠) = 54 −\n(45 + 3) = 6 cm."},{"text":"Tinggi total seluruh alas lembaran karton pelat penempel dari atas hingga bawah bernilai tepat \n50 cm.","answer":"Salah","explanation":"Berdasarkan prinsip kesebangunan perbandingan lebar karton, tinggi karton adalah \n36\n30 × 45 = 54 \ncm, bukan 50 cm."},{"text":"Luas seluruh permukaan lembar karton penyokong yang terlihat terbuka tanpa tertutup badan \nfoto tersebut adalah sebesar 594 𝑐𝑚2.","answer":"Benar","explanation":"Hitung sisa luar dengan menghapus area foto: 𝐿𝑢𝑎𝑠 𝑠𝑖𝑠𝑎= 𝐿𝑢𝑎𝑠 𝑘𝑎𝑟𝑡𝑜𝑛−𝐿𝑢𝑎𝑠 𝑓𝑜𝑡𝑜=\n(36 × 54) −(30 × 45) = 1944 −1350 = 594 𝑐𝑚2."},{"text":"Perbandingan kuantitas ukuran luasan utuh lembar karton berbanding total area foto asli \nbernilai proporsi 9: 4.","answer":"Salah","explanation":"Perbandingan rasionya mengacu pada kuadrat faktor skala linearnya: (\n36\n30)2 = (\n6\n5)2 =\n36\n25 ⟹\n 36: 25, bukan 9: 4."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat dan syarat dua benda \nsebangun (termasuk kesebangunan segitiga) dan menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Sebuah jalan tanjakan dibangun lurus pada lereng bukit dengan sudut elevasi stabil demi \nkenyamanan dan keselamatan berkendara. Pos keamanan pertama ditempatkan di titik 𝑃 di tepi \njalan pendakian tersebut dengan lintasan serong sepanjang 15 meter dihitung dari pangkal \ngerbang mula pendakian 𝑂, dengan ketinggian pos 𝑃 berada tepat pada 9 meter di atas \npermukaan jalan aspal datar. Kontraktor memasang pos keamanan kedua pada titik 𝑄 dengan \n\nketinggian elevasi setinggi 21 meter vertikal di atas tanah dasar. Jarak antara komponen jalan \ndan ketinggian lereng diasumsikan membentuk konsep kesebangunan geometris segitiga siku-\nsiku yang sebangun secara kontinu. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Jarak lurus miring yang dilintasi dari titik gerbang awal pendakian 𝑂 hingga mencapai titik pos \n𝑄 adalah 35.0 meter.","answer":"Benar","explanation":"Rasio skala ketinggian adalah \nℎ𝑄\nℎ𝑃=\n21\n9 =\n7\n3. Karena jalan tersebut satu garis lurus dengan sudut \nelevasi tetap, segitiga posisi berukuran sebangun. Maka jarak 𝑂𝑄 adalah 15 ×\n7\n3 = 35.0 meter."},{"text":"Jarak datar horizontal pada tanah rata dari proyeksi bawah pos pertama 𝑃 ke proyeksi pos \nkedua 𝑄 adalah sebesar 18.0 meter.","answer":"Salah","explanation":"Menggunakan teorema Pythagoras pada posisi 𝑃, diperoleh jarak datar pertama 𝑂𝑃𝑥=\n√152 −92 = 12 meter. Dengan skala \n7\n3, jarak datar total 𝑂𝑄𝑥 adalah 12 ×\n7\n3 = 28 meter. Sehingga, \njarak antar pos secara mendatar = 28 −12 = 16.0 meter, bukan 18.0 meter."},{"text":"Jarak lintasan jalan serong langsung di lereng bukit dari titik pos 𝑃 menuju ke pos 𝑄 adalah \n20.0 meter.","answer":"Benar","explanation":"Jarak lintasan lereng total 𝑂𝑄= 35 meter, sedangkan lintasan dari 𝑂 ke 𝑃 adalah 15 meter. Jarak \nmiring dari 𝑃 ke 𝑄 adalah 35 −15 = 20.0 meter."},{"text":"Perbandingan ketinggian tegak lurus pos 𝑃 terhadap panjang tapak datar di tanah aspal \naslinya adalah 3: 5.","answer":"Salah","explanation":"Tinggi pos 𝑃 adalah 9 meter, dan tapak datarnya adalah 12 meter. Perbandingan sesungguhnya \nadalah 9: 12 = 3: 4, bukan 3: 5."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
