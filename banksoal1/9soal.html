<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KELAS BELAJAR | Latihan Interaktif Bangun Datar</title>
<style>
:root{--bg:#080f27;--panel:#111d3d;--panel2:#17264d;--cyan:#4de1f0;--blue:#438cff;--purple:#9674ff;--yellow:#ffd45a;--white:#f4f7ff;--muted:#b9c7e8;--green:#51dfa1;--red:#ff7d91}
*{box-sizing:border-box}html{font-size:20px}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#202d66 0,#111936 35%,#080f27 75%);color:var(--white);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.55}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;color:#08132d;background:linear-gradient(135deg,var(--cyan),#78baff);box-shadow:0 5px 16px #0003}button:disabled{opacity:.4;cursor:not-allowed}
.top{padding:22px 4vw 12px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:1px;color:var(--cyan)}.brand span{color:var(--yellow)}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools button,.filter button,.bottom .secondary{background:#24345f;color:var(--white);border:1px solid #49618f;box-shadow:none}.wrap{max-width:1100px;margin:0 auto;padding:16px 22px 140px}.hero{padding:26px;border:1px solid #4a5d91;border-radius:24px;background:linear-gradient(120deg,#172b58,#29245b);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:1.65rem;line-height:1.25}.hero p{margin:0;color:var(--muted)}.filter{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filter button.active{background:linear-gradient(135deg,var(--purple),var(--blue));border-color:transparent}.card{background:linear-gradient(145deg,#142448,#101a38);border:1px solid #344b7c;border-radius:22px;padding:24px;box-shadow:0 14px 35px #0003}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.pill{font-size:20px;padding:6px 12px;border-radius:999px;background:#263965;color:#dceaff;border:1px solid #52699c}.progress{height:12px;background:#29385f;border-radius:20px;overflow:hidden;margin:12px 0 22px}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0;transition:width .25s}.objective{padding:14px 16px;background:#1c315b;border-left:5px solid var(--yellow);border-radius:12px;margin-bottom:20px;color:#e7efff}.qtext{font-size:1.12rem;font-weight:700;margin:10px 0 18px}.visual{margin:14px auto 20px;max-width:640px;background:#fff;color:#17213a;padding:14px;border-radius:16px;text-align:center}.visual svg{width:100%;height:auto;display:block}.options{display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #465d8f;border-radius:14px;background:#17284d;cursor:pointer}.option:hover{border-color:var(--cyan);background:#1d3564}.option input{width:22px;height:22px;accent-color:#64ddeb;flex-shrink:0;margin-top:4px}.option.selected{border-color:var(--cyan);background:#203d6b}.feedback,.explanation{margin-top:18px;padding:16px;border-radius:14px;display:none}.feedback.show,.explanation.show{display:block}.feedback.correct{background:#123f3a;border:1px solid var(--green)}.feedback.wrong{background:#4b2638;border:1px solid var(--red)}.explanation{background:#1b2d55;border:1px solid #6178ad}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080f27ee;backdrop-filter:blur(12px);border-top:1px solid #34466f;padding:14px 4vw;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;z-index:5}.bottom button{min-width:120px}.bottom .accent{background:linear-gradient(135deg,var(--yellow),#ffad55);color:#17213a}.hidden{display:none!important}
@media(max-width:650px){.top{padding:16px}.wrap{padding:10px 14px 170px}.hero,.card{padding:18px;border-radius:18px}.hero h1{font-size:1.35rem}.bottom{gap:7px;padding:10px}.bottom button{min-width:0;flex:1;padding:12px 8px}.tools button{padding:9px 12px}.qtext{font-size:1.05rem}}
@media print{body{background:#fff;color:#111}.top,.filter,.bottom,.tools{display:none!important}.wrap{max-width:none;padding:0}.hero,.card{background:#fff;color:#111;border:1px solid #aaa;box-shadow:none}.hero p,.objective{color:#222}.objective{background:#eee}.option{background:#fff;color:#111;border:1px solid #aaa}.visual{border:1px solid #aaa}}
body.presentation .top,body.presentation .filter{display:none}body.presentation .wrap{max-width:1250px}
</style></head><body>
<header class="top"><div class="brand">KELAS <span>BELAJAR</span> · MPI MATEMATIKA</div><div class="tools"><button onclick="togglePresentation()">Mode Presentasi</button><button onclick="toggleFullscreen()">Layar Penuh</button><button onclick="window.print()">Cetak</button></div></header>
<main class="wrap"><section class="hero"><h1>Latihan Interaktif: Bangun Datar</h1><p>24 soal pilihan ganda · Unsur, keliling, luas, dan pemecahan masalah bangun datar</p></section>
<div class="filter" id="filters"><button class="active" data-level="Semua">Semua Soal</button><button data-level="1">Level 1</button><button data-level="2">Level 2</button><button data-level="3">Level 3</button></div>
<section class="card"><div class="meta"><span class="pill" id="levelPill">Level 1</span><span class="pill" id="numberPill">Soal 1 dari 24</span><span class="pill">Pilihan Ganda</span><span class="pill" id="progressText">Progres 4%</span></div>
<div class="progress"><div id="progressBar"></div></div><div class="objective"><strong>Tujuan:</strong> <span id="objective"></span></div>
<div class="qtext" id="question"></div><div id="visual" class="visual hidden"></div><div class="options" id="options"></div>
<div class="feedback" id="feedback"></div><div class="explanation" id="explanation"></div></section></main>
<div class="bottom"><button class="secondary" id="prev">← Sebelumnya</button><button class="secondary" id="next">Berikutnya →</button><button id="check">Periksa Jawaban</button><button class="accent" id="reveal">Kunci & Pembahasan</button><button class="secondary hidden" id="hide">Sembunyikan Pembahasan</button></div>
<script>
const questions = [
{number:1,level:1,type:"Unsur",objective:"Mengidentifikasi bangun datar berdasarkan jumlah sisi.",question:"Bangun datar yang memiliki tiga sisi dan tiga titik sudut adalah ....",options:[{key:"A",text:"Persegi"},{key:"B",text:"Segitiga"},{key:"C",text:"Persegi panjang"},{key:"D",text:"Lingkaran"}],answer:"B",explanation:"Segitiga memiliki 3 sisi dan 3 titik sudut."},
{number:2,level:1,type:"Unsur",objective:"Mengidentifikasi sifat-sifat persegi.",question:"Sifat yang selalu dimiliki persegi adalah ....",options:[{key:"A",text:"Hanya sepasang sisi sejajar"},{key:"B",text:"Keempat sudutnya siku-siku dan semua sisinya sama panjang"},{key:"C",text:"Hanya dua sisi sama panjang"},{key:"D",text:"Tidak memiliki diagonal"}],answer:"B",explanation:"Persegi memiliki empat sisi sama panjang, empat sudut siku-siku, dan dua diagonal sama panjang yang saling tegak lurus serta membagi dua sama panjang."},
{number:3,level:1,type:"Keliling",objective:"Menghitung keliling persegi dari panjang sisinya.",question:"Sebuah persegi memiliki panjang sisi 9 cm. Keliling persegi tersebut adalah ....",visual:'<svg viewBox="0 0 520 190" role="img" aria-label="Persegi dengan sisi 9 cm"><rect x="180" y="25" width="150" height="130" fill="#d9e9ff" stroke="#2854a3" stroke-width="4"/><text x="255" y="18" text-anchor="middle" font-size="20" fill="#17213a">9 cm</text><text x="340" y="95" font-size="20" fill="#17213a">9 cm</text></svg>',options:[{key:"A",text:"18 cm"},{key:"B",text:"27 cm"},{key:"C",text:"36 cm"},{key:"D",text:"81 cm"}],answer:"C",explanation:"Keliling persegi = 4 × sisi = 4 × 9 = 36 cm."},
{number:4,level:1,type:"Luas",objective:"Menghitung luas persegi berdasarkan panjang sisi.",question:"Luas persegi yang panjang sisinya 8 cm adalah ....",options:[{key:"A",text:"16 cm²"},{key:"B",text:"32 cm²"},{key:"C",text:"64 cm²"},{key:"D",text:"72 cm²"}],answer:"C",explanation:"Luas persegi = sisi × sisi = 8 × 8 = 64 cm²."},
{number:5,level:1,type:"Keliling",objective:"Menghitung keliling persegi panjang.",question:"Persegi panjang memiliki panjang 12 cm dan lebar 5 cm. Kelilingnya adalah ....",visual:'<svg viewBox="0 0 520 170" role="img" aria-label="Persegi panjang panjang 12 cm dan lebar 5 cm"><rect x="95" y="35" width="320" height="95" fill="#e3f4ff" stroke="#2863a7" stroke-width="4"/><text x="255" y="25" text-anchor="middle" font-size="20" fill="#17213a">12 cm</text><text x="425" y="90" font-size="20" fill="#17213a">5 cm</text></svg>',options:[{key:"A",text:"17 cm"},{key:"B",text:"24 cm"},{key:"C",text:"34 cm"},{key:"D",text:"60 cm"}],answer:"C",explanation:"Keliling = 2 × (panjang + lebar) = 2 × (12 + 5) = 34 cm."},
{number:6,level:1,type:"Luas",objective:"Menghitung luas persegi panjang.",question:"Sebuah papan berbentuk persegi panjang berukuran 15 cm × 6 cm. Luasnya adalah ....",options:[{key:"A",text:"21 cm²"},{key:"B",text:"42 cm²"},{key:"C",text:"90 cm²"},{key:"D",text:"180 cm²"}],answer:"C",explanation:"Luas persegi panjang = panjang × lebar = 15 × 6 = 90 cm²."},
{number:7,level:1,type:"Segitiga",objective:"Menghitung luas segitiga dari alas dan tinggi.",question:"Segitiga memiliki alas 10 cm dan tinggi 8 cm. Luasnya adalah ....",visual:'<svg viewBox="0 0 520 200" role="img" aria-label="Segitiga dengan alas 10 cm dan tinggi 8 cm"><path d="M100 160 L420 160 L300 30 Z" fill="#e8e2ff" stroke="#6549b5" stroke-width="4"/><path d="M300 30 L300 160" stroke="#d14f78" stroke-width="3" stroke-dasharray="7 5"/><text x="260" y="190" text-anchor="middle" font-size="20" fill="#17213a">Alas 10 cm</text><text x="310" y="100" font-size="20" fill="#17213a">8 cm</text></svg>',options:[{key:"A",text:"18 cm²"},{key:"B",text:"40 cm²"},{key:"C",text:"80 cm²"},{key:"D",text:"100 cm²"}],answer:"B",explanation:"Luas segitiga = ½ × alas × tinggi = ½ × 10 × 8 = 40 cm²."},
{number:8,level:1,type:"Segitiga",objective:"Menentukan keliling segitiga dari panjang ketiga sisinya.",question:"Sebuah segitiga memiliki sisi 7 cm, 8 cm, dan 9 cm. Kelilingnya adalah ....",options:[{key:"A",text:"16 cm"},{key:"B",text:"22 cm"},{key:"C",text:"24 cm"},{key:"D",text:"56 cm"}],answer:"C",explanation:"Keliling segitiga = jumlah ketiga sisi = 7 + 8 + 9 = 24 cm."},
{number:9,level:2,type:"Jajar genjang",objective:"Menghitung luas jajar genjang menggunakan alas dan tinggi.",question:"Sebuah jajar genjang memiliki alas 14 cm dan tinggi 6 cm. Luasnya adalah ....",visual:'<svg viewBox="0 0 520 190" role="img" aria-label="Jajar genjang dengan alas 14 cm dan tinggi 6 cm"><path d="M150 145 L410 145 L340 40 L80 40Z" fill="#ddf5ec" stroke="#21866d" stroke-width="4"/><path d="M340 40 L340 145" stroke="#d14f78" stroke-width="3" stroke-dasharray="7 5"/><text x="245" y="175" text-anchor="middle" font-size="20" fill="#17213a">Alas 14 cm</text><text x="350" y="100" font-size="20" fill="#17213a">6 cm</text></svg>',options:[{key:"A",text:"20 cm²"},{key:"B",text:"42 cm²"},{key:"C",text:"84 cm²"},{key:"D",text:"168 cm²"}],answer:"C",explanation:"Luas jajar genjang = alas × tinggi = 14 × 6 = 84 cm²."},
{number:10,level:2,type:"Trapesium",objective:"Menghitung luas trapesium dari dua sisi sejajar dan tinggi.",question:"Trapesium memiliki sisi sejajar 8 cm dan 14 cm serta tinggi 5 cm. Luasnya adalah ....",options:[{key:"A",text:"45 cm²"},{key:"B",text:"55 cm²"},{key:"C",text:"70 cm²"},{key:"D",text:"110 cm²"}],answer:"B",explanation:"Luas trapesium = ½ × (jumlah sisi sejajar) × tinggi = ½ × (8 + 14) × 5 = 55 cm²."},
{number:11,level:2,type:"Belah ketupat",objective:"Menghitung luas belah ketupat berdasarkan kedua diagonal.",question:"Belah ketupat memiliki diagonal 12 cm dan 10 cm. Luasnya adalah ....",visual:'<svg viewBox="0 0 520 200" role="img" aria-label="Belah ketupat dengan diagonal 12 cm dan 10 cm"><path d="M260 20 L420 100 L260 180 L100 100Z" fill="#fff0cf" stroke="#b87920" stroke-width="4"/><path d="M100 100 L420 100 M260 20 L260 180" stroke="#d14f78" stroke-width="3" stroke-dasharray="7 5"/><text x="260" y="95" text-anchor="middle" font-size="20" fill="#17213a">12 cm</text><text x="275" y="50" font-size="20" fill="#17213a">10 cm</text></svg>',options:[{key:"A",text:"22 cm²"},{key:"B",text:"60 cm²"},{key:"C",text:"120 cm²"},{key:"D",text:"240 cm²"}],answer:"B",explanation:"Luas belah ketupat = ½ × d₁ × d₂ = ½ × 12 × 10 = 60 cm²."},
{number:12,level:2,type:"Layang-layang",objective:"Menghitung luas layang-layang dari panjang diagonal.",question:"Diagonal-diagonal layang-layang adalah 16 cm dan 9 cm. Luasnya adalah ....",options:[{key:"A",text:"25 cm²"},{key:"B",text:"36 cm²"},{key:"C",text:"72 cm²"},{key:"D",text:"144 cm²"}],answer:"C",explanation:"Luas layang-layang = ½ × d₁ × d₂ = ½ × 16 × 9 = 72 cm²."},
{number:13,level:2,type:"Lingkaran",objective:"Menghitung keliling lingkaran menggunakan diameter.",question:"Sebuah lingkaran memiliki diameter 14 cm. Jika π = 22/7, kelilingnya adalah ....",visual:'<svg viewBox="0 0 520 190" role="img" aria-label="Lingkaran dengan diameter 14 cm"><circle cx="260" cy="95" r="70" fill="#e6efff" stroke="#3b63a9" stroke-width="4"/><path d="M190 95 H330" stroke="#d14f78" stroke-width="3"/><circle cx="260" cy="95" r="4" fill="#d14f78"/><text x="260" y="83" text-anchor="middle" font-size="20" fill="#17213a">14 cm</text></svg>',options:[{key:"A",text:"22 cm"},{key:"B",text:"44 cm"},{key:"C",text:"88 cm"},{key:"D",text:"154 cm"}],answer:"B",explanation:"Keliling lingkaran = π × d = 22/7 × 14 = 44 cm."},
{number:14,level:2,type:"Lingkaran",objective:"Menghitung luas lingkaran berdasarkan jari-jari.",question:"Jari-jari sebuah lingkaran 7 cm. Jika π = 22/7, luasnya adalah ....",options:[{key:"A",text:"44 cm²"},{key:"B",text:"77 cm²"},{key:"C",text:"154 cm²"},{key:"D",text:"308 cm²"}],answer:"C",explanation:"Luas lingkaran = π × r² = 22/7 × 7 × 7 = 154 cm²."},
{number:15,level:2,type:"Keliling",objective:"Menentukan panjang sisi persegi dari informasi keliling.",question:"Keliling sebuah persegi adalah 52 cm. Panjang setiap sisinya adalah ....",options:[{key:"A",text:"11 cm"},{key:"B",text:"13 cm"},{key:"C",text:"26 cm"},{key:"D",text:"48 cm"}],answer:"B",explanation:"Sisi persegi = keliling ÷ 4 = 52 ÷ 4 = 13 cm."},
{number:16,level:2,type:"Luas",objective:"Menentukan ukuran yang belum diketahui dari luas persegi panjang.",question:"Luas persegi panjang 96 cm². Jika panjangnya 12 cm, lebarnya adalah ....",options:[{key:"A",text:"6 cm"},{key:"B",text:"8 cm"},{key:"C",text:"10 cm"},{key:"D",text:"12 cm"}],answer:"B",explanation:"Lebar = luas ÷ panjang = 96 ÷ 12 = 8 cm."},
{number:17,level:3,type:"HOTS",objective:"Menganalisis luas gabungan dua bangun datar sederhana.",question:"Sebuah bangun gabungan terdiri atas persegi berukuran 8 cm × 8 cm dan persegi panjang berukuran 8 cm × 5 cm yang menempel tanpa tumpang tindih. Luas seluruh bangun adalah ....",visual:'<svg viewBox="0 0 520 210" role="img" aria-label="Gabungan persegi dan persegi panjang"><rect x="150" y="25" width="160" height="130" fill="#dceaff" stroke="#315caa" stroke-width="4"/><rect x="150" y="155" width="160" height="50" fill="#e5ddff" stroke="#6549b5" stroke-width="4"/><text x="230" y="95" text-anchor="middle" font-size="20" fill="#17213a">8 × 8</text><text x="230" y="188" text-anchor="middle" font-size="20" fill="#17213a">8 × 5</text></svg>',options:[{key:"A",text:"64 cm²"},{key:"B",text:"80 cm²"},{key:"C",text:"104 cm²"},{key:"D",text:"144 cm²"}],answer:"C",explanation:"Luas persegi = 8 × 8 = 64 cm². Luas persegi panjang = 8 × 5 = 40 cm². Total = 64 + 40 = 104 cm²."},
{number:18,level:3,type:"HOTS",objective:"Menentukan perubahan luas persegi akibat perubahan panjang sisi.",question:"Panjang sisi sebuah persegi diperbesar menjadi 2 kali panjang semula. Luas persegi yang baru menjadi .... kali luas semula.",options:[{key:"A",text:"2"},{key:"B",text:"3"},{key:"C",text:"4"},{key:"D",text:"8"}],answer:"C",explanation:"Jika sisi awal s, luas awal s². Sisi baru 2s sehingga luas baru (2s)² = 4s², yaitu 4 kali luas semula."},
{number:19,level:3,type:"HOTS",objective:"Menyelesaikan masalah keliling dan biaya pemasangan pagar.",question:"Taman berbentuk persegi panjang berukuran 18 m × 12 m akan dipasang pagar di sekelilingnya. Jika biaya pagar Rp25.000,00 per meter, biaya seluruhnya adalah ....",options:[{key:"A",text:"Rp600.000,00"},{key:"B",text:"Rp1.200.000,00"},{key:"C",text:"Rp1.500.000,00"},{key:"D",text:"Rp2.000.000,00"}],answer:"C",explanation:"Keliling taman = 2 × (18 + 12) = 60 m. Biaya = 60 × Rp25.000,00 = Rp1.500.000,00."},
{number:20,level:3,type:"HOTS",objective:"Menentukan luas daerah yang tersisa setelah sebagian bidang digunakan.",question:"Lantai berbentuk persegi dengan sisi 10 m akan ditutup karpet. Bagian seluas 16 m² tidak ditutup karpet. Luas lantai yang tertutup karpet adalah ....",options:[{key:"A",text:"16 m²"},{key:"B",text:"64 m²"},{key:"C",text:"84 m²"},{key:"D",text:"100 m²"}],answer:"C",explanation:"Luas lantai = 10 × 10 = 100 m². Luas tertutup karpet = 100 − 16 = 84 m²."},
{number:21,level:3,type:"HOTS",objective:"Menganalisis hubungan keliling dan luas persegi panjang.",question:"Dua persegi panjang memiliki keliling sama, yaitu 24 cm. Persegi panjang pertama berukuran 8 cm × 4 cm. Persegi panjang kedua berukuran 7 cm × 5 cm. Pernyataan yang benar adalah ....",options:[{key:"A",text:"Luas pertama lebih besar 3 cm²"},{key:"B",text:"Luas kedua lebih besar 3 cm²"},{key:"C",text:"Kedua luas sama"},{key:"D",text:"Keliling keduanya berbeda"}],answer:"B",explanation:"Luas pertama = 8 × 4 = 32 cm². Luas kedua = 7 × 5 = 35 cm². Jadi luas kedua lebih besar 3 cm²."},
{number:22,level:3,type:"HOTS",objective:"Menghitung luas bangun gabungan dengan menguraikannya menjadi beberapa bangun.",question:"Sebuah bentuk terdiri atas persegi panjang 12 cm × 6 cm dan segitiga di atasnya dengan alas 12 cm serta tinggi 5 cm. Luas seluruh bentuk adalah ....",visual:'<svg viewBox="0 0 520 210" role="img" aria-label="Bangun gabungan persegi panjang dan segitiga"><rect x="150" y="90" width="220" height="100" fill="#dceaff" stroke="#315caa" stroke-width="4"/><path d="M150 90 L260 20 L370 90Z" fill="#e5ddff" stroke="#6549b5" stroke-width="4"/><text x="260" y="150" text-anchor="middle" font-size="20" fill="#17213a">12 × 6</text><text x="260" y="82" text-anchor="middle" font-size="20" fill="#17213a">tinggi 5 cm</text></svg>',options:[{key:"A",text:"72 cm²"},{key:"B",text:"90 cm²"},{key:"C",text:"102 cm²"},{key:"D",text:"132 cm²"}],answer:"C",explanation:"Luas persegi panjang = 12 × 6 = 72 cm². Luas segitiga = ½ × 12 × 5 = 30 cm². Total = 102 cm²."},
{number:23,level:3,type:"HOTS",objective:"Menentukan jari-jari lingkaran dari informasi keliling.",question:"Keliling sebuah lingkaran adalah 88 cm. Jika π = 22/7, jari-jari lingkaran tersebut adalah ....",options:[{key:"A",text:"7 cm"},{key:"B",text:"14 cm"},{key:"C",text:"21 cm"},{key:"D",text:"28 cm"}],answer:"B",explanation:"K = 2πr. Maka r = 88 ÷ (2 × 22/7) = 88 × 7/44 = 14 cm."},
{number:24,level:3,type:"HOTS",objective:"Memecahkan masalah luas daerah berbentuk trapesium dalam konteks sehari-hari.",question:"Sebuah lahan berbentuk trapesium memiliki sisi sejajar 20 m dan 12 m serta tinggi 9 m. Jika setiap 1 m² membutuhkan 2 bibit tanaman, jumlah bibit yang diperlukan adalah ....",options:[{key:"A",text:"144 bibit"},{key:"B",text:"288 bibit"},{key:"C",text:"324 bibit"},{key:"D",text:"576 bibit"}],answer:"B",explanation:"Luas trapesium = ½ × (20 + 12) × 9 = 144 m². Jumlah bibit = 144 × 2 = 288 bibit."}
];
let current=0,filter="Semua",answers={},checked={},revealed={};
const $=id=>document.getElementById(id);
function visible(){return questions.map((q,i)=>({q,i})).filter(x=>filter==="Semua"||String(x.q.level)===filter)}
function render(){let list=visible();if(!list.length)return;let pos=list.findIndex(x=>x.i===current);if(pos<0){current=list[0].i;pos=0}let q=questions[current];
$("levelPill").textContent="Level "+q.level;$("numberPill").textContent=`Soal ${pos+1} dari ${list.length}`;$("progressText").textContent=`Progres ${Math.round((pos+1)/list.length*100)}%`;$("progressBar").style.width=((pos+1)/list.length*100)+"%";$("objective").textContent=q.objective;$("question").textContent=q.question;$("visual").innerHTML=q.visual||"";$("visual").classList.toggle("hidden",!q.visual);
$("options").innerHTML=q.options.map(o=>`<label class="option ${answers[current]===o.key?'selected':''}"><input type="radio" name="answer" value="${o.key}" ${answers[current]===o.key?'checked':''}><span><strong>${o.key}.</strong> ${o.text}</span></label>`).join("");
document.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',e=>{answers[current]=e.target.value;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));e.target.closest('.option').classList.add('selected');$("feedback").className="feedback";}));
$("feedback").className="feedback";$("feedback").textContent="";if(checked[current])showCheck();$("explanation").classList.toggle("show",!!revealed[current]);$("explanation").innerHTML=revealed[current]?`<strong>Jawaban: ${q.answer}</strong><br>${q.explanation}`:"";$("hide").classList.toggle("hidden",!revealed[current]);$("prev").disabled=pos===0;$("next").disabled=pos===list.length-1;}
function showCheck(){let q=questions[current],f=$("feedback");if(!answers[current]){f.className="feedback show wrong";f.textContent="Pilih salah satu jawaban terlebih dahulu.";return}let ok=answers[current]===q.answer;f.className="feedback show "+(ok?"correct":"wrong");f.textContent=ok?"Benar! Jawaban kamu tepat.":"Belum tepat. Coba pelajari kembali, lalu lihat pembahasannya jika diperlukan."}
$("check").onclick=()=>{checked[current]=true;showCheck()};$("reveal").onclick=()=>{revealed[current]=true;render()};$("hide").onclick=()=>{revealed[current]=false;render()};
$("prev").onclick=()=>{let l=visible(),p=l.findIndex(x=>x.i===current);if(p>0){current=l[p-1].i;render()}};$("next").onclick=()=>{let l=visible(),p=l.findIndex(x=>x.i===current);if(p<l.length-1){current=l[p+1].i;render()}};
