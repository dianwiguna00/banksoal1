<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Bilangan Bulat</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT BILANGAN BULAT</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number": 1, "level": 1, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Hasil dari operasi penjumlahan −14 + 6 adalah ....", "options": [{"key": "A", "text": "−20"}, {"key": "B", "text": "−8"}, {"key": "C", "text": "8"}, {"key": "D", "text": "20"}], "answer": "B", "explanation": "Langkah 1: Menghitung hasil penjumlahan −14 + 6.\nLangkah 2: Karena nilai negatifnya lebih besar secara mutlak, maka hasilnya negatif: −(14 −6) =\n−8."}, {"number": 2, "level": 1, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Sebuah kapal selam berada pada kedalaman 250 meter di bawah permukaan laut, yang ditulis\nsebagai −250 meter. Lawan dari bilangan tersebut menyatakan posisi sebuah pesawat yang\nberada pada ketinggian ....", "options": [{"key": "A", "text": "−500 meter"}, {"key": "B", "text": "−250 meter"}, {"key": "C", "text": "250 meter"}, {"key": "D", "text": "500 meter"}], "answer": "C", "explanation": "Lawan dari bilangan bulat negatif adalah bilangan bulat positif yang memiliki nilai mutlak yang\nsama.\nLawan dari bilangan −250 adalah 250.\nMaka, posisi pesawat tersebut berada pada ketinggian 250 meter di atas permukaan laut."}, {"number": 3, "level": 1, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Suhu di dalam ruangan penyimpanan daging beku di sebuah pasar swalayan adalah −15∘C. Jika\nsuhu ruangan tersebut dinaikkan sebesar 5∘C, maka suhu ruangan sekarang adalah ....", "options": [{"key": "A", "text": "−20∘C"}, {"key": "B", "text": "−10∘C"}, {"key": "C", "text": "10∘C"}, {"key": "D", "text": "20∘C"}], "answer": "B", "explanation": "Suhu awal ruangan penyimpanan daging adalah −15∘C.\nKarena suhu dinaikkan sebesar 5∘C, tambahkan 5 pada nilai suhu mula-mula.\nSuhu akhir: −15 + 5 = −10∘C."}, {"number": 4, "level": 2, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Suhu ruangan laboratorium mula-mula adalah −8∘C. Setelah AC dimatikan, suhu ruangan\ntersebut naik sebesar 4∘C setiap jam. Suhu ruangan setelah AC dimatikan selama 3 jam adalah\n....", "options": [{"key": "A", "text": "−20∘C"}, {"key": "B", "text": "−4∘C"}, {"key": "C", "text": "2∘C"}, {"key": "D", "text": "4∘C"}], "answer": "D", "explanation": "Langkah 1: Hitung total kenaikan suhu setelah AC dimatikan selama 3 jam. Total kenaikan suhu =\n3 × 4∘𝐶= 12∘𝐶.\n\nLangkah 2: Hitung suhu akhir ruangan laboratorium dengan menjumlahkan suhu awal dan total\nkenaikan suhu: −8∘𝐶+ 12∘𝐶= 4∘𝐶."}, {"number": 5, "level": 2, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Dalam babak penyisihan kompetisi matematika di Bandung, setiap jawaban benar diberi nilai 4,\njawaban salah diberi nilai −2, dan tidak dijawab diberi nilai −1. Dari 40 soal yang disediakan,\nDeni menjawab 30 soal dengan benar dan 6 soal salah, sedangkan sisanya tidak dijawab.\nBerapakah skor total yang diperoleh Deni?", "options": [{"key": "A", "text": "104."}, {"key": "B", "text": "108."}, {"key": "C", "text": "112."}, {"key": "D", "text": "120."}], "answer": "A", "explanation": "Langkah 1: Hitung jumlah soal yang tidak dijawab oleh Deni, yaitu 40 −(30 + 6) = 4 soal.\nLangkah 2: Hitung skor total dengan mengalikan jumlah masing-masing kategori dengan poinnya:\n(30 × 4) + (6 × (−2)) + (4 × (−1)) = 120 −12 −4 = 104."}, {"number": 6, "level": 2, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Suhu udara di Kota Bandung mula-mula 24∘C. Setelah hujan turun, suhunya turun 1∘C setiap 8\nmenit. Suhu udara di kota tersebut setelah hujan berlangsung selama 40 menit adalah ....", "options": [{"key": "A", "text": "19∘C"}, {"key": "B", "text": "20∘C"}, {"key": "C", "text": "24∘C"}, {"key": "D", "text": "29∘C"}], "answer": "A", "explanation": "Langkah 1: Hitung total penurunan suhu selama hujan berlangsung. Karena suhu turun 1∘C\nsetiap 8 menit selama 40 menit, maka total penurunan suhunya adalah (40: 8) × 1∘𝐶= 5∘𝐶.\nLangkah 2: Kurangkan suhu awal dengan total penurunan suhu untuk mendapatkan suhu akhir.\nSuhu akhir = 24∘𝐶−5∘𝐶= 19∘𝐶."}, {"number": 7, "level": 3, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Seorang pendaki memulai perjalanan dari pos Ranu Pani Gunung Semeru pada ketinggian 2.100\nmeter di atas permukaan laut dengan suhu udara 15∘C. Setiap kenaikan 150 meter, suhu udara\nakan turun sebesar 1∘C. Pendaki tersebut mendaki hingga mencapai ketinggian 2.700 meter,\nnamun karena cuaca buruk ia memutuskan untuk turun kembali sejauh 300 meter. Suhu udara di\nposisi akhir pendaki tersebut adalah ....", "options": [{"key": "A", "text": "9∘C"}, {"key": "B", "text": "11∘C"}, {"key": "C", "text": "13∘C"}, {"key": "D", "text": "15∘C"}], "answer": "C", "explanation": "Langkah 1: Hitung ketinggian posisi akhir pendaki. Pendaki naik ke 2.700 meter lalu turun sejauh\n300 meter, sehingga ketinggian akhirnya adalah 2.700 −300 = 2.400 meter.\nLangkah 2: Hitung kenaikan ketinggian bersih dari posisi awal: 2.400 −2.100 = 300 meter.\nKarena suhu turun 1∘C setiap kenaikan 150 meter, total penurunan suhu adalah\n300\n150 × 1∘𝐶= 2∘C.\nLangkah 3: Hitung suhu udara pada posisi akhir: 15∘𝐶−2∘𝐶= 13∘C."}, {"number": 8, "level": 3, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Seorang pemilik toko kelontong di Surabaya memiliki modal awal sebesar Rp500.000,00. Pada\nhari pertama ia mengalami kerugian sebesar Rp60.000,00. Pada hari kedua ia mendapatkan\nkeuntungan sebesar Rp120.000,00. Pada hari ketiga ia harus membayar biaya sewa tempat\nsebesar Rp80.000,00. Jika seluruh sisa modal tersebut digunakan untuk membeli 8 dus mie\ninstan dengan harga yang sama, berapakah harga beli per dus mie instan tersebut?", "options": [{"key": "A", "text": "Rp40.000,00"}, {"key": "B", "text": "Rp45.000,00"}, {"key": "C", "text": "Rp50.000,00"}, {"key": "D", "text": "Rp60.000,00"}], "answer": "D", "explanation": "Langkah 1: Hitung sisa modal toko setelah tiga hari dengan operasi bilangan bulat:\nRp500.000,00 −𝑅𝑝60.000,00 + 𝑅𝑝120.000,00 −𝑅𝑝80.000,00 = 𝑅𝑝480.000,00.\nLangkah 2: Tentukan harga beli per dus mie instan dengan membagi sisa modal dengan jumlah\ndus: Rp480.000,00 ÷ 8 = 𝑅𝑝60.000,00.\n\nLangkah 3: Jadi, harga beli per dus mie instan tersebut adalah Rp60.000,00."}, {"number": 9, "level": 3, "type": "Pilihan Ganda", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Suhu udara di lereng Gunung Slamet pada ketinggian 1.200 meter di atas permukaan laut adalah\n16∘C. Setiap kenaikan ketinggian sebesar 300 meter, suhu udara akan turun sebesar 2∘C. Di\npuncak gunung tersebut, alat pengukur suhu menunjukkan angka 4∘C. Berapakah perkiraan total\nketinggian puncak Gunung Slamet tersebut di atas permukaan laut?", "options": [{"key": "A", "text": "2.400 meter."}, {"key": "B", "text": "2.800 meter."}, {"key": "C", "text": "3.000 meter."}, {"key": "D", "text": "3.400 meter."}], "answer": "C", "explanation": "Langkah 1: Hitung selisih suhu antara lereng dan puncak gunung: 16∘𝐶−4∘𝐶= 12∘𝐶.\nLangkah 2: Tentukan banyaknya siklus penurunan suhu yang terjadi:\n12\n2 = 6 kali siklus.\nLangkah 3: Hitung total pertambahan ketinggian dari lereng ke puncak: 6 × 300 𝑚𝑒𝑡𝑒𝑟=\n1.800 𝑚𝑒𝑡𝑒𝑟.\nLangkah 4: Hitung total ketinggian puncak gunung tersebut: 1.200 𝑚𝑒𝑡𝑒𝑟+ 1.800 𝑚𝑒𝑡𝑒𝑟=\n3.000 𝑚𝑒𝑡𝑒𝑟."}, {"number": 10, "level": 1, "type": "Analisis Pernyataan", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Seorang peneliti mencatat suhu empat buah larutan di laboratorium: larutan A bersuhu −3∘C,\nlarutan B bersuhu −1∘C, larutan C bersuhu 5∘C, dan larutan D bersuhu −10∘C. Beri tanda\ncentang (✓) pada setiap pernyataan yang benar mengenai interpretasi derajat kehangatan\nkeempat larutan tersebut!", "statements": [{"text": "Jika diurutkan dari yang paling hangat, susunan posisi wadah adalah larutan A, larutan B,\nlarutan C, lalu larutan D.", "answer": "Salah", "explanation": "Mengurutkan kehangatan berarti mengurut dari angka terbesar: 5∘C (larutan C), −1∘C (larutan B),\n−3∘C (larutan A), dan −10∘C (larutan D)."}, {"text": "Larutan D adalah larutan dengan suhu paling dingin dibanding wadah lainnya.", "answer": "Benar", "explanation": "Bilangan paling kecil adalah −10, sehingga posisi ini menunjukkan titik suhu terendah atau\nterdingin."}, {"text": "Suhu di dalam larutan A lebih hangat dibandingkan tingkat suhu pada larutan B.", "answer": "Salah", "explanation": "Derajat larutan A adalah −3∘C sedangkan larutan B −1∘C. Nilai −3 < −1, sehingga larutan A\nlebih dingin dari B."}, {"text": "Suhu pada wadah C menunjukkan tingkat pengukuran terpanas dibanding larutan yang lain.", "answer": "Benar", "explanation": "Bilangan 5∘C adalah satu-satunya angka bulat positif sekaligus terbesar pada data, menandakan\ntingkat terpanas."}]}, {"number": 11, "level": 1, "type": "Analisis Pernyataan", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Sebuah laporan cuaca mencatat suhu udara di empat kota yang berbeda pada malam hari yaitu\nKota P dengan suhu −6∘C, Kota Q dengan suhu −2∘C, Kota R dengan suhu 4∘C, dan Kota S\ndengan suhu 0∘C. Tentukan benar atau salah untuk setiap pernyataan berikut mengenai\nperbandingan suhu udara di keempat kota tersebut!", "statements": [{"text": "Kota P adalah kota dengan suhu yang paling dingin di antara semua kota tersebut.", "answer": "Benar", "explanation": "Urutan suhu dari yang terendah adalah −6∘C (Kota P) < −2∘C (Kota Q) < 0∘C (Kota S) < 4∘C\n(Kota R). Kota P dengan suhu −6∘C bernilai paling kecil (terdingin)."}, {"text": "Kota R memiliki suhu yang paling panas atau tertinggi di antara semua kota tersebut.", "answer": "Benar", "explanation": "Suhu Kota R adalah 4∘C, yang merupakan satu-satunya bilangan bulat positif di data tersebut\nsehingga bernilai paling besar (terpanas)."}, {"text": "Suhu di Kota Q lebih dingin dibandingkan dengan suhu di Kota S.", "answer": "Benar", "explanation": "Suhu Kota Q adalah −2∘C dan Kota S adalah 0∘C. Karena −2 < 0, maka suhu di Kota Q lebih\ndingin."}, {"text": "Urutan kota dari yang bersuhu paling panas ke paling dingin adalah Kota P, Kota Q, Kota S,\ndan Kota R.", "answer": "Salah", "explanation": "Urutan dari paling panas (suhu tertinggi) ke paling dingin (suhu terendah) adalah Kota R (4∘C),\nKota S (0∘C), Kota Q (−2∘C), baru kemudian Kota P (−6∘C)."}]}, {"number": 12, "level": 1, "type": "Analisis Pernyataan", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Sebuah lembar papan skor mencatat perolehan hasil pertandingan mini-golf sekelompok anak:\nAndi mencetak skor −15 poin, Bobby mendapat −4 poin, Cinta memperoleh 8 poin, dan Daniel\nmencatat 0 poin. Tentukan benar atau salah setiap pernyataan tentang penilaian dan skor mini-\ngolf ini!", "statements": [{"text": "Andi mencatatkan perolehan skor mini-golf tertinggi di antara anak-anak di kelompoknya.", "answer": "Salah", "explanation": "Skor −15 merupakan bilangan bernilai paling kecil dibanding −4,0,8, sehingga Andi sebenarnya\nmencatatkan skor paling rendah."}, {"text": "Bobby mendapatkan perolehan skor yang bernilai lebih tinggi atau lebih baik dibandingkan\nperolehan skor milik Andi.", "answer": "Benar", "explanation": "Skor Bobby −4, skor Andi −15. Karena nilai −4 > −15, maka perolehan poin Bobby bernilai lebih\nbesar dari Andi."}, {"text": "Pemain dengan perolehan nilai positif satu-satunya dalam papan skor adalah Cinta.", "answer": "Benar", "explanation": "Di antara skor −15, −4,8,0, nilai 8 (milik Cinta) adalah satu-satunya bilangan bulat positif di papan\nskor."}, {"text": "Daniel mencatatkan skor bernilai lebih banyak dan lebih besar dibanding poin yang diraih\nBobby.", "answer": "Benar", "explanation": "Skor Daniel 0 dan Bobby −4. Dalam sistem koordinat bilangan bulat, angka 0 bernilai lebih besar\ndaripada setiap bilangan bulat negatif (0 > −4)."}]}, {"number": 13, "level": 2, "type": "Analisis Pernyataan", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Para surveyor topografi memploting kedudukan geografis ketinggian tanah di NTT relatif diukur\nmengandalkan angka patokan dasar nol berupa ketinggian bidang garis permukaan samudera\nterlepas. Letak darat Titik P teras permukaan karang terjal tepi jurang berada setinggi 45 meter\nke atas permukaan air, sela sempit dari rekahan palung air laut terdalam bertajuk Titik Q\ndiletakkan tenggelam di posisi sedalam 90 meter ke bawah air dasar nol samudera, dan\nkonstruksi atap menara rambu mercusuar berkode Titik R terposisi lurus searah tegak lurus\nmengangkasa membubung naik sejauh 150 meter tepat ditarik vertikal berawal landasan bawah\ndasar letaknya Titik Q berada. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Lokasi wilayah Titik R apabila direpresentasikan lewat penentuan koordinat grafik ketinggian\nberangka di dalam peta berangka diwakili bilangan +60 meter.", "answer": "Benar", "explanation": "Palung bawah laut Titik Q berpatokan posisi −90 meter di dasar laut terluas. Diukur dari lantai\nterdalam terangkat lurus sepanjang +150 meter vertikal membubung, koordinat dari ujung\npemancar R berada pada level posisi = −90 + 150 = +60 meter di atas batas permukaan nol."}, {"text": "Letak jurang Titik P dengan perambatan tinggi yang dimiliki oleh struktur terpasang Titik R\nberkedudukan dipisahkan margin setinggi 25 meter perbedaan lurus tegaknya.", "answer": "Salah", "explanation": "Darat tepi tebing laut Titik P terletak kokoh di elevasi koordinat +45 meter dan tumpuan ujung\nletak pemancar R berada di elevasi +60 meter. Tingkat deviasi yang mencatat pembatas ruang\ntebal ruang sela keduanya = |60 −45| = 15 meter saja, bukan sejauh 25 meter."}, {"text": "Wilayah titik kedalaman pada kriteria geografis pesisir pantai berkode wilayah Q terdata\nmenyabet sebutan level yang paling teratas puncaknya saat sebaran titik ditinjau satu-satu\nsecara rata.", "answer": "Salah", "explanation": "Titik Q merepresentasikan kondisi sebuah sela retakan palung air terdalam di NTT dengan status\npenunjuk nomor level koordinat paling terbenam dan kecil senilai −90 meter, bukan letak posisi\ntertinggi di antara semua area pemetaan Titik R (+60 meter) maupun tebing daratan Titik P (+45\nmeter)."}, {"text": "Total pemetaan rentang jelajah perjalanan tali derek gantung bilamana dibentangkan ditarik\nsecara murni lurus menyambungkan kedudukan Titik Q lurus membujur merapat menyentuh pos\nberlabuh Titik P haruslah sepanjang rentang ukuran sebesar 135 meter penuh.", "answer": "Benar", "explanation": "Bantalan tancap darat Titik P berada pada elevasi +45 meter berbanding titik terdalam rekahan\nlubang parit bahari Titik Q pada elevasi −90 meter di bawah nol air laut. Rentangan panjang\nkabel vertikal tebal kawat = 45 −(−90) = 135 meter utuh kelurusan lurusnya."}]}, {"number": 14, "level": 2, "type": "Analisis Pernyataan", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Posisi penyelam dan hewan laut dideteksi relatif terhadap permukaan laut. Penyelam A berada\n12 meter di bawah permukaan laut, Penyelam B berada 25 meter di bawah permukaan laut,\nKapal Selam C berada 75 meter di bawah permukaan laut, dan seekor penyu D berada 5 meter\ndi bawah permukaan laut. Jika posisi di atas permukaan laut dinyatakan dengan bilangan bulat\npositif dan di bawah permukaan laut dinyatakan dengan bilangan bulat negatif, tentukan benar\natau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Penyelam B berada lebih dekat ke permukaan laut daripada Kapal Selam C karena −25 > −75\nmeter.", "answer": "Benar", "explanation": "Pada kedalaman air laut, penyelam B (−25 m) dan Kapal Selam C (−75 m). Nilai −25 lebih besar\n(atau lebih mendekati 0 selaku permukaan) dibanding −75. Oleh sebab itu penyelam B letaknya\nlebih dekat ke permukaan daripada kapal selam C."}, {"text": "Representasi koordinat posisi Penyelam A, Penyelam B, Kapal Selam C, dan penyu D secara\nberurutan adalah 12 meter, 25 meter, 75 meter, dan 5 meter.", "answer": "Salah", "explanation": "Pernyataan salah karena posisi di bawah permukaan laut seharusnya ditunjukkan menggunakan\nnotasi negatif: −12 meter, −25 meter, −75 meter, dan −5 meter."}, {"text": "Selisih kedalaman vertikal antara Penyelam A dan Kapal Selam C adalah sejauh 63 meter.", "answer": "Benar", "explanation": "Selisih kedalaman dihitung dengan selisih mutlak dari nilai posisi keduanya: | −12 −(−75)| = | −\n12 + 75| = 63 meter."}, {"text": "Penyu D berada pada posisi kedalaman yang paling rendah atau dalam di antara seluruh objek\nlaut karena −5 adalah nilai terkecil pada deretan bilangan −5, −12, −25, dan −75.", "answer": "Salah", "explanation": "Pernyataan salah karena bilangan bulat −5 memiliki nilai terbesar di antara deretan bilangan\ntersebut, yang mengindikasikan posisinya adalah yang paling dangkal (paling dekat dengan\npermukaan air)."}]}, {"number": 15, "level": 3, "type": "Analisis Pernyataan", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Seorang praktisi bimbingan konseling matematika mendata rentetan penyelesaian mandiri para\nsiswa di lembar tugas uji operasional komparasi pengerjaan evaluasi aljabar bertopik perhitungan\nberderet hierarki tanda tanda bilangan campuran. Di papannya terbentang rentetan perhitungan\nyang ditugaskan kepada siswa yaitu: 15 −3 × (−4) + (−20) ÷ 5. Empat kontestan masing-\nmasing mengkritisi alur langkah pembongkaran matematika ini secara sistematis guna divalidasi\nkebenarannya oleh mentor. Tentukan benar atau salah nilai kritis para siswa tersebut terhadap\nprosedur pemecahan hierarki numerik di bawah ini!", "statements": [{"text": "Rara menunjukkan hasil penemuannya bahwa tahapan paling penting dalam menetapkan\nlandasan penyederhanaan prioritas di rute depan jika dikupas secara soliter terlebih dahulu akan\nmenyuguhkan sumbangan angka penyebaran perkalian −3 × (−4) menghasilkan pengubah\nkonstanta bernilai positif sebesar 12.", "answer": "Benar", "explanation": "Pada asas hierarki penyederhanaan perhitungan, letak relasi bilangan negatif perkalian saling\nberhadapan terstruktur membuahkan tanda sejenis sejalan: −3 × (−4) = +12 positif beroperasi\nlancar memperkokoh hasil ke depan, bukan sekedar angka belaka."}, {"text": "Roni menganalisis letak kesalahannya sendiri tatkala di kertas corat-coret awal secara teledor\nmemulai hitungan di lajur sisi kiri terluar tanpa hirauan yakni menyelesaikan terlebih dahulu model\n15 −3 menghasilkan angka 12 untuk dikalikan belakangan sehingga keluar jawaban\nmenyimpang jauh, Rara membetulkan Roni bahwa itu fatal akibat mengacuhkan prioritas hierarki\nhitungan matematika baku (Kabataku).", "answer": "Benar", "explanation": "Asas prioritas matematika yang resmi mengamanatkan dilarang memotong kompas urutan\npengurangan/penjumlahan depan terlebih dulu ketika bersinggungan diselubungi di sekelilingnya\nberupa instrumen pemicu pengalian bersarang seperti rute asalnya. Pembetulan Rara terhadap\nkegagalan runtunan model Roni sangat sahih."}, {"text": "Tika menjabarkan tahapan operasionalnya hingga selesai langkah demi langkah, sehingga\nmemperoleh kesimpulan final perhitungan utuh dari kombinasi rantai tersebut melabuhkan skor\nsah berangka tunggal 23.", "answer": "Benar", "explanation": "Rangkaian runut sistem operasional matematika Tika yang berlandaskan hukum kasta\npengerjaan aritmatika terpadu diringkas runut: 15 −(3 × (−4)) + ((−20) ÷ 5) = 15 −(−12) +\n(−4) = 15 + 12 −4 = 27 −4 = 23. Maka pengerjaan murni ini benar mutlak."}, {"text": "Andi mengklaim bahwa ia telah menghitung pengerjaan dan memperoleh nilai −27 karena\nberkeras mendefinisikan pembagian berposisi murni terikat yaitu (−20) ÷ 5 akan meloloskan\n\nraihan skor ganjil yang jika digabungkan pada perhitungan besar memberikan sumbangan\nbertingkat lurus −5.", "answer": "Salah", "explanation": "Dari evaluasi audit kritis guru: proses perhitungan pembagian nilai bilangan negatif berbeda\nmuatan murni terkelupas mematuh prinsip pemecahan konseptual dasar yakni (−20) ÷ 5 = −4,\ntidak bisa dipelintir menguap berubah dilarikan menjadi −5 ataupun berlanjut merombak\nkeseleruhan penyusunan menjadi total minus ganjil acak."}]}, {"number": 16, "level": 3, "type": "Analisis Pernyataan", "objective": "Menjelaskan, menyatakan, membandingkan, mengurutkan bilangan bulat", "question": "Harga saham perusahaan properti di bursa investasi domestik bergejolak dari penutupan\nperdagangan pekan sebelumnya seharga Rp5.000,00. Nilai pasang surut harian dalam seminggu\nberikutnya dicatatkan berurutan sebagai berikut: Senin mengalami pelemahan (turun) sebesar\nRp350,00, Selasa menguat naik kembali sebesar Rp150,00, Rabu tersungkur lesu (turun) senilai\nRp200,00, serta Kamis menguat melambung kencang (naik) sebesar Rp600,00. Gerak\npelemahan dilambangkan dengan integer negatif dan kenaikan dilambangkan dengan integer\npositif. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai histori transaksi nilai\nsaham tersebut!", "statements": [{"text": "Jumlah akumulatif perubahan total neto selisih nilai nominal harga per lembar saham setelah\nditutup di hari Kamis menunjukkan adanya keuntungan bersih Rp200,00 dari harga awal pekan.", "answer": "Benar", "explanation": "Akumulasi matematika bilangan bulat: −350 + 150 −200 + 600 = +200. Terjadi pertambahan\nbersih bertanda positif senilai Rp200,00 di ujung pengamatan dibandingkan nilai pondasi harga\nawal Rp5.000,00. Pernyataan ini benar."}, {"text": "Hasil akhir posisi valuasi harga per lembar dari saham perusahaan tersebut sewaktu\nperdagangan hari Kamis sore resmi ditutup berada di level harga Rp5.200,00.", "answer": "Benar", "explanation": "Harga penutupan hari Kamis sore: Rp5.000,00 + (+200,00 𝑎𝑘𝑢𝑚𝑢𝑙𝑎𝑠𝑖 𝑠𝑒𝑙𝑖𝑠𝑖ℎ) = 𝑅𝑝5.200,00$ per\nlembar. Pernyataan bernilai benar."}, {"text": "Selama siklus pekan dinamis tersebut berlangsung, catatan level titik nadir paling murah\n(posisi terendah harga) jatuh di hari penutupan Rabu sore senilai Rp4.450,00.", "answer": "Salah", "explanation": "Masing-masing tingkat harian penutupan: Senin (Rp5.000 −350 = 4.650), Selasa (4.650 + 150 =\n4.800), Rabu (4.800 −200 = 4.600), dan Kamis (5.200). Titik terendah adalah Rabu dengan harga\nRp4.600,00, bukan Rp4.450,00. Maka salah."}, {"text": "Pola laju angka rata-rata fluktuasi riil (perubahan nilai) yang dirasakan setiap pergantian hari\nberturut-turut setara dengan penguatan lurus stabil senilai Rp100,00 per harinya.", "answer": "Salah", "explanation": "Total netto perubahan bertambah sebesar Rp200,00. Durasi fluktuasi transisi harian dari posisi\nSenin hingga Kamis dinilai melewati 4 rentetan sesi hari, sehingga nilai rata-ratanya:\nRp200,00/4 = Rp50,00 kenaikan bersih tiap harinya, bukan Rp100,00."}]}, {"number": 17, "level": 1, "type": "Pilihan Ganda", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Dua buah lampu hias di Taman Pelangi Yogyakarta menyala secara berkala. Lampu merah\nmenyala setiap 12 detik sekali, sedangkan lampu hijau menyala setiap 15 detik sekali. Kelipatan\nPersekutuan Terkecil (KPK) dari periode menyala kedua lampu tersebut adalah ....", "options": [{"key": "A", "text": "3 detik"}, {"key": "B", "text": "30 detik"}, {"key": "C", "text": "60 detik"}, {"key": "D", "text": "180 detik"}], "answer": "C", "explanation": "Langkah 1: Tentukan faktorisasi prima dari 12 dan 15.\n12 = 22 × 3\n15 = 3 × 5\nLangkah 2: Tentukan KPK dengan mengalikan semua faktor prima dengan pangkat terbesar.\n𝐾𝑃𝐾= 22 × 3 × 5 = 4 × 3 × 5 = 60 detik."}, {"number": 18, "level": 1, "type": "Pilihan Ganda", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Banyaknya seluruh faktor positif dari bilangan 40 adalah ....", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "6"}, {"key": "C", "text": "8"}, {"key": "D", "text": "10"}], "answer": "C", "explanation": "Langkah 1: Tentukan semua faktor positif dari 40. Faktor-faktor tersebut adalah 1, 2, 4, 5, 8, 10,\n20, dan 40.\nLangkah 2: Hitung jumlah seluruh faktor tersebut, yaitu sebanyak 8 buah."}, {"number": 19, "level": 2, "type": "Pilihan Ganda", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Toko kelontong milik Pak Joko di Solo menerima kiriman beras setiap 12 hari sekali dan minyak\ngoreng setiap 18 hari sekali. Jika pada tanggal 1 September 2026 toko tersebut menerima kedua\nkiriman secara bersamaan, pada tanggal berapakah toko Pak Joko akan menerima kedua\nkiriman tersebut secara bersamaan untuk berikutnya?", "options": [{"key": "A", "text": "5 Oktober 2026"}, {"key": "B", "text": "6 Oktober 2026"}, {"key": "C", "text": "7 Oktober 2026"}, {"key": "D", "text": "13 Oktober 2026"}], "answer": "C", "explanation": "Langkah 1: Tentukan kelipatan pertemuan berikutnya dengan mencari KPK dari 12 dan 18.\nFaktorisasi prima dari 12 = 22 × 3 dan 18 = 2 × 32. Maka, 𝐾𝑃𝐾(12,18) = 22 × 32 = 36 hari.\nLangkah 2: Tambahkan 36 hari ke tanggal keberangkatan awal (1 September 2026). Karena\nbulan September memiliki 30 hari, maka setelah lewat 29 hari di bulan September, sisa hari yang\ndibutuhkan adalah 36 −29 = 7 hari lagi di bulan Oktober. Jadi, kiriman berikutnya bersamaan\npada tanggal 7 Oktober 2026."}, {"number": 20, "level": 2, "type": "Pilihan Ganda", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Panitia bakti sosial di Bandung mengumpulkan 120 kantong beras dan 144 botol minyak goreng\nuntuk dibagikan kepada keluarga prasejahtera. Setiap keluarga akan menerima paket dengan isi\nberas dan minyak goreng sama banyak. Jika panitia ingin membagikan paket tersebut kepada\nsebanyak mungkin keluarga tanpa sisa, berapakah jumlah beras dan minyak goreng di setiap\npaketnya?", "options": [{"key": "A", "text": "4 kantong beras dan 5 botol minyak goreng"}, {"key": "B", "text": "5 kantong beras dan 6 botol minyak goreng"}, {"key": "C", "text": "6 kantong beras dan 5 botol minyak goreng"}, {"key": "D", "text": "10 kantong beras dan 12 botol minyak goreng"}], "answer": "B", "explanation": "Langkah 1: Tentukan FPB dari jumlah kantong beras (120) dan botol minyak goreng (144).\nFaktorisasi prima dari 120 = 23 × 3 × 5 dan 144 = 24 × 32. FPB dari kedua bilangan adalah\n23 × 3 = 24, yang menyatakan jumlah paket maksimal yang dapat dibuat.\nLangkah 2: Hitung isi masing-masing barang dalam satu paket.\nBeras per paket: 120 ÷ 24 = 5 kantong. Minyak goreng per paket: 144 ÷ 24 = 6 botol."}, {"number": 21, "level": 3, "type": "Pilihan Ganda", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Di sebuah stasiun bus di Surabaya, Bus Rute A berangkat setiap 15 menit sekali dan Bus Rute B\nberangkat setiap 20 menit sekali. Pada pukul 06.00 pagi, kedua bus berangkat bersamaan untuk\npertama kalinya. Diketahui bahwa stasiun tersebut memberikan subsidi Rp100.000,00 untuk\nsetiap kali keberangkatan bersamaan kedua rute bus tersebut. Jika stasiun beroperasi dari pukul\n06.00 hingga 11.00 siang, berapakah total subsidi yang harus dikeluarkan oleh stasiun untuk\nkeberangkatan bersamaan kedua bus tersebut (termasuk saat pukul 06.00)?", "options": [{"key": "A", "text": "Rp300.000,00"}, {"key": "B", "text": "Rp400.000,00"}, {"key": "C", "text": "Rp500.000,00"}, {"key": "D", "text": "Rp600.000,00"}], "answer": "D", "explanation": "Mencari selang waktu keberangkatan bersamaan dengan menghitung KPK dari 15 dan 20.\nKPK dari 15 dan 20 adalah 60 menit (1 jam).\nMenghitung durasi operasional stasiun dari pukul 06.00 hingga 11.00 siang, yaitu 5 jam.\nMenghitung frekuensi keberangkatan bersamaan: Pada pukul 06.00, 07.00, 08.00, 09.00, 10.00,\ndan 11.00. Totalnya adalah 6 kali keberangkatan bersamaan.\nMenghitung total subsidi: 6 × 𝑅𝑝100.000,00 = 𝑅𝑝600.000,00."}, {"number": 22, "level": 3, "type": "Pilihan Ganda", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Ibu Aminah ingin membuat parsel buah yang terdiri atas 42 buah apel, 56 buah jeruk, dan 70\nbuah mangga. Buah-buah tersebut dimasukkan ke dalam keranjang parsel sebanyak-banyaknya\ndengan isi yang identik tanpa ada buah yang tersisa. Setiap keranjang kosong dibeli dengan\nharga Rp12.000,00. Jika Ibu Aminah menjual setiap parsel yang sudah jadi dengan harga\nRp75.000,00, berapakah sisa pendapatan kotor Ibu Aminah setelah dikurangi biaya pembelian\nseluruh keranjang kosong tersebut?", "options": [{"key": "A", "text": "Rp750.000,00"}, {"key": "B", "text": "Rp882.000,00"}, {"key": "C", "text": "Rp1.050.000,00"}, {"key": "D", "text": "Rp1.218.000,00"}], "answer": "B", "explanation": "Langkah 1: Tentukan jumlah maksimal parsel buah yang dapat dibuat menggunakan FPB dari 42,\n56, dan 70. Faktorisasi prima: 42 = 2 × 3 × 7, 56 = 23 × 7, dan 70 = 2 × 5 × 7. Maka,\n𝐹𝑃𝐵(42,56,70) = 2 × 7 = 14 parsel.\nLangkah 2: Hitung total pendapatan dari penjualan 14 parsel: 14 × 𝑅𝑝75.000,00 =\n𝑅𝑝1.050.000,00.\nLangkah 3: Hitung biaya pembelian keranjang kosong untuk 14 parsel: 14 × 𝑅𝑝12.000,00 =\n𝑅𝑝168.000,00.\nLangkah 4: Hitung sisa pendapatan kotor: 𝑅𝑝1.050.000,00 −𝑅𝑝168.000,00 = 𝑅𝑝882.000,00."}, {"number": 23, "level": 1, "type": "Analisis Pernyataan", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Diberikan bilangan bulat 60 yang akan ditentukan faktorisasi primanya menggunakan metode\npohon faktor atau pembagian berulang. Beri tanda centang (✓) pada setiap pernyataan yang\nbenar mengenai bilangan bulat 60 tersebut!", "statements": [{"text": "Faktorisasi prima dari 60 adalah 22 × 3 × 5.", "answer": "Benar", "explanation": "22 × 3 × 5 = 4 × 3 × 5 = 60, semua basis adalah bilangan prima."}, {"text": "Bilangan 60 memiliki 3 faktor prima berbeda, yaitu 2, 3, dan 5.", "answer": "Benar", "explanation": "Faktor prima pembagi 60 adalah 2, 3, dan 5."}, {"text": "Faktorisasi prima dari 60 mengandung angka 7 sebagai faktor prima terkecilnya.", "answer": "Salah", "explanation": "Tidak ada angka 7 pada faktorisasi prima 60."}, {"text": "Salah satu pembagi prima dari 60 adalah 5.", "answer": "Benar", "explanation": "60 habis dibagi 5 yang merupakan salah satu faktor primanya."}]}, {"number": 24, "level": 1, "type": "Analisis Pernyataan", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Siswa ekstrakurikuler mengikuti dua kelompok bela diri dengan jeda durasi giliran berlatih\nberkala, yaitu kelompok A berlatih 8 hari sekali dan kelompok B bergiliran tiap 12 hari sekali. Beri\ntanda centang (✓) pada setiap pernyataan yang benar!", "statements": [{"text": "Bilangan terkecil sebagai pencari pembagi yang menentukan faktor persekutuan terbesar\n(FPB) hari berlatih mereka berdua memiliki nilai senilai 2.", "answer": "Salah", "explanation": "Nilai FPB(8, 12) dihitung dari pengalihan kuadrat perpangkatan prima terendahnya adalah setara\ndengan 4, bukan 2."}, {"text": "Setiap giliran periode siklus sebanyak tepat 24 hari berlalu, kedua kelompok bela diri tersebut\ndipastikan berlatih serempak kembali secara terjadwal.", "answer": "Benar", "explanation": "Mengaplikasikan KPK dari pasangan hari 8 dan 12 yang menghasilkan pencarian kelipatan\nperiodenya tepat jatuh pada jangka 24 hari."}, {"text": "Struktur representasi faktorisasi prima pengolah perhitungan mencari kelipatan terkecil waktu\nlatihan terjadwal tersebut dituliskan 23 × 3.", "answer": "Benar", "explanation": "Faktorisasi KPK diambil berdasarkan aturan kuadrat eksponensial maksimal yaitu berupa\nperumusan 23 × 3 (yang berkuantitas 8 × 3 = 24)."}, {"text": "Bentuk perpangkatan dasar dari faktor persekutuan terbesar (FPB) penentuan porsi\npengulangan waktu terpadu bilangan 8 dan 12 ditulis sebagai 23.", "answer": "Salah", "explanation": "FPB dari 8 (23) dan 12 (22 × 3) adalah ditentukan oleh perpangkatan terendahnya yaitu berupa\nbentuk 22 = 4, bukan 23."}]}, {"number": 25, "level": 2, "type": "Analisis Pernyataan", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Dalam rangka menyambut hari festival pariwisata kuliner di Bali, seorang pengrajin menyiapkan\nsuvenir berupa 30 buah gantungan kunci kayu dan 45 buah gelang rotan untuk dimasukkan\nsecara merata ke dalam beberapa wadah tas bingkisan tanpa sisa. Tentukan benar atau salah\nuntuk setiap pernyataan berikut yang menerangkan kapasitas maksimum wadah serta\nperbandingan isi dari setiap wadah suvenir yang disiapkan!", "statements": [{"text": "Banyaknya kantong bingkisan paling banyak yang dapat dibuat oleh pengrajin tersebut adalah\n5 buah.", "answer": "Salah", "explanation": "Langkah 1: Menentukan jumlah wadah paling banyak melalui perhitungan FPB dari ketersediaan\nstok suvenir: 30 = 2 × 3 × 5 dan 45 = 32 × 5, maka diperoleh 𝐹𝑃𝐵(30,45) = 3 × 5 = 15 buah\nkantong. Langkah 2: Berdasarkan temuan, kuantitas tas terbanyak yang sah terbentuk adalah 15\nbuah wadah kantong, bukan 5 buah wadah kantong. Jadi pernyataan bernilai Salah."}, {"text": "Setiap kantong bingkisan maksimal tersebut berisi 3 gantungan kunci kayu.", "answer": "Salah", "explanation": "Langkah 1: Ambil nilai pembagian rata jumlah muatan terbanyak di setiap kantong yakni senilai\nFPB yaitu 15. Langkah 2: Bagikan persediaan stok total kunci kayu kepada kapasitas tas paling\nmaksimal: 30 ÷ 15 = 2 buah gantungan kunci kayu untuk setiap paket bingkisannya. Oleh karena\nitu, pengakuan isian berjumlah 3 buah bernilai Salah."}, {"text": "Jika isi kantong tersebut dikeluarkan, rasio jumlah gantungan kunci kayu dibanding gelang\nrotan di setiap kantong adalah 2: 3.", "answer": "Benar", "explanation": "Langkah 1: Nilai masing-masing pengemas per satu wadah kantong ditentukan pembagian FPB\n15 tadi. Langkah 2: Tiap bungkus akan berisi 30 ÷ 15 = 2 kunci kayu dan 45 ÷ 15 = 3 gelang\nrotan. Bandingkan porsi masing-masing elemen menjadi perbandingan bentuk rasio sederhana\nyakni 2: 3. Hal ini berarti pernyataan ini Benar."}, {"text": "Setiap kantong bingkisan maksimal tersebut berisi total gabungan 5 buah barang kerajinan.", "answer": "Benar", "explanation": "Langkah 1: Ambil banyak isian satuan dari sisa perhitungan membagi habis barang peroleh per\nkantong dengan pembagi merata yaitu FPB 15 pengemas. Langkah 2: Satu paket mewakili\ngabungan dari hasil 30 ÷ 15 = 2 buah kunci ditambah dengan hasil 45 ÷ 15 = 3 gelang rotan.\nTotal isi berisikan sejumlah 2 + 3 = 5 buah aneka suvenir. Maka pernyataan ini bernilai Benar."}]}, {"number": 26, "level": 2, "type": "Analisis Pernyataan", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Andi mempelajari sifat faktor dari bilangan bulat negatif dan menentukan seluruh pasangan faktor\nbulat dari bilangan −12. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai\nfaktor-faktor tersebut!", "statements": [{"text": "Ada sebanyak 12 bilangan bulat yang menjadi faktor dari bilangan −12.", "answer": "Benar", "explanation": "Langkah 1: Menentukan seluruh faktor dari −12. Pembagi bulat dari −12 adalah\n±1, ±2, ±3, ±4, ±6, ±12. Total terdapat 12 bilangan bulat yang menjadi faktor (Pernyataan benar)."}, {"text": "Hasil kali pasangan faktor bulat (3, −4) dan (−2,6) bernilai persis sama dengan −12.", "answer": "Benar", "explanation": "Langkah 2: Memverifikasi perkalian faktor. Pasangan (3) × (−4) = −12 dan (−2) × 6 = −12.\nKeduanya benar merupakan sepasang faktor (Pernyataan benar)."}, {"text": "Semua bilangan prima merupakan faktor positif dari bilangan −12.", "answer": "Salah", "explanation": "Langkah 1: Menentukan faktor positif yaitu 1,2,3,4,6,12. Angka seperti 1,4,6,12 bukan merupakan\nbilangan prima, dan tidak semua bilangan prima di dunia merupakan faktor positif dari −12\n(Pernyataan salah)."}, {"text": "Faktor positif dari −12 yang terkecil dan yang terbesar jika dikalikan bernilai genap.", "answer": "Benar", "explanation": "Langkah 2: Faktor positif terkecil adalah 1 dan terbesar adalah 12. Hasil kalinya adalah 1 × 12 =\n12, yang merupakan bilangan genap (Pernyataan benar)."}]}, {"number": 27, "level": 3, "type": "Analisis Pernyataan", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Pada ruang pabrik manufaktur sandang garmen terpasang tiga perangkat robot pengepak\notomatis kompartemen. Robot kemasan tipe X beraktivitas membalut kemeja dengan teratur per\nselang waktu 36 detik, robot kemas Y memotong dan membungkus setiap interval 48 detik,\nsementara unit robot pengepak Z berjalan rutin pada frekuensi periodik tiap 60 detik sekali. Ketiga\ninstrumen mekanikal otomatis itu dipicu melakukan proses dari tombol nyala serentak awal pada\nketukan detik pertama pukul 13:00 siang WIB. Setiap unit unit robot mengonsumsi daya dinamo\nmotor listrik berkecepatan dinamis masing-masing 120 Watt untuk robot X, 150 Watt untuk robot\nY, dan sebesar 180 Watt pada robot Z. Tentukan benar atau salah untuk setiap pernyataan\nberikut!", "statements": [{"text": "Selisih waktu jeda hingga ketiga jenis instrumen mekanikal itu saling bekerja melakukan paking\nserempak kedua kali jatuh pada pukul 13:10 WIB.", "answer": "Salah", "explanation": "Langkah 1: Menentukan kelipatan persekutuan terkecil (KPK) dari interval periode gerak paking\nketiganya yakni 36, 48, dan 60 detik. Indeks primanya 36 = 22 × 32, 48 = 24 × 3, dan 60 =\n22 × 3 × 5. Langkah 2: KPK = 24 × 32 × 5 = 16 × 9 × 5 = 720 detik. Langkah 3: Konversi 720\ndetik ke dalam besaran waktu menit diperoleh 720/60 = 12 menit. Jadi, masa serentak menyala\nlagi bersama di awal pada ketukan berikutnya jatuh pukul 13:12 siang WIB, sehingga penulisan\nwaktu 13:10 adalah salah."}, {"text": "Struktur matematis aslinya untuk menyatakan bentuk pola perpangkatan faktorisasi prima dari\njarak durasi singkron waktu ketiganya melilit paket secara padu adalah 24 × 32 × 5.", "answer": "Benar", "explanation": "Langkah 1: Memetakan dari pengerjaan sebelumnya bahwa nilai siklus bersama atau KPK\nperiodik mesin adalah sejauh 720 detik. Langkah 2: Menerjemahkan konstanta bulat bernilai\nkuantitas waktu 720 ke pola sediaan susunan eksponen prima penyusun aslinya. Langkah 3:\nDidapatkan 720 = 16 × 45 = 24 × 32 × 5. Hal tersebut bersesuaian."}, {"text": "Kombinasi total banyaknya barang bungkusan kemeja buatan murni buatan dari dinamo alat\notomatis jenis X dan Z secara spesifik porsinya adalah 25 lembar kemasan.", "answer": "Salah", "explanation": "Langkah 1: Memposisikan kuantitas limit detikan hingga siklus berulang penuh tercapai sejauh\n720 detik. Langkah 2: Menghitung porsi sisa kelolosan robot unit masing-masing selama tempo\ninterval itu. Porsi tipe kustom robot X = 720/36 = 20 helai paking pakaian. Porsi kerja mesin Z =\n720/60 = 12 porsi lembaran bungkus kargo garmen. Langkah 3: Gabungkan jumlah murni\nkemeja sukses yang diproduksi dari jenis X + Z = 20 + 12 = 32 baju bungkus kemeja, tidak\nsesuai jumlahan numerik 25."}, {"text": "Besaran keseluruhan sediaan jatah konsumsi listrik puncak beban instan elektrik yang\ndikonsumsi pabrik saat sistem otomasi memutar dinamo kerja berkoordinasi padu adalah 450\nWatt.", "answer": "Benar", "explanation": "Langkah 1: Memahami momen beban sinkron saat ketiganya menyala melakukan proses robotik\nmembeban kelistrikan seketika. Langkah 2: Melacak andil beban murni dari ketersediaan sirkuit\nalat garmen: daya unit robot X (120 W), unit robot Y (150 W), dan robot otomatis Z (180 W).\nLangkah 3: Menggunakan prosedur hitung penambahan dasar muatan arus listrik simultan: 120 +\n150 + 180 = 450 Watt."}]}, {"number": 28, "level": 3, "type": "Analisis Pernyataan", "objective": "Menentukan faktor dari bilangan bulat dan menghubungkan faktorisasi prima dari dua bilangan dengan KPK dan FPB", "question": "Pengurus karang taruna di Yogyakarta menyiapkan cinderamata paket alat belajar go-green\ndengan jumlah persediaan 108 buku kertas daur ulang dan 180 bolpen kayu kelapa ramah\nlingkungan yang dikemas rata per kemasan kustom serutan rami bernilai harga produksi\nRp8.000,00 per kemas kustom. Beri tanda centang (✓) pada setiap pernyataan yang benar!", "statements": [{"text": "Jumlah tas kain serut terbanyak yang dapat dikemas merata oleh panitia karang taruna tanpa\ntersisa adalah sebanyak 36 tas.", "answer": "Benar", "explanation": "Langkah 1: Menentukan FPB dari 108 dan 180. Faktorisasi prima: 108 = 22 × 33, 180 =\n22 × 32 × 5. FPB = 22 × 32 = 36 tas maksimal."}, {"text": "Biaya total pembuatan seluruh tas kain serut yang dihabiskan panitia untuk pengemasan\nmaksimal adalah Rp324.000,00.", "answer": "Salah", "explanation": "Berdasarkan kemasan maksimum sebanyak 36 tas, total pembuatannya adalah\n36 × 𝑅𝑝8.000,00 = 𝑅𝑝288.000,00, bukan Rp324.000,00."}, {"text": "Pada komposisi kemasan terbanyak yang dapat dibuat, masing-masing tas kustom memuat 3\npak buku kertas daur ulang dan 5 buah bolpen bambu.", "answer": "Benar", "explanation": "Langkah 2: Tiap tas kemasan memuat: buku =\n108\n36 = 3 pak dan bolpen =\n180\n36 = 5 buah."}, {"text": "Selisih jumlah pak buku daur ulang dalam setiap tas kustom antara opsi penyebaran ke 12 tas\ndibandingkan opsi 36 tas adalah 6 pak buku.", "answer": "Benar", "explanation": "Langkah 3: Porsi buku pada sebaran 12 kemasan =\n108\n12 = 9 pak. Sedangkan sebaran 36\nkemasan adalah 3 pak. Selisih isi pak buku daur ulang = 9 −3 = 6 pak buku."}]}, {"number": 29, "level": 1, "type": "Pilihan Ganda", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Suhu sebuah bongkahan es mula-mula adalah −8∘C. Karena dimasukkan kembali ke dalam\nfreezer yang lebih dingin, suhu es tersebut turun lagi sebesar 5∘C. Suhu es sekarang adalah ....", "options": [{"key": "A", "text": "−13∘C"}, {"key": "B", "text": "−3∘C"}, {"key": "C", "text": "3∘C"}, {"key": "D", "text": "13∘C"}], "answer": "A", "explanation": "Langkah 1: Menentukan suhu awal bongkahan es yaitu −8∘C.\nLangkah 2: Menghitung suhu baru karena es dimasukkan ke dalam freezer yang lebih dingin\nsehingga suhunya turun sebesar 5∘C, diperoleh −8 −5 = −13∘C."}, {"number": 30, "level": 1, "type": "Pilihan Ganda", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Pada tes penerimaan siswa baru, setiap jawaban benar diberi skor 4, salah diberi skor −2, dan\ntidak dijawab diberi skor 0. Jika Budi menjawab benar 20 soal dan semua soal lainnya tidak\ndijawab, total skor yang diperoleh Budi adalah ....", "options": [{"key": "A", "text": "80"}, {"key": "B", "text": "100"}, {"key": "C", "text": "120"}, {"key": "D", "text": "160"}], "answer": "A", "explanation": "Langkah 1: Menghitung skor dari jawaban benar yaitu 20 × 4 = 80.\nLangkah 2: Karena soal yang tidak dijawab bernilai 0, skor total Budi adalah 80 + 0 = 80."}, {"number": 31, "level": 2, "type": "Pilihan Ganda", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Suhu awal di dalam ruang penyimpanan daging adalah −18∘C. Karena terjadi pemadaman listrik,\nsuhu di dalam ruangan tersebut naik sebesar 3∘C setiap jamnya. Jika pemadaman listrik\nberlangsung selama 4 jam, berapakah suhu di dalam ruang penyimpanan daging saat listrik\nmenyala kembali?", "options": [{"key": "A", "text": "−30∘C"}, {"key": "B", "text": "−18∘C"}, {"key": "C", "text": "−6∘C"}, {"key": "D", "text": "6∘C"}], "answer": "C", "explanation": "Langkah 1: Hitung total kenaikan suhu selama 4 jam, yaitu 4 × 3∘𝐶= 12∘𝐶.\nLangkah 2: Tambahkan kenaikan suhu tersebut pada suhu awal: −18∘𝐶+ 12∘𝐶= −6∘𝐶."}, {"number": 32, "level": 2, "type": "Pilihan Ganda", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Sebuah kapal selam mula-mula berada pada kedalaman 150 meter di bawah permukaan laut.\nKapal selam tersebut kemudian bergerak naik sejauh 60 meter, lalu bergerak turun lagi sejauh 80\nmeter. Posisi kedalaman kapal selam tersebut sekarang berada pada ....", "options": [{"key": "A", "text": "170 meter di bawah permukaan laut"}, {"key": "B", "text": "130 meter di bawah permukaan laut"}, {"key": "C", "text": "90 meter di bawah permukaan laut"}, {"key": "D", "text": "10 meter di bawah permukaan laut"}], "answer": "A", "explanation": "Langkah 1: Nyatakan kedalaman awal sebagai bilangan negatif, yaitu −150 meter. Setelah kapal\nselam naik 60 meter, posisinya menjadi −150 + 60 = −90 meter.\nLangkah 2: Setelah bergerak turun sejauh 80 meter, posisinya menjadi −90 −80 = −170 meter.\nIni berarti kapal selam berada pada kedalaman 170 meter di bawah permukaan laut."}, {"number": 33, "level": 3, "type": "Pilihan Ganda", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Pak Budi membuka tabungan di bank dengan setoran awal sebesar Rp500.000,00. Setiap bulan,\nbank mengenakan biaya administrasi sebesar Rp8.000,00 dan Pak Budi rutin menabung sebesar\nRp150.000,00. Selain itu, pada bulan ke-3 dan ke-6, ia menarik uang masing-masing sebesar\nRp120.000,00 untuk kebutuhan mendesak. Berapakah saldo tabungan Pak Budi setelah berjalan\nselama tepat 6 bulan?", "options": [{"key": "A", "text": "Rp1.112.000,00"}, {"key": "B", "text": "Rp1.160.000,00"}, {"key": "C", "text": "Rp1.232.000,00"}, {"key": "D", "text": "Rp1.280.000,00"}], "answer": "A", "explanation": "Langkah 1: Hitung total setoran rutin selama 6 bulan. Pak Budi menabung 6 × 𝑅𝑝150.000,00 =\n𝑅𝑝900.000,00.\nLangkah 2: Hitung total biaya administrasi selama 6 bulan. Biaya administrasi = 6 × 𝑅𝑝8.000,00 =\n𝑅𝑝48.000,00.\nLangkah 3: Hitung total penarikan uang. Penarikan = 2 × 𝑅𝑝120.000,00 = 𝑅𝑝240.000,00.\n\nLangkah 4: Hitung saldo akhir dengan menjumlahkan setoran awal, total setoran rutin, lalu\ndikurangi total biaya administrasi dan total penarikan. Saldo akhir = 𝑅𝑝500.000,00 +\n𝑅𝑝900.000,00 −𝑅𝑝48.000,00 −𝑅𝑝240.000,00 = 𝑅𝑝1.112.000,00."}, {"number": 34, "level": 3, "type": "Pilihan Ganda", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Seorang pedagang pakaian membeli 2 kodi kaos polos dengan modal total sebesar\nRp1.600.000,00. Setengah dari seluruh kaos tersebut dijual eceran dengan harga Rp50.000,00\nper potong. Kemudian, sebanyak 15 potong kaos dijual dengan diskon khusus sehingga\nharganya menjadi Rp40.000,00 per potong, sedangkan sisa kaos lainnya dijual dengan harga\nRp30.000,00 per potong. Berapakah total keuntungan yang diperoleh pedagang tersebut setelah\nseluruh kaos habis terjual?", "options": [{"key": "A", "text": "Rp50.000,00"}, {"key": "B", "text": "Rp75.000,00"}, {"key": "C", "text": "Rp125.000,00"}, {"key": "D", "text": "Rp150.000,00"}], "answer": "D", "explanation": "Langkah 1: Tentukan jumlah total kaos. 2 kodi = 2 × 20 = 40 potong. Setengah kaos = 20 potong.\nLangkah 2: Hitung total pendapatan dari penjualan. Pendapatan penjualan pertama (20 potong) =\n20 × 𝑅𝑝50.000,00 = 𝑅𝑝1.000.000,00. Pendapatan penjualan kedua (15 potong) =\n15 × 𝑅𝑝40.000,00 = 𝑅𝑝600.000,00. Jumlah sisa kaos = 40 −20 −15 = 5 potong. Pendapatan\nsisa kaos (5 potong) = 5 × 𝑅𝑝30.000,00 = 𝑅𝑝150.000,00. Total Pendapatan = 𝑅𝑝1.000.000,00 +\n𝑅𝑝600.000,00 + 𝑅𝑝150.000,00 = 𝑅𝑝1.750.000,00.\nLangkah 3: Hitung keuntungan. Keuntungan = 𝑅𝑝1.750.000,00 −𝑅𝑝1.600.000,00 = 𝑅𝑝150.000,00."}, {"number": 35, "level": 1, "type": "Analisis Pernyataan", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Doni memiliki poin permainan awal sebanyak +120 poin. Namun, akibat melanggar peraturan\nberkendara dalam gim simulasi, ia terkena hukuman denda sebesar 45 poin. Tentukan benar\natau salah untuk setiap pernyataan matematis yang mewakili poin gim Doni berikut!", "statements": [{"text": "Hukuman denda denda pengurangan poin dalam gim tersebut dapat dilambangkan sebagai\nnilai negatif −45.", "answer": "Benar", "explanation": "Segala tipe pengurangan poin atau lisensi akibat tilang denda dicatatkan bersandi pengurangan\nbertanda negatif −45."}, {"text": "Sisa total nilai poin permainan yang dimiliki Doni setelah hukuman denda diberikan adalah 75\npoin.", "answer": "Benar", "explanation": "Sisa poin saldo milik tokoh didapatkan melalui proses operasi aljabar satu langkah yaitu 120 −\n45 = 75 poin."}, {"text": "Sisa nilai poin milik Doni sekarang adalah 165 poin karena kedua nilai tersebut digabungkan\nbersama.", "answer": "Salah", "explanation": "Kesalahan konseptual fatal mengasumsikan pertambahan akumulatif yang harusnya denda poin\ndipotong namun dilakukan jumlahan 120 + 45 = 165."}, {"text": "Pengurangan nilai poin gim yang dilakukan dihitung lewat operasi matematika 120 −45.", "answer": "Benar", "explanation": "Penggambaran operasi bentuk sisa perolehan bernilai sesuai rumus aturan gim pengurangan\nbiasa yaitu 120 −45."}]}, {"number": 36, "level": 1, "type": "Analisis Pernyataan", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Sebuah tangki penampung air darurat berisi 150 liter air. Akibat terjadi kebocoran kecil di bagian\ndasar tangki, air di dalamnya berkurang sebanyak 40 liter sebelum akhirnya lubang tersebut\nberhasil ditutup rapat kembali. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Pengurangan volume air tangki akibat kebocoran tersebut secara matematika dituliskan\nsebagai -40 liter.", "answer": "Benar", "explanation": "Keadaan hilang volume pada wadah ditafsirkan sebagai nilai arah berkurang yang bermakna\ntanda minus atau -40."}, {"text": "Sisa air bersih yang tertampung di dalam tangki pasca terjadinya peristiwa kebocoran tersebut\nadalah 110 liter.", "answer": "Benar", "explanation": "Operasi dasar sisa tampungan wadah: 150 −40 = 110. Volume bertahan masih utuh sebanyak\n110 liter."}, {"text": "Jika petugas mengisi kembali air tangki sebanyak 50 liter, maka total volume air dalam tangki\nkini menjadi 200 liter.", "answer": "Salah", "explanation": "Petugas lupa melacak volume terkini setelah sempat susut 40 liter. Air terakumulasi baru adalah:\n110 + 50 = 160 liter, bukan 200 liter."}, {"text": "Total volume air tersisa di dalam tangki penampung air tersebut bernilai positif yaitu 110 liter.", "answer": "Benar", "explanation": "Sisa air dalam fisik bak senilai 110 liter tentu bernilai positif karena menunjukkan ketersediaan\nkapasitas nyata benda cair tersebut."}]}, {"number": 37, "level": 2, "type": "Analisis Pernyataan", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Suhu udara awal di area puncak pegunungan pada waktu pagi hari terukur sebesar −5∘C,\nkemudian berangsur naik sebesar 12∘C saat menjelang siang hari, dan menurun kembali\nsedalam 9∘C saat malam hari tiba. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Suhu udara pada siang hari di puncak pegunungan tersebut sempat melonjak panas mencapai\nangka suhu 15∘C.", "answer": "Salah", "explanation": "Langkah 1: Temperatur pada siang hari naik setinggi 12∘C dari suhu −5∘C pagi. Langkah 2:\nMenghitung kondisi udara pada siang hari tersebut yaitu −5∘𝐶+ 12∘𝐶= 7∘𝐶."}, {"text": "Suhu udara di wilayah puncak gunung yang terukur ketika larut malam berada pada suhu\n−2∘C.", "answer": "Benar", "explanation": "Langkah 1: Temperatur saat siang hari mencapai hangat 7∘C. Langkah 2: Suhu berangsur\nmereda turun kembali sedalam 9∘C, menghasilkan akhir malam −2∘C karena 7∘𝐶−9∘𝐶= −2∘𝐶."}, {"text": "Perbedaan interval selisih suhu udara antara waktu siang hari yang hangat dengan malam hari\nyang dingin adalah sebesar 9∘C.", "answer": "Benar", "explanation": "Langkah 1: Memposisikan temperatur puncak udara pada siang hari 7∘C dan temperatur terdingin\nmalam hari −2∘C. Langkah 2: Menghitung jarak mutlak di antara sepasang suhu siang-malam\ntersebut, yakni 7∘𝐶−(−2∘𝐶) = 9∘𝐶."}, {"text": "Temperatur suhu pada saat larut malam berada pada kedudukan 3∘C lebih hangat daripada\ntemperatur di waktu pagi hari.", "answer": "Benar", "explanation": "Langkah 1: Data malam hari mencapai −2∘C dan waktu pagi terbekukan di tingkat −5∘C.\nLangkah 2: Menggali selisih marginnya di mana −2∘𝐶−(−5∘𝐶) = 3∘𝐶 lebih tinggi dibanding pagi\nhari."}]}, {"number": 38, "level": 2, "type": "Analisis Pernyataan", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Pak Rudi memulai usaha dagang dengan modal awal Rp5.000.000,00. Pada minggu pertama ia\nmengalami kerugian sebesar Rp450.000,00. Pada minggu kedua ia mendapatkan keuntungan\nsebesar Rp850.000,00 dari transaksinya, lalu pada minggu ketiga ia membeli tambahan\nbeberapa perlengkapan operasional usaha baru senilai Rp1.200.000,00 menggunakan kas sisa\n\ntabungan hasil usahanya. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai\nkalkulasi keuangan dan mutasi modal bersih dari operasional usaha Pak Rudi!", "statements": [{"text": "Akumulasi saldo kas milik modal usaha dagang Pak Rudi pada penghujung minggu kedua\nsebelum pembelian barang perlengkapan operasional adalah sebesar Rp5.400.000,00.", "answer": "Benar", "explanation": "Modal awal diturunkan akibat kerugian kemudian naik berkat keuntungan: 𝑅𝑝5.000.000,00 −\n𝑅𝑝450.000,00 + 𝑅𝑝850.000,00 = 𝑅𝑝5.400.000,00."}, {"text": "Total nilai laba bersih komparatif yang dibukukan pedagang sepanjang jalannya transaksi\nbisnis di dua minggu yang paling awal setara dengan laba bernilai Rp400.000,00.", "answer": "Benar", "explanation": "Keuntungan kumulatif dikurangi kerugian pada dua minggu pertama: −𝑅𝑝450.000,00 +\n𝑅𝑝850.000,00 = 𝑅𝑝400.000,00."}, {"text": "Sisa keseluruhan saldo kas akhir dari simpanan kepemilikan modal yang ada di kasir toko\nsetelah belanja alat kelengkapan kerja di minggu ketiga bersisa Rp3.800.000,00.", "answer": "Salah", "explanation": "Pengeluaran pembelian belanja mengurangi saldo kumulatif: 𝑅𝑝5.400.000,00 −𝑅𝑝1.200.000,00 =\n𝑅𝑝4.200.000,00, bukan Rp3.800.000,00."}, {"text": "Perbandingan kuantitas nominal kas bersih sesudah siklus perdagangan minggu ketiga jika\ndikontraskan terhadap aset paling awal mengalami penurunan nilai sebesar Rp800.000,00.", "answer": "Benar", "explanation": "Menghitung diferensiasi nominal aset akhir dibanding aset di mula-mula: 𝑅𝑝4.200.000,00 −\n𝑅𝑝5.000.000,00 = −𝑅𝑝800.000,00 yang bermakna susut saldo kas modal sebesar Rp800.000,00."}]}, {"number": 39, "level": 3, "type": "Analisis Pernyataan", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Bu Mira ingin membeli sebuah laptop dengan harga dasar Rp5.000.000,00. Ia mencari\nperbandingan harga terbaik dari tiga toko online yang tepercaya. Toko Alika menawarkan\npotongan diskon 15% dengan ongkos pengiriman tetap Rp80.000,00. Toko Berkah memberikan\ndiskon langsung 10% ditambah bonus potongan tunai tambahan instan sebesar Rp200.000,00\ndan gratis ongkos pengiriman. Toko Cahaya menawarkan diskon ganda bertahap 10% + 5%\ntanpa ongkos pengiriman. Beri tanda centang (✓) pada setiap pernyataan yang benar\nberdasarkan perbandingan finansial tersebut!", "statements": [{"text": "Skenario finansial transaksi milik Toko Alika mengharuskan Bu Mira mentransfer pelunasan\nlaptop tersebut di harga akhir Rp4.330.000,00.", "answer": "Benar", "explanation": "Toko Alika memberikan potongan: 15% × 5.000.000 = 750.000 rupiah, lalu ditambahkan biaya\nkirim: (5.000.000 −750.000) + 80.000 = 4.250.000 + 80.000 = 4.330.000 rupiah."}, {"text": "Pembelian instan dengan sistem cashback Toko Berkah tercatat membukukan rincian struk\nakhir senilai Rp4.500.000,00.", "answer": "Salah", "explanation": "Diskon awal Toko Berkah: 10% × 5.000.000 = 500.000 rupiah, ditambah cashback langsung\nsebesar Rp200.000,00, sehingga nominal tagihan sebenarnya: 5.000.000 −500.000 −200.000 =\n4.300.000 rupiah."}, {"text": "Jika Bu Mira bertransaksi di Toko Cahaya, besaran akumulasi pembebanan kas harga bersih\nbagi satu laptop barunya bertengger senilai Rp4.275.000,00.", "answer": "Benar", "explanation": "Kalkulasi Toko Cahaya diawali diskon pertama 10%: 5.000.000 × 0,9 = 4.500.000, diikuti\npengalian diskon sekunder 5%: 4.500.000 × 0,95 = 4.275.000 rupiah."}, {"text": "Ditinjau secara mendalam menggunakan hitungan aritmetika dasar, Toko Cahaya menawarkan\npaket hemat terbesar bagi keuangan Bu Mira dengan harga akhir transaksi Rp4.275.000,00.", "answer": "Benar", "explanation": "Toko Cahaya memberikan nilai tebus Rp4.275.000,00 yang merupakan nilai terendah dan\nmenghemat dompet konsumen dibandingkan dengan Toko Berkah (Rp4.300.000,00) serta Toko\nAlika (Rp4.330.000,00)."}]}, {"number": 40, "level": 3, "type": "Analisis Pernyataan", "objective": "Menyelesaikan permasalahan keseharian yang melibatkan konsep bilangan bulat, termasuk berkaitan dengan penguatan literasi finansial.", "question": "Seorang pedagang kelontong menginvestasikan uang tunai modal usaha belanjanya untuk 3\nkomoditas barang hasil tani segar: Cabai Merah seberat 15 kg dibeli Rp35.000,00 per kg, Tomat\nseberat 20 kg dibeli Rp12.000,00 per kg, dan Bawang Merah seberat 10 kg seharga Rp25.000,00\nper kg. Pada tahapan perjalanan distribusi logistik dari pasar pusat, didapati penyusutan akibat\nkualitas busuk yang terbuang yaitu: Cabai Merah susut 1 kg, Tomat susut 2 kg, dan Bawang\nMerah susut 1 kg. Setelahnya, sisa sayur layak dijual ecer dengan patokan harga resmi baru:\nCabai Merah seharga Rp45.000,00 per kg, Tomat Rp18.000,00 per kg, dan Bawang Merah\nseharga Rp35.000,00 per kg. Beri tanda centang (✓) pada setiap pernyataan hasil kalkulasi\nkeuangan yang benar!", "statements": [{"text": "Besaran profit bersih keuangan riil yang diraih oleh pedagang dari total transaksi penyaluran\neceran komoditas Cabai Merah saja adalah sebesar Rp105.000,00.", "answer": "Benar", "explanation": "Modal pembelian awal Cabai = 15 × 35.000 = 𝑅𝑝525.000,00. Sisa berat laku dijual = 15 −1 = 14\nkg. Pemasukan bersih penjualan eceran = 14 × 45.000 = 𝑅𝑝630.000,00. Profit bersih riil\ndidapatkan = 630.000 −525.000 = 𝑅𝑝105.000,00."}, {"text": "Biarpun menderita susut berat fisik rusak hingga seberat 2 kg pada perjalanannya, penjualan\nTomat tetap memberi sumbangsih keuntungan finansial neto senilai Rp84.000,00.", "answer": "Benar", "explanation": "Modal pembelian awal Tomat = 20 × 12.000 = 𝑅𝑝240.000,00. Berat tomat bersih laku = 20 −2 =\n18 kg. Omset Tomat ecer = 18 × 18.000 = 𝑅𝑝324.000,00. Profit keuntungan finansial neto =\n324.000 −240.000 = 𝑅𝑝84.000,00."}, {"text": "Jika dihitung bersih setelah memotong keseluruhan biaya pengadaan di depan, akumulasi\nkeuntungan neto dari 3 produk sayuran yang diraih pedagang bernilai Rp284.000,00.", "answer": "Salah", "explanation": "Total modal dibayarkan awal = Cabai (Rp525.000,00) + Tomat (Rp240.000,00) + Bawang\n(10 × 25.000 = 𝑅𝑝250.000,00) = Rp1.015.000,00. Pendapatan penjualan kotor = Cabai\n\n(Rp630.000,00) + Tomat (Rp324.000,00) + Bawang (9 × 35.000 = 𝑅𝑝315.000,00) =\nRp1.269.000,00. Profit akumulatif bersih sebenarnya = 1.269.000 −1.015.000 = 𝑅𝑝254.000,00."}, {"text": "Peristiwa membusuknya 1 kg persediaan barang komoditas Bawang Merah yang terjadi\nmereduksi tingkat penerimaan hasil omset laku pedagang senilai Rp35.000,00.", "answer": "Benar", "explanation": "Karena sayur bawang segar yang tidak dapat dipasarkan seberat 1 kg akibat kerusakan, maka\npeluang pemasukan di harga ecer baru bernilai 1 × 35.000 rupiah batal tercapai, berimplikasi\nlangsung berkurangnya pencatatan penerimaan laku (omset) senilai Rp35.000,00."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
