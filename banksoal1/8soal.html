<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Hubungan Garis dan Sudut</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT HUBUNGAN GARIS DAN SUDUT</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 18</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 18</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 1 \n \nDua buah sudut saling berpelurus. Jika besar salah satu sudut adalah 75∘, berapakah besar \nsudut yang lain?","options":[{"key":"A","text":"15∘"},{"key":"B","text":"105∘"},{"key":"C","text":"115∘"},{"key":"D","text":"125∘"}],"answer":"B","explanation":"Langkah 1: Ingat kembali bahwa dua sudut yang saling berpelurus memiliki jumlah besar sudut \nsebesar 180∘. \nLangkah 2: Hitung besar sudut yang lain dengan mengurangkan sudut yang diketahui dari 180∘, \nyaitu 180∘−75∘= 105∘. \nJawaban Benar: B"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 1 \n \nDua garis sejajar dipotong oleh sebuah garis transversal. Jika besar salah satu sudut dalam \nsepihak adalah 75∘, berapakah besar sudut dalam sepihak pasangannya?","options":[{"key":"A","text":"75∘"},{"key":"B","text":"105∘"},{"key":"C","text":"115∘"},{"key":"D","text":"285∘"}],"answer":"B","explanation":"Jumlah besar dua sudut dalam sepihak adalah 180∘. \nMaka, besar sudut dalam sepihak pasangannya adalah: 180∘−75∘= 105∘. \nJawaban Benar: B"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 1 \n \nSudut 𝐴 dan sudut 𝐵 saling berpelurus. Jika besar sudut 𝐴= 2𝑥 dan besar sudut 𝐵= 3𝑥 dengan \nnilai 𝑥= 36∘, berapakah besar sudut 𝐵?","options":[{"key":"A","text":"36∘"},{"key":"B","text":"72∘"},{"key":"C","text":"90∘"},{"key":"D","text":"108∘"}],"answer":"D","explanation":"Besar sudut 𝐵 dinyatakan dengan 3𝑥. \nDengan mensubstitusi nilai 𝑥= 36∘, diperoleh: 3 × 36∘= 108∘. \nJawaban Benar: D"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 2 \n \nDua garis sejajar dipotong oleh sebuah garis transversal sehingga membentuk sepasang sudut \nluar sepihak dengan besar 4𝑥+ 10∘ dan 𝑥+ 20∘. Tentukan besar sudut penyiku dari nilai 𝑥 \ntersebut.","options":[{"key":"A","text":"30∘"},{"key":"B","text":"60∘"},{"key":"C","text":"130∘"},{"key":"D","text":"150∘"}],"answer":"B","explanation":"Langkah 1: Sudut luar sepihak jika dijumlahkan hasilnya 180∘. Persamaannya: (4𝑥+ 10) + (𝑥+\n20) = 180 ⇒5𝑥+ 30 = 180 ⇒5𝑥= 150 ⇒𝑥= 30. \nLangkah 2: Cari besar sudut penyiku dari nilai 𝑥= 30. Penyikunya adalah 90∘−30 = 60∘. \nJawaban Benar: B"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 2 \n \nDalam pembangunan sebuah jembatan kayu di Toraja, dua balok kayu dipasang saling \nberpotongan hingga membentuk sudut yang saling berpelurus. Jika besar sudut pertama \ndinyatakan dengan (3𝑥−10)∘ dan besar sudut kedua adalah (2𝑥+ 15)∘, berapakah besar sudut \nterkecil dari kedua sudut tersebut?","options":[{"key":"A","text":"35∘"},{"key":"B","text":"75∘"},{"key":"C","text":"80∘"},{"key":"D","text":"85∘"}],"answer":"D","explanation":"Langkah 1: Karena kedua sudut saling berpelurus, maka jumlahnya adalah 180∘. Kita dapat \nmenuliskan persamaan: (3𝑥−10) + (2𝑥+ 15) = 180. \nLangkah 2: Sederhanakan persamaan tersebut menjadi 5𝑥+ 5 = 180, sehingga 5𝑥= 175 dan \ndiperoleh 𝑥= 35. \nLangkah 3: Hitung kedua sudut tersebut. Sudut pertama: 3(35) −10 = 95∘. Sudut kedua: 2(35) +\n15 = 85∘. \nLangkah 4: Sudut terkecil di antara keduanya adalah 85∘. \nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 2 \n \nDua garis sejajar dipotong oleh garis transversal sehingga membentuk sepasang sudut luar \nberseberangan dengan besar (2𝑥+ 40)∘ dan (4𝑥−10)∘. Nilai dari 𝑥+ 15∘ adalah ....","options":[{"key":"A","text":"15∘"},{"key":"B","text":"25∘"},{"key":"C","text":"35∘"},{"key":"D","text":"40∘"}],"answer":"D","explanation":"Langkah 1: Sudut luar berseberangan besarnya sama: 2𝑥+ 40 = 4𝑥−10, 2𝑥= 50, 𝑥= 25. \nLangkah 2: Nilai dari 𝑥+ 15∘= 25 + 15 = 40∘. \nJawaban Benar: D"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 3 \n \nSiti sedang mencari besar sudut sehadap dari dua garis sejajar yang dipotong transversal. Sudut \npertama adalah 5𝑎−40∘ dan sudut kedua adalah 3𝑎+ 10∘. Siti menuliskan langkah pengerjaan \nsebagai berikut: (Langkah 1) 5𝑎−40 + 3𝑎+ 10 = 180, (Langkah 2) 8𝑎−30 = 180, (Langkah 3) \n8𝑎= 210, dan (Langkah 4) 𝑎= 26,25. Pada langkah pengerjaan nomor berapakah Siti pertama \nkali membuat kesalahan?","options":[{"key":"A","text":"Langkah 1"},{"key":"B","text":"Langkah 2"},{"key":"C","text":"Langkah 3"},{"key":"D","text":"Langkah 4"}],"answer":"A","explanation":"Langkah 1: Analisis hubungan sudut yang diberikan. Soal menyatakan bahwa kedua sudut \nadalah sudut sehadap. \nLangkah 2: Ingat konsep sudut sehadap. Sudut yang sehadap memiliki besar yang sama (5𝑎−\n40 = 3𝑎+ 10), bukan berjumlah 180∘. \nLangkah 3: Evaluasi langkah pengerjaan Siti. Pada Langkah 1, Siti menuliskan jumlah kedua \nsudut tersebut adalah 180∘, yang merupakan sifat sudut sepihak atau berpelurus. Jadi, Siti salah \npada Langkah 1. \nJawaban Benar: A"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 3 \n \nSeorang arsitek sedang menghitung hubungan sudut pada struktur atap baja. Dua garis sejajar \ndipotong oleh sebuah garis transversal. Arsitek tersebut mencatat dua sudut luar sepihak yaitu \n𝐴= 5𝑥−40∘ and 𝐵= 3𝑥+ 20∘. Berikut adalah langkah-langkah arsitek tersebut untuk \nmenentukan besar sudut 𝐴: Langkah 1: Menyamakan kedua sudut karena merupakan luar \nsepihak, yaitu 5𝑥−40 = 3𝑥+ 20. Langkah 2: Memindahkan suku sejenis sehingga 5𝑥−3𝑥=\n\n20 + 40. Langkah 3: Memperoleh 2𝑥= 60, sehingga 𝑥= 30. Langkah 4: Menghitung besar sudut \n𝐴= 5(30) −40 = 110∘. Pada langkah berapakah arsitek tersebut pertama kali melakukan \nkesalahan?","options":[{"key":"A","text":"Langkah 1"},{"key":"B","text":"Langkah 2"},{"key":"C","text":"Langkah 3"},{"key":"D","text":"Langkah 4"}],"answer":"A","explanation":"Langkah 1: Pahami sifat sudut luar sepihak. Sudut-sudut luar sepihak memiliki jumlah sudut 180∘, \nbukan memiliki besar yang sama. \nLangkah 2: Evaluasi Langkah 1 pada pengerjaan arsitek. Arsitek tersebut langsung menyamakan \nkedua sudut (5𝑥−40 = 3𝑥+ 20). Ini adalah kesalahan konsep karena seharusnya \npersamaannya adalah (5𝑥−40) + (3𝑥+ 20) = 180. \nLangkah 3: Dengan demikian, kesalahan pertama kali terjadi pada Langkah 1. \nJawaban Benar: A"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Level 3 \n \nSebuah jembatan gantung dirancang dengan kabel penyangga baja yang sejajar dengan dek \njembatan, dipotong oleh sebuah tiang penyangga miring. Sudut luar berseberangan yang \nterbentuk adalah 𝐴= 4𝑥−15∘ dan 𝐵= 2𝑥+ 25∘. Sudut 𝐶 berpelurus dengan 𝐴, sedangkan sudut \n𝐷 sehadap dengan 𝐶. Tentukan besar sudut penyiku dari sudut yang besarnya sama dengan \nsetengah sudut 𝐷 ditambah 2.5∘.","options":[{"key":"A","text":"20∘"},{"key":"B","text":"30∘"},{"key":"C","text":"60∘"},{"key":"D","text":"120∘"}],"answer":"B","explanation":"Langkah 1: Sudut luar berseberangan memiliki besar yang sama, sehingga 4𝑥−15∘= 2𝑥+\n25∘ ⟹ 2𝑥= 40∘ ⟹ 𝑥= 20∘. \nLangkah 2: Hitung besar sudut 𝐴: 𝐴= 4(20∘) −15∘= 65∘. \nLangkah 3: Sudut 𝐶 berpelurus dengan 𝐴, maka 𝐶= 180∘−65∘= 115∘. \nLangkah 4: Sudut 𝐷 sehadap dengan 𝐶, maka 𝐷= 𝐶= 115∘. \nLangkah 5: Hitung sudut baru yaitu setengah dari 𝐷 ditambah 2.5∘: \n1\n2 × 115∘+ 2.5∘= 57.5∘+\n2.5∘= 60∘. \nLangkah 6: Sudut penyiku dari 60∘ adalah 90∘−60∘= 30∘. \nJawaban Benar: B"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Dua buah sudut yang berdekatan membentuk sebuah garis lurus, sehingga kedua sudut tersebut \ndinamakan sudut berpelurus. Salah satu sudut memiliki besar 125∘. Tentukan benar atau salah \nuntuk setiap pernyataan berikut!","statements":[{"text":"Sudut tetangganya yang membentuk garis lurus berukuran 65∘.","answer":"Salah","explanation":"Kalkulasi sudut berpelurus adalah 180∘−125∘= 55∘, bukan 65∘."},{"text":"Pasangan sudut tersebut saling berpelurus dan berjumlah 180∘.","answer":"Benar","explanation":"Sesuai definisi, karena membentuk sebuah garis lurus utuh maka totalnya bernilai tepat 180∘."},{"text":"Besar sudut kedua adalah 55∘ yang digolongkan sebagai sudut lancip.","answer":"Benar","explanation":"Besar sudut yang kurang dari 90∘ merupakan jenis sudut lancip. Di sini, nilai 55∘ adalah sudut \nlancip."},{"text":"Selisih besar sudut yang pertama dengan sudut yang kedua adalah 70∘.","answer":"Benar","explanation":"Nilai pengurangnya dicari melalui selisih kedua angka sudut tersebut: 125∘−55∘= 70∘."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Seseorang mengukur besar sebuah sudut lancip di buku gambarnya dan memperoleh hasil 65∘. \nBeri tanda centang (✓) pada setiap pernyataan yang benar terkait sifat pelurus dan penyiku sudut \ntersebut!","statements":[{"text":"Sudut penyiku dari sudut gambar tersebut besarnya 25∘.","answer":"Benar","explanation":"Kalkulasi sudut komplementernya dihitung dengan 90∘−65∘= 25∘."},{"text":"Sudut pelurus dari sudut gambar tersebut besarnya 125∘.","answer":"Salah","explanation":"Sudut suplemen atau pelurus dari 65∘ diperoleh lewat perhitungan 180∘−65∘= 115∘, bukan \n125∘."},{"text":"Nilai penjumlahan penyiku dan pelurus dari sudut tersebut adalah 150∘.","answer":"Salah","explanation":"Penjumlahan besar sudut penyiku (25∘) ditambah sudut pelurusnya (115∘) menghasilkan 140∘, \nbukan 150∘."},{"text":"Sudut pelurus dari sudut gambar tersebut bernilai 115∘.","answer":"Benar","explanation":"Melalui hubungan kelurusan didapatkan ukuran suplemen pelurusnya bernilai tepat 180∘−65∘=\n115∘."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Dua garis lurus pada sebuah ubin lantai saling berpotongan secara tegak lurus membentuk \nempat buah bidang sudut. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai \nsudut tersebut!","statements":[{"text":"Semua jenis bidang sudut yang terbentuk memiliki kategori sudut tumpul.","answer":"Salah","explanation":"Perpotongan secara tegak lurus selalu membentuk empat sudut siku-siku (90∘), bukan sudut \ntumpul."},{"text":"Setiap pasang sudut bersebelahan merupakan pasangan sudut yang saling berpelurus.","answer":"Benar","explanation":"Setiap pasang sudut bersebelahan memiliki jumlah sudut 90∘+ 90∘= 180∘, yang mana \nmemenuhi definisi berpelurus."},{"text":"Jumlah besar seluruh sudut yang dihasilkan dari perpotongan garis tersebut adalah 180∘.","answer":"Salah","explanation":"Jumlah besar sudut satu lingkaran utuh pada perpotongan garis adalah 4 × 90∘= 360∘."},{"text":"Keempat sudut yang dihasilkan dari perpotongan tegak lurus tersebut berupa sudut siku-siku \nsebesar 90∘.","answer":"Benar","explanation":"Perpotongan garis lurus secara tegak lurus melahirkan sudut yang bernilai tepat 90∘, yaitu sudut \nsiku-siku."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Sebuah sistem pengubinan melahirkan jajaran tiga sudut berdampingan membentuk sudut lurus \nsatu garis lurus datar, di mana ukuran masing-masing sudut berturut-turut adalah 3𝑥∘, 4𝑥∘, dan \n5𝑥∘. Beri tanda centang pada pernyataan yang bernilai benar!","statements":[{"text":"Besaran koefisien 𝑥 pada tata letak ubin garis tersebut adalah 12.","answer":"Salah","explanation":"Tiga sudut membentuk garis lurus sehingga jumlah ketiganya adalah 180∘: 3𝑥+ 4𝑥+ 5𝑥= 180 ⇒\n12𝑥= 180 ⇒𝑥= 15."},{"text":"Besar ukuran dari sudut ubin yang paling terkecil di baris tersebut bernilai 45∘.","answer":"Benar","explanation":"Sudut paling kecil adalah 3𝑥. Nilainya adalah 3 × 15 = 45∘."},{"text":"Penyiku dari sudut terbesar ubin yang bernilai paling maksimum adalah 15∘.","answer":"Benar","explanation":"Sudut paling besar adalah 5𝑥⇒5 × 15 = 75∘. Penyiku sudut 75∘ adalah 90∘−75∘= 15∘."},{"text":"Selisih besar ukuran antara sudut yang bernilai terbesar dan terkecil di ubin datar adalah 30∘.","answer":"Benar","explanation":"Selisih sudut ubin tersebut adalah 75∘−45∘= 30∘."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Di suatu persimpangan jalan layang, dua pembatas jalan lurus saling bertemu dan membentuk \ndua sudut yang saling berpelurus, yaitu 7𝑥+ 20∘ dan 5𝑥−8∘. Beri tanda centang (✓) pada setiap \npernyataan yang benar!","statements":[{"text":"Nilai 𝑥 yang memenuhi hubungan adalah 12.","answer":"Salah","explanation":"Saling berpelurus jumlahnya 180∘. Maka, 7𝑥+ 20 + 5𝑥−8 = 180 ⟹ 12𝑥+ 12 = 180 ⟹ 12𝑥=\n168 ⟹ 𝑥= 14."},{"text":"Besar sudut yang tumpul adalah 118∘.","answer":"Benar","explanation":"Substitusi 𝑥= 14 ke 7𝑥+ 20 ⟹ 7(14) + 20 = 98 + 20 = 118∘."},{"text":"Besar sudut yang lancip adalah 62∘.","answer":"Benar","explanation":"Substitusi 𝑥= 14 ke 5𝑥−8 ⟹ 5(14) −8 = 70 −8 = 62∘."},{"text":"Penyiku dari sudut yang lancip tersebut adalah 18∘.","answer":"Salah","explanation":"Besar sudut lancip tersebut adalah 62∘. Penyikunya adalah 90∘−62∘= 28∘, bukan 18∘."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Pagar pelindung memiliki pasangan tiang-tiang horizontal sejajar yang diikat diagonal besi \nmenyilang bertransversal. Struktur silang melahirkan jajaran sudut dalam sepihak dengan \nmasing-masing besar 𝑥+ 40∘ dan 2𝑥+ 20∘. Centang pada semua pernyataan berikut yang \nbernilai benar terkait sudut ini!","statements":[{"text":"Nilai parameter variabel 𝑥 yang membentuk sistem relasi dalam sepihak tersebut adalah 40.","answer":"Benar","explanation":"Dua sudut dalam sepihak jika dijumlahkan adalah 180∘, maka persamaannya: (𝑥+ 40) + (2𝑥+\n20) = 180 ⇒3𝑥+ 60 = 180 ⇒3𝑥= 120 ⇒𝑥= 40."},{"text":"Sudut paling besar dari sepasang sudut dalam sepihak tersebut memiliki nilai ukuran sebesar \n100∘.","answer":"Benar","explanation":"Dua sudut tersebut adalah 𝑥+ 40 = 40 + 40 = 80∘ dan 2𝑥+ 20 = 2(40) + 20 = 100∘. Ukuran \nsudut yang paling besar di antara keduanya adalah 100∘."},{"text":"Besar ukuran penyiku dari sudut yang paling kecil di dalam sepihak pagar adalah 20∘.","answer":"Salah","explanation":"Sudut paling kecil adalah 80∘. Penyiku dari sudut paling kecil adalah 90∘−80∘= 10∘, bukan 20∘."},{"text":"Selisih antara kedua sudut dalam sepihak tersebut memiliki ukuran nilai sebesar 20∘.","answer":"Benar","explanation":"Selisih ukuran antara sudut terbesar (100∘) dan sudut terkecil (80∘) adalah 100∘−80∘= 20∘."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Dalam penataan arah tiang penangkap sinyal televisi (antena yagi), sirip-sirip pengarah dirancang \nagar selalu dalam keadaan sejajar dan disatukan sebuah bilah diagonal tengah penunjang yang \nberukuran dalam berseberangan secara aljabar (2𝑘+ 12)∘ dan (𝑘+ 35)∘. Apabila seberang \npasangannya bertolak belakang bagian sudut pertama bernama ∠𝐽, serta sudut berukuran ∠𝐾 \nbertindak menyudut pelengkap (komplemen) sudut kedua. Beri tanda centang (✓) pada setiap \npernyataan yang benar mengenai instalasi besi penangkap sinyal tersebut!","statements":[{"text":"Parameter rancangan fisik sinyal pengarah 𝑘 diperoleh bernilai 13.","answer":"Salah","explanation":"Kedua posisi merupakan hubungan dalam berseberangan lurus yang setara. Persamaannya \ndihitung melalui 2𝑘+ 12 = 𝑘+ 35 ⟹ 𝑘= 23. Maka nilai yang tepat adalah 23, bukan 13."},{"text":"Besar dari nilai konstanta fisis persiripan antena diperoleh bernilai 23.","answer":"Benar","explanation":"Penyamaan linear untuk dua sudut berkedudukan sebagai dalam berseberangan lurus yaitu 2𝑘+\n12 = 𝑘+ 35 menyisakan solusi utama sebesar 𝑘= 23."},{"text":"Sudut komplemen ∠𝐾 penopang antena terukur tepat bernilai 32∘.","answer":"Benar","explanation":"Besar sudut yang kedua didapatkan sebesar 23 + 35 = 58∘. Dikarenakan ∠𝐾 berperan sebagai \nkomplementer murni penyiku dari bagian kedua tersebut, diperoleh nilai ∠𝐾= 90∘−58∘= 32∘."},{"text":"Ukuran besar dari sudut ∠𝐽 pada rangkaian yang bertolak belakang tersebut bernilai 68∘.","answer":"Salah","explanation":"Maka besar sudut bagian pertama adalah 2(23) + 12 = 58∘. Sifat bertolak belakang bernilai sama \nukuran, sehingga seharusnya sudut ∠𝐽= 58∘."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Dua buah sudut 𝑃 dan 𝑄 saling berpenyiku, di mana besar sudut 𝑃= (3𝑦+ 5)∘ dan besar sudut \n𝑄= (𝑦+ 13)∘. Sudut lain yaitu 𝑆 dirancang memiliki besar sudut 2𝑃−𝑄, sementara sudut 𝑇 \nadalah sudut pelurus dari 𝑄. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai variabel 𝑦 yang diperoleh adalah 18.","answer":"Benar","explanation":"Sudut berpenyiku berjumlah 90∘. Maka, (3𝑦+ 5) + (𝑦+ 13) = 90 ⟹ 4𝑦+ 18 = 90 ⟹ 4𝑦=\n72 ⟹ 𝑦= 18."},{"text":"Besar sudut 𝑃 yang didapat adalah 64∘.","answer":"Salah","explanation":"Substitusi 𝑦= 18 ke sudut 𝑃, diperoleh 𝑃= 3(18) + 5 = 59∘. Opsi 64∘ adalah akibat dari \nmiskonsepsi dalam pemodelan aritmetika."},{"text":"Besar sudut 𝑆 adalah 87∘ yang tergolong sudut lancip.","answer":"Benar","explanation":"Besar sudut 𝑃= 59∘ dan 𝑄= 18 + 13 = 31∘. Maka 𝑆= 2(59∘) −31∘= 118∘−31∘= 87∘, yang \nukurannya kurang dari 90∘ sehingga digolongkan sudut lancip."},{"text":"Besar sudut 𝑇 yang merupakan pelurus dari 𝑄 adalah 59∘.","answer":"Salah","explanation":"Besar 𝑄= 31∘. Pelurus dari 𝑄 adalah 180∘−31∘= 149∘. Nilai 59∘ merupakan sudut penyiku 𝑄, \nbukan pelurusnya."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menentukan sifat sudut yang terbentuk dari \ndua garis berpotongan, dua garis sejajar yang dipotong garis lain \n(garis transversal), serta mengestimasi besar sudut (pelurus, \npenyiku, sehadap, dan bersebrangan).","question":"Pada dekorasi geometri batik, dua garis horisontal sejajar digunting secara diagonal dengan \nsepasang sudut luar berseberangan lancip dinyatakan (3𝑥−10)∘ dan (𝑥+ 30)∘. Terdapat pula \nsudut bertolak belakang terhadap sudut pertama dinamakan ∠𝑃, sudut ∠𝑄 adalah penyiku \n(komplemen) dari sudut ∠𝑃 itu sendiri, serta sudut ∠𝑅 merupakan pelurus dari ∠𝑄 pada area \nsimetri kain lainnya. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai 𝑥 untuk struktur ornamen hias kain batik ini didapatkan bernilai 20.","answer":"Benar","explanation":"Melalui konsep sifat luar berseberangan dua garis lurus, disimpulkan sudutnya memiliki \nkesamaan nilai: 3𝑥−10 = 𝑥+ 30 ⟹ 2𝑥= 40 ⟹ 𝑥= 20."},{"text":"Besar ukuran dari ∠𝑄 sebagai penyiku utama didapatkan sebesar 40∘.","answer":"Benar","explanation":"Langkah pertama sudut ∠𝑃 dicari sebagai besar sudut bertolak belakang dari pertama: 3(20) −\n10 = 50∘, maka ∠𝑃= 50∘. Sudut ∠𝑄 bertindak sebagai komplemen dari ∠𝑃 bernilai 90∘−50∘=\n40∘."},{"text":"Besar dari ∠𝑅 penyempurna dari batik adalah 130∘.","answer":"Salah","explanation":"Pelurus dari sudut ∠𝑄 adalah ∠𝑅= 180∘−40∘= 140∘, sehingga bernilai 140∘, bukan 130∘."},{"text":"Ukuran besar dari sudut ∠𝑅 yang saling berpelurus adalah 140∘.","answer":"Benar","explanation":"Didapatkan sudut ∠𝑄 sebelumnya berukuran 40∘. Hubungan pelurus sudutnya diperoleh secara \nperhitungan linier: 180∘−40∘= 140∘, maka ∠𝑅= 140∘."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
