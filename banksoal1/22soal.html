<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Transformasi Geometri</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT TRANSFORMASI GEOMETRI</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 24</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 24</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah papan nama berbentuk segitiga memiliki salah satu titik sudut di koordinat 𝑃(−1,5). Jika papan nama tersebut digeser oleh translasi 𝑇(4, −3), koordinat bayangan titik 𝑃 setelah digeser adalah ....","options":[{"key":"A","text":"(−5,2)"},{"key":"B","text":"(−5,8)"},{"key":"C","text":"(3,2)"},{"key":"D","text":"(3,8)"}],"answer":"C","explanation":"Titik sudut asal adalah 𝑃(−1,5). \nTranslasi oleh 𝑇(4, −3) berarti koordinat x ditambah 4 dan koordinat y ditambah −3. \nKoordinat bayangan titik 𝑃 adalah 𝑃′(−1 + 4,5 −3) = 𝑃′(3,2)."},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Stasiun kereta api Argo di sebuah kota terletak pada koordinat 𝑆(−1,3). Jika posisi stasiun tersebut dicerminkan terhadap garis 𝑦= −2, koordinat bayangan stasiun tersebut adalah ....","options":[{"key":"A","text":"(−5,3)"},{"key":"B","text":"(−1, −7)"},{"key":"C","text":"(−1, −5)"},{"key":"D","text":"(−1, −1)"}],"answer":"B","explanation":"Titik awal posisi stasiun adalah 𝑆(−1,3). \nPencerminan terhadap garis 𝑦= ℎ mengubah koordinat (𝑥, 𝑦) menjadi (𝑥, 2ℎ−𝑦). \nDengan ℎ= −2, koordinat bayangannya adalah 𝑆′(−1,2(−2) −3) = 𝑆′(−1, −4 −3) = 𝑆′(−1, −7)."},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah patok batas tanah perkebunan terletak di koordinat 𝐾(−2,4). Jika koordinat tersebut didilatasi terhadap pusat 𝑂(0,0) dengan faktor skala 3, koordinat bayangan patok batas tanah tersebut adalah ....","options":[{"key":"A","text":"(−6,12)"},{"key":"B","text":"(−5,7)"},{"key":"C","text":"(1,7)"},{"key":"D","text":"(6, −12)"}],"answer":"A","explanation":"Titik awal patok batas tanah adalah 𝐾(−2,4). \nDilatasi terhadap pusat 𝑂(0,0) dengan faktor skala 𝑘 mengubah koordinat (𝑥, 𝑦) menjadi (𝑘𝑥, 𝑘𝑦). \nDengan 𝑘= 3, koordinat bayangannya adalah 𝐾′(3 × (−2),3 × 4) = 𝐾′(−6,12)."},{"number":4,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Titik posisi sebuah kapal nelayan di perairan Karimunjawa berada pada koordinat 𝐴(3, −5). Jika kapal tersebut bergerak mengikuti translasi 𝑇(2,7), koordinat posisi baru kapal tersebut adalah ....","options":[{"key":"A","text":"(1, −12)"},{"key":"B","text":"(1,2)"},{"key":"C","text":"(5, −12)"},{"key":"D","text":"(5,2)"}],"answer":"D","explanation":"Langkah 1: Menentukan posisi awal kapal nelayan, yaitu 𝐴(3, −5) dan translasi 𝑇(2,7). \nLangkah 2: Menghitung koordinat bayangan dengan menjumlahkan koordinat asal dengan \ntranslasi: 𝑥′ = 3 + 2 = 5 dan 𝑦′ = −5 + 7 = 2. \nLangkah 3: Diperoleh koordinat posisi baru kapal, yaitu 𝐴′(5,2). Jawaban Benar: D."},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sawah tadah hujan milik seorang petani berada pada koordinat 𝑆(6, −2) pada peta digital. Koordinat tersebut dicerminkan terhadap garis 𝑦= −𝑥, kemudian ditranslasikan oleh 𝑇(−4, −1). Koordinat bayangan akhir dari sawah tersebut adalah ....","options":[{"key":"A","text":"(−6, −7)"},{"key":"B","text":"(−2, −7)"},{"key":"C","text":"(−2, −3)"},{"key":"D","text":"(2, −7)"}],"answer":"B","explanation":"Langkah 1: Menentukan hasil refleksi titik 𝑆(6, −2) terhadap garis 𝑦= −𝑥. Aturan refleksi \nterhadap garis 𝑦= −𝑥 adalah (𝑥, 𝑦) →(−𝑦, −𝑥). Maka, diperoleh 𝑆′(2, −6). \nLangkah 2: Menentukan hasil translasi titik 𝑆′(2, −6) oleh 𝑇(−4, −1). Maka, diperoleh 𝑆″(2 +\n(−4), −6 + (−1)) = 𝑆″(−2, −7)."},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Koordinat mercusuar di pelabuhan laut Makassar berada pada titik 𝑁(−3, −2). Jika mercusuar tersebut ditranslasikan oleh 𝑇(4,1), kemudian dicerminkan terhadap garis 𝑦= −2, koordinat bayangan akhir mercusuar tersebut adalah ....","options":[{"key":"A","text":"(1, −5)"},{"key":"B","text":"(1, −3)"},{"key":"C","text":"(1, −1)"},{"key":"D","text":"(1,3)"}],"answer":"B","explanation":"Langkah 1: Tentukan koordinat setelah translasi. Titik awal 𝑁(−3, −2) ditranslasikan oleh 𝑇(4,1), \nsehingga koordinat bayangannya adalah 𝑁′(−3 + 4, −2 + 1) = 𝑁′(1, −1). \nLangkah 2: Tentukan koordinat setelah refleksi. Titik 𝑁′(1, −1) dicerminkan terhadap garis 𝑦=\n−2, sehingga koordinat bayangan akhirnya adalah 𝑁″(1,2(−2) −(−1)) = 𝑁″(1, −3)."},{"number":7,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Posisi kapal penyelamat di laut Bunaken terpantau pada titik koordinat 𝑃(−2, −3). Kapal tersebut diputar sebesar 180∘ terhadap titik pusat 𝑂(0,0), kemudian bergerak sejauh translasi 𝑇(4, −1). Koordinat posisi akhir kapal penyelamat tersebut adalah ....","options":[{"key":"A","text":"(2, −4)"},{"key":"B","text":"(2,4)"},{"key":"C","text":"(6,2)"},{"key":"D","text":"(6,4)"}],"answer":"C","explanation":"Langkah 1: Rotasikan titik 𝑃(−2, −3) sebesar 180∘ terhadap pusat 𝑂(0,0) menggunakan rumus \n𝑃′(𝑥, 𝑦) →𝑃′(−𝑥, −𝑦). Didapatkan 𝑃′(2,3). \nLangkah 2: Translasikan titik 𝑃′(2,3) oleh 𝑇(4, −1) menggunakan rumus (𝑥′ + 𝑎, 𝑦′ + 𝑏). \nLangkah 3: Hitung hasil akhir: 𝑥″ = 2 + 4 = 6 dan 𝑦″ = 3 + (−1) = 2. Koordinat posisi akhirnya \nadalah (6,2)."},{"number":8,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah empang ikan berbentuk persegi panjang dengan koordinat titik-titik sudut 𝐴(1,1), 𝐵(5,1), 𝐶(5,3), dan 𝐷(1,3) digambar pada denah koordinat Kartesius. Jika empang tersebut diperbesar melalui dilatasi dengan pusat 𝑂(0,0) dan faktor skala 𝑘= 3, luas empang baru hasil dilatasi tersebut adalah ....","options":[{"key":"A","text":"24 satuan luas"},{"key":"B","text":"36 satuan luas"},{"key":"C","text":"72 satuan luas"},{"key":"D","text":"144 satuan luas"}],"answer":"C","explanation":"Langkah 1: Menghitung luas awal persegi panjang 𝐴𝐵𝐶𝐷. Panjang adalah selisih absis 5 −1 = 4 \nsatuan, dan lebar adalah selisih ordinat 3 −1 = 2 satuan. Luas awal 𝐿= 4 × 2 = 8 satuan luas. \nLangkah 2: Menghitung luas setelah dilatasi dengan faktor skala 𝑘= 3 menggunakan hubungan \n𝐿′ = 𝑘2 × 𝐿. Diperoleh 𝐿′ = 32 × 8 = 9 × 8 = 72 satuan luas."},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Posisi mercusuar pemantau di Kepulauan Raja Ampat tercatat pada peta koordinat di titik 𝑀(3, −1). Jika mercusuar tersebut dicerminkan terhadap garis 𝑥= 𝑎 kemudian dilanjutkan dengan pencerminan terhadap garis 𝑦= 𝑏, bayangan akhir yang dihasilkan berada di titik 𝑀″(7,5). Nilai dari 𝑎+ 𝑏 adalah ....","options":[{"key":"A","text":"7"},{"key":"B","text":"8"},{"key":"C","text":"12"},{"key":"D","text":"16"}],"answer":"A","explanation":"Langkah 1: Rumuskan bayangan titik 𝑀(3, −1) setelah dicerminkan terhadap 𝑥= 𝑎, yaitu \n𝑀′(2𝑎−3, −1). \nLangkah 2: Cerminkan kembali 𝑀′(2𝑎−3, −1) terhadap 𝑦= 𝑏, sehingga bayangan akhirnya \nadalah 𝑀″(2𝑎−3,2𝑏−(−1)) = 𝑀″(2𝑎−3,2𝑏+ 1). \nLangkah 3: Samakan dengan koordinat akhir 𝑀″(7,5). Diperoleh 2𝑎−3 = 7 ⟹ 2𝑎= 10 ⟹ 𝑎=\n5, dan 2𝑏+ 1 = 5 ⟹ 2𝑏= 4 ⟹ 𝑏= 2. Nilai 𝑎+ 𝑏= 5 + 2 = 7."},{"number":10,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Pada cetak biru pemugaran Candi Borobudur, posisi koordinat stupa utama mula-mula berada pada titik 𝐴(−2,5). Jika posisi stupa tersebut didilatasi dengan pusat 𝑃(1,2) dan faktor skala 𝑘= −3, kemudian diputar sebesar 90∘ searah jarum jam dengan pusat 𝑂(0,0), maka koordinat posisi akhir stupa tersebut adalah ....","options":[{"key":"A","text":"(−10,7)"},{"key":"B","text":"(−7, −10)"},{"key":"C","text":"(−7,10)"},{"key":"D","text":"(7, −10)"}],"answer":"B","explanation":"Langkah 1 (Dilatasi): Tentukan bayangan titik 𝐴(−2,5) oleh dilatasi [𝑃(1,2), −3]. Formula dilatasi \ndengan pusat 𝑃(𝑎, 𝑏) dan faktor skala 𝑘 adalah 𝑥′ = 𝑎+ 𝑘(𝑥−𝑎) dan 𝑦′ = 𝑏+ 𝑘(𝑦−𝑏). \nMaka, 𝑥′ = 1 + (−3)(−2 −1) = 1 + (−3)(−3) = 10 dan 𝑦′ = 2 + (−3)(5 −2) = 2 + (−3)(3) =\n−7. Didapat koordinat antara 𝐴′(10, −7). \nLangkah 2 (Rotasi): Putar titik 𝐴′(10, −7) sebesar 90∘ searah jarum jam (atau −90∘) terhadap \npusat 𝑂(0,0). Aturan rotasi −90∘ adalah (𝑥″, 𝑦″) = (𝑦′, −𝑥′). \nMaka, 𝑥″ = −7 dan 𝑦″ = −10. Koordinat posisi akhir stupa adalah 𝐴″(−7, −10)."},{"number":11,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah papan reklame toko kerajinan perak di Yogyakarta berbentuk persegi panjang dengan koordinat sudut-sudutnya 𝐴(2,1), 𝐵(6,1), 𝐶(6,3), dan 𝐷(2,3). Papan reklame tersebut dicerminkan terhadap garis 𝑥= −1, kemudian digeser oleh translasi 𝑇(2, −3), dan terakhir didilatasi dengan pusat 𝑂(0,0) dan faktor skala 𝑘= 3. Koordinat posisi akhir dari titik sudut 𝐷 setelah rangkaian transformasi tersebut adalah ....","options":[{"key":"A","text":"(−6,0)"},{"key":"B","text":"(0, −6)"},{"key":"C","text":"(6,0)"},{"key":"D","text":"(6, −3)"}],"answer":"A","explanation":"Langkah 1 (Refleksi): Mencerminkan titik sudut 𝐷(2,3) terhadap garis 𝑥= −1 memberikan \nkoordinat 𝐷′(2(−1) −2,3) = 𝐷′(−4,3). \nLangkah 2 (Translasi): Menggeser titik 𝐷′(−4,3) dengan 𝑇(2, −3) menghasilkan 𝐷″(−4 + 2,3 −\n3) = 𝐷″(−2,0). \nLangkah 3 (Dilatasi): Mendilatasikan titik 𝐷″(−2,0) terhadap pusat 𝑂(0,0) dengan faktor skala 𝑘=\n3 menghasilkan 𝐷‴(−2 × 3,0 × 3) = 𝐷‴(−6,0)."},{"number":12,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Titik pantau mercusuar di pesisir pantai berada pada koordinat 𝑀(−1,3). Jika titik pantau tersebut diputar dengan rotasi [𝑂, 180∘], dilanjutkan dengan pencerminan terhadap garis 𝑦= −𝑥, dan terakhir digeser oleh translasi 𝑇(5, −2), koordinat posisi akhir titik pantau mercusuar tersebut adalah ....","options":[{"key":"A","text":"𝑀‴(1, −3)"},{"key":"B","text":"𝑀‴(3, −1)"},{"key":"C","text":"𝑀‴(8, −5)"},{"key":"D","text":"𝑀‴(8, −3)"}],"answer":"D","explanation":"Langkah 1: Merotasikan 𝑀(−1,3) sebesar 180∘ terhadap pusat 𝑂(0,0) menghasilkan 𝑀′(1, −3). \nLangkah 2: Mencerminkan 𝑀′(1, −3) terhadap garis 𝑦= −𝑥 memetakan (𝑥, 𝑦) →(−𝑦, −𝑥). \nDiperoleh 𝑀″(3, −1). \nLangkah 3: Menranslasikan 𝑀″(3, −1) oleh 𝑇(5, −2) menghasilkan 𝑀‴(3 + 5, −1 + (−2)) =\n𝑀‴(8, −3)."},{"number":13,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Seorang penata taman membuat skema taman kota menggunakan koordinat Kartesius. Kolam air mancur diposisikan di koordinat titik 𝐹(−5,9) dan ia merencanakan posisi bangku taman tepat pada titik pencerminan titik kolam tersebut terhadap garis 𝑦= 𝑥. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Hasil koordinat pencerminan tidak mengalami perubahan nilai melainkan tandanya semua berubah negatif.","answer":"Salah","explanation":"Pada refleksi garis 𝑦= 𝑥, tanda posisi nilainya diubah berdasarkan susunan tukar posisi \nsumbunya, bukan dijadikan semuanya berangka negatif ganda."},{"text":"Koordinat hasil pencerminan terhadap garis 𝑦= 𝑥 dihitung dengan rumus (𝑥, 𝑦) →(−𝑥, −𝑦).","answer":"Salah","explanation":"Sebab rumusan umum memindahkan absis ke ordinat begitupun kebalikannya yang tertulis \nsebagai pemetaan: (𝑥, 𝑦) →(𝑦, 𝑥)."},{"text":"Bangku taman diposisikan tepat pada titik koordinat baru 𝐹′(9, −5).","answer":"Benar","explanation":"Pencerminan dari 𝐹(−5,9) menggunakan kaidah sumbu terbalik melahirkan koordinat tukar \n(9, −5)."},{"text":"Sumbu koordinat bangku taman saling bertukar posisi secara langsung dari posisi semula kolam air mancur.","answer":"Benar","explanation":"Memindahkan koordinat awal (−5,9) bertukar posisi di sumbunya (absis ditaruh pada ordinat dan \nordinat berpindah letak ke absis) membentuk koordinat bayangan yang selaras."}]},{"number":14,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Taman bermain mini berbentuk persegi dengan letak keempat koordinat titik sudut pembatas daerah berada di posisi 𝑃(1,1), 𝑄(3,1), 𝑅(3,3), dan 𝑆(1,3) akan dipindahkan secara bergeser rata oleh dinas tata kota dengan faktor nilai pergeseran sejauh 𝑇(2,3). Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Penerapan pergeseran tersebut merubah rancangan struktur taman mini yang awalnya bentuk bidang persegi kongruen menjadi model panjang membesar.","answer":"Salah","explanation":"Translasi (pergeseran) merupakan sifat isometrik dalam geometri, artinya transformasi ini \nmempertahankan dimensi bentuk serta luas aslinya dari gambar mula-mula tanpa mengubah \nwujud."},{"text":"Peta koordinat kedudukan baru untuk penempatan dari arah salah satu sudut tiang koordinat 𝑄 terletak di koordinat titik 𝑄′(5,4).","answer":"Benar","explanation":"Letak baru titik koordinat 𝑄′ didapatkan dari hitungan pergeseran satu langkah: 𝑄′(3 + 2,1 + 3) =\n𝑄′(5,4). Maka hasilnya benar."},{"text":"Nilai koordinat akhir yang keliru dari pergeseran titik 𝑆 berakhir pada titik letak posisi berkedudukan 𝑆′(−1,0) akibat melakukan pengurangan berbalik.","answer":"Salah","explanation":"Opsi ini menyajikan kesalahan akibat operasi hitung pengurangan bertanda di arah salah pada \npenjumlahan koordinat: 𝑆′(1 −2,3 −3), padahal arah translasinya mengisyaratkan nilai \ntambahan."},{"text":"Ukuran kapasitas luas permukaan area taman setelah direlokasi tempat sama besarnya seperti semula dikarenakan pengaruh translasi bersifat kongruen.","answer":"Benar","explanation":"Perpindahan tempat (translasi) merupakan proses pemindahan suatu objek murni tanpa \ndeformasi bentuk fisiknya, menjadikannya bersifat melestarikan ukuran fisis daerah (luas tetap)."}]},{"number":15,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Di atas peta digital tata kelola lampu merah lalu lintas, titik tiang persimpangan dipetakan berada di kedudukan koordinat 𝑃(−3,4) dan dipetakan dengan cermin lurus terhadap garis fungsi pembagi 𝑦= 𝑥. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai transformasi cermin tiang tersebut!","statements":[{"text":"Sifat cermin terhadap batas cermin miring garis 𝑦= 𝑥 merefleksikan posisi angka koordinat awal dengan saling bertukar tempat sumbu satu sama lain.","answer":"Benar","explanation":"Benar. Sumbu pencerminan dengan pola garis 𝑦= 𝑥 dirumuskan menukar seluruh letak menjadi \n(𝑥, 𝑦) →(𝑦, 𝑥)."},{"text":"Hasil posisi akhir bayangan yang tepat atas pencerminan lampu tiang pada cermin adalah posisi titik koordinat 𝑃′(4, −3).","answer":"Benar","explanation":"Sesuai rumus (𝑥, 𝑦) →(𝑦, 𝑥), posisi awal lampu merah di 𝑃(−3,4) langsung menghasilkan titik \nbayangannya di 𝑃′(4, −3)."},{"text":"Posisi letak titik bayangan akhir hasil pencerminan persimpangan di atas berada di lingkungan wilayah bagian kuadran II Kartesius.","answer":"Salah","explanation":"Titik barunya ada pada 𝑃′(4, −3), koordinat yang berharga sumbu 𝑥> 0 dan sumbu 𝑦< 0 berada \ndi wilayah bagian kuadran IV."},{"text":"Jika titik acuan awal tersebut dipantulkan cermin alternatif sepanjang garis fungsi lurus 𝑦= −𝑥, posisinya berpindah ke titik koordinat (−4,3).","answer":"Benar","explanation":"Pencerminan garis lurus 𝑦= −𝑥 menghasilkan koordinat bayangan yang bertukar tanda serta \nposisi nilainya yaitu (𝑥, 𝑦) →(−𝑦, −𝑥), yang menggeser 𝑃(−3,4) →𝑃′(−4,3)."}]},{"number":16,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah sistem satelit pendaki memetakan letak titik sinyal pendakian darurat berada di posisi 𝐵(4, −9) pada navigasi. Di layar kontrol penyelamat, data tersebut sengaja dicerminkan langsung terhadap sumbu miring di garis fungsi identitas 𝑦= 𝑥. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai analisis letak titik baru 𝐵′ pendaki gunung tersebut!","statements":[{"text":"Sifat cermin pada fungsi garis lurus 𝑦= 𝑥 dilakukan dengan cara bertukar tempat posisi letak dari sumbu absis x dan ordinat y asal.","answer":"Benar","explanation":"Pola baku dalam transformasi geometri pencerminan lurus 𝑦= 𝑥 didefinisikan secara konseptual \nmengubah susunan koordinat (𝑥, 𝑦) →(𝑦, 𝑥)."},{"text":"Bayangan akhir dari titik kordinat pancar sinyal pendaki paska transformasi tersebut berlokasi di titik koordinat 𝐵′(−9,4).","answer":"Benar","explanation":"Dengan membalik nilai dari absis mula-mula 4 dan ordinat mula-mula −9, bayangan baru \nlangsung menempati posisi rute (−9,4)."},{"text":"Letak hasil koordinat cermin dari letak penunjuk di atas berlokasi di koordinat 𝐵′(9, −4).","answer":"Salah","explanation":"Kesalahan konseptual terjadi di mana aturan koordinat cermin ditukar nilai tandanya sebagai \n(−𝑦, −𝑥), yang sesungguhnya merupakan formulasi bayangan cermin miring terhadap garis 𝑦=\n−𝑥 (Kebalikan / Invers)."},{"text":"Koordinat dari lokasi letak sinyal baru berada di Kuadran III karena terdapat nilai minus −9 pada komponen penataan baru koordinatnya.","answer":"Salah","explanation":"Posisi (−9,4) tidak menempati area Kuadran III karena koordinat sumbu-Y berharga positif. \nBerdasarkan prinsip Kartesius, titik dengan format (−, +) berada di Kuadran II (Miskonsepsi \nKonseptual)."}]},{"number":17,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Posisi lambung suatu prototipe wahana penyelam kecil diprogram posisinya lewat monitor pengontrol berada pada posisi letak berkoordinat 𝑃(2, −3). Layar navigator mencoba menyetel fungsi dengan meluncurkan proses uji pantul berlapis secara urut bertahap: direfleksikan pertama terhadap garis horizontal lintang 𝑦= 1, lalu dilanjutkan dicerminkan menyilang garis lurus tegak vertikal 𝑥= −2. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Sesaat pasca eksekusi pantul pencerminan garis horisontal keperantaraan 𝑦= 1, posisi perpindahannya di tempat koordinat 𝑃′(2,5).","answer":"Benar","explanation":"Sesuai operasi matematis: ordinat yang berubah 2(1) −(−3) = 2 + 3 = 5 sementara absis 𝑥 \nstabil di tempat: menghasilkan 𝑃′(2,5)."},{"text":"Koordinat target penempatan dari kapal mini di monitor asalkan pengerjaan tersebut dikalkulasi lurus berhenti tepat pada kedudukan bayangan 𝑃″(6, −5).","answer":"Salah","explanation":"Kesalahan akibat melupakan tanda hukum invers arah pemindahan sumbu horizontal. Posisi \nabsis akhir teoretisnya dihitung: 2(−2) −2 = −6, dengan demikian menghasilkan bayangan lurus \npada titik 𝑃″(−6,5), bukan 𝑃″(6, −5)."},{"text":"Andai pola dibalik di mana pergerakan melancarkan arah vertikal garis pembagi 𝑥= −2 didahulukan lalu menyusul garis horizontal lintang 𝑦= 1, posisi baru ujung sasaran menjadi berbeda dari target awal.","answer":"Salah","explanation":"Pencerminan terhadap sepasang garis yang saling berpotongan lurus orthogonal bersifat \nsimetris-bebas sehingga perubahan prioritas operasi urutannya akan memetakan objek di sumbu \nposisi target identik."},{"text":"Perubahan lurus mendatar (displacement arah x) antara kedudukan paling awal dengan letak pasca seluruh pemindahan bertahap selesai bergeser sejauh 8 satuan linear.","answer":"Benar","explanation":"Dimensi horizontal murni terukur lurus sejauh rentang pergerakan sumbu absis di antara \nkedudukan asal ke posisi akhir: |2 −(−6)| = 8 satuan linear, bernilai sah."}]},{"number":18,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Untuk mendesain susunan kenyamanan bangku utama VIP konser, koordinat sebuah titik rujukan ditentukan posisinya pada posisi awal 𝐴(−4, −6). Tim artistik ruang panggung kemudian melakukan perpindahan letak sejauh translasi vektor 𝑇(7,3), disusul dengan mencerminkan kedudukan baru tersebut terhadap sumbu tegak (sumbu-Y). Beri tanda centang (✓) pada setiap pernyataan yang benar terkait posisi penempatan bangku konser!","statements":[{"text":"Letak kedudukan titik antara penempatan bangku sesaat setelah ditranslasikan secara benar bernilai (3, −3).","answer":"Benar","explanation":"Langkah 1: Menghitung operasi aritmetika dari koordinat dasar bergeser: −4 + 7 = 3 dan −6 +\n3 = −3. Langkah 2: Mendapatkan hasil titik di koordinat (3, −3). Pernyataan benar."},{"text":"Posisi koordinat letak panggung akhir pasca proses pencerminan terhadap sumbu-Y berada pada kedudukan titik (3,3).","answer":"Salah","explanation":"Langkah 1: Mengidentifikasi posisi sesudah digeser (3, −3). Langkah 2: Merefleksikannya \nterhadap sumbu-Y memakai pola (𝑥, 𝑦) →(−𝑥, 𝑦), didapat koordinat akhir yaitu (−3, −3), bukan \n(3,3)."},{"text":"Koordinat akhir setelah menyelesaikan pengerjaan kedua proses penggeseran posisi diatur tepat pada koordinat (−3, −3).","answer":"Benar","explanation":"Langkah 1: Menetapkan nilai absis dari (3, −3) menjadi dinegatifkan untuk sumbu-Y yaitu −3. \nLangkah 2: Menyisipkan ordinat tetap bernilai −3. Didapatkan posisi bayangan akhir koordinat \nyaitu (−3, −3). Pernyataan benar."},{"text":"Posisi paling akhir rancangan peletakan kursi tersebut terletak berada pada bagian wilayah Kuadran III bidang Kartesius.","answer":"Benar","explanation":"Langkah 1: Menilik tanda nilai negatif ganda yang dimiliki titik koordinat akhir (−3, −3). Langkah \n2: Lokasi dimana sumbu horizontal dan vertikal berarah negatif mendefinisikan Kuadran III. \nPernyataan benar."}]},{"number":19,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Objek mainan kamera terbang mula-mula diset posisi lurusnya dalam penunjuk simulasi berarah Kartesius pada kedudukan titik 𝐻(3,2). Tim mekanik mengkalibrasi lewat tindakan pembesaran berarah (dilatasi) titik pusatnya bernilai pada kedudukan 𝑃(1,1) menggunakan skala pembesar 𝑘= 3, lantas dicerminkan terhadap garis lintang mendatar 𝑦= 2. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai koordinat letak kamera terbang itu!","statements":[{"text":"Berdasarkan hitungan sesudah pemekaran dilatasi terhadap pusat acuan 𝑃(1,1) menghasilkan letak di titik 𝐻′(7,4).","answer":"Benar","explanation":"Menerapkan rumus dilatasi pusat 𝑃(𝑎, 𝑏), didapat 𝐻′(𝑎+ 𝑘(𝑥−𝑎), 𝑏+ 𝑘(𝑦−𝑏)). Berbasis nilai \nyang ada: 𝐻′(1 + 3(3 −1),1 + 3(2 −1)) = 𝐻′(1 + 6,1 + 3) = 𝐻′(7,4)."},{"text":"Titik akhir bayangan penutup atas proses kamera terbang sesudah dilalui semua lintasan pencerminan diposisi pada koordinat 𝐻″(7,2).","answer":"Salah","explanation":"Dengan merefleksikan kembali titik 𝐻′(7,4) kepada cermin lurus 𝑦= 2 dihitung menggunakan \naturan (𝑥′, 2𝑏−𝑦′) menghasilkan kedudukan (7,2(2) −4) = 𝐻″(7,0)."},{"text":"Letak titik kamera hasil pemosisian akhir bertempat sejajar atau menginduk langsung tegak sumbu-Y dengan letak titik (0,7).","answer":"Salah","explanation":"Koordinat diperoleh adalah (7,0), yang mana merupakan letak lurus mendatar yang terletak \nsecara berhimpit pada garis mendatar sumbu-X."},{"text":"Letak posisi titik bayangan koordinat akhir memiliki selisih jarak meluncur mendatar tepat sejauh 7 satuan dari pangkal sumbu pusat 𝑂(0,0).","answer":"Benar","explanation":"Koordinat penempatan bayangan bernilai (7,0) dengan begitu perhitungan jaraknya terhadap \nkoordinat (0,0) tepat bernilai sebesar √72 + 02 = 7 satuan."}]},{"number":20,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sistem perancangan transportasi kota Surabaya membuat rancangan awal posisi depo pusat kereta di titik koordinat 𝐷(1, −2). Proyek pengembangan dilakukan dengan cara memindahkan letak depo lewat proses pencerminan terhadap garis 𝑥= 3 lalu dicerminkan kembali terhadap garis 𝑦= 2. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai urutan titik pergeseran koordinat depo tersebut!","statements":[{"text":"Setelah dicerminkan terhadap garis 𝑥= 3, koordinat posisi bayangannya adalah 𝐷′(5, −2).","answer":"Benar","explanation":"Refleksi terhadap garis 𝑥= ℎ: 𝑥′ = 2ℎ−𝑥= 2(3) −1 = 5 dengan koordinat y tetap, \nmenghasilkan (5, −2)."},{"text":"Setelah dilakukan pencerminan kedua terhadap garis 𝑦= 2, koordinat depo berada di 𝐷″(5,2).","answer":"Salah","explanation":"Refleksi 𝐷′(5, −2) terhadap 𝑦= 2 memberikan hasil ordinat 𝑦′ = 2(2) −(−2) = 6 dengan x tetap, \nsehingga seharusnya adalah (5,6)."},{"text":"Jika titik 𝐷(1, −2) dicerminkan terhadap garis 𝑥= −2 lalu ditranslasikan oleh 𝑇(3,4), koordinat bayangannya adalah (−2,2).","answer":"Benar","explanation":"Pencerminan 𝐷(1, −2) terhadap 𝑥= −2 adalah (2(−2) −1, −2) = (−5, −2). Dilanjutkan translasi \n𝑇(3,4) memberikan (−5 + 3, −2 + 4) = (−2,2)."},{"text":"Jika posisi awal depo ditranslasikan sebesar 𝑇(2,3) lalu diputar sebesar 90∘ searah jarum jam terhadap titik pusat 𝑂(0,0), koordinat akhirnya adalah (1, −3).","answer":"Benar","explanation":"Depo awal ditranslasikan oleh 𝑇(2,3) menjadi (1 + 2, −2 + 3) = (3,1). Putar 90∘ searah jarum jam \ndari (3,1) menghasilkan (1, −3)."}]},{"number":21,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Letak lokasi penanaman patok koordinat perbatasan wilayah dinyatakan sebagai titik 𝑀(2, −4). Petugas survei geodesi menentukan pemindahan koordinat patok dengan serangkaian langkah: pencerminan terhadap garis 𝑦= 𝑥 dilanjutkan rotasi sejauh 90∘ berlawanan arah jarum jam dengan pusat 𝑂(0,0), kemudian digeser lewat translasi 𝑇(−5,4). Beri tanda centang pada setiap pernyataan yang benar mengenai pemindahan patok geodesi ini!","statements":[{"text":"Hasil refleksi patok pada koordinat asal terhadap garis 𝑦= 𝑥 memberikan letak titik baru 𝑀′(−4,2).","answer":"Benar","explanation":"Rumus refleksi titik (𝑥, 𝑦) terhadap garis 𝑦= 𝑥 adalah swap koordinat (𝑦, 𝑥). Penerapan pada \n𝑀(2, −4) menghasilkan 𝑀′(−4,2)."},{"text":"Koordinat letak patok pasca rotasi 90∘ terhadap 𝑂(0,0) berada di kuadran IV koordinat Kartesius.","answer":"Salah","explanation":"Koordinat antara 𝑀′(−4,2) diputar 90∘ CCW dengan rumus (𝑥, 𝑦) →(−𝑦, 𝑥), menghasilkan \nkoordinat baru 𝑀″(−2, −4). Kedua koordinat x dan y bernilai negatif, yang artinya titik ini berada \ndi kuadran III, bukan kuadran IV."},{"text":"Lokasi koordinat titik akhir pemasangan patok setelah seluruh transformasi selesai dilakukan terletak tepat di titik 𝑀‴(−7,0).","answer":"Benar","explanation":"Koordinat titik 𝑀″(−2, −4) kemudian dipindahkan oleh operasi translasi 𝑇(−5,4), menghasilkan \ntitik final di (−2 −5, −4 + 4) = (−7,0)."},{"text":"Jarak terpendek dari koordinat asal patok 𝑀 ke koordinat akhirnya 𝑀‴ adalah tepat 5 satuan.","answer":"Salah","explanation":"Jarak terdekat diperoleh menggunakan jarak koordinat asal 𝑀(2, −4) ke titik final 𝑀‴(−7,0) yaitu \n√(−7 −2)2 + (0 −(−4))2 = √(−9)2 + 42 = √81 + 16 = √97 satuan."}]},{"number":22,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Dua pemancar modulasi memproyeksikan persamaan sumbu area perbatasan perlindungan frekuensi darat sinyal komunikasi bernilai formula pembatas berbentuk relasi fungsional lurus 𝑦− 3𝑥= 6. Di hadapan rekayasa transmisi koordinat radar, area sinyal diproduksi ulang lewat cara pelebaran skala ukuran atau dilatasi sentral memuat perbesaran skala arah [𝑂, 2], dilanjutkan memproses balik posisi lintasan secara merata memicu pencerminan menembus batas tegak di sepanjang sumbu sumbu vertikal Sumbu-Y. Lakukan uji teoretik perihal penaksiran garis pembatas sinyal! Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Model garis batas sesaat selepas dimodulasi diperluas pengaruh dilatasi perbesaran linear sejalan aturan yang ditetapkan meremajakan model jalurnya jadi bermodel garis 𝑦−3𝑥= 3.","answer":"Salah","explanation":"Dari representasi koordinasi teoretik linier titik sembarang 𝑃(𝑥, 𝑦) yang menghuni persamaan 𝑦−\n3𝑥= 6. Transformasi melalui penskalaan dilatasi horizontal dari arah pangkal pusaran utama \nkoordinat [𝑂, 2] berprinsip perubahan arah bayangan ordinat barunya yakni: 𝑥′ = 2𝑥 ⟹ 𝑥=\n𝑥′\n2 \ndan searah pula 𝑦′ = 2𝑦 ⟹ 𝑦=\n𝑦′\n2 . Substitusikan model-model konversi ini di dalam tumpuan \npersamaannya mula: \n𝑦′\n2 −3(\n𝑥′\n2 ) = 6 ⟹ 𝑦′ −3𝑥′ = 12, mengubah letak garis spasial menjadi \nformat model garis tebal berumus garis lintang 𝑦−3𝑥= 12."},{"text":"Fase rentang proses yang paling akhir mengantarkan perolehan bayangan bentuk penulisan dari persamaan jalur fungsional baru berada tepat melengkung membentuk model rute relasi fungsi yaitu di 𝑦+ 3𝑥= 12.","answer":"Benar","explanation":"Ambil rumusan persandian spasial baru setelah dilatasi yakni 𝑦′ −3𝑥′ = 12. Jalankan proses \npenunjang bayangan terakhir di atas model cermin pembatas lintasan sumbu-Y di mana didapati \nkoordinat penggantinya adalah 𝑥″ = −𝑥′ ⟹ 𝑥′ = −𝑥″, berpasangan selaras 𝑦″ = 𝑦′ ⟹ 𝑦′ = 𝑦″. \nDengan melekatkan perubahan spasial ini menghasilkan jajaran fungsi rute purna terakhir \nberbentuk: 𝑦″ −3(−𝑥″) = 12 ⟹ 𝑦″ + 3𝑥″ = 12, rujukan persamaan letak tebasannya berupa \ngaris model relasi lurus kokoh di bentuk penulisan rumus koordinat spasial 𝑦+ 3𝑥= 12."},{"text":"Posisi arah kelurusan bentang garis akhir tersebut menapak lurus sejajar menggores sumbu mendatar garis koordinat absis (Sumbu-X) pada wilayah jangkauan pas pada letak (12,0).","answer":"Salah","explanation":"Titik potong sebuah model kedudukan kelurusan garis menembus mendatar terhadap lintasan \nsumbu-X didefinisikan secara linear tatkala posisi parameter sumbunya disubstitusi di nilai \nkoordinasi vertikal tinggi 𝑦= 0. Penerapan disandarkan lurus pada rumus pemotong koordinat \nsumbu: 𝑦+ 3𝑥= 12 ⟹ 0 + 3𝑥= 12 ⟹ 3𝑥= 12 ⟹ 𝑥= 4. Memastikan secara jernih \nkedudukan ketiadaan absis pemotong niscaya bertumpu menembus horizontal di kedudukan \nspasial titik titik potong lintang koordinasi yaitu di (4,0), bukannya memintas lurus bertolak \nmeluncur menembus titik jangkauan pas pada letak berjarak sejauh di (12,0)."},{"text":"Tingkat kelerengan as sudut arah pergerakan garis yang didapat pasca berlalunya segenap bentuk aksi pemindahan di grafik linear kartesius tercantum bernilai kemiringan menurun negatif yaitu senilai gradien sebesar −3.","answer":"Benar","explanation":"Uraikan hasil terminal kedudukan garis akhir sumbunya yang tersua 𝑦+ 3𝑥= 12 menuju struktur \nkemiringan umum: 𝑦= −3𝑥+ 12. Melalui penelaahan atas kedudukan kofaktor gradien koefisien \nlurus linear variabel sumbu horizontal diperoleh kepastian kelurusan parameter kemiringannya \n(𝑚) nyata-nyata condong miring dengan tumpuan bilangan real bernilai sebesar −3."}]},{"number":23,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Dalam sebuah simulasi pertahanan udara, jet tempur mula-mula terdeteksi di koordinat radar 𝐴(−1,3). Jet tersebut bergerak menjauh melalui refleksi berturut-turut, yaitu pertama dicerminkan terhadap garis 𝑦= −2, lalu dicerminkan lagi terhadap garis 𝑥= 3. Tim operator menganalisis perubahan koordinat jet tersebut. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Koordinat bayangan radar jet tempur setelah pencerminan pertama adalah 𝐴′(−1, −7).","answer":"Benar","explanation":"Pencerminan 𝐴(−1,3) terhadap 𝑦= −2 menghasilkan koordinat 𝐴′(−1,2(−2) −3) = 𝐴′(−1, −7)."},{"text":"Koordinat bayangan akhir radar jet tempur adalah 𝐴″(7,7).","answer":"Salah","explanation":"Koordinat perantara 𝐴′(−1, −7) kemudian direfleksikan terhadap garis vertikal 𝑥= 3 sehingga \nkoordinat akhirnya adalah 𝐴″(2(3) −(−1), −7) = 𝐴″(7, −7)."},{"text":"Jarak tegak lurus dari titik asal 𝐴(−1,3) ke garis cermin pertama 𝑦= −2 adalah 4 satuan.","answer":"Salah","explanation":"Jarak tersebut setara dengan selisih mutlak dari kedua ordinat tersebut, yaitu |3 −(−2)| = 5 \nsatuan."},{"text":"Jika titik asal 𝐴(−1,3) langsung direfleksikan terhadap garis 𝑥= 3, maka diperoleh bayangan di (7,3).","answer":"Benar","explanation":"Pencerminan dari 𝐴(−1,3) ke garis vertikal 𝑥= 3 hanya akan mempengaruhi komponen absis 𝑥, \nmenjadi (2(3) −(−1),3) = (7,3)."}]},{"number":24,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menerapkan karakteristik transformasi geometri (translasi, refleksi, rotasi, dan dilatasi) dengan menggunakan koordinat kartesius serta menyelesaikan permasalahan kontekstual yang terkait.","question":"Di atas bidang navigasi lintasan perakitan otomotif pintar di pabrik perakitan, jalur tengah penyeberangan direpresentasikan koordinat awal di letak permodelan linear garis bersamanya di 3𝑥−𝑦= 5. Persamaan lintasan direncanakan digeser agar diserasikan ke rancangan interior mobil melalui simetris pertama garis bersumbu cermin asimtot asalnya di letak 𝑦= 𝑥, dilanjutkan kembali pemutaran arah miring atau rotasi sumbu searah rotasi putar 90∘ jarum jam dari poros titik sumbu asalnya 𝑂(0,0). Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Hasil kedudukan transisi alur jalur penyeberangan sesudah pencerminan tahap awal disinyalir mengusung posisi garis linier searah kemiringan lintasan awal, alias bersifat paralel sejajar satu arah di monitor koordinat navigasinya.","answer":"Salah","explanation":"Lintasan dari penyusun sumbu pencerminan asimtot asalnya terhadap relasi lurus diagonal \nmendasar 𝑦= 𝑥 bergradien invers kemiringan koordinat miring, gradien berubah bentuk terarah \ntimbal balik 3 →1/3. Dua sifat ini dipastikan tidak paralel sejajar melainkan bersilangan saling \nmiring di grafik peta penyeberangan kabel utama."},{"text":"Formula jangkauan letak lintasan penutup menyangkut kedudukan kabel sasis pasca dijalani serentetan penggeseran transformasinya mewakili persamaan miring aljabar baru sebesar 3𝑥− 𝑦= −5.","answer":"Salah","explanation":"Garis lintasan pasca dijalani transformasi transisi adalah lintasan pergeseran 𝑥−3𝑦+ 5 = 0 \n(atau 3𝑦−𝑥= 5). Jika diputar rotasi arah jam melingkar sudut pembanding bernilai sebesar \n−90∘, menghasilkan relasi miring transformasi baru penutup yang sahih di lintasan persamaan \nbersamanya yaitu 3𝑥+ 𝑦= 5. Diperoleh simpulan rumus lintasan otomotif pembanding bernilai \nkeliru menderita galat penanda negatif aljabar."},{"text":"Rumus persentase pembuat sumbu antara garis asimilasi baru lintasan penyeberangan kabel seketika selepas dicerminkan melalui poros 𝑦= 𝑥 diraih lurus bermuatan kedudukan fisis berupa formula 𝑥−3𝑦+ 5 = 0.","answer":"Benar","explanation":"Metode pemantulan koordinat meloncati asimtot diagonal relasi searah di lintasan relasi koordinat \nmula-mula digantikan pertukaran kedudukan nilai fungsi aljabar yaitu parameter posisi koordinat \n𝑥→𝑦 dan 𝑦→𝑥. Maka garis murni lintasan perakitan bersarang baru berputar ke kedudukan \nrepresentatif linear di 3𝑦−𝑥= 5 yang setara bernilai 𝑥−3𝑦+ 5 = 0, sebuah klaim kebenaran \nfisis yang sepenuhnya absah."},{"text":"Garis bentang lintasan sekunder otomotif andalan robotik pasca integrasi dari translasinya berpenjuru hasil titik koordinat iris pada bagian sumbu mendasar horizontal poros absis sumbu-X memicu potongan letak berharga koordinat lintasan di ( 5 3 , 0).","answer":"Benar","explanation":"Kondisi perpotongan linier navigasi robot dengan jalur lurus sumbu poros poros-X ditegaskan \nmanakala nilai dari fungsi variabel pendamping 𝑦= 0 pada bayangan final garis miring yang telah \ndievaluasi, 3𝑥+ 𝑦= 5 →3𝑥+ 0 = 5 →𝑥= 5/3. Posisi perpotongannya secara geometris akurat \nada di letak koordinat (\n5\n3 , 0)."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
