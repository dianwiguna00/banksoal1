<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Kekongruenan</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT KEKONGRUENAN</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 18</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 18</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":19,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 1 \n \nJika segitiga 𝐴𝐵𝐶 kongruen dengan segitiga 𝐾𝐿𝑀 dengan urutan sudut yang bersesuaian adalah \nsudut 𝐴 dengan sudut 𝐾, dan sudut 𝐵 dengan sudut 𝐿, maka sisi yang sama panjang dengan sisi \n𝐵𝐶 adalah ....","options":[{"key":"A","text":"sisi 𝐴𝐵"},{"key":"B","text":"sisi 𝐾𝐿"},{"key":"C","text":"sisi 𝐾𝑀"},{"key":"D","text":"sisi 𝐿𝑀"}],"answer":"D","explanation":"Langkah 1: Berdasarkan informasi kekongruenan segitiga 𝐴𝐵𝐶 dan segitiga 𝐾𝐿𝑀, pasangkan \ntitik-titik sudut yang bersesuaian: 𝐴↔𝐾, 𝐵↔𝐿, dan 𝐶↔𝑀. \n\nLangkah 2: Sisi 𝐵𝐶 dibentuk oleh titik sudut 𝐵 dan 𝐶, sehingga sisi tersebut bersesuaian dengan \nsisi yang dibentuk oleh titik 𝐿 dan 𝑀, yaitu sisi 𝐿𝑀. \nLangkah 3: Karena kedua segitiga kongruen, maka sisi-sisi yang bersesuaian memiliki panjang \nyang sama, sehingga 𝐵𝐶= 𝐿𝑀. \nJawaban Benar: D"},{"number":20,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 1 \n \nDua bangun datar dikatakan kongruen jika memenuhi syarat tertentu. Manakah dari pernyataan \nberikut yang merupakan salah satu syarat agar dua bangun datar dikatakan kongruen?","options":[{"key":"A","text":"Sisi-sisi yang bersesuaian memiliki panjang yang sama"},{"key":"B","text":"Sisi-sisi yang bersesuaian memiliki perbandingan yang senilai"},{"key":"C","text":"Sudut-sudut yang bersesuaian saling berpelurus"},{"key":"D","text":"Sudut-sudut yang bersesuaian memiliki jumlah 180∘"}],"answer":"A","explanation":"Syarat dua bangun datar kongruen adalah sisi-sisi yang bersesuaian sama panjang dan sudut-\nsudut yang bersesuaian sama besar. \nPilihan yang tepat adalah sisi-sisi yang bersesuaian memiliki panjang yang sama. \nJawaban Benar: A"},{"number":21,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 1 \n \nDua buah potongan kain berbentuk persegi panjang untuk kerajinan batik, yaitu kain 𝑋 dan kain \n𝑌, dinyatakan kongruen. Jika kain 𝑋 memiliki ukuran panjang 20 cm dan lebar 15 cm, berapakah \nluas dari kain 𝑌?","options":[{"key":"A","text":"35 cm 2"},{"key":"B","text":"70 cm 2"},{"key":"C","text":"150 cm 2"},{"key":"D","text":"300 cm 2"}],"answer":"D","explanation":"Langkah 1: Menggunakan sifat kekongruenan, luas dua bangun datar yang kongruen adalah \nsama besar. \n\nLangkah 2: Hitung luas kain 𝑋= 𝑝𝑎𝑛𝑗𝑎𝑛𝑔× 𝑙𝑒𝑏𝑎𝑟= 20 × 15 = 300 cm\n2. \nLangkah 3: Luas kain 𝑌= 𝐿𝑢𝑎𝑠 𝑘𝑎𝑖𝑛 𝑋= 300 cm\n2. \nJawaban Benar: D"},{"number":22,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 2 \n \nDua buah layang-layang hias, yaitu layang-layang 𝐴𝐵𝐶𝐷 dan layang-layang 𝐸𝐹𝐺𝐻, dibuat \nkongruen oleh seorang pengrajin. Layang-layang 𝐴𝐵𝐶𝐷 memiliki panjang diagonal vertikal 𝐴𝐶=\n24 cm dan diagonal horizontal 𝐵𝐷= 10 cm yang saling tegak lurus. Berapakah luas dari layang-\nlayang 𝐸𝐹𝐺𝐻 tersebut?","options":[{"key":"A","text":"60 cm 2."},{"key":"B","text":"120 cm 2."},{"key":"C","text":"240 cm 2."},{"key":"D","text":"480 cm 2."}],"answer":"B","explanation":"Langkah 1: Karena layang-layang 𝐸𝐹𝐺𝐻 kongruen dengan layang-layang 𝐴𝐵𝐶𝐷, maka ukuran \ndiagonal-diagonal layang-layang 𝐸𝐹𝐺𝐻 adalah sama dengan 𝐴𝐵𝐶𝐷, yaitu 𝑑1 = 24 cm dan 𝑑2 =\n10 cm. \nLangkah 2: Hitung luas layang-layang tersebut menggunakan rumus luas layang-layang: 𝐿𝑢𝑎𝑠=\n1\n2 × 𝑑1 × 𝑑2 =\n1\n2 × 24 × 10 = 120 cm\n2. \nJawaban Benar: B"},{"number":23,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 2 \n \nSebuah kerajinan ukiran kayu berbentuk segitiga siku-siku 𝐴𝐵𝐶 dengan siku-siku di 𝐵 kongruen \ndengan segitiga 𝑃𝑄𝑅 dengan siku-siku di 𝑃. Diketahui panjang 𝐴𝐵= 12 cm dan luas segitiga 𝑃𝑄𝑅 \nadalah 30 cm². Berapakah keliling segitiga 𝐴𝐵𝐶?","options":[{"key":"A","text":"30 cm."},{"key":"B","text":"36 cm."},{"key":"C","text":"40 cm."},{"key":"D","text":"48 cm."}],"answer":"A","explanation":"Karena △𝐴𝐵𝐶 kongruen dengan △𝑄𝑃𝑅, maka luas keduanya adalah sama, yaitu Luas △𝐴𝐵𝐶=\n30 cm². \nGunakan rumus luas segitiga untuk mencari panjang 𝐵𝐶: Luas =\n1\n2 × 𝐴𝐵× 𝐵𝐶 ⟹ 30 =\n1\n2 × 12 × 𝐵𝐶 ⟹ 30 = 6 × 𝐵𝐶 ⟹ 𝐵𝐶= 5 cm. \nKarena △𝐴𝐵𝐶 siku-siku di 𝐵, cari panjang sisi miring 𝐴𝐶 menggunakan teorema Pythagoras: \n𝐴𝐶= √𝐴𝐵2 + 𝐵𝐶2 = √122 + 52 = √144 + 25 = √169 = 13 cm. \nHitung keliling segitiga 𝐴𝐵𝐶: Keliling = 𝐴𝐵+ 𝐵𝐶+ 𝐴𝐶= 12 + 5 + 13 = 30 cm. \nJawaban Benar: A"},{"number":24,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 2 \n \nPada sebuah jembatan bambu, terdapat struktur penyangga berbentuk trapesium 𝐴𝐵𝐶𝐷 dengan \n𝐴𝐵 sejajar 𝐶𝐷. Sebuah garis penguat horizontal 𝐸𝐹 dibuat sejajar dengan 𝐴𝐵 dan 𝐶𝐷, di mana \ntitik 𝐸 terletak pada 𝐴𝐷 dan 𝐹 pada 𝐵𝐶. Jika panjang 𝐴𝐵= 6 meter, 𝐶𝐷= 12 meter, dan rasio \npanjang 𝐴𝐸: 𝐸𝐷= 2: 1, berapakah panjang garis penguat 𝐸𝐹?","options":[{"key":"A","text":"8 meter."},{"key":"B","text":"10 meter."},{"key":"C","text":"12 meter."},{"key":"D","text":"14 meter."}],"answer":"B","explanation":"Langkah 1: Gunakan rumus kesebangunan trapesium untuk garis sejajar di tengah: 𝐸𝐹=\n(𝐴𝐸×𝐶𝐷)+(𝐸𝐷×𝐴𝐵)\n𝐴𝐸+𝐸𝐷\n. \nLangkah 2: Substitusikan rasio 𝐴𝐸: 𝐸𝐷= 2: 1 dan panjang sisi sejajar ke dalam rumus: 𝐸𝐹=\n(2×12)+(1×6)\n2+1\n=\n24+6\n3\n=\n30\n3 = 10 meter. \nJawaban Benar: B"},{"number":25,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 3 \n \nDua buah cetakan kue berbentuk segitiga, cetakan 𝐴𝐵𝐶 dan cetakan 𝑃𝑄𝑅, dibuat agar saling \nkongruen dengan 𝛥𝐴𝐵𝐶≅𝛥𝑃𝑄𝑅. Diketahui panjang sisi 𝐴𝐵= (2𝑥+ 3) cm, 𝐵𝐶= (3𝑦−1) cm, \ndan besar ∠𝐵= 50∘. Pada cetakan 𝑃𝑄𝑅, diketahui panjang 𝑃𝑄= (𝑦+ 5) cm, 𝑄𝑅= (𝑥+ 7) cm, \ndan besar ∠𝑄= 50∘. Jika sisi 𝐴𝐵 bersesuaian dengan 𝑄𝑅, sisi 𝐵𝐶 bersesuaian dengan 𝑃𝑄, dan \npanjang sisi 𝐴𝐶 dinyatakan dengan (3𝑥−𝑦) cm, berapakah keliling cetakan kue 𝐴𝐵𝐶 tersebut?","options":[{"key":"A","text":"24 cm"},{"key":"B","text":"26 cm"},{"key":"C","text":"28 cm"},{"key":"D","text":"30 cm"}],"answer":"C","explanation":"Langkah 1: Karena kedua segitiga kongruen dan sisi 𝐴𝐵 bersesuaian dengan 𝑄𝑅, maka 𝐴𝐵=\n𝑄𝑅 ⟹ 2𝑥+ 3 = 𝑥+ 7 ⟹ 𝑥= 4. \nLangkah 2: Karena sisi 𝐵𝐶 bersesuaian dengan 𝑃𝑄, maka 𝐵𝐶= 𝑃𝑄 ⟹ 3𝑦−1 = 𝑦+ 5 ⟹ 2𝑦=\n6 ⟹ 𝑦= 3. \nLangkah 3: Hitung panjang sisi-sisi segitiga 𝐴𝐵𝐶. 𝐴𝐵= 2(4) + 3 = 11 cm. 𝐵𝐶= 3(3) −1 = 8 cm. \nSisi 𝐴𝐶= 3𝑥−𝑦= 3(4) −3 = 12 −3 = 9 cm. \nLangkah 4: Hitung keliling cetakan 𝐴𝐵𝐶. Keliling = 𝐴𝐵+ 𝐵𝐶+ 𝐴𝐶= 11 + 8 + 9 = 28 cm. \nJawaban Benar: C"},{"number":26,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 3 \n \nSebuah kelas matematika membahas dua segitiga sebangun, △𝑃𝑄𝑅 dan △𝑇𝑈𝑉. Pada △𝑃𝑄𝑅, \npanjang sisi-sisinya adalah 𝑃𝑄= 9 𝑐𝑚, 𝑄𝑅= 12 𝑐𝑚, dan 𝑃𝑅= 15 𝑐𝑚. Pada △𝑇𝑈𝑉 yang \nsebangun dengan △𝑃𝑄𝑅, panjang sisi terpendeknya dinyatakan sebagai (2𝑥+ 4) 𝑐𝑚 dan sisi \nterpanjangnya sebagai (3𝑥+ 10) 𝑐𝑚. Berapakah panjang sisi ketiga (sisi menengah) dari △𝑇𝑈𝑉 \ntersebut?","options":[{"key":"A","text":"18 𝑐𝑚"},{"key":"B","text":"24 𝑐𝑚"},{"key":"C","text":"28 𝑐𝑚"},{"key":"D","text":"32 𝑐𝑚"}],"answer":"D","explanation":"Langkah 1: Tentukan perbandingan sisi terpendek dan terpanjang pada △𝑃𝑄𝑅. Sisi \nterpendeknya adalah 9 𝑐𝑚 dan sisi terpanjangnya adalah 15 𝑐𝑚. Rasionya adalah 9: 15 = 3: 5. \nLangkah 2: Karena △𝑇𝑈𝑉∼△𝑃𝑄𝑅, rasio sisi terpendek terhadap terpanjang pada △𝑇𝑈𝑉 juga \nharus bernilai 3: 5. Buat persamaan aljabar: \n2𝑥+4\n3𝑥+10 =\n3\n5. \nLangkah 3: Lakukan perkalian silang untuk menyelesaikan persamaan: 5(2𝑥+ 4) = 3(3𝑥+ 10) ⇒\n10𝑥+ 20 = 9𝑥+ 30 ⇒𝑥= 10. \nLangkah 4: Substitusikan nilai 𝑥= 10 ke dalam panjang sisi terpendek dan terpanjang △𝑇𝑈𝑉: \nSisi terpendek = 2(10) + 4 = 24 𝑐𝑚, Sisi terpanjang = 3(10) + 10 = 40 𝑐𝑚. \nLangkah 5: Tentukan panjang sisi menengah. Rasio sisi △𝑃𝑄𝑅 adalah 3: 4: 5 (terpendek : \nmenengah : terpanjang). Maka sisi menengah △𝑇𝑈𝑉 adalah \n4\n5 × 𝑠𝑖𝑠𝑖 𝑡𝑒𝑟𝑝𝑎𝑛𝑗𝑎𝑛𝑔=\n4\n5 × 40 =\n32 𝑐𝑚. \nJawaban Benar: D"},{"number":27,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Level 3 \n \nDua buah bingkai foto berbentuk jajar genjang, bingkai 𝐴𝐵𝐶𝐷 dan bingkai 𝐸𝐹𝐺𝐻, dinyatakan \nkongruen (𝐴𝐵𝐶𝐷≅𝐸𝐹𝐺𝐻). Diketahui panjang sisi 𝐴𝐵= (2𝑥+ 5) cm, 𝐵𝐶= (3𝑦−1) cm, 𝐸𝐹=\n(𝑥+ 12) cm, dan 𝐹𝐺= (𝑦+ 7) cm. Selain itu, besar sudut ∠𝐷𝐴𝐵= (5𝑧−10)∘ dan ∠𝐻𝐸𝐹= (3𝑧+\n30)∘. Berapakah nilai dari 𝑥+ 𝑦+ 𝑧?","options":[{"key":"A","text":"16"},{"key":"B","text":"29"},{"key":"C","text":"31"},{"key":"D","text":"41"}],"answer":"C","explanation":"Langkah 1: Karena jajar genjang 𝐴𝐵𝐶𝐷≅𝐸𝐹𝐺𝐻, maka sisi-sisi yang bersesuaian sama panjang. \nSisi 𝐴𝐵 bersesuaian dengan 𝐸𝐹, sehingga: 2𝑥+ 5 = 𝑥+ 12 ⟹ 𝑥= 7. \nLangkah 2: Sisi 𝐵𝐶 bersesuaian dengan 𝐹𝐺, sehingga: 3𝑦−1 = 𝑦+ 7 ⟹ 2𝑦= 8 ⟹ 𝑦= 4. \nLangkah 3: Sudut-sudut yang bersesuaian juga sama besar. Sudut ∠𝐷𝐴𝐵 bersesuaian dengan \n∠𝐻𝐸𝐹, sehingga: 5𝑧−10 = 3𝑧+ 30 ⟹ 2𝑧= 40 ⟹ 𝑧= 20. \nLangkah 4: Jumlahkan nilai 𝑥+ 𝑦+ 𝑧= 7 + 4 + 20 = 31. \nJawaban Benar: C"},{"number":28,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Dua buah bangun segiempat sembarang, ABCD dan PQRS, dinyatakan saling kongruen secara \npenuh. Tentukan benar atau salah untuk setiap kriteria berikut yang menyatakan sifat \nkonsekuensi logis dari konsep kekongruenan bangun datar tersebut!","statements":[{"text":"Setiap pasang sisi yang bersesuaian dari ABCD dan PQRS harus memiliki panjang yang \nsama.","answer":"Benar","explanation":"Ini merupakan konsekuensi mutlak dari definisi dua bangun yang kongruen, yaitu semua sisi yang \nbersesuaian harus sama panjang."},{"text":"Luas segiempat ABCD bisa saja lebih besar atau lebih kecil dari luas segiempat PQRS.","answer":"Salah","explanation":"Dua bangun yang kongruen memiliki ukuran yang identik, sehingga luas dan keliling kedua \nbangun datar tersebut dipastikan harus sama besar."},{"text":"Setiap sudut yang bersesuaian dari kedua segiempat memiliki besar sudut yang tepat sama.","answer":"Benar","explanation":"Benar, selain sisi, sudut-sudut yang bersesuaian pada bangun datar yang kongruen wajib \nmemiliki besar sudut yang sama."},{"text":"Dua bangun tersebut hanya memiliki bentuk yang sama namun salah satu sisinya boleh \nmemiliki ukuran yang diperbesar.","answer":"Salah","explanation":"Salah. Bangun yang bentuknya sama namun ukurannya boleh diperbesar/diperkecil dinamakan \nsebangun, bukan kongruen."}]},{"number":29,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Dua buah segitiga, yaitu segitiga 𝐴𝐵𝐶 dan segitiga 𝑃𝑄𝑅, diketahui memiliki panjang sisi-sisi yang \nbersesuaian sama panjang, yaitu 𝐴𝐵= 𝑃𝑄= 6 cm, 𝐵𝐶= 𝑄𝑅= 8 cm, dan 𝐴𝐶= 𝑃𝑅= 10 cm. Beri \ntanda centang (✓) pada setiap pernyataan yang benar mengenai kedua segitiga tersebut!","statements":[{"text":"Segitiga 𝐴𝐵𝐶 dan segitiga 𝑃𝑄𝑅 memenuhi syarat kekongruenan sisi-sisi-sisi.","answer":"Benar","explanation":"Syarat dua segitiga kongruen adalah ketiga sisi yang bersesuaian sama panjang (sisi-sisi-sisi). Di \nsini, ketiga sisi pada masing-masing segitiga saling sama panjang."},{"text":"Sudut-sudut yang bersesuaian pada kedua segitiga tersebut pasti sama besar, yaitu ∠𝐴= ∠𝑃, \n∠𝐵= ∠𝑄, dan ∠𝐶= ∠𝑅.","answer":"Benar","explanation":"Karena kedua segitiga terbukti kongruen, maka seluruh pasangan sudut yang bersesuaian yang \nmenghadap sisi yang sama juga pasti sama besar."},{"text":"Panjang keliling kedua segitiga tersebut berbeda karena posisinya digeser.","answer":"Salah","explanation":"Kekongruenan tidak terpengaruh oleh perpindahan posisi (geseran). Maka dari itu keliling kedua \nsegitiga akan tetap sama besar yaitu 6 + 8 + 10 = 24 cm."},{"text":"Luas segitiga 𝑃𝑄𝑅 adalah dua kali lipat dari luas segitiga 𝐴𝐵𝐶.","answer":"Salah","explanation":"Dua bangun yang kongruen memiliki bentuk dan ukuran yang sama persis, sehingga luas \nkeduanya dipastikan bernilai sama besar, tidak mungkin salah satu menjadi dua kalinya."}]},{"number":30,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Sebuah layangan hias berbentuk layang-layang PQRS memiliki kerangka bambu utama PR yang \nsekaligus menjadi sumbu simetrinya. Kerangka ini membagi bidang layangan menjadi dua \nsegitiga kongruen yaitu segitiga PQR dan segitiga PSR. Beri tanda centang (✓) pada setiap \npernyataan yang benar!","statements":[{"text":"Segitiga PQR dan segitiga PSR kongruen berdasarkan syarat Sisi-Sisi-Sisi (S-S-S) karena PQ \n= PS, QR = SR, dan PR berimpit.","answer":"Benar","explanation":"Semua pasangan sisi yang bersesuaian dari segitiga PQR dan segitiga PSR memiliki panjang \nyang sama, di mana PR adalah sisi yang digunakan bersama sehingga pasti kongruen \nberdasarkan syarat S-S-S."},{"text":"Besar sudut PQR pasti bernilai tepat sama besar dengan sudut PSR.","answer":"Benar","explanation":"Sebagai akibat dari kekongruenan dua buah bidang segitiga sayap layang-layang tersebut, \nsemua bagian sudut bersesuaian berukuran identik."},{"text":"Kerangka tengah diagonal PR dari bagian sisi segitiga PQR memiliki panjang berbeda dengan \ndiagonal PR bagian PSR.","answer":"Salah","explanation":"Salah interpretasi bentuk berserikat fisik. Potongan diagonal penyokong merupakan struktur satu \nkomponen tunggal padat (saling tumpang/berimpit) sehingga dimensinya bernilai mutlak sama."},{"text":"Sudut QPR pasti memiliki besar yang sama dengan sudut SPR karena PR membagi sudut P \nsama besar.","answer":"Benar","explanation":"Sumbu simetri utama layang-layang berperan langsung memotong atau membelah besaran \nsudut hulu penahan atas bidang terbang tersebut secara presisi adil merata tengah."}]},{"number":31,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Dua trapesium sama kaki, yaitu 𝐴𝐵𝐶𝐷 dengan sisi sejajar 𝐴𝐵∥𝐶𝐷, dan 𝑃𝑄𝑅𝑆 dengan 𝑃𝑄∥𝑅𝑆, \nadalah kongruen dengan korespondensi 𝐴𝐵↔𝑃𝑄, 𝐵𝐶↔𝑄𝑅, 𝐶𝐷↔𝑅𝑆, dan 𝐷𝐴↔𝑆𝑃. Diketahui \npanjang 𝐶𝐷= 10 cm, 𝐴𝐵= 16 cm, dan tinggi trapesium 𝐴𝐵𝐶𝐷 adalah 4 cm. Beri tanda centang \n(✓) pada setiap pernyataan yang benar!","statements":[{"text":"Panjang sisi kaki trapesium 𝑃𝑄𝑅𝑆 adalah 5 cm.","answer":"Benar","explanation":"Pada trapesium sama kaki 𝐴𝐵𝐶𝐷, panjang proyeksi kaki ke alas adalah \n16−10\n2\n= 3 cm. \nMenggunakan teorema Pythagoras dengan tinggi 4 cm, panjang kaki 𝐴𝐷= 𝐵𝐶= √32 + 42 = 5 \ncm. Karena trapesium 𝑃𝑄𝑅𝑆≅𝐴𝐵𝐶𝐷, panjang kaki 𝑃𝑆= 𝑄𝑅= 5 cm."},{"text":"Keliling trapesium 𝑃𝑄𝑅𝑆 adalah 31 cm.","answer":"Salah","explanation":"Keliling trapesium 𝑃𝑄𝑅𝑆= 𝑃𝑄+ 𝑄𝑅+ 𝑅𝑆+ 𝑆𝑃= 16 + 5 + 10 + 5 = 36 cm, bukan 31 cm."},{"text":"Luas trapesium 𝑃𝑄𝑅𝑆 adalah 52 cm\n2.","answer":"Benar","explanation":"Luas trapesium 𝑃𝑄𝑅𝑆 sama dengan luas 𝐴𝐵𝐶𝐷, yaitu \n1\n2 × (𝐴𝐵+ 𝐶𝐷) × 𝑡𝑖𝑛𝑔𝑔𝑖=\n1\n2 × (16 +\n10) × 4 = 52 cm\n2."},{"text":"Selisih panjang sisi sejajar trapesium 𝑃𝑄𝑅𝑆 adalah 3 cm.","answer":"Salah","explanation":"Sisi-sisi sejajar 𝑃𝑄 dan 𝑅𝑆 adalah 16 cm dan 10 cm. Selisihnya adalah 16 −10 = 6 cm, \nsedangkan 3 cm merupakan panjang proyeksi kaki."}]},{"number":32,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Dua bidang tanah kavling berbentuk persegi panjang, yaitu Kavling A dan Kavling B, adalah \nkongruen. Diketahui keliling Kavling A adalah 60 meter dan lebar salah satu sisinya adalah 12 \nmeter. Tentukan benar atau salah untuk setiap pernyataan berikut yang menerangkan hubungan \nukuran dimensi pada kedua kavling tanah tersebut!","statements":[{"text":"Panjang sisi terpanjang Kavling B adalah 15 meter.","answer":"Salah","explanation":"Sesuai rumus keliling 2(𝑝+ 𝑙) = 60 ⟹ 𝑝+ 𝑙= 30. Karena lebarnya 12 meter, maka panjangnya \n𝑝= 30 −12 = 18 meter. Sisi terpanjang Kavling B yang kongruen dengan Kavling A juga harus \nbernilai 18 meter."},{"text":"Selisih panjang dan lebar dari Kavling B adalah 6 meter.","answer":"Benar","explanation":"Panjang Kavling B adalah 18 meter dan lebarnya 12 meter. Selisih kedua sisinya adalah 18 −\n12 = 6 meter."},{"text":"Luas Kavling B adalah 216 meter persegi.","answer":"Benar","explanation":"Karena Kavling B kongruen dengan Kavling A, ukurannya sama. Maka luas Kavling B = \n18 𝑚𝑒𝑡𝑒𝑟× 12 𝑚𝑒𝑡𝑒𝑟= 216 meter persegi."},{"text":"Perbandingan lebar terhadap panjang pada Kavling B adalah 2: 3.","answer":"Benar","explanation":"Rasio lebar dibanding panjang pada Kavling B adalah 12: 18. Menyederhanakan rasio ini dengan \nmembagi masing-masing angka dengan fpb-nya (6) menghasilkan perbandingan 2: 3."}]},{"number":33,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Dua belah ketupat, 𝐴𝐵𝐶𝐷 dan 𝐾𝐿𝑀𝑁, dinyatakan kongruen. Belah ketupat 𝐴𝐵𝐶𝐷 memiliki keliling \n40 cm dan salah satu diagonal 𝐴𝐶 sepanjang 12 cm. Tentukan benar atau salah untuk setiap \npernyataan berikut!","statements":[{"text":"Panjang sisi belah ketupat 𝐾𝐿𝑀𝑁 adalah 8 cm.","answer":"Salah","explanation":"Keliling belah ketupat adalah 40 cm. Maka sisi belah ketupat 𝐴𝐵𝐶𝐷= 40/4 = 10 cm. Karena \n𝐾𝐿𝑀𝑁≅𝐴𝐵𝐶𝐷, panjang sisinya adalah 10 cm."},{"text":"Panjang diagonal lainnya pada belah ketupat 𝐾𝐿𝑀𝑁 adalah 16 cm.","answer":"Benar","explanation":"Pada belah ketupat, setengah diagonal 𝐴𝐶 adalah 6 cm dan sisinya adalah 10 cm. Menggunakan \nPythagoras, setengah diagonal lainnya adalah √102 −62 = 8 cm. Jadi, panjang diagonal lainnya \nadalah 2 × 8 = 16 cm."},{"text":"Luas belah ketupat 𝐾𝐿𝑀𝑁 adalah 96 cm\n2.","answer":"Benar","explanation":"Panjang diagonal 𝐾𝐿𝑀𝑁 adalah 12 cm dan 16 cm. Luasnya adalah \n1\n2 × 12 × 16 = 96 cm\n2."},{"text":"Jumlah panjang kedua diagonal belah ketupat 𝐾𝐿𝑀𝑁 adalah 32 cm.","answer":"Salah","explanation":"Kedua diagonalnya adalah 12 cm dan 16 cm. Jumlah panjang diagonal adalah 12 + 16 = 28 cm."}]},{"number":34,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Sepasang plat penyangga ornamen siku baja bercorak khas kedaerahan diproduksi dengan \nmenjaga syarat kekongruenan antara plat △𝐴𝐵𝐶 dan plat △𝐷𝐸𝐹. Diketahui sisi siku penyangga \nplat baja △𝐴𝐵𝐶 tertulis dimensi fungsinya yaitu 𝐴𝐵= (2𝑎+ 4) cm dan sisi terpanjang sisi miring \n𝐴𝐶= (3𝑎+ 3) cm dengan total lingkar keliling pelat tersebut sebesar 36 cm. Pola penahan baja \nlainnya yaitu △𝐷𝐸𝐹 diproses dengan meletakkan bagian penyangga tinggi tegak 𝐷𝐸= 9 cm dan \nbagian penapaknya 𝐸𝐹= (3𝑏−3) cm. Analisis nilai variabel sudut tumpuan miring mutlak \ndiperlukan oleh bagian pengepresan metal mesin pabrik. Beri tanda centang (✓) pada setiap \npernyataan yang benar!","statements":[{"text":"Besar nilai variabel aljabar plat besi penyokong bagian miring segitiga 𝑃𝑄𝑅 menghasilkan \nketetapan nilai bernilai 𝑎= 3.","answer":"Salah","explanation":"Modul △𝐴𝐵𝐶 merupakan model segitiga siku-siku bertipe tripel Pythagoras dari rujukan ukuran \nsegitiga modular keduanya (diketahui panjang 𝐷𝐸= 9 cm). Berdasarkan karakteristik segitiga \nsiku-siku berukuran total keliling 36 cm, kombinasi sisinya harus bernilai {9,12,15} cm karena 9 +\n\n12 + 15 = 36 dan 92 + 122 = 152. Di mana sisi terpanjang miring 𝐴𝐶= 15 ⟹ 3𝑎+ 3 = 15 ⟹\n 3𝑎= 12 ⟹ 𝑎= 4."},{"text":"Dimensi aslinya dari kerangka plat miring baja pelapis penutup siku (𝐷𝐹) segitiga kedua diukur \nmemanjang dengan dimensi total ukuran sepanjang 17 cm.","answer":"Salah","explanation":"Pada pola desain segitiga siku-siku bertipe tripel Pythagoras, kombinasi dimensinya adalah \n{9,12,15} cm. Hipotenusa penahan terluar atau sisi terpanjang 𝐷𝐹 dipastikan memiliki panjang \nsenilai 15 cm."},{"text":"Panjang tumpuan nako mendatar alas di dasar pola sayap 𝐸𝐹 berukuran sepanjang 12 cm, \nyang berarti besar penampang ini menyatu dengan keserasian nilai hitung variabel 𝑏= 5.","answer":"Benar","explanation":"Sesuai tripel penyokong ornamen siku, bagian lurus penahan penapak memiliki paduan letak 𝐸𝐹 \nsetara dengan sisi alas setinggi 12 cm. Maka formula dapat disetarakan sebagai 3𝑏−3 = 12 ⟹\n 3𝑏= 15 ⟹ 𝑏= 5, sehingga nilai 𝑏 disetujui sah."},{"text":"Total kumulatif matematika antara variabel rancangan 𝑎 dan 𝑏 didapat sebesar 9, serta ukuran \nluasan luas permukaan mika segitiga nako tersebut bernilai 54 cm\n2.","answer":"Benar","explanation":"Didapatkan kombinasi variabel rakitan cetakan baja ornamen yakni 𝑎= 4 dan 𝑏= 5 yang \nmemberi total jumlahan sebesar 𝑎+ 𝑏= 9. Sementara nilai sebaran luasan material didapat \nmenggunakan rumus segitiga siku-siku biasa: 𝐿𝑢𝑎𝑠=\n1\n2 × 𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖=\n1\n2 × 9 × 12 = 54 cm\n2."}]},{"number":35,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Sebuah rangka baja ringan jembatan penyeberangan didesain membentuk bidang jajar genjang \n𝐴𝐵𝐶𝐷 dengan panjang sisi sejajar 𝐴𝐵= 𝐶𝐷= 20 meter dan 𝐴𝐷= 𝐵𝐶= 12 meter. Sudut dalam di \ntitik 𝐴 diukur sebesar ∠𝐷𝐴𝐵= 60∘. Rangka ini memiliki dua pipa interior baja berbentuk menyilang \nsebagai diagonal penghubung antara titik 𝐴 ke 𝐶, serta dari titik 𝐵 ke 𝐷. Rekayasa ketahanan \nmemaksa insinyur menguji apakah struktur ini terbagi secara simetris-kongruen demi menjaga \nkestabilan jembatan. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Segitiga 𝐴𝐵𝐷 kongruen dengan segitiga 𝐶𝐷𝐵 karena memenuhi kriteria Sisi-Sudut-Sisi (Si-Su-\nSi) secara simetris.","answer":"Benar","explanation":"Pada jajar genjang 𝐴𝐵𝐶𝐷, kita memiliki 𝐴𝐵= 𝐶𝐷= 20 meter dan 𝐴𝐷= 𝐶𝐵= 12 meter. Karena \nsudut yang berseberangan berukuran sama besar, didapatkan ∠𝐷𝐴𝐵= ∠𝐵𝐶𝐷= 60∘. Suku sisi \nyang bersesuaian menjadikannya memenuhi syarat Sisi-Sudut-Sisi secara valid. Pernyataan ini \nbenar."},{"text":"Panjang tiang penyangga diagonal baja ringan 𝐵𝐷 pada bagian interior jembatan tersebut \nadalah tepat 24 meter.","answer":"Salah","explanation":"Menggunakan aturan kosinus pada segitiga 𝐴𝐵𝐷 dengan sudut 60∘: 𝐵𝐷2 = 𝐴𝐵2 + 𝐴𝐷2 −\n2 × 𝐴𝐵× 𝐴𝐷× 𝑐𝑜𝑠(60∘) = 202 + 122 −2 × 20 × 12 × 0.5 = 400 + 144 −240 = 304 ⟹ 𝐵𝐷=\n√304 = 4√19 meter. Maka nilai 24 meter salah. Pernyataan ini salah."},{"text":"Jika titik tengah persilangan kedua diagonal di sebut titik 𝑂, maka segitiga kecil 𝐴𝑂𝐵 terbukti \nkongruen dengan segitiga 𝐶𝑂𝐷 berdasarkan syarat Sudut-Sisi-Sudut (Su-Si-Su).","answer":"Benar","explanation":"Diagonal jajar genjang saling membagi sama panjang, sehingga 𝐴𝑂= 𝐶𝑂 dan 𝐵𝑂= 𝐷𝑂. Sudut \nbertolak belakang ∠𝐴𝑂𝐵= ∠𝐶𝑂𝐷 dan sudut dalam berseberangan ∠𝐵𝐴𝑂= ∠𝐷𝐶𝑂 serta ∠𝐴𝐵𝑂=\n∠𝐶𝐷𝑂. Ditambah dengan sisi 𝐴𝐵= 𝐶𝐷, ini memenuhi kriteria Sudut-Sisi-Sudut secara valid. \nPernyataan ini benar."},{"text":"Ketinggian maksimum rangka penopang tersebut bila dihitung tegak lurus dari sisi dasar \njembatan 𝐴𝐵 adalah sebesar 6√3 meter.","answer":"Benar","explanation":"Tinggi rangka (𝑡) dicari melalui perbandingan sinus pada sudut 60∘ dari segitiga sisi samping \nyang miring 12 meter. 𝑡= 𝐴𝐷× 𝑠𝑖𝑛(60∘) = 12 ×\n1\n2 √3 = 6√3 meter. Pernyataan ini benar."}]},{"number":36,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan dan menentukan syarat-syarat dua bangun saling \nkongruen, dan menerapkan kekongruenan dalam permasalahan \nyang terkait.","question":"Tukang marmer sedang menyortir kepingan segiempat porselen dekorasi kolam untuk \ndipasangkan bersama pada dasar tumpuan beton berelasi diagonal simetri. Model lempengan \nlantai dibentuk atas ketersambungan dua buah cetak pola berbentuk segitiga sama kaki \nbersisian, yakni segitiga pertama 𝐴𝐵𝐷 dan cetakan kedua 𝐶𝐵𝐷 dipertemukan berhadapan \ndengan sambungan potongan kawat miring sepanjang diagonal mendatar 𝐵𝐷= 16 cm. Dari hasil \nsurvei pengujian laboratorium marmer atas, tercatat sisi-sisi sayap terpanjangnya 𝐴𝐵= 𝐴𝐷= 17 \ncm. Di sela perakitan eksterior diletakkan kerangka lurus piringan perak kencang horizontal \nmelewati 𝐴 langsung tegak lurus dengan membelah as titik horizontal 𝐵𝐷 di pertengahan titik 𝑀 \nsepanjang total penyangga vertikal total 𝐴𝐶= 30 cm. Tentukan benar atau salah untuk setiap \npernyataan berikut!","statements":[{"text":"Berdasarkan asumsi awal perakit dekorasi, bentuk sisi sayap piring segitiga kedua terbawah \n(𝐶𝐵𝐷) tidak mungkin memproduksi tingkat kekongruenan dengan segitiga sayap bagian atas.","answer":"Salah","explanation":"Garis pembelah 𝐵𝐷 berpotongan tegak lurus dengan kawat vertikal 𝐴𝐶 di pertengahan, sehingga \npembagian as tengah horizontal menghasilkan jarak lurus sumbu datar 𝐵𝑀= 𝑀𝐷= 8 cm. \nMenggunakan Pythagoras pada sayap sisi atas: 𝐴𝑀= √𝐴𝐵2 −𝐵𝑀2 = √172 −82 = √289 −64 =\n15 cm. Total tinggi pengait diagonal 𝐴𝐶= 30 cm menghasilkan 𝑀𝐶= 𝐴𝐶−𝐴𝑀= 30 −15 = 15 \ncm. Sayap pinggir miring bawah terhitung dengan: 𝐵𝐶= 𝐶𝐷= √𝐵𝑀2 + 𝑀𝐶2 = √82 + 152 = 17 \ncm. Berkat ukuran sayap penahan bawah sama persis dengan yang atas, maka asumsi tidak \nkongruen tersebut adalah keliru. Pernyataan ini salah."},{"text":"Rentang lintasan bagian pipa interior tinggi sebelah bawah yang dilewati sepanjang tiang tegak \ndari as persimpangan 𝑀 menuju ujung sudut lantai 𝐶, terhitung memiliki rentang senilai 20 cm.","answer":"Salah","explanation":"Telah divalidasi bahwa ukuran as interior tinggi tegak tengah sayap segitiga bagian atas adalah \n𝐴𝑀= 15 cm. Dengan tinggi vertikal keping total baja hiasnya 𝐴𝐶= 30 cm, maka tinggi tiang di \ndalam sebelah bawah adalah tepat sebesar 𝑀𝐶= 30 −15 = 15 cm. Jawab tumpuan pipa 20 cm \ntersebut adalah kesalahan estimasi prosedural penaksiran panjang tumpuan lurus. Pernyataan ini \nsalah."},{"text":"Jika dianalisis nilai dari masing-masing diagonal sudut pelapis piringan samping terluar marmer \nbagian terbawah (𝐵𝐶), ia bernilai persis sebesar 17 cm sehingga memberikan keliling kelopak \nkeseluruhan sebesar 68 cm.","answer":"Benar","explanation":"Hasil penerapan rumus segitiga Phytagoras memetakan rentang lebar sayap miring samping \nbawah bernilai 𝐵𝐶= 𝐶𝐷= √152 + 82 = 17 cm. Sehingga mengitari pelapis tepi bentuk keramik \nsegiempat gabungan layang-layang 𝐴𝐵𝐶𝐷 diperoleh: Keliling total = 17 + 17 + 17 + 17 = 68 cm. \nPernyataan ini benar."},{"text":"Sepasang rancang desain lempeng hias kolam yakni △𝐴𝐵𝐷 dan △𝐶𝐵𝐷 dapat divalidasi \nkongruen mutlak lewat kriteria pendaratan tiga Sisi bersesuaian yang persis sama panjang (S-S-\nS).","answer":"Benar","explanation":"Pada kedua sayap bagian segiempat tersebut, kawat horizontal merupakan tumpuan \npersambungan bersekutu, yakni sisi 𝐵𝐷 sepanjang 16 cm yang dilewati bersama secara terikat, \nsisi pendek yang diletakkan berseberangan adalah 𝐴𝐵= 𝐶𝐵= 17 cm, serta penyangga bawah \nsamping berselang 𝐴𝐷= 𝐶𝐷= 17 cm. Dikarenakan bersandarkan dimensi tiga pasang parameter \nyang sangat persis sepadan nilainya, kekongruenan kriteria S-S-S valid terjadi. Pernyataan ini \nbenar."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
