<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Jaring-Jaring Bangun Ruang</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT JARING-JARING BANGUN RUANG</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>

 </div>
</div>

<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">

</div>

<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 1 \n \nPada jaring-jaring limas segi delapan, bentuk dari seluruh bidang sisi tegaknya adalah ....","options":[{"key":"A","text":"segitiga"},{"key":"B","text":"trapesium"},{"key":"C","text":"jajargenjang"},{"key":"D","text":"persegi panjang"}],"answer":"A","explanation":"Limas adalah bangun ruang yang semua sisi tegaknya bertemu di satu titik puncak. \nOleh karena itu, semua bidang sisi tegak pada jaring-jaring limas (termasuk limas segi delapan) \nselalu berbentuk segitiga. \nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 1 \n \nSebuah jaring-jaring bangun ruang terdiri atas satu persegi dan empat segitiga. Jika jaring-jaring \nini dirakit, bangun ruang yang terbentuk adalah ....","options":[{"key":"A","text":"limas segiempat"},{"key":"B","text":"limas segitiga"},{"key":"C","text":"prisma segiempat"},{"key":"D","text":"prisma segitiga"}],"answer":"A","explanation":"Jaring-jaring yang memiliki satu persegi (sebagai alas) dan empat segitiga (sebagai sisi tegak) \nakan membentuk sebuah limas dengan alas berbentuk segiempat. \nBangun ruang ini dinamakan limas segiempat. \nJawaban Benar: A"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 1 \n \nSebuah prisma tegak segitiga memiliki keliling alas 36 cm. Jika jaring-jaring prisma tersebut \ndibentangkan, maka jumlah lebar dari ketiga persegi panjang yang membentuk selimut prisma \nadalah ....","options":[{"key":"A","text":"9 cm"},{"key":"B","text":"12 cm"},{"key":"C","text":"18 cm"},{"key":"D","text":"36 cm"}],"answer":"D","explanation":"Selimut prisma tegak segitiga terdiri dari 3 buah persegi panjang yang jika digabungkan secara \nmendatar, total lebarnya sama dengan keliling alas prisma tersebut. \nKarena keliling alas prisma adalah 36 cm, maka jumlah lebar dari ketiga persegi panjang \npenyusun selimutnya adalah 36 cm. \nJawaban Benar: D"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 2 \n \nSebuah wadah cokelat berbentuk prisma tegak segitiga siku-siku memiliki panjang sisi siku-siku \nalas sebesar 6 cm dan 8 cm. Jika tinggi prisma tersebut adalah 12 cm, berapakah luas seluruh \npermukaan selimut (sisi tegak) prisma tersebut ketika jaring-jaringnya dibentangkan?","options":[{"key":"A","text":"288 cm 2"},{"key":"B","text":"240 cm 2"},{"key":"C","text":"168 cm 2"},{"key":"D","text":"120 cm 2"}],"answer":"A","explanation":"Langkah 1: Tentukan panjang sisi miring (hipotenusa) dari segitiga siku-siku alas menggunakan \nteorema Pythagoras: √62 + 82 = √36 + 64 = √100 = 10 cm. \nLangkah 2: Hitung keliling alas prisma: 6 + 8 + 10 = 24 cm. \nLangkah 3: Hitung luas selimut (sisi tegak) prisma dengan mengalikan keliling alas dengan tinggi \nprisma: 24 × 12 = 288 cm\n2. \nJawaban Benar: A"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 2 \n \nSebuah kotak pensil berbentuk prisma tegak segitiga dengan alas berbentuk segitiga siku-siku \nmemiliki panjang sisi siku-siku 5 cm dan 12 cm, serta tinggi prisma 20 cm. Kotak tersebut akan \ndibuka menjadi jaring-jaringnya yang terdiri dari dua buah segitiga siku-siku dan tiga buah persegi \npanjang sisi tegak. Luas dari persegi panjang sisi tegak yang paling besar pada jaring-jaring \ntersebut adalah ....","options":[{"key":"A","text":"260 cm²"},{"key":"B","text":"240 cm²"},{"key":"C","text":"100 cm²"},{"key":"D","text":"60 cm²"}],"answer":"A","explanation":"Langkah 1: Hitung sisi terpanjang (sisi miring) dari alas segitiga siku-siku menggunakan \nPythagoras: √52 + 122 = √25 + 144 = √169 = 13 cm. \nLangkah 2: Sisi tegak terbesar pada jaring-jaring terbentuk dari sisi miring alas dan tinggi prisma. \nHitung luasnya: 𝐿= 13 × 20 = 260 cm². \nJawaban Benar: A"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 2 \n \nSebuah papan nama meja berbentuk prisma tegak segitiga dengan alas berbentuk segitiga sama \nsisi yang memiliki panjang sisi 8 cm. Jika tinggi prisma tersebut adalah 15 cm, berapakah luas \ndari bagian jaring-jaring yang membentuk selimut prisma saja?","options":[{"key":"A","text":"120 cm 2"},{"key":"B","text":"240 cm 2"},{"key":"C","text":"360 cm 2"},{"key":"D","text":"480 cm 2"}],"answer":"C","explanation":"Langkah 1: Menghitung keliling alas segitiga sama sisi. Keliling alas = 3 × 8 = 24 cm. \nLangkah 2: Menghitung luas selimut prisma dengan mengalikan keliling alas dengan tinggi \nprisma. Luas selimut = 24 × 15 = 360 cm\n2. \nJawaban Benar: C"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 3 \n \nSeorang siswa membuat kotak penyimpanan berbentuk balok dengan panjang 20 cm, lebar 12 \ncm, dan tinggi 10 cm. Siswa tersebut memotong jaring-jaring balok dari selembar karton \nberbentuk persegi berukuran 50 cm × 50 cm. Setelah jaring-jaring dipotong secara tepat sesuai \nluas permukaannya, sisa karton yang tidak terpakai akan dibuang. Luas karton yang terbuang \ntersebut adalah ....","options":[{"key":"A","text":"880 cm²"},{"key":"B","text":"1.120 cm²"},{"key":"C","text":"1.380 cm²"},{"key":"D","text":"1.640 cm²"}],"answer":"C","explanation":"Langkah 1: Hitung luas lembaran karton persegi mula-mula: 𝐿𝑘𝑎𝑟𝑡𝑜𝑛= 50 × 50 = 2.500 cm². \nLangkah 2: Hitung luas permukaan jaring-jaring balok (luas total permukaan balok): 𝐿𝑗𝑎𝑟𝑖𝑛𝑔=\n2 × (𝑝⋅𝑙+ 𝑝⋅𝑡+ 𝑙⋅𝑡) = 2 × (20 × 12 + 20 × 10 + 12 × 10) cm². \nLangkah 3: Selesaikan perhitungan dalam kurung: 𝐿𝑗𝑎𝑟𝑖𝑛𝑔= 2 × (240 + 200 + 120) = 2 × 560 =\n1.120 cm². \nLangkah 4: Hitung luas karton sisa yang akan dibuang: 𝐿𝑡𝑒𝑟𝑏𝑢𝑎𝑛𝑔= 𝐿𝑘𝑎𝑟𝑡𝑜𝑛−𝐿𝑗𝑎𝑟𝑖𝑛𝑔= 2.500 −\n1.120 = 1.380 cm². \nJawaban Benar: C"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 3 \n \nSebuah kotak kado berbentuk balok memiliki ukuran panjang 12 cm, lebar 8 cm, dan tinggi 5 cm. \nJika jaring-jaring kotak kado tersebut digunting dari kertas karton berukuran 30 cm × 30 cm, \nberapakah luas karton sisa yang tidak terpakai? Asumsikan jaring-jaring balok dibuat dalam \nbentuk yang paling ringkas agar muat pada karton tersebut.","options":[{"key":"A","text":"304 cm 2"},{"key":"B","text":"392 cm 2"},{"key":"C","text":"408 cm 2"},{"key":"D","text":"508 cm 2"}],"answer":"D","explanation":"Langkah 1: Hitung luas permukaan balok (total luas jaring-jaring): 𝐿= 2 × (12 × 8 + 12 × 5 +\n8 × 5) = 2 × (96 + 60 + 40) = 2 × 196 = 392 cm\n2. \nLangkah 2: Analisis kesesuaian tata letak. Jika jaring-jaring diatur secara efisien, susunan jaring-\njaring memiliki dimensi luar sebesar 22 cm × 26 cm, yang berarti muat sempurna pada karton 30 \ncm × 30 cm. \nLangkah 3: Hitung luas karton sisa: Luas karton awal - Luas jaring-jaring = (30 × 30) −392 =\n900 −392 = 508 cm\n2. \nJawaban Benar: D"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Level 3 \n \nIbu Siti ingin membuat cetakan tumpeng berbentuk kerucut dari selembar aluminium di mana \njaring-jaring selimut kerucut tersebut berupa juring lingkaran. Jika cetakan tumpeng yang \ndiinginkan memiliki tinggi 8 cm dan jari-jari alas 6 cm, berapakah besar sudut pusat juring \nlingkaran pada jaring-jaring selimut kerucut tersebut?","options":[{"key":"A","text":"108∘"},{"key":"B","text":"216∘"},{"key":"C","text":"270∘"},{"key":"D","text":"288∘"}],"answer":"B","explanation":"Langkah 1: Hitung panjang garis pelukis (𝑠) kerucut menggunakan teorema Pythagoras dengan \ntinggi dan jari-jari alas. 𝑠= √62 + 82 = √36 + 64 = √100 = 10 cm. \nLangkah 2: Hubungkan keliling alas kerucut dengan panjang busur juring selimut. Keliling alas = \n2 × 𝜋× 𝑟= 12𝜋 cm. Panjang busur juring selimut juga harus sama dengan 12𝜋 cm. \nLangkah 3: Hitung besar sudut pusat (𝜃) juring lingkaran yang jari-jarinya adalah 𝑠= 10 cm. 𝜃=\n𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔 𝑎𝑙𝑎𝑠\n𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔 𝑙𝑖𝑛𝑔𝑘𝑎𝑟𝑎𝑛 𝑗𝑢𝑟𝑖𝑛𝑔× 360∘=\n2×𝜋×𝑟\n2×𝜋×𝑠× 360∘=\n𝑟\n𝑠× 360∘. \nLangkah 4: Substitusikan nilai 𝑟 dan 𝑠. 𝜃=\n6\n10 × 360∘= 216∘. \nJawaban Benar: B"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Sebuah wadah berbentuk tabung dibongkar oleh seorang guru di depan kelas sehingga diperoleh \nlembaran jaring-jaring penyusunnya untuk dianalisis bersama siswa. Tentukan benar atau salah \nuntuk setiap pernyataan mengenai jaring-jaring tabung berikut!","statements":[{"text":"Jaring-jaring tabung secara keseluruhan tersusun atas dua buah bidang berbentuk lingkaran \nyang identik serta sebuah persegi panjang.","answer":"Benar","explanation":"Sebuah tabung dibentuk dari alas dan tutup berbentuk lingkaran kongruen (identik) serta satu \npersegi panjang sebagai bidang selimut."},{"text":"Dua buah lingkaran penutup pada jaring-jaring tabung wajib memiliki keliling dan jari-jari yang \nberlainan satu sama lain.","answer":"Salah","explanation":"Kedua lingkaran penutup tabung bertindak sebagai alas dan tutup yang berhimpit secara simetris, \nsehingga harus kongruen dengan dimensi yang persis sama."},{"text":"Panjang dari bidang selimut persegi panjang pada jaring-jaring harus bernilai sama dengan \nkeliling lingkaran alas tabung tersebut.","answer":"Benar","explanation":"Saat jaring-jaring tabung dilipat, sisi panjang pada selimut tabung akan tepat mengitari seluruh \nsisi lengkung lingkaran alasnya."},{"text":"Ukuran lebar atau tinggi pada bidang selimut persegi panjang mewakili ukuran dari tinggi \nbangun ruang tabung tersebut.","answer":"Benar","explanation":"Dimensi tegak lurus (lebar/tinggi) dari selimut tabung merupakan jarak tegak lurus antara \nlingkaran alas dan lingkaran tutup, yang merupakan tinggi tabung."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Budi mengamati sebuah jaring-jaring limas segitiga yang dibentangkan datar di lantai kamarnya. \nBeri tanda centang (✓) pada setiap pernyataan yang benar tentang struktur geometri jaring-jaring \nlimas segitiga tersebut!","statements":[{"text":"Jaring-jaring limas segitiga terdiri dari satu buah persegi sebagai alas dan tiga buah segitiga.","answer":"Salah","explanation":"Model geometrik limas bersasaran segitiga ini mutlak mempuyai bagian tapak bermodel tiga \nsudut (segitiga), dan tidak diselingi oleh lempeng yang memiliki empat sisi sejajar ataupun \nbersiku lancip."},{"text":"Jumlah total daerah segitiga yang menyusun jaring-jaring limas segitiga adalah empat buah.","answer":"Benar","explanation":"Sifat fisis bangun limas segitiga didapat dari jumlahan kombinasi yang terdiri atas satu lempeng \ndasar berupa segitiga penumpu bagian alas dan tiga buah dinding kemiringan."},{"text":"Jaring-jaring limas segitiga terbentuk ketika bangun limas dipotong di sepanjang tiga rusuk \ntegak setinggi sisi tegaknya.","answer":"Benar","explanation":"Dengan membelah tiga batas siku sudut dinding kemiringannya, jaring-jaring tersebut bisa diurai \ndengan sebaran datar lurus sekeliling sisi miring penampang tegak limas segitiga itu."},{"text":"Setiap segitiga penyusun jaring-jaring limas segitiga harus memiliki sudut tepat siku-siku.","answer":"Salah","explanation":"Dalam bentuk-bentuk dasar yang fisis dan simetrik, kemiringan atap bisa memakai ragam model \ndari keping geometris baik tipe model sama-kaki lancip, lancip sembarang, ataupun sama-sisi."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Andi menggambar suatu pola sketsa geometri jaring-jaring kerucut utuh yang memiliki rincian \nukuran radius untuk lingkaran dasarnya sebesar 𝑟, dan nilai radius dari juring besar yang \nberfungsi sebagai selubung lingkarannya adalah 𝑠 (garis pelukis). Tentukan benar atau salah \nuntuk setiap pernyataan berikut sehubungan dengan kaitan matematika antara komponen jaring-\njaring kerucut tersebut!","statements":[{"text":"Besaran ukuran dari sudut bukaan juring selubung luar pada kerangka jaring-jaring tersebut \nselalu bernilai lebih kecil dari satu lingkaran penuh (360∘).","answer":"Benar","explanation":"Besar sudut pusat juring selimut dihitung lewat rasio: 𝜃= 360∘×\n𝑟\n𝑠. Karena dalam bangun dimensi \nkerucut nyata nilai garis pelukis (𝑠) pasti bernilai lebih panjang dibandingkan jari-jari alas (𝑟), \nrasionya bernilai < 1, sehingga sudut pusatnya pasti < 360∘."},{"text":"Luas sebaran wilayah datar dari selubung juring kerucut bernilai lebih kecil dibandingkan \nukuran luas permukaan dari satu piringan alas lingkarannya.","answer":"Salah","explanation":"Karena luas selimut adalah 𝜋𝑟𝑠 dan luas alasnya adalah 𝜋𝑟2 serta diketahui 𝑠> 𝑟, maka secara \nlogis nilai area luas juring selimut selalu bernilai lebih besar daripada luas alas lingkaran \ntabungannya."},{"text":"Ukuran radius luar yang diukur dari titik tumpu pusat lengkungan bidang juring di karton sama \ndengan dimensi garis pelukis kerucut tersebut yang ditulis sebagai 𝑠.","answer":"Benar","explanation":"Secara konstruksi geometris, keliling dari busur selimut dihasilkan dari piringan melingkar besar \nberjari-jari sepanjang garis miring kerucut, yaitu garis pelukis 𝑠."},{"text":"Panjang garis pelukis 𝑠 dalam struktur gambar kerucut tersebut ditentukan berdasarkan rumus \nkuadratik Pythagoras, yaitu 𝑠= √𝑟2 + 𝑡2.","answer":"Benar","explanation":"Segitiga yang terbentuk oleh jari-jari 𝑟, tinggi tegak kerucut 𝑡, dan garis miring luar 𝑠 adalah \nsegitiga siku-siku, dengan sisi terpanjang miring bernilai 𝑠 yang mengikuti teorema Pythagoras \n𝑠2 = 𝑟2 + 𝑡2."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Adi membuat sebuah prakarya berbentuk limas segi empat beraturan menggunakan lembaran \nkertas manila tebal. Bagian alas limas tersebut berupa persegi dengan panjang sisi 10 cm dan \nmemiliki tinggi segitiga selimut sebesar 12 cm. Sebelum merakit kertas manila tersebut menjadi \nlimas, ia menggambar dan mengevaluasi jaring-jaringnya yang dibentangkan. Tentukan benar \natau salah untuk setiap pernyataan berikut berdasarkan rancangan jaring-jaring limas milik Adi!","statements":[{"text":"Luas bagian alas persegi pada jaring-jaring limas tersebut adalah 40 cm².","answer":"Salah","explanation":"Siswa melakukan kesalahan prosedur dengan menghitung keliling persegi (4 × 10 = 40 cm) alih-\nalih luas persegi (10 × 10 = 100 cm²)."},{"text":"Luas sebuah sisi tegak berbentuk segitiga pada jaring-jaring tersebut adalah 60 cm².","answer":"Benar","explanation":"Luas segitiga tegak dicari dengan \n1\n2 × 𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖 𝑠𝑒𝑙𝑖𝑚𝑢𝑡=\n1\n2 × 10 × 12 = 60 cm²."},{"text":"Total luas kertas manila minimal yang digunakan oleh Adi untuk memotong satu jaring-jaring \nlimas utuh adalah 340 cm².","answer":"Benar","explanation":"Luas jaring-jaring utuh adalah jumlah dari luas alas (100 cm²) ditambah dengan luas total 4 buah \nsegitiga selimut (4 × 60 = 240 cm²), sehingga totalnya adalah 100 + 240 = 340 cm²."},{"text":"Total luas selimut limas pada jaring-jaring tersebut adalah 120 cm².","answer":"Salah","explanation":"Siswa melakukan penyelesaian parsial di mana ia lupa mengalikan luas satu buah segitiga tegak \n(60 cm²) dengan empat sisi tegak keseluruhan, melainkan hanya mengalikannya dengan dua."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Yusuf menggambar selembar jaring-jaring kertas karton guna membuat sebuah model prisma \ntegak segitiga sama kaki. Segitiga pada penampang alas memiliki panjang sisi sejajar sebagai \ndasar 16 𝑐𝑚, dengan sepasang kaki-kaki segitiga berukuran 10 𝑐𝑚. Rencana tinggi prisma \ntersebut ditetapkan sebesar 20 𝑐𝑚. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Tinggi dari bidang penampang alas segitiga sama kaki pada lembaran jaring-jaring tersebut \nberukuran 6 𝑐𝑚.","answer":"Benar","explanation":"Step 1: Belah sisi dasar alas menjadi dua bagian horizontal tepat berukuran 8 𝑐𝑚. Step 2: \nLakukan perbandingan siku Pythagoras memakai tinggi miring kaki segitiga 10 𝑐𝑚: 𝑡𝑠𝑒𝑔𝑖𝑡𝑖𝑔𝑎=\n√102 −82 = 6 𝑐𝑚."},{"text":"Jika sepasang segitiga pada bidang jaring-jaring dihitung luas daerahnya secara menyeluruh \ndidapatkan hasil tepat 96 𝑐𝑚2.","answer":"Benar","explanation":"Step 1: Cari luas penampang alas satu segitiga: 𝐿=\n1\n2 × 16 × 6 = 48 𝑐𝑚2. Step 2: Kalikan 2 \nkarena penampang ada alas dan penutup: 2 × 48 = 96 𝑐𝑚2."},{"text":"Luas jaring-jaring minimal penampang permukaan dari prisma segitiga secara lengkap adalah \n816 𝑐𝑚2.","answer":"Benar","explanation":"Step 1: Sisi persegi panjang samping adalah 16 × 20 = 320 𝑐𝑚2, dan kedua sisi kaki masing-\nmasing 10 × 20 = 200 𝑐𝑚2, total selimut = 720 𝑐𝑚2. Step 2: Gabungkan selimut 720 𝑐𝑚2 dan \nsepasang segitiga alas 96 𝑐𝑚2: 720 + 96 = 816 𝑐𝑚2."},{"text":"Seluruh bidang selubung persegi panjang dari jaring-jaring prisma segitiga ini memiliki ukuran \ndimensi yang identik satu sama lainnya.","answer":"Salah","explanation":"Step 1: Ukuran sisi prisma masing-masing bergantung pada rusuk keliling alas. Step 2: Prisma \nmempunyai rusuk alas berdimensi 16 𝑐𝑚, 10 𝑐𝑚, dan 10 𝑐𝑚 yang mana sisinya berdimensi lebar \nselimut berbeda: satu bidang 16 𝑐𝑚× 20 𝑐𝑚 dan dua bidang 10 𝑐𝑚× 20 𝑐𝑚."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Toko buah ingin memesan kemasan jaring kaleng logam untuk kaleng nanas bulat berbentuk \ntabung lengkap dengan penutupnya. Luas bahan pelat keseluruhan yang tercatat untuk sebuah \njaring-jaring wadah lengkap ini berukuran 572 𝑐𝑚2. Jika lingkaran tutup memiliki ukuran diameter \nsepanjang 14 𝑐𝑚. Asumsikan konstanta perhitungan nilai 𝜋=\n22\n7 . Beri tanda centang (✓) pada \nsetiap pernyataan yang benar!","statements":[{"text":"Ukuran sisi lebar jaring-jaring persegi panjang yang merepresentasikan tinggi silinder kaleng \nadalah 6 𝑐𝑚.","answer":"Benar","explanation":"Step 1: Hitung jari-jari 𝑟= 7 𝑐𝑚, maka total luas sepasang tutup = 2 × 𝜋𝑟2 = 2 ×\n22\n7 × 49 =\n308 𝑐𝑚2. Sisa selimut = 572 −308 = 264 𝑐𝑚2. Step 2: Ukuran panjang selimut keliling =\n2 ×\n22\n7 × 7 = 44 𝑐𝑚. Sehingga tingginya (lebar persegi panjang) = 264 ÷ 44 = 6 𝑐𝑚."},{"text":"Panjang keliling lingkaran pada tutup atas dan bawah kaleng penampang jaring-jaring tersebut \nadalah 154 𝑐𝑚.","answer":"Salah","explanation":"Step 1: Gunakan formula keliling 𝐾= 𝜋𝑑 dengan diameter 14 𝑐𝑚. Step 2: Lakukan operasi \nperkalian: 𝑑= 14 ×\n22\n7 = 44 𝑐𝑚."},{"text":"Panjang bentangan penampang persegi panjang pada lembar jaring-jaring kemasan kaleng \nnanas ini adalah 44 𝑐𝑚.","answer":"Benar","explanation":"Step 1: Perhatikan panjang selimut silinder yang sama dengan nilai keliling dari lingkarannya. \nStep 2: Menghitung keliling dari lingkarannya: 2 ×\n22\n7 × 7 = 44 𝑐𝑚."},{"text":"Jika tinggi kaleng yang diinginkan diubah menjadi dua kali lipat, luas selimut persegi panjang \npada jaring-jaring baru adalah 1.056 𝑐𝑚2.","answer":"Salah","explanation":"Step 1: Luas mula-mula selimut persegi panjang adalah 264 𝑐𝑚2. Step 2: Karena tinggi \ndilipatgandakan menjadi 12 𝑐𝑚, luas selimut baru 44 × 12 = 528 𝑐𝑚2, bukan 1.056 𝑐𝑚2."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Budi ingin membuat 3 buah celengan berbentuk tabung tanpa tutup yang masing-masing memiliki \njari-jari alas 7 cm dan tinggi 15 cm menggunakan lembaran seng miliknya dengan memakai \nkonstanta 𝜋=\n22\n7 . Sebelum mulai memotong seng tersebut, Budi menggambar dan menghitung \nkebutuhan dimensi dari bagian jaring-jaringnya yang terdiri dari satu lingkaran sebagai alas dan \nsebuah persegi panjang sebagai selimut. Beri tanda centang (✓) pada setiap pernyataan yang \nbenar mengenai rancangan dimensi potongan jaring-jaring Budi!","statements":[{"text":"Satu buah celengan membutuhkan jaring-jaring kertas/seng dengan luas keseluruhan minimal \nsebesar 814 cm\n2.","answer":"Benar","explanation":"Luas alas = 𝜋× 𝑟2 =\n22\n7 × 49 = 154 cm\n2. Luas selimut = 2 × 𝜋× 𝑟× 𝑡= 2 ×\n22\n7 × 7 × 15 = 660 \ncm\n2. Total luas per jaring-jaring adalah 154 + 660 = 814 cm\n2."},{"text":"Lebar potongan seng persegi panjang untuk dijadikan satu buah selimut celengan adalah 50 \ncm.","answer":"Salah","explanation":"Panjang bentangan selimut sama dengan keliling lingkaran alas yaitu 2 × 𝜋× 𝑟= 44 cm, \nsedangkan tingginya adalah 15 cm. Tidak ada komponen dimensi yang membutuhkan seng \nselebar 50 cm."},{"text":"Jika Budi memiliki seng sisa seluas 1000 cm\n2, maka sisa seng yang terbuang setelah satu \njaring-jaring utuh celengan digunting secara ideal tanpa serpihan geometris adalah 186 cm\n2.","answer":"Benar","explanation":"Sisa bahan ideal adalah total luas bahan dikurangi luas jaring-jaring tabung tanpa tutup: 1000 −\n814 = 186 cm\n2."},{"text":"Jika Budi ingin membuat tiga celengan utuh tersebut sekaligus, luas total murni material seng \nminimal yang habis dipotong dalam konfigurasi geometris sempurna adalah 3000 cm\n2.","answer":"Salah","explanation":"Kebutuhan bahan untuk 3 buah celengan tanpa tutup adalah 3 × 814 = 2442 cm\n2, bukan 3000 \ncm\n2."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Rian mendesain jaring-jaring terurai dari prisma segienam beraturan di lembaran karton sisa milik \nsaudaranya. Bentuk alasnya adalah segi enam beraturan dengan masing-masing panjang sisi \nluarnya yaitu 8 cm, sedangkan jarak pemisahan (tinggi tegak penutup prisma segienam) diukur \nsepanjang 15 cm. Setiap penutup alas didekati melalui penyatuan enam bagian segitiga sama \nsisi yang konstan berukuran sisi 8 cm. Tentukan benar atau salah setiap nilai parameter luas dan \nbagian pola jaring-jaring berikut!","statements":[{"text":"Luas penutup dua bagian bidang dasar atas-bawah segi-enam pada skema pembungkus \njaring-jaring tersebut adalah sebesar 192√3 cm\n2.","answer":"Benar","explanation":"Langkah 1: Hitung tinggi segitiga kecil penyusun segienam: 𝑡= √82 −42 = √48 = 4√3 cm. \nLangkah 2: Luas alas tunggal (enam segitiga) = 6 × (\n1\n2 × 8 × 4√3) = 96√3 cm\n2. Langkah 3: \nLuas gabungan alas dan penutup tutup atas = 2 × 96√3 = 192√3 cm\n2. Maka pernyataan \nbernilai Benar."},{"text":"Jaring-jaring selimut prisma jika dilepaskan ikatannya lalu dihamparkan lurus menyatu \nberbentuk selembar persegi panjang luas dengan dimensi kertas 40 cm x 30 cm.","answer":"Salah","explanation":"Langkah 1: Hitung keliling sisi sekeliling dari daerah alas = 6 × 8 = 48 cm. Langkah 2: Jaring-\njaring bagian selimut didirikan oleh deret persegi panjang tegak bersambung, total lebar \nbentangannya = 48 cm. Langkah 3: Tinggi rentangan prisma adalah 15 cm, sehingga ukuran \nyang tepat adalah 48 cm x 15 cm, bukan 40 cm x 30 cm. Maka pernyataan bernilai Salah."},{"text":"Jumlah keseluruhan permukaan teoretis murni luar-dalam dari prisma segienam utuh bentukan \njaring-jaring tersebut adalah sebesar 192√3 + 720 cm\n2.","answer":"Benar","explanation":"Langkah 1: Mengetahui formula total luar murni yaitu Luas Selimut prisma ditambah Luas Dua \nBidang Alasnya. Langkah 2: Substitusi Luas alas = 192√3 cm\n2 (berdasarkan poin kesatu). \nLuas area selubung tegak samping = 𝐾𝑎𝑙𝑎𝑠× 𝑡= 48 × 15 = 720 cm\n2. Langkah 3: Diperoleh \nakumulasi sebesar 192√3 + 720 cm\n2. Maka pernyataan bernilai Benar."},{"text":"Kandungan nilai kubikasi kapasitas yang diperoleh setelah penutupan perakitan lipatan-lipatan \nlembaran segienam tersebut adalah 2880√3 cm\n3.","answer":"Salah","explanation":"Langkah 1: Rumus dasar mencari volume prisma = 𝐿𝑢𝑎𝑠𝐴𝑙𝑎𝑠× 𝑡𝑝𝑟𝑖𝑠𝑚𝑎. Langkah 2: Substitusikan \nkomponennya, yaitu 96√3 𝑐𝑚2 untuk area penampang dikalikan tinggi tegak 15 cm. Langkah 3: \n𝑉= 96√3 × 15 = 1440√3 cm\n3. Data 2880√3 salah karena tidak melakukan komparasi tinggi \nyang presisi. Maka pernyataan bernilai Salah."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Membuat dan menentukan jaring-jaring dengan bangun ruang \n(prisma, tabung, limas dan kerucut) dan membuat bangun ruang \ntersebut dari jaring-jaringnya.","question":"Fadhil merumuskan perencanaan perbandingan konstruksi antar pola jaring-jaring silinder dua \ntabung berrasio tersendiri. Bangun Tabung Pertama direncanakan mengusung garis diameter \ntengah tutup bawah seluas 14 cm digandeng lembaran luas bentang tinggi selubungnya 10 cm. \nAdapun Tabung Kedua mempunyai penyesuaian khusus dengan mengurangi ketebalan sisi \nselubung penutup dinding vertikal sedalam 20% namun meningkatkan porsi setengah ukuran \npanjang diameter tatakan sebesar 50% diukur relatif terhadap tabung awal dengan pi pembagi \nbernilai tetap yaitu 22/7. Bubuhkan centang (✓) pada semua penaksiran benar berdasarkan porsi \nrevisi bentuk silinder fadhil!","statements":[{"text":"Panjang horizontal penutup yang diatur pada bagian tepi kawat jaring tabung revisi versi kedua \ndiukur setara keliling senilai 88 cm.","answer":"Salah","explanation":"Untuk tabung kedua, radius barunya 𝑟= 7 × (1 + 0,5) = 10,5 cm. Maka lebar melingkar =\n2 ×\n22\n7 × 10,5 = 66 cm, sehingga klaim ukuran 88 cm bernilai tidak tepat."},{"text":"Bagian luasan bawah dari seluruh sepasang lingkaran dasar atas tutup di jaring tabung variasi \nmodifikasi kedua adalah bersih senilai 616 cm\n2.","answer":"Salah","explanation":"Luas gabungan dari kedua lempeng tatakan melingkar alas atas bawah = 2 ×\n22\n7 × 10, 52 = 693 \ncm\n2. Ukuran bernilai 616 cm\n2 merupakan data keliru dari diameter 14 biasa yang dikira \nradius."},{"text":"Perhitungan perbedaan tingkat murni untuk segmen bentangan luar persegi bidang lurus \npenyusun kedua selimut jaring tabung tercatat setara selisih bersih sebesar 88 cm\n2.","answer":"Benar","explanation":"Selimut 1 = (2 ×\n22\n7 × 7) × 10 = 440 cm\n2. Tinggi 2 = 10 × (1 −0,2) = 8 cm. Selimut 2 =\n66 × 8 = 528 cm\n2. Jeda = 528 −440 = 88 cm\n2. Luas berbeda sebesar 88 cm\n2 ini \nmerupakan data valid."},{"text":"Estimasi jumlah nominal menyeluruh pelapis permukaan luar total jaring-jaring pada silinder \ntabung faksi dua diukur tepat pada kisaran nilai bersih sebesar 1.221 cm\n2.","answer":"Benar","explanation":"Penghitungan murni Tabung kedua: Sisi selimut = 528 cm\n2, ditambahkan kedua segmen \nbunderan = 693 cm\n2. Jumlah utuh = 528 + 693 = 1221 cm\n2, hal ini akurat."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
