<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Relasi dan Fungsi</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT RELASI DAN FUNGSI</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 18</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 18</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Suatu fungsi 𝑓: 𝑥→3𝑥−1 memiliki domain 𝐷𝑓= {−1,0,1,2}. Anggota dari range fungsi tersebut \nadalah ....","options":[{"key":"A","text":"{−4, −1,2,5}"},{"key":"B","text":"{−4, −1,2,6}"},{"key":"C","text":"{−3,0,3,6}"},{"key":"D","text":"{−2, −1,0,1}"}],"answer":"A","explanation":"Untuk menentukan range, substitusikan setiap nilai 𝑥 dari domain ke rumus fungsi 𝑓(𝑥) = 3𝑥−1. \nUntuk 𝑥= −1 ⟹ 𝑓(−1) = 3(−1) −1 = −4. \nUntuk 𝑥= 0 ⟹ 𝑓(0) = 3(0) −1 = −1. \nUntuk 𝑥= 1 ⟹ 𝑓(1) = 3(1) −1 = 2. \nUntuk 𝑥= 2 ⟹ 𝑓(2) = 3(2) −1 = 5. \nMaka, range fungsi tersebut adalah {−4, −1,2,5}. \nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Apakah aturan relasi yang tepat dari himpunan 𝐴 ke himpunan 𝐵?","options":[{"key":"A","text":"Dua kali dari."},{"key":"B","text":"Kuadrat dari."},{"key":"C","text":"Kurang dari."},{"key":"D","text":"Setengah dari."}],"answer":"A","explanation":"Hubungan dari setiap elemen himpunan 𝐴 ke 𝐵 pada pasangan berurutan \n{(2,1), (4,2), (6,3), (8,4)} dianalisis secara logis. \n2 adalah dua kali dari 1, 4 adalah dua kali dari 2, 6 adalah dua kali dari 3, dan 8 adalah dua kali \ndari 4. \nSehingga aturan relasi yang paling tepat dari 𝐴 ke 𝐵 adalah \"dua kali dari\". \nJawaban Benar: A"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Dalam suatu kelompok siswa, dibuat relasi yang menghubungkan setiap siswa dengan tinggi \nbadannya masing-masing dalam satuan sentimeter. Karena setiap siswa pasti memiliki tepat satu \ntinggi badan, maka relasi ini merupakan sebuah ....","options":[{"key":"A","text":"bukan fungsi"},{"key":"B","text":"fungsi (pemetaan)"},{"key":"C","text":"himpunan kosong"},{"key":"D","text":"relasi kuadrat"}],"answer":"B","explanation":"Definisi dari fungsi (pemetaan) adalah relasi khusus yang memasangkan setiap anggota \nhimpunan domain (siswa) tepat satu dengan anggota himpunan kodomain (tinggi badan). \nKarena setiap siswa hanya memiliki tepat satu tinggi badan, maka relasi ini memenuhi kriteria \nsebagai sebuah fungsi. \nJawaban Benar: B"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah fungsi kuadrat sederhana 𝑓(𝑥) = 𝑥2 −2𝑥 didefinisikan pada himpunan domain 𝐷=\n{−1,0,1,2,3}. Tentukan himpunan range (daerah hasil) dari fungsi tersebut berdasarkan domain \nyang diberikan.","options":[{"key":"A","text":"{−1,0,1}"},{"key":"B","text":"{−1,0,3}"},{"key":"C","text":"{0,1,3}"},{"key":"D","text":"{1,2,3}"}],"answer":"B","explanation":"Langkah 1: Menghitung nilai fungsi 𝑓(𝑥) = 𝑥2 −2𝑥 untuk setiap anggota domain 𝐷= {−1,0,1,2,3}. \nDiperoleh: 𝑓(−1) = 3, 𝑓(0) = 0, 𝑓(1) = −1, 𝑓(2) = 0, dan 𝑓(3) = 3. \nLangkah 2: Mengumpulkan semua nilai unik hasil pemetaan tersebut untuk membentuk \nhimpunan range: {−1,0,3}. \nJawaban Benar: B"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Seseorang menabung uang di celengan dengan total tabungan pada minggu ke-𝑛 memenuhi \nfungsi linear 𝑆(𝑛) = 𝑎𝑛+ 𝑏 rupiah. Jika total tabungan pada minggu ke-2 adalah Rp35.000,00 \ndan pada minggu ke-5 adalah Rp65.000,00, berapakah total uang yang dimiliki pada minggu \npertama (𝑆(1))?","options":[{"key":"A","text":"Rp20.000,00."},{"key":"B","text":"Rp25.000,00."},{"key":"C","text":"Rp30.000,00."},{"key":"D","text":"Rp35.000,00."}],"answer":"B","explanation":"Langkah 1: Menentukan nilai 𝑎 dan 𝑏 dari fungsi tabungan 𝑆(𝑛) = 𝑎𝑛+ 𝑏. Dari informasi soal: \n2𝑎+ 𝑏= 35.000 dan 5𝑎+ 𝑏= 65.000, kurangkan kedua persamaan untuk mendapatkan 3𝑎=\n30.000 ⟹ 𝑎= 10.000. Substitusi nilai 𝑎 ke persamaan pertama: 2(10.000) + 𝑏= 35.000 ⟹\n 20.000 + 𝑏= 35.000 ⟹ 𝑏= 15.000. \nLangkah 2: Menghitung total tabungan pada minggu pertama (𝑆(1)). Nilai 𝑆(1) = 1(10.000) +\n15.000 = 𝑅𝑝25.000,00. \nJawaban Benar: B"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah kelompok belajar mendata makanan tradisional favorit mereka dalam bentuk himpunan \npasangan berurutan yaitu 𝑅= {(𝐴𝑛𝑑𝑖, 𝑅𝑒𝑛𝑑𝑎𝑛𝑔), (𝐵𝑢𝑑𝑖, 𝑆𝑎𝑡𝑒), (𝐶𝑖𝑐𝑖, 𝑅𝑒𝑛𝑑𝑎𝑛𝑔), (𝐷𝑒𝑑𝑖, 𝐵𝑎𝑘𝑠𝑜)}. \nJika himpunan 𝐴 adalah nama siswa dan himpunan 𝐵 adalah jenis makanan tradisional, maka \nhubungan relasi yang paling tepat dari himpunan 𝐴 ke himpunan 𝐵 adalah ....","options":[{"key":"A","text":"makanan kesukaan"},{"key":"B","text":"penjual makanan"},{"key":"C","text":"cara memasak"},{"key":"D","text":"asal daerah"}],"answer":"A","explanation":"Langkah 1: Mengamati anggota himpunan pertama (domain) yaitu nama siswa \n{𝐴𝑛𝑑𝑖, 𝐵𝑢𝑑𝑖, 𝐶𝑖𝑐𝑖, 𝐷𝑒𝑑𝑖}. \nLangkah 2: Mengamati anggota himpunan kedua (kodomain) yaitu jenis makanan tradisional \n{𝑅𝑒𝑛𝑑𝑎𝑛𝑔, 𝑆𝑎𝑡𝑒, 𝐵𝑎𝑘𝑠𝑜}. \nLangkah 3: Menganalisis hubungan antara nama siswa dan jenis makanan tersebut, yang \nmenunjukkan makanan kesukaan masing-masing siswa. \nJawaban Benar: A"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Suatu fungsi linear didefinisikan dengan rumus 𝑓(𝑥) = 𝑝𝑥+ 𝑞. Jika diketahui nilai dari 𝑓(2) = 1 \ndan 𝑓(𝑓(2)) = −3, berapakah nilai dari 𝑓(−3)?","options":[{"key":"A","text":"-23"},{"key":"B","text":"-19"},{"key":"C","text":"-15"},{"key":"D","text":"-11"}],"answer":"B","explanation":"Menggunakan informasi 𝑓(2) = 1 ⟹ 2𝑝+ 𝑞= 1. \nMenghubungkan dengan informasi kedua: 𝑓(𝑓(2)) = −3 ⟹ 𝑓(1) = −3 ⟹ 𝑝+ 𝑞= −3. \nMenyelesaikan sistem persamaan linear: (2𝑝+ 𝑞) −(𝑝+ 𝑞) = 1 −(−3) ⟹ 𝑝= 4. \nMencari nilai 𝑞: 4 + 𝑞= −3 ⟹ 𝑞= −7. Rumus fungsi adalah 𝑓(𝑥) = 4𝑥−7. \nMenghitung nilai 𝑓(−3) = 4(−3) −7 = −12 −7 = −19. \nJawaban Benar: B"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Suatu fungsi linear dirumuskan dengan 𝑓(𝑥) = 𝑎𝑥+ 𝑏. Jika diketahui bahwa nilai dari 𝑓(3) +\n𝑓(5) = 32 dan 𝑓(7) −𝑓(2) = 15, berapakah nilai dari 𝑓(10)?","options":[{"key":"A","text":"26"},{"key":"B","text":"30"},{"key":"C","text":"34"},{"key":"D","text":"38"}],"answer":"C","explanation":"Menjabarkan persamaan yang diketahui: 𝑓(3) + 𝑓(5) = (3𝑎+ 𝑏) + (5𝑎+ 𝑏) = 8𝑎+ 2𝑏= 32 ⟹\n 4𝑎+ 𝑏= 16. \nMenjabarkan persamaan kedua: 𝑓(7) −𝑓(2) = (7𝑎+ 𝑏) −(2𝑎+ 𝑏) = 5𝑎= 15 ⟹ 𝑎= 3. \nSubstitusikan 𝑎= 3 ke persamaan 4𝑎+ 𝑏= 16 untuk mendapatkan 𝑏: 4(3) + 𝑏= 16 ⟹ 12 +\n𝑏= 16 ⟹ 𝑏= 4. Rumus fungsi adalah 𝑓(𝑥) = 3𝑥+ 4. \nMenghitung nilai 𝑓(10) = 3(10) + 4 = 34. \nJawaban Benar: C"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah fungsi linear didefinisikan dengan rumus 𝑓(𝑥) = 𝑝𝑥+ 𝑞. Informasi fungsi tersebut \ndisajikan dalam diagram panah yang memetakan −2 ke −11, 1 ke −2, dan 𝑟 ke 7. Nilai dari \nbentuk aljabar 𝑝2 −𝑞2 + 𝑟 adalah ....","options":[{"key":"A","text":"-12"},{"key":"B","text":"-20"},{"key":"C","text":"16"},{"key":"D","text":"38"}],"answer":"A","explanation":"Langkah 1: Menyusun persamaan berdasarkan nilai fungsi yang diketahui dari diagram panah. \n𝑓(−2) = −11 ⟹ −2𝑝+ 𝑞= −11 (Persamaan 1). \n𝑓(1) = −2 ⟹ 𝑝+ 𝑞= −2 (Persamaan 2). \nLangkah 2: Mengurangkan Persamaan 2 dengan Persamaan 1 untuk mengeliminasi 𝑞. (𝑝+ 𝑞) −\n(−2𝑝+ 𝑞) = −2 −(−11) ⟹ 3𝑝= 9 ⟹ 𝑝= 3. \nLangkah 3: Mensubstitusikan nilai 𝑝= 3 ke Persamaan 2 untuk mendapatkan 𝑞. 3 + 𝑞= −2 ⟹\n 𝑞= −5. Sehingga rumus fungsinya adalah 𝑓(𝑥) = 3𝑥−5. \nLangkah 4: Menentukan nilai 𝑟 dari peta 𝑓(𝑟) = 7. 3𝑟−5 = 7 ⟹ 3𝑟= 12 ⟹ 𝑟= 4. \nLangkah 5: Menghitung nilai dari 𝑝2 −𝑞2 + 𝑟. Hasil = 32 −(−5)2 + 4 = 9 −25 + 4 = −12. \nJawaban Benar: A"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Diberikan rumus fungsi linear sederhana yaitu ℎ(𝑥) = 4 −3𝑥. Beri tanda centang (✓) pada setiap \npernyataan yang benar!","statements":[{"text":"Nilai dari ℎ(1) adalah 1.","answer":"Benar","explanation":"Substitusi 𝑥= 1 menghasilkan ℎ(1) = 4 −3(1) = 1."},{"text":"Nilai dari ℎ(2) adalah 2.","answer":"Salah","explanation":"Substitusi 𝑥= 2 menghasilkan ℎ(2) = 4 −3(2) = 4 −6 = −2, bukan 2."},{"text":"Nilai dari ℎ(−1) adalah 1.","answer":"Salah","explanation":"Substitusi 𝑥= −1 menghasilkan ℎ(−1) = 4 −3(−1) = 4 + 3 = 7, bukan 1."},{"text":"Nilai dari ℎ(0) adalah 4.","answer":"Benar","explanation":"Substitusi 𝑥= 0 menghasilkan ℎ(0) = 4 −3(0) = 4."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Misalkan terdapat dua buah himpunan yaitu 𝐴= {1,3,5} dan 𝐵= {2,4}. Tentukan benar atau salah \nuntuk setiap pernyataan berikut!","statements":[{"text":"Banyaknya semua pemetaan yang mungkin dari 𝐴 ke 𝐵 adalah 9.","answer":"Salah","explanation":"Banyaknya pemetaan dari 𝐴 ke 𝐵 dihitung menggunakan rumus 𝑛(𝐵)𝑛(𝐴) = 23 = 8."},{"text":"Banyaknya semua pemetaan yang mungkin dari 𝐵 ke 𝐴 adalah 9.","answer":"Benar","explanation":"Banyaknya pemetaan dari 𝐵 ke 𝐴 dihitung menggunakan rumus 𝑛(𝐴)𝑛(𝐵) = 32 = 9."},{"text":"Himpunan pasangan berurutan 𝑅= {(1,2), (3,4), (5,2)} merupakan fungsi dari 𝐴 ke 𝐵.","answer":"Benar","explanation":"Relasi tersebut adalah pemetaan/fungsi karena setiap anggota 𝐴 dipasangkan tepat satu kali \ndengan anggota 𝐵."},{"text":"Himpunan pasangan berurutan 𝑃= {(1,2), (3,4)} merupakan pemetaan dari 𝐴 ke 𝐵.","answer":"Salah","explanation":"Bukan merupakan pemetaan karena elemen 5 di domain 𝐴 tidak mendapatkan pasangan."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Diberikan beberapa himpunan pasangan berurutan yang memetakan anggota himpunan angka. \nTentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Himpunan 𝑃= {(1, 𝑎), (2, 𝑏), (3, 𝑐)} menyatakan bentuk fungsi.","answer":"Benar","explanation":"Himpunan P adalah fungsi karena seluruh domainnya {1,2,3} muncul tepat satu kali dan memiliki \nsatu pasangan unik."},{"text":"Himpunan 𝑄= {(1, 𝑎), (1, 𝑏), (2, 𝑐)} bukan merupakan bentuk fungsi.","answer":"Benar","explanation":"Himpunan Q bukan fungsi karena angka 1 dipetakan ke lebih dari satu nilai, yaitu 𝑎 dan 𝑏."},{"text":"Himpunan 𝑅= {(2, 𝑎), (3, 𝑎), (4, 𝑎)} bukan merupakan fungsi karena seluruh daerah asal \nterhubung ke elemen 𝑎 yang sama.","answer":"Salah","explanation":"Himpunan R adalah fungsi konstan karena setiap domain berbeda {2,3,4} memiliki tepat satu \npasang, yaitu 𝑎."},{"text":"Himpunan 𝑆= {(1, 𝑏), (2, 𝑏), (3, 𝑐)} bukan merupakan bentuk fungsi karena beberapa nilai \ndaerah hasil sama.","answer":"Salah","explanation":"Himpunan S adalah fungsi karena syarat fungsi adalah keunikan pasangan pada domain asal, \nbukan keunikan di range hasil."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah pengamatan matematika dianalisis atas representasi pemetaan rumus persamaan linier \ndengan bentuk 𝑓(𝑥) = 𝑝𝑥+ 𝑞. Informasi awal teoretis dari hasil output sistem melansir laporan \nkonkrit yaitu angka f(1) = 4 dan angka f(3) = 10. Beri tanda centang (✓) pada setiap pernyataan \nyang benar mengenai spesifikasi fungsional persamaan tersebut!","statements":[{"text":"Kenaikan grafik perolehan nilai atau nilai kemiringan (gradient koefisien 𝑝) dari pola rumus \nfungsional ini memiliki nilai mutlak bernilai 3.","answer":"Benar","explanation":"Mengoperasikan perolehan data eliminasi persamaan 𝑝+ 𝑞= 4 dengan 3𝑝+ 𝑞= 10. Selisihnya \nmenghasilkan 2𝑝= 6 sehingga gradien 𝑝= 3 adalah benar."},{"text":"Posisi tinggi koordinat garis vertikal penggeser mula (intersep nilai konstan 𝑞) dari pemodelan \nfungsinya bernilai tepat di posisi angka 1.","answer":"Benar","explanation":"Menghubungkan balik penemuan variabel 𝑝= 3 ke perbandingan persamaan awal: (3 × 1) + 𝑞=\n4 maka diperoleh nilai intercept 𝑞= 1."},{"text":"Model representasi fungsional dari relasi persamaan linear penuh pemetaan di atas adalah \n𝑓(𝑥) = 3𝑥+ 1.","answer":"Benar","explanation":"Substitusi utuh dua elemen rumus fungsi koefisien 𝑝 dan 𝑞 menghasilkan integrasi total bernilai \nfungsi 𝑓(𝑥) = 3𝑥+ 1."},{"text":"Besaran angka target yang terlapor keluar bila nilai input variabel asalnya berkedudukan di \nposisi 𝑥= −2 bernilai negatif 4.","answer":"Salah","explanation":"Dengan memasukkan nilai ke rumus 𝑓(−2) = 3(−2) + 1 = −6 + 1 = −5. Nilai hasilnya haruslah -\n5, bukan negatif 4."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Dalam kawasan perhelatan ekshibisi budaya, dua wirausaha kedai minuman kecil terdata \nmerental kedai. Stan milik Penjual A ditarif beban bulanan tetap senilai Rp150.000,00 dan \nditambah tambahan biaya produksi senilai Rp2.000,00 untuk setiap unit cup wadah cangkir \nminuman terjual. Sedangkan Stan Penjual B dipersyaratkan nominal pembayaran administrasi \nberkisar Rp50.000,00 bertambah tuntutan operasional sebesar Rp3.000,00 untuk tiap-tiap satu \ncup wadah tersalurkan ke pelanggan. Untuk parameter volume kopi laku sebesar 𝑥 porsi gelas \nminuman sebulan, total anggaran penyusunan pembebanan dirangkum formula biaya \nbersesuaian 𝐶𝐴(𝑥) = 2.000𝑥+ 150.000 rupiah serta asuransi tarif biaya 𝐶𝐵(𝑥) = 3.000𝑥+ 50.000 \nrupiah. Pilih semua pernyataan bernilai benar berdasarkan properti sistem persewaan tersebut!","statements":[{"text":"Biaya pengeluaran sewa bulanan katering untuk Stan A serta Kedai B diprediksi bernilai \nberimbang murni atau setara ketika mereka membukukan pemasaran sebanyak 100 porsi.","answer":"Benar","explanation":"Kondisi seimbang dicapai dengan cara mencari akar penyamaan linier dari persamaan \nfungsional: 2.000𝑥+ 150.000 = 3.000𝑥+ 50.000 ⟹ 1.000𝑥= 100.000 ⟹ 𝑥= 100 unit porsi \ncangkir sajian."},{"text":"Pada kejadian ketika target kapasitas penjualan minuman hanya laku seadanya di bawah limit \ntaksiran 100 cup wadah sebulan, skema Penjual A lebih hemat uang.","answer":"Salah","explanation":"Menilik visual fisis grafik sebelum perpotongan titik seimbang: misal dicoba tingkat sales 𝑥= 50, \ndidapat tagihan sewa 𝐶𝐴(50) = 𝑅𝑝250.000,00 sementara 𝐶𝐵(50) = 𝑅𝑝200.000,00. Sehingga kedai \nB bernilai jauh lebih terjangkau harganya."},{"text":"Ukuran celah selisih dari pembebanan anggaran di antara sewa Stan A berbanding stan \npenikmat B saat lapak mencatat keberhasilan melempar 150 gelas adalah Rp50.000,00.","answer":"Benar","explanation":"Evaluasi dua tingkat luaran model katering: 𝐶𝐴(150) = 2.000(150) + 150.000 = 450.000 dan \n𝐶𝐵(150) = 3.000(150) + 50.000 = 500.000. Selisih biaya adalah 500.000 −450.000 = 50.000 \nrupiah."},{"text":"Jaminan dari sewa dasar awal minimum yang ditanggung Penjual B bilamana usaha terpaksa \nbelum dibuka penuh karena hiasan terkendala atau libur (kapasitas 0 cup) sebesar Rp50.000,00.","answer":"Benar","explanation":"Kondisi ketiadaan pemasaran dicari melalui evaluasi masukan 𝑥= 0. Menggunakan rumus \npenjelas biaya milik b diperoleh 𝐶𝐵(0) = 𝑅𝑝50.000,00 yang bertindak selaku biaya administrasi \nawal sewaan."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Himpunan 𝐴= {𝑥∣1 < 𝑥≤5, 𝑥∈𝑏𝑖𝑙𝑎𝑛𝑔𝑎𝑛 𝑝𝑟𝑖𝑚𝑎} dipetakan ke himpunan kawan 𝐵= {𝑦∣3 <\n𝑦< 9, 𝑦∈𝑏𝑖𝑙𝑎𝑛𝑔𝑎𝑛 𝑔𝑎𝑛𝑗𝑖𝑙} melalui sebuah hubungan relasi aturan \"dua kurangnya dari\". Beri \ntanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Kuantitas kuadran anggota himpunan domain adalah 𝐴= {2,3,5} sedangkan seluruh anggota \nhimpunan kodomain adalah 𝐵= {5,7}.","answer":"Benar","explanation":"Prima antara 1 dan 5 adalah {2,3,5}. Bilangan ganjil antara 3 dan 9 (tidak termasuk 3 dan 9) \nadalah {5,7}."},{"text":"Relasi dengan syarat \"dua kurangnya dari\" antara domain 𝐴 ke daerah kawan 𝐵 tersebut \nmenghasilkan representasi himpunan pasangan berurutan yaitu {(3,5), (5,7)}.","answer":"Benar","explanation":"Elemen yang terhubung adalah 3 berpasangan dengan 5 (karena 3 merupakan 2 kurangnya dari \n5), dan 5 berpasangan dengan 7 (5 merupakan 2 kurangnya dari 7). Anggota domain 2 tidak \nmemiliki kawan karena 2 + 2 = 4 tidak ada pada kodomain 𝐵."},{"text":"Hubungan penyusunan aturan pemetaan yang memetakan dari domain 𝐴 ke 𝐵 di atas secara \nmutlak telah memenuhi standar definisi sebuah fungsi (pemetaan) yang utuh.","answer":"Salah","explanation":"Terdapat anggota domain 2 ∈𝐴 yang tidak memiliki kawan pada kodomain 𝐵. Karena terdapat \nsisa elemen domain yang kosong tanpa kawan, relasi tersebut bukanlah fungsi."},{"text":"Range (daerah hasil) yang terkumpul dari terpetakannya anggota domain pada relasi aturan \nkhusus tersebut memiliki anggota himpunan berupa {5,7}.","answer":"Benar","explanation":"Sesuai koordinat pasangannya {(3,5), (5,7)}, seluruh daerah kawan yang tertunjuk tepat menjadi \nkawan daerah asal adalah {5,7}."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Sebuah instalasi pengolahan pabrik kopi melakukan fabrikasi buah biji kopi mentah lewat \npengelanaan alur Mesin Primer yang mengubah 𝑥 kuintal bahan kotor ke bahan intermediet \nbernotasi pengolah fungsional 𝑓(𝑥) = 3𝑥−1 kuintal. Sesaat berlanjut, muatan diantarkan ke \n\ncorong tampung Mesin Sekunder untuk mengolah output bahan tengah jadi dengan mengikuti \nparameter fungsi konversi 𝑔(𝑡) = 2𝑡+ 5 kuintal siap jual. Tentukan benar atau salah untuk setiap \npernyataan berikut!","statements":[{"text":"Kerja bertingkat integrasi instan tanpa antara dari berat asal 𝑥 menuju target kemasan hilir jika \ndiidentifikasi bermodel rumusan pemersatu yaitu 𝐻(𝑥) = 6𝑥+ 3.","answer":"Benar","explanation":"Konversi fungsional dari relasi substitusi 𝑔(𝑓(𝑥)) = 2(3𝑥−1) + 5 = 6𝑥−2 + 5 = 6𝑥+ 3. \nKerangka model adalah tepat."},{"text":"Bilamana diset peluncuran penyetoran biji asupan mula mentah kotor sebanyak 5 kuintal \npenuh, pabrik memproduksi bahan jual kemasan kopi sebanyak 33 kuintal siap antar.","answer":"Benar","explanation":"Menghubungkan asupan lewat representasi bentukan modular fungsional gabungan langsung: \n𝐻(5) = 6(5) + 3 = 33 kuintal kopi hasil sulingan jual siap kirim."},{"text":"Limit minimum penyediaan pasokan paling dasar muatan biji buah kopi segar agar mesin \npenjalan pertama bernilai aman dan memproses volume tidak hampa berkisar di batas >\n1\n3 \nkuintal.","answer":"Benar","explanation":"Prasyarat keberjalanan fisik bernilai bahan dasar intermediate harus bernilai di atas nol: 𝑓(𝑥) >\n0 ⟹ 3𝑥−1 > 0 ⟹ 𝑥>\n1\n3 kuintal."},{"text":"Pemasangan logistik penyetor hulu demi target merilis pesanan pembeli retail berskala kopi \nsiap minum bermassa berat kotor sepadan 21 kuintal menghabiskan pasokan kopi seberat 5 \nkuintal mentah.","answer":"Salah","explanation":"Uji lewat fungsional bertingkat target: 𝐻(𝑥) = 21 ⟹ 6𝑥+ 3 = 21 ⟹ 6𝑥= 18 ⟹ 𝑥= 3 kuintal. \nJadi beban hulu yang harus digelontorkan sebesar 3 kuintal saja, bukan 5 kuintal."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Pada uji klinis sains kimia tingkat laju kenaikan larutan linier bergantung pada lamanya durasi \npemanasan cairan (𝑚 menit). Hasil riset mengamati di menit ke-2 suhu terekam menyentuh 28∘C \ndan pada selang ke-6 derajat suhu mencatat angka 40∘C. Model fungsi derajat ini linier \nmenempati skema relasi 𝑇(𝑚) = 𝑎𝑚+ 𝑏, di mana 𝑇(𝑚) melambangkan hasil suhu dan 𝑚 durasi \ndalam satuan waktu, tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai derajat mula-mula kondisi larutan (sebelum laju waktu proses pemanasan dinyalakan di \nsaat 𝑚= 0) berada di posisi termostatik suhu sebesar 28∘C.","answer":"Salah","explanation":"Langkah 1: Gunakan data pengujian. Persilangan persamaan liniernya adalah 2𝑎+ 𝑏= 28 dan \n6𝑎+ 𝑏= 40. Langkah 2: Selisih fungsi diperoleh 4𝑎= 12 ⟹ 𝑎= 3 (Kenaikan per unit waktu \nadalah 3∘C). Langkah 3: Substitusikan ke rumus, 2(3) + 𝑏= 28 ⟹ 6 + 𝑏= 28 ⟹ 𝑏= 22 (Maka \nsaat pemanas mati atau 𝑚= 0 adalah 22∘C, bukan 28∘C). Pernyataan ini salah."},{"text":"Kenaikan nilai rata-rata suhu penambahan untuk setiap penggalan kenaikan tiap bertambah \ndurasi pemanasan cairan adalah sebesar 3∘C per menit.","answer":"Benar","explanation":"Langkah 1: Nilai kelajuan akselerasi suhu direpresentasikan dari kemiringan fungsi (nilai gradien \n𝑎). Langkah 2: Melalui eliminasi regresi beda persamaan terekam bahwa nilai 𝑎= 3, maka \nterdapat lonjakan konstan setara naik 3∘C tiap penambahan 1 menit. Pernyataan ini benar."},{"text":"Besaran suhu kepanasan dari zat cairan larutan kimia saat memasuki masa pascapemanasan \ndurasi menit ke-10 terekam setinggi 52∘C.","answer":"Benar","explanation":"Langkah 1: Fungsi rumusan suhu berformula 𝑇(𝑚) = 3𝑚+ 22. Langkah 2: Mengganti peubah \npembanding, masukkan menit ke-10 sehingga 𝑇(10) = 3(10) + 22 = 52∘C. Pernyataan ini benar."},{"text":"Waktu rentang waktu pembakaran mendidih agar memampukan tingkat panas larutan \nmenyentuh nilai puncak didih air konvensional sebesar 100∘C harus memerlukan durasi \npemanasan selama 26 menit.","answer":"Benar","explanation":"Langkah 1: Persamaan uji kelayakan bernilai 𝑇(𝑚) = 100. Langkah 2: Penyeimbangan persuku, \n3𝑚+ 22 = 100 ⟹ 3𝑚= 78 ⟹ 𝑚= 26 menit pengerjaan. Pernyataan ini benar."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan dan menyajikan relasi dan fungsi \nserta menyelesaikan permasalahan kontekstual yang terkait.","question":"Pemeta wilayah koordinat sedang menyederhanakan laju kontur fungsi ketinggian dalam bukit \npercontohan, yang dijabarkan mematuhi pemodelan lengkung kuadrat teoretis berbentuk \npersamaan fungsional berupa model 𝑔(𝑥) = 𝑥2 −4𝑥+ 3 di atas area penggal daerah wilayah \nasal dibatasi himpunan interval bernilai bulat tertutup dari batas bawah yaitu −1 ≤𝑥≤5. Beri \ntanda centang pada setiap pernyataan yang benar terkait sebaran data karakteristik dari model \nlengkung fungsi kuadrat di atas!","statements":[{"text":"Semua titik output perolehan dalam sebaran domain mengantongi kumpulan sebaran bilangan \ndaerah wilayah hasil (range) lengkap yaitu himpunan bulat terbatas {−1,0,3,8}.","answer":"Benar","explanation":"Daerah domain masukan bernilai {−1,0,1,2,3,4,5}. Hasil keluaran fungsi dianalisis: 𝑔(−1) = 8, \n𝑔(0) = 3, 𝑔(1) = 0, 𝑔(2) = −1, 𝑔(3) = 0, 𝑔(4) = 3, 𝑔(5) = 8. Koleksi variasi nilai penyusun \nluasan range menghasilkan variasi terbatas bernilai {−1,0,3,8}."},{"text":"Koordinat dasar terdalam bukit kontur lengkung kurva tersebut (paling minimum secara relatif \nfungsional) pertama kali dideteksi saat lokasi pendaratan parameter absis bernilai 𝑥= 4.","answer":"Salah","explanation":"Kedudukan sumbu simetri bernilai pembuat titik dasar didapat dari: 𝑥𝑝= −𝑏/(2𝑎) =\n−(−4)/2(1) = 2 sebagai puncak letak minimum bukit kontur tersebut, bukan ketika di angka 4."},{"text":"Sinyal pertemuan penyamaan nilai bukit grafik ketika memutus perataan permukaan laut \nhorizontal (memotong koordinat sumbu 𝑋) diperoleh murni hanya saat melewati titik koordinat \nkoordinasi posisi (1,0) dan (3,0).","answer":"Benar","explanation":"Guna memeriksa kedudukan sumbu absis sumbunya bernilai nol: 𝑔(𝑥) = 0 ⟹ 𝑥2 −4𝑥+ 3 =\n0 ⟹ (𝑥−1)(𝑥−3) = 0. Lokasi pembentukan terputusnya ada pada (1,0) dan (3,0)."},{"text":"Secara eksplisit posisi letak puncak pemotong dinding sumbu ordinat sekunder di koordinat \nkartesius tepat membuahkan kedudukan pemosisian bertetangga di (0,3).","answer":"Benar","explanation":"Interseksi ke area tegak vertikal ordinat dipunyai ketika pemisah wilayah asalnya membatasi \nharga absis 𝑥= 0, mengevaluasi koordinasi ke nilai output fungsi didapatkan hasil: 𝑔(0) = (0)2 −\n4(0) + 3 = 3, alias bertitik di (0,3)."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
