<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Bangun Ruang Sisi Datar</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT BILANGAN BULAT</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number": 1, "level": 1, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Wadah lilin aroma berbentuk limas segi enam memiliki luas alas 60 cm² dan tinggi 15 cm. Volume wadah lilin tersebut adalah ....", "options": [{"key": "A", "text": "300 cm³"}, {"key": "B", "text": "450 cm³"}, {"key": "C", "text": "900 cm³"}, {"key": "D", "text": "2.700 cm³"}], "answer": "A", "explanation": "Langkah 1: Identifikasi rumus volume limas, yaitu 𝑉= 1 3 × 𝐿𝑢𝑎𝑠 𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖. Langkah 2: Substitusikan luas alas 60 cm² dan tinggi 15 cm ke dalam rumus, sehingga didapatkan 𝑉= 1 3 × 60 × 15 = 20 × 15 = 300 cm³."}, {"number": 2, "level": 1, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah lampu hias gantung berbentuk limas segi empat memiliki luas alas persegi sebesar 100 cm 2. Jika jumlah luas seluruh sisi tegak lampu tersebut adalah 260 cm 2, luas permukaan lampu hias tersebut adalah ....", "options": [{"key": "A", "text": "100 cm"}, {"key": "B", "text": "260 cm"}, {"key": "C", "text": "360 cm"}, {"key": "D", "text": "520 cm"}], "answer": "C", "explanation": "Diketahui luas alas (𝐿𝑎) = 100 cm 2 dan jumlah luas seluruh sisi tegak (𝐿𝑠𝑡) = 260 cm 2. Rumus luas permukaan limas adalah 𝐿= 𝐿𝑎+ 𝐿𝑠𝑡. Menghitung luas permukaan: 𝐿= 100 + 260 = 360 cm 2."}, {"number": 3, "level": 1, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah wadah kotak tisu tanpa tutup berbentuk kubus memiliki panjang rusuk 12 cm yang permukaan luarnya akan dicat. Berapakah luas permukaan luar wadah kotak tisu tanpa tutup tersebut yang akan dicat?", "options": [{"key": "A", "text": "144 cm"}, {"key": "B", "text": "576 cm"}, {"key": "C", "text": "720 cm"}, {"key": "D", "text": "864 cm"}], "answer": "C", "explanation": "Karena wadah berbentuk kubus tanpa tutup, maka hanya terdapat 5 sisi persegi yang akan dicat. Gunakan rumus luas permukaan kubus tanpa tutup: 𝐿= 5𝑠2. Substitusikan panjang rusuk 𝑠= 12 cm: 𝐿= 5 × 122 = 5 × 144 = 720 cm 2."}, {"number": 4, "level": 2, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Atap sebuah pendopo berbentuk limas segi empat beraturan memiliki keliling alas 36 m dan tinggi limas 10 m. Berapakah volume ruang kosong di bawah atap pendopo tersebut?", "options": [{"key": "A", "text": "270 m³."}, {"key": "B", "text": "810 m³."}, {"key": "C", "text": "1.080 m³."}, {"key": "D", "text": "4.320 m³."}], "answer": "A", "explanation": "Langkah 1: Menghitung panjang sisi alas persegi dari keliling yang diketahui. Sisi alas 𝑠= 36 4 = 9 m. Langkah 2: Menghitung volume limas menggunakan rumus 𝑉= 1 3 × 𝑠2 × 𝑡= 1 3 × 92 × 10 = 270 m³."}, {"number": 5, "level": 2, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah wadah penyimpanan kosmetik berbentuk prisma segitiga siku-siku dengan panjang sisi siku-siku alasnya 9 cm dan 12 cm. Jika tinggi wadah tersebut adalah 20 cm, berapakah luas seluruh permukaan wadah tersebut?", "options": [{"key": "A", "text": "528 cm²"}, {"key": "B", "text": "768 cm²"}, {"key": "C", "text": "774 cm²"}, {"key": "D", "text": "828 cm²"}], "answer": "D", "explanation": "Langkah 1: Hitung panjang sisi miring alas (𝑐) menggunakan teorema Pythagoras: 𝑐= √92 + 122 = 15 cm. Keliling alas segitiga = 9 + 12 + 15 = 36 cm. Luas alas segitiga = 1 2 × 9 × 12 = 54 cm². Langkah 2: Hitung luas permukaan prisma: 𝐿= 2 × 𝐿𝑢𝑎𝑠 𝐴𝑙𝑎𝑠+ 𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔 𝐴𝑙𝑎𝑠× 𝑡= 2(54) + 36 × 20 = 108 + 720 = 828 cm²."}, {"number": 6, "level": 2, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah bak mandi berbentuk balok dengan panjang 100 cm, lebar 80 cm, dan tinggi 60 cm. Jika bak mandi tersebut diisi air hingga mencapai 3 4 dari tinggi totalnya, volume air yang berada di dalam bak mandi tersebut adalah ....", "options": [{"key": "A", "text": "120 𝑙𝑖𝑡𝑒𝑟"}, {"key": "B", "text": "240 𝑙𝑖𝑡𝑒𝑟"}, {"key": "C", "text": "360 𝑙𝑖𝑡𝑒𝑟"}, {"key": "D", "text": "480 𝑙𝑖𝑡𝑒𝑟"}], "answer": "C", "explanation": "Langkah 1: Hitung volume total bak mandi: 𝑉𝑡𝑜𝑡𝑎𝑙= 100 × 80 × 60 = 480.000 𝑐𝑚3 = 480 liter. Langkah 2: Hitung volume air yang mengisi 3 4 bagian: 𝑉𝑎𝑖𝑟= 3 4 × 480 = 360 liter."}, {"number": 7, "level": 3, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah bak penampungan air berbentuk prisma segitiga siku-siku memiliki panjang sisi penyiku alas 60 cm dan 80 cm, dengan tinggi bak 100 cm. Bak air tersebut diisi menggunakan pompa air dengan debit aliran 15 liter per menit. Jika bak tersebut awalnya kosong, berapakah waktu yang diperlukan untuk mengisi bak air hingga mencapai tiga perempat bagian dari kapasitas totalnya?", "options": [{"key": "A", "text": "8 menit"}, {"key": "B", "text": "12 menit"}, {"key": "C", "text": "16 menit"}, {"key": "D", "text": "24 menit"}], "answer": "B", "explanation": "Langkah 1: Menghitung luas alas segitiga siku-siku: 𝐿𝑎𝑙𝑎𝑠= 1 2 × 60 × 80 = 2.400 cm 2. Langkah 2: Menghitung volume total wadah bak air: 𝑉𝑡𝑜𝑡𝑎𝑙= 𝐿𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖= 2.400 × 100 = 240.000 cm 3. Konversi ke liter: 240.000 cm 3 = 240 liter. Langkah 3: Menghitung volume air yang diinginkan (tiga perempat bagian): 𝑉𝑡𝑎𝑟𝑔𝑒𝑡= 3 4 × 240 = 180 liter. Langkah 4: Menghitung waktu pengisian: 𝑊𝑎𝑘𝑡𝑢= 𝑉𝑡𝑎𝑟𝑔𝑒𝑡 𝐷𝑒𝑏𝑖𝑡= 180 15 = 12 menit."}, {"number": 8, "level": 3, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah wadah hadiah berbentuk limas segi empat beraturan dengan panjang sisi alas 10 cm memiliki volume 400 cm 3. Jika seluruh permukaan tegak (sisi-sisi segitiga) bagian luar wadah tersebut akan dilapisi dengan kertas kado berwarna, berapakah luas minimum kertas kado yang dibutuhkan?", "options": [{"key": "A", "text": "130 cm"}, {"key": "B", "text": "160 cm"}, {"key": "C", "text": "240 cm"}, {"key": "D", "text": "260 cm"}], "answer": "D", "explanation": "Langkah 1: Menghitung luas alas limas persegi: 𝐿𝑎𝑙𝑎𝑠= 10 × 10 = 100 cm 2. Langkah 2: Menentukan tinggi limas (𝑡) dari rumus volume: 𝑉= 1 3 × 𝐿𝑎𝑙𝑎𝑠× 𝑡⇒400 = 1 3 × 100 × 𝑡⇒𝑡= 12 cm. Langkah 3: Menghitung tinggi bidang tegak segitiga (𝑇𝑠) dengan teorema Pythagoras: 𝑇𝑠= √122 + ( 10 2 )2 = √144 + 25 = 13 cm. Langkah 4: Menghitung total luas permukaan tegak (4 segitiga): 𝐿𝑡𝑒𝑔𝑎𝑘= 4 × ( 1 2 × 𝑠𝑖𝑠𝑖 𝑎𝑙𝑎𝑠× 𝑇𝑠) = 4 × ( 1 2 × 10 × 13) = 260 cm 2."}, {"number": 9, "level": 3, "type": "Pilihan Ganda", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Seorang perajin kayu memiliki balok kayu mahoni berbentuk kubus dengan panjang rusuk 12 cm. Balok tersebut dipahat hingga membentuk sebuah limas segi empat terbesar dengan alas berimpit pada salah satu sisi kubus. Jika sisa kayu dari hasil pemahatan tersebut dilebur dan dibentuk kembali menjadi beberapa miniatur limas sejenis dengan skala panjang rusuk 1: 3 dari limas terbesar tadi, berapakah jumlah miniatur limas kecil yang dapat dibuat dari sisa kayu tersebut?", "options": [{"key": "A", "text": "18 buah"}, {"key": "B", "text": "54 buah"}, {"key": "C", "text": "81 buah"}, {"key": "D", "text": "162 buah"}], "answer": "B", "explanation": "Langkah 1: Hitung volume balok kubus kayu mahoni: 𝑉𝑘𝑢𝑏𝑢𝑠= 123 = 1.728 𝑐𝑚3. Langkah 2: Hitung volume limas terbesar (panjang sisi alas 12 cm dan tinggi 12 cm): 𝑉𝑙𝑖𝑚𝑎𝑠= 1 3 × (12 × 12) × 12 = 576 𝑐𝑚3. Langkah 3: Hitung volume sisa kayu hasil pemahatan: 𝑉𝑠𝑖𝑠𝑎= 1.728 −576 = 1.152 𝑐𝑚3. Langkah 4: Hitung volume satu buah miniatur limas kecil menggunakan faktor skala volume ( 1 3)3: 𝑉𝑚𝑖𝑛𝑖𝑎𝑡𝑢𝑟= 1 27 × 𝑉𝑙𝑖𝑚𝑎𝑠= 576 27 𝑐𝑚3. Langkah 5: Tentukan jumlah miniatur limas kecil yang dapat dibuat dari sisa kayu tersebut: 𝐽𝑢𝑚𝑙𝑎ℎ= 1.152 576 27 = 1.152×27 576 = 2 × 27 = 54 buah."}, {"number": 10, "level": 1, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah mainan dekorasi berbentuk miniatur atap gedung dibentuk sebagai prisma segitiga tegak lurus yang memiliki luas alas bagian dasar segitiga sebesar 15 𝑐𝑚2 dengan keliling keliling dasar penyusun sepanjang 18 𝑐𝑚. Jika tinggi tiang prisma diatur sepanjang 20 𝑐𝑚, tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Volume total mainan dekoratif berbentuk prisma tegak tersebut bernilai sebesar 150 𝑐𝑚3.", "answer": "Salah", "explanation": "Kapasitas isi volume prisma: 𝑉= 𝐿𝑎𝑙𝑎𝑠× 𝑡= 15 × 20 = 300 𝑐𝑚3, bukan 150 𝑐𝑚3."}, {"text": "Sisi tegak penutup dari selimut dinding mainan tersebut bernilai sebesar 360 𝑐𝑚2.", "answer": "Benar", "explanation": "Luas permukaan bidang selimut (tegak) luar prisma segitiga dihitung dengan rumus: 𝐿𝑠𝑒𝑙𝑖𝑚𝑢𝑡= 𝐾𝑎𝑙𝑎𝑠× 𝑡= 18 × 20 = 360 𝑐𝑚2."}, {"text": "Secara total, gabungan bidang alas penyangga, penutup atas dan bidang penampang keliling mika luar tersebut seluas 390 𝑐𝑚2.", "answer": "Benar", "explanation": "Luas prisma secara menyeluruh adalah: 𝐿= 2(𝐿𝑎𝑙𝑎𝑠) + 𝐿𝑠𝑒𝑙𝑖𝑚𝑢𝑡= 2(15) + 360 = 390 𝑐𝑚2."}, {"text": "Bila ketinggian tiang ditarik memanjang menjadi ukuran tinggi 30 𝑐𝑚 (luas alas dipertahankan konisten), nilai volumenya menjadi 450 𝑐𝑚3.", "answer": "Benar", "explanation": "Hasil perubahan volume prisma: 𝑉𝑏𝑎𝑟𝑢= 15 × 30 = 450 𝑐𝑚3."}]}, {"number": 11, "level": 1, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah kemasan kue berbentuk prisma dengan alas persegi panjang berukuran panjang 12 cm dan lebar 8 cm. Tinggi prisma tersebut adalah 15 cm. Beri tanda centang (✓) pada setiap pernyataan yang benar!", "statements": [{"text": "Luas alas kemasan kue tersebut adalah 96 cm².", "answer": "Benar", "explanation": "Luas alas dihitung langsung menggunakan luas persegi panjang, yaitu 12 cm × 8 cm = 96 cm²."}, {"text": "Volume kemasan kue tersebut adalah 1.440 cm³.", "answer": "Benar", "explanation": "Volume prisma adalah Luas alas dikali tinggi, yaitu 96 cm² × 15 cm = 1.440 cm³."}, {"text": "Luas permukaan seluruh prisma adalah 1.040 cm².", "answer": "Salah", "explanation": "Luas permukaan prisma adalah 2 × 𝐿𝑎𝑙𝑎𝑠+ (𝐾𝑎𝑙𝑎𝑠× 𝑡) = 2 × 96 + (40 × 15) = 192 + 600 = 792 cm², bukan 1.040 cm²."}, {"text": "Jika luas alas dijadikan 100 cm² dengan tinggi yang sama, volumenya akan menjadi 1.500 cm³.", "answer": "Benar", "explanation": "Jika luas alas diganti menjadi 100 cm², maka volume barunya adalah 100 cm² × 15 cm = 1.500 cm³."}]}, {"number": 12, "level": 1, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah wadah berbentuk prisma segi empat memiliki alas berbentuk persegi panjang dengan ukuran 10 cm × 6 cm dan tinggi wadah tersebut adalah 8 cm. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Luas alas wadah tersebut adalah 60 cm 2.", "answer": "Benar", "explanation": "Alas yang berupa persegi panjang dengan panjang 10 cm dan lebar 6 cm memiliki luas sebesar 10 × 6 = 60 cm 2."}, {"text": "Volume wadah tersebut adalah 480 cm 3.", "answer": "Benar", "explanation": "Volume prisma segi empat (balok) diperoleh dari 𝑙𝑢𝑎𝑠 𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖= 60 × 8 = 480 cm 3."}, {"text": "Wadah tersebut memiliki bidang sisi sebanyak 6 buah.", "answer": "Benar", "explanation": "Prisma segiempat selalu dibatasi oleh 6 bidang sisi."}, {"text": "Wadah tersebut memiliki titik sudut sebanyak 12 buah.", "answer": "Salah", "explanation": "Banyaknya titik sudut prisma segiempat adalah 8 buah, bukan 12 buah. Angka 12 adalah jumlah dari seluruh rusuk wadah tersebut."}]}, {"number": 13, "level": 2, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Perajin menggergaji satu blok sasis hias kubik aseli kubus tebal kayu dengan diagonal panjang bersisi miring setara 30 cm. Kemudian balok miring digergaji condong tipis tertebas tepat bersisian segitiga lurus alas seluas sekat 180 cm 2 dan mengikuti ketebalan tiang sisa tumpuan aseli sepanjang 30 cm agar menyisakan sisa kayu pembelah yang lain. Beri tanda centang (✓) pada setiap pernyataan yang benar!", "statements": [{"text": "Potongan satu butir kriya keping dari potongan yang dihasilkan tersebut memiliki isi ukuran sebesar volume murni sekapasitas muatan setara seberat volume saset wadah senilai 5.400 cm 3.", "answer": "Benar", "explanation": "Langkah 1: Formulasikan tumpu struktur bagian tebas lurus anyaman mika: beralas model penampang 𝐿𝑡𝑎𝑝𝑎𝑘= 180 cm 2. Langkah 2: Hasil anyaran prisma pengukir volumetrik baji kayu lurus: 𝑉= 𝐿𝑡𝑎𝑝𝑎𝑘× 𝑡= 180 × 30 = 5.400 cm 3."}, {"text": "Maka hasil bagian keping buangan tersebut bernilai bervolumetrik tepat setara setengah dari isi volumetrik kubus utuh pilar aseli sedia awal pilar jati sebelum dipecahkan terbagi dua condong porsi sebanding lurus saset balok.", "answer": "Salah", "explanation": "Langkah 1: Mengetahui aseli kapasitas total ruang utuh sedia waduk balok kubik lurus: 𝑉𝑘𝑢𝑏𝑢𝑠= 𝑠𝑖𝑠𝑖3 = 303 = 27.000 cm 3. Langkah 2: Menyusun analisis setengah volume asli kubik 0.5 × 27.000 = 13.500 cm 3. Hubungan nilai volumetrik serpih kayu hasil olah yaitu 5.400 tidak bersesuaian proporsinya terhadap 13.500 cm 3."}, {"text": "Jika dihitung volumetrik sisa baji yang sengaja dibuang murni tersingkir dan disembul draf aseli luar potongan tiang ini bernilai aseli tumpukan beras kotor seukuran sisa anyelir anyaman balok aseli sedia wadah penuh terkurung di lobi mampat berkapasitas senilai 21.600 cm 3.", "answer": "Benar", "explanation": "Langkah 1: Identifikasi volume aseli tangki penampung penuh adalah 27.000 cm 3 saset kerdus boks kayu, dan isi sisa goresan terbilas kayu kecil terukir senilai 5.400 cm 3. Langkah 2: Kalkulasikan volumetrik sisa tiang potongan berpelindung wadah kayu: 27.000 −5.400 = 21.600 cm 3."}, {"text": "Wadah bidang flat lantai penampang bagian bawah penumpu kriya sisa pangkas pada bidang dasar balok kayu aseli kubik awal itu jika dihitung sisa alas bujur kasarnya masih bertapak terukur setotal seluas penampang lurus sebesar 520 cm 2.", "answer": "Salah", "explanation": "Langkah 1: Ukuran penampang alas dasar kubus adalah bujursangkar 30 × 30 = 900 cm 2, sedang pengalokasian pangkas dasar piring lurus miring yang dipasangkan sebilang seberat 180 cm 2. Langkah 2: Luas tumpuan bagian alas sisa: 900 −180 = 720 cm 2. Hasil hitung opsi berharga seluas 520 cm 2 tidak tepat."}]}, {"number": 14, "level": 2, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Sebuah tempat penampungan air berbentuk balok memiliki perbandingan ukuran panjang, lebar, dan tingginya berturut-turut 3: 2: 1, dengan lebar balok tersebut diketahui 30 cm. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Panjang wadah penampung air tersebut adalah 45 cm dan tingginya adalah 15 cm.", "answer": "Benar", "explanation": "Lebar mewakili perbandingan bagian 2 yang nilainya adalah 30 cm, maka konstanta pembandingnya 30/2 = 15 cm. Panjang balok adalah 3 × 15 = 45 cm dan tingginya adalah 1 × 15 = 15 cm."}, {"text": "Volume dari tempat penampungan air jika diisi penuh adalah 20,25 liter.", "answer": "Benar", "explanation": "Volume balok = 𝑝𝑎𝑛𝑗𝑎𝑛𝑔× 𝑙𝑒𝑏𝑎𝑟× 𝑡𝑖𝑛𝑔𝑔𝑖= 45 × 30 × 15 = 20.250 cm 3. Karena 1.000 cm 3 = 1 dm 3 = 1 liter, volume dalam liter adalah 20.250/1.000 = 20,25 liter."}, {"text": "Luas permukaan luar keseluruhan balok tersebut adalah 4.950 cm 2.", "answer": "Benar", "explanation": "Luas permukaan balok adalah 2 × (𝑝⋅𝑙+ 𝑝⋅𝑡+ 𝑙⋅𝑡) = 2 × (45 × 30 + 45 × 15 + 30 × 15) = 2 × (1.350 + 675 + 450) = 2 × 2.475 = 4.950 cm 2."}, {"text": "Jika tinggi balok diubah menjadi dua kali ukuran semula, maka luas permukaan balok akan berubah menjadi 9.900 cm 2.", "answer": "Salah", "explanation": "Pernyataan ini salah karena jika tinggi balok menjadi dua kali semula (30 cm), luas permukaan yang baru adalah 2 × (45 × 30 + 45 × 30 + 30 × 30) = 2 × (1.350 + 1.350 + 900) = 7.200 cm 2."}]}, {"number": 15, "level": 2, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Seorang pengrajin beton membuat saluran air (drainase) berbentuk prisma dengan alas trapesium sama kaki. Sisi-sisi horizontal alas yang sejajar bagian atas dan bawah masing-masing adalah 14 cm dan 26 cm, sedangkan kaki kemiringan tepi trapesium dihitung 10 cm. Kedalaman panjang bentang prisma tersebut ke samping (panjang balok semen) mencapai 100 cm. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Tinggi penampang trapesium sebagai alas dari struktur saluran drainase beton adalah 8 cm.", "answer": "Benar", "explanation": "Langkah awal adalah mencari proyeksi sisa selisih alas trapesium sama kaki: 26−14 2 = 6 cm. Berdasarkan itu tinggi miring alas dihitung menggunakan rumus Pythagoras: ℎ= √102 −62 = √64 = 8 cm."}, {"text": "Luas penampang salah satu bidang ubin dari alas lubang prisma beton tersebut adalah 160 cm².", "answer": "Benar", "explanation": "Terlebih dahulu dapatkan tinggi trapesium yaitu 8 cm. Selanjutnya, hitung nilai luas daerah alas tersebut: 𝐿= 1 2 × (14 + 26) × 8 = 1 2 × 40 × 8 = 160 cm²."}, {"text": "Volume air maksimal yang dapat ditampung dalam saluran beton dalam satu segmen penuh adalah 160.000 cm³.", "answer": "Salah", "explanation": "Melalui nilai dari luas daerah dasar penampang trapesium yaitu 160 cm², kapasitas total satu segmen pipa drainase dicari dengan mengalikannya terhadap panjang pipa: 𝑉= 𝐿𝑎× 𝑝𝑠𝑒𝑔𝑚𝑒𝑛= 160 × 100 = 16.000 cm³, bukan 160.000 cm³."}, {"text": "Luas penutup beton secara terpadu jika saluran dibuat utuh terkelupas permukaan luarnya mencapai 6.320 cm².", "answer": "Benar", "explanation": "Hitung keliling alas trapesium = 14 + 26 + 10 + 10 = 60 cm. Melalui tinggi penampang 8 cm, hitung seluruh ubin luar balok: 𝐿𝑝= 2 × 160 + (60 × 100) = 320 + 6.000 = 6.320 cm²."}]}, {"number": 16, "level": 3, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Dua buah balok kayu dengan ukuran berbeda digunakan untuk membuat miniatur bangunan. Balok pertama memiliki rasio ukuran panjang : lebar : tinggi sebesar 3: 2: 1 dengan volume sebesar 1.296 cm. Balok kedua berbentuk kubus dengan panjang rusuk setengah dari ukuran panjang balok pertama. Kedua balok kayu tersebut akan dilapisi dengan kertas dekoratif di seluruh permukaannya secara merata tanpa ada bagian yang saling tumpang tindih. Tentukan benar atau salah untuk setiap pernyataan berikut berdasarkan analisis ukuran luas permukaan kedua balok kayu tersebut!", "statements": [{"text": "Ukuran panjang, lebar, dan tinggi dari balok kayu pertama berturut-turut adalah 18 cm, 12 cm, dan 6 cm.", "answer": "Benar", "explanation": "Menggunakan rasio variabel 3𝑥, 2𝑥, 𝑥 sehingga 𝑉1 = 3𝑥× 2𝑥× 𝑥= 6𝑥3. Didapat 6𝑥3 = 1296 ⟹ 𝑥3 = 216 ⟹ 𝑥= 6. Dimensi balok tersebut berturut-turut adalah 3(6) = 18 cm, 2(6) = 12 cm, dan 1(6) = 6 cm. Maka pernyataan ini benar."}, {"text": "Luas permukaan balok pertama adalah 792 cm.", "answer": "Benar", "explanation": "Luas permukaan balok pertama dengan dimensi 18 cm, 12 cm, dan 6 cm dihitung sebagai 𝐿𝑃1 = 2 × (𝑝⋅𝑙+ 𝑝⋅𝑡+ 𝑙⋅𝑡) = 2 × (18 ⋅12 + 18 ⋅6 + 12 ⋅6) = 2 × (216 + 108 + 72) = 2 × 396 = 792 𝑐𝑚2. Maka pernyataan ini benar."}, {"text": "Luas permukaan kubus yang merupakan balok kedua adalah sebesar 648 cm.", "answer": "Salah", "explanation": "Panjang rusuk kubus (𝑠) adalah setengah dari panjang balok pertama, yaitu 𝑠= 1 2 × 18 = 9 cm. Luas permukaan kubus tersebut adalah 𝐿𝑃2 = 6 × 𝑠2 = 6 × 92 = 6 × 81 = 486 𝑐𝑚2, bukan 648 cm. Maka pernyataan ini salah."}, {"text": "Selisih kertas dekoratif minimal yang dikonsumsi untuk membungkus balok pertama dengan kubus tersebut adalah 306 cm.", "answer": "Benar", "explanation": "Selisih kebutuhan luas permukaan pembungkus kertas hias dihitung dengan mengurangkan 𝐿𝑃1 −𝐿𝑃2 = 792 −486 = 306 𝑐𝑚2. Maka pernyataan ini benar."}]}, {"number": 17, "level": 3, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Perancang produk pajangan akrilik transparan merakit etalase berbentuk balok (prisma segi empat tegak) dengan penutup yang sengaja tidak dipasang di atasnya. Bidang alas wadah berupa bentuk persegi dengan total keliling sebesar 80 cm, dan tinggi dirakit agar menghasilkan seluruh pelat sisa akrilik pelindung untuk 5 permukaannya (empat sisi luar ditambah satu lantai alas) adalah 2.000 cm 2. Beri tanda centang (✓) pada setiap pernyataan yang benar!", "statements": [{"text": "Tinggi kotak pajangan akrilik yang harus dipasang oleh perancang produk adalah 20 cm.", "answer": "Benar", "explanation": "Langkah 1: Cari ukuran panjang sisi luar bidang alas persegi yaitu 80/4 = 20 cm. Maka luas alas adalah 202 = 400 cm 2, dan kelilingnya 80 cm. Langkah 2: Masukkan rumus pembungkus tangki kaca tanpa satu sisi atasnya: 𝐿= 𝐿𝑎𝑙𝑎𝑠+ (𝐾𝑎𝑙𝑎𝑠× 𝑇) ⇒2.000 = 400 + 80𝑇. Langkah 3: Temukan variabel penentu t: 1.600 = 80𝑇⇒𝑇= 20 cm. Pernyataan ini benar."}, {"text": "Volume pajangan akrilik wadah kaca yang terbentuk adalah 8 liter.", "answer": "Benar", "explanation": "Langkah 1: Berdasarkan rincian penyusun telah ditemukan panjang alasnya 20 cm, lebarnya 20 cm, serta tinggi tiang tegak 𝑇= 20 cm. Langkah 2: Hitung isian volumenya: 𝑉= 20 × 20 × 20 = 8.000 cm 3. Langkah 3: Konversi ukuran standard desiliter ke satuan liter: 8.000 𝑐𝑚3 = 8 𝑑𝑚3 = 8 liter. Pernyataan ini benar."}, {"text": "Jika kotak akrilik dibuat lengkap tertutup rapat di semua permukaan, luas lembaran akrilik tambahan yang diperlukan untuk membuat bagian tutup tersebut adalah 400 cm 2.", "answer": "Benar", "explanation": "Langkah 1: Diketahui sisi murni bentuk persegi bagian dasar wadah 20 cm. Langkah 2: Karena merupakan tutup di paling atas dari wadah berarah persegi, ukuran dan luasnya akan tepat sama dengan bagian bawah dasar. Langkah 3: Carilah total dimensi satu keping bagian tutup: 20 × 20 = 400 cm 2. Pernyataan ini benar."}, {"text": "Apabila lebar alas diperpanjang menjadi dua kali semula tanpa mengubah tinggi, volume prisma akan berkurang menjadi 4.000 cm 3.", "answer": "Salah", "explanation": "Langkah 1: Lebar alas diperbesar dari 20 cm menjadi 40 cm, panjang alas tetap 20 cm, dan tinggi 𝑇= 20 cm. Langkah 2: Hitung nilai volume baru tangki tersebut: 𝑉𝑏𝑎𝑟𝑢= 40 × 20 × 20 = 16.000 cm 3. Langkah 3: Karena volume naik dari 8.000 cm 3 menjadi 16.000 cm 3, ia membesar bukannya malah berkurang. Maka pernyataan salah."}]}, {"number": 18, "level": 3, "type": "Analisis Pernyataan", "objective": "Menentukan luas permukaan dan volume bangun ruang sisi datar dan menyelesaikan masalah yang terkait.", "question": "Arsitek bangunan merancang sistem atap lumbung penyimpanan padi di kompleks perkampungan berbentuk struktur mirip limas segi empat beraturan yang berdiri pada pelat tumpu papan lapis bersisi lantai persegi berukuran 20 𝑚× 20 𝑚. Dengan tinggi bubungan atap penampungnya setinggi 24 meter, dipersiapkan tindakan antisipasi pengawetan disemprot obat pelindung di mana kemasan obat pembasmi maksimal menutupi luas dinding selimut samping sekat miring luar sepadan luas maksimum 100 𝑚2 per kemasan, beri tanda centang (✓) pada setiap pernyataan yang benar!", "statements": [{"text": "Sumbu tinggi miring lintasan luarnya segitiga pelindung monumen penahan tersebut bernilai 30 meter.", "answer": "Salah", "explanation": "Langkah pertama: tentukan titik koordinat letak bagian penengah alas mendatar sebesar 20/2 = 10 meter. Langkah kedua: dapatkan tinggi kemiringan luar (apotema atap): √102 + 242 = 26 meter."}, {"text": "Ruang kosong dalam model bubungan limas perlindungan aula pertemuan murni bervolume maksimal seberat 3.200 𝑚3.", "answer": "Benar", "explanation": "Langkah pertama: cari area dasar kayu: 20 × 20 = 400 𝑚2. Langkah kedua: masukkan data numerik tersebut ke rumus teoretis kubik volume limas: 𝑉= 1 3 × 400 × 24 = 3.200 𝑚3."}, {"text": "Area luar seng baja atap sisi bidang kemiringan tegak limas (luas selimut) yang harus dilapisi merata seluas 1.040 𝑚2.", "answer": "Benar", "explanation": "Langkah pertama: carilah luas salah satu ubin mika bagian panel pelindung dinding samping ( 1 2 × 20 × 26 = 260 𝑚2). Langkah kedua: hitung luasan panel empat arah segitiga luarnya yang terbuat dari membran pelapis seng luar mika: 4 × 260 = 1.040 𝑚2."}, {"text": "Jika seluruh dinding miring atap luar lumbung disemprot cairan obat pelindung rayap tersebut, pengrajin perlu menyediakan paling sedikit sebanyak 11 botol cairan pelindung kayu kering tersebut.", "answer": "Benar", "explanation": "Langkah pertama: ketahui total luasan permukaan miring luar pelapis adalah 1.040 𝑚2. Langkah kedua: tentukan alokasi tangki semprot kimia kayu antirayap: 1.040/100 = 10,4 kaleng. Oleh karena pelapisan diaplikasikan merata menutupi bagian permukaan tanpa jeda sisa, secara matematika bulat murni disediakan sebanyak 11 kemasan pelindung antiseptik serangga."}]}, {"number": 19, "level": 1, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah kemasan mika untuk nasi tumpeng berbentuk limas segi empat diperkecil dengan faktor skala 𝑘= 1 2. Jika volume kemasan awal adalah 160 cm³, berapakah volume kemasan setelah diperkecil?", "options": [{"key": "A", "text": "20 cm³."}, {"key": "B", "text": "40 cm³."}, {"key": "C", "text": "80 cm³."}, {"key": "D", "text": "320 cm³."}], "answer": "A", "explanation": "Volume baru setelah diperkecil dengan faktor skala 𝑘 dihitung menggunakan rumus: 𝑉𝑜𝑙𝑢𝑚𝑒 𝐵𝑎𝑟𝑢= 𝑘3 × 𝑉𝑜𝑙𝑢𝑚𝑒 𝐿𝑎𝑚𝑎. Substitusikan nilai 𝑘= 1 2 dan 𝑉𝑜𝑙𝑢𝑚𝑒 𝐿𝑎𝑚𝑎= 160 cm³ ke dalam rumus tersebut. 𝑉𝑜𝑙𝑢𝑚𝑒 𝐵𝑎𝑟𝑢= ( 1 2)3 × 160 = 1 8 × 160 = 20 cm³. Jadi, volume kemasan setelah diperkecil adalah 20 cm³."}, {"number": 20, "level": 1, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah bak mandi berbentuk kubus diperkecil ukurannya dengan faktor skala 1 4. Berapakah perbandingan volume bak mandi setelah diperkecil terhadap volume semula?", "options": [{"key": "A", "text": "1: 64."}, {"key": "B", "text": "1: 16."}, {"key": "C", "text": "1: 8."}, {"key": "D", "text": "1: 4."}], "answer": "A", "explanation": "Step 1: Misalkan volume awal bak mandi adalah 𝑉1 dan faktor skala perkecilan adalah 𝑘= 1 4. Step 2: Hubungan volume sebelum dan sesudah diperkecil adalah 𝑉2 = 𝑘3 × 𝑉1. Step 3: Hitung rasionya: 𝑉2 = ( 1 4)3 × 𝑉1 = 1 64 × 𝑉1. Step 4: Maka perbandingan volume setelah diperkecil terhadap volume semula adalah 1: 64."}, {"number": 21, "level": 1, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Miniatur rumah adat Toraja berbentuk prisma diperbesar dengan faktor skala 𝑘= 5. Berapakah perbandingan luas permukaan miniatur sebelum diperbesar terhadap luas permukaan setelah diperbesar?", "options": [{"key": "A", "text": "1: 5"}, {"key": "B", "text": "1: 10"}, {"key": "C", "text": "1: 15"}, {"key": "D", "text": "1: 25"}], "answer": "D", "explanation": "Misalkan luas permukaan awal adalah 𝐿1. Dengan menggunakan faktor skala 𝑘= 5, luas permukaan yang baru adalah 𝐿2 = 𝑘2 × 𝐿1 = 52 × 𝐿1 = 25𝐿1. Perbandingan luas permukaan sebelum diperbesar terhadap setelah diperbesar adalah 𝐿1: 𝐿2 = 𝐿1: 25𝐿1 = 1: 25."}, {"number": 22, "level": 2, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah kotak kemasan pia khas Yogyakarta berbentuk kubus memiliki luas permukaan sebesar 120 cm². Jika kotak kemasan tersebut diperbesar dengan faktor skala 𝑘= 3, berapakah luas permukaan kotak kemasan setelah diperbesar?", "options": [{"key": "A", "text": "120 cm²."}, {"key": "B", "text": "360 cm²."}, {"key": "C", "text": "480 cm²."}, {"key": "D", "text": "1.080 cm²."}], "answer": "D", "explanation": "Langkah 1: Menentukan faktor skala luas dari faktor skala panjang yang diberikan. Faktor skala luas adalah 𝑘2 = 32 = 9. Langkah 2: Menghitung luas permukaan kotak baru (𝐿2) dengan mengalikan luas permukaan awal dengan faktor skala luas. Luas permukaan baru adalah 𝐿2 = 120 × 9 = 1.080 cm²."}, {"number": 23, "level": 2, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah wadah penyimpanan kerupuk berbentuk prisma segi empat memiliki volume 250 cm³. Wadah tersebut diperbesar secara proporsional sehingga volumenya menjadi 2.000 cm³. Berapakah faktor skala perbesaran dari wadah tersebut?", "options": [{"key": "A", "text": "16"}, {"key": "B", "text": "8"}, {"key": "C", "text": "4"}, {"key": "D", "text": "2"}], "answer": "D", "explanation": "Langkah 1: Menentukan rasio perbandingan volume wadah baru terhadap wadah lama: 𝑉2 𝑉1 = 2.000 250 = 8. Langkah 2: Menghitung faktor skala perbesaran (𝑘) dengan rumus 𝑘3 = 8. Diperoleh 𝑘= √8 3 = 2."}, {"number": 24, "level": 2, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Dua buah kotak penyimpanan anyaman khas Bali berbentuk kubus memiliki perbandingan luas permukaan 9: 25. Jika volume kotak yang lebih kecil adalah 216 cm 3, volume kotak yang lebih besar adalah ....", "options": [{"key": "A", "text": "360 cm"}, {"key": "B", "text": "600 cm"}, {"key": "C", "text": "1000 cm"}, {"key": "D", "text": "1250 cm"}], "answer": "C", "explanation": "Langkah 1: Menentukan faktor skala panjang rusuk (𝑘) dari perbandingan luas permukaannya. Karena 𝐿1 𝐿2 = 𝑘2 = 9 25, maka 𝑘= √ 9 25 = 3 5. Langkah 2: Menghitung volume kotak yang lebih besar menggunakan perbandingan volume, yaitu 𝑉1 𝑉2 = 𝑘3 = ( 3 5)3 = 27 125. Langkah 3: Menyelesaikan persamaan volume: 216 𝑉2 = 27 125 ⇒𝑉2 = 216×125 27 = 8 × 125 = 1000 cm 3."}, {"number": 25, "level": 3, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Perajin miniatur rumah adat Toraja (Tongkonan) membuat atap berbentuk prisma segitiga dengan luas permukaan 120 cm 2 dan membutuhkan biaya bahan sebesar Rp3.000,00 per buah. Perajin tersebut ingin memproduksi dua jenis ukuran baru, yaitu Tipe X yang ukuran panjang rusuknya diperbesar dengan faktor skala 2, dan Tipe Y dengan faktor skala 3. Jika biaya bahan pembuatan miniatur sebanding dengan luas permukaannya, selisih biaya bahan untuk membuat satu buah miniatur Tipe Y dan satu buah Tipe X adalah ....", "options": [{"key": "A", "text": "Rp15.000,00"}, {"key": "B", "text": "Rp20.000,00"}, {"key": "C", "text": "Rp25.000,00"}, {"key": "D", "text": "Rp40.000,00"}], "answer": "A", "explanation": "Biaya bahan awal 𝐵= 𝑅𝑝3.000,00. Karena biaya sebanding dengan luas permukaan, maka biaya berskala kuadrat terhadap faktor skala panjang (𝐵𝑏𝑎𝑟𝑢= 𝑘2 × 𝐵). Tipe X (𝑘𝑥= 2): Biaya bahan menjadi 22 × 𝑅𝑝3.000,00 = 4 × 𝑅𝑝3.000,00 = 𝑅𝑝12.000,00. Tipe Y (𝑘𝑦= 3): Biaya bahan menjadi 32 × 𝑅𝑝3.000,00 = 9 × 𝑅𝑝3.000,00 = 𝑅𝑝27.000,00. Selisih biaya bahan Tipe Y dan Tipe X: 𝑅𝑝27.000,00 −𝑅𝑝12.000,00 = 𝑅𝑝15.000,00."}, {"number": 26, "level": 3, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Seorang pengrajin gerabah di Kasongan, Yogyakarta, membuat celengan berbentuk kubus dari tanah liat. Satu celengan kecil dengan panjang rusuk 10 cm memerlukan tanah liat seberat 0,5 kg. Jika ia ingin membuat celengan serupa dengan panjang rusuk 30 cm, berapakah berat tanah liat yang dibutuhkan untuk membuat satu celengan besar tersebut?", "options": [{"key": "A", "text": "1,5 kg"}, {"key": "B", "text": "4,5 kg"}, {"key": "C", "text": "13,5 kg"}, {"key": "D", "text": "27,0 kg"}], "answer": "C", "explanation": "Langkah 1: Tentukan faktor skala panjang rusuk celengan besar terhadap celengan kecil: 𝑘= 30 10 = 3. Langkah 2: Karena celengan terbuat dari bahan padat yang volumenya sebanding dengan berat tanah liat (asumsi ketebalan dan massa jenis sama), maka berat celengan baru sebanding dengan perubahan volume. Langkah 3: Rasio volume baru terhadap lama adalah 𝑘3 = 33 = 27. Langkah 4: Hitung berat tanah liat celengan baru: 𝑊𝑏𝑎𝑟𝑢= 27 × 0,5 𝑘𝑔= 13,5 𝑘𝑔."}, {"number": 27, "level": 3, "type": "Pilihan Ganda", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah kotak kerajinan perak di Kotagede berbentuk kubus dengan luas permukaan awal 𝐿. Kotak tersebut diperbesar dengan faktor skala 3, kemudian karena terlalu besar, kotak hasil perbesaran tersebut diperkecil kembali dengan faktor skala 1 2 dari ukuran dimensi yang baru. Perbandingan luas permukaan kotak setelah mengalami kedua perubahan tersebut terhadap luas permukaan awal kotak adalah ....", "options": [{"key": "A", "text": "3: 4"}, {"key": "B", "text": "9: 4"}, {"key": "C", "text": "27: 8"}, {"key": "D", "text": "9: 2"}], "answer": "B", "explanation": "Faktor skala panjang setelah dua kali proses perubahan dimensi: 𝑘= 3 × 1 2 = 3 2. Rasio luas permukaan bangun ruang sebanding dengan kuadrat dari faktor skala panjangnya: 𝑘2 = ( 3 2)2 = 9 4. Sehingga, perbandingan luas permukaan akhir terhadap luas permukaan awal adalah 9: 4."}, {"number": 28, "level": 1, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Seorang desainer membuat maket lemari pajangan kayu jati Jepara yang berbentuk prisma segi empat. Maket lama kemudian diganti dengan maket baru dengan memperbesar rusuk-rusuknya menggunakan faktor skala 𝑘= 1,5. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Luas permukaan alas lemari baru menjadi 2,25 kali dari luas permukaan alas lemari semula.", "answer": "Benar", "explanation": "Dimensi perubahan luas alas baru merupakan efek pengkuadratan dari faktor pengubah skala yaitu 𝑘2 = (1,5)2 = 2,25 kali ukuran sebelumnya. Pernyataan ini benar."}, {"text": "Volume maket lemari yang baru setelah diubah menjadi 3,375 kali volume maket awal.", "answer": "Benar", "explanation": "Karena pengaruh perbesaran spasial tiga dimensi volume bersifat kubik, perubahan volume bernilai 𝑘3 = (1,5)3 = 3,375 kali kapasitas pertama. Pernyataan ini benar."}, {"text": "Setiap panjang tepi sisi pada maket lemari baru menjadi 1,5 kali panjang semula.", "answer": "Benar", "explanation": "Komponen ornamen sisi berjenis panjang tunggal (linear) berekspansi sepadan langsung dengan koefisien skala dasarnya, yaitu 𝑘= 1,5. Pernyataan ini benar."}, {"text": "Perbandingan jumlah panjang seluruh rusuk maket baru dibanding maket lama adalah 9: 4.", "answer": "Salah", "explanation": "Panjang keseluruhan rusuk termasuk aspek satu dimensi sehingga rasio pembandingnya tepat seimbang dengan konstanta aslinya 1,5 = 3: 2, sedangkan nilai 9: 4 merupakan hasil keliru dari 𝑘2. Pernyataan ini salah."}]}, {"number": 29, "level": 1, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Seorang seniman sedang mengukir balok kayu hias dengan rasio dimensi panjang, lebar, dan tinggi yang sebangun. Seniman tersebut berniat membuat ukuran tiruannya yang lebih mini dengan menggunakan faktor skala pengecilan sebesar 𝑘= 1 3. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Ukuran rusuk tegak balok baru setelah dikecilkan menjadi 9 kali lipat ukuran rusuk kayu yang semula.", "answer": "Salah", "explanation": "Ukuran dimensi liniernya mengalami perkecilan secara linier sejalan faktor skala 𝑘, sehingga nilainya adalah 1 3 kali dari panjang semula, bukan 9 kali lipat."}, {"text": "Perbandingan jumlah panjang rusuk keseluruhan balok baru dibanding balok kayu semula adalah 1 : 3.", "answer": "Benar", "explanation": "Total panjang rusuk linier pada bangun datar maupun bangun ruang sebanding langsung dengan faktor skalanya (𝑘= 1 3 atau rasio 1 : 3)."}, {"text": "Perbandingan volume balok kayu baru dibanding balok kayu semula adalah 1 : 27.", "answer": "Benar", "explanation": "Sesuai rumus perbandingan volume tiga dimensi pada objek yang sebangun, volumenya sebanding dengan nilai pangkat tiga faktor skalanya yaitu ( 1 3)3 = 1: 27."}, {"text": "Luas penampang bidang sisi tegak balok baru bernilai 1 9 kali luas penampang bidang semula yang bersesuaian.", "answer": "Benar", "explanation": "Skala perubahan luas suatu bidang sisi adalah kuadrat dari skala linier, yakni ( 1 3)2 = 1 9 dari ukuran mula-mula."}]}, {"number": 30, "level": 1, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah akuarium mini berbentuk kubus memiliki luas permukaan awal 600 cm 2. Akuarium tersebut diperkecil secara proporsional menggunakan faktor skala 1 5. Beri tanda centang (✓) pada setiap pernyataan yang benar!", "statements": [{"text": "Luas permukaan akuarium setelah diperkecil menjadi 24 cm 2.", "answer": "Benar", "explanation": "Benar. Luas permukaan baru adalah 𝑘2 kali luas permukaan awal, yaitu ( 1 5)2 × 600 = 1 25 × 600 = 24 cm 2."}, {"text": "Luas permukaan akuarium setelah diperkecil menjadi 120 cm 2.", "answer": "Salah", "explanation": "Salah karena siswa menggunakan perkalian langsung terhadap faktor skala pertama saja tanpa dikuadratkan: 600 × 1 5 = 120 cm 2, padahal untuk luas harus dikuadratkan."}, {"text": "Perbandingan luas permukaan akuarium baru terhadap akuarium semula adalah 1: 25.", "answer": "Benar", "explanation": "Benar. Rasio perubahan luas adalah 𝑘2 = ( 1 5)2 = 1 25, sehingga perbandingannya adalah 1: 25."}, {"text": "Perbandingan volume akuarium baru terhadap akuarium semula adalah 1: 125.", "answer": "Benar", "explanation": "Benar. Rasio perubahan volume adalah 𝑘3 = ( 1 5)3 = 1 125, yang berarti perbandingannya adalah 1: 125."}]}, {"number": 31, "level": 2, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah bak air penampung di dalam kamar mandi berbentuk balok memiliki ukuran awal panjang 120 cm, lebar 80 cm, dan tinggi 60 cm. Setelah dilakukan renovasi ruangan, seluruh rusuk bak tersebut diperkecil secara proporsional hingga panjang bak yang baru menjadi 40 cm. Tentukan benar atau salah untuk setiap pernyataan berikut!", "statements": [{"text": "Faktor skala perpindahan/pengurangan dari cetakan wadah baru terhadap aslinya bernilai 1 3.", "answer": "Benar", "explanation": "Langkah 1: Bentuk rasio konversi penyusutan panjang baru terhadap aslinya 𝑟= 40 120. Langkah 2: Lakukan simplifikasi perbandingan hingga diperoleh pecahan murni terendah senilai 1 3. Evaluasi bernilai Benar."}, {"text": "Tinggi dimensi baru yang diperoleh bak air mandi sesudah penyusutan cetakan baru adalah 20 cm.", "answer": "Benar", "explanation": "Langkah 1: Terapkan skala penurunan bernilai sepertiga bagian pada panjang semula. Langkah 2: Cari nilai perubahan tinggi baru lewat 60 × 1 3 = 20 cm. Evaluasi bernilai Benar."}, {"text": "Daya kapasitas penampung wadah bak mandi setelah pemotongan berharga 1 9 bagian kapasitas lamanya.", "answer": "Salah", "explanation": "Langkah 1: Ukur hubungan rasio penampung kapasitas volume tiga dimensi sesudah penurunan linear 𝑘3. Langkah 2: Cari nilainya dari pangkat tiga sepertiga ( 1 3)3 = 1 27, sedangkan nilai 1 9 adalah keliru akibat pengaruh parameter kuadrat bidang luas. Evaluasi bernilai Salah."}, {"text": "Luas seluruh permukaan bak kamar mandi penyusutan baru berkurang menjadi hanya sepertiga bagian luas lama.", "answer": "Salah", "explanation": "Langkah 1: Hubungan luasan luar dipengaruhi penyusutan sebanding berpangkat kuadrat dari skalanya. Langkah 2: Hasil nilai skala reduksi luasan seharusnya berkurang sebesar ( 1 3)2 = 1 9 bagian semula. Penurunan linier sepertiga bagian ke nilai luas salah. Evaluasi bernilai Salah."}]}, {"number": 32, "level": 2, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Seorang perajin kayu miniatur di Yogyakarta memproduksi kotak penyimpanan dari kayu berbentuk kubus dengan panjang rusuk 12 cm. Atas permintaan pelanggan, dia memproduksi versi kotak yang lebih besar yang sebangun menggunakan faktor skala perbesaran 𝑘= 3 2. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai perubahan sifat fisis kotak penyimpanan baru!", "statements": [{"text": "Luas permukaan kotak penyimpanan baru adalah 1.944 𝑐𝑚2.", "answer": "Benar", "explanation": "Langkah 1: Menghitung luas permukaan kotak mula-mula (𝐿1 = 6 × 122 = 864 𝑐𝑚2). Langkah 2: Menghitung luas permukaan setelah diperbesar dengan rasio 𝑘2, yaitu 𝐿2 = ( 3 2)2 × 864 = 9 4 × 864 = 1944 𝑐𝑚2."}, {"text": "Volume kotak penyimpanan baru yang diperoleh perajin tersebut adalah 3.888 𝑐𝑚2.", "answer": "Salah", "explanation": "Langkah 1: Menghitung volume awal kotak (𝑉1 = 123 = 1728 𝑐𝑚3). Langkah 2: Menggunakan rasio kubik volume sehingga volume baru adalah 𝑉2 = ( 3 2)3 × 1728 = 27 8 × 1728 = 5832 𝑐𝑚3. Pernyataan salah dan satuan salah (ditulis pangkat 2)."}, {"text": "Perbandingan volume kotak yang diperbesar terhadap volume kotak mula-mula adalah 27: 8.", "answer": "Benar", "explanation": "Langkah 1: Menyatakan perbandingan teoritis hubungan skala volume yaitu 𝑉2: 𝑉1 = 𝑘3. Langkah 2: Menghitung nilai numerik perbandingan melalui penyelesaian rumus, sehingga rasio yang diperoleh yaitu ( 3 2)3 = 27 8 atau bernilai senilai 27: 8."}, {"text": "Selisih luas permukaan antara kotak yang telah diperbesar dan kotak awal adalah 540 𝑐𝑚2.", "answer": "Salah", "explanation": "Langkah 1: Mengidentifikasi luas kedua wadah yang telah dihitung (𝐿1 = 864 𝑐𝑚2 dan 𝐿2 = 1944 𝑐𝑚2). Langkah 2: Hitung selisih mutlak yang sebenarnya sebesar 1944 −864 = 1080 𝑐𝑚2 (bukan 540 𝑐𝑚2 akibat salah mengurangkan)."}]}, {"number": 33, "level": 2, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Seorang pembuat roti memproduksi kue spons cokelat berbentuk balok berukuran 10 cm × 5 cm × 4 cm. Pembuat kue tersebut menerima pesanan ukuran pesta keluarga sebangun dengan seluruh dimensinya diperbesar sebanyak 2 kali dari cetakan awal. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai roti ukuran pesta ini!", "statements": [{"text": "Volume adonan padat roti pada porsi keluarga barunya adalah sebesar 400 cm 3.", "answer": "Salah", "explanation": "Langkah 1: Volume roti semula adalah 10 × 5 × 4 = 200 cm 3. Langkah 2: Peningkatan tiga dimensi mengikuti kuadrat volume baru sebesar 23 = 8 kali sehingga 200 × 8 = 1.600 cm 3. Nilai 400 cm 3 didapat akibat kekeliruan pengali secara langsung 200 × 2 (miskonsepsi satu dimensi ke volumetrik). Pernyataan salah."}, {"text": "Roti sajian keluarga porsi pesta tersebut memakan kapasitas ruangan cetakan sepadan 1.600 cm 3.", "answer": "Benar", "explanation": "Langkah 1: Volume loyang awal 𝑉= 10 × 5 × 4 = 200 cm 3 dengan skala peningkatan panjang sisi sebesar 2 kali lipat. Langkah 2: Multiplikasi volume dilakukan berpangkat kubik 200 × 23 = 1.600 cm 3. Pernyataan benar."}, {"text": "Sisi bawah atau luas penampang alas adonan membutuhkan alas saji meningkat hingga 4 kali alas semula.", "answer": "Benar", "explanation": "Langkah 1: Kebutuhan ukuran saji tatakan bidang dikategorikan variabel besaran dua dimensi luas. Langkah 2: Besar pengubahan bertambah sejalan faktor pangkat kuadrat semula yaitu 𝑘2 = 22 = 4. Pernyataan benar."}, {"text": "Rasio nilai perbandingan kulit luar roti ukuran keluarga dibanding roti semula bernilai sebesar 2: 1.", "answer": "Salah", "explanation": "Langkah 1: Kulit luasan permukaan dikategorikan kedalam korelasi besaran berskala dua dimensi luas. Langkah 2: Perbandingan anyaman atas sisi loyang baru terhadap lama bernilai kuadrat aslinya 22: 1 = 4: 1, bukan bernilai linier biasa 2: 1. Pernyataan salah."}]}, {"number": 34, "level": 3, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah UMKM di Jogja membuat kerajinan tempat pensil berbentuk kubus kuningan dengan panjang rusuk 10 𝑐𝑚. Jika tempat pensil tersebut diproduksi secara massal dalam bentuk model ukuran mini dengan memperkecil rusuknya menggunakan faktor skala 2 5, serta dibuat model ukuran raksasa untuk pajangan dengan memperbesar panjang rusuk menggunakan faktor skala 3 2. Beri tanda centang (✓) pada setiap pernyataan yang benar berdasarkan informasi tersebut!", "statements": [{"text": "Perbandingan volume tempat pensil tipe mini dengan tipe raksasa adalah 64: 3375.", "answer": "Benar", "explanation": "Langkah 1: Menentukan rasio rusuk mini terhadap raksasa, yaitu 𝑟𝑚𝑖𝑛𝑖: 𝑟𝑟𝑎𝑘𝑠𝑎𝑠𝑎= (10 × 2 5): (10 × 3 2) = 4: 15. Langkah 2: Menentukan perbandingan volume dengan mempangkatkan tiga rasio dimensi rusuk tersebut, (4: 15)3 = 64: 3375. Langkah 3: Memastikan kevalidan rasio tersebut. Pernyataan BENAR."}, {"text": "Selisih luas permukaan tempat pensil raksasa dengan luas permukaan tempat pensil semula adalah 750 𝑐𝑚2.", "answer": "Benar", "explanation": "Langkah 1: Menghitung luas permukaan awal 𝐿𝑎𝑤𝑎𝑙= 6 × 102 = 600 𝑐𝑚2. Langkah 2: Luas raksasa dihitung menggunakan faktor skala kuadrat 𝐿𝑟𝑎𝑘𝑠𝑎𝑠𝑎= ( 3 2)2 × 𝐿𝑎𝑤𝑎𝑙= 2,25 × 600 = 1350 𝑐𝑚2. Langkah 3: Cari selisihnya, yaitu 1350 −600 = 750 𝑐𝑚2. Pernyataan BENAR."}, {"text": "Volume tempat pensil tipe mini setelah diperkecil adalah 40 𝑐𝑚3.", "answer": "Salah", "explanation": "Langkah 1: Tentukan panjang rusuk mini 𝑟= 10 × 2 5 = 4 𝑐𝑚. Langkah 2: Hitung volume mini, yaitu 𝑉𝑚𝑖𝑛𝑖= 43 = 64 𝑐𝑚3. Langkah 3: Mengonfirmasi nilai pernyataan, angka 40 𝑐𝑚3 didapat dari salah rumus perkalian volume biasa dengan skala (1000 × 2 5). Pernyataan SALAH."}, {"text": "Luas permukaan tempat pensil tipe mini setelah diperkecil menjadi 4 25 kali dari semula, yaitu senilai 96 𝑐𝑚2.", "answer": "Benar", "explanation": "Langkah 1: Menghitung faktor skala perubahan luas permukaan 𝑘2 = ( 2 5)2 = 4 25. Langkah 2: Menghitung luas permukaan mini 𝐿= 4 25 × 600 𝑐𝑚2 = 4 × 24 = 96 𝑐𝑚2. Langkah 3: Memastikan keselarasan kesimpulan matematis. Pernyataan BENAR."}]}, {"number": 35, "level": 3, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Tatakan tempat pajangan lilin adat yang terbuat dari bahan kuningan tuang kuno berstruktur rupa kubus padat terpajang di etalase museum wilayah Kota Solo dengan berbekal luas permukaan terluar 600 𝑐𝑚2. Keperluan pameran pusaka nasional memicu pengerjaan model lilin baru sejenis dengan melebihkan rusuk tatakan besi hingga ukuran skalanya 2,5 kali panjang wadah asli kuno. Tentukan benar atau salah dalam mengevaluasi hasil pengukuran yang dialami kuningan pajangan baru ini!", "statements": [{"text": "Ukuran rusuk dari pajangan tempat lilin adat asli buatan tempo lampau adalah berukuran 10 𝑐𝑚.", "answer": "Benar", "explanation": "Langkah 1: Rumus daerah permukaan lengkap tugu kubus dihitung 6 × 𝑠2 = 𝐿𝑎𝑤𝑎𝑙. Langkah 2: Substitusikan ukuran permukaan tertera: 6 × 𝑠2 = 600 ⇒𝑠2 = 100 ⇒𝑠= 10 𝑐𝑚. Langkah 3: Evaluasi kebenaran klaim ini. Maka pernyataan bernilai BENAR."}, {"text": "Total seluruh luas permukaan pelat terluar kuningan lilin versi anyar pasca-perubahan perbesaran rusuk mencapai ukuran 1.500 𝑐𝑚2.", "answer": "Salah", "explanation": "Langkah 1: Pengubah daerah bidang luar mengikuti rumus transformasi kuadrat: 𝐿𝑏𝑎𝑟𝑢= 𝑘2 × 𝐿𝑎𝑤𝑎𝑙. Langkah 2: Diketahui faktor perbesaran linear adalah 𝑘= 2,5. Luas baru yang terbentuk = (2,5)2 × 600 = 6,25 × 600 = 3.750 𝑐𝑚2. Langkah 3: Buktikan bahwa nilai 1.500 di pilihan merupakan miskonsepsi akibat mengalikan secara linier langsung 600 × 2,5. Maka pernyataan bernilai SALAH."}, {"text": "Daya isi internal beton padat kuningan kuno pembentuk tatakan pajangan lilin baru tersebut memiliki volume akhir senilai 15.625 𝑐𝑚3.", "answer": "Benar", "explanation": "Langkah 1: Identifikasi panjang sisi aslinya kubus yaitu = 10 𝑐𝑚, maka panjang sisi replika yang baru diperbesar = 10 × 2,5 = 25 𝑐𝑚. Langkah 2: Hitung daya muat internal model = (25)3 = 15.625 𝑐𝑚3 (atau dari properti volume sebangun: 𝑉= 103 × (2,5)3 = 1000 × 15,625 = 15.625 𝑐𝑚3). Maka pernyataan bernilai BENAR."}, {"text": "Luas seluruh permukaan logam pembentuk pajangan tumpuan model anyar jika dilapisi kuningan setelah pelebaran rampung bernilai 3.750 𝑐𝑚2.", "answer": "Benar", "explanation": "Langkah 1: Pahami prinsip perubahan bidang bersesuaian sebangun mengikuti rasio kuadrat 𝑘2. Langkah 2: Luas total kulit logam anyar diringkas melalui perhitungan matematika = 2, 52 × 600 = 6,25 × 600 = 3.750 𝑐𝑚2. Langkah 3: Selaraskan. Maka pernyataan bernilai BENAR."}]}, {"number": 36, "level": 3, "type": "Analisis Pernyataan", "objective": "Menjelaskan pengaruh perubahan skala bangun ruang sisi datar terhadap ukuran panjang, luas, dan/atau volume.", "question": "Sebuah kios buah di Malang menjual parsel dari anyaman kayu berbentuk balok tertutup berukuran 20 𝑐𝑚× 15 𝑐𝑚× 10 𝑐𝑚. Rencana perluasan dimensi diajukan produsen wadah parsel: Parsel A dibuat dengan luas alas melebar dengan skala panjang rusuk 2 kali dari bentuk dasar (tinggi konstan 10 𝑐𝑚), sedangkan Parsel B diperbesar semua komponen panjangnya secara seragam sebesar faktor skala 𝑘= 1,5. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan dengan perbandingan struktur kedua anyaman baru tersebut!", "statements": [{"text": "Total daya muat muatan wadah B yang telah diperbesar dimensi lurusnya menggunakan skala 1,5 adalah bernilai 10,125 𝑙𝑖𝑡𝑒𝑟.", "answer": "Benar", "explanation": "Volume asal balok wadah anyaman = 20 × 15 × 10 = 3.000 𝑐𝑚3 = 3 𝑙𝑖𝑡𝑒𝑟. Dengan penskalaan seragam berskala 1,5 seluruh dimensinya, volume wadah B menjadi 1, 53 × 3.000 = 3,375 × 3.000 = 10.125 𝑐𝑚3 = 10,125 𝑙𝑖𝑡𝑒𝑟. Pernyataan benar."}, {"text": "Bahan lembaran kayu pembentuk permukaan penutup anyaman untuk model Parsel A (2.300 𝑐𝑚2) secara teoritis bernilai sama persis dengan luas kayu milik Parsel B.", "answer": "Salah", "explanation": "Model anyaman aslinya memiliki Luas Permukaan = 2 × (300 + 150 + 200) = 1.300 𝑐𝑚2. Parsel A (40 × 15 × 10) memiliki luas permukaan 2 × (600 + 150 + 400) = 2.300 𝑐𝑚2. Parsel B (uniform 𝑘= 1,5) luas penampang permukaannya 1, 52 × 1.300 = 2,25 × 1.300 = 2.925 𝑐𝑚2. Keduanya tidak memiliki nilai yang sama. Pernyataan salah."}, {"text": "Rancangan wadah Parsel B secara fisis memiliki kelemahan ruang karena volume baru yang dihimpun hanya sebatas dua kali lipat wadah awal akibat faktor 𝑘= 1,5.", "answer": "Salah", "explanation": "Merupakan miskonsepsi pertumbuhan volume di mana volumetrik sering disalahartikan berkembang mengikuti nilai multiplikatif kelipatan konstannya. Sebenarnya 1, 53 = 3,375 kali dari model lama, bukan hanya dua kali lipat. Pernyataan salah."}, {"text": "Kenaikan dari bahan pelat tipis anyaman bambu penutup eksternal pada wadah Parsel B dibanding wadah dasarnya adalah sebesar 1.625 𝑐𝑚2.", "answer": "Benar", "explanation": "Besar nilai peningkatan anyamannya diukur dari selisih luas wadah baru Parsel B terhadap ukuran semula: 2.925 −1.300 = 1.625 𝑐𝑚2. Pernyataan benar."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
