<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Busur, Sudut, dan Juring Lingkaran</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT BUSUR, SUDUT, DAN JURING LINGKARAN</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 30</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>

 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>

</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">

 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Di sebuah wahana bianglala berbentuk lingkaran, dua buah kursi bersebelahan membentuk sudut \npusat 45∘. Bagian busur lingkaran yang terbentuk di antara kedua kursi tersebut adalah .... bagian \ndari keliling lingkaran seluruhnya.","options":[{"key":"A","text":"1 12"},{"key":"B","text":"1 10"},{"key":"C","text":"1 8"},{"key":"D","text":"1 6"}],"answer":"C","explanation":"Langkah 1: Bandingkan besar sudut pusat juring dengan sudut lingkaran penuh yaitu 360∘. \nLangkah 2: Hitung nilai perbandingannya yaitu \n45∘\n360∘=\n1\n8. \nJawaban Benar: C"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Dalam unsur-unsur lingkaran, bagian dari keliling lingkaran yang berupa garis lengkung dan \nmenghubungkan dua titik pada lingkaran disebut dengan ….","options":[{"key":"A","text":"apotema"},{"key":"B","text":"busur"},{"key":"C","text":"juring"},{"key":"D","text":"tembereng"}],"answer":"B","explanation":"Definisi unsur-unsur lingkaran: \n1. Busur adalah garis lengkung yang terletak pada keliling lingkaran dan menghubungkan dua \ntitik sembarang pada lengkungan tersebut. \n2. Juring adalah daerah di dalam lingkaran yang dibatasi oleh dua jari-jari dan sebuah busur. \n3. Tembereng adalah daerah di dalam lingkaran yang dibatasi oleh busur dan tali busur. \n4. Apotema adalah garis terpendek dari titik pusat ke tali busur. \nBerdasarkan definisi di atas, bagian dari keliling lingkaran yang berupa garis lengkung adalah \nbusur. \nJawaban Benar: B"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah juring lingkaran memiliki luas sebesar 30 cm². Jika luas keseluruhan lingkaran tersebut \nadalah 120 cm², maka besar sudut pusat juring tersebut adalah ….","options":[{"key":"A","text":"90∘"},{"key":"B","text":"120∘"},{"key":"C","text":"180∘"},{"key":"D","text":"270∘"}],"answer":"A","explanation":"Hubungan antara luas juring (𝐿𝑗), luas lingkaran (𝐿), dan sudut pusat (𝜃) adalah 𝐿𝑗=\n𝜃\n360∘× 𝐿. \nRumus untuk mencari sudut pusat adalah 𝜃=\n𝐿𝑗\n𝐿× 360∘. \nSubstitusikan nilai luas juring 𝐿𝑗= 30 cm² dan luas lingkaran 𝐿= 120 cm²: \n𝜃= 30\n120 × 360∘ \n𝜃=\n1\n4 × 360∘= 90∘. \nJawaban Benar: A"},{"number":4,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah papan target berbentuk lingkaran memiliki luas 300 𝑐𝑚2. Berapakah luas juring dari \npapan target tersebut yang dibatasi oleh sudut pusat 36∘?","options":[{"key":"A","text":"10 𝑐𝑚2."},{"key":"B","text":"30 𝑐𝑚2."},{"key":"C","text":"50 𝑐𝑚2."},{"key":"D","text":"60 𝑐𝑚2."}],"answer":"B","explanation":"Luas juring lingkaran ditentukan oleh rumus: 𝐿𝑗=\n𝜃\n360∘× 𝐿. \nSubstitusikan nilai 𝜃= 36∘ dan 𝐿= 300 𝑐𝑚2. \nHitung hasilnya: 𝐿𝑗=\n36∘\n360∘× 300 =\n1\n10 × 300 = 30 𝑐𝑚2. \nJawaban Benar: B"},{"number":5,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Seorang anak berlari menyusuri sebagian pinggir lapangan yang berbentuk lingkaran sepanjang \n10 meter. Jika ia telah menempuh sudut pusat sebesar 10∘, maka panjang lintasan satu putaran \npenuh lapangan tersebut adalah ....","options":[{"key":"A","text":"10 meter"},{"key":"B","text":"100 meter"},{"key":"C","text":"180 meter"},{"key":"D","text":"360 meter"}],"answer":"D","explanation":"Langkah 1: Pahami bahwa satu putaran penuh setara dengan sudut pusat 360∘. \nLangkah 2: Hitung keliling lapangan dengan perbandingan: 𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔=\n360∘\n10∘× 10 = 360 meter. \nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah kipas lipat tradisional berbentuk setengah lingkaran memiliki jari-jari 30 cm. Kipas \ntersebut dilapisi kain hias hanya pada bagian luar dengan lebar 15 cm (sehingga bagian dalam \ndengan jari-jari 15 cm tidak tertutup kain). Jika kipas dibuka hingga membentuk sudut pusat 120∘, \nberapakah luas kain hias yang menutupi kipas tersebut? (Gunakan 𝜋= 3,14).","options":[{"key":"A","text":"235,5 cm²"},{"key":"B","text":"706,5 cm²"},{"key":"C","text":"942,0 cm²"},{"key":"D","text":"1177,5 cm²"}],"answer":"B","explanation":"Langkah 1: Hitung luas juring besar dengan jari-jari 𝑅= 30 cm dan sudut pusat 120∘: 𝐿1 =\n120°\n360°× 3,14 × 30 × 30 =\n1\n3 × 2826 = 942 cm². \nLangkah 2: Hitung luas juring kecil bagian dalam dengan jari-jari 𝑟= 15 cm: 𝐿2 =\n120°\n360°× 3,14 × 15 × 15 =\n1\n3 × 706,5 = 235,5 cm². Luas kain hias adalah selisih kedua juring: 942 −\n235,5 = 706,5 cm². \nJawaban Benar: B"},{"number":7,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah taman keluarga berbentuk lingkaran memiliki jari-jari sepanjang 21 meter. Sebagian area \ntaman tersebut yang membentuk sudut pusat 120∘ akan dibangun gazebo kayu, sedangkan \nsisanya akan ditanami rumput gajah mini. Berapakah luas area taman yang ditanami rumput \ngajah mini tersebut? (Gunakan 𝜋=\n22\n7 )","options":[{"key":"A","text":"231 meter 2"},{"key":"B","text":"462 meter 2"},{"key":"C","text":"693 meter 2"},{"key":"D","text":"924 meter 2"}],"answer":"D","explanation":"Langkah 1: Menentukan besar sudut pusat bagian taman yang ditanami rumput gajah mini: \n𝜃𝑟𝑢𝑚𝑝𝑢𝑡= 360∘−120∘= 240∘. \nLangkah 2: Menghitung luas juring area rumput tersebut dengan rumus luas juring: 𝐿=\n𝜃𝑟𝑢𝑚𝑝𝑢𝑡\n360∘\n× 𝜋𝑟2. \nLangkah 3: Memasukkan nilai dan melakukan kalkulasi: 𝐿=\n240∘\n360∘×\n22\n7 × 21 × 21 =\n2\n3 × 1386 = 924 \nmeter\n2. \nJawaban Benar: D"},{"number":8,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Seekor kambing diikat di sudut sebuah kandang berbentuk persegi dengan panjang tali 7 meter, \nsehingga kambing dapat memakan rumput di luar kandang dengan area berbentuk juring \nlingkaran bersudut pusat 90∘. Jika tali kambing tersebut diperpanjang menjadi 14 meter, \nberapakah pertambahan luas area rumput yang dapat dijangkau oleh kambing tersebut?","options":[{"key":"A","text":"154,0 m²"},{"key":"B","text":"115,5 m²"},{"key":"C","text":"77,0 m²"},{"key":"D","text":"38,5 m²"}],"answer":"B","explanation":"Langkah 1: Hitung luas area awal dengan panjang tali 7 meter. Luas awal =\n90∘\n360∘×\n22\n7 × 72 =\n1\n4 × 154 = 38,5 m². \nLangkah 2: Hitung luas area baru dengan panjang tali 14 meter. Luas baru =\n90∘\n360∘×\n22\n7 × 142 =\n1\n4 × 616 = 154 m². \nLangkah 3: Hitung pertambahan luas area. Pertambahan = 154 −38,5 = 115,5 m². \nJawaban Benar: B"},{"number":9,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah piring hias berbentuk lingkaran memiliki sebuah juring dengan luas sebesar 154 cm\n2. \nJika sudut pusat juring tersebut adalah 90∘, berapakah panjang jari-jari piring hias tersebut?","options":[{"key":"A","text":"7 cm"},{"key":"B","text":"14 cm"},{"key":"C","text":"28 cm"},{"key":"D","text":"49 cm"}],"answer":"B","explanation":"Langkah 1: Tentukan luas total piring hias. Karena juring dengan sudut 90∘ mewakili \n90∘\n360∘=\n1\n4 dari \nlingkaran, maka luas total lingkaran adalah 𝐿𝑡𝑜𝑡𝑎𝑙= 154 × 4 = 616 cm\n2. \nLangkah 2: Cari jari-jari dari luas total menggunakan rumus 𝐿𝑡𝑜𝑡𝑎𝑙= 𝜋× 𝑟2. Diperoleh 616 =\n22\n7 × 𝑟2 ⟹ 𝑟2 = 616 ×\n7\n22 = 196 ⟹ 𝑟= √196 = 14 cm. \nJawaban Benar: B"},{"number":10,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Alat penyiram taman otomatis memancarkan air secara memutar dengan jangkauan pancaran \nmaksimum sebesar 14 meter dan membentuk sudut putaran sebesar 135∘. Berapakah luas area \ntaman yang terkena siraman air dari alat tersebut jika dihitung menggunakan 𝜋=\n22\n7 ?","options":[{"key":"A","text":"77 m²"},{"key":"B","text":"154 m²"},{"key":"C","text":"231 m²"},{"key":"D","text":"308 m²"}],"answer":"C","explanation":"Langkah 1: Tentukan pecahan sudut jangkauan pancaran air terhadap satu lingkaran penuh: \n135∘\n360∘=\n3\n8. \nLangkah 2: Hitung luas area siraman berbentuk juring dengan radius 𝑟= 14 meter: 𝐿=\n3\n8 × 𝜋× 𝑟2 =\n3\n8 ×\n22\n7 × 14 × 14 = 231 m². \nJawaban Benar: C"},{"number":11,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah panggung pertunjukan di Bali dirancang dengan bentuk juring lingkaran berdiameter 28 \nmeter dan sudut pusat 60∘. Karena kebutuhan koreografi baru, panitia ingin mengubah desain \npanggung tersebut dengan memperbesar sudut pusatnya menjadi dua kali lipat, namun \nmemperkecil panjang diameter panggung menjadi setengah dari ukuran semula. Bagaimanakah \nperbandingan luas panggung yang baru terhadap luas panggung yang lama?","options":[{"key":"A","text":"Luas setelah renovasi menjadi 1/4 kali luas semula."},{"key":"B","text":"Luas setelah renovasi menjadi 1/3 kali luas semula."},{"key":"C","text":"Luas setelah renovasi menjadi 1/2 kali luas semula."},{"key":"D","text":"Luas setelah renovasi tetap sama dengan luas semula."}],"answer":"C","explanation":"Langkah 1: Luas panggung mula-mula (𝐿1) dengan jari-jari 𝑟1 dan sudut pusat 𝜃1 adalah 𝐿1 =\n𝜃1\n360∘× 𝜋𝑟1\n2. \nLangkah 2: Perubahan parameter panggung yang baru: 𝜃2 = 2𝜃1 dan 𝑟2 = 0,5𝑟1. \nLangkah 3: Hitung luas panggung baru (𝐿2): 𝐿2 =\n2𝜃1\n360∘× 𝜋(0,5𝑟1)2 =\n2𝜃1\n360∘× 𝜋× 0,25𝑟1\n2 = 0,5 × 𝐿1. \nLangkah 4: Sehingga luas panggung baru menjadi setengah (1/2) dari luas panggung semula. \nJawaban Benar: C"},{"number":12,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah roda sepeda hias di Yogyakarta memiliki jari-jari 35 cm. Pada roda tersebut dipasang \njeruji-jeruji logam yang membagi roda menjadi beberapa juring yang sama besar. Diketahui jarak \nantar ujung jeruji pada ban sepeda (panjang busur juring) adalah 22 cm. Jika pemilik sepeda \ningin memasang lampu hias LED di setiap daerah juring roda tersebut dengan biaya Rp15.000,00 \nper juring, berapakah total biaya yang harus dikeluarkan? (Gunakan 𝜋=\n22\n7 ).","options":[{"key":"A","text":"Rp75.000,00"},{"key":"B","text":"Rp110.000,00"},{"key":"C","text":"Rp150.000,00"},{"key":"D","text":"Rp220.000,00"}],"answer":"C","explanation":"Langkah 1: Menghitung keliling roda sepeda. Keliling = 2 × 𝜋× 𝑟= 2 ×\n22\n7 × 35 = 220 cm. \nLangkah 2: Menentukan banyaknya juring yang terbentuk pada roda sepeda. Banyak Juring =\n𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔 𝑅𝑜𝑑𝑎\n𝑃𝑎𝑛𝑗𝑎𝑛𝑔 𝐵𝑢𝑠𝑢𝑟 𝐽𝑢𝑟𝑖𝑛𝑔=\n220\n22 = 10 juring. \nLangkah 3: Menghitung total biaya pemasangan lampu LED pada semua juring. Total Biaya =\n10 × 𝑅𝑝15.000,00 = 𝑅𝑝150.000,00. \nJawaban Benar: C."},{"number":13,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah taman bermain anak di Sleman berbentuk juring lingkaran dengan sudut pusat 60∘. \nPengelola taman ingin memagari sekeliling batas taman tersebut (termasuk busur lingkaran dan \nkedua jari-jarinya) menggunakan kawat berduri sebanyak 3 putaran. Jika luas taman tersebut \nadalah 231 meter persegi, berapakah panjang minimal kawat berduri yang harus disediakan? \n(Gunakan 𝜋≈\n22\n7 ).","options":[{"key":"A","text":"66 meter."},{"key":"B","text":"129 meter."},{"key":"C","text":"154 meter."},{"key":"D","text":"192 meter."}],"answer":"D","explanation":"Langkah 1: Cari jari-jari taman (𝑟) menggunakan rumus luas juring: 231 =\n60∘\n360∘×\n22\n7 × 𝑟2 ⟹ 𝑟2 =\n231 × 6 ×\n7\n22 = 441 ⟹ 𝑟= 21 meter. \nLangkah 2: Cari panjang busur taman (𝑠): 𝑠=\n60∘\n360∘× 2 ×\n22\n7 × 21 = 22 meter. \nLangkah 3: Hitung keliling juring taman (𝐾): 𝐾= 𝑠+ 2𝑟= 22 + 2(21) = 64 meter. \nLangkah 4: Hitung panjang total kawat untuk 3 putaran: 𝐾𝑎𝑤𝑎𝑡= 3 × 64 = 192 meter. \nJawaban Benar: D"},{"number":14,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Di dalam suatu lingkaran dengan titik pusat O, terdapat juring POQ dengan sudut pusat 60∘ dan \nluas 231 cm\n2. Pada lingkaran yang sama, terdapat juring ROS dengan sudut pusat 120∘. \nBerapakah panjang busur RS?","options":[{"key":"A","text":"22 cm"},{"key":"B","text":"44 cm"},{"key":"C","text":"66 cm"},{"key":"D","text":"88 cm"}],"answer":"B","explanation":"Gunakan luas juring POQ untuk mencari jari-jari lingkaran (𝑟): 𝐿𝑢𝑎𝑠 𝑃𝑂𝑄=\n60∘\n360∘× 𝜋× 𝑟2 ⇒231 =\n1\n6 ×\n22\n7 × 𝑟2. \nSederhanakan persamaan untuk menentukan nilai 𝑟: 231 =\n11\n21 𝑟2 ⇒𝑟2 = 231 ×\n21\n11 = 441 ⇒𝑟= 21 \ncm. \nHitung panjang busur RS menggunakan sudut pusat 120∘ dan jari-jari 21 cm: \n𝑃𝑎𝑛𝑗𝑎𝑛𝑔 𝐵𝑢𝑠𝑢𝑟 𝑅𝑆=\n120∘\n360∘× 2 × 𝜋× 𝑟=\n1\n3 × 2 ×\n22\n7 × 21 = 44 cm. \nJawaban Benar: B"},{"number":15,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah kue bolu berbentuk lingkaran dengan jari-jari 20 cm dipotong menjadi beberapa bagian \nyang sama besar. Jika panjang busur dari satu potongan kue tersebut adalah 12,56 cm dan \nsebanyak 3 potong kue telah dimakan, berapakah luas dari sisa kue bolu tersebut?","options":[{"key":"A","text":"376,8 cm 2"},{"key":"B","text":"628,0 cm 2"},{"key":"C","text":"879,2 cm 2"},{"key":"D","text":"1.256,0 cm 2"}],"answer":"C","explanation":"Hitung keliling total dari seluruh lingkaran kue bolu: 𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔= 2 × 𝜋× 𝑟= 2 × 3,14 × 20 = 125,6 \ncm. \nTentukan jumlah seluruh potongan kue yang dibuat: 𝐽𝑢𝑚𝑙𝑎ℎ 𝑃𝑜𝑡𝑜𝑛𝑔𝑎𝑛=\n125,6\n12,56 = 10 bagian. \nSisa kue bolu setelah dimakan 3 bagian adalah 10 −3 = 7 bagian, yang mewakili \n7\n10 dari seluruh \nkue. \nHitung luas total kue bolu: 𝐿𝑢𝑎𝑠 𝑇𝑜𝑡𝑎𝑙= 𝜋× 𝑟2 = 3,14 × 202 = 1.256 cm\n2. \nHitung luas sisa kue bolu: 𝐿𝑢𝑎𝑠 𝑆𝑖𝑠𝑎=\n7\n10 × 1.256 = 879,2 cm\n2. \nJawaban Benar: C"},{"number":16,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Pengelola kebun buah berencana membongkar satu petak lahan bunga agar beralih bentuk \nsetengah lingkaran utuh yang memiliki diameter selebar 28 meter. Beri tanda centang (✓) pada \nsetiap pernyataan yang benar berkaitan dengan struktur batas serta bentuk geometri petak \nsetengah lingkaran kebun baru tersebut! (Gunakan nilai 𝜋=\n22\n7 ).","statements":[{"text":"Satu daerah kebun bermodel setengah lingkaran penuh tersebut memiliki besaran nilai sudut \npusat sektor setara dengan 180∘.","answer":"Benar","explanation":"Setengah putaran utuh sudut pusat dari sebuah satu keliling lingkaran yang besarnya 360∘ \nadalah tepat 180∘."},{"text":"Panjang bagian pagar pembatas melengkung luar daerah kebun setengah lingkaran yang \ndipesan sepanjang 88 meter.","answer":"Salah","explanation":"Pernyataan salah. Panjang lengkungan kawat busurnya hanya sepanjang setengah dari keliling \nutuhnya yaitu: \n1\n2 × (2 ×\n22\n7 × 14) = 44 meter."},{"text":"Kandungan nilai dari total luas sebidang tanah pertanian model juring setengah lingkaran \nkebun ini memiliki area seukuran 308 m\n2.","answer":"Benar","explanation":"Luas Juring = \n180∘\n360∘× 𝜋𝑟2 =\n1\n2 ×\n22\n7 × 142 = 308 m\n2."},{"text":"Total panjang pengerjaan tiang keliling luar keseluruhan penutup taman jika dilalui seutas \nkabel melengkung serta diameter horizontal yang melintang bernilai sepanjang 72 meter.","answer":"Benar","explanation":"Total Keliling Pembatas = Panjang kawat lengkung luar + lebar diameter dasar taman lurus = 44 \nmeter + 28 meter = 72 meter."}]},{"number":17,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah taman bermain memiliki area berbentuk lingkaran dengan titik pusat O. Dua buah tiang \npembatas diletakkan di titik A dan B pada keliling taman sehingga membentuk sudut pusat \n∠𝐴𝑂𝐵= 90∘. Diketahui panjang jari-jari area taman tersebut adalah 7 m. Tentukan benar atau \nsalah untuk setiap pernyataan berikut berkaitan dengan panjang busur taman tersebut! (Gunakan \nnilai 𝜋=\n22\n7 ).","statements":[{"text":"Besar sudut pusat ∠𝐴𝑂𝐵= 90∘ pada juring tersebut setara dengan setengah dari keliling \nseluruh lingkaran.","answer":"Salah","explanation":"Besar bagian dari keliling juring adalah \n90∘\n360∘=\n1\n4 bagian dari keliling seluruh lingkaran, bukan \nsetengah."},{"text":"Formula atau rumus yang tepat untuk menghitung panjang busur atau pembatas melengkung \nAB tersebut adalah \n∠𝐴𝑂𝐵\n360∘× 2𝜋𝑟.","answer":"Benar","explanation":"Panjang busur dihitung menggunakan rumus perbandingan proporsional sudut pusat dikalikan \ndengan rumus keliling lingkaran secara penuh."},{"text":"Panjang lengkungan jalan pembatas atau busur AB di antara tiang pembatas taman tersebut \nadalah sepanjang 11 m.","answer":"Benar","explanation":"Menghitung secara langsung: Panjang Busur = \n90\n360 × 2 ×\n22\n7 × 7 =\n1\n4 × 44 = 11 m."},{"text":"Keliling dari seluruh taman bermain berbentuk lingkaran penuh tersebut bernilai sebesar 22 m.","answer":"Salah","explanation":"Keliling seluruh taman bermain adalah 2𝜋𝑟= 2 ×\n22\n7 × 7 = 44 m, bukan 22 m."}]},{"number":18,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah payung pantai raksasa berbentuk lingkaran utuh yang memiliki jari-jari sebesar 28 cm \ndibedakan atas sektor-sektor bergradasi warna masing-masing bersudut pusat 45∘. Beri tanda \ncentang (✓) pada setiap pernyataan yang benar mengenai keliling dan dimensi luas sektor dari \npayung pantai tersebut jika nilai 𝜋=\n22\n7 !","statements":[{"text":"Panjang busur pada tepi setiap sektor dengan sudut pusat 45∘ adalah 44 cm.","answer":"Salah","explanation":"Panjang busur dihitung sebagai \n45\n360 × 2 ×\n22\n7 × 28 =\n1\n8 × 176 = 22 cm, bukan 44 cm."},{"text":"Luas juring dari salah satu sektor payung tersebut yang memiliki sudut 45∘ adalah 308 cm².","answer":"Benar","explanation":"Luas juring = \n45\n360 ×\n22\n7 × 28 × 28 =\n1\n8 × 2464 = 308 cm²."},{"text":"Keliling seluruh tepian payung yang membentuk satu lingkaran penuh adalah 176 cm.","answer":"Benar","explanation":"Keliling total lingkaran dengan 𝑟= 28 cm adalah 2𝜋𝑟= 2 ×\n22\n7 × 28 = 176 cm."},{"text":"Panjang busur pada salah satu sektor yang bersudut pusat 45∘ adalah 22 cm.","answer":"Benar","explanation":"Panjang busurnya adalah \n45\n360 × 2𝜋𝑟=\n1\n8 × 176 = 22 cm."}]},{"number":19,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Diketahui panjang sebuah busur lingkaran adalah 11 cm dan keliling dari lingkaran tersebut \nadalah 44 cm. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Rasio panjang busur terhadap keliling lingkaran utuh adalah \n1\n3.","answer":"Salah","explanation":"Rasio busur terhadap keliling utuh adalah 11/44 =\n1\n4."},{"text":"Sudut pusat yang terbentuk oleh busur lingkaran tersebut adalah 90∘.","answer":"Benar","explanation":"Sudut pusat diperoleh dengan \n11\n44 × 360∘= 90∘."},{"text":"Jari-jari lingkaran tersebut adalah 7 cm jika ditentukan nilai 𝜋=\n22\n7 .","answer":"Benar","explanation":"Menggunakan rumus keliling: 2 ×\n22\n7 × 𝑟= 44 ⟹ \n44\n7 × 𝑟= 44 ⟹ 𝑟= 7 cm."},{"text":"Setengah keliling lingkaran tersebut nilainya adalah 22 cm.","answer":"Benar","explanation":"Setengah dari keliling lingkaran utuh (44 cm) adalah 22 cm."}]},{"number":20,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Seorang pekerja membuat struktur kayu berbentuk potongan juring kecil bersudut lancip 30∘. \nStruktur kayu lingkar yang terbentuk didasarkan pada patokan garis radius terjangkau sejauh 7 \ncm menggunakan penilai konstanta rasio 𝜋=\n22\n7 . Beri tanda centang (✓) pada setiap pernyataan \nyang benar!","statements":[{"text":"Perbandingan besarnya batas juring melingkar ini jika dibentuk ke nilai utuh lingkaran \nmempunyai harga setara dengan bagian pecahan \n1\n12 lingkaran.","answer":"Benar","explanation":"Rasio dicari dari perbandingan sudut terhadap satu putaran penuh: \n30∘\n360∘=\n1\n12."},{"text":"Besarnya total sekeliling garis pinggir lingkaran luar jika dalam ukuran lingkaran penuh hias \ntersebut mempunyai ukuran keliling 44 cm.","answer":"Benar","explanation":"Keliling keseluruhan bernilai sama dengan 𝐾= 2𝜋𝑟= 2 ×\n22\n7 × 7 = 44 cm."},{"text":"Panjang bagian lekuk dari tepian melengkung busur bundaran kayu berporsi lancip sudut ini \nberkisar sepanjang 3,67 cm jika dibulatkan dekat dalam skala dua angka di belakang tanda \ndesimal.","answer":"Benar","explanation":"Panjang lekukan didapatkan dengan nilai operasi hitung: \n1\n12 × 44 cm = 3,67 cm."},{"text":"Panjang busur kayu untuk lintasan batas potong hias bagian kecil melengkung ini diukur \nsebesar 7,33 cm.","answer":"Salah","explanation":"Panjang busurnya didasarkan dari hitungan sekeliling sebesar \n1\n12 kali total 44 cm, yang berarti \nbernilai sepanjang 3,67 cm, bukan sepanjang 7,33 cm."}]},{"number":21,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Untuk membuat gantungan pakaian melingkar praktis, kawat tebal dibentuk menyerupai sektor \njuring kawat melingkar penuh dengan panjang jari-jari gantungan kawat adalah 35 cm dan bagian \nsudut bentangan jemur berjarak pusat 72∘. Serta memaketkan nilai rasio keliling 𝜋≈\n22\n7 . Tentukan \nbenar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Ukuran kawat bentangan yang menyusun lengkungan luar busur pada jemuran ber-sudut \ntersebut adalah 44 cm.","answer":"Benar","explanation":"Langkah 1: Menghitung keliling utuh alat lingkaran kawat 𝐶= 2 ×\n22\n7 × 35 = 220 cm. Langkah 2: \nMenghitung bentangan busur juring =\n72∘\n360∘× 220 =\n1\n5 × 220 = 44 cm."},{"text":"Luas juring ruangan di dalam daerah piringan lingkaran jemuran yang tidak digunakan di luar \nkawat gantungan berpaut juring adalah 770 cm\n2.","answer":"Salah","explanation":"Langkah 1: Menghitung total luas seluruh piringan kawat hias =\n22\n7 × 352 = 3850 cm\n2 dan area \njuring adalah 770 cm\n2. Langkah 2: Sisa arealnya = 3850 −770 = 3080 cm\n2, bukan 770 \ncm\n2."},{"text":"Luas porsi pelat gantungan plastik berisikan permukaan dalam wilayah juring jemuran tersebut \nadalah 770 cm\n2.","answer":"Benar","explanation":"Langkah 1: Mengidentifikasi total luas bidang lingkaran penuh sebesar 3850 cm\n2. Langkah 2: \nMengalikan dengan rasio sudut juring gantungannya \n1\n5 × 3850 = 770 cm\n2."},{"text":"Bila sudut gantungan juring dipersempit secara proporsional menjadi sepertiga bagian (24∘) di \nmana dimensi luar lain tetap, sisa wilayah luasan daerah jemuran baru menciut menjadi 256,67 \ncm\n2.","answer":"Benar","explanation":"Langkah 1: Membagi sudut area menjadi sepertiganya. Langkah 2: Hasil pembagian luasan luas \njuring baru =\n1\n3 × 770 = 256,67 cm\n2."}]},{"number":22,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Pada selembar kertas karton, dibuat kipas berbentuk juring lingkaran dengan diameter 28 cm dan \nsudut pusat sebesar 135∘ (gunakan 𝜋=\n22\n7 ). Beri tanda centang (✓) pada setiap pernyataan yang \nbenar!","statements":[{"text":"Panjang kawat minimum yang dibutuhkan untuk menelusuri tepi kipas karton tersebut adalah \n47 cm.","answer":"Salah","explanation":"Keliling juring karton memerlukan kawat penutup sisi sepanjang keliling juring, yaitu 𝐵𝑢𝑠𝑢𝑟+ 2𝑟=\n33 + 28 = 61 cm. Hasil 47 cm salah akibat kekeliruan menambahkan satu panjang jari-jari saja \n(33 + 14 cm)."},{"text":"Luas permukaan kipas karton tersebut adalah 231 𝑐𝑚2.","answer":"Benar","explanation":"Dengan jari-jari 𝑟= 14 cm, luas kipas berbentuk juring adalah \n135\n360 ×\n22\n7 × 142 =\n3\n8 × 616 = 231 𝑐𝑚2."},{"text":"Panjang lengkungan luar juring kipas karton adalah 33 cm.","answer":"Benar","explanation":"Panjang lengkungan (busur) kipas adalah \n135\n360 × 2 ×\n22\n7 × 14 =\n3\n8 × 88 = 33 cm."},{"text":"Jika panjang jari-jari karton dilipatgandakan menjadi dua kali semula namun sudut pusat \ndiperkecil setengahnya, maka luas juring baru menjadi dua kali lipat dari luas mula-mula.","answer":"Benar","explanation":"Berdasarkan perubahan secara proporsional, luas juring sebanding dengan 𝜃× 𝑟2. Jika 𝑟 dikali 2 \ndan 𝜃 dikali 0.5, maka luas berubah dengan rasio 22 × 0.5 = 2 kali dari luas semula."}]},{"number":23,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Di sebuah area perkebunan berbentuk lingkaran, dibuat sekat juring berisi tanaman bunga mawar \ndengan sudut pusat 90∘ dan memiliki luas 154 m\n2. Di sepanjang batas keliling busur juring \nmawar tersebut dipasangi tiang penyangga berornamen besi. Gunakan pendekatan nilai 𝜋=\n22\n7 . \nTentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Jari-jari lingkaran taman tempat perkebunan mawar tersebut adalah 14 meter.","answer":"Benar","explanation":"Langkah 1: Membangun bentuk model matematika luas juring yaitu \n90∘\n360∘× 𝜋× 𝑟2 = 154 ⟹\n \n1\n4 ×\n22\n7 × 𝑟2 = 154. Langkah 2: Menghitung nilainya sehingga 𝑟2 = 154 × 4 ×\n7\n22 = 7 × 28 = 196, \nyang menghasilkan 𝑟= √196 = 14 meter."},{"text":"Panjang tiang besi lengkung penyangga yang membentang tepat sepanjang busur sekat juring \ntanaman mawar tersebut adalah 22 meter.","answer":"Benar","explanation":"Langkah 1: Mencari ukuran jari-jari kebun berdasarkan nilai luas juring mawar yaitu didapat 𝑟=\n14 meter. Langkah 2: Menghitung panjang busur juringnya dengan formula \n90∘\n360∘× 2 × 𝜋× 𝑟=\n1\n4 × 2 ×\n22\n7 × 14 = 22 meter."},{"text":"Luas keseluruhan kebun perkebunan sebelum dipisahkan menjadi beberapa bagian sekat \njuring adalah 616 m\n2.","answer":"Benar","explanation":"Langkah 1: Mengetahui dari luas juring yang terbentuk mewakili pecahan lingkaran penuh \nsebesar \n90∘\n360∘=\n1\n4 bagian dari kebun total. Langkah 2: Mengalikan luas juring mawar tersebut \nsebesar 4 kali untuk menemukan luas kebun penuh yaitu 4 × 154 m\n2 = 616 m\n2. Pernyataan \nini benar."},{"text":"Keliling seluruh sekat juring pembatas tanaman mawar, yang merupakan kombinasi panjang \nlengkungan kawat dengan kedua jari-jari lingkaran kebun adalah 36 meter.","answer":"Salah","explanation":"Langkah 1: Menentukan busur juring mawar dari hitungan di langkah sebelumnya yaitu sebesar \n22 meter. Langkah 2: Menghitung total keliling batas penampang dengan menjumlahkan kedua \njari-jarinya yaitu 𝐾𝑗𝑢𝑟𝑖𝑛𝑔= 𝑏𝑢𝑠𝑢𝑟+ 2 × 𝑟= 22 + 28 = 50 meter. Pernyataan ini salah karena 36 \nmeter diperoleh akibat hanya menambahkan satu jari-jari saja (22 + 14)."}]},{"number":24,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Desain sebuah kolam hias kecil berbentuk juring lingkaran memiliki jari-jari 14 meter dan sudut \njuring di bagian tepi sudut pusatnya 45∘ (nilai 𝜋=\n22\n7 ). Tentukan benar atau salah untuk setiap \npernyataan berikut!","statements":[{"text":"Panjang lintasan pagar luar kolam hias tersebut pada sudut 45∘ adalah 22 meter.","answer":"Salah","explanation":"Langkah 1: Keliling total 𝐾= 2 ×\n22\n7 × 14 = 88 m. Langkah 2: Panjang busur pagar pada 45∘ \nadalah \n45∘\n360∘× 88 = 11 m, bukan 22 m."},{"text":"Luas dasar kolam hias juring dengan sudut pusat 45∘ tersebut adalah 77 m\n2.","answer":"Benar","explanation":"Langkah 1: Luas lingkaran dasar kolam 𝐿=\n22\n7 × 142 = 616 m\n2. Langkah 2: Luas dasar kolam \njuring adalah \n1\n8 × 616 = 77 m\n2."},{"text":"Jika kolam diperluas hingga membentuk setengah lingkaran (180∘), panjang pagar \nlengkungnya menjadi 88 meter.","answer":"Salah","explanation":"Langkah 1: Keliling kolam penuh 𝐾= 88 m. Langkah 2: Pagar melengkung setengah lingkaran \nadalah \n1\n2 × 88 = 44 m, bukan 88 m."},{"text":"Jika sudut pusat diperlebar menjadi 90∘, luas dasar kolam juring tersebut adalah 154 m\n2.","answer":"Benar","explanation":"Langkah 1: Luas lingkaran kolam penuh 𝐿= 616 m\n2. Langkah 2: Luas juring 90∘ adalah \n1\n4 × 616 = 154 m\n2."}]},{"number":25,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah alat penyiram rumput taman otomatis dipasang pada sudut tanah berukuran menyudut \nsehingga dapat menyiram area melingkar berupa juring dengan radius pancaran sejauh 14 meter \ndan sudut bentang siraman sebesar 90∘. Sisi pagar pembatas tanah melingkar dirancang khusus \ndan dievaluasi luas pancarannya menggunakan konstanta 𝜋=\n22\n7 . Tentukan benar atau salah \nuntuk setiap pernyataan berikut!","statements":[{"text":"Luas bagian area hamparan rumput subur yang basah karena terkena air siraman sprinkler \ntersebut adalah 154 meter persegi.","answer":"Benar","explanation":"Langkah pertama: Luas total lingkaran dihitung dengan radius 𝑟= 14 m, menghasilkan 𝐿=\n𝜋× 𝑟2 =\n22\n7 × 14 × 14 = 616 meter persegi. Langkah kedua: Dengan sudut 90∘ yang setara \n90\n360 =\n1\n4 lingkaran, maka luas daerah juring yang tersiram adalah \n1\n4 × 616 = 154 meter persegi."},{"text":"Panjang lengkungan melingkar busur luar taman terjauh yang dapat disemburkan oleh air \npenyiram adalah sepanjang 11 meter.","answer":"Salah","explanation":"Langkah pertama: Hitung keliling lingkaran penuh, yaitu 2 × 𝜋× 𝑟= 2 ×\n22\n7 × 14 = 88 meter. \nLangkah kedua: Panjang lengkung busurnya adalah \n90\n360 × 88 =\n1\n4 × 88 = 22 meter. Pernyataan \nmenyebutkan 11 meter karena kekeliruan membagi 𝑑 langsung atau salah menentukan rumus \nkeliling."},{"text":"Jika sekeliling daerah siraman rumput dipagari penuh dengan kayu hias sepanjang jalur sisi \nradial dan lengkungnya, maka panjang pagar pelindung yang diperlukan adalah 50 meter.","answer":"Benar","explanation":"Langkah pertama: Ketahui panjang busur terluar daerah juring, yaitu 22 meter. Langkah kedua: \nPagar mengitari perimeter juring yang lengkap, sehingga total pagar = busur + 2 × 𝑗𝑎𝑟𝑖−𝑗𝑎𝑟𝑖=\n22 + 2(14) = 50 meter."},{"text":"Jika tekanan air diturunkan sehingga jangkauan radius pancaran memendek menjadi setengah \nkalinya (7 meter) namun dengan sudut tetap, maka luas area siraman rumput adalah 77 meter \npersegi.","answer":"Salah","explanation":"Langkah pertama: Sesuai sifat kuadratik luas terhadap jari-jari, jika jari-jari menjadi setengah \nkalinya (\n1\n2), maka luasnya menjadi \n1\n4 dari luas mula-mula. Langkah kedua: Luas juring baru = \n1\n4 × 154 = 38,5 meter persegi. Nilai 77 meter persegi salah karena secara salah mengasumsikan \nluas berbanding lurus linear dengan ukuran jari-jari."}]},{"number":26,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Taman berbentuk juring lingkaran memiliki sudut pusat 120∘ dengan jari-jari 21 meter. Di tengah \ntaman tersebut akan dibangun sebuah kolam yang juga berbentuk juring lingkaran sepusat \n(konsentris) dengan sudut pusat yang sama namun memiliki jari-jari 7 meter, sedangkan sisa \nlahan taman akan ditanami rumput. Tentukan benar atau salah untuk setiap pernyataan berikut \nberkaitan dengan desain taman dan kolam tersebut dengan menggunakan nilai 𝜋=\n22\n7 !","statements":[{"text":"Luas kolam yang berbentuk juring kecil adalah 154 m².","answer":"Salah","explanation":"Luas kolam dengan jari-jari 7 meter dan sudut 120° adalah (120/360) × π × 7² = 154/3 ≈ 51,33 m², bukan 154 m²."},{"text":"Selisih panjang busur luar taman dan busur dalam kolam adalah 88/3 meter.","answer":"Benar","explanation":"Panjang busur luar = 44 m. Panjang busur kolam = 44/3 m. Selisihnya 44 − 44/3 = 88/3 m."},{"text":"Luas daerah taman yang akan ditanami rumput adalah 1232/3 m².","answer":"Benar","explanation":"Luas taman keseluruhan = 462 m². Luas kolam = 154/3 m². Luas rumput = 462 − 154/3 = 1232/3 m²."},{"text":"Perbandingan luas daerah kolam dengan luas taman seluruhnya adalah 1 : 9.","answer":"Benar","explanation":"Karena kedua juring memiliki sudut pusat yang sama, perbandingan luas sebanding dengan kuadrat jari-jari: 7² : 21² = 49 : 441 = 1 : 9."}]},{"number":27,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Pada dekorasi lukisan kaca terdapat dua motif juring lingkaran, Juring A dan Juring B. Juring A \ndibatasi dengan ukuran luas 308 𝑐𝑚2 dan memiliki sudut pusat 45∘. Juring B dikonstruksikan \nmemiliki ukuran sudut juring 90∘ namun dengan ukuran jari-jari hanya setengah kali jari-jari dari \nlingkaran juring A (gunakan 𝜋=\n22\n7 ). Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Panjang jari-jari dari lingkaran penyusun Juring A bernilai 14 cm.","answer":"Salah","explanation":"Menentukan jari-jari juring A terlebih dahulu: 308 =\n45\n360 ×\n22\n7 × 𝑟𝐴\n2 ⟹ 308 =\n11\n28 𝑟𝐴\n2 ⟹ 𝑟𝐴\n2 = 784 ⟹\n 𝑟𝐴= 28 cm."},{"text":"Panjang lintasan busur lengkung Juring A memiliki ukuran yang sama besar dengan busur \njuring B yaitu sepanjang 22 cm.","answer":"Benar","explanation":"Panjang busur Juring A: 𝐵𝐴=\n45\n360 × 2 ×\n22\n7 × 28 = 22 cm. Panjang jari-jari Juring B adalah \n1\n2 × 28 =\n14 cm, sehingga busur Juring B adalah: 𝐵𝐵=\n90\n360 × 2 ×\n22\n7 × 14 = 22 cm. Kedua busur memang \nsama panjang."},{"text":"Luas juring bermotif B yang tergambar pada hiasan kaca tersebut bernilai 77 𝑐𝑚2.","answer":"Salah","explanation":"Hitung luas juring B dengan 𝑟𝐵= 14 cm dan 𝜃= 90∘: 𝐿𝐵=\n90\n360 ×\n22\n7 × 142 = 154 𝑐𝑚2. Nilai 77 𝑐𝑚2 \nterjadi akibat kesalahan pengunaan rumus linear tanpa kuadrat jari-jari."},{"text":"Rasio atau perbandingan luas yang dihasilkan oleh juring A dibanding dengan luas juring B \nadalah 2: 1.","answer":"Benar","explanation":"Melalui komparasi langsung: 𝐿𝐴= 308 𝑐𝑚2 dan 𝐿𝐵= 154 𝑐𝑚2. Perbandingannya adalah 308: 154 \nyang bernilai persis 2: 1."}]},{"number":28,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Seorang seniman kerajinan suvenir adat sedang mendesain produk kipas dekorasi dinding \nberbahan kertas tebal sepusat yang diiris membentuk wilayah sepasang juring konsentris. Radius \nlingkar terluar kipas berukuran 28 cm, radius lingkar bagian rongga batas dalam bernilai 14 cm, \nserta didesain dengan jangkauan sebaran bukaan sudut juring pusat senilai 120∘. Daerah \nfungsional kertas penutup dipasang mengapit ruang di antara kedua lengkungan lingkar batas \nradial itu saja dengan acuan ketetapan nilai 𝜋=\n22\n7 . Beri tanda centang (✓) pada setiap \npernyataan yang benar!","statements":[{"text":"Total luasan kertas tebal dekorasi dekoratif penyusun fungsional bagian kipas pameran \ntersebut bernilai tepat 616 sentimeter persegi.","answer":"Benar","explanation":"Langkah 1: Luas juring lingkar terluar (𝑟= 28 cm) adalah \n120∘\n360∘×\n22\n7 × 28 × 28 =\n1\n3 × 2464 =\n2464\n3 \nsentimeter persegi. Langkah 2: Luas juring lingkar dalam kosong (𝑟= 14 cm) adalah \n120∘\n360∘×\n22\n7 × 14 × 14 =\n1\n3 × 616 =\n616\n3 sentimeter persegi. Langkah 3: Luas sisa daerah bertutup \nkertas: \n2464−616\n3\n=\n1848\n3\n= 616 sentimeter persegi."},{"text":"Panjang keliling tepi pemotongan luar lembaran bahan kertas penyusun badan kipas tanpa \nmenghitung penyangga rusuk penahan sisi kayu dalam hanyalah bernilai 88 cm.","answer":"Salah","explanation":"Langkah 1: Menghitung total keliling lembar potongan mencakup busur besar dan busur kecil \nditambah dua potong ruas jarak lurus radial sisi kiri-kanan. Langkah 2: Menghitung selisih radial: \n2 × (28 −14) = 28 cm. Langkah 3: Penjumlahan total sesungguhnya bernilai (\n1\n3 × 2 ×\n22\n7 × 28) +\n(\n1\n3 × 2 ×\n22\n7 × 14) + 28 = 58.67 + 29.33 + 28 = 116 cm, bukan hanya menjumlahkan dua panjang \nbusur (88 cm)."},{"text":"Kebutuhan panjang minimal anyaman list pita rajut emas di sepanjang semua batas sisi \nperimeter kain kipas pelapis dekoratif yang menutupi potongan sisa tersebut adalah sepanjang \n116 cm.","answer":"Benar","explanation":"Langkah 1: Cari panjang busur besar: \n120∘\n360∘× 2 ×\n22\n7 × 28 = 58.67 cm. Langkah 2: Cari panjang \nbusur kecil: \n120∘\n360∘× 2 ×\n22\n7 × 14 = 29.33 cm. Langkah 3: Tambahkan rentang radial lurus dua batas \nkiri-kanan kertas yaitu sebesar 14 + 14 = 28 cm, total panjang list dekoratif adalah: 58.67 +\n29.33 + 28 = 116 cm."},{"text":"Selisih linear di antara rentangan lengkungan busur besar terluar penutup badan kipas dengan \nlengkungan kecil bagian terdalam adalah senilai \n88\n3 cm.","answer":"Benar","explanation":"Langkah 1: Panjang busur terluar besar: \n176\n3 cm. Langkah 2: Panjang busur terdalam kecil: \n88\n3 cm. \nLangkah 3: Selisih panjang di antara keduanya: \n176−88\n3\n=\n88\n3 cm."}]},{"number":29,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah roti bakar berbentuk lingkaran dengan diameter 28 cm dipotong menjadi beberapa juring \nuntuk dibagikan kepada keluarga. Juring 𝐴 memiliki sudut pusat 60∘ dan juring 𝐵 memiliki sudut \npusat 90∘. Roti tersebut akan ditaburi keju di bagian keliling lengkungnya (busur) dan selai cokelat \ndi permukaan juringnya. Gunakan nilai 𝜋=\n22\n7 untuk mengevaluasi setiap pernyataan berikut!","statements":[{"text":"Selisih panjang busur antara juring 𝐵 dan juring 𝐴 adalah tepat \n22\n3 cm.","answer":"Benar","explanation":"Keliling lingkaran dengan 𝑑= 28 cm adalah 𝐾=\n22\n7 × 28 = 88 cm. Panjang busur 𝐴 adalah \n60∘\n360∘× 88 =\n44\n3 cm. Panjang busur 𝐵 adalah \n90∘\n360∘× 88 = 22 cm. Selisih keduanya adalah 22 −\n44\n3 =\n66−44\n3\n=\n22\n3 cm."},{"text":"Rasio antara luas juring 𝐴 terhadap luas juring 𝐵 adalah 2: 3.","answer":"Benar","explanation":"Rasio luas juring dengan jari-jari yang sama sebanding dengan rasio sudut pusatnya. Rasio Luas \n𝐴 : Luas 𝐵 = 60∘: 90∘= 2: 3."},{"text":"Jika harga keju untuk taburan sepanjang busur adalah Rp500 per cm, biaya menaburi keju \npada busur juring 𝐴 lebih mahal daripada juring 𝐵.","answer":"Salah","explanation":"Panjang busur juring 𝐴 (\n44\n3 ≈14,67 cm) lebih pendek dari panjang busur juring 𝐵 (22 cm), \nsehingga biaya menaburi juring 𝐴 seharusnya lebih murah, bukan lebih mahal."},{"text":"Jumlah luas permukaan juring 𝐴 dan juring 𝐵 setelah dihitung adalah tepat 250∘ cm\n2.","answer":"Salah","explanation":"Luas total lingkaran adalah 𝐿=\n22\n7 × 14 × 14 = 616 cm\n2. Jumlah juring 𝐴 dan 𝐵 mengambil \nsudut total 150∘. Total luas keduanya adalah \n150∘\n360∘× 616 = 256,67 cm\n2, bukan 250 cm\n2."}]},{"number":30,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan busur, sudut, dan luas juring lingkaran","question":"Sebuah sistem pengamanan melengkung pada jalan masuk garasi apartemen mewah \nmembentuk ayunan sapuan bidang juring sewaktu pintu baja melintasi rute pergerakan \nberputarnya. Rancang gerbang portal memiliki diameter bilah penahan bentang sepanjang 12 \nmeter dan berhasil mendokumentasikan sapuan lengkung busur lintasan luar ban ban setinggi \npanjang rel melingkar sebersar 4,71 meter. Tentukan benar atau salah untuk tiap hipotesis \npenyelesaian analitis gerakan mekanik bukaan pintu portal penahan laju kendaraan (mengambil \npendekatan nilai 𝜋= 3,14)!","statements":[{"text":"Pintu penahan otomatis tersebut mengukur perubahan bentangan sudut garasi secara radial \nsaat terbuka hingga mencapai ukuran sebesar 90∘.","answer":"Salah","explanation":"Radius palang bentangan (𝑟) = 6 meter. Sifat formula penentu perpanjangan juring lintasan: \n4,71 =\n𝜃\n360∘× 2 × 3,14 × 6 ⟹ 4,71 = 37,68 ×\n𝜃\n360∘ ⟹ \n𝜃\n360∘= 0,125 (atau senilai bagian rasio \n1\n8 \nlingkaran penuh). Besarnya 𝜃= 0,125 × 360∘= 45∘, yang berarti portal tersebut membuka sejauh \n45∘."},{"text":"Luas juring lintasan alas tanah perlintasan mobil yang terkena akibat bidang rute rotasi putaran \nhorizontal pintu baja gerbang adalah selebar 14,13 meter persegi.","answer":"Benar","explanation":"Beranjak dari hitungan bahwa portal tersebut mewakili rasio \n1\n8 dari bagian penuh lingkaran besar, \nluas lintasannya = \n1\n8 × 3,14 × 6 × 6 = 14,13 meter persegi. Hasil perhitungan bernilai sangat tepat."},{"text":"Jika posisi pintu ditutup murni dalam kondisi lurus sejajar dinding, sapuan gerbang otomatis \nwaktu beralih hanya memutar roda lengan sejauh 45∘ secara spasial.","answer":"Benar","explanation":"Benar. Dari analisis matematika di langkah penyelesaian nilai busur di atas didapatkan sudut \njuring pembukaan pintu portal yang relevan adalah 45∘."},{"text":"Nilai jaring lintasan lengkung kawat berarus sensor keamanan portal mencakup seluruh \nperimeter lintasan bilah besi berstruktur sekeliling juring sepanjang 16,71 meter.","answer":"Benar","explanation":"Keliling dari bidang rute juring tersebut = lintasan busur bagian depan + dua buah panjang \nbentangan penahan pagar lurus (2 × 6 meter) = 4,71 meter + 12 meter = 16,71 meter. Teorema \ndiaplikasikan dengan cara murni terstruktur."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
