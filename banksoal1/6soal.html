<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Aritmatika Sosial</title>
<style>
:root{--bg:#080f27;--panel:#111d3d;--panel2:#17264d;--cyan:#4de1f0;--blue:#438cff;--purple:#9674ff;--yellow:#ffd45a;--white:#f4f7ff;--muted:#b9c7e8;--green:#51dfa1;--red:#ff7d91}
*{box-sizing:border-box}html{font-size:20px}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#202d66 0,#111936 35%,#080f27 75%);color:var(--white);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.55}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;color:#08132d;background:linear-gradient(135deg,var(--cyan),#78baff);box-shadow:0 5px 16px #0003}button:disabled{opacity:.4;cursor:not-allowed}
.top{padding:22px 4vw 12px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:1px;color:var(--cyan)}.brand span{color:var(--yellow)}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools button,.filter button,.nav button,.secondary{background:#24345f;color:var(--white);border:1px solid #49618f;box-shadow:none}.wrap{max-width:1100px;margin:0 auto;padding:16px 22px 140px}.hero{padding:26px;border:1px solid #4a5d91;border-radius:24px;background:linear-gradient(120deg,#172b58,#29245b);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:1.65rem;line-height:1.25}.hero p{margin:0;color:var(--muted)}.filter{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filter button.active{background:linear-gradient(135deg,var(--purple),var(--blue));border-color:transparent}.card{background:linear-gradient(145deg,#142448,#101a38);border:1px solid #344b7c;border-radius:22px;padding:24px;box-shadow:0 14px 35px #0003}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.pill{font-size:20px;padding:6px 12px;border-radius:999px;background:#263965;color:#dceaff;border:1px solid #52699c}.progress{height:12px;background:#29385f;border-radius:20px;overflow:hidden;margin:12px 0 22px}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0;transition:width .25s}.objective{padding:14px 16px;background:#1c315b;border-left:5px solid var(--yellow);border-radius:12px;margin-bottom:20px;color:#e7efff}.qtext{font-size:1.12rem;font-weight:700;margin:10px 0 18px}.visual{margin:14px auto 20px;max-width:620px;background:#fff;color:#17213a;padding:14px;border-radius:16px;text-align:center}.visual svg{width:100%;height:auto;display:block}.options{display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #465d8f;border-radius:14px;background:#17284d;cursor:pointer}.option:hover{border-color:var(--cyan);background:#1d3564}.option input{width:22px;height:22px;accent-color:#64ddeb;flex-shrink:0;margin-top:4px}.option.selected{border-color:var(--cyan);background:#203d6b}.feedback,.explanation{margin-top:18px;padding:16px;border-radius:14px;display:none}.feedback.show,.explanation.show{display:block}.feedback.correct{background:#123f3a;border:1px solid var(--green)}.feedback.wrong{background:#4b2638;border:1px solid var(--red)}.explanation{background:#1b2d55;border:1px solid #6178ad}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080f27ee;backdrop-filter:blur(12px);border-top:1px solid #34466f;padding:14px 4vw;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;z-index:5}.bottom button{min-width:120px}.secondary{background:#26365e}.accent{background:linear-gradient(135deg,var(--yellow),#ffad55)}.score{color:var(--yellow);font-weight:800}.hidden{display:none!important}.print-head{display:none}
@media(max-width:650px){.top{padding:16px}.wrap{padding:10px 14px 170px}.hero,.card{padding:18px;border-radius:18px}.hero h1{font-size:1.35rem}.bottom{gap:7px;padding:10px}.bottom button{min-width:0;flex:1;padding:12px 8px}.tools button{padding:9px 12px}.qtext{font-size:1.05rem}}
@media print{body{background:#fff;color:#111}.top,.filter,.bottom,.tools{display:none!important}.wrap{max-width:none;padding:0}.hero,.card{background:#fff;color:#111;border:1px solid #aaa;box-shadow:none}.hero p,.objective{color:#222}.objective{background:#eee}.option{background:#fff;color:#111;border:1px solid #aaa}.visual{border:1px solid #aaa}.print-head{display:block}}
body.presentation .top,body.presentation .filter{display:none}body.presentation .wrap{max-width:1250px}body.presentation .hero{margin-top:10px}
</style>
</head>
<body>
<header class="top"><div class="brand">KELAS <span>BELAJAR</span> · MPI MATEMATIKA</div><div class="tools"><button class="secondary" onclick="togglePresentation()">Mode Presentasi</button><button class="secondary" onclick="toggleFullscreen()">Layar Penuh</button><button class="secondary" onclick="window.print()">Cetak</button></div></header>
<main class="wrap">
<section class="hero"><h1>Latihan Interaktif: Aritmatika Sosial</h1><p>18 soal pilihan ganda · Harga jual dan beli, untung-rugi, persentase, diskon, pajak, bruto-neto-tara</p></section>
<div class="filter" id="filters"><button class="active" data-level="Semua">Semua Soal</button><button data-level="1">Level 1</button><button data-level="2">Level 2</button><button data-level="3">Level 3</button></div>
<section class="card">
<div class="meta"><span class="pill" id="levelPill">Level 1</span><span class="pill" id="numberPill">Soal 1 dari 18</span><span class="pill">Pilihan Ganda</span><span class="pill" id="progressText">Progres 6%</span></div>
<div class="progress"><div id="progressBar"></div></div>
<div class="objective"><strong>Tujuan:</strong> <span id="objective"></span></div>
<div class="qtext" id="question"></div>
<div id="visual" class="visual hidden"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="explanation" id="explanation"></div>
</section>
</main>
<div class="bottom"><button class="secondary" id="prev">← Sebelumnya</button><button class="secondary" id="next">Berikutnya →</button><button id="check">Periksa Jawaban</button><button class="accent" id="reveal">Kunci & Pembahasan</button><button class="secondary hidden" id="hide">Sembunyikan Pembahasan</button></div>
<script>
const questions = [
{number:1,level:1,type:"Konsep",objective:"Mengidentifikasi harga beli dan harga jual dalam transaksi sederhana.",question:"Seorang pedagang membeli sebuah tas seharga Rp80.000,00. Harga tersebut disebut ....",options:[{key:"A",text:"Harga jual"},{key:"B",text:"Harga beli"},{key:"C",text:"Untung"},{key:"D",text:"Diskon"}],answer:"B",explanation:"Harga beli adalah harga yang dibayarkan pedagang ketika memperoleh barang. Jadi, Rp80.000,00 merupakan harga beli."},
{number:2,level:1,type:"Konsep",objective:"Menentukan keuntungan dari selisih harga jual dan harga beli.",question:"Sebuah buku dibeli seharga Rp12.000,00 lalu dijual Rp15.000,00. Pedagang memperoleh ....",options:[{key:"A",text:"Untung Rp3.000,00"},{key:"B",text:"Rugi Rp3.000,00"},{key:"C",text:"Untung Rp27.000,00"},{key:"D",text:"Rugi Rp27.000,00"}],answer:"A",explanation:"Untung = harga jual − harga beli = Rp15.000,00 − Rp12.000,00 = Rp3.000,00."},
{number:3,level:1,type:"Konsep",objective:"Menentukan kerugian berdasarkan harga beli dan harga jual.",question:"Ibu membeli sepatu seharga Rp150.000,00. Sepatu itu dijual kembali Rp135.000,00. Besar kerugiannya adalah ....",options:[{key:"A",text:"Rp5.000,00"},{key:"B",text:"Rp10.000,00"},{key:"C",text:"Rp15.000,00"},{key:"D",text:"Rp25.000,00"}],answer:"C",explanation:"Rugi = harga beli − harga jual = Rp150.000,00 − Rp135.000,00 = Rp15.000,00."},
{number:4,level:1,type:"Persentase",objective:"Menghitung persentase keuntungan terhadap harga beli.",question:"Sebuah barang dibeli Rp40.000,00 dan dijual Rp50.000,00. Persentase keuntungan adalah ....",options:[{key:"A",text:"10%"},{key:"B",text:"20%"},{key:"C",text:"25%"},{key:"D",text:"30%"}],answer:"C",explanation:"Untung = 50.000 − 40.000 = 10.000. Persentase untung = (10.000 ÷ 40.000) × 100% = 25%."},
{number:5,level:1,type:"Diskon",objective:"Menentukan besar potongan harga dari persentase diskon.",question:"Harga sebuah kaus Rp100.000,00 mendapat diskon 20%. Besar diskonnya adalah ....",visual:'<div style="font-size:24px;font-weight:800;color:#263b70">PROMO TOKO</div><svg viewBox="0 0 520 155" role="img" aria-label="Ilustrasi label harga kaus dan diskon"><rect x="8" y="8" width="504" height="139" rx="18" fill="#e8f1ff"/><path d="M170 45 L195 25 L220 45 L245 32 L280 55 L260 80 L245 70 L245 125 L175 125 L175 70 L160 80 L140 55Z" fill="#6b8cff" stroke="#294a9a" stroke-width="3"/><text x="330" y="58" font-size="22" fill="#17213a" text-anchor="middle">Rp100.000</text><text x="330" y="100" font-size="28" font-weight="bold" fill="#d43d55" text-anchor="middle">DISKON 20%</text></svg>',options:[{key:"A",text:"Rp10.000,00"},{key:"B",text:"Rp15.000,00"},{key:"C",text:"Rp20.000,00"},{key:"D",text:"Rp25.000,00"}],answer:"C",explanation:"Diskon = 20% × Rp100.000,00 = Rp20.000,00."},
{number:6,level:1,type:"Diskon",objective:"Menghitung harga setelah mendapat potongan diskon.",question:"Sebuah tas berharga Rp200.000,00 mendapat diskon 15%. Harga yang harus dibayar adalah ....",options:[{key:"A",text:"Rp150.000,00"},{key:"B",text:"Rp160.000,00"},{key:"C",text:"Rp170.000,00"},{key:"D",text:"Rp185.000,00"}],answer:"C",explanation:"Diskon = 15% × 200.000 = 30.000. Harga setelah diskon = 200.000 − 30.000 = Rp170.000,00."},
{number:7,level:1,type:"Bruto-neto-tara",objective:"Membedakan bruto, neto, dan tara.",question:"Berat beras beserta karungnya adalah 25 kg. Jika berat karung 1 kg, berat beras saja (neto) adalah ....",visual:'<svg viewBox="0 0 520 160" role="img" aria-label="Ilustrasi karung beras"><rect x="8" y="8" width="504" height="144" rx="18" fill="#fff4d9"/><path d="M190 35 Q260 10 330 35 L350 130 Q260 150 170 130Z" fill="#d6a75c" stroke="#8b632f" stroke-width="4"/><path d="M190 35 Q260 50 330 35" fill="none" stroke="#8b632f" stroke-width="4"/><text x="260" y="88" text-anchor="middle" font-size="25" font-weight="bold" fill="#49331b">BERAS</text><text x="260" y="118" text-anchor="middle" font-size="19" fill="#49331b">25 kg termasuk karung</text></svg>',options:[{key:"A",text:"1 kg"},{key:"B",text:"24 kg"},{key:"C",text:"25 kg"},{key:"D",text:"26 kg"}],answer:"B",explanation:"Neto = bruto − tara = 25 kg − 1 kg = 24 kg."},
{number:8,level:1,type:"Pajak",objective:"Menghitung besar pajak dari persentase yang diketahui.",question:"Harga makanan Rp50.000,00 dikenai pajak 10%. Besar pajak yang harus dibayar adalah ....",options:[{key:"A",text:"Rp2.500,00"},{key:"B",text:"Rp5.000,00"},{key:"C",text:"Rp10.000,00"},{key:"D",text:"Rp15.000,00"}],answer:"B",explanation:"Pajak = 10% × Rp50.000,00 = Rp5.000,00."},
{number:9,level:2,type:"Persentase",objective:"Menentukan harga jual berdasarkan persentase keuntungan.",question:"Pak Rudi membeli blender seharga Rp250.000,00. Ia ingin memperoleh untung 12%. Harga jual blender seharusnya ....",options:[{key:"A",text:"Rp262.000,00"},{key:"B",text:"Rp270.000,00"},{key:"C",text:"Rp280.000,00"},{key:"D",text:"Rp300.000,00"}],answer:"C",explanation:"Untung = 12% × 250.000 = 30.000. Harga jual = 250.000 + 30.000 = Rp280.000,00."},
{number:10,level:2,type:"Persentase",objective:"Menghitung persentase kerugian terhadap harga beli.",question:"Sebuah sepeda dibeli Rp800.000,00 dan dijual Rp720.000,00. Persentase kerugian adalah ....",options:[{key:"A",text:"8%"},{key:"B",text:"10%"},{key:"C",text:"12%"},{key:"D",text:"15%"}],answer:"B",explanation:"Rugi = 800.000 − 720.000 = 80.000. Persentase rugi = (80.000 ÷ 800.000) × 100% = 10%."},
{number:11,level:2,type:"Diskon",objective:"Menghitung harga akhir setelah diskon bertingkat sederhana.",question:"Harga jaket Rp300.000,00 mendapat diskon 10%. Harga setelah diskon adalah ....",visual:'<svg viewBox="0 0 520 150" role="img" aria-label="Label diskon jaket"><rect x="8" y="8" width="504" height="134" rx="18" fill="#eaf7ff"/><path d="M180 35 L215 20 L245 42 L275 20 L310 35 L340 75 L310 90 L295 75 L295 125 L195 125 L195 75 L180 90 L150 75Z" fill="#5a75bd" stroke="#263e7a" stroke-width="3"/><text x="410" y="55" text-anchor="middle" font-size="20" fill="#18284b">Rp300.000</text><text x="410" y="94" text-anchor="middle" font-size="27" font-weight="bold" fill="#d23c5b">10% OFF</text></svg>',options:[{key:"A",text:"Rp270.000,00"},{key:"B",text:"Rp280.000,00"},{key:"C",text:"Rp290.000,00"},{key:"D",text:"Rp330.000,00"}],answer:"A",explanation:"Diskon = 10% × 300.000 = 30.000. Harga akhir = 300.000 − 30.000 = Rp270.000,00."},
{number:12,level:2,type:"Pajak",objective:"Menentukan total pembayaran setelah dikenai pajak.",question:"Sebuah barang berharga Rp160.000,00 dikenai pajak 5%. Total yang harus dibayar adalah ....",options:[{key:"A",text:"Rp160.500,00"},{key:"B",text:"Rp165.000,00"},{key:"C",text:"Rp168.000,00"},{key:"D",text:"Rp175.000,00"}],answer:"C",explanation:"Pajak = 5% × 160.000 = 8.000. Total = 160.000 + 8.000 = Rp168.000,00."},
{number:13,level:2,type:"Bruto-neto-tara",objective:"Menentukan tara dalam satuan berat.",question:"Sebuah kaleng biskuit memiliki bruto 2,4 kg dan neto 2 kg. Tara kaleng tersebut adalah ....",options:[{key:"A",text:"0,2 kg"},{key:"B",text:"0,4 kg"},{key:"C",text:"2 kg"},{key:"D",text:"4,4 kg"}],answer:"B",explanation:"Tara = bruto − neto = 2,4 kg − 2 kg = 0,4 kg."},
{number:14,level:2,type:"Untung-rugi",objective:"Menyelesaikan masalah keuntungan dari beberapa barang.",question:"Seorang pedagang membeli 5 bola dengan harga Rp40.000,00 per bola. Semua bola dijual Rp45.000,00 per bola. Total keuntungan pedagang adalah ....",options:[{key:"A",text:"Rp5.000,00"},{key:"B",text:"Rp20.000,00"},{key:"C",text:"Rp25.000,00"},{key:"D",text:"Rp45.000,00"}],answer:"C",explanation:"Untung per bola = 45.000 − 40.000 = 5.000. Total untung = 5 × 5.000 = Rp25.000,00."},
{number:15,level:3,type:"HOTS",objective:"Menganalisis harga awal berdasarkan harga setelah diskon.",question:"Setelah mendapat diskon 20%, harga sebuah sepatu menjadi Rp240.000,00. Harga sepatu sebelum diskon adalah ....",options:[{key:"A",text:"Rp260.000,00"},{key:"B",text:"Rp280.000,00"},{key:"C",text:"Rp288.000,00"},{key:"D",text:"Rp300.000,00"}],answer:"D",explanation:"Harga setelah diskon adalah 80% dari harga awal. Harga awal = 240.000 ÷ 0,8 = Rp300.000,00."},
{number:16,level:3,type:"HOTS",objective:"Membandingkan dua pilihan potongan harga untuk menentukan harga paling hemat.",question:"Toko A memberi diskon 25% untuk barang seharga Rp200.000,00. Toko B memberi potongan langsung Rp45.000,00 untuk barang yang sama. Pernyataan yang benar adalah ....",options:[{key:"A",text:"Toko A lebih murah Rp5.000,00"},{key:"B",text:"Toko B lebih murah Rp5.000,00"},{key:"C",text:"Harga di kedua toko sama"},{key:"D",text:"Toko A lebih murah Rp10.000,00"}],answer:"A",explanation:"Toko A: 200.000 − 25% × 200.000 = 150.000. Toko B: 200.000 − 45.000 = 155.000. Jadi Toko A lebih murah Rp5.000,00."},
{number:17,level:3,type:"HOTS",objective:"Menganalisis perubahan harga jual agar pedagang mencapai keuntungan tertentu.",question:"Pedagang membeli 1 lusin gelas seharga Rp180.000,00. Jika setiap gelas dijual Rp18.000,00, keuntungan seluruhnya adalah ....",options:[{key:"A",text:"Rp18.000,00"},{key:"B",text:"Rp24.000,00"},{key:"C",text:"Rp36.000,00"},{key:"D",text:"Rp216.000,00"}],answer:"C",explanation:"Harga jual seluruh gelas = 12 × 18.000 = 216.000. Untung = 216.000 − 180.000 = Rp36.000,00."},
{number:18,level:3,type:"HOTS",objective:"Menyelesaikan persoalan bruto, neto, dan harga berdasarkan berat bersih.",question:"Sebuah toko menjual 4 kemasan kacang. Setiap kemasan memiliki bruto 550 gram dan tara 50 gram. Jika harga kacang Rp30.000,00 per kilogram, nilai seluruh kacang adalah ....",options:[{key:"A",text:"Rp48.000,00"},{key:"B",text:"Rp54.000,00"},{key:"C",text:"Rp60.000,00"},{key:"D",text:"Rp66.000,00"}],answer:"C",explanation:"Neto tiap kemasan = 550 − 50 = 500 gram. Empat kemasan = 2.000 gram = 2 kg. Nilai = 2 × Rp30.000,00 = Rp60.000,00."}
];
let current=0,filter="Semua",answers={},checked={},revealed={};
const $=id=>document.getElementById(id);
function visible(){return questions.map((q,i)=>({q,i})).filter(x=>filter==="Semua"||String(x.q.level)===filter)}
function render(){let list=visible();if(!list.length)return;let pos=list.findIndex(x=>x.i===current);if(pos<0){current=list[0].i;pos=0}let q=questions[current];$("levelPill").textContent="Level "+q.level;$("numberPill").textContent=`Soal ${pos+1} dari ${list.length}`;$("progressText").textContent=`Progres ${Math.round((pos+1)/list.length*100)}%`;$("progressBar").style.width=((pos+1)/list.length*100)+"%";$("objective").textContent=q.objective;$("question").textContent=q.question;$("visual").innerHTML=q.visual||"";$("visual").classList.toggle("hidden",!q.visual);
$("options").innerHTML=q.options.map(o=>`<label class="option ${answers[current]===o.key?'selected':''}"><input type="radio" name="answer" value="${o.key}" ${answers[current]===o.key?'checked':''}><span><strong>${o.key}.</strong> ${o.text}</span></label>`).join("");
document.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',e=>{answers[current]=e.target.value;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));e.target.closest('.option').classList.add('selected');$("feedback").className="feedback";}));
$("feedback").className="feedback";$("feedback").textContent="";if(checked[current])showCheck();$("explanation").classList.toggle("show",!!revealed[current]);$("explanation").innerHTML=revealed[current]?`<strong>Jawaban: ${q.answer}</strong><br>${q.explanation}`:"";$("hide").classList.toggle("hidden",!revealed[current]);$("prev").disabled=pos===0;$("next").disabled=pos===list.length-1;
}
function showCheck(){let q=questions[current],f=$("feedback");if(!answers[current]){f.className="feedback show wrong";f.textContent="Pilih salah satu jawaban terlebih dahulu.";return}let ok=answers[current]===q.answer;f.className="feedback show "+(ok?"correct":"wrong");f.textContent=ok?"Benar! Jawaban kamu tepat.":"Belum tepat. Coba pelajari kembali, lalu lihat pembahasannya jika diperlukan."}
$("check").onclick=()=>{checked[current]=true;showCheck()};
$("reveal").onclick=()=>{revealed[current]=true;render()};
$("hide").onclick=()=>{revealed[current]=false;render()};
$("prev").onclick=()=>{let l=visible(),p=l.findIndex(x=>x.i===current);if(p>0){current=l[p-1].i;render()}};
$("next").onclick=()=>{let l=visible(),p=l.findIndex(x=>x.i===current);if(p<l.length-1){current=l[p+1].i;render()}};
$("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.level;$("filters").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));current=visible()[0].i;render()});
function togglePresentation(){document.body.classList.toggle("presentation")}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
render();
</script>
</body></html>
