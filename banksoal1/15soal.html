<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif SPLDV</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT SISTEM PERSAMAAN LINEAR DUA VARIABEL</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Titik potong grafik persamaan linear dua variabel 4𝑥−5𝑦= 20 dengan sumbu-X adalah ....","options":[{"key":"A","text":"(1,0)"},{"key":"B","text":"(4,0)"},{"key":"C","text":"(5,0)"},{"key":"D","text":"(20,0)"}],"answer":"C","explanation":"Langkah 1: Grafik memotong sumbu-X ketika nilai koordinat 𝑦= 0. \nLangkah 2: Substitusikan 𝑦= 0 ke dalam persamaan 4𝑥−5𝑦= 20 sehingga diperoleh 4𝑥−\n5(0) = 20 atau 4𝑥= 20. \nLangkah 3: Selesaikan untuk 𝑥 dengan membagi kedua ruas dengan 4, didapatkan 𝑥= 5. Jadi, \ntitik potongnya adalah (5,0). \nJawaban Benar: C"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Jika titik (1,4) merupakan titik potong dari dua garis yang mewakili suatu sistem persamaan linear dua variabel, pernyataan yang paling tepat mengenai hubungan titik tersebut dengan sistem persamaan tersebut adalah ....","options":[{"key":"A","text":"titik (1,4) bukan merupakan penyelesaian dari kedua persamaan"},{"key":"B","text":"titik (1,4) hanya memenuhi salah satu persamaan saja"},{"key":"C","text":"titik (1,4) adalah anggota himpunan penyelesaian dari kedua persamaan tersebut"},{"key":"D","text":"titik (1,4) membuat salah satu persamaan bernilai salah"}],"answer":"C","explanation":"Langkah 1: Pahami definisi titik potong secara grafis pada sistem persamaan linear. \nTitik potong dari dua grafik linear merepresentasikan solusi tunggal (x, y) yang memenuhi kedua \npersamaan secara simultan. \nOleh karena itu, titik (1,4) harus menjadi anggota himpunan penyelesaian dari kedua persamaan \ntersebut. \nJawaban Benar: C"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Jika grafik dari persamaan linear 2𝑥+ 𝑦= 6 dan 𝑥−𝑦= 0 berpotongan di satu titik pada bidang Kartesius, koordinat titik potong tersebut adalah ....","options":[{"key":"A","text":"(1,1)"},{"key":"B","text":"(2,2)"},{"key":"C","text":"(3,3)"},{"key":"D","text":"(4,4)"}],"answer":"B","explanation":"Persamaan kedua 𝑥−𝑦= 0 dapat diubah menjadi 𝑥= 𝑦. \nSubstitusikan 𝑦= 𝑥 ke persamaan pertama 2𝑥+ 𝑦= 6. \nDiperoleh 2𝑥+ 𝑥= 6 ⇒3𝑥= 6 ⇒𝑥= 2. \nKarena 𝑥= 𝑦, maka 𝑦= 2. \nTitik potongnya adalah (2,2). \nJawaban Benar: B."},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Jika penyelesaian dari sistem persamaan 2𝑥−3𝑦= −13 dan 𝑥+ 2𝑦= 4 adalah (𝑎, 𝑏), maka nilai dari 𝑎2 + 𝑏2 adalah ....","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"13"},{"key":"D","text":"25"}],"answer":"C","explanation":"Langkah 1: Dari persamaan kedua, kita dapatkan 𝑥= 4 −2𝑦. \nLangkah 2: Substitusikan ke persamaan pertama: 2(4 −2𝑦) −3𝑦= −13 ⇒8 −4𝑦−3𝑦= −13 ⇒\n−7𝑦= −21 ⇒𝑦= 3. \nLangkah 3: Cari nilai 𝑥: 𝑥= 4 −2(3) = −2. Diperoleh 𝑎= −2 dan 𝑏= 3. \nLangkah 4: Hitung 𝑎2 + 𝑏2 = (−2)2 + (3)2 = 4 + 9 = 13. \nJawaban Benar: C"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Selisih dua bilangan cacah adalah 6, sedangkan hasil penjumlahan kedua bilangan tersebut adalah 32. Berapakah hasil kali dari kedua bilangan tersebut?","options":[{"key":"A","text":"132."},{"key":"B","text":"190."},{"key":"C","text":"210."},{"key":"D","text":"247."}],"answer":"D","explanation":"Langkah 1: Misalkan dua bilangan cacah tersebut adalah 𝑥 dan 𝑦 dengan 𝑥> 𝑦. \nLangkah 2: Tulis sistem persamaan berdasarkan soal: 𝑥−𝑦= 6 dan 𝑥+ 𝑦= 32. \nLangkah 3: Jumlahkan kedua persamaan untuk mencari 𝑥: 2𝑥= 38 ⟹ 𝑥= 19. \nLangkah 4: Kurangkan kedua persamaan untuk mencari 𝑦: 2𝑦= 26 ⟹ 𝑦= 13. \nLangkah 5: Hitung hasil kali kedua bilangan tersebut: 𝑥× 𝑦= 19 × 13 = 247. \nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Selisih uang tabungan Amir dan Budi adalah Rp50.000,00 dengan uang Budi lebih banyak daripada uang Amir. Jika dua kali uang Amir ditambah tiga kali uang Budi adalah Rp600.000,00, berapakah jumlah uang tabungan Budi?","options":[{"key":"A","text":"Rp110.000,00"},{"key":"B","text":"Rp120.000,00"},{"key":"C","text":"Rp130.000,00"},{"key":"D","text":"Rp140.000,00"}],"answer":"D","explanation":"Langkah 1: Misalkan uang Amir adalah 𝑥 dan uang Budi adalah 𝑦. Diperoleh hubungan 𝑦−𝑥=\n50.000 ⟹ 𝑥= 𝑦−50.000. \nLangkah 2: Masukkan nilai 𝑥 tersebut ke dalam persamaan kedua: 2(𝑦−50.000) + 3𝑦= 600.000. \nLangkah 3: Sederhanakan persamaan satu variabel tersebut: 2𝑦−100.000 + 3𝑦= 600.000 ⟹\n 5𝑦= 700.000. \nLangkah 4: Bagi kedua ruas dengan 5: 𝑦= 140.000. Jadi, uang tabungan Budi adalah \nRp140.000,00. \nJawaban Benar: D"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Industri rumah tangga keripik tempe di Ngawi mengemas produknya ke dalam dua jenis ukuran, yaitu ukuran sedang dan ukuran besar. Berat bersih dari 4 kemasan sedang dan 3 kemasan besar adalah 2.300 gram. Sementara itu, berat bersih dari 2 kemasan sedang dan 5 kemasan besar adalah 2.900 gram. Jika seorang distributor memesan paket khusus yang berisi 6 kemasan sedang dan 4 kemasan besar, berapakah total berat bersih dari paket tersebut?","options":[{"key":"A","text":"2.800 gram"},{"key":"B","text":"3.000 gram"},{"key":"C","text":"3.200 gram"},{"key":"D","text":"3.400 gram"}],"answer":"C","explanation":"Langkah 1: Membuat model matematika. Misalkan berat satu kemasan sedang adalah 𝑠 gram \ndan satu kemasan besar adalah 𝑏 gram. \nPersamaan 1: 4𝑠+ 3𝑏= 2.300. \nPersamaan 2: 2𝑠+ 5𝑏= 2.900. \nLangkah 2: Selesaikan SPLDV dengan metode eliminasi. Kalikan Persamaan 2 dengan 2: \nPersamaan 2 (x2): 4𝑠+ 10𝑏= 5.800. \nKurangkan hasil di atas dengan Persamaan 1: \n(4𝑠+ 10𝑏) −(4𝑠+ 3𝑏) = 5.800 −2.300 ⟹ 7𝑏= 3.500 ⟹ 𝑏= 500 gram. \n\nSubstitusikan nilai 𝑏= 500 ke Persamaan 2: 2𝑠+ 5(500) = 2.900 ⟹ 2𝑠+ 2.500 = 2.900 ⟹\n 2𝑠= 400 ⟹ 𝑠= 200 gram. \nMaka berat kemasan sedang = 200 gram, dan kemasan besar = 500 gram. \nLangkah 3: Menghitung berat paket khusus (6 kemasan sedang dan 4 kemasan besar): \nTotal Berat = 6(200) + 4(500) = 1.200 + 2.000 = 3.200 gram. \nJawaban Benar: C"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Di sebuah rumah makan Padang, keluarga Ahmad membeli 3 porsi paket rendang dan 4 porsi paket ayam dengan total harga Rp135.000,00. Di rumah makan yang sama, keluarga Baskoro membeli 2 porsi paket rendang dan 3 porsi paket ayam dengan total harga Rp95.000,00. Jika keluarga Chandra membeli 4 porsi paket rendang dan 5 porsi paket ayam, kemudian mereka membayar menggunakan 4 lembar uang lima puluh ribuan, berapakah uang kembalian yang diterima keluarga Chandra?","options":[{"key":"A","text":"Rp15.000,00"},{"key":"B","text":"Rp20.000,00"},{"key":"C","text":"Rp25.000,00"},{"key":"D","text":"Rp30.000,00"}],"answer":"C","explanation":"Misalkan harga 1 porsi paket rendang adalah 𝑥 rupiah dan 1 porsi paket ayam adalah 𝑦 rupiah. \nBentuk sistem persamaannya adalah: \n1) 3𝑥+ 4𝑦= 135.000 \n2) 2𝑥+ 3𝑦= 95.000 \nEliminasi 𝑥 dengan mengalikan persamaan (1) dengan 2 dan persamaan (2) dengan 3: \n6x + 8y = 270.000$ \n6x + 9y = 285.000$ \nKurangkan kedua persamaan tersebut: \ny = 15.000$ rupiah (harga paket ayam) \nSubstitusikan 𝑦= 15.000 ke persamaan (2): \n2x + 3(15.000) = 95.000 \\implies 2x + 45.000 = 95.000 \\implies 2x = 50.000 \\implies x = 25.000$ \nrupiah (harga paket rendang) \nHitung total belanja keluarga Chandra (4 porsi paket rendang dan 5 porsi paket ayam): \n\\text{Total Belanja} = 4(25.000) + 5(15.000) = 100.000 + 75.000 = 175.000$ rupiah \nJumlah uang yang dibayarkan adalah 4 lembar Rp50.000,00 = Rp200.000,00. \nHitung kembaliannya: \n\\text{Kembalian} = 200.000 - 175.000 = 25.000$ rupiah \n\nUang kembalian yang diterima keluarga Chandra adalah Rp25.000,00. \nJawaban Benar: C"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Di sebuah pusat perbelanjaan di Surabaya, tarif parkir untuk mobil adalah Rp5.000,00 pada jam pertama dan Rp3.000,00 untuk setiap jam berikutnya. Sementara itu, tarif parkir untuk sepeda motor adalah Rp2.000,00 pada jam pertama dan Rp1.000,00 untuk setiap jam berikutnya. Jika seorang pengunjung memarkir satu unit mobil dan satu unit sepeda motor miliknya dalam durasi waktu yang sama dan membayar total parkir sebesar Rp35.000,00, berapa lamakah kedua kendaraan tersebut diparkir?","options":[{"key":"A","text":"7 jam"},{"key":"B","text":"8 jam"},{"key":"C","text":"9 jam"},{"key":"D","text":"10 jam"}],"answer":"B","explanation":"Langkah 1: Membuat model persamaan linier untuk total biaya parkir dengan 𝑡 sebagai durasi \nparkir dalam jam (𝑡> 1). \nBiaya Parkir Mobil: 𝐵𝑚𝑜𝑏𝑖𝑙= 5.000 + 3.000(𝑡−1). \nBiaya Parkir Motor: 𝐵𝑚𝑜𝑡𝑜𝑟= 2.000 + 1.000(𝑡−1). \nLangkah 2: Menjumlahkan kedua biaya parkir untuk menyelesaikan nilai 𝑡: \nTotal Biaya = 𝐵𝑚𝑜𝑏𝑖𝑙+ 𝐵𝑚𝑜𝑡𝑜𝑟= [5.000 + 3.000(𝑡−1)] + [2.000 + 1.000(𝑡−1)] = 35.000. \nSederhanakan persamaan: \n7.000 + 4.000(𝑡−1) = 35.000 ⟹ 4.000(𝑡−1) = 28.000. \nLangkah 3: Tentukan nilai 𝑡: \n𝑡−1 = 7 ⟹ 𝑡= 8 jam. Jadi, kendaraan diparkir selama 8 jam. \nJawaban Benar: B"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Ada dua persamaan linear dua variabel yang terdefinisi pada koordinat bidang datar. Persamaan kesatu digambarkan oleh garis 𝑦= 2𝑥+ 1 dan persamaan kedua diwakili oleh garis 𝑦= 2𝑥+ 5. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan dengan karakteristik hubungan kedua garis ini!","statements":[{"text":"Nilai parameter kemiringan atau koefisien gradien pada kedua persamaan garis di atas memiliki besar yang setara yakni bernilai 2.","answer":"Benar","explanation":"Penaksiran parameter arah lereng dinilai melalui kemiripan komponen standard variabel 𝑦=\n𝑚𝑥+ 𝑐 berpangkat tunggal, di mana angka penggantung m dari masing-masing formula sejajar \nbernilai 2."},{"text":"Kedua persamaan tersebut secara geometri kartesius digambarkan dalam pola kedudukan garis lurus yang saling sejajar satu sama lain.","answer":"Benar","explanation":"Sebab nilai gradien yang diidentifikasi sepadan yaitu 2 tetapi dengan intersep konstanta \npenambah ketinggian bernilai berbeda (1 dan 5), letak lintasan lurus pasti akan paralel-sejajar."},{"text":"Kedua susunan persamaan linear ini dapat dipandang sebagai sebuah sistem terintegrasi yang menghasilkan penyelesaian bernilai tak terhingga.","answer":"Salah","explanation":"Sepasang lintasan terpisah lurus bertipe kedudukan paralel-sejajar selamanya tidak berkontak \nsenggol bertemu silang, dengan demikian tidak ada satupun selesaian penyelesaian (himpunan \nkosong)."},{"text":"Pasangan terurut berpasangan di titik koordinat (1,3) memenuhi kedua syarat di masing- masing persamaan sebagai titik persekutuan garis potongnya.","answer":"Salah","explanation":"Pasangan (1,3) setelah divalidasi ke rumus persamaan pertama benar memenuhi (3 = 2(1) + 1), \nnamun ia memicu nilai sesat ketika dimasukkan pada persamaan garis kedua karena \nmenghasilkan 3 ≠7."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Dalam aktivitas belajar mengajar di sekolah, seorang guru memajang variasi dari barisan fungsi dan bentuk persamaan matematis pada bidang papan tulis tulis kelas: (i) 2𝑥−5𝑦= 10, (ii) 3𝑥+ 𝑦2 = 7, (iii) 𝑥+ 2 = 𝑦, serta (iv) 4𝑎−3𝑏+ 2𝑐= 1. Beri tanda centang (✓) pada setiap pernyataan teoretis yang dideskripsikan secara tepat berdasarkan barisan persamaan linear berikut!","statements":[{"text":"Secara kategori sifat kelinieran dan derajat variabelnya, bagian dari barisan bentuk (i) serta bentuk (iii) memenuhi syarat kelayakan sebagai SPLDV.","answer":"Benar","explanation":"Kedua bentuk (i) dan (iii) tepat mengandung variabel 𝑥 dan 𝑦 yang memiliki pangkat linear \nberderajat tertinggi satu, serta terhubung dengan konstan rasional baku."},{"text":"Karakter persamaan bagian (ii) dinilai masuk kriteria kelompok linear karena memiliki tepat dua unsur peubah abjad bervariasi.","answer":"Salah","explanation":"Sifat kelinearan mewajibkan pangkat setiap peubah hanya bernilai satu. Sifat di opsi ini dilanggar \noleh adanya bentuk non-linear berupa 𝑦2 pada persamaan (ii)."},{"text":"Model dalam nomor (iv) tepat dimasukkan pada materi konsep dari pembelajaran Persamaan Linear Dua Variabel umum.","answer":"Salah","explanation":"Secara eksplisit nomor (iv) memanfaatkan sejumlah tiga tipe peubah variabel berbeda yang \nmenyusun persamaan tersebut, yaitu 𝑎, 𝑏, dan 𝑐 (Persamaan Linear Tiga Variabel)."},{"text":"Pada unsur persamaan pertama nomor (i), besaran konstanta pengenal numerik variabel 𝑥 adalah 2, dan pengenal baur variabel 𝑦 setara −5.","answer":"Benar","explanation":"Koefisien di depan suku berpeubah 𝑥 berharga angka positif 2, sedang pada lambang visual \ndidepan suku berpeubah 𝑦 nilainya tertera mengikut tanda negatif yaitu −5."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Berdasarkan sepasang garis persamaan linear pada satu bidang datar yang digambarkan dalam rumus model 2𝑥−𝑦= 5 bersama dengan fungsi pembentuk 𝑥+ 𝑦= 4, tentukan benar atau salah untuk masing-masing opsi interpretasi sifat kelengkapannya!","statements":[{"text":"Jika diuji coba secara langsung menggunakan masukan koordinat tunggal (4,0), hasil hitung dari dua rumusan fungsinya secara bersamaan akan menghasilkan kebenaran yang konsisten.","answer":"Salah","explanation":"Titik (4,0) jika dimasukkan pada persamaan kesatu menghasilkan nilai salah 2(4) −0 = 8 ≠5."},{"text":"Substitusi langsung atas letak nilai pasangan titik uji (3,1) menghasilkan hubungan bernilai logis di model kedua 𝑥+ 𝑦= 4.","answer":"Benar","explanation":"Nilai operasional pengganti peubah menghasilkan kecocokan benar pada salah satu model fungsi \nyaitu 3 + 1 = 4."},{"text":"Jika koordinat perpotongannya berada di (3,1), hasil dari hitungan selisih antara nilai peubah yang dihitung yaitu 𝑥−𝑦 bernilai 3.","answer":"Salah","explanation":"Selisih antarsuku nilai koordinat persilangan garis sistem ini yang valid semestinya dioperasikan \n𝑥−𝑦= 3 −1 = 2, bukan 3."},{"text":"Himpunan penyelesaian sistem dari kedua garis matematika pembentuk model di atas bersifat tunggal di satu posisi koordinat temu.","answer":"Benar","explanation":"Karena rasio kemiringan (gradien) antargaris penyusun tersebut bernilai tidak sejajar, kedua garis \nmemiliki posisi persimpangan tunggal di titik potong Kartesius."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Gilang membeli kebutuhan alat tulis untuk praktikumnya. Ia harus membayar uang total senilai Rp46.000,00 untuk 4 kotak pensil plastik dan 3 buah rautan pensil. Temannya yang bernama Dina membeli alat sejenis dengan membayar Rp30.000,00 untuk 2 kotak pensil plastik dan 5 buah rautan pensil di kios yang sama. Pilihlah semua pernyataan yang bernilai benar!","statements":[{"text":"Harga satu kotak pensil adalah Rp10.000,00.","answer":"Benar","explanation":"Sistem persamaannya ditulis 4𝑝+ 3𝑟= 46.000 dan 2𝑝+ 5𝑟= 30.000. Kalikan persamaan kedua \ndengan 2 didapatkan 4𝑝+ 10𝑟= 60.000. Nilai selisih kedua persamaan adalah 7𝑟= 14.000 ⟹\n 𝑟= 2.000. Dari substitusi nilai, harga satu buah kotak pensil diperoleh senilai 𝑝= 10.000 rupiah."},{"text":"Selisih harga kotak pensil dan rautan adalah Rp8.000,00.","answer":"Benar","explanation":"Hasil dari pengurangan harga kotak pensil 𝑝= 10.000 dan harga rautan 𝑟= 2.000 diperoleh \nsenilai 10.000 −2.000 = 8.000 rupiah."},{"text":"Jika ingin membeli 1 kotak pensil dan 3 rautan, Gilang membutuhkan uang sebanyak Rp18.000,00.","answer":"Salah","explanation":"Hitungan biaya dari satu buah kotak pensil dan tiga buah rautan dirumuskan 𝑝+ 3𝑟= 10.000 +\n3(2.000) = 10.000 + 6.000 = 16.000 rupiah, bukan Rp18.000,00."},{"text":"Harga satu rautan adalah Rp2.500,00.","answer":"Salah","explanation":"Sesuai hitungan sebelumnya, didapatkan harga satuan rautan (𝑟) yang benar sebesar \nRp2.000,00."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Diberikan dua buah fungsi atau SPLDV yang saling berpotongan yaitu 𝑥−𝑦= −3 dan 2𝑥+ 𝑦= 6. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Penyelesaian dari nilai koordinat 𝑦 adalah empat kali dari hasil nilai variabel 𝑥.","answer":"Benar","explanation":"Menyelesaikan eliminasi sederhana dengan penjumlahan persamaan: 3𝑥= 3 ⟹ 𝑥= 1 dan 𝑦=\n1 −(−3) = 4. Jadi penyelesaiannya adalah (1,4). Variabel 𝑦 adalah 4 yang nilainya sama dengan \n4 × 1 (𝑥)."},{"text":"Nilai kombinasi operasi aljabar hasil fungsi 2𝑥−𝑦 bernilai 2.","answer":"Salah","explanation":"Melalui substitusi nilai koordinat titik potong 2(1) −4 = 2 −4 = −2. Jawaban hasil sebenarnya \nbernilai −2, tidak positif."},{"text":"Posisi letak titik persekutuan garis berada tepat di daerah wilayah Kuadran I Kartesius.","answer":"Benar","explanation":"Koordinat hasil titik potong penyelesaian sistem tersebut berada di (1,4). Kedua koordinat \nbertanda positif (𝑥> 0, 𝑦> 0) maka lokasinya tepat di kuadran I."},{"text":"Hasil dari penjumlahan nilai dari koordinat variabel penyelesaian atau 𝑥+ 𝑦 bernilai 5.","answer":"Benar","explanation":"Mendapatkan nilai perhitungan dari penggabungan hasil penyelesaian secara penjumlahan \nsederhana, 𝑥+ 𝑦= 1 + 4 = 5, pernyataan bernilai benar."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Seorang arsitek kota merancang sebidang taman bunga terbuka hijau di kompleks perumahan baru berbentuk persegi panjang. Rancangan gambar kerja menyatakan bahwa batas keliling sekeliling bidang taman bunga hijau tersebut direncanakan berukuran tepat 50 meter. Di samping itu, ukuran rancang panjang sisi taman bunga dikurangi ukuran lebar sisinya didapati memiliki ukuran selisih persis sebesar 5 meter. Beri tanda centang (✓) pada setiap pernyataan yang dinilai benar atas data spasial bidang tanah arsitek taman ini!","statements":[{"text":"Dimensi spasial untuk ukuran rancangan batas lebar taman di lokasi itu setara panjang ukuran lebar sisi sebesar 10 meter.","answer":"Benar","explanation":"Dari stimulus geometris: Rumus keliling 2(𝑝+ 𝑙) = 50 ⟹ 𝑝+ 𝑙= 25 dan selisih model panjang \ndikurang lebar 𝑝−𝑙= 5. Menjumlahkan persamaan diperoleh 2𝑝= 30 ⟹ 𝑝= 15 meter (panjang \nrancangan). Substitusi kembali 15 + 𝑙= 25 ⟹ 𝑙= 10 meter (lebar rancangan). Lebar benar \nberukuran 10 meter."},{"text":"Sisi bagian dimensi paling panjang batas dinding pembatas taman rancangan memiliki nilai kuantitas dimensi fisik sejauh 15 meter.","answer":"Benar","explanation":"Aturan dasar eliminasi di atas memperlihatkan penyelesaian matematis menghasilkan angka \nukuran variabel dimensi rancangan bagian terpanjang (𝑝) sebesar 15 meter."},{"text":"Permukaan atas dari total lahan area hijau bagi penempatan bunga di sebidang taman tersebut adalah seluas 150 meter persegi.","answer":"Benar","explanation":"Sesuai rumus baku bangun luas berbidang persegi panjang yaitu mengalikan bagian dimensi \npanjang dikalikan ukuran dimensi lebar: 𝐿= 𝑝× 𝑙= 15 𝑚𝑒𝑡𝑒𝑟× 10 𝑚𝑒𝑡𝑒𝑟= 150 meter persegi. \nPernyataan bernilai benar."},{"text":"Bentuk perbandingan nilai antara kuantitas variabel panjang terluar terhadap lebar dari bidang rancang taman kota setara pecahan paling kecil sebesar 4: 3.","answer":"Salah","explanation":"Mencari perbandingan asli sisi persegi panjang tersebut dengan melakukan penyederhanaan \nkuantitas nilai 𝑝: 𝑙 ⟹ 15: 10 = 3: 2. Rasio bernilai salah jika dicantumkan angka senilai rasio \npecahan 4: 3."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Di sebuah kedai jajanan boba, Dina memesan hidangan beberapa jenis minuman manis favorit kumpulannya bersama kawan sekolah. Hari kesatu belanjaannya melunasi pengeluaran total nominal Rp44.000 setelah ia melakukan order berisi 2 gelas Thai Tea manis serta 3 gelas Milk Tea boba. Sehari kemudian pada transaksi kedua untuk pemesanan 3 gelas Thai Tea dan 2 gelas Milk Tea pada gerai serta volume yang setara, biaya transaksi tercatat tepat Rp46.000. Beri tanda centang pada setiap pernyataan yang benar mengenai analisis penganggaran pembelian di toko boba tersebut!","statements":[{"text":"Harga satu gelas Thai Tea adalah Rp10.000.","answer":"Benar","explanation":"Asumsikan Thai Tea adalah 𝑥 dan Milk Tea adalah 𝑦. Pola persamaannya: 2𝑥+ 3𝑦= 44.000 \n(Eq1) dan 3𝑥+ 2𝑦= 46.000 (Eq2). Kalikan Eq1 dengan 3 menjadi 6𝑥+ 9𝑦= 132.000, kalikan \nEq2 dengan 2 diperoleh hasil 6𝑥+ 4𝑦= 92.000. Kurangi persamaan anyar satu sama lain: \ndidapat selisih 5𝑦= 40.000, sehingga 𝑦= 8.000. Untuk hitung nilai 𝑥 (Thai Tea): masukkan ke \nsatu perbandingan persamaan lama: 2𝑥+ 3(8.000) = 44.000 ⟹ 2𝑥= 20.000 ⟹ 𝑥= 10.000. \nHasil ini membuktikan keaslian harga Thai Tea senilai Rp10.000. Pernyataan ini benar."},{"text":"Harga satu gelas Milk Tea adalah Rp8.000.","answer":"Benar","explanation":"Berdasarkan penjabaran logis aljabar, didapatkan variabel pembobot dari Milk Tea (𝑦) senilai \nRp8.000. Hasil ini akurat. Pernyataan ini benar."},{"text":"Selisih harga per gelas antara kedua jenis minuman boba tersebut adalah Rp2.000.","answer":"Benar","explanation":"Kalkulasikan beda selisih harga antarsatuannya: 10.000 −8.000 = 𝑅𝑝2.000. Selisihnya bernilai \nvalid sesuai besaran ini. Pernyataan ini benar."},{"text":"Jika seseorang membeli 1 Thai Tea dan 3 Milk Tea, total harga yang harus dibayar adalah Rp32.000.","answer":"Salah","explanation":"Biaya yang terkalkulasi sesungguhnya jika merangkum pembelanjaan dengan kuantiti baru \nadalah 𝑥+ 3𝑦= 10.000 + 3(8.000) = 10.000 + 24.000 = 𝑅𝑝34.000, bukan Rp32.000. Pernyataan \nini salah."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Panitia festival angklung menjual tiket untuk dua kategori penonton, yaitu Kategori Reguler dan Kategori VIP. Hasil penjualan tiket pada hari pertama terkumpul sebesar Rp4.600.000 dari penjualan 25 tiket Reguler dan 15 tiket VIP. Sedangkan pada hari kedua diperoleh total pendapatan Rp6.200.000 dari penjualan 35 tiket Reguler dan 20 tiket VIP. Beri tanda centang pada setiap pernyataan yang benar berdasarkan informasi penjualan tiket tersebut!","statements":[{"text":"Harga satu tiket VIP adalah Rp240.000.","answer":"Benar","explanation":"Sistem persamaannya adalah 25𝑥+ 15𝑦= 4.600.000 (sederhana: 5𝑥+ 3𝑦= 920.000) dan 35𝑥+\n20𝑦= 6.200.000 (sederhana: 7𝑥+ 4𝑦= 1.240.000). Melalui proses eliminasi-substitusi dari kedua \npersamaan yang disederhanakan tersebut, kita kalikan persamaan pertama dengan 4 sehingga \n20𝑥+ 12𝑦= 3.680.000, dan persamaan kedua dengan 3 sehingga 21𝑥+ 12𝑦= 3.720.000. \nSelisih kedua persamaan menghasilkan harga tiket Reguler (𝑥) sebesar Rp40.000. Substitusi nilai \n𝑥 memberikan harga tiket VIP (𝑦) sebesar Rp240.000. Pernyataan ini benar."},{"text":"Harga satu tiket Reguler adalah Rp50.000.","answer":"Salah","explanation":"Berdasarkan penyelesaian SPLDV, nilai 𝑥 atau harga tiket Reguler yang diperoleh adalah \nRp40.000, bukan Rp50.000. Pernyataan ini salah."},{"text":"Satu tiket VIP setara dengan harga 6 tiket Reguler.","answer":"Benar","explanation":"Kita bandingkan harga satu tiket VIP (Rp240.000) dengan harga tiket Reguler (Rp40.000). Karena \n240.000 = 6 × 40.000, nilai perbandingannya tepat setara dengan 6 tiket Reguler. Pernyataan ini \nbenar."},{"text":"Selisih harga tiket Kategori VIP dan Kategori Reguler adalah Rp200.000.","answer":"Benar","explanation":"Kita kurangi harga tiket VIP dengan tiket Reguler: 240.000 −40.000 = 𝑅𝑝200.000. Pernyataan ini \nbenar."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, memodelkan dan menentukan penyelesaian \nsistem persamaan linier dua variabel dengan metode (grafik, \nsubtitusi, eliminasi, dan campuran) serta menyelesaikan \npermasalahan kontekstual yang terkait.","question":"Sebuah pusat hiburan memiliki dua jasa rental konsol permainan. Rental A memberlakukan tarif berupa biaya administrasi wajib sebesar Rp20.000,00 di awal ditambah tarif penggunaan jasa sebesar Rp10.000,00 per jamnya, sedangkan Rental B menerapkan skema bebas biaya pendaftaran awal tetapi memiliki tarif sewa flat sebesar Rp15.000,00 per jam. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan dengan pengambilan keputusan ekonomis durasi penyewaan kedua jasa tersebut!","statements":[{"text":"Jika durasi rencana durasi pemanfaatan konsol permainan berjalan dalam alokasi waktu persis selama 4 jam, tanggungan ongkos bayar di kedua rental akan bernilai sebanding dan seimbang.","answer":"Benar","explanation":"Formula model keuangan jasa persewaan game konsol: 𝑌𝑎= 20.000 + 10.000𝑡 dan 𝑌𝑏= 15.000𝑡. \nUntuk parameter interval waktu durasi bermain 𝑡= 4, diperoleh hitungan aljabar pengeluaran \nRental A: 𝑌𝑎= 20.000 + 40.000 = 𝑅𝑝60.000,00. Serta rincian tagihan Rental B: 𝑌𝑏= 15.000 × 4 =\n𝑅𝑝60.000,00 (keduanya bernilai setara sama besar)."},{"text":"Jika target bermain konsol seorang konsumen dialokasikan pendek saja dengan durasi di bawah 3 jam, tagihan sewa pada jasa persewaan B bernilai relatif lebih irit ketimbang biaya pada sewa persewaan A.","answer":"Benar","explanation":"Ditaksir kalkulasi biaya sewa pada tingkat waktu 3 jam: tagihan dari penyedia B adalah \nRp45.000,00, sedangkan untuk opsi A berkisar setara Rp50.000,00. Terbukti B menawarkan \nkemanfaatan pengeluaran anggaran yang lebih ekonomis."},{"text":"Bagi tipe penikmat game hobi konsol dengan rencana penggunaan waktu 5 jam bermain nonstop, memilih transaksi lewat penyewa Rental A memangkas kerugian pengeluaran.","answer":"Benar","explanation":"Pada jam bermain 𝑡= 5, ongkos yang dibebankan pihak pengelola A adalah sebesar: \n𝑅𝑝20.000,00 + 𝑅𝑝50.000,00 = 𝑅𝑝70.000,00. Bandingkan bila menyewa dari kubu B yang akan \nmengenakan total tagihan: 𝑅𝑝15.000,00 × 5 = 𝑅𝑝75.000,00. Diperoleh simpulan rasional untuk \nmemutuskan sewa Rental A agar hemat."},{"text":"Rata-rata pengeluaran rata-rata rupiah per jam yang dibebankan kepada pelanggan oleh Rental A pada penyewaan 2 jam pertamanya adalah Rp15.000,00.","answer":"Salah","explanation":"Sewa 2 jam di persewaan A totalnya 𝑅𝑝20.000,00 + (𝑅𝑝10.000,00 × 2) = 𝑅𝑝40.000,00. Nilai rerata \nongkos biaya tiap satu jam untuk transaksi tipe durasi 2 jam tersebut berkisar: 𝑅𝑝40.000,00 ÷ 2 =\n𝑅𝑝20.000,00 per jamnya."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
