<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Ukuran Pemusatan dan Penyebaran Data</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT UKURAN PEMUSATAN DAN PENYEBARAN DATA</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 36</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 36</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Tinggi badan lima orang balita di sebuah klinik kesehatan setelah diukur adalah 80 cm, 72 cm, 85 cm, 92 cm, dan 75 cm. Jangkauan tinggi badan balita tersebut adalah ....","options":[{"key":"A","text":"12 cm"},{"key":"B","text":"15 cm"},{"key":"C","text":"17 cm"},{"key":"D","text":"20 cm"}],"answer":"D","explanation":"Identifikasi nilai tinggi badan tertinggi dan terendah dari data: tinggi badan tertinggi adalah 92 cm \ndan terendah adalah 72 cm. \nHitung jangkauan (selisih nilai tertinggi dan terendah): 92 𝑐𝑚−72 𝑐𝑚= 20 𝑐𝑚."},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Tinggi bibit pohon mangga (dalam cm) yang diukur oleh kelompok tani adalah 20 cm, 21 cm, 22 cm, 24 cm, 25 cm, 26 cm, dan 28 cm. Median dari tinggi bibit pohon mangga tersebut adalah ....","options":[{"key":"A","text":"21 cm"},{"key":"B","text":"22 cm"},{"key":"C","text":"24 cm"},{"key":"D","text":"25 cm"}],"answer":"C","explanation":"Langkah 1: Mengurutkan data tinggi bibit dari yang terkecil hingga terbesar: 20,21,22,24,25,26,28. \nBanyak data (𝑛) adalah 7 (ganjil). \nLangkah 2: Menentukan letak median pada data ganjil, yaitu data ke-\n𝑛+1\n2 =\n7+1\n2 = 4. Data ke-4 \nadalah 24 cm."},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Suhu air di dalam sebuah wadah penelitian diukur selama empat kali dan hasilnya adalah 15∘C, 18∘C, 20∘C, dan 25∘C. Jangkauan (range) dari suhu air tersebut adalah ....","options":[{"key":"A","text":"5∘C"},{"key":"B","text":"7∘C"},{"key":"C","text":"8∘C"},{"key":"D","text":"10∘C"}],"answer":"D","explanation":"Langkah 1: Tentukan suhu terbesar (25∘C) and suhu terkecil (15∘C). \nLangkah 2: Hitung jangkauan dengan rumus 𝑅= 𝑥𝑚𝑎𝑘𝑠−𝑥𝑚𝑖𝑛= 25 −15 = 10∘C."},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Penjual martabak manis mencatat jumlah martabak yang terjual selama 8 hari berturut-turut, yaitu: 15 porsi, 18 porsi, 15 porsi, 20 porsi, 22 porsi, 15 porsi, 25 porsi, dan 22 porsi. Jumlah dari modus dan rata-rata penjualan martabak tersebut adalah ....","options":[{"key":"A","text":"32 porsi"},{"key":"B","text":"34 porsi"},{"key":"C","text":"36 porsi"},{"key":"D","text":"38 porsi"}],"answer":"B","explanation":"Langkah 1: Cari modus penjualan. Jumlah porsi yang paling sering muncul adalah 15 porsi \n(sebanyak 3 kali), maka modus = 15. \nLangkah 2: Hitung rata-rata penjualan: \n15+18+15+20+22+15+25+22\n8\n=\n152\n8 = 19 porsi. \n\nLangkah 3: Jumlahkan modus dan rata-rata penjualan tersebut: 15 + 19 = 34 porsi."},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Banyak kunjungan perpustakaan harian selama hari Senin hingga Kamis berturut-turut adalah 45, 52, 48, dan 55 orang. Jika rata-rata kunjungan dari hari Senin hingga Jumat (5 hari kerja) adalah 50 orang, berapakah selisih kunjungan pada hari Jumat dengan hari Senin?","options":[{"key":"A","text":"5 orang"},{"key":"B","text":"10 orang"},{"key":"C","text":"15 orang"},{"key":"D","text":"50 orang"}],"answer":"A","explanation":"Langkah 1: Menentukan jumlah kunjungan pada hari Jumat. Total kunjungan 5 hari = 5 × 50 =\n250 orang. Jumlah kunjungan Senin-Kamis = 45 + 52 + 48 + 55 = 200 orang. Kunjungan hari \nJumat = 250 −200 = 50 orang. \nLangkah 2: Menghitung selisih kunjungan hari Jumat dengan hari Senin: 50 −45 = 5 orang."},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Nilai ujian matematika dari lima orang siswa adalah 70, 80, 90, 𝑥, dan 100. Jika rata-rata nilai ujian kelima siswa tersebut adalah 85, tentukan nilai dari 2𝑥−30.","options":[{"key":"A","text":"85"},{"key":"B","text":"90"},{"key":"C","text":"140"},{"key":"D","text":"200"}],"answer":"C","explanation":"Langkah 1: Menentukan nilai 𝑥 menggunakan rumus rata-rata. Rata-rata = \n70+80+90+𝑥+100\n5\n= 85. \nMaka, 340 + 𝑥= 425, sehingga 𝑥= 85. \nLangkah 2: Menghitung nilai dari 2𝑥−30. Substitusi 𝑥= 85 ke dalam ekspresi: 2(85) −30 =\n170 −30 = 140."},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Seorang peneliti mencatat tinggi badan 10 bibit pohon jati (dalam cm) sebagai berikut: 12, 14, 15, 17, 𝑥, 19, 20, 22, 24, 𝑦. Data tersebut telah diurutkan dari yang terkecil hingga terbesar. Jika rata- rata tinggi bibit adalah 18,7 cm dan jangkauan (range) data tersebut adalah 14 cm, berapakah nilai dari 2𝑥+ 𝑦?","options":[{"key":"A","text":"56"},{"key":"B","text":"58"},{"key":"C","text":"60"},{"key":"D","text":"62"}],"answer":"D","explanation":"Berdasarkan rumus jangkauan, 𝑦−12 = 14 ⟹ 𝑦= 26. \nBerdasarkan rata-rata, total tinggi 10 bibit adalah 10 × 18,7 = 187 cm. \nJumlah seluruh data yang diketahui: 12 + 14 + 15 + 17 + 19 + 20 + 22 + 24 + 26 = 169 cm. \nMencari nilai 𝑥: 𝑥= 187 −169 = 18 cm. \nMenghitung nilai 2𝑥+ 𝑦= 2(18) + 26 = 36 + 26 = 62."},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Suatu kelompok data terdiri dari 5 bilangan bulat positif yang telah diurutkan dari terkecil ke terbesar, yaitu 4, 𝑥, 𝑦, 10,12. Jika median dari data tersebut adalah 7 dan rata-ratanya adalah 8, berapakah nilai dari 2𝑥+ 𝑦?","options":[{"key":"A","text":"18"},{"key":"B","text":"19"},{"key":"C","text":"21"},{"key":"D","text":"23"}],"answer":"C","explanation":"Langkah 1: Karena data sudah diurutkan dan berjumlah ganjil (5 data), median data tersebut \nadalah data ke-3, yaitu 𝑦. Diketahui median adalah 7, maka diperoleh 𝑦= 7. \nLangkah 2: Tulis persamaan rata-rata kelompok data tersebut: \n4+𝑥+7+10+12\n5\n= 8 ⟹ 33 + 𝑥=\n40 ⟹ 𝑥= 7. \n\nLangkah 3: Hitung nilai dari 2𝑥+ 𝑦, yaitu 2(7) + 7 = 14 + 7 = 21."},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Terdapat 7 buah paket kiriman logistik dengan berat (dalam kg) yang sudah diurutkan dari yang teringan hingga terberat sebagai berikut: 2, 4, 5, 𝑎, 8, 10, 𝑏. Diketahui median dari berat paket tersebut adalah 7 kg. Jika jangkauan (selisih antara paket terberat dan teringan) adalah 11 kg, berapakah rata-rata berat dari ketujuh paket tersebut?","options":[{"key":"A","text":"6,5 kg"},{"key":"B","text":"7,0 kg"},{"key":"C","text":"7,5 kg"},{"key":"D","text":"8,0 kg"}],"answer":"B","explanation":"Karena data sudah terurut dan berjumlah ganjil (7 data), median adalah data ke-4, sehingga 𝑎=\n7 kg. \nBerdasarkan jangkauan 11 kg dan berat paket teringan 2 kg, berat paket terberat adalah 𝑏= 2 +\n11 = 13 kg. \nData lengkap berat paket adalah 2, 4, 5, 7, 8, 10, 13 kg. \nJumlah total berat paket adalah 2 + 4 + 5 + 7 + 8 + 10 + 13 = 49 kg. \nRata-rata berat paket adalah \n49\n7 = 7,0 kg."},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Lima orang siswa mengukur berat badannya dan diperoleh data berturut-turut 42 kg, 45 kg, 48 kg, 50 kg, dan 55 kg. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai ukuran pemusatan dan penyebaran dari data tersebut!","statements":[{"text":"Rata-rata (mean) berat badan dari kelima siswa tersebut adalah 48 kg.","answer":"Benar","explanation":"Jumlah berat badan total = 42 + 45 + 48 + 50 + 55 = 240 kg. Nilai rata-rata dihitung dengan \npembagian total data dengan jumlah anak: 240/5 = 48 kg."},{"text":"Median dari berat badan kelima siswa tersebut adalah 48 kg.","answer":"Benar","explanation":"Ketika data diurutkan dari yang terkecil: 42, 45, 48, 50, 55, nilai tengah yang tepat berada pada \nurutan ke-3 adalah 48 kg."},{"text":"Modus dari data berat badan siswa tersebut adalah 48 kg.","answer":"Salah","explanation":"Seluruh berat badan siswa muncul tepat satu kali (masing-masing memiliki frekuensi 1), sehingga \nkelompok data tersebut tidak memiliki nilai modus."},{"text":"Jangkauan (range) dari berat badan kelima siswa tersebut adalah 10 kg.","answer":"Salah","explanation":"Jangkauan ditentukan dengan mengurangkan berat badan tertinggi dengan terrendah, yaitu 55 −\n42 = 13 kg, bukan 10 kg."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Seorang siswa mengukur tinggi lima buah bibit tanaman cabai di kebun sekolah dan mencatat hasilnya dalam sentimeter sebagai berikut: 12, 15, 12, 18, dan 13. Beri tanda centang pada setiap pernyataan yang benar mengenai sebaran tinggi tanaman tersebut!","statements":[{"text":"Tinggi bibit tanaman cabai yang paling pendek adalah 12 cm.","answer":"Benar","explanation":"Dari kelima data tersebut, nilai numerik yang paling kecil atau terendah adalah 12 cm."},{"text":"Nilai modus untuk tinggi tanaman cabai berdasarkan data adalah 13 cm.","answer":"Salah","explanation":"Angka yang memiliki frekuensi muncul terbanyak adalah 12 cm (muncul 2 kali), sehingga \nmodusnya adalah 12 cm."},{"text":"Rentang nilai jangkauan (range) dari tinggi tanaman tersebut adalah 6 cm.","answer":"Benar","explanation":"Jangkauan diperoleh dari data terbesar dikurangi terkecil: 18 cm - 12 cm = 6 cm."},{"text":"Rata-rata tinggi tanaman cabai setelah dihitung dari seluruh bibit adalah 12 cm.","answer":"Salah","explanation":"Rata-rata dihitung dari jumlah seluruh data dibagi jumlah tanaman: (12 + 15 + 12 + 18 + 13) / 5 = \n70 / 5 = 14 cm."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Hasil ulangan harian dari enam siswa pada suatu kelas dicatat sebagai berikut: 70, 80, 80, 90, 100, dan 60. Pengawas ingin merangkum pemusatan serta sebaran nilai ulangan harian para siswa tersebut. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Nilai median atau nilai tengah dari ujian para siswa tersebut adalah 80.","answer":"Benar","explanation":"Urutan data genap ini: 60, 70, 80, 80, 90, 100. Nilai median didapat dari rerata data ke-3 dan data \nke-4, yaitu: \n80+80\n2\n= 80."},{"text":"Rata-rata nilai ulangan siswa dari kelas di atas adalah sebesar 75.","answer":"Salah","explanation":"Rerata didapat dari hasil penjumlahan: (60 + 70 + 80 + 80 + 90 + 100) ÷ 6 = 480 ÷ 6 = 80, \nbukan 75."},{"text":"Modus untuk capaian nilai ulangan tersebut adalah 80.","answer":"Benar","explanation":"Sebab nilai 80 memiliki tingkat keseringan muncul terbesar sebanyak 2 kali dibanding data yang \nlain."},{"text":"Ukuran sebaran data (jangkauan) untuk nilai harian tersebut adalah 30.","answer":"Salah","explanation":"Nilai tertinggi = 100 dan Nilai terendah = 60. Maka Jangkauan = 100 −60 = 40."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Pemilik sebuah gerai minimarket mencatat bahwa rata-rata upah per minggu untuk 12 orang pramuniaga paruh waktu adalah Rp600.000,00, kemudian setelah 2 orang pramuniaga senior berhenti kerja, rata-rata upah dari 10 pramuniaga yang tersisa turun menjadi Rp580.000,00. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan dengan analisis beban pengeluaran upah gerai tersebut!","statements":[{"text":"Alokasi dari jumlah akumulasi upah para pramuniaga sewaktu komposisi lengkap (12 pekerja) yaitu Rp7.200.000,00.","answer":"Benar","explanation":"Beban dana total pramuniaga sewaktu berisikan dua belas staf lengkap = 12 × 𝑅𝑝600.000,00 =\n𝑅𝑝7.200.000,00."},{"text":"Penyerapan jumlah gaji total kedua pekerja tingkat senior pramuniaga yang keluar adalah sebesar Rp1.400.000,00.","answer":"Benar","explanation":"Jumlah upah sisa untuk sepuluh karyawan adalah 10 × 𝑅𝑝580.000,00 = 𝑅𝑝5.800.000,00. \nAkumulasi gaji kedua senior: 𝑅𝑝7.200.000,00 −𝑅𝑝5.800.000,00 = 𝑅𝑝1.400.000,00."},{"text":"Beban nilai upah rerata masing-masing pramuniaga tingkat senior yang sudah berhenti berkarya hanya Rp500.000,00.","answer":"Salah","explanation":"Gaji gabungan berdua senior tersebut senilai Rp1.400.000,00, maka gaji rata-ratanya: \n𝑅𝑝1.400.000,00 ÷ 2 = 𝑅𝑝700.000,00."},{"text":"Nilai dari pengurangan upah gabungan menyebabkan kerugian total gerai bulanan sebanyak Rp4.000.000,00.","answer":"Salah","explanation":"Kepergian karyawan senior mengurangi pengeluaran berkala per minggu sebesar \nRp1.400.000,00."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Pengurus sebuah klub bulu tangkis mencatat berat badan empat atlet pemula (dalam kg), yaitu 54, 62, 58, dan 𝑥. Diketahui bahwa rata-rata berat badan keseluruhan atlet di klub pemula tersebut bernilai 58 kg. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Variabel berat badan atlet keempat yang dicari yaitu nilai 𝑥 adalah sebesar 58 kg.","answer":"Benar","explanation":"Langkah 1: Menggunakan rumus rata-rata (54 + 62 + 58 + 𝑥)/4 = 58 sehingga 174 + 𝑥= 232. \nLangkah 2: Menyelesaikan aljabar didapat 𝑥= 232 −174 = 58 kg."},{"text":"Median data dari seluruh berat badan setelah diurutkan menaik adalah 56 kg.","answer":"Salah","explanation":"Langkah 1: Dengan menyertakan nilai 𝑥= 58, didapat urutan data berat badan yaitu 54,58,58,62. \nLangkah 2: Nilai median dihitung dari rata-rata data di urutan tengah, yaitu (58 + 58)/2 = 58 kg. \nMaka pernyataan bernilai 56 kg adalah salah."},{"text":"Jangkauan atau nilai rentang perbedaan berat badan dari data atlet tersebut adalah 8 kg.","answer":"Benar","explanation":"Langkah 1: Menentukan nilai terberat (62 kg) dan nilai teringan (54 kg) pada kelompok data \nlengkap. Langkah 2: Menghitung selisih data maksimum dan minimum yaitu 62 −54 = 8 kg."},{"text":"Nilai modus data atlet bulu tangkis pemula ini sebesar 54 kg.","answer":"Salah","explanation":"Langkah 1: Menghitung distribusi frekuensi, berat 54 kg muncul sebanyak 1 kali sedangkan berat \n58 kg muncul 2 kali. Langkah 2: Nilai modus yang sebenarnya adalah 58 kg. Maka pernyataan \nadalah salah."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Dalam sebuah pemilihan skuad olahraga sekolah, dicatat data tinggi badan dua tim bola basket masing-masing terdiri atas lima pemain, yaitu Tim Harapan dengan data 160 cm, 162 cm, 165 cm, 170 cm, 173 cm dan Tim Jaya dengan data 158 cm, 163 cm, 166 cm, 169 cm, 174 cm. Tentukan benar atau salah untuk setiap pernyataan berikut yang membandingkan parameter statistik kedua tim tersebut!","statements":[{"text":"Kedua kelompok tim tersebut memiliki perbedaan tinggi badan rata-rata (mean) yang cukup jauh berbeda satu sama lain.","answer":"Salah","explanation":"Langkah 1: Mean Tim Harapan = (160 + 162 + 165 + 170 + 173)/5 = 166 cm. Langkah 2: Mean \nTim Jaya = (158 + 163 + 166 + 169 + 174)/5 = 166 cm. Rerata tim terbukti sama tepat senilai \n166 cm."},{"text":"Nilai tinggi median di Tim Jaya didapatkan sedikit lebih tinggi jika dicocokkan berbanding nilai tengah di Tim Harapan.","answer":"Benar","explanation":"Langkah 1: Median Tim Harapan terletak di pusat urutan data ke-3 = 165 cm. Langkah 2: Letak \ntengah Tim Jaya berada pada angka ke-3 = 166 cm, dengan kata lain 166 > 165 cm (Tim Jaya \nlebih tinggi)."},{"text":"Parameter variasi rentang lebar jangkauan (range) pemain dari Tim Harapan terbukti lebih besar sebarannya daripada Tim Jaya.","answer":"Salah","explanation":"Langkah 1: Jangkauan Harapan = 173 −160 = 13 cm. Langkah 2: Jangkauan Jaya = 174 −\n158 = 16 cm. Penyebaran basket Tim Jaya bernilai lebih tinggi (16 > 13)."},{"text":"Parameter jangkauan rentang dari total tinggi para pemain basket di Tim Jaya tercatat persis senilai 16 cm.","answer":"Benar","explanation":"Langkah 1: Pilih anggota terjangkung (174 cm) dan minimalnya (158 cm). Langkah 2: Menghitung \nsisa pengurangan tim basket jaya: 174 −158 = 16 cm."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Sekelompok data terdiri dari lima bilangan bulat yang memiliki nilai jangkauan awal 8, median 15, dan rata-rata 14. Apabila setiap anggota data tersebut dikalikan dengan 2 dan hasil perkaliannya dikurangi dengan 3 maka terbentuk sekumpulan data baru. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai rata-rata data yang baru hasil dari proses transformasi operasi matematika tersebut adalah 25.","answer":"Benar","explanation":"Transformasi linier ke nilai rerata berlaku 𝑚𝑏𝑎𝑟𝑢= 2 × 𝑚𝑙𝑎𝑚𝑎−3 = 2 × 14 −3 = 25."},{"text":"Nilai median (nilai tengah) yang baru setelah melalui transformasi operasi adalah 30.","answer":"Salah","explanation":"Operasi transformasi linier data berpengaruh juga langsung ke median data: 𝑀𝑒𝑑𝑏𝑎𝑟𝑢=\n2 × 𝑀𝑒𝑑𝑙𝑎𝑚𝑎−3 = 2 × 15 −3 = 27."},{"text":"Nilai jangkauan (range) data setelah mengalami seluruh transformasi adalah 16.","answer":"Benar","explanation":"Transformasi bentuk perkalian mempengaruhi nilai skala sebaran data sedangkan nilai \npengurang (−3) diabaikan. Sehingga nilai 𝐽𝑎𝑛𝑔𝑘𝑎𝑢𝑎𝑛𝑏𝑎𝑟𝑢= 2 × 𝐽𝑎𝑛𝑔𝑘𝑎𝑢𝑎𝑛𝑙𝑎𝑚𝑎= 2 × 8 = 16."},{"text":"Selisih atau selisih jarak antara nilai median baru dengan nilai rata-rata baru adalah sebesar 2 satuan.","answer":"Benar","explanation":"Mencocokkan selisih antara hasil hitungan median baru dengan mean yang baru: 27 −25 = 2 \nsatuan."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Di lemari inventaris olahraga sekolah, terdapat enam pasang sepatu tim basket putri dengan ukuran masing-masing yang tertata secara acak sebagai berikut: 38, 40, 39, 42, 𝑦, dan 41. Dari catatan tertulis, nilai rata-rata ukuran sepatu tim basket putri ini adalah 40.5. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Ukuran sepatu 𝑦 bernilai 43, yang berarti median dari ukuran terkumpul sepatu putri tersebut adalah tepat sebesar 41.","answer":"Salah","explanation":"Total dari data bernilai ukuran rata-rata sebesar 6 × 40.5 = 243. Kuantitas terakumulasi dari nilai \ndata adalah sebesar 200, sehingga ukuran 𝑦 adalah sebesar 243 −200 = 43. Suku data urutan \nbernilai: 38,39,40,41,42,43, letak nilai tengah berada pada di antara 40 dan 41, maka nilai median \nyaitu \n40+41\n2\n= 40.5. Pernyataan ini salah."},{"text":"Bila sepatu berukuran paling besar di dalam lemari terjual ke tim lain, maka median baru dari sisa 5 pasang sepatu basket tersebut adalah sebesar 40.","answer":"Benar","explanation":"Kumpulan baru pasca mengeluarkan sepatu berukuran 43 menyisakan lima sepatu yaitu: \n38,39,40,41,42. Banyak datanya adalah 5 yang merupakan suku data ganjil, letak nilai tengah \ndiduduki tepat pada barisan urut ke-3, yaitu sepatu ukuran 40. Pernyataan ini benar."},{"text":"Jika sepatu yang terkecil yaitu ukuran 38 diganti dengan pasang baru berukuran 42, jangkauan dari ukuran sepatu yang tersimpan tetap bernilai sebesar 5.","answer":"Salah","explanation":"Jika pasang berbobot nilai 38 dialihkan oleh pasang ukuran bernilai 42, kelompok data \nberanggotakan: 39,40,41,42,42,43, terkecilnya berbobot bernilai 39. Sehingga jangkauannya \nmengencang tipis hanya berukuran rentang sebesar 43 −39 = 4. Pernyataan ini salah."},{"text":"Pada data ukuran awal sepatu di lemari tersebut tidak didapatkan modus sama sekali, namun jika ukuran 𝑦 diganti dengan ukuran 40, data akan memiliki tepat satu modus bernilai 40.","answer":"Benar","explanation":"Semua bernilai unik (38,39,40,41,42,43) sehingga modal nilainya tidak didapatkan. Melalui \npensubstitusian sepatu 𝑦= 43 ditiadakan digeser diganti sepatu berekor bobot bernilai 40, sepatu \nbernilai 40 tercatat memiliki pengulangan 2 kali paling dominan dibanding pasang data lainnya. \nModusnya satu angka, bernilai 40. Pernyataan ini benar."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan dan menafsirkan rata-rata (mean), median, modus, dan jangkauan (range) suatu data","question":"Terdapat dua kelompok siswa yang melakukan ujian harian matematika, yaitu Kelompok A yang beranggotakan 5 siswa dan Kelompok B beranggotakan 6 siswa. Nilai rata-rata Kelompok A adalah 78 dengan nilai siswa yang tercatat yaitu 70, 75, 82, 𝑥, dan 85, sedangkan rata-rata Kelompok B adalah 80 dengan nilai jangkauan sebesar 15 dan nilai terendahnya sebesar 72. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Nilai siswa 𝑥 di Kelompok A adalah 80 sehingga median dari Kelompok A bernilai 80.","answer":"Salah","explanation":"Rata-rata Kelompok A = 78, total = 5 × 78 = 390. Jumlah data yang diketahui = 70 + 75 + 82 +\n85 = 312. Jadi, 𝑥= 390 −312 = 78. Urutan nilai: 70,75,78,82,85, sehingga median Kelompok A \nadalah 78. Pernyataan ini salah."},{"text":"Selisih nilai siswa 𝑥 di Kelompok A dengan nilai tertinggi yang mungkin diperoleh oleh siswa Kelompok B adalah 9.","answer":"Benar","explanation":"Nilai 𝑥 adalah 78. Di Kelompok B, nilai terendah = 72 dan jangkauan = 15. Maka, nilai tertinggi \nKelompok B adalah 72 + 15 = 87. Selisihnya dengan nilai 𝑥 adalah 87 −78 = 9. Pernyataan ini \nbenar."},{"text":"Jika gabungan kedua kelompok ditambahkan satu orang lagi yang memiliki nilai 85, maka rata- rata nilai gabungan yang baru adalah 81.","answer":"Salah","explanation":"Total Kelompok A = 390. Total Kelompok B = 6 × 80 = 480. Total nilai gabungan awal = 870 \nuntuk 11 siswa. Jika ditambah 1 orang bernilai 85, total menjadi 870 + 85 = 955 untuk 12 siswa. \nRata-rata gabungan baru = \n955\n12 ≈79.58, bukan 81. Pernyataan ini salah."},{"text":"Jika salah satu siswa di Kelompok B yang awalnya mendapat nilai terendah remedial dan nilainya naik menjadi 84, rata-rata nilai Kelompok B akan naik menjadi 82.","answer":"Benar","explanation":"Total awal Kelompok B = 480. Kenaikan nilai terendah dari 72 ke 84 menambah total sebesar \n84 −72 = 12 poin. Total nilai baru Kelompok B menjadi 480 + 12 = 492. Rata-rata Kelompok B \nbaru adalah \n492\n6 = 82. Pernyataan ini benar."}]},{"number":19,"level":1,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Suhu harian di kawasan Puncak, Bogor selama lima hari berturut-turut tercatat 14∘C, 18∘C, 15∘C, 22∘C, dan 17∘C. Jangkauan suhu udara harian di kawasan tersebut adalah ....","options":[{"key":"A","text":"8∘C"},{"key":"B","text":"10∘C"},{"key":"C","text":"12∘C"},{"key":"D","text":"14∘C"}],"answer":"A","explanation":"Langkah 1: Mengidentifikasi suhu tertinggi dan terendah dari data harian yang diberikan. Suhu \ntertinggi adalah 22∘C dan suhu terendah adalah 14∘C. \nLangkah 2: Menghitung jangkauan suhu menggunakan rumus: 𝐽𝑎𝑛𝑔𝑘𝑎𝑢𝑎𝑛= 𝑁𝑖𝑙𝑎𝑖 𝑀𝑎𝑘𝑠𝑖𝑚𝑢𝑚−\n𝑁𝑖𝑙𝑎𝑖 𝑀𝑖𝑛𝑖𝑚𝑢𝑚. \n𝐽𝑎𝑛𝑔𝑘𝑎𝑢𝑎𝑛= 22∘𝐶−14∘𝐶= 8∘𝐶."},{"number":20,"level":1,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Suhu udara harian di puncak sebuah gunung di Papua selama 5 hari berturut-turut dicatat sebagai berikut: −4∘C, −2∘C, 0∘C, 1∘C, dan 3∘C. Jangkauan dari data suhu udara tersebut adalah ....","options":[{"key":"A","text":"1∘C"},{"key":"B","text":"3∘C"},{"key":"C","text":"5∘C"},{"key":"D","text":"7∘C"}],"answer":"D","explanation":"Identifikasi nilai tertinggi (𝑥𝑚𝑎𝑘𝑠) dan nilai terendah (𝑥𝑚𝑖𝑛) dari data suhu udara: 𝑥𝑚𝑎𝑘𝑠= 3∘C dan \n𝑥𝑚𝑖𝑛= −4∘C. \nGunakan rumus jangkauan: 𝐽𝑎𝑛𝑔𝑘𝑎𝑢𝑎𝑛= 𝑥𝑚𝑎𝑘𝑠−𝑥𝑚𝑖𝑛. \nHitung hasil selisihnya: 3 −(−4) = 3 + 4 = 7∘C."},{"number":21,"level":1,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Data berat badan 5 bayi di sebuah posyandu di Medan adalah 7.2 kg, 6.8 kg, 8.0 kg, 7.5 kg, dan 8.0 kg. Berapakah modus dari berat badan kelima bayi tersebut?","options":[{"key":"A","text":"6.8 kg"},{"key":"B","text":"7.2 kg"},{"key":"C","text":"7.5 kg"},{"key":"D","text":"8.0 kg"}],"answer":"D","explanation":"Hitung frekuensi kemunculan dari setiap berat badan bayi: 6.8 kg muncul 1 kali, 7.2 kg muncul 1 \nkali, 7.5 kg muncul 1 kali, dan 8.0 kg muncul sebanyak 2 kali. \nModus adalah berat badan dengan frekuensi kemunculan paling tinggi, yaitu 8.0 kg."},{"number":22,"level":2,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Tinggi badan lima orang pemain basket pemula di sebuah klub di Surabaya adalah 164 cm, 168 cm, 170 cm, 172 cm, dan 176 cm. Jika klub tersebut mendatangkan satu pemain baru sehingga rata-rata tinggi badan tim meningkat sebesar 1 cm, berapakah tinggi badan pemain baru tersebut?","options":[{"key":"A","text":"174 cm."},{"key":"B","text":"176 cm."},{"key":"C","text":"178 cm."},{"key":"D","text":"180 cm."}],"answer":"B","explanation":"Langkah 1: Menghitung rata-rata awal dan menentukan rata-rata baru. Jumlah tinggi 5 pemain \nawal adalah 164 + 168 + 170 + 172 + 176 = 850 cm. Rata-rata awal adalah \n850\n5 = 170 cm. \nKarena rata-rata meningkat 1 cm, rata-rata baru setelah ditambah 1 pemain menjadi 170 + 1 =\n171 cm. \nLangkah 2: Menghitung tinggi pemain baru. Jumlah tinggi 6 pemain adalah 6 × 171 = 1026 cm. \nTinggi badan pemain baru adalah 1026 −850 = 176 cm. \nJawaban Benar: B."},{"number":23,"level":2,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Berat badan rata-rata dari 10 orang balita di sebuah Posyandu di Solo adalah 12 kg. Setelah ditambahkan dengan berat badan balita A dan balita B, rata-rata berat badan seluruh balita menjadi 12,5 kg. Jika perbandingan berat badan balita A dan balita B adalah 1: 2, berapakah berat badan balita B?","options":[{"key":"A","text":"10 kg."},{"key":"B","text":"12 kg."},{"key":"C","text":"15 kg."},{"key":"D","text":"20 kg."}],"answer":"D","explanation":"Langkah 1: Menghitung jumlah berat badan balita A dan B. Berat total 10 balita awal adalah \n10 × 12 = 120 kg. Berat total setelah ditambah A dan B (12 balita) adalah 12 × 12,5 = 150 kg. \nJumlah berat badan A dan B adalah 150 −120 = 30 kg. \nLangkah 2: Menggunakan perbandingan untuk menghitung berat badan B. Rasio A : B adalah \n1: 2. Berat badan B adalah \n2\n1+2 × 30 =\n2\n3 × 30 = 20 kg. \nJawaban Benar: D."},{"number":24,"level":2,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Nilai ujian matematika sekelompok siswa tercatat sebagai berikut: nilai 5 diperoleh oleh 2 siswa, nilai 6 diperoleh oleh 3 siswa, nilai 7 diperoleh oleh 𝑥 siswa, dan nilai 8 diperoleh oleh 2 siswa. Jika rata-rata nilai ujian mereka adalah 6,5, banyak siswa yang memperoleh nilai 7 (𝑥) adalah ....","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":"A","explanation":"Langkah 1: Menghitung jumlah seluruh nilai dan total siswa: 𝐽𝑢𝑚𝑙𝑎ℎ 𝑛𝑖𝑙𝑎𝑖= (5 × 2) + (6 × 3) +\n7𝑥+ (8 × 2) = 10 + 18 + 7𝑥+ 16 = 44 + 7𝑥. 𝐵𝑎𝑛𝑦𝑎𝑘 𝑠𝑖𝑠𝑤𝑎= 2 + 3 + 𝑥+ 2 = 7 + 𝑥. \nLangkah 2: Menyusun persamaan rata-rata: 6,5 =\n44+7𝑥\n7+𝑥⇒6,5(7 + 𝑥) = 44 + 7𝑥. \nLangkah 3: Menyelesaikan persamaan aljabar tersebut: 45,5 + 6,5𝑥= 44 + 7𝑥⇒45,5 −44 =\n7𝑥−6,5𝑥⇒1,5 = 0,5𝑥⇒𝑥= 3."},{"number":25,"level":3,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Suatu keluarga memiliki enam orang anak dengan rata-rata umur 16 tahun, median 13 tahun, dan modus tunggal 12 tahun. Jika selisih umur anak tertua dan anak termuda adalah 12 tahun, berapakah umur dari anak tertua di dalam keluarga tersebut?","options":[{"key":"A","text":"20 tahun."},{"key":"B","text":"22 tahun."},{"key":"C","text":"24 tahun."},{"key":"D","text":"26 tahun."}],"answer":"C","explanation":"Langkah 1: Misalkan umur keenam anak terurut adalah 𝑎≤𝑏≤𝑐≤𝑑≤𝑒≤𝑓. \nLangkah 2: Karena median adalah 13 tahun, maka \n𝑐+𝑑\n2 = 13 ⟹ 𝑐+ 𝑑= 26. Karena modus \ntunggal adalah 12 tahun, maka nilai 12 harus muncul paling sering. Kemungkinan terbesar adalah \n𝑎= 𝑏= 𝑐= 12 tahun. \nLangkah 3: Jika 𝑐= 12, substitusikan ke persamaan median: 12 + 𝑑= 26 ⟹ 𝑑= 14 tahun. \nLangkah 4: Diketahui selisih anak tertua (𝑓) dan termuda (𝑎) adalah 12 tahun, maka 𝑓−𝑎=\n12 ⟹ 𝑓−12 = 12 ⟹ 𝑓= 24 tahun. \nLangkah 5: Rata-rata umur adalah 16 tahun, sehingga jumlah umur semua anak adalah 16 × 6 =\n96 tahun. Masukkan semua nilai yang diketahui untuk mencari 𝑒: 12 + 12 + 12 + 14 + 𝑒+ 24 =\n96 ⟹ 74 + 𝑒= 96 ⟹ 𝑒= 22 tahun (memenuhi syarat urutan 14 ≤22 ≤24). Umur anak tertua \nadalah 𝑓= 24 tahun."},{"number":26,"level":3,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Data nilai ulangan matematika sekelompok siswa adalah sebagai berikut: Nilai 60 (4 siswa), Nilai 70 (8 siswa), Nilai 80 (10 siswa), Nilai 90 (6 siswa), Nilai 100 (2 siswa). Jika tiga siswa dengan nilai terendah dikeluarkan dari kelompok tersebut dan digantikan oleh dua siswa baru yang masing-masing mendapatkan nilai 85, berapakah median data yang baru?","options":[{"key":"A","text":"80,0."},{"key":"B","text":"82,5."},{"key":"C","text":"85,0."},{"key":"D","text":"87,5."}],"answer":"A","explanation":"Langkah 1: Tentukan jumlah siswa awal: 4 + 8 + 10 + 6 + 2 = 30 siswa. \nLangkah 2: Tiga siswa dengan nilai terendah dikeluarkan. Nilai terendah adalah 60, sehingga sisa \nsiswa dengan nilai 60 adalah 4 −3 = 1 siswa. \nLangkah 3: Dua siswa baru dengan nilai 85 dimasukkan. Distribusi data yang baru setelah \ndiurutkan menjadi: Nilai 60 (1 siswa), Nilai 70 (8 siswa), Nilai 80 (10 siswa), Nilai 85 (2 siswa), \nNilai 90 (6 siswa), Nilai 100 (2 siswa). \nLangkah 4: Hitung jumlah total siswa yang baru: 1 + 8 + 10 + 2 + 6 + 2 = 29 siswa. \n\nLangkah 5: Karena jumlah data ganjil (29), median terletak pada data ke-\n29+1\n2\n= 15. Berdasarkan \nfrekuensi kumulatif: Data ke-1 adalah 60; Data ke-2 s.d ke-9 adalah 70; Data ke-10 s.d ke-19 \nadalah 80. Maka data ke-15 bernilai 80."},{"number":27,"level":3,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Rata-rata nilai ujian matematika kelompok A yang terdiri atas 12 siswa adalah 75, sedangkan kelompok B yang terdiri atas 8 siswa adalah 80. Dua orang siswa dari kelompok A yang masing- masing memperoleh nilai 82 dan 88 dipindahkan ke kelompok B. Selisih rata-rata nilai kelompok B yang baru dengan kelompok A yang baru setelah perpindahan tersebut adalah ....","options":[{"key":"A","text":"8"},{"key":"B","text":"10"},{"key":"C","text":"12"},{"key":"D","text":"14"}],"answer":"A","explanation":"Langkah 1: Hitung total nilai awal kedua kelompok. Total nilai kelompok A = 12 × 75 = 900. Total \nnilai kelompok B = 8 × 80 = 640. \nLangkah 2: Hitung rata-rata baru kelompok A setelah dua siswa dengan nilai 82 dan 88 keluar. \nJumlah siswa kelompok A menjadi 12 −2 = 10. Total nilai baru kelompok A = 900 −(82 + 88) =\n730. Rata-rata baru kelompok A = \n730\n10 = 73. \nLangkah 3: Hitung rata-rata baru kelompok B setelah dua siswa tersebut bergabung. Jumlah \nsiswa kelompok B menjadi 8 + 2 = 10. Total nilai baru kelompok B = 640 + (82 + 88) = 810. \nRata-rata baru kelompok B = \n810\n10 = 81. \nLangkah 4: Hitung selisih rata-rata kedua kelompok yang baru. Selisih = 81 −73 = 8."},{"number":28,"level":1,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Pemilik sebuah toko buah mencatat data hasil penjualan semangka (dalam jumlah buah) selama 5 hari berturut-turut, yaitu: 10,15,12,10,18 buah. Beri tanda centang (✓) pada setiap pernyataan yang benar berdasarkan catatan transaksi tersebut!","statements":[{"text":"Rata-rata (mean) penjualan buah semangka setiap harinya adalah 15 buah.","answer":"Salah","explanation":"Nilai rata-rata diperoleh melalui pembagian total unit terjual dengan durasi hari: \n10+10+12+15+18\n5\n=\n65\n5 = 13 buah."},{"text":"Modus dari data hasil penjualan semangka tersebut adalah 10 buah.","answer":"Benar","explanation":"Penjualan 10 buah berulang sebanyak 2 kali (hari ke-1 dan ke-4), terbanyak di antara data \nlainnya, maka menjadi modusnya."},{"text":"Nilai tengah (median) dari data penjualan buah semangka adalah 12 buah.","answer":"Benar","explanation":"Setelah diurutkan (10,10,12,15,18), letak median berada di data ketiga, yaitu 12 buah."},{"text":"Jangkauan dari data penjualan semangka tersebut adalah 18 buah.","answer":"Salah","explanation":"Jangkauan merupakan selisih nilai ekstrem: 18 −10 = 8 buah, bukan 18 buah."}]},{"number":29,"level":1,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Toko Berkah di Jakarta mencatat total berat penjualan telur harian dalam kilogram selama 5 hari berturut-turut, dengan data masing-masing berupa 12 kg, 15 kg, 18 kg, 12 kg, dan 13 kg. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai modus dari data penjualan telur Toko Berkah tersebut adalah 12 kg.","answer":"Benar","explanation":"Sesuai dengan sebaran data harian, nilai 12 kg muncul sebanyak 2 kali, lebih sering dibanding \nnilai lainnya, sehingga 12 kg bertindak sebagai modus data tersebut."},{"text":"Nilai median dari data penjualan telur tersebut adalah 13 kg.","answer":"Benar","explanation":"Data setelah diurutkan dari terkecil adalah: 12, 12, 13, 15, 18. Karena jumlah data ganjil (n = 5), \nmedian berada di tengah data, yaitu data ke-3 dengan nilai 13 kg."},{"text":"Nilai jangkauan (range) penjualan telur tersebut adalah 8 kg.","answer":"Salah","explanation":"Jangkauan ditentukan dengan cara mengurangkan nilai penjualan terbesar oleh terkecil, yaitu \n18 −12 = 6 𝑘𝑔."},{"text":"Rata-rata (mean) dari data penjualan telur per hari adalah 14 kg.","answer":"Benar","explanation":"Rata-rata (mean) diperoleh dengan menjumlahkan seluruh penjualan lalu dibagi total hari kerja: \n12+15+18+12+13\n5\n=\n70\n5 = 14 𝑘𝑔."}]},{"number":30,"level":1,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Dari catatan performa bertanding, jumlah gol yang sukses dicetak oleh tim futsal sekolah dalam 5 pertandingan adalah: 2,3,1,3,6. Tentukan benar atau salah untuk setiap pernyataan berdasarkan riwayat perolehan skor futsal tersebut!","statements":[{"text":"Rata-rata gol yang berhasil dicetak oleh tim tersebut adalah 3 gol tiap pertandingan.","answer":"Benar","explanation":"Mean dicari dari: \n1+2+3+3+6\n5\n=\n15\n5 = 3 gol."},{"text":"Jangkauan perolehan gol dalam seluruh kompetisi tim tersebut adalah 6 gol.","answer":"Salah","explanation":"Nilai jangkauan didapat dari data gol maksimal dikurang gol minimal: 6 −1 = 5 gol."},{"text":"Median dari jumlah raihan gol pertandingan tersebut adalah 3 gol.","answer":"Benar","explanation":"Ketika rentet gol disusun berurutan dari minimal (1,2,3,3,6), nilai tengah didapatkan pada urutan \ndata ketiga yaitu 3 gol."},{"text":"Modus perolehan gol pertandingan olahraga tersebut adalah 3 gol.","answer":"Benar","explanation":"Sebab nilai pencetakan 3 gol muncul berulang sebanyak 2 kali pertandingan, mendominasi rekor \npertandingannya."}]},{"number":31,"level":2,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Suatu usaha rumah makan mendata penjualan butiran telur asin asin miliknya harian dari kurun waktu seminggu berturut-turut adalah sebagai berikut: 30, 35, 40, 35, 32, 38, dan 42. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Rata-rata penjualan harian dari data telur asin rumah makan yang laku dalam seminggu adalah sebanyak 36 butir.","answer":"Benar","explanation":"Langkah 1: Menghitung total banyaknya penjualan telur harian yakni sebanyak 252 butir telur. \nLangkah 2: Mencari rata-ratanya: \n252\n7 = 36 butir telur."},{"text":"Nilai modus dari penjualan telur asin berangka tepat sama bernilai dengan posisi median dari data penjualan tersebut yaitu sebanyak 35 butir.","answer":"Benar","explanation":"Langkah 1: Mengurutkan data (30, 32, 35, 35, 38, 40, 42). Cari modus (35) dan mediannya (35). \nLangkah 2: Pastikan nilai perbandingan datanya cocok sama-sama 35."},{"text":"Ukuran persebaran selisih atau jangkauan antara penjualan yang tertinggi harian dan yang terendah adalah sebanyak 12 butir.","answer":"Benar","explanation":"Langkah 1: Tetapkan posisi harian tertinggi yang berhasil terjual (42 butir) dan penjualan harian \npaling sedikit (30 butir). Langkah 2: Selisih = 42 −30 = 12 butir."},{"text":"Rata-rata penjualan harian bernilai lebih rendah jika dibandingkan dengan nilai modus dari data penjualan telur asin tersebut.","answer":"Salah","explanation":"Langkah 1: Cari kembali nilainya, nilai modus = 35 dan nilai rata-rata = 36. Langkah 2: \nHubungkan secara logis yaitu 36 > 35. Maka, nilai rata-rata lebih tinggi."}]},{"number":32,"level":2,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Seorang petugas laboratorium mencatat data pengamatan mengenai tinggi pertumbuhan kelima benih kecambah kacang hijau yang sedang diuji yaitu 3 cm, 5 cm, 7 cm, x cm, dan 10 cm. Petugas mengabarkan jika rata-rata dari tinggi benih tersebut bernilai persis 6 cm. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai tinggi pertumbuhan dari tanaman kecambah kacang hijau dengan kode x adalah 5 cm.","answer":"Benar","explanation":"Langkah pertama mencari x via rumusan rata-rata: \n3+5+7+𝑥+10\n5\n= 6 ⟹ \n25+𝑥\n5\n= 6 ⟹ 25 + 𝑥=\n30 ⟹ 𝑥= 5 𝑐𝑚."},{"text":"Modus kemunculan paling umum pertumbuhan benih botol pemantauan adalah bernilai 5 cm.","answer":"Benar","explanation":"Dengannya dataset utuh kecambah tersaji urut sebagai berikut: 3, 5, 5, 7, 10. Nilai kecambah \ntinggi 5 cm dominan dengan jumlah rekaman sebanyak 2 kali pengujian."},{"text":"Bila nilai median kelompok tersebut dicari dari pengamatan, maka akan diperoleh hasil 7 cm.","answer":"Salah","explanation":"Melalui data tinggi setelah diurutkan, berhubung n = 5 (ganjil), angka titik tanggungan nilai tengah \ndiletakkan pada data ke-3 yakni diduduki nilai 5 cm."},{"text":"Kecenderungan rentang nilai interkuartil ekstrim batas atas terbawah jangkauan tanaman diuji didapatkan senilai 5 cm.","answer":"Salah","explanation":"Operasi rentang hitung tinggi didapatkan berdasarkan selisih tanaman tinggi maks diarsir batas \nbenih terendik: 10 −3 = 7 𝑐𝑚."}]},{"number":33,"level":2,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Skor keaktifan dari 8 anggota regu pramuka dalam berkemah dicatat, yaitu 15, 12, 15, 14, 13, 15, 11, dan 13. Pelatih regu ingin menganalisis pencapaian rata-rata untuk pemberian apresiasi khusus bagi anggota aktif. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Modus skor keaktifan regu pramuka tersebut bernilai 13.","answer":"Salah","explanation":"Langkah 1: Menghitung frekuensi setiap skor: 11 (1 kali), 12 (1 kali), 13 (2 kali), 14 (1 kali), 15 (3 \nkali). Langkah 2: Menentukan modus yang memiliki frekuensi terbesar, yaitu skor 15. Jadi \nmodusnya bukan 13. Pernyataan salah."},{"text":"Nilai tengah (median) dari data skor keaktifan anggota tersebut adalah 13,5.","answer":"Benar","explanation":"Langkah 1: Mengurutkan data skor keaktifan dari kecil ke besar: 11,12,13,13,14,15,15,15. Langkah \n2: Mengambil rata-rata nilai pada data ke-4 dan ke-5: \n13+14\n2\n= 13,5. Pernyataan benar."},{"text":"Skor rata-rata (mean) dari data tersebut adalah sebesar 14,0.","answer":"Salah","explanation":"Langkah 1: Menjumlahkan seluruh skor keaktifan: 11 + 12 + 13 + 13 + 14 + 15 + 15 + 15 = 108. \nLangkah 2: Menghitung rata-ratanya: \n108\n8 = 13,75 (bukan 14,0). Pernyataan salah."},{"text":"Banyak anggota yang memiliki skor di atas skor rata-rata regunya adalah sebanyak 4 orang.","answer":"Benar","explanation":"Langkah 1: Menemukan skor rata-rata yaitu sebesar 13,75. Langkah 2: Mengidentifikasi jumlah \ndata yang bernilai > 13,75: diperoleh skor 14,15,15,15 (yaitu sebanyak 4 anggota). Pernyataan \nbenar."}]},{"number":34,"level":3,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Seorang guru olahraga mengukur capaian batas rekor lari selama interval waktu 12 menit milik enam orang pelari didikan binaannya. Lima data jarak lari terdokumentasi terinci rahasia (dalam kilometer) adalah: 2.1, 1.8, 2.4, 2.0, dan 2.2. Pelari yang menempuh posisi ke-6 memiliki rekor variabel y, dan diinginkan oleh guru pelatih agar ukuran batas jarak tebaran interval seluruh lari bernilai persis 0.8 km. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai semua implikasi perolehan target olahraga ini!","statements":[{"text":"Penentuan parameter matematika untuk y hanya melahirkan persis dua jenis pilihan hasil hitungan lari, yaitu teringan lari 1.6 km atau lintasan rekor terjauh lari 2.6 km.","answer":"Benar","explanation":"Langkah 1: Menelaah susunan pengumpulan lari lima siswa berurut ke atas yaitu: 1.8, 2.0, 2.1, \n2.2, 2.4 dengan rentang awal 2.4 - 1.8 = 0.6 km. Langkah 2: Rentang target bernilai tepat 0.8 \nmembutuhkan y bertindak melebarkan interval menjadi data teratas baru yaitu y - 1.8 = 0.8 -> y = \n2.6 km. Langkah 3: Atau skenario alternatif penopang titik dasarnya yaitu data paling kecil yang \nbernilai 2.4 - y = 0.8 -> y = 1.6 km. Pilihannya persis hanya ada dua."},{"text":"Jika diukur melalui analisis teoretis selisih, letak perolehan batas ukuran nilai median dari kelompok lintasan lari teratas ke bawah memiliki selisih persis berjarak sejauh 0.1 km.","answer":"Benar","explanation":"Langkah 1: Evaluasi kondisi jika y di dasar terbawah (y=1.6 km), data urutnya: 1.6, 1.8, 2.0, 2.1, \n2.2, 2.4 dengan letak median (2.0 + 2.1)/2 = 2.05 km. Langkah 2: Di pihak lain jika data penutup \nrekor tinggi (y=2.6 km), rentetan berformat 1.8, 2.0, 2.1, 2.2, 2.4, 2.6 dengan letak nilai median \n(2.1 + 2.2)/2 = 2.15 km. Langkah 3: Evaluasi tingkat margin perbandingan nilainya: 2.15 - 2.05 = \n0.1 km."},{"text":"Di bawah pengasuhan skenario bahwa lintasan y menduduki rekor sebagai yang teringan (y=1.6 km), maka nilai median keseluruhan dari data enam atlet lari berada di angka 2.05 km.","answer":"Benar","explanation":"Langkah 1: Meletakkan sebaran angka dengan mengasumsikan nilai y berkedudukan minim \n(y=1.6 km). Langkah 2: Susunan secara progresif tertata secara valid berbentuk data 1.6, 1.8, \n2.0, 2.1, 2.2, 2.4. Langkah 3: Didapatkan median penilai pertengahan separuh atas bawah \ndiwakili rata-rata data ke-3 dan data ke-4 yaitu (2.0 + 2.1) / 2 = 2.05 km."},{"text":"Berdasarkan skenario seandainya rekor rekayasa pelari menaruh titik target lintasan termaju atau tinggi (y=2.6 km), nilai rata-rata prestasi kelompok melewati target 2.3 km.","answer":"Salah","explanation":"Langkah 1: Mengatur parameter kumulatif dari enam orang lari berkonfigurasi tertinggi dengan \ndata x_6=2.6 yaitu: 1.8 + 2.0 + 2.1 + 2.2 + 2.4 + 2.6 = 13.1 km. Langkah 2: Rata-rata lintasan \ntotal diperoleh dengan perolehan hasil pembagian data: 13.1 / 6 ≈ 2.183 km. Langkah 3: \nBandingkan terhadap besaran nilai porsi parameter penguji, didapat nilai capaian ternyata gagal \nmelewati level batasan banding 2.3 km."}]},{"number":35,"level":3,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Tim Posyandu merekam pertumbuhan data tinggi badan balita dengan mengurutkan dari tinggi teringan ke terberat bagi lima balita: 70, 75, 78, 85, 𝑥 cm. Diketahui ukuran sebaran data statistik jangkauan pertumbuhan dari total balita yang didata di posyandu ini adalah senilai 18 cm. Cari tinggi balita yang bernilai 𝑥 terlebih dahulu, kemudian tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Nilai 𝑥 cm yang membatasi dan melambangkan tinggi balita terjangkung di desa itu adalah tepat setinggi 88 cm.","answer":"Benar","explanation":"Data telah urut dari yang terkecil. Dengan data balita terpendek senilai 70 cm, dan ukuran \npenyebaran berupa rentang jangkauan (maksimum - minimum) bernilai 18 cm. Maka nilai variabel \n𝑥 dapat dirumuskan secara sistem aljabar 𝑥−70 = 18 ⟹ 𝑥= 88 cm."},{"text":"Bila dihitung, besarnya angka sebaran rata-rata matematika dari pertumbuhan seluruh kelima anak balita adalah 79,2 cm.","answer":"Benar","explanation":"Sum penjumlahan total dari keseluruhan pertumbuhan data anak posyandu di desa adalah: 70 +\n75 + 78 + 85 + 88 = 396. Besarnya rerata atau nilai pemusatan rata-ratanya setara dengan: \n396/5 = 79,2 cm."},{"text":"Sisi kuartil tengah (nilai median) dari data tinggi badan balita posyandu tersebut berada tepat pada posisi tinggi badan 78 cm.","answer":"Benar","explanation":"Mengingat urutan datanya berjumlah ganjil (sebanyak 5), data yang tepat di bagian titik asimetri \natau tengah data adalah data posisi urutan ketiga, yang dalam urutannya diisi oleh nilai setinggi \n78 cm."},{"text":"Nilai jangkauan antarkuartil dari data tinggi badan lima balita posyandu ini tercatat senilai 15,5 cm.","answer":"Salah","explanation":"Kuartil bawah (𝑄1) terletak di nilai median antara dua data terkecil paruh awal: \n70+75\n2\n= 72,5 cm. \nKuartil atas (𝑄3) terletak pada sebaran data sisi paruh kanan: \n85+88\n2\n= 86,5 cm. Sifat dari 𝐼𝑄𝑅 \njangkauan antar kuartil adalah: 86,5 −72,5 = 14 cm, bukan 15,5 cm."}]},{"number":36,"level":3,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan kontekstual yang berkaitan dengan pemusatan data.","question":"Departemen keuangan sebuah perusahaan melakukan audit anggaran pada 8 cabang di pulau Jawa. Pengeluaran operasional (dalam juta rupiah) awal yang tercatat secara acak dari kedelapan cabang tersebut memiliki rata-rata Rp120 juta dan median Rp115 juta. Berdasarkan hasil audit menyeluruh, ditemukan kekeliruan pencatatan data pada cabang terkecil yang semula tertulis Rp110 juta dan seharusnya bernilai benar Rp150 juta. Hubungan ini dianalisis dengan daftar pengeluaran asli terurut yaitu: 95, 100, 105, 110, 120, 130, 140, dan 160. Beri tanda centang (✓) pada setiap pernyataan yang benar terkait perubahan data keuangan setelah perbaikan audit!","statements":[{"text":"Nilai median data tidak berubah karena yang diperbaiki hanya nilai ekstrim di tengah data.","answer":"Salah","explanation":"Data lama: 95, 100, 105, 110, 120, 130, 140, 160 (Median = (110 + 120)/2 = 115). Data baru \nsetelah angka 110 diganti 150 adalah: 95, 100, 105, 120, 130, 140, 150, 160. Median baru \nmenjadi (120 + 130)/2 = 125, sehingga terjadi perubahan median."},{"text":"Rata-rata pengeluaran operasional yang baru setelah perbaikan data audit adalah sebesar Rp125 juta.","answer":"Benar","explanation":"Total pengeluaran awal = 8 x Rp120 juta = Rp960 juta. Karena koreksi penambahan nilai \npengeluaran sebesar Rp150 juta - Rp110 juta = Rp40 juta, total barunya adalah Rp960 juta + \nRp40 juta = Rp1000 juta. Rata-rata barunya adalah Rp1000 juta / 8 = Rp125 juta."},{"text":"Rata-rata baru tersebut meningkat tepat sebesar Rp5 juta dibandingkan dengan rata-rata pengeluaran awal.","answer":"Benar","explanation":"Peningkatan rata-rata dapat dihitung dengan membagi selisih kesalahan total oleh banyaknya \nsampel data: Rp40 juta / 8 = Rp5 juta. Hal ini sesuai dengan peningkatan dari Rp120 juta menjadi \nRp125 juta."},{"text":"Nilai median dari data pengeluaran yang baru setelah perbaikan data audit tersebut adalah Rp125 juta.","answer":"Benar","explanation":"Dari daftar urutan data baru setelah angka 110 dicoret dan ditambahkan 150 pada bagian atas, \nurutannya menjadi: 95, 100, 105, 120, 130, 140, 150, 160. Median terletak pada indeks tengah \ngenap ke-4 dan ke-5 yaitu (120 + 130) / 2 = Rp125 juta."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
