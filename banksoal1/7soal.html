<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Perbandingan dan Skala</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT PERBANDINGAN DAN SKALA</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Perbandingan secara penjumlahan (selisih) antara tinggi badan Andi dan Budi adalah 10 cm. Jika\ntinggi badan Andi adalah 165 cm dan Andi lebih tinggi dari Budi, maka tinggi badan Budi adalah\n....","options":[{"key":"A","text":"155 cm"},{"key":"B","text":"160 cm"},{"key":"C","text":"170 cm"},{"key":"D","text":"175 cm"}],"answer":"A","explanation":"Langkah 1: Karena Andi lebih tinggi dari Budi dengan selisih 10 cm, maka tinggi badan Budi\ndicari dengan mengurangkan tinggi Andi dengan selisih tersebut: 𝑇𝑖𝑛𝑔𝑔𝑖 𝐵𝑢𝑑𝑖= 165 𝑐𝑚−\n10 𝑐𝑚= 155 𝑐𝑚.\nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Jarak antara kota Jakarta dan Bandung pada sebuah peta dengan skala 1: 1.500.000 adalah 10\ncm. Berapakah jarak sebenarnya antara kedua kota tersebut?","options":[{"key":"A","text":"15 km."},{"key":"B","text":"50 km."},{"key":"C","text":"150 km."},{"key":"D","text":"1.500 km."}],"answer":"C","explanation":"Langkah 1: Gunakan rumus untuk mencari jarak sebenarnya: 𝐽𝑎𝑟𝑎𝑘 𝑠𝑒𝑏𝑒𝑛𝑎𝑟𝑛𝑦𝑎=\n𝐽𝑎𝑟𝑎𝑘 𝑝𝑎𝑑𝑎 𝑝𝑒𝑡𝑎× 𝑆𝑘𝑎𝑙𝑎.\nLangkah 2: Hitung nilai jarak sebenarnya: 10 × 1.500.000 = 15.000.000 cm.\nLangkah 3: Konversikan satuan centimeter ke kilometer dengan membagi dengan 100.000,\nsehingga diperoleh 150 km.\nJawaban Benar: C."},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Rasio paling sederhana dari 600 gram terhadap 1.000 gram adalah ....","options":[{"key":"A","text":"1: 5"},{"key":"B","text":"2: 5"},{"key":"C","text":"3: 5"},{"key":"D","text":"4: 5"}],"answer":"C","explanation":"Tulis rasio dalam bentuk pecahan:\n600\n1000.\nSederhanakan dengan membagi pembilang dan penyebut dengan FPB dari keduanya, yaitu 200.\n600÷200\n1000÷200 =\n3\n5 atau 3: 5.\nJawaban Benar: C"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Di suatu kelas, rasio jumlah siswa laki-laki dan siswa perempuan adalah 1: 3. Jika rata-rata nilai\nujian matematika untuk kelompok siswa laki-laki adalah 80 dan rata-rata nilai siswa perempuan\nadalah 72, berapakah rata-rata nilai gabungan seluruh siswa di kelas tersebut?","options":[{"key":"A","text":"74"},{"key":"B","text":"75"},{"key":"C","text":"76"},{"key":"D","text":"78"}],"answer":"A","explanation":"Langkah 1: Misalkan banyak siswa laki-laki adalah 1𝑥 dan siswa perempuan adalah 3𝑥, sehingga\njumlah siswa gabungan adalah 1𝑥+ 3𝑥= 4𝑥 orang.\nLangkah 2: Cari jumlah nilai total seluruh siswa dengan menjumlahkan perkalian jumlah siswa\ndan nilai rata-rata masing-masing kelompok: 𝐽𝑢𝑚𝑙𝑎ℎ 𝑛𝑖𝑙𝑎𝑖 𝑡𝑜𝑡𝑎𝑙= (1𝑥× 80) + (3𝑥× 72) = 80𝑥+\n216𝑥= 296𝑥.\nLangkah 3: Hitung rata-rata gabungan dengan membagi jumlah nilai total dengan jumlah siswa\ngabungan: 𝑅𝑎𝑡𝑎−𝑟𝑎𝑡𝑎 𝑔𝑎𝑏𝑢𝑛𝑔𝑎𝑛=\n296𝑥\n4𝑥= 74.\nJawaban Benar: A"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Pak Hasan menggambar denah sebidang tanah berbentuk persegi panjang dengan ukuran\npanjang 15 cm dan lebar 10 cm. Jika denah tersebut menggunakan skala 1: 400, berapakah luas\ntanah milik Pak Hasan yang sesungguhnya dalam satuan meter persegi?","options":[{"key":"A","text":"24 m 2"},{"key":"B","text":"240 m 2"},{"key":"C","text":"600 m 2"},{"key":"D","text":"2.400 m 2"}],"answer":"D","explanation":"Langkah 1: Tentukan ukuran panjang dan lebar sebenarnya dari tanah tersebut dengan\nmenggunakan skala denah. Panjang sebenarnya = 15 𝑐𝑚× 400 = 6.000 cm = 60 m. Lebar\nsebenarnya = 10 𝑐𝑚× 400 = 4.000 cm = 40 m.\nLangkah 2: Hitung luas tanah yang sesungguhnya dengan mengalikan panjang sebenarnya\ndengan lebar sebenarnya. Luas sebenarnya = 60 𝑚× 40 𝑚= 2.400 m\n2.\nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Sebuah kebun kopi milik Pak Wayan berbentuk persegi panjang digambar pada denah dengan\nukuran panjang 10 cm dan lebar 6 cm. Jika denah tersebut memiliki skala 1: 500, maka luas\nsebenarnya dari kebun kopi tersebut adalah ….","options":[{"key":"A","text":"150 m 2"},{"key":"B","text":"300 m 2"},{"key":"C","text":"1.500 m 2"},{"key":"D","text":"15.000 m 2"}],"answer":"C","explanation":"Langkah 1: Menghitung panjang dan lebar sebenarnya dari kebun kopi. Panjang sebenarnya =\n10 𝑐𝑚× 500 = 5.000 𝑐𝑚= 50 meter. Lebar sebenarnya = 6 𝑐𝑚× 500 = 3.000 𝑐𝑚= 30 meter.\nLangkah 2: Menghitung luas sebenarnya dengan mengalikan panjang sebenarnya dan lebar\nsebenarnya: Luas = 50 𝑚𝑒𝑡𝑒𝑟× 30 𝑚𝑒𝑡𝑒𝑟= 1.500 m\n2.\nJawaban Benar: C"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Seorang pengrajin perak di Kotagede ingin membuat kerajinan baru dengan melebur dua jenis\nsisa perhiasan perak lama. Perhiasan tipe pertama mengandung perak dan tembaga dengan\nrasio 9: 1, sedangkan perhiasan tipe kedua mengandung perak dan tembaga dengan rasio 3: 2.\nJika pengrajin tersebut ingin menghasilkan 150 gram logam campuran baru dengan rasio\nkandungan perak terhadap tembaga sebesar 7: 3, berapakah massa perhiasan tipe pertama yang\nharus dilebur?","options":[{"key":"A","text":"50 gram."},{"key":"B","text":"75 gram."},{"key":"C","text":"100 gram."},{"key":"D","text":"125 gram."}],"answer":"A","explanation":"Kadar perak pada logam pertama adalah\n9\n10 dan kadar perak pada logam kedua adalah\n3\n5.\nKadar perak pada logam campuran akhir yang diinginkan adalah\n7\n10 dari total 150 gram.\nMisalkan massa logam tipe pertama adalah 𝑥 gram, maka massa logam tipe kedua adalah\n(150 −𝑥) gram.\nPersamaan kadar perak:\n9\n10 𝑥+\n3\n5 (150 −𝑥) =\n7\n10 (150) ⟹\n9\n10 𝑥+ 90 −\n6\n10 𝑥= 105.\nMenyelesaikan persamaan:\n3\n10 𝑥= 15 ⟹ 𝑥= 50 gram.\nJawaban Benar: A."},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Tiga orang mitra bisnis, Alif, Bima, dan Ciko, membagi keuntungan bersih tahunan usaha mereka\nyang bernilai total Rp100.000.000,00. Sebelum keuntungan tersebut dibagikan, mereka sepakat\nuntuk menyisihkan 30% dari keuntungan untuk modal pengembangan usaha. Sisa keuntungan\nkemudian dibagikan dengan ketentuan: rasio bagian Alif terhadap Bima adalah 2: 3, sedangkan\nrasio bagian Bima terhadap Ciko adalah 4: 5. Berapakah selisih nominal uang keuntungan yang\nditerima oleh Alif dan Ciko setelah pemotongan tersebut?","options":[{"key":"A","text":"Rp8.000.000,00."},{"key":"B","text":"Rp10.000.000,00."},{"key":"C","text":"Rp12.000.000,00."},{"key":"D","text":"Rp14.000.000,00."}],"answer":"D","explanation":"Langkah 1: Hitung sisa keuntungan yang dibagikan = (100% −30%) × 𝑅𝑝100.000.000,00 =\n𝑅𝑝70.000.000,00.\nLangkah 2: Gabungkan rasio dengan menyamakan bagian Bima (𝐴: 𝐵= 2: 3 = 8: 12 dan 𝐵: 𝐶=\n4: 5 = 12: 15). Diperoleh 𝐴: 𝐵: 𝐶= 8: 12: 15.\nLangkah 3: Total bagian = 8 + 12 + 15 = 35 bagian. Selisih bagian Alif dan Ciko = 15 −8 = 7\nbagian.\nLangkah 4: Hitung selisih nominal =\n7\n35 × 𝑅𝑝70.000.000,00 =\n1\n5 × 𝑅𝑝70.000.000,00 =\n𝑅𝑝14.000.000,00.\nJawaban Benar: D"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Dua pengendara sepeda motor, Rian dan Bayu, bergerak saling mendekat dari dua kota yang\nterpisah sejauh 150 km. Rian berangkat dari Kota A pada pukul 08.00 dengan kecepatan rata-\nrata 40 km/jam. Setengah jam kemudian, Bayu baru berangkat dari Kota B menuju Kota A\ndengan kecepatan rata-rata 60 km/jam. Mereka akan berpapasan di jalan pada pukul ....","options":[{"key":"A","text":"09.30"},{"key":"B","text":"09.42"},{"key":"C","text":"09.48"},{"key":"D","text":"10.00"}],"answer":"C","explanation":"Langkah 1: Hitung jarak yang sudah ditempuh Rian saat Bayu baru berangkat pada pukul 08.30\n(selama 0.5 jam): 𝐽𝑎𝑟𝑎𝑘= 40 𝑘𝑚/𝑗𝑎𝑚× 0.5 𝑗𝑎𝑚= 20 𝑘𝑚.\nLangkah 2: Hitung sisa jarak yang harus ditempuh bersama-sama: 150 𝑘𝑚−20 𝑘𝑚= 130 𝑘𝑚.\nLangkah 3: Hitung waktu berpapasan sejak pukul 08.30 menggunakan kecepatan relatif: 𝑡=\n130 𝑘𝑚\n40 𝑘𝑚/𝑗𝑎𝑚+60 𝑘𝑚/𝑗𝑎𝑚=\n130\n100 = 1.3 𝑗𝑎𝑚.\nLangkah 4: Ubah 1.3 jam menjadi satuan jam dan menit: 1.3 𝑗𝑎𝑚= 1 𝑗𝑎𝑚+ (0.3 × 60) 𝑚𝑒𝑛𝑖𝑡=\n1 𝑗𝑎𝑚 18 𝑚𝑒𝑛𝑖𝑡.\nLangkah 5: Tentukan waktu berpapasan: pukul 08.30 + 1 𝑗𝑎𝑚 18 𝑚𝑒𝑛𝑖𝑡= 09.48.\nJawaban Benar: C"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Suatu pengerjaan konstruksi berupa pembuatan jembatan mini di desa dapat selesai dalam\nwaktu 6 hari jika dikerjakan oleh 8 pekerja. Tentukan benar atau salah untuk setiap pernyataan\nberikut jika efisiensi semua pekerja dianggap setara dan konstan!","statements":[{"text":"Jika pembangunan dikerjakan oleh 16 orang pekerja dengan keahlian serupa, proyek jembatan mini tersebut dapat tuntas dalam 3 hari saja.","answer":"Benar","explanation":"Konsep perbandingan berbalik nilai: beban proyek dinilai dengan hari-orang = 8 × 6 = 48 ℎ𝑎𝑟𝑖− 𝑝𝑒𝑘𝑒𝑟𝑗𝑎. Jika pekerja digandakan menjadi 16, waktu pengerjaannya = 48 ÷ 16 = 3 ℎ𝑎𝑟𝑖. Ini benar."},{"text":"Bila kuota pekerja dipangkas sebanyak setengahnya menjadi hanya 4 pekerja, pekerjaan itu masih selesai cepat dalam waktu 3 hari.","answer":"Salah","explanation":"Jika jumlah pekerja dipotong menjadi setengahnya (4 pekerja), maka secara berbalik nilai waktu pengerjaan menjadi dua kali lebih lama: 48 ÷ 4 = 12 ℎ𝑎𝑟𝑖, bukan 3 hari."},{"text":"Jika tim ditambah agar totalnya menjadi sebanyak 12 pekerja, proyek konstruksi akan tuntas selama 4 hari.","answer":"Benar","explanation":"Benar. Untuk total 12 pekerja, waktu pengerjaan jembatan tersebut bernilai 48 ÷ 12 = 4 ℎ𝑎𝑟𝑖."},{"text":"Permasalahan perbandingan penambahan pekerja terhadap berkurangnya waktu selesai ini merupakan karakteristik utama dari konsep perbandingan berbalik nilai.","answer":"Benar","explanation":"Benar. Konsep di mana satu variabel bertambah sejalan dengan variabel yang lain yang semakin berkurang dengan perkalian total konstan (𝑥⋅𝑦= 𝑘) adalah esensi dari hubungan berbalik nilai."}],"explanation":""},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Sebuah peta wilayah Jawa Barat memiliki skala 1: 200.000, di mana tergambar dua wilayah\ndengan jarak pada gambar sejauh 8 cm. Tentukan benar atau salah untuk setiap pernyataan\nyang menguji analisis ukuran pada peta tersebut!","statements":[{"text":"Setiap 1 cm pada peta merepresentasikan jarak 2 km pada permukaan bumi sesungguhnya.","answer":"Benar","explanation":"Skala 1: 200.000 berarti 1 cm pada peta = 200.000 cm di permukaan bumi = 2 km."},{"text":"Jarak sesungguhnya antara kedua wilayah tersebut adalah 16 km.","answer":"Benar","explanation":"Jarak sesungguhnya = Jarak peta × nilai skala = 8 × 200.000 cm = 1.600.000 cm = 16 km."},{"text":"Apabila jarak sesungguhnya kedua kota digandakan, maka jarak baru pada peta dengan skala yang sama menjadi 4 cm.","answer":"Salah","explanation":"Miskonsepsi pembagian atau invers: jika jarak sesungguhnya menjadi dua kali lipat, maka jarak di peta harusnya ikut menjadi dua kali lipat (16 cm) pada skala konstan."},{"text":"Nilai skala peta menyatakan rasio ukuran pada peta terhadap ukuran sesungguhnya dalam satuan panjang yang sejenis.","answer":"Benar","explanation":"Sifat skala memang berupa rasio matematis komparatif ukuran gambar dibanding ukuran nyata setelah disetarakan satuannya."}],"explanation":""},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Seorang tukang jahit mampu menyelesaikan pembuatan 8 lembar pakaian dalam kurun waktu 2\nhari secara stabil. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Banyaknya pakaian yang dapat diselesaikan oleh tukang jahit dalam 1 hari adalah 16 lembar.","answer":"Salah","explanation":"Kemampuannya bekerja dalam 1 hari dihitung dari 8 2 = 4 pakaian."},{"text":"Tukang jahit memerlukan waktu 4 hari untuk menghasilkan 8 lembar pakaian.","answer":"Salah","explanation":"Untuk membuat 8 pakaian, penjahit hanya perlu 2 hari kerja sesuai penjelasan pada pokok soal."},{"text":"Laju kecepatan tukang jahit bekerja adalah 4 lembar pakaian per hari.","answer":"Benar","explanation":"Perbandingan jumlah barang terhadap waktu pengerjaan: 8 𝑙𝑒𝑚𝑏𝑎𝑟 2 ℎ𝑎𝑟𝑖 = 4 𝑙𝑒𝑚𝑏𝑎𝑟 𝑝𝑒𝑟 ℎ𝑎𝑟𝑖."},{"text":"Jika ia bekerja selama 5 hari, banyak pakaian yang dapat dijahit adalah 20 lembar.","answer":"Benar","explanation":"Dalam waktu 5 hari, pakaian yang diperoleh yaitu 5 ℎ𝑎𝑟𝑖× 4 𝑙𝑒𝑚𝑏𝑎𝑟/ℎ𝑎𝑟𝑖= 20 𝑙𝑒𝑚𝑏𝑎𝑟."}],"explanation":""},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Sebuah toko grosir menjual paket buku tulis berisi 5 buku dengan harga Rp17.500, dan paket\npulpen berisi 3 pulpen dengan harga Rp9.000. Beri tanda centang (✓) pada setiap pernyataan\nyang benar!","statements":[{"text":"Harga eceran untuk satu buah buku tulis adalah Rp3.000.","answer":"Salah","explanation":"Langkah 1: Identifikasi total harga paket buku Rp17.500 untuk 5 buku. Langkah 2: Bagi total harga dengan jumlah barang, diperoleh Rp17.500/5 = Rp3.500 per buah. Pernyataan salah."},{"text":"Rasio harga satuan satu buah buku tulis terhadap harga satu buah pulpen adalah 6: 5.","answer":"Salah","explanation":"Langkah 1: Hitung harga satuan pulpen yaitu Rp9.000/3 = Rp3.000. Langkah 2: Bandingkan harga satuan buku (Rp3.500) dan pulpen (Rp3.000) didapatkan rasio 35: 30 = 7: 6. Pernyataan salah."},{"text":"Uang yang harus dibayarkan jika seorang pelanggan ingin membeli 10 buku tulis dan 6 pulpen adalah Rp53.000.","answer":"Benar","explanation":"Langkah 1: Kalikan jumlah dengan harga satuan masing-masing yaitu 10 × 3.500 = Rp35.000 dan 6 × 3.000 = Rp18.000. Langkah 2: Jumlahkan keduanya menjadi 35.000 + 18.000 = Rp53.000. Pernyataan benar."},{"text":"Dengan bekal uang tunai Rp25.000, seseorang paling banyak hanya dapat membawa pulang 7 buah buku tulis.","answer":"Benar","explanation":"Langkah 1: Bagilah uang tersedia dengan harga satuan buku yaitu Rp25.000/3.500 ≈7,14. Langkah 2: Jumlah maksimal buku utuh adalah pembulatan ke bawah yaitu sebanyak 7 buah (7 × 3.500 = 24.500). Pernyataan benar."}],"explanation":""},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Sebuah bak mandi yang kosong memiliki kapasitas volume 150 liter. Bak tersebut diisi air melalui\nsebuah keran yang memiliki debit konstan sebesar 6 liter per menit. Beri tanda centang (✓) pada\nsetiap pernyataan yang benar!","statements":[{"text":"Waktu yang diperlukan untuk mengisi penuh bak mandi tersebut dari kondisi kosong adalah 30 menit.","answer":"Salah","explanation":"Langkah 1: Identifikasi total volume 150 liter dan debit 6 L/menit. Langkah 2: Waktu pengisian penuh adalah 150 6 = 25 menit, bukan 30 menit. Pernyataan salah."},{"text":"Setelah keran tersebut dibuka selama 10 menit, volume air di dalam bak mandi menjadi 60 liter.","answer":"Benar","explanation":"Langkah 1: Ketahui waktu 10 menit. Langkah 2: Hitung volume air yang terisi yaitu 10 × 6 𝑙𝑖𝑡𝑒𝑟/𝑚𝑒𝑛𝑖𝑡= 60 liter. Pernyataan benar."},{"text":"Rasio volume air terisi terhadap sisa volume bak mandi yang kosong setelah diisi selama 15 menit adalah 3: 2.","answer":"Benar","explanation":"Langkah 1: Volume terisi adalah 15 × 6 = 90 liter, sehingga sisa volume kosongnya 150 −90 = 60 liter. Langkah 2: Sederhanakan rasio terisi terhadap sisa kosong yaitu 90: 60 = 3: 2. Pernyataan benar."},{"text":"Jika debit air ditingkatkan menjadi 10 liter per menit, bak mandi tersebut akan penuh 10 menit lebih cepat dibanding menggunakan keran semula.","answer":"Benar","explanation":"Langkah 1: Hitung waktu penuh dengan debit 10 liter/menit yaitu 150 10 = 15 menit. Langkah 2: Hitung perbedaan waktu penuhnya terhadap semula yaitu 25 𝑚𝑒𝑛𝑖𝑡−15 𝑚𝑒𝑛𝑖𝑡= 10 menit lebih cepat. Pernyataan benar."}],"explanation":""},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Seorang pengrajin kayu membuat model replika mini dari sebuah kapal layar kayu tradisional.\nDiketahui kapal sesungguhnya memiliki panjang total 24 meter dan lebar badannya adalah 6\nmeter. Model replika pengerjaan yang dibuat disetujui menerapkan nilai rasio skala panjang kapal\nmodel 1: 120. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai dimensi\nkapal model hasil pekerjaan pengrajin tersebut!","statements":[{"text":"Panjang model replika kapal layar tradisional tersebut setelah jadi adalah 20 cm.","answer":"Benar","explanation":"Langkah 1: Konversikan data meter kapal layar tradisional ke cm, didapat 24 meter = 2.400 cm. Langkah 2: Hitung ukuran di replikanya bersandarkan pembagi skalanya yaitu 2.400/120 = 20 cm."},{"text":"Lebar model replika kapal layar jika dihitung berskala sama adalah 12 cm.","answer":"Salah","explanation":"Langkah 1: Samakan satuan dari data lebar sebenarnya dari model asli menjadi sentimeter, diperoleh 6 𝑚𝑒𝑡𝑒𝑟= 600 cm. Langkah 2: Bagi bobot cm dengan skala proporsi yang disepakati untuk lebar kerja denahnya yaitu 600/120 = 5 cm, bukan 12 cm."},{"text":"Luas bidang dasar imajiner persegi panjang luar dari kapal model (panjang model dikalikan lebar model) adalah 100 cm 2.","answer":"Benar","explanation":"Langkah 1: Peroleh panjang gambar rancang (20 cm) dan lebarnya (5 cm) dari pengerjaan sebelumnya. Langkah 2: Selesaikan kalkulasi luasan dengan perkalian dimensi replikanya, didapat 20 𝑐𝑚× 5 𝑐𝑚= 100 cm 2."},{"text":"Selisih antara panjang dan lebar kapal model sesudah jadi berdasarkan pengerjaan adalah 15 cm.","answer":"Benar","explanation":"Langkah 1: Catat nilai hasil konversi panjang kapal model (20 cm) serta lebar kapal model (5 cm). Langkah 2: Ambil perbedaan ukurannya dengan melangsungkan operasi pengurangan selisih nilainya, didapat 20 𝑐𝑚−5 𝑐𝑚= 15 cm."}],"explanation":""},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Sebuah gedung olahraga sekolah memiliki panjang asli 40 meter, lebar 25 meter, dan tinggi 10\nmeter. Seorang siswa merancang maket fisik gedung tersebut dengan menggunakan rasio skala\nlinear 1: 200. Pada maket, direncanakan area lantai bagian dalam dicat merah dan seluruh\npermukaan luar keempat dindingnya dicat kuning (luas atap dan luas lantai luar tidak dihitung).\nBeri tanda centang (✓) pada setiap pernyataan yang benar mengenai maket tersebut!","statements":[{"text":"Luas bidang lantai maket bagian dalam gedung olahraga yang akan dicat dengan warna merah adalah 250 cm².","answer":"Benar","explanation":"Langkah 1: Konversi ukuran asli ke cm: panjang = 4.000 cm, lebar = 2.500 cm. Langkah 2: Hitung dimensi maket: panjang maket = 4.000 ÷ 200 = 20 cm, lebar maket = 2.500 ÷ 200 = 12,5 cm. Langkah 3: Luas lantai maket = 20 × 12,5 = 250 cm². Pernyataan ini benar."},{"text":"Perbandingan luas seluruh dinding samping maket luar terhadap luas dinding luar gedung aslinya adalah sebesar 1: 200.","answer":"Salah","explanation":"Langkah 1: Rasio luas antar dua dimensi adalah kuadrat dari rasio skala linear. Langkah 2: Rasio skala linear = 1 200. Langkah 3: Rasio perbandingan luas maket terhadap luas aslinya = ( 1 200)2 = 1: 40.000. Jadi, rasio 1: 200 salah."},{"text":"Volume maket dari bentuk ruang dalam gedung olahraga tersebut bernilai proporsional sebesar 5.000 cm³.","answer":"Salah","explanation":"Langkah 1: Dimensi maket panjang = 20 cm, lebar = 12,5 cm, tinggi = 1.000 ÷ 200 = 5 cm. Langkah 2: Hitung volume maket = 20 × 12,5 × 5 cm³. Langkah 3: Hasil volume maket = 1.250 cm³, bukan 5.000 cm³. Pernyataan salah."},{"text":"Total keseluruhan luas permukaan dinding luar maket gedung yang dicat kuning dihitung secara proporsional bernilai 325 cm².","answer":"Benar","explanation":"Langkah 1: Hitung ukuran dinding luar maket dengan panjang = 20 cm, lebar = 12,5 cm, tinggi = 5 cm. Langkah 2: Cari luas keliling permukaan selimut (seluruh dinding tegak) = 2 × (panjang + lebar) × tinggi. Langkah 3: Evaluasi luas = 2 × (20 + 12,5) × 5 = 2 × 32,5 × 5 = 325 cm². Pernyataan ini benar."}],"explanation":""},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Pelat pelat halaman depan yang sering difungsikan sebagai lokasi panggung upacara sekolahan\ndigambarkan oleh tukang gambar teknik sipil di sketsa draf lembar kerja berskala setara 1: 200,\ndengan dimensi trap cetakan tergambar memiliki bentangan panjang sebesar 30 𝑐𝑚 dipadukan\nkelebaran bergaris sebesar 18 𝑐𝑚. Pihak panitia pengembang sekolah sepakat menata rapi\nseantero pelat tanah asli di lokasi tersebut memakai anyaman material susunan batu beton\nberdaya tahan (paving block) senilai harga material flat murni sebesar Rp80.000,00 per meter\npersegi luas tapak aslinya. Pengembang menetapkan biaya ongkos pasang borongan\npemborong bernilai pasti flat sebesar Rp4.000.000,00 secara keseluruhan tanpa peduli luasan\nsisa halaman. Beri tanda centang (✓) pada setiap pernyataan yang valid di dalam renovasi murni\nsekolah tersebut!","statements":[{"text":"Besaran rentang linear panjang asli bersandingan kelebaran halaman utama depan upacara sesungguhnya berturut-turut setara berjarak 60 meter berpasangan lebar 36 meter.","answer":"Benar","explanation":"Langkah 1: Menghitung tatanan ukuran horizontal riil panjang murni di lapak tanah = 30 × 200 = 6.000 𝑐𝑚= 60 𝑚. Langkah 2: Melakukan pengolahan pada sektor lebar denah = 18 × 200 = 3.600 𝑐𝑚= 36 𝑚."},{"text":"Rancangan dana tunai belanja kotor pembelian unit material paving block murni lapangannya (belum digabung dana komisi upah kriya tukang) menghabiskan biaya total Rp172.800.000,00.","answer":"Benar","explanation":"Langkah 1: Dapatkan jangkauan real luas wilayah tapak halaman = 60 × 36 = 2.160 𝑚2. Langkah 2: Pakai acuan nilai bayaran per meter persegi yaitu Rp80.000,00. Langkah 3: Hitung total anyaman belanjanya = 2.160 × 𝑅𝑝80.000,00 = 𝑅𝑝172.800.000,00."},{"text":"Besaran segenap paket alokasi keuangan total operasional sekolah murni pembersihan sirkuit yang mesti disediakan demi membereskan masalah panggung depan halaman sekolah tuntas yaitu sebesar Rp176.800.000,00.","answer":"Benar","explanation":"Langkah 1: Dana pembelanjaan paving riil dasar terhitung murni = 𝑅𝑝172.800.000,00. Langkah 2: Alokasi pengeluaran wajib komisi kriya borongan pemborong pasang = 𝑅𝑝4.000.000,00. Langkah 3: Perpaduan segenap pengeluaran operasional = 172.800.000 + 4.000.000 = 𝑅𝑝176.800.000,00."},{"text":"Seandainya draf diredesain diperbesar rasionya mematangkan pemakaian rasio visual anyar berskala linear murni sebesar 1: 100, upah sewa paving lapangan meningkat genap 2 kali lipat biaya orisinil.","answer":"Salah","explanation":"Langkah 1: Biaya orisinil renovasi halaman bergantung murni penuh pada jangkauan luasan aslinya di dunia riil (2.160 𝑚2) yang besarnya adalah mutlak tidak dipengaruhi bentuk gambar denah lembaran mana pun. Redesain skala hanya menggeser jangkauan besarnya lukisan arsir gambar kertas namun membiarkan biaya paving panggung asli tetap bernilai tetap invariant."}],"explanation":""},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, membedakan, membandingkan, dan menentukan \nrasio (skala, proporsi, dan laju perubahan) serta menyelesaikan \npermasalahan kontekstual yang terkait","question":"Di lantai atas area dapur milik Rani terinstal bak mandi wadah Utama kosong tampungan bersih\nsebesar limit tampung 1.200 liter disusul bak sekunder penyuplai Cadangan cadangan bervolume\ntotal ruang muatan penuh sebersih 800 liter di level dasar. Kran pasokan pipa rumah tangga\ndialirkan konstan dari dinamo pompa Utama menyalur debit air deras konstan 40 liter/menit\nmenuju wadah Utama di atas. Saat kubangan air dari bak mandi paling atas keluberan mencapai\nbibir maksimal tangki tampungnya, maka letupan limpahannya akan lurus mengalir dari selang\nlimpas laju volume senilai 25 liter/menit lurus menyiram langsung membebani rongga dalam bak\nbagian bawah penyuplai cadangannya. Sialnya tepat berada di dinding titik koordinat sebanding\ntengah porsi bak cadangan dasar bawah tersebut (saat kapasitas genangan cadangan tengah\ntersi setinggi persis memuat 400 liter) terkelupas seonggok rongga retakan air bocor bocor terus\nmelempar air dari sistem sebanyak kelajuan tetap 5 liter/menit dari bak terbawah. Tentukan benar\natau salah nilai porsi rincian alur proses laju tandon air di rumah rani!","statements":[{"text":"Lamanya akumulatif waktu murni proses isi penampungan mula agar wadah bak paling Utama penampung air di bagian teratas penuh untuk memicu tetesan rembes luberan bawah terdeteksi berada di rentang angka 40 menit lamanya.","answer":"Salah","explanation":"Langkah 1: Kapasitas tampungan total bak atas dipaliri murni tanpa kebocoran setinggi volume air maksimum yaitu sebesar 1.200 liter. Langkah 2: Air bersumber stabil meluncur bermodalkan kran atas di kelajuan pasokan = 40 liter per menit. Langkah 3: Mengambil rumus volume kran ideal waktu memicu penuhnya pertama = 1.200/40 = 30 menit pengerjaan pipa, yang berarti rincian dari poin 40 menit salah."},{"text":"Rembesan luberan lubang pembuangan cacat bawah dari tangki tampungan tandon paling bawah mulai mengancam proses pembuangan dihitung secara kumulatif semenjak awal proses pengerukan dinyalakan menyentuh kisaran angka menit 42 porsi tempo pengisian.","answer":"Salah","explanation":"Langkah 1: Bak atas tuntas butuh tepat waktu pengerjaan 30 menit. Langkah 2: Limpasan limpah jatuh mengisi wadah penampung di bawah sejauh tengah tangki (tergenang di titik muatan setara 400 liter), yang mana butuh tempo sebesar = 400 liter air bersanding kecepatan alir pancaran limpas sebesar 25 liter per menit = 16 menit kerja. Langkah 3: Pengurasan miring pemicu pecah dasar mulai terhitung saat batas tengah bak bawah dicapai pada tatanan waktu ke = 30 menit di atas + 16 menit durasi limpasan = menit ke-46 kumulatif (bukan di menit ke-42)."},{"text":"Skala total dari kecepatan dinamis debit kran pengisian bersih netto untuk menggerakan kenaikan batas di wadah bagian dasar tersebut mulai merayap titik porsi 400 liter mencapai puncak diatur di posisi 20 liter/menit.","answer":"Benar","explanation":"Langkah 1: Limpas alir dari penampung Utama atas masuk di porsi tandon air di bawah dengan nilai 25 liter per menit. Langkah 2: Pasca meluap membanjiri di batas tengah tandon cadangan bawah, dipotong laju dari terlepas retakan berkuantitas bocor konstan 5 liter/menit. Langkah 3: Perolehan debit air bertingkat tandon netto pengisian = 25 −5 = 20 liter/menit. Nilai porsi penentuan benar."},{"text":"Total rincian perhitungan alur pengawasan kran mengalir terus-menerus terawat terkelola semenjak permulaan dinamo terpasang pertama agar menimbun seluruh wadah terendam kepenuhan mutlak sistem ganda ini menyita interval lamanya durasi 66 menit kerja kran.","answer":"Benar","explanation":"Langkah 1: Lilitan proses kerja tahap A = Isi Utama seberat tempo 30 menit lamanya. Langkah 2: Lilitan proses kerja tahap B = Isi tandon cadangan dasar ke titik separuhnya memakan porsi waktu = 400 liter air /25 l/m = 16 menit durasi tempo. Langkah 3: Sisa isi separuh tandon air bawah tersisisa 400 liter dirampingkan netto bocor barunya yaitu 20 liter per menit membutuhkan interval = 400/20 = 20 menit. Total = 30 + 16 + 20 = 66 menit keseluruhan waktu tuntas penuh wadah atas dan bawah."}],"explanation":""}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
