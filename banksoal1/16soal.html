<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Teorema Pythagoras</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT TEOREMA PYTHAGORAS</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 36</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Seorang nelayan berlayar dengan perahu dari pelabuhan ke arah utara sejauh 8 mil laut, kemudian berbelok ke arah timur sejauh 15 mil laut. Jarak terpendek dari pelabuhan asal ke lokasi kapal nelayan saat ini adalah ....","options":[{"key":"A","text":"7 mil laut"},{"key":"B","text":"17 mil laut"},{"key":"C","text":"23 mil laut"},{"key":"D","text":"289 mil laut"}],"answer":"B","explanation":"Perjalanan ke utara dan ke timur membentuk lintasan siku-siku dengan sisi penyiku 𝑎= 8 mil laut \ndan 𝑏= 15 mil laut. \nJarak terpendek adalah panjang hipotenusa (𝑐) dari segitiga siku-siku yang terbentuk. \nGunakan teorema Pythagoras: 𝑐2 = 𝑎2 + 𝑏2 = 82 + 152 = 64 + 225 = 289. \nTarik akar kuadrat dari 289: 𝑐= √289 = 17 mil laut."},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Sebuah ubin lantai berbentuk persegi memiliki panjang sisi 5 meter. Berapakah panjang garis diagonal ubin tersebut?","options":[{"key":"A","text":"5 meter."},{"key":"B","text":"5√2 meter."},{"key":"C","text":"5√3 meter."},{"key":"D","text":"10 meter."}],"answer":"B","explanation":"Diagonal persegi membagi persegi menjadi dua segitiga siku-siku sama kaki dengan sudut 45∘−\n45∘−90∘. \nPerbandingan sisi-sisi segitiga siku-siku sama kaki dengan panjang sisi 𝑠 adalah 𝑠: 𝑠: 𝑠√2. \nDengan panjang sisi 𝑠= 5 meter, maka panjang garis diagonal adalah 5√2 meter."},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Di sebuah taman bunga di Bandung, terdapat jalan setapak berbentuk segitiga siku-siku. Jika panjang jalan setapak terpanjang (hipotenusa) adalah 25 meter dan panjang salah satu jalan setapak penyikunya adalah 24 meter, berapakah panjang jalan setapak penyiku yang lainnya?","options":[{"key":"A","text":"7 meter."},{"key":"B","text":"14 meter."},{"key":"C","text":"35 meter."},{"key":"D","text":"49 meter."}],"answer":"A","explanation":"Diketahui panjang hipotenusa 𝑐= 25 meter dan salah satu sisi penyiku 𝑎= 24 meter. \nGunakan rumus teorema Pythagoras untuk mencari panjang sisi penyiku lainnya 𝑏: \n𝑏= √𝑐2 −𝑎2 \n𝑏= √252 −242 \n𝑏= √625 −576 \n𝑏= √49 = 7 meter."},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Seorang arsitek merancang atap rumah berbentuk segitiga siku-siku dengan salah satu sudut kemiringan sebesar 60∘ terhadap arah horizontal. Jika panjang sisi alas atap (sisi di samping sudut 60∘) adalah 5 meter, berapakah panjang sisi miring kemiringan atap dan tinggi atap tersebut berturut-turut?","options":[{"key":"A","text":"5√2 meter dan 5√3 meter"},{"key":"B","text":"10 meter dan 5√2 meter"},{"key":"C","text":"10 meter dan 5√3 meter"},{"key":"D","text":"10 meter dan 10√3 meter"}],"answer":"C","explanation":"Atap membentuk segitiga siku-siku dengan sudut istimewa 30∘−60∘−90∘. Sisi di samping sudut \n60∘ berukuran 5 meter. \nLangkah 1: Berdasarkan perbandingan sisi segitiga siku-siku istimewa, panjang sisi miring adalah \n2 kali sisi di samping sudut 60∘. Maka, sisi miring = 2 × 5 = 10 meter. \nLangkah 2: Tinggi atap (sisi di depan sudut 60∘) adalah √3 kali sisi di samping sudut 60∘. Maka, \ntinggi = 5√3 meter. \nJadi, panjang sisi miring dan tinggi atap berturut-turut adalah 10 meter dan 5√3 meter."},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Sebuah kapal berlayar dari pelabuhan A ke arah barat sejauh 120 km menuju pelabuhan B, lalu berbelok ke arah selatan sejauh 50 km menuju pelabuhan C. Jika kapal ingin kembali langsung dari pelabuhan C ke pelabuhan A dengan kecepatan rata-rata 13 km/jam, berapakah waktu yang dibutuhkan untuk perjalanan tersebut?","options":[{"key":"A","text":"5 jam."},{"key":"B","text":"8 jam."},{"key":"C","text":"10 jam."},{"key":"D","text":"13 jam."}],"answer":"C","explanation":"Hitung jarak langsung dari pelabuhan C ke pelabuhan A menggunakan teorema Pythagoras: \n𝐴𝐶= √1202 + 502 = √14400 + 2500 = √16900 = 130 km. \nHitung waktu perjalanan dengan membagi jarak dengan kecepatan rata-rata: 𝑊𝑎𝑘𝑡𝑢=\n130\n13 = 10 \njam. \nJawaban Benar: C."},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Sebuah kawat penyangga sepanjang 13 meter diikatkan dari puncak sebuah tiang setinggi 12 meter ke sebuah patok di tanah. Jika terdapat patok kedua yang dipasang searah namun berjarak 11 meter lebih jauh dari kaki tiang dibandingkan patok pertama, berapakah panjang kawat minimal yang dibutuhkan untuk menghubungkan puncak tiang ke patok kedua?","options":[{"key":"A","text":"15 meter."},{"key":"B","text":"16 meter."},{"key":"C","text":"20 meter."},{"key":"D","text":"24 meter."}],"answer":"C","explanation":"Cari jarak patok pertama ke kaki tiang: 𝑑1 = √132 −122 = √169 −144 = 5 meter. \nTentukan jarak patok kedua ke kaki tiang: 𝑑2 = 5 + 11 = 16 meter. \nHitung panjang kawat penyangga kedua menggunakan tinggi tiang (12 meter) dan jarak baru (16 \nmeter): 𝐿2 = √122 + 162 = √144 + 256 = √400 = 20 meter. \nJawaban Benar: C."},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Pak Budi memiliki sebidang tanah kosong yang setelah diukur memiliki panjang sisi-sisi sebesar 15 meter, 20 meter, dan 25 meter. Beliau berniat untuk menanami seluruh area tanah tersebut dengan rumput hias. Apabila biaya pemasangan rumput hias adalah Rp50.000,00 per meter persegi, berapakah total biaya yang harus dipersiapkan oleh Pak Budi?","options":[{"key":"A","text":"Rp3.750.000,00"},{"key":"B","text":"Rp5.000.000,00"},{"key":"C","text":"Rp6.250.000,00"},{"key":"D","text":"Rp7.500.000,00"}],"answer":"D","explanation":"Langkah 1: Buktikan jenis segitiga dari ukuran tanah tersebut menggunakan kebalikan teorema \nPythagoras. \nCek apakah 152 + 202 = 252. \n225 + 400 = 625. Karena nilainya sama, tanah tersebut berbentuk segitiga siku-siku dengan alas \n15 meter dan tinggi 20 meter. \nLangkah 2: Hitung luas tanah siku-siku tersebut. \n\nLuas = \n1\n2 × 𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖=\n1\n2 × 15 × 20 = 150 𝑚2. \nLangkah 3: Hitung total biaya penanaman rumput hias. \nTotal Biaya = 150 𝑚2 × 𝑅𝑝50.000,00/𝑚2 = 𝑅𝑝7.500.000,00."},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Dua buah tiang listrik masing-masing setinggi 15 meter and 7 meter berdiri tegak di atas tanah datar. Jarak antara kedua tiang tersebut adalah 15 meter. Seutas kawat penghubung akan dipasang lurus dari ujung atas tiang pertama ke ujung atas tiang kedua. Jika harga kawat adalah Rp20.000,00 per meter, berapakah total biaya pembelian kawat yang dibutuhkan?","options":[{"key":"A","text":"Rp300.000,00."},{"key":"B","text":"Rp320.000,00."},{"key":"C","text":"Rp340.000,00."},{"key":"D","text":"Rp440.000,00."}],"answer":"C","explanation":"Langkah 1: Menghitung selisih tinggi kedua tiang listrik untuk menentukan sisi tegak segitiga siku-\nsiku: ℎ= 15 −7 = 8 meter. \nLangkah 2: Menggunakan jarak antara tiang (15 meter) sebagai sisi datar, kemudian menghitung \npanjang kawat (sisi miring 𝑐): 𝑐= √82 + 152 = √64 + 225 = √289 = 17 meter. \nLangkah 3: Menghitung total biaya pembelian kawat: Total biaya = 17 𝑚𝑒𝑡𝑒𝑟× 𝑅𝑝20.000,00/\n𝑚𝑒𝑡𝑒𝑟= 𝑅𝑝340.000,00. \nJawaban Benar: C."},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Pak Joni ingin membuat bingkai kayu berbentuk segitiga siku-siku untuk hiasan dinding rumahnya. Beliau merencanakan tiga jenis bingkai dengan kombinasi panjang sisi sebagai berikut: Bingkai I (9 cm, 12 cm, 15 cm), Bingkai II (8 cm, 15 cm, 17 cm), dan Bingkai III (12 cm, 16 cm, 20 cm). Apabila beliau memiliki sebatang kayu lurus dengan panjang total 150 cm, berapakah sisa panjang kayu milik Pak Joni setelah berhasil membuat ketiga jenis bingkai siku- siku tersebut secara lengkap?","options":[{"key":"A","text":"26 cm"},{"key":"B","text":"34 cm"},{"key":"C","text":"42 cm"},{"key":"D","text":"50 cm"}],"answer":"A","explanation":"Langkah 1: Verifikasi apakah ketiga bingkai tersebut merupakan segitiga siku-siku (Tripel \nPythagoras). \nBingkai I: 92 + 122 = 81 + 144 = 225 = 152 (Benar siku-siku). Keliling I = 9 + 12 + 15 = 36 cm. \nBingkai II: 82 + 152 = 64 + 225 = 289 = 172 (Benar siku-siku). Keliling II = 8 + 15 + 17 = 40 cm. \nBingkai III: 122 + 162 = 144 + 256 = 400 = 202 (Benar siku-siku). Keliling III = 12 + 16 + 20 = 48 \ncm. \nLangkah 2: Jumlahkan keliling dari ketiga bingkai tersebut. \nTotal panjang kayu yang dibutuhkan = 36 + 40 + 48 = 124 cm. \nLangkah 3: Hitung sisa kayu. \nSisa kayu = 150 𝑐𝑚−124 𝑐𝑚= 26 cm."},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Kegiatan memilah validitas data dari himpunan Pythagoras dikonsepkan menggunakan dua kelompok pembanding yakni kumpulan data angka (7,24,25) dan data (20,21,29). Tentukan benar atau salah untuk setiap pernyataan yang mengacu kepada hitungan teoremanya!","statements":[{"text":"Analisis pembuktian memperlihatkan jika (7,24,25) lulus aturan tripel dikarenakan perolehan penjumlahan pangkat senilai 625.","answer":"Benar","explanation":"Kekuatan penjumlahan dibenarkan lewat proses aljabar murni 49 + 576 = 625 di mana kuadrat \ndari 25 tepat sama dengan 625."},{"text":"Himpunan angka berbentuk (20,21,29) dinyatakan lolos kualifikasi Pythagoras setelah penguraian relasi bernilai tepat sama.","answer":"Benar","explanation":"Pangkat dua dibedah menghasilkan nilai sepadan: 400 + 441 = 841 di mana hasil sejalan murni \ndari 292."},{"text":"Konstruksi dari segitiga bentukan yang masing-masing nilainya diduakalikan ke angka (14,48,50) menyimpang dari sifat tripel Pythagoras.","answer":"Salah","explanation":"Prinsip pengalian konstanta pengukur memperlihatkan nilai rasio kelipatannya di mana 142 +\n482 = 196 + 2304 = 2500 tepat setara 502."},{"text":"Setiap bilangan penunjuk sudut hipotenusa dalam deret tripel di atas terikat pada hubungan pembagi ganjil ganjil.","answer":"Salah","explanation":"Hubungan itu hanyalah aturan sekunder yang tidak merubah fungsi esensi identifikasi keunikan \npola Pythagoras asli."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Pada sebuah segitiga siku-siku 𝐴𝐵𝐶 dengan sudut siku-siku di 𝐵, panjang sisi depan sudut 𝐴 dinyatakan dengan 𝑎, panjang sisi depan sudut 𝐵 dinyatakan dengan 𝑏 sebagai hipotenusa, dan panjang sisi depan sudut 𝐶 dinyatakan dengan 𝑐. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai kegunaan rumus tersebut!","statements":[{"text":"Persamaan 𝑏2 = 𝑎2 + 𝑐2 adalah perumusan Teorema Pythagoras yang sah untuk kondisi di atas.","answer":"Benar","explanation":"Karena siku-siku terletak pada titik 𝐵, sisi miringnya adalah 𝑏 sehingga berlaku 𝑏2 = 𝑎2 + 𝑐2."},{"text":"Panjang kuadrat sisi miring sama besar dengan jumlah kuadrat sisi lainnya yang dapat diganti dengan rumus 𝑎2 = 𝑏2 + 𝑐2.","answer":"Salah","explanation":"Penulisan 𝑎2 = 𝑏2 + 𝑐2 tidak benar karena 𝑏 bertindak sebagai sisi terpanjang (hipotenusa)."},{"text":"Panjang sisi miring 𝑏 secara langsung didapatkan lewat proses penghitungan 𝑏= √𝑎2 + 𝑐2.","answer":"Benar","explanation":"Mencari panjang 𝑏 dapat langsung dilakukan dengan menarik akar kuadrat dari jumlah kedua \nkuadrat sisi tegak siku-sikunya."},{"text":"Persamaan sisi lainnya bernilai setara dari operasi selisih kuadrat 𝑐2 = 𝑏2 −𝑎2.","answer":"Benar","explanation":"Hubungan lain yang diturunkan dari teorema adalah 𝑐2 = 𝑏2 −𝑎2 yang merupakan hasil \nperpindahan ruas secara linear satu variabel."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Terdapat potongan kertas gambar bermodel luas persegi panjang yang ditata mendatar dengan jangkauan alas panjangnya sejauh 12 cm dan berlebar pinggir atas tinggi sebesar 5 cm. Tentukan benar atau salah untuk setiap pernyataan berikut mengenai sumbu penampang diagonal sudut penyeberangnya!","statements":[{"text":"Jangkauan nilai lintasan tarik diagonal penyeberang lurus diagonal utama yang memecah batas pinggir tersebut memiliki panjang tetap sebesar 13 cm.","answer":"Benar","explanation":"Mengukur dari kaidah hitung siku, diperoleh ukuran diagonal sama besar dengan hitungan \nkuadrat yaitu √122 + 52 = √144 + 25 = √169 = 13 cm."},{"text":"Ukuran tinggi diagonal yang ditarik sebidang di atas dipastikan bernilai melampaui hasil hitungan aritmetika penjumlahan langsungnya yaitu sepanjang 17 cm.","answer":"Salah","explanation":"Sebuah kesalahan asumsi konseptual (prosedur) penjumlahan lurus di mana hasil hitung \nmelampaui aturan nyata bahwa diagonal tidak langsung ditotal angka mentah luar saja."},{"text":"Luas penampang salah satu keping dari sayatan persegi panjang hasil potongan memiliki luas yang sama besar yaitu seharga 60 cm persegi.","answer":"Salah","explanation":"Sayatan lurus menghasilkan segitiga siku-siku sebidang dengan kalkulasi nilai separuh luas \nkeseluruhan persegi panjang yakni sebesar \n1\n2 × 12 × 5 = 30 cm persegi."},{"text":"Kerangka hitungan perataan letak garis pemutus keping sudut tengah ditulis searah perumusan Pythagoras teoretis berbentuk 𝑑𝑖𝑎𝑔𝑜𝑛𝑎𝑙= √122 + 52.","answer":"Benar","explanation":"Aturan formula teoretis Pythagoras menerangkan pencarian diagonal siku diperoleh melalui \nrumus nilai perakaran akar pangkat kuadrat akumulatif pembangun tegak."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Paman membeli komponen dua ruas potong rotan hias guna dirangkai menyatu tegak lurus menjadi pola bingkai layang-layang 𝐴𝐵𝐶𝐷 yang bersilangan tepat pada satu pusat persilangan berlabel 𝑂. Rincian data rancangannya memperlihatkan ukuran sambungan atas dari persimpangan tegak adalah 𝐴𝑂= 6 cm, penahan diagonal vertikal arah bawahnya 𝑂𝐶= 15 cm, sementara ikatan salah satu tepian anyaman bawah bagian pinggir luar didesain sejauh 𝐵𝐶= 17 cm. Beri tanda centang (✓) pada setiap pernyataan yang benar terkait layang-layang tersebut!","statements":[{"text":"Bilah kayu bilah kayu hias silangan mendatar yang digunakan untuk tiang horizontal lintasan sayap membentang melintang layang-layang memiliki rentang terukur bernilai 8 cm.","answer":"Salah","explanation":"Melalui konsep Pythagoras dalam segitiga siku-siku di 𝐵𝑂𝐶, panjang dari bilah setengah bagian \n𝑂𝐵 yaitu 𝑂𝐵= √𝐵𝐶2 −𝑂𝐶2 = √172 −152 = √289 −225 = √64 = 8 cm. Namun demikian, \npanjang total potongan mendatar diagonal melintang adalah ruas utuh dari bentukan horizontal \nsayap layang-layang 𝐵𝐷, yang mana dihitung dari 2 × 𝑂𝐵= 2 × 8 cm = 16 cm."},{"text":"Jarak yang mengubungkan titik hubung anyaman bagian miring di sisi kawat tali sayap tepi paling atas segitiga luar dari hiasan pajangan berukuran sepanjang 12 cm.","answer":"Salah","explanation":"Setelah menentukan komponen tinggi diagonal datar bagian samping yakni 𝑂𝐵= 8 cm, jarak \nbagian penopang atas pinggiran bingkai anyaman layang-layang ditentukan dari model \nmatematika miring: 𝐴𝐵= √𝐴𝑂2 + 𝑂𝐵2 = √62 + 82 = √36 + 64 = √100 = 10 cm."},{"text":"Keseluruhan lintasan garis tepi keliling paku lilit kawat anyaman dekorasi pembentuk layang- layang adalah 54 cm.","answer":"Benar","explanation":"Hiasan dinding layang-layang memuat jajaran panjang berpasangan. Diketahui panjang \nsepasang sisi anyaman bawah 𝐵𝐶= 𝐶𝐷= 17 cm dan sepasang anyaman siku atas 𝐴𝐵= 𝐴𝐷=\n10 cm. Total ukuran garis pinggiran anyaman keliling dinding pembentuk kincir ditambahkan \nmelingkar = 10 + 10 + 17 + 17 = 54 cm."},{"text":"Total luasan kertas film perekat yang digunakan paman untuk menyelubungi rincian kertas layang-layang dengan baik berukuran total daerah sebesar 168 cm persegi.","answer":"Benar","explanation":"Panjang diagonal total hiasan yang bersilangan adalah diagonal tegak 𝐴𝐶= 𝐴𝑂+ 𝑂𝐶= 6 + 15 =\n21 cm dan diagonal silang horizontal melintang 𝐵𝐷= 16 cm. Menyesuaikan formula dasar dari \nbangun datar geometrik berupa luas layang-layang, maka luas =\n𝑑𝑖𝑎𝑔𝑜𝑛𝑎𝑙1×𝑑𝑖𝑎𝑔𝑜𝑛𝑎𝑙2\n2\n=\n21×16\n2\n= 168 \ncm persegi."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Seseorang melangkah menanjaki tebing tinggi suatu gundukan lereng tanah guna melakukan observasi ketinggian daerah persawahan. Tinggi elevasi lurus secara tegak di permukaan datar didapati bernilai tegak sejauh 360 meter serta ujung batas mulanya lintasan as bawah dasar tumpuan tebing memiliki kedudukan menjauh horizontal selebar 150 meter dari bayang kaki dasar ketinggian lereng atas. Tentukan benar atau salah untuk setiap pernyataan berikut terkait hasil analisis lereng penjelajah tersebut!","statements":[{"text":"Panjang as miring jalan tanah lereng pendakian lurus tebing berpagar daki pendaki hingga tiba selamat menyentuh target puncaknya sejauh 390 meter.","answer":"Benar","explanation":"Aspek bentang bidang lintasan naik yang membentuk posisi Pythagoras horizontal lurus serta \nsudut kemiringan vertikal: 𝐽𝑎𝑟𝑎𝑘= √3602 + 1502 = √129600 + 22500 = √152100 = 390 meter."},{"text":"Bila dibandingkan ditarik mendaki lurus lurus miring dari lereng berpagar miring di jalur banding harus melayang ditarik daki miring vertikal selisih tingginya hanyalah 30 meter.","answer":"Benar","explanation":"Kombinasi hasil tebing lurus tegak ke puncak dibanding lintasan mendaki: 390 meter −360 meter \n= 30 meter."},{"text":"Jika diletakkan setara bahwa kelajuan kecepatan melangkah stabil naik pendaki dalam lintasan lurus miring tebing tanah berpasir itu merangkak pas di posisi 13 meter/menit, as waktu jalan dihitung menyentuh pas sejauh 30 menit berjalan kaki.","answer":"Benar","explanation":"Porsi pembagian matematis durasi lari merambat tanjakan jalan mendaki tebing setinggi rute di \nlapangan: 𝐷𝑢𝑟𝑎𝑠𝑖=\n390\n13 = 30 menit perjalanan murni terbuktikan BENAR."},{"text":"Keliling keseluruhan tepi lilitan daerah potong penampang lereng berpenampilan segitiga siku- siku tersebut jika ditata rapat total berkisaran keliling melingkari batas di angka sebesar 540 meter.","answer":"Salah","explanation":"Tembokan lilit luar keliling area dilingkupi lintasan nyata adalah: 𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔= 360 + 150 + 390 =\n900 meter, bukan 540 meter."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Seorang guru memberikan teka-teki mengenai tiga buah tongkat yang memiliki ukuran panjang masing-masing 𝑎= 2𝑥 cm, 𝑏= (2𝑥+ 2) cm, dan 𝑐= (2𝑥+ 4) cm. Diketahui bahwa ketiga tongkat tersebut dapat disusun menjadi sebuah bentuk segitiga siku-siku dengan sisi terpanjang 𝑐 cm. Evaluasilah karakteristik dari ukuran panjang tongkat tersebut! Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Nilai variabel 𝑥 yang paling tepat untuk menyusun segitiga siku-siku tersebut adalah 3 cm.","answer":"Benar","explanation":"Gunakan aturan Pythagoras: (2𝑥)2 + (2𝑥+ 2)2 = (2𝑥+ 4)2 ⇒4𝑥2 + 4𝑥2 + 8𝑥+ 4 = 4𝑥2 + 16𝑥+\n16 ⇒4𝑥2 −8𝑥−12 = 0 ⇒𝑥2 −2𝑥−3 = 0. Faktorisasi (𝑥−3)(𝑥+ 1) = 0. Diperoleh nilai positif \n𝑥= 3 cm."},{"text":"Keliling dari segitiga siku-siku yang berhasil dibentuk oleh susunan ketiga tongkat tersebut adalah 30 cm.","answer":"Salah","explanation":"Substitusikan nilai 𝑥= 3, maka diperoleh panjang ketiga tongkat adalah 𝑎= 6 cm, 𝑏= 8 cm, dan \n𝑐= 10 cm. Keliling segitiga siku-siku tersebut adalah 6 + 8 + 10 = 24 cm."},{"text":"Luas dari wilayah segitiga siku-siku yang disusun oleh ketiga panjang tongkat tersebut adalah 24 𝑐𝑚2.","answer":"Benar","explanation":"Karena sisinya 6 cm, 8 cm, dan 10 cm, maka sisi penyangga tegak adalah 6 cm dan 8 cm. Luas \nsegitiga dihitung dengan \n1\n2 × 𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖=\n1\n2 × 6 × 8 = 24 𝑐𝑚2."},{"text":"Ketiga panjang tongkat yang dibentuk tidak memenuhi kriteria kelompok bilangan Tripel Pythagoras.","answer":"Salah","explanation":"Kombinasi panjang sisi segitiga yang didapat adalah 6 cm, 8 cm, dan 10 cm. Ketiganya \nmerupakan kelipatan dari rasio (3,4,5) yang membentuk segitiga siku-siku, sehingga merupakan \nbilangan Tripel Pythagoras."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Dua detasemen SAR pencari sukarelawan melakukan pembelahan eksplorasi evakuasi tebing curam berselisih lereng terjal dari tapak pangkal stasiun basecamp kemah penolong awal di tanah rata. Kelompok perintis pendaki kesatu beranjak membelah lereng berlintasan condong miring stabil searah kemiringan bukit timur yang setelah direkam instrumen memisahkan as mendatar tanah tebing berjarak sejauh 90 meter dan elevasi posisi lurus tegak bertinggi 120 meter dari pangkal tenda penolong awal. Kelompok tanggap darurat kedua menjelajahi tebing miring jalur curam sebaliknya ke bukit bagian sebelah barat menyusuri bentangan tebing batu lereng panjang bertinggi kawat tali lurus 260 meter dari bukit ujung jurang tanah penahan atas berketinggian tiang vertikal persis berselisih sekat murni tegak 100 meter dihitung tegak ke bawah dari bidang lantai horizontal basecamp mula. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai kalkulasi logistik SAR penolong ini!","statements":[{"text":"Material garis lurus bentang rute setapak peniti miring lereng lerengan yang telah diinvasi dilompati secara lurus oleh pejuang tim Kelompok perintis satu dari as pos basecamp darurat sepanjang tepat 130 meter.","answer":"Salah","explanation":"Berdasar parameter Teorema Pythagoras, kelonjakan kemiringan pejalan pada as koordinat bukit \nsetapak timur adalah 𝑠𝑑= √902 + 1202 = √8100 + 14400 = √22500 = 150 meter. Maka panjang \npendakian Kelompok kesatu bernilai bulat 150 meter, bukan berupa besaran nilai angka 130 \nmeter."},{"text":"Lebar jangkauan jarak koordinat lateral horizontal horizontal diukur murni as lantai horizontal ubin mendatar, antara stasiun tenda B basecamp utama sampai dengan garis dinding lereng terbawah pijak landas kordon tim penolong kelompok kedua menginjak dataran bawah barat, bernilai 240 meter.","answer":"Benar","explanation":"Rentang horizontal mendatar tanah bagi pejalan tim tebing barat diukur dengan Pythagoras murni \nterhadap bentang kawat lereng lintasan 260 m dengan selisih beda vertikal tegak 100 m. Maka \nsasis as datar penunjuk horizontal tersebut didapatkan 𝑑𝑏𝑎𝑟𝑎𝑡= √2602 −1002 =\n√67600 −10000 = √57600 = 240 meter."},{"text":"Apabila digabung mengapit lurus murni seberang rentangan total posisi lateral dari kedua kedudukan dasar bukit tebing landasan antara bukit wilayah pertama dan kedua asis tapak tanah kaki horizontal di tebing seberang jika ditarik linier garis horizontal selevel menyamping horizontal rata setara sekat datar adalah 330 meter.","answer":"Benar","explanation":"Kedua kelompok menempati area lintasan arah miring berseberangan (timur dan barat) yang \nsumbunya dijepit as awal basecamp 0 koordinat mendatarnya. Perhitungan akumulasi sasis \nlateral horizontal teras landasan tapak lurus secara terpadu diringkas lurus: 𝑑𝑡𝑖𝑚𝑢𝑟+ 𝑑𝑏𝑎𝑟𝑎𝑡=\n90 + 240 = 330 meter."},{"text":"Jika dihela bentang penghubung kabel transmisi gantung imajiner secara langsung lurus udara menghubungkan koordinat kamp persemayaman stasiun lari regu pertama dari atas puncak ketinggian meluncur lurus menuju sasis tenda pos pemantauan darat regu penolong kelompok dua, diperlukan panjang bentangan kawat minimum murni sepanjang √109300 meter.","answer":"Benar","explanation":"Elevasi kelompok pertama = 120 meter, sedang kelompok kedua = 100 meter di atas tingkat rata \n(artinya sasis as elevasi tegaknya selisih sebesar 120 −100 = 20 meter). Sedangkan tumpuan \ngaris lintang jarak sumbu mendatar anyaman adalah sejauh 330 meter. Melalui hitungan \nTeorema Pythagoras untuk asis miring bebas tersebut: 𝑟𝑑= √3302 + 202 = √108900 + 400 =\n√109300 meter."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Sebuah rangka jembatan kecil dirancang menggunakan kawat-kawat penguat baja yang terpasang membentang menopang kekuatan beban jembatan menuju kaki tiang tumpuan. Struktur baja tumpuan kawat pertama dipasangkan tegak pada puncak kawat teratas tiang besi pada ketinggian vertikal sejauh 15 meter ditarik ke atas dari permukaan rata bidang dasar dan ujung satunya disangkutkan pada patok pondasi jembatan berjarak sejauh 8 meter mendatar dari dasar tiang besi tumpuan jembatan. Pengawas ingin memperkuat bagian tengah penumpu dengan mendatangkan kabel kedua tambahan yang terikat di tinggi tertentu dari permukaan bidang tiang penahan dengan titik koordinat letak jangkar penjangkar jembatan ditarik pada posisi jangkar horizontal yang tetap sama di lantai jembatan di ketinggian 6 meter. Tentukan benar atau salah untuk setiap pernyataan berikut untuk membantu mengukur dan mempersiapkan estimasi kelayakan kabel penopang tambahan tersebut!","statements":[{"text":"Panjang minimal kabel kawat penyangga pertama yang wajib disediakan dalam menumpu kekuatan jembatan adalah sepanjang 17 meter.","answer":"Benar","explanation":"Langkah 1: Melakukan rekonstruksi letak segitiga dengan parameter siku-siku dari jarak tumpuan \njembatan setinggi 15 meter dan jarak pijakan pondasi penahan 8 meter. Langkah 2: Memasukkan \ndalam hitungan formula Pythagoras di mana 𝑐2 = 𝑎2 + 𝑏2. Langkah 3: Menyelesaikan nilai \noperasional matematikanya, √152 + 82 = √225 + 64 = √289 = 17 meter. Sehingga, panjang tali \npenguat pertamanya memang bernilai 17 meter. Jadi pernyataan ini benar."},{"text":"Ukuran kebutuhan panjang minimum yang dihitung bagi penyediaan material baja penguat kabel kedua di bawahnya adalah sepanjang 10 meter.","answer":"Benar","explanation":"Langkah 1: Mengubah peruntukan komponen pengerjaan siku-siku segitiga kedua yakni memakai \ndimensi tinggi pancang kabel yaitu 6 meter dan tumpuan horizontal penopang jembatan 8 meter. \nLangkah 2: Merumuskan hukum persamaan kemiringan dari rumus dasar Pythagoras. Langkah \n3: Memecahkan nilai hasil operasional numerasi panjang sisi kemiringannya, √62 + 82 =\n√36 + 64 = √100 = 10 meter. Sehingga kawat kedua haruslah sepanjang 10 meter. Jadi \npernyataan ini benar."},{"text":"Selisih panjang potongan baja antara kabel baja penyangga pertama dan baja penyangga kawat penyokong kedua adalah sepanjang 7 meter.","answer":"Benar","explanation":"Langkah 1: Mengetahui panjang tali utama penumpu atas baja adalah bernilai sebesar 17 meter \n(didapat dari analisis pengerjaan di pernyataan kesatu). Langkah 2: Mengidentifikasi kebutuhan \nkabel kedua yang memiliki panjang total kawat pembangun adalah sepanjang 10 meter (hasil \npencarian matematis dari pengerjaan pada pernyataan kedua). Langkah 3: Melakukan selisih \noperasi pengurangan secara numeratif pada dimensi jaraknya, didapatkan 17 −10 = 7 meter. \nJadi pernyataan ini benar."},{"text":"Jumlah akumulatif kebutuhan total ketersediaan dari kawat penyangga satu dan penyokong baja kedua yang dibeli pembangun jembatan mini adalah 30 meter.","answer":"Salah","explanation":"Langkah 1: Mengidentifikasi ukuran kawat satu dari penjabaran matematis sebelumnya di mana \nbernilai sepanjang 17 meter. Langkah 2: Menetapkan kawat penyokong kedua penumpu baja dari \nperhitungan numerik di atas yaitu sepanjang 10 meter. Langkah 3: Menghitung total kebutuhan \npengadaan bahan pengaku kawat lewat penggabungan numerik secara akumulatif, 17 meter + 10 \nmeter = 27 meter, bukan senilai 30 meter. Jadi pernyataan ini salah."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menganalisis dan menentukan teorema Pythagoras, tripel Pythagoras, panjang sisi segitiga, dan perbandingan sisi segitiga siku-siku istimewa","question":"Dua tiang lampu vertikal taman dipasang berhadapan di atas lahan horizontal yang datar. Ketinggian tiang lampu hias yang pertama adalah 9 meter, dan tiang kedua setinggi 14 meter, dengan jarak antar kaki tiang bawah di tanah horizontal adalah sepanjang 12 meter. Pengelola memasang jala kawat lampu kerlip penghubung berbentuk lurus langsung dari puncak atas tiang pertama ke kaki tiang kedua, serta dari puncak atas tiang kedua ke puncak tiang pertama. Beri tanda centang (✓) pada setiap pernyataan yang benar apabila tarif pemasangan kabel berharga Rp10.000 per meternya!","statements":[{"text":"Ukuran kawat lurus dekorasi penyambung dari ujung atas tiang lampu pertama ke dasar kaki tiang kedua sepanjang 15 meter.","answer":"Benar","explanation":"Kawat tumpu membentuk segitiga dengan alas 12 meter dan tinggi 9 meter. Maka kawat \npenghubung = √122 + 92 = √144 + 81 = √225 = 15 meter."},{"text":"Besar tarif upah kawat lurus dekoratif terpendek yang memanjang dari bagian tumpuan tiang atas lampu pertama ke dasar tiang lampu kedua menghabiskan dana Rp170.000.","answer":"Salah","explanation":"Panjang kawat atas tiang pertama ke tumpuan dasar tiang kedua adalah 15 meter. Tarif yang \ndiperlukan adalah 15 × 𝑅𝑝10.000 = 𝑅𝑝150.000, bukan Rp170.000."},{"text":"Jumlah panjang kawat horizontal penyekat dari ketinggian puncak lampu atas kedua ditarik langsung ke tumpuan tiang lampu kaki pertama sepanjang 16 meter.","answer":"Salah","explanation":"Siku penyusun memiliki panjang tumpu alas 12 meter dan tinggi vertikal tiang 14 meter. Maka \npanjangnya adalah 𝑑= √122 + 142 = √144 + 196 = √340 ≈18,44 meter."},{"text":"Bentang ukuran kawat yang ditarik horizontal dari tumpuan atas puncak tiang pertama ke tiang atas lampu kedua berjarak 13 meter.","answer":"Benar","explanation":"Sisi tegak perbedaannya adalah 𝛥𝑦= 14 −9 = 5 meter. Sisi horizontal ditarik miring =\n√52 + 122 = √25 + 144 = √169 = 13 meter."}]},{"number":19,"level":1,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Pada koordinat Kartesius pertahanan wilayah udara nasional, posisi stasiun radar pemancar berada di titik (1,1) sedangkan menara penerima sinyal berada di titik (7,9). Jarak lurus antar- kedua fasilitas militer tersebut adalah ....","options":[{"key":"A","text":"10 satuan"},{"key":"B","text":"14 satuan"},{"key":"C","text":"24 satuan"},{"key":"D","text":"48 satuan"}],"answer":"A","explanation":"Gunakan rumus jarak antara dua titik koordinat Kartesius: 𝑑= √(𝑥2 −𝑥1)2 + (𝑦2 −𝑦1)2 \nSubstitusikan titik koordinat (1,1) dan (7,9): 𝑥2 −𝑥1 = 7 −1 = 6 dan 𝑦2 −𝑦1 = 9 −1 = 8 \nHitung kuadrat dan jumlahkan: 𝑑= √62 + 82 = √36 + 64 = √100 \nTarik akar kuadrat untuk mendapatkan hasil akhir: 𝑑= 10 satuan"},{"number":20,"level":1,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Sebuah tangga sepanjang 13 meter disandarkan pada dinding rumah adat di Yogyakarta. Jika jarak ujung bawah tangga ke dinding adalah 5 meter, tinggi dinding yang dicapai oleh ujung atas tangga adalah ....","options":[{"key":"A","text":"12 meter"},{"key":"B","text":"13 meter"},{"key":"C","text":"18 meter"},{"key":"D","text":"25 meter"}],"answer":"A","explanation":"Tangga, dinding, dan lantai membentuk segitiga siku-siku. Panjang tangga adalah sisi miring (𝑐=\n13 meter) dan jarak bawah tangga ke dinding adalah salah satu sisi tegak (𝑎= 5 meter). \nUntuk mencari tinggi dinding (𝑏), gunakan teorema Pythagoras: 𝑏= √𝑐2 −𝑎2. \nSubstitusikan nilai yang diketahui: 𝑏= √132 −52 = √169 −25 = √144 = 12 meter."},{"number":21,"level":1,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Sebuah kabel baja penyangga tiang bendera di halaman Keraton Yogyakarta dikaitkan ke tanah dengan jarak 5 meter dari kaki tiang bendera. Jika panjang kabel baja tersebut adalah 13 meter, tinggi tiang bendera tersebut adalah ....","options":[{"key":"A","text":"8 meter"},{"key":"B","text":"10 meter"},{"key":"C","text":"12 meter"},{"key":"D","text":"18 meter"}],"answer":"C","explanation":"Langkah 1: Mengidentifikasi bahwa kabel baja, tanah, dan tiang bendera membentuk segitiga \nsiku-siku dengan hipotenusa (sisi miring) sepanjang 13 meter dan salah satu sisi siku-sikunya 5 \nmeter. \nLangkah 2: Menggunakan Teorema Pythagoras untuk menghitung tinggi tiang bendera (𝑡): 𝑡=\n√132 −52 = √169 −25 = √144 = 12 meter."},{"number":22,"level":2,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Sebuah taman berbentuk belah ketupat memiliki panjang diagonal masing-masing 32 meter dan 24 meter. Di sekeliling taman tersebut akan ditanami pohon pucuk merah dengan jarak antar pohon adalah 2 meter. Berapakah banyak pohon pucuk merah yang dibutuhkan untuk menutupi seluruh keliling taman tersebut?","options":[{"key":"A","text":"10 pohon"},{"key":"B","text":"20 pohon"},{"key":"C","text":"28 pohon"},{"key":"D","text":"40 pohon"}],"answer":"D","explanation":"Langkah 1: Menghitung panjang sisi belah ketupat menggunakan setengah panjang diagonalnya \n(16 m dan 12 m). \nSisi = √162 + 122 = √256 + 144 = √400 = 20 meter \nLangkah 2: Menghitung keliling taman dan banyak pohon. \nKeliling = 4 × 20 = 80 meter \nBanyak pohon = \n80\n2 = 40 pohon"},{"number":23,"level":2,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Wayan membuat kerangka layang-layang tradisional Bali. Panjang diagonal horizontal layang- layang tersebut adalah 16 cm yang berpotongan tegak lurus dengan diagonal vertikal. Panjang sisi bagian atas layang-layang adalah 10 cm dan tinggi bagian bawah dari titik potong diagonal adalah 15 cm. Keliling layang-layang yang dibuat Wayan adalah ....","options":[{"key":"A","text":"25 cm"},{"key":"B","text":"34 cm"},{"key":"C","text":"50 cm"},{"key":"D","text":"54 cm"}],"answer":"D","explanation":"Langkah 1: Tentukan panjang sisi miring bagian bawah layang-layang (𝑠2). Setengah dari \ndiagonal horizontal adalah 8 cm dan tinggi bagian bawah adalah 15 cm. \n𝑠2 = √82 + 152 = √64 + 225 = √289 = 17 cm. \nLangkah 2: Hitung keliling layang-layang dengan menjumlahkan seluruh panjang sisinya (dua sisi \natas sepanjang 10 cm dan dua sisi bawah sepanjang 17 cm). \nKeliling = 2 × 10 + 2 × 17 = 20 + 34 = 54 cm."},{"number":24,"level":2,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Sebuah tiang pemancar sinyal telekomunikasi di Surabaya disangga oleh dua kawat baja di kedua sisi yang berlawanan. Kawat pertama memiliki panjang 15 meter dan dikaitkan pada pasak tanah berjarak 9 meter dari kaki tiang. Kawat kedua dikaitkan pada pasak tanah lainnya berjarak 5 meter dari kaki tiang. Panjang kawat kedua tersebut adalah ....","options":[{"key":"A","text":"9 meter"},{"key":"B","text":"13 meter"},{"key":"C","text":"15 meter"},{"key":"D","text":"20 meter"}],"answer":"B","explanation":"Langkah 1: Menghitung tinggi tiang pemancar (𝑡) terlebih dahulu menggunakan kawat pertama \ndan jarak pasaknya: 𝑡= √152 −92 = √225 −81 = √144 = 12 meter. \nLangkah 2: Menghitung panjang kawat kedua (𝑘) menggunakan tinggi tiang dan jarak pasak \nkedua: 𝑘= √122 + 52 = √144 + 25 = √169 = 13 meter."},{"number":25,"level":3,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Pada peta taman bermain dalam koordinat Kartesius, letak Bianglala berada pada titik 𝐴(3,2) dan Komidi Putar pada titik 𝐵(7,7). Sebuah wahana baru, Kora-Kora, akan dibangun pada titik 𝐶(𝑥, 7) dengan syarat jarak lurusnya dari Bianglala adalah 13 satuan dan posisinya berada di sebelah timur (kanan) Komidi Putar. Jarak antara Komidi Putar dan Kora-Kora adalah ....","options":[{"key":"A","text":"5 satuan"},{"key":"B","text":"6 satuan"},{"key":"C","text":"7 satuan"},{"key":"D","text":"8 satuan"}],"answer":"D","explanation":"Langkah 1: Hitung perbedaan koordinat vertikal (y) antara titik A dan C: 𝛥𝑦= 7 −2 = 5 satuan. \nLangkah 2: Gunakan Teorema Pythagoras untuk mencari perbedaan koordinat horizontal (x) \nantara A dan C: 𝛥𝑥= √132 −52 = √169 −25 = 12 satuan. \nLangkah 3: Tentukan koordinat x dari C. Karena C berada di sebelah timur, maka 𝑥𝐶= 3 + 12 =\n15. Koordinat titik C adalah (15,7), yang berada di sebelah timur Komidi Putar 𝐵(7,7) karena 15 >\n7. \nLangkah 4: Hitung jarak antara B dan C: 𝑑= 15 −7 = 8 satuan."},{"number":26,"level":3,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Dua orang pengamat, Wayan dan Ketut, berdiri di atas menara pandang setinggi 24 meter di Pantai Kuta. Wayan melihat sebuah kapal 𝐴 di laut dengan jarak pandang langsung sejauh 25 meter. Di arah yang berlawanan, Ketut melihat kapal 𝐵 dengan jarak pandang langsung sejauh 26 meter. Jika menara pandang terletak pada garis lurus antara kapal 𝐴 dan kapal 𝐵, berapakah jarak antara kedua kapal tersebut?","options":[{"key":"A","text":"3 meter"},{"key":"B","text":"17 meter"},{"key":"C","text":"35 meter"},{"key":"D","text":"51 meter"}],"answer":"B","explanation":"Langkah 1: Menghitung jarak horizontal dari kaki menara ke Kapal 𝐴 menggunakan Teorema \nPythagoras: 𝑥𝐴= √252 −242 = √625 −576 = √49 = 7 meter. \n\nLangkah 2: Menghitung jarak horizontal dari kaki menara ke Kapal 𝐵: 𝑥𝐵= √262 −242 =\n√676 −576 = √100 = 10 meter. \nLangkah 3: Karena arah pengamatan berlawanan dan menara berada di antara kedua kapal, \nmaka jarak kedua kapal adalah penjumlahan dari kedua jarak horizontal tersebut: 𝑥𝐴+ 𝑥𝐵= 7 +\n10 = 17 meter."},{"number":27,"level":3,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Seorang perajin hiasan dinding di Bandung membuat sebuah papan nama berbentuk segitiga sama kaki. Panjang sisi alas papan nama tersebut adalah 18 cm dan keliling total papan adalah 48 cm. Luas permukaan papan nama berbentuk segitiga tersebut adalah ....","options":[{"key":"A","text":"54 cm²"},{"key":"B","text":"108 cm²"},{"key":"C","text":"135 cm²"},{"key":"D","text":"270 cm²"}],"answer":"B","explanation":"Langkah 1: Tentukan panjang sisi miring segitiga sama kaki tersebut. Karena kelilingnya 48 cm \ndan sisi alas 18 cm, panjang dua sisi yang sama adalah 2𝑠= 48 −18 = 30 cm, sehingga 𝑠= 15 \ncm. \nLangkah 2: Hitung tinggi segitiga (𝑡) menggunakan Teorema Pythagoras dengan sisi miring 15 \ncm dan setengah sisi alas yaitu \n18\n2 = 9 cm: 𝑡= √152 −92 = √225 −81 = √144 = 12 cm. \nLangkah 3: Hitung luas segitiga tersebut: 𝐿=\n1\n2 × 𝑎𝑙𝑎𝑠× 𝑡𝑖𝑛𝑔𝑔𝑖=\n1\n2 × 18 × 12 = 108 cm²."},{"number":28,"level":1,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Sebuah papan seluncur anak di taman bermain dirancang bertumpu kencang pada platform tiang tangga berdiri tegak lurus dengan permukaan tanah berketinggian 3 meter. Diukur horizontal, titik jatuh pendaratan ujung seluncur paling bawah ke letak pangkal pondasi tiang adalah sejauh 4 meter. Beri tanda centang (✓) pada setiap pernyataan geometri fisis seluncur yang bernilai benar!","statements":[{"text":"Posisi tinggi tiang dan kedudukan garis lantai lurus ke depan saling bertindak sebagai sepasang garis siku penyiku segitiga.","answer":"Benar","explanation":"Karena tiang pancang berada tegak lurus mengarah ke langit berbanding garis lantai rata tanah \nyang mendatar sempurna membentuk jalinan sudut 90∘. Pernyataan ini benar."},{"text":"Panjang fisik lintasan meluncur pada permainan seluncuran tersebut adalah sebesar 7 meter.","answer":"Salah","explanation":"Panjang seluncur merupakan hipotenusa sehingga ditarik √32 + 42 = 5 meter, bukan hasil jumlah \nsembarang linear biasa (3 + 4 = 7). Pernyataan ini salah."},{"text":"Panjang lintasan kemiringan bidang geser untuk jalur luncur anak dari puncak tangga sampai ke lantai adalah sejauh 5 meter.","answer":"Benar","explanation":"Benar sesuai kaidah penyiku 𝑠= √32 + 42 = √25 = 5 meter. Sisi hipotenusa yang miring adalah \nsebesar 5 meter. Pernyataan ini benar."},{"text":"Nilai dari perhitungan kuadrat untuk sisi miring utama wahana papan luncuran adalah tepat sama dengan 25 satuan kuadrat.","answer":"Benar","explanation":"Dari hitungan sisi miring sepanjang 5 meter diperoleh hasil nilai pangkat dua 52 = 25 satuan \nsecara tepat. Pernyataan ini benar."}]},{"number":29,"level":1,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Sebuah tangga besi panjangnya 13 meter disandarkan pada dinding tegak bangunan rumah adat Bali. Diketahui jarak mendatar ujung bawah tangga dari tiang terbawah dinding adalah sejauh 5 meter. Tentukan benar atau salah untuk setiap pernyataan berikut tentang keselarasan posisi letak tangga!","statements":[{"text":"Tinggi vertikal ujung paling atas tangga yang bersandar menempel pada dinding gedung diproyeksikan mampu mencapai 14 meter di atas tanah.","answer":"Salah","explanation":"Menurut rumus tinggi segitiga siku-siku 𝑡= √𝑠2 −𝑎2 = √132 −52 = √169 −25 = 12 meter. \nPernyataan menyebutkan tinggi mencapai 14 meter sehingga salah."},{"text":"Jika bagian mendatar alas lantai dijumlahkan nilainya secara langsung dengan panjang fisik tangga akan membentuk tinggi vertikal 18 meter.","answer":"Salah","explanation":"Kombinasi sisi horizontal (5 m) dan miring (13 m) adalah ukuran mutlak dan tidak bisa \nditambahkan begitu saja untuk menggantikan hubungan kuadrat rumus siku-siku."},{"text":"Ukuran elevasi vertikal tegak ujung tangga di dinding atas dihitung di atas permukaan alas lantai adalah bernilai tepat 12 meter.","answer":"Benar","explanation":"Tinggi posisi bertumpu ditentukan dengan melakukan substitusi ke persamaan: 𝑡= √132 −52 =\n√144 = 12 meter."},{"text":"Kuadrat nilai tinggi tembok terjangkau apabila dikurangkan terhadap kuadrat jarak tumpuan dasar ke tiang bernilai selisih 119 meter persegi.","answer":"Benar","explanation":"Hasil pengerjaannya berupa nilai: 122 −52 = 144 −25 = 119 𝑚2."}]},{"number":30,"level":1,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Seorang pengrajin miniatur membangun wahana kecil mainan rumah pohon dari bahan serat alam. Ketinggian dasar struktur tegak dari lantai pondasi utama lurus ke lantai atas pilar diletakkan pada elevasi tinggi 2,4 meter, kemudian dibuat sandaran landas pijakan dengan jarak dasar sejauh 0,7 meter mendatar dari pangkal tiang. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Sisi miring penyandar fungsional naik tangga utama dari arah atap penahan langsung melandai ke arah permukaan pijakan dasar adalah minimal 2,5 meter.","answer":"Benar","explanation":"Panjang miring dikoordinasikan langsung memanfaatkan aturan Pythagoras yaitu =\n√2, 42 + 0, 72 = √5,76 + 0,49 = √6,25 = 2,5 meter."},{"text":"Selisih nilai besaran ukuran fisis nyata di antara letak ketinggian penahan menara lurus atap dengan jarak tangga diagonal adalah murni sepanjang 0,2 meter.","answer":"Salah","explanation":"Nilai interval dicari via operasi pengurangan dimensi sesungguhnya bernilai selisih 2,5 −2,4 = 0,1 \nmeter saja."},{"text":"Nilai perbandingan pecahan konstan antara posisi ukuran sisi datar dengan tiang menara tegak berdiri tinggi siku setelah dirasionalkan paling sederhana bernilai sebanding 7: 24.","answer":"Benar","explanation":"Dengan mencari bentuk rasio desimal murninya: 0,7: 2,4, jika dikali faktor pengali homogen 10 \ndidapat rasio pecahan siku bulat senilai tepat 7: 24."},{"text":"Total lintasan keliling pembatas fungsional fisis area luar dari ketiga segmen miring tiang tangga darurat bernilai sebesar 6,4 meter.","answer":"Salah","explanation":"Hasil total jumlahan panjang segmen fungsional kawat penyangga keliling bernilai 0,7 + 2,4 +\n2,5 = 5,6 meter."}]},{"number":31,"level":2,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Pada tepi batas lintasan sebuah proyek perumahan, dipasang sepasang tiang bendera vertikal dengan struktur alas datar. Ketinggian tiang bendera pertama adalah 13 meter, sedangkan tiang kedua adalah 8 meter. Rentang jarak terpendek mendatar di antara pondasi kedua tiang di tanah terukur 12 meter. Di puncak teratas kedua tiang ditarik lurus sebuah tali kawat baja hias agar sejajar kencang. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Selisih elevasi ketinggian dari kedua ujung atas ujung tiang pancang di atas permukaan tanah adalah sebesar 5 meter.","answer":"Benar","explanation":"Selisih tinggi = 13 𝑚−8 𝑚= 5 meter."},{"text":"Panjang bentangan kawat baja penghubung di antara pucuk puncak kedua tiang tersebut minimal adalah 15 meter.","answer":"Salah","explanation":"Sisi tegak penyiku = 5 𝑚, sisi datar penyiku = 12 𝑚. Panjang kawat miring = √122 + 52 =\n√144 + 25 = √169 = 13 meter, bukan 15 meter."},{"text":"Bila harga satuan tali baja penegang adalah Rp15.000,00 per meter, maka investasi finansial minimum yang wajib disiapkan kontraktor adalah Rp195.000,00.","answer":"Benar","explanation":"Harga total = panjang kawat × tarif per meter = 13 𝑚× 𝑅𝑝15.000,00 = 𝑅𝑝195.000,00."},{"text":"Skala rasio perbandingan di antara panjang bentang miring kawat penahan terhadap selisih elevasi vertikal antar tiang lampu tersebut adalah 13:12.","answer":"Salah","explanation":"Panjang miring = 13, sedangkan selisih ketinggian tiang = 5. Rasionya bernilai 13: 5, bukan \n13: 12."}]},{"number":32,"level":2,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Di sebuah kompleks bangunan industri komunikasi, dipasangkan dua tiang besi penyalur daya listrik setinggi 22 meter dan 14 meter dengan landasan kaki berdiri di atas lapisan aspal datar yang dipisahkan berjarak sejauh 15 meter satu sama lain. Seorang staf kelistrikan memasang kabel logam kencang ditarik untuk menghubungkan kedua bagian atap penopang utama yang terletak paling atas tiang. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Beda posisi jarak ukuran tinggi di posisi teratas tiang baja di atas lahan datar adalah setara 8 meter.","answer":"Benar","explanation":"Selisih tegak tiang beton dipotong sebidang tanah mendatar yaitu selisih tinggi 𝐻𝑑= 22 meter - \n14 meter = 8 meter."},{"text":"Kebutuhan rentangan minimum kawat baja tegangan penghubung dari puncak penyalur energi utama berjarak sepanjang 17 meter.","answer":"Benar","explanation":"Nilai penentu kawat lurus dicapai memakai komponen siku-siku bentang tiang 15 meter dan tinggi \n8 meter, sehingga Pythagoras: 𝐾𝑝= √152 + 82 = 17 meter."},{"text":"Jumlah linear kumulatif (keseluruhan total panjang tinggi lurus kedua pemancar dipotong) terdeteksi berada di ketinggian sepanjang 25 meter.","answer":"Salah","explanation":"Jumlah langsung aritmetika murni kawat dengan total gabungan tinggi bukan perhitungan dimensi \ndiagonal aslinya yang sepanjang 17 meter."},{"text":"Bila ketinggian pancang logam yang paling pendek disesuaikan (turun) menjadi berketinggian 10 meter, maka besarnya selisih tegak baru setinggi 12 meter.","answer":"Benar","explanation":"Bila penyalur daya kecil diturunkan setinggi 10 meter, maka perbedaan vertikal baru didapat \ndengan 22 meter - 10 meter = 12 meter."}]},{"number":33,"level":2,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Sistem pengendali ruang peta merencanakan jalan layang daerah pegunungan berskala satuan km dengan merajang Pos Jalan Raya 𝑃 berada tepat di koordinat (−3, −2) dan koordinat lokasi stasiun penimbun batu karang 𝑄 diletakkan pada titik (5,4). Rencananya, Dinas Jalan akan menguji peresmian jalan tersebut dengan titik pembatas kontrol transit tambahan 𝑅 terletak tepat di tengah jalur miring penumpu 𝑃 dan 𝑄. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Nilai perbedaan lintasan horisontal dari tapak Pos 𝑃 ke arah letak stasiun pelayan muatan 𝑄 adalah sepanjang 8 km.","answer":"Benar","explanation":"Melalui perumusan sela mendatar didapat 𝑥𝑑𝑖𝑓𝑓= 5 −(−3) = 8 km. Maka pernyataan bernilai \nbenar."},{"text":"Jarak vertikal perpindahan as tinggi sejajar sumbu Kartesius di antara penempatan sepasang pusat instalasi tersebut sejauh 8 km.","answer":"Salah","explanation":"Untuk perhitungan ordinat koordinat selisih tegak adalah 𝑦𝑑𝑖𝑓𝑓= 4 −(−2) = 6 km. Nilai 8 km \nsalah. Maka pernyataan bernilai salah."},{"text":"Bentangan lurus utama pipa atau rute lintasan terdatar di layar radar penghubung pusat Pos 𝑃 ke arah 𝑄 adalah 10 km.","answer":"Benar","explanation":"Penaksiran jarak langsung hipotenusa jalan diprogram lurus lewat radar = √82 + 62 =\n√64 + 36 = √100 = 10 km. Maka pernyataan bernilai benar."},{"text":"Letak jarak pembatas sela antara pos singgah pengisian tengah-tengah 𝑅 ke arah stasiun utama induk berjarak sejauh 5 km.","answer":"Benar","explanation":"Jarak stasiun pertengahan 𝑅 ke pos batas separuh jangkauan merupakan separuh lurus total \npelayaran yaitu 10 ÷ 2 = 5 km. Maka pernyataan bernilai benar."}]},{"number":34,"level":3,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Dua buah perahu pencari ikan berangkat bersamaan dari stasiun mercusuar yang sama di Selat Sunda. Perahu A melaju ke arah utara sejauh 12 kilometer lalu berbelok lurus ke arah timur sejauh 9 kilometer sebelum menebar jala. Sementara itu, Perahu B melaju ke arah selatan sejauh 16 kilometer lalu berbelok lurus ke arah barat sejauh 12 kilometer untuk memeriksa terumbu karang. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai jarak tempuh dan kedudukan kedua perahu dari stasiun mercusuar mula-mula serta satu sama lain!","statements":[{"text":"Jarak garis lurus terpendek antara stasiun mercusuar mula-mula dengan Perahu A di posisi akhirnya adalah 15 kilometer.","answer":"Benar","explanation":"Berdasarkan prinsip Pythagoras, jarak langsung Perahu A ke mercusuar adalah √122 + 92 =\n√144 + 81 = √225 = 15 kilometer."},{"text":"Jarak langsung terjauh antara stasiun mercusuar mula-mula dengan Perahu B adalah 25 kilometer.","answer":"Salah","explanation":"Berdasarkan teorema Pythagoras, jarak lurus Perahu B ke mercusuar adalah √162 + 122 =\n√256 + 144 = √400 = 20 kilometer, bukan 25 kilometer."},{"text":"Jarak horizontal gabungan (selisih garis bujur) dan vertikal gabungan (selisih garis lintang) antara kedua perahu pada posisi akhir berturut-turut menghasilkan jarak lurus antarkapal sebesar 35 kilometer.","answer":"Benar","explanation":"Jarak horizontal timur-barat = 9 + 12 = 21 km, jarak vertikal utara-selatan = 12 + 16 = 28 km. \nJarak lurus kedua perahu adalah √212 + 282 = √441 + 784 = √1225 = 35 kilometer."},{"text":"Selisih jarak tempuh diagonal Perahu B ke mercusuar dengan Perahu A ke mercusuar adalah 10 kilometer.","answer":"Salah","explanation":"Selisih jarak diagonal lurus antara Perahu B (20 km) dan Perahu A (15 km) ke stasiun adalah \n20 −15 = 5 kilometer."}]},{"number":35,"level":3,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Seorang perancang bangunan sipil mendesain sebuah sistem penyangga jembatan kokoh dari bahan besi yang disusun dari rangkaian tiga segitiga siku-siku bertumpuk saling tegak lurus secara estafet. Segitiga pertama memiliki tinggi vertikal 3 desimeter dengan alas 4 desimeter di mana sisi miringnya langsung bertindak sebagai sisi mendatar penyangga kedua. Segitiga kedua dipasangi besi tegak vertikal setinggi 12 desimeter, lalu sisi miringnya dipasang lagi besi penyangga tegak ketiga setinggi 84 desimeter hingga membentuk jaring miring terluar. Beri tanda centang (✓) pada setiap pernyataan yang benar terkait panjang bagian kerangka penahan struktur baja jembatan tersebut!","statements":[{"text":"Panjang diagonal besi penahan pada struktur segitiga pertama yang menghubungkan alas bawah ke dasar penyangga atas adalah 5 desimeter.","answer":"Benar","explanation":"Menggunakan teorema Pythagoras pada segitiga siku-siku pertama dengan sisi siku-siku 3 dm \ndan 4 dm, maka sisi miringnya adalah √32 + 42 = √25 = 5 desimeter."},{"text":"Baja pengikat miring yang dipasang sebagai penumpu jembatan kedua berukuran panjang 13 desimeter.","answer":"Benar","explanation":"Pada segitiga siku-siku kedua, alas adalah sisi miring segitiga pertama (5 dm) dan tinggi vertikal \n12 dm. Sisi miringnya adalah √52 + 122 = √25 + 144 = √169 = 13 desimeter."},{"text":"Besi siku diagonal penyangga paling luar yang diletakkan pada segitiga ketiga adalah 75 desimeter.","answer":"Salah","explanation":"Sisi miring segitiga siku-siku ketiga menggunakan alas yang berupa sisi miring kedua (13 dm) \ndan sisi tegak 84 dm. Panjang sisi miring tersebut adalah √132 + 842 = √169 + 7056 = √7225 =\n85 desimeter, bukan 75 desimeter."},{"text":"Total akumulasi kebutuhan panjang besi minimal untuk menutupi seluruh garis miring ketiga segitiga penyusun rangka tersebut adalah 103 desimeter.","answer":"Benar","explanation":"Jumlahan ketiga bentang sisi miring adalah sisi miring kesatu ditambah kedua dan ketiga, yakni \n5 + 13 + 85 = 103 desimeter."}]},{"number":36,"level":3,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan yang berkaitan dengan Phytagoras (termasuk menghitung jarak antara dua titik pada bidang koordinat Kartesius).","question":"Untuk pemasangan dekorasi acara adat megah, sebuah tangga besi tebal disandarkan miring tegak menyentuh tembok vertikal. Sifat tangga tercatat mempunyai ukuran panjang linear penampang miring sejauh 25 desimeter, mula-mula ditempatkan dengan landasan ujung kaki terbawah menyentuh dasar ubin sejauh 7 desimeter secara horizontal diukur dari sudut bawah dinding ubin lantai. Karena tidak sengaja menyentuh pijakan miring atas lantai berpasir licin, kedudukan ujung tertinggi dari sandaran atas merosot miring meluncur tegak vertikal sejauh tepat 4 desimeter ke arah bawah di sepanjang dinding. Tentukan benar atau salah untuk setiap simpulan geometri yang menjelaskan keadaan meluncurnya kaki bawah tangga itu!","statements":[{"text":"Kedudukan ketinggian awal ujung vertikal puncak tangga saat diletakkan pada penempatan pertama tepat sebelum merosot berada pada setinggi 24 desimeter.","answer":"Benar","explanation":"Berdasarkan dalil Phytagoras di mana tangga berada tegak pada sumbu tegak, ketinggian \nsemula awal ℎ1 = √252 −72 = √625 −49 = √576 = 24 desimeter."},{"text":"Jarak horizontal bentang mendatar ubin landasan tumpu kaki terbawah terhadap bidang ubin tiang setelah bergeser turun berubah bergeser memanjang menjauh hingga berukuran tepat sejauh 16 desimeter.","answer":"Salah","explanation":"Setelah bagian puncak tangga turun meluncur setinggi 4 desimeter, maka letak ketinggian \nberubah menduduki posisi tinggi baru ℎ2 = 24 −4 = 20 desimeter. Mengukur lebar tumpuan \nbawah sekarang dari Phytagoras: 𝑥2 = √252 −202 = 15 desimeter, bukan 16 desimeter."},{"text":"Besarnya pertambahan jarak jangkauan lantai meluncur horizontal ujung kaki bawah yang miring menjauhi titik sudut terbawah penyangga dinding kayu adalah selebar 4 desimeter.","answer":"Salah","explanation":"Ujung landasan awal pada tapak horizontal melangkah bertambah besar dari tumpu horizontal \npertama yakni dari jarak semula 7 desimeter hingga ke ukuran anyar sepanjang 15 desimeter. Ini \nmengalami lebar loncatan bergeser sejauh 15 −7 = 8 desimeter, bukan 4 desimeter."},{"text":"Hasil kelipatan perbandingan bentang datar ubin penyangga terbawah sesudah bergeser dibanding landasan pijakan mendatar pertama tepat sebelum tergelincir senilai 15: 7.","answer":"Benar","explanation":"Mengukur hubungan proporsi nilai, dimensi posisi landasan jarak horizontal kaki sesudah \nbergeser (15 desimeter) dibanding kaki sebelum geser (7 desimeter) bernilai persis perbandingan \n15: 7."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
