<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Pola Bilangan</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT POLA BILANGAN</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Sebuah tumpukan mangkok di rak sebuah toko disusun rapi membentuk pola bilangan ganjil positif: 1, 3, 5, 7, ... Berapakah banyak mangkok pada barisan suku ke-10?","options":[{"key":"A","text":"11 mangkok"},{"key":"B","text":"19 mangkok"},{"key":"C","text":"20 mangkok"},{"key":"D","text":"21 mangkok"}],"answer":"B","explanation":"Pola bilangan ganjil memiliki rumus umum 𝑈𝑛= 2𝑛−1. \nSubstitusikan nilai 𝑛= 10 ke dalam rumus tersebut. \nHitung perkaliannya: 2 × 10 = 20. \nKurangkan dengan 1 untuk mendapat hasil akhir: 20 −1 = 19. \nJawaban Benar: B"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Barisan nomor rumah di sisi sebelah utara Jalan Malioboro membentuk pola bilangan genap: 2, 4, 6, 8, ... Berapakah nomor rumah pada urutan ke-25?","options":[{"key":"A","text":"25"},{"key":"B","text":"50"},{"key":"C","text":"75"},{"key":"D","text":"100"}],"answer":"B","explanation":"Pola bilangan genap dirumuskan sebagai 𝑈𝑛= 2𝑛. \nUntuk urutan ke-25, substitusikan 𝑛= 25 ke dalam rumus: \n𝑈25 = 2 × 25 = 50. \nJawaban Benar: B"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Banyak tusuk gigi yang digunakan untuk membuat pola hiasan rumah-rumahan ke-𝑛 memenuhi rumus 𝑈𝑛= 4𝑛+ 1. Berapakah banyak tusuk gigi yang dibutuhkan untuk membuat hiasan pada pola ke-10?","options":[{"key":"A","text":"37 buah."},{"key":"B","text":"40 buah."},{"key":"C","text":"41 buah."},{"key":"D","text":"45 buah."}],"answer":"C","explanation":"Langkah 1: Gunakan rumus pola bilangan yang telah diberikan, yaitu 𝑈𝑛= 4𝑛+ 1. \nLangkah 2: Substitusikan nilai 𝑛= 10 ke dalam rumus tersebut. \nLangkah 3: Hitung hasil akhir: 𝑈10 = 4(10) + 1 = 40 + 1 = 41. \nJawaban Benar: C"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Di sebuah aula sekolah, kursi disusun dalam baris-baris bertingkat. Baris kedua berisi 14 kursi, sedangkan baris kelima berisi 23 kursi. Jika penambahan kursi pada setiap baris di belakangnya selalu tetap, berapakah jumlah kursi yang terletak pada baris ke-10?","options":[{"key":"A","text":"29 kursi"},{"key":"B","text":"32 kursi"},{"key":"C","text":"35 kursi"},{"key":"D","text":"38 kursi"}],"answer":"D","explanation":"Langkah 1: Menggunakan rumus suku ke-𝑛 barisan aritmetika 𝑈𝑛= 𝑎+ (𝑛−1)𝑏. Dari soal \ndiketahui 𝑈2 = 𝑎+ 𝑏= 14 dan 𝑈5 = 𝑎+ 4𝑏= 23. \nLangkah 2: Kurangkan kedua persamaan untuk mendapatkan nilai beda (𝑏): (𝑎+ 4𝑏) −(𝑎+ 𝑏) =\n23 −14 ⟹ 3𝑏= 9 ⟹ 𝑏= 3. \nLangkah 3: Tentukan suku pertama (𝑎): 𝑎+ 3 = 14 ⟹ 𝑎= 11. \nLangkah 4: Hitung nilai dari suku ke-10 (𝑈10): 𝑈10 = 𝑎+ 9𝑏= 11 + 9(3) = 11 + 27 = 38. \nJawaban Benar: D"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Seorang siswa berpartisipasi aktif dalam program menabung di bank sampah sekolah. Pada minggu pertama, ia menyetorkan tabungan sebesar Rp5.000,00. Karena konsisten, pada minggu- minggu berikutnya ia selalu menyetor Rp2.000,00 lebih banyak dari minggu sebelumnya. Pada minggu keberapakah besar uang yang disetorkannya khusus pada minggu itu mencapai Rp39.000,00?","options":[{"key":"A","text":"Minggu ke-15"},{"key":"B","text":"Minggu ke-16"},{"key":"C","text":"Minggu ke-17"},{"key":"D","text":"Minggu ke-18"}],"answer":"D","explanation":"Langkah 1: Identifikasi barisan aritmetika dengan suku pertama 𝑎= 5.000, beda peningkatan 𝑑=\n2.000, dan nominal sasaran 𝑈𝑛= 39.000. \nLangkah 2: Selesaikan persamaan 𝑈𝑛= 𝑎+ (𝑛−1)𝑑 untuk menentukan minggu ke-𝑛. \nHitung nilainya: 39.000 = 5.000 + (𝑛−1) × 2.000 ⟹ 34.000 = 2.000(𝑛−1) ⟹ 𝑛−1 = 17 ⟹\n 𝑛= 18. \nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Di sebuah toko suvenir khas Jakarta, miniatur ondel-ondel dipajang membentuk piramida satu arah. Baris paling atas berisi 1 buah, baris kedua berisi 3 buah, baris ketiga berisi 6 buah, baris keempat berisi 10 buah, dan seterusnya mengikuti pola bilangan segitiga. Jika tinggi piramida tersebut adalah 8 baris, berapakah jumlah seluruh miniatur ondel-ondel yang dipajang?","options":[{"key":"A","text":"36 buah"},{"key":"B","text":"84 buah"},{"key":"C","text":"120 buah"},{"key":"D","text":"136 buah"}],"answer":"C","explanation":"Pola bilangan segitiga ditentukan oleh rumus 𝑇𝑛=\n𝑛(𝑛+1)\n2\n. \nTuliskan delapan suku pertama: 1,3,6,10,15,21,28,36. \nJumlahkan seluruh suku untuk mencari total miniatur: 1 + 3 + 6 + 10 + 15 + 21 + 28 + 36. \nHitung jumlah secara bertahap: 1 + 3 = 4, 4 + 6 = 10, 10 + 10 = 20, 20 + 15 = 35, 35 + 21 = 56, \n56 + 28 = 84, 84 + 36 = 120 buah. \nJawaban Benar: C"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Dalam penataan ruang utama gedung kesenian, baris kursi pertama diatur sebanyak 20 kursi, baris kedua 22 kursi, baris ketiga 24 kursi, dan seterusnya dengan penambahan tetap di setiap baris ke belakang. Jika pengelola gedung merencanakan total seluruh kursi yang tersedia di gedung tersebut adalah 570 kursi, berapakah jumlah baris kursi yang harus dipasang?","options":[{"key":"A","text":"12 baris"},{"key":"B","text":"15 baris"},{"key":"C","text":"19 baris"},{"key":"D","text":"30 baris"}],"answer":"B","explanation":"Langkah 1: Identifikasi parameter deret aritmetika dengan suku pertama 𝑎= 20 dan beda 𝑏= 2, \nserta jumlah total suku 𝑆𝑛= 570. \nLangkah 2: Gunakan rumus jumlah deret aritmetika 𝑆𝑛=\n𝑛\n2 (2𝑎+ (𝑛−1)𝑏) untuk membentuk \npersamaan kuadrat: 570 =\n𝑛\n2 (2(20) + (𝑛−1)2) ⟹ 570 = 𝑛(20 + 𝑛−1) ⟹ 𝑛2 + 19𝑛−570 = 0. \nLangkah 3: Selesaikan persamaan kuadrat dengan pemfaktoran: (𝑛−15)(𝑛+ 38) = 0. Diperoleh \nnilai 𝑛= 15 atau 𝑛= −38. Karena jumlah baris harus positif, maka jumlah baris kursi yang harus \ndipasang adalah 15 baris. \nJawaban Benar: B"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Adi dan Beni menabung di rumah masing-masing dengan cara berbeda untuk membeli konsol permainan seharga Rp500.000,00. Adi menabung dengan pola aritmetika: Rp30.000,00 pada minggu pertama, Rp35.000,00 pada minggu kedua, Rp40.000,00 pada minggu ketiga, dan seterusnya dengan penambahan tetap Rp5.000,00 setiap minggu. Beni menabung dengan jumlah tetap sebesar Rp45.000,00 setiap minggu. Siapakah yang akan mengumpulkan uang cukup untuk membeli konsol tersebut terlebih dahulu, dan pada minggu ke berapakah ia mencapainya?","options":[{"key":"A","text":"Adi, pada minggu ke-10."},{"key":"B","text":"Adi, pada minggu ke-12."},{"key":"C","text":"Beni, pada minggu ke-11."},{"key":"D","text":"Beni, pada minggu ke-12."}],"answer":"A","explanation":"Menganalisis tabungan Adi: Pola tabungan merupakan deret aritmetika dengan 𝑎= 30.000 dan \n𝑏= 5.000. Rumus jumlah tabungan Adi setelah 𝑛 minggu adalah 𝑆𝑛=\n𝑛\n2 [2(30.000) + (𝑛−\n1)5.000] =\n𝑛\n2 [55.000 + 5.000𝑛] = 27.500𝑛+ 2.500𝑛2. \nMencari nilai 𝑛 agar tabungan Adi mencapai minimal 500.000: Jika 𝑛= 9, maka 𝑆9 = 27.500(9) +\n2.500(81) = 247.500 + 202.500 = 450.000 (belum cukup). Jika 𝑛= 10, maka 𝑆10 = 27.500(10) +\n2.500(100) = 275.000 + 250.000 = 525.000 (sudah cukup). Maka Adi mencapai target pada \nminggu ke-10. \nMenganalisis tabungan Beni: Pola tabungan merupakan perkalian konstan. Jumlah tabungan \nBeni setelah 𝑚 minggu adalah 45.000 × 𝑚≥500.000 ⟹ 𝑚≥11,11. Maka Beni baru dapat \nmengumpulkan cukup uang pada minggu ke-12 (45.000 × 12 = 540.000). \nMembandingkan keduanya: Adi mencapai target pada minggu ke-10 sedangkan Beni pada \nminggu ke-12. Jadi, Adi mencapai target terlebih dahulu pada minggu ke-10. \nJawaban Benar: A"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Di sebuah gedung pertunjukan, susunan kursi penonton dirancang dengan pola aritmetika di mana baris pertama berisi 15 kursi, baris kedua berisi 19 kursi, baris ketiga berisi 23 kursi, dan seterusnya. Karena adanya renovasi panggung, baris pertama hingga baris kelima harus dihilangkan seluruhnya sehingga baris keenam kini menjadi baris terdepan yang baru. Jika setelah renovasi gedung tersebut kini hanya memiliki total 15 baris kursi yang tersisa, berapakah total seluruh kursi penonton yang ada sekarang?","options":[{"key":"A","text":"815 kursi"},{"key":"B","text":"870 kursi"},{"key":"C","text":"945 kursi"},{"key":"D","text":"1.005 kursi"}],"answer":"C","explanation":"Langkah 1: Identifikasi barisan aritmetika sebelum renovasi. Suku pertama 𝑎= 15, beda 𝑏= 4. \nRumus suku ke-𝑛 adalah 𝑈𝑛= 15 + (𝑛−1)4 = 4𝑛+ 11. \nLangkah 2: Tentukan baris kursi setelah renovasi. Baris pertama yang baru adalah baris ke-6 dari \npola lama, dan total ada 15 baris baru. Maka baris terakhir yang baru adalah baris ke-20 dari pola \nlama (6 + 15 −1 = 20). \nLangkah 3: Hitung kapasitas kursi pada baris terdepan baru (𝑈6) dan baris terbelakang baru \n(𝑈20). 𝑈6 = 4(6) + 11 = 35 kursi, dan 𝑈20 = 4(20) + 11 = 91 kursi. \nLangkah 4: Hitung jumlah total kursi penonton menggunakan rumus deret aritmetika dengan 15 \nsuku. 𝑆15 =\n15\n2 (𝑈6 + 𝑈20) =\n15\n2 (35 + 91) =\n15\n2 (126) = 15 × 63 = 945 kursi. \nJawaban Benar: C"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Pertambahan luas kawasan rehabilitasi mangrove dalam beberapa tahun dicatat meningkat dengan rasio tetap membentuk pola barisan bilangan geometri: 4,8,16,32, … hektare. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai perkembangan kawasan ini!","statements":[{"text":"Luas awal wilayah penanaman mangrove pada tahun pertama adalah 4 hektare.","answer":"Benar","explanation":"Pola penanaman tahun ke-1 direpresentasikan dengan suku ke-1 barisan tersebut, yaitu 𝑈1 = 4 \nhektare."},{"text":"Faktor pengali atau nilai rasio dari barisan wilayah hutan tersebut adalah 2.","answer":"Benar","explanation":"Rasio barisan geometri dihitung dengan rasio antardua suku, yaitu 𝑟= 8 ÷ 4 = 2."},{"text":"Perkiraan luas rehabilitasi hutan pada tahun kelima adalah 64 hektare.","answer":"Benar","explanation":"Dengan perkiraan pelipatgandaan geometri sebesar 2, suku ke-5 adalah 𝑈5 = 𝑈4 × 2 = 32 × 2 =\n64 hektare."},{"text":"Perkiraan luas rehabilitasi hutan pada tahun keenam adalah 120 hektare.","answer":"Salah","explanation":"Pertumbuhan tahun ke-6 adalah suku ke-6 (𝑈6), yaitu dihitung melalui 𝑈5 × 2 = 64 × 2 = 128 \nhektare, bukan 120."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Urutan pola khusus bilangan bentuk persegi panjang dirincikan dengan himpunan data bernilai 2,6,12,20, . ... Beri tanda centang (✓) pada setiap pernyataan yang benar terkait representasi barisan ini!","statements":[{"text":"Urutan data nilai pola bilangan permulaan pertama dalam susunan adalah 1.","answer":"Salah","explanation":"Pola urutan persegi panjang diawali pada nilai angka terkecil pertamanya senilai 2, bukan bernilai \n1."},{"text":"Suku ke-𝑛 bilangan persegi panjang didefinisikan dari struktur hubungan aljabar berupa 𝑈𝑛= 𝑛(𝑛+ 1).","answer":"Benar","explanation":"Rumus fungsi pola bilangan tersebut memang didefinisikan melalui fungsi kuadrat berfaktor 𝑈𝑛=\n𝑛(𝑛+ 1)."},{"text":"Data ke-5 (𝑈5) pada susunan berpola barisan kuadratik tersebut berharga senilai 30.","answer":"Benar","explanation":"Maka, memasukkan unsur suku diperoleh nilai data ke-5 adalah 𝑈5 = 5(5 + 1) = 30, bernilai \nbenar."},{"text":"Suku berikutnya yang diletakkan persis sesudah nilai susunan berharga 30 di pola persegi panjang tersebut adalah 36.","answer":"Salah","explanation":"Suku ke-6 harusnya memiliki perolehan data terukur 𝑈6 = 6 × (6 + 1) = 42, bukan berharga 36."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Sebuah kerajinan batang kayu hias diletakkan berjejeran membentuk susunan barisan aritmetika dengan pola kuantitas batang lidi 3,7,11,15, . ... Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Suku pertama (𝑎) dari barisan aritmetika kerajinan ini bernilai 4.","answer":"Salah","explanation":"Suku pertama adalah suku di awal barisan, yaitu 3, sedangkan 4 adalah nilai bedanya."},{"text":"Beda (𝑏) antar suku yang berdekatan pada pola lidi hias ini bernilai 4.","answer":"Benar","explanation":"Beda diperoleh dengan mengurangi suku yang berurutan, misal 7 −3 = 4. Pernyataan ini benar."},{"text":"Suku ke-5 dari pola aritmetika susunan lidi ini bernilai 19.","answer":"Benar","explanation":"Suku berikutnya (suku ke-5) didapat dengan menambahkan suku ke-4 dengan nilai beda, yaitu \n15 + 4 = 19. Pernyataan ini benar."},{"text":"Beda antar suku berdekatan dari susunan lidi ini adalah 3.","answer":"Salah","explanation":"Beda antar suku bernilai 4 (misal: 7 −3 = 4), bukan 3 (3 adalah suku pertama)."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Seorang pekerja mengecat pagar taman yang panjang. Ia bekerja dengan pola bertambah: hari ke-2 berhasil menyelesaikan 14 meter pagar, sedangkan hari ke-6 berhasil menyelesaikan 26 meter pagar. Kecepatan kerja mengecat harian tersebut berbaris aritmetika. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Peningkatan hasil pengecatan pagar oleh pekerja setiap harinya adalah 4 meter.","answer":"Salah","explanation":"Langkah ke-1 mencari parameter barisan dari eliminasi 𝑈6 −𝑈2 = 4𝑏= 26 −14 = 12 ⟹ 𝑏= 3 \nmeter/hari. Nilai 4 didapatkan jika salah dalam membagi rentang indeks."},{"text":"Pada hari pertama bekerja, panjang pagar yang selesai dicat adalah sebanyak 11 meter.","answer":"Benar","explanation":"Langkah ke-1: diperoleh nilai beda 𝑏= 3. Lalu hitung nilai awal suku ke-1: 𝑎= 𝑈2 −𝑏= 14 −3 =\n11 meter."},{"text":"Total seluruh panjang pagar yang berhasil dicat hingga hari ketujuh adalah 145 meter.","answer":"Salah","explanation":"Mencari total pengecatan menggunakan rumus 𝑆7 =\n7\n2 (2𝑎+ 6𝑏) =\n7\n2 (22 + 18) =\n7\n2 (40) = 140 \nmeter. Pilihan 145 salah akibat tidak melakukan pembagian awal."},{"text":"Panjang pagar khusus yang dapat diselesaikan dicat oleh pekerja pada hari ke-10 adalah 38 meter.","answer":"Benar","explanation":"Langkah ke-1 menentukan model fungsi: 𝑈𝑛= 3𝑛+ 8. Suku kesepuluh adalah 𝑈10 = 3(10) + 8 =\n38 meter."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Seorang perancang hiasan interior mengumpulkan ratusan botol soda berbahan kaca tebal untuk ditempeli label lukisan membentuk bidang berpola tingkat bertambah segitiga. Susunan penumpukan pajangan botol diposisikan meniru susunan barisan berpola dari atas ke bawah: tingkatan pertama di atas berisi 1 ubin botol, baris kedua di bawahnya memuat 3 ubin botol, baris ketiga berkapasitas 6 ubin botol, baris keempat dengan 10 botol, dan kelipatannya mematuhi susunan formula bilangan segitiga biasa. Tentukan benar atau salah untuk setiap pernyataan berikut tentang korelasi bahan perakitan pajangan!","statements":[{"text":"Baris anyaman botol terpanjang yang didesain secara spesifik khusus pada urutan tingkatan ke-8 berjumlah total 42 botol ubin soda.","answer":"Salah","explanation":"Barisan segitiga standar menggunakan ekspresi formula penentuan pola 𝑈𝑛=\n𝑛(𝑛+1)\n2\n. \nBerdasarkan masukan level tingkatan yang diinginkan 𝑛= 8, kuantitas bahan semestinya yang \ndipotong diatur adalah 𝑈8 =\n8×9\n2 = 36 botol ubin."},{"text":"Komposisi wadah baris pemosisian yang menduduki area strata paling dalam tingkat ke-10 memerlukan setidaknya 55 unit botol.","answer":"Benar","explanation":"Menggunakan rancang bangun kalkulator numerikal berpola, pada tumpukan lapis yang \nbertempat di letak ke-10 diperoleh bahwa nilainya adalah 𝑈10 =\n10×11\n2\n= 55 botol."},{"text":"Jumlah margin selisih botol yang didistribusikan pada barisan arsitektur tataran tingkat ke-7 berbanding tingkatan ke-5 adalah 13 botol.","answer":"Benar","explanation":"Ukur dulu botol hias pada tingkat baris ke-7 yaitu 𝑈7 =\n7×8\n2 = 28. Sedangkan barisan ke-5 adalah \n𝑈5 =\n5×6\n2 = 15. Pengurangan tingkat ini menghadirkan selisih nilai 28 −15 = 13 buah."},{"text":"Dalam menyelesaikan rangkaian rakitan terbatas dari lapis ke-1 atas hingga tingkatan area ke- 4 terkumpul tumpukan pajangan total senilai 18 botol.","answer":"Salah","explanation":"Menghitung total muatan fisik ketersediaan adalah jumlahan kolektif deret segitiga itu dari \npertama yaitu 𝑆4 = 1 + 3 + 6 + 10 = 20 botol secara total, maka usulan teks salah."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Kedalaman rincian pengerukan lubang bor silinder bawah perumahan untuk penanaman sekat penyalur serapan resapan hujan limpasan didesain menyusup lurus masuk bumi makin mendalam linear mengikuti kenaikan tahapan operasi mata bor tukang teknik drainase kota bandung subur. Lapisan tebas tingkap tahapan mula kerja level jajaran paling terdepan posisi 1 pengeboran sukses merongrong lubang resapan meluncur tembus sedalam vertikal jarak 7 meter lurus di kedalaman lobang pancing bumi, sementara lajur jangkauan tanah lobang pilar tebas tanah dalam bor setingkat lubang pelindung level tahapan jembatan paku kerja ke-4 telah melorot tajam tembus memangkas lubang saring sejauh tegak dalam lurus 25 meter menghunjam ke sela perut tanah liat batuan subur bandung. Tentukan benar atau salah untuk setiap kalkulasi kedalaman lintasan paku pengeboran sumur deplesi resapan tanah air bandung tersebut!","statements":[{"text":"Rasio peningkat laju kecepatan penetrasi atau selisih sela rentang bertambah paku meluncur bor piring tingkat ke bawah per lapis tahapan operasional kerja baru menata lobang resapan selalu melaju konstan sedalam selisih gali saringan sejauh lurus 5 meter pengeboran kedalaman pipa rembes bawah perumahan rakyat.","answer":"Salah","explanation":"Keberlanjutan bentangan sumur pengebor dekomposer resapan ini disusun secara runut berakar \nlintasan model draf barisan pola aritmetika menaik linear satu variabel kedalaman tancap 𝑈1 =\n𝑎= 7 dan target penarikan tebas tahapan anyar tingkat ke-4 menyembul sejauh un galian lubang: \n𝑈4 = 25 meter vertikal bawah tanah liat perumahan. Langkah pertama, carilah percepatan \nkemajuan penembus mata gergaji pengebor beton batu batuan menggunakan kaidah linear \nterpadu suku ke-𝑛 yakni 𝑈𝑛= 𝑎+ (𝑛−1)𝑏 ⟹ 7 + (4 −1)𝑏= 25 ⟹ 3𝑏= 18 ⟹ peningkatan \npenetrasi ketajaman harian bertahap merata ke kedalaman sedalam nilai kedalaman lompatan \ngalian sela sejauh: 𝑏= 6 meter pengeruk bor sumur silinder limpasan. Langkah kedua, \nbandingkan saringan dengan usulan penulisan teks kelayakan set beda galian pilar air yang \ndidaku Rp5 meter lobang sumur galian limpasan deplesi subur, maka temuan data mengalami \nkesalahan pengerjaan bias deviasi angka sela un pengisi draf jembatan bor air. Pernyataan \nbernilai salah."},{"text":"Penggalian saluran paku saringan dalam lobang kawat limpas resapan bumi yang dipasangkan tukang teknik di lintasan saringan letak porsi posisi bagian ke-3 menyelinap mengalir memediasi tancap saring air di lintasan saringan kedalaman tuntas sejauh sedalam jarak 13 meter dalam bumi bawah perumahan.","answer":"Salah","explanation":"Langkah pertama, terapkan rancang formulasian umum penaksir tebas laju tancap lobang tiang \nsumur limpasan deplesi un perumahan tingkat ke-𝑛 menggunakan penentu aritmetika progresif \npenambahan lajur sumur galian didapat fungsi un, yaitu rumus umum saring resapan tanah \nsumur silinder: 𝑈𝑛= 𝑎+ (𝑛−1)𝑏= 7 + (𝑛−1)6 = 6𝑛+ 1 meter kedalaman pengeboran \njangkauan vertikal pipa bor kota bandung subur. Langkah kedua, hitung hasil target matematika \nporsi paku galian air silinder pada perancangan sumur anyar tingkat letak pengerukan ke-3: 𝑈3 =\n6(3) + 1 = 18 + 1 = 19 meter lubang jangkau sumur bor resapan lurus menghunjam deplesi kota \nbandung subur. Isian kedalaman penembusan tiang pengarah resapan harus disasar 19 meter \nsaringan air, berarti draf tulisan data kelayakan saku saringan menganggarkan batas jarak galian \nmenyeka dangkal Rp13 meter yang terselip mengalami kekeliruan perhitungan konvensional \ndalam menelisik kemajuan un. Pernyataan bernilai salah."},{"text":"Nilai capaian dari ketajaman batas jangkauan penggalian saringan lobang sumur pelindung perumahan terpadu di lintasan tangga tingkat tahapan ke-6 sukses menusuk dalam jarak tempuh jangkau lubang drainase silinder sejauh kedalaman 37 meter penghunjam lurus ke arah batuan bumi.","answer":"Benar","explanation":"Langkah pertama, pasang kembali kesepakatan penata rumus mencari paku penemu sumur \nsaringan tanah sisa limpasan air perolehan matematika dari draf suku ke-𝑛: 𝑈𝑛= 6𝑛+ 1 meter. \nLangkah kedua, lakukan operasional komputasi pada bor lubang khusus level anyar piring \npenahan letak bidang pengeboran urutan ke-6: 𝑈6 = 6(6) + 1 = 36 + 1 = 37 meter saringan \nlubang galian air saringan dalam perumahan bandung lestari. Pernyataan bernilai benar."},{"text":"Jika kedalaman lubang air bor silinder disisir mengarah tingkat lebih bawah dari sisa pengerjaan setingkat, jangkauan tebas saringan tanah limpasan air khusus menembus tatanan wilayah operasional bor posisi di jatah anyar masa lapis tahapan piringan tingkat ke-10 adalah sedia jangkauan sejauh kedalaman vertikal lobang bor pas sedalam 61 meter jangkau galian.","answer":"Benar","explanation":"Langkah pertama, cari rumusan target saringan tanah sumur air silinder kedalaman penataan \nhulu lubang resapan yaitu 𝑈𝑛= 6𝑛+ 1 meter pipa. Langkah kedua, jalankan subsitusi tahapan \nnomor penemu jangkauan silinder lobang bor pembenah resapan air limbah kota di baris asalnya \nletak piringan urutan sekat posisi tingkat ke-10 harian kerja tukang gali: 𝑈10 = 6(10) + 1 = 60 +\n1 = 61 meter gali lubang penambat tiang pipa sumur pembenah limpasan hujan perkotaan di \nbandung subur lestari perumahan asri deplesi saluran hulu perkotaan lestari bumi. Pernyataan \nbernilai benar."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Seorang pelaku usaha kerajinan hiasan dinding di kawasan rekreasi pesisir pantai mengumpulkan bahan cangkang biota kerang dekoratif lalu mendesain pola melekat dengan berbaris linear progresif pada papan pajangan hiasan keramik gantung. Untuk tingkat pajangan baris paling atas (baris kesatu) disusun sebanyak 8 cangkang hias, lalu tingkat bawah di bawahnya dipaku terpasang beruntun bertambah stabil aritmetika selebar beda 3 cangkang tiap turun sekat, serta akan terus dikembangkan polanya memenuhi kapasitas wadah sampai batas penuh di barisan ke-12. Setiap papan dekorasi dijual bertarif seharga kompensasi pengerjaan Rp50.000,00 ditambah ongkos hitung bahan senilai Rp500,00 dari per satu butir unit cangkang yang menempel di papannya. Beri tanda centang (✓) pada setiap pernyataan yang benar perihal modal dekorasi seni hias cangkang kerang progresif tersebut!","statements":[{"text":"Banyak butir material bahan dekoratif cangkang kerang yang ditempel teratur mengisi khusus posisi barisan baris terendah yang berada di susunan baris ke-12 dipasang sebanyak 41 unit cangkang.","answer":"Benar","explanation":"Suku aritmetika dari dekorasi kerang mengikuti formula ke-12: 𝑈12 = 𝑎+ 11𝑏= 8 + 11 × 3 = 8 +\n33 = 41 buah unit cangkang terpasang."},{"text":"Jumlah penggabungan unit dari total keseluruhan butir material penutup karya cangkang dari seluruh sekat tatapan semenjak tingkat kesatu sampai ke-12 memerlukan alokasi pasokan tepat sebanyak 300 buah.","answer":"Salah","explanation":"Persediaan tumpuk total pengadaan unit cangkang sepanjang satu bidang lempeng kerajinan \ndinding dirinci lewat total suku: 𝑆12 =\n12\n2 × (2(8) + 11(3)) = 6 × (16 + 33) = 6 × 49 = 294 unit \nkerang."},{"text":"Ongkos dana biaya khusus pembelian cangkang luar sebagai ornamen tertempel keseluruhan pengisi bidang satu lempeng unit bingkai pajangan terakumulasi sebesar Rp147.000,00.","answer":"Benar","explanation":"Ongkos murni pembelian total material penunjang yang tertempel didapat lewat integrasi \nperkalian unit: 294 𝑘𝑒𝑟𝑎𝑛𝑔× 𝑅𝑝500,00 = 𝑅𝑝147.000,00."},{"text":"Satu set utuh kriya pajangan dari karya pengrajin tersebut yang memuat susunan 12 tingkat hiasan terarsir dilepas ke konsumen pada tarif label harga pas senilai Rp197.000,00.","answer":"Benar","explanation":"Nilai akumulatif pelabelan jual bagi sebidang dekorasi kerang hias merupakan gabungan tarif \nkerja dasar dengan belanja kerang: 𝑅𝑝50.000,00 + 𝑅𝑝147.000,00 = 𝑅𝑝197.000,00."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Mencegah peningkatan pemborosan cadangan energi di lingkungan pondok asrama terpadu, santri mencatat sebaran data kebocoran kran air silinder pada bak penampung utama semenjak jam pertama pendeteksian secara periodik konstan deret hitung aritmetika susut. Laju volume air penampung tersisa di dalam tangki air dikalkulasi di setiap penutupan putaran jam berurut semenjak awal, menyajikan catatan tersisa: pada jam kesatu tersisa 4.800 liter air, akhir jam kedua sisa sebanyak 4.400 liter, penutup waktu jam ketiga berkurang stabil menjadi tersisa 4.000 liter, serta jam keempat tercatat sebanyak 3.600 liter. Evaluasi kedaruratan diuji guna memproyeksikan tindakan pencegahan teknis menutup pintu masuk kran utama tepat setelah waktu jam ke-8 berlangsung. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan penyusutan tangki tersebut!","statements":[{"text":"Pengosongan total penyusutan kran tangki di tiap pergantian tingkatan jam berkorelasi bertambah secara kelipatan berganda kuadratis atau progres tidak merata.","answer":"Salah","explanation":"Setiap pergeseran jenjang tingkatan satu jam lamanya, sisa isi penampungan menyusut sebesar \nnominal tetap: −400 liter per jam. Maka perilakunya bersifat linear seragam dari deret aritmetika \nbaku, bukan kuadratis."},{"text":"Rumusan formula dasar yang menunjukkan keadaan sisa isi cadangan penampung pada parameter jam operasi perjalanan ke-𝑛 dimodelkan via alur hitungan aljabar berbentuk 𝑈𝑛= 5.200 −400𝑛 liter.","answer":"Benar","explanation":"Maka dari model data asumsian 𝑎= 4800 dan beda penyusutan konstan 𝑏= −400, dioperasikan \nformulanya: 𝑈𝑛= 𝑎+ (𝑛−1)𝑏= 4800 + (𝑛−1)(−400) = 4800 −400𝑛+ 400 = 5200 −400𝑛 \nliter."},{"text":"Pada titik akhir penanda waktu pengerjaan jam ke-8 terdeteksi ketersediaan volume kubangan air penyangga utama di asrama sisa menyisakan air di tangki sebesar 2.000 liter.","answer":"Benar","explanation":"Massa cadangan sisa volume tepat sesaat ditariknya tuas pintu utama di penutup waktu jam ke-8 \ndicari melalui operasi aljabar variabel rumus suku ke-8: 𝑈8 = 5200 −400(8) = 5200 −3200 =\n2000 liter air."},{"text":"Sisa volume kubangan yang keluar mengucur hanyut sia-sia dari waktu awal mulainya kebocoran deteksi pertama hingga saat ditutup pada jam ke-8 terhitung seberat 2.800 liter air terbuang.","answer":"Benar","explanation":"Pengurangan kumulatif dari volume sisa mula yang didapat di akhir waktu jam ke-1 sampai jam \nke-8 bernilai pengurangan absolut selisih stok sisa tangki: 4800 −2000 = 2800 liter air hilang \nhanyut."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi, menentukan, dan memprediksi pola susunan \nbenda dan bilangan serta menyelesaikan permasalahan yang \nterkait.","question":"Pemilik usaha waralaba menetapkan rumusan remunerasi atau penentuan jumlah penerimaan honorarium lemburan secara beruntun tiap semester bulanan ke depannya berdasarkan kurun tingkat sumbangsih jam mengajar secara profesional berpola deret aritmetika bertambah berkala stabil. Honor kasar pada semester masa kerja bulan kesatu dicatat senilai total Rp2.100.000,00 dan draf kemitraan memastikan upah honor kerja tersebut bakal disesuaikan bertambah stabil konstan sebesar Rp150.000,00 untuk selisih pembayaran setiap bulan berikutnya. Sebagai kepedulian bakti bersama, asisten mewajibkan komitmen penyisihan donasi sosial sebersih tepat sebesar 10% potongan amal ditarik murni langsung dari honor yang diterimanya, khusus tatkala memasuki sela rentang perhitungan periode angka-angka urutan bulan bernomor ganjil (tidak ada donasi potongan amal di periode genap). Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai slip kas ini!","statements":[{"text":"Gaji bulanan brutto mentah sebelum penarikan potongan denda ataupun kewajiban amal kesejahteraan khusus sewaktu masa kontribusi karyawan genap mencapai menginjak bulan ke-6 pengerjaan berhak diterima sebesar Rp2.850.000,00.","answer":"Benar","explanation":"Langkah 1: Menyatakan parameter letak awal remunerasi bruto lemburan didapat tabulasi model \ngaji pokok awal 𝑎= 2.100.000 dan 𝑏= 150.000. Langkah 2: Menyalakan persamaan matematis \naritmetika ke-𝑛 suku murni saat target menginjak bulan kerja 𝑛= 6 dengan rumus 𝑈6 = 𝑎+ 5𝑏. \nLangkah 3: Melakukan hasil numerasi hitungan langsung diperoleh upah kotor berkisar \n2.100.000 + 750.000 = 𝑅𝑝2.850.000,00."},{"text":"Porsi bagian dana kesejahteraan zakat pengorbanan sosial bernilai murni keluar dipotong murni khusus untuk penarikan sewaktu menginjak periode semester bulan ganjil ke-5 pembukuan disetorkan dengan besaran Rp270.000,00.","answer":"Benar","explanation":"Langkah 1: Mencari jumlah pendapatan mentah yang siap ditarik khusus di akhir penugasan \nmengajar masa periode kelima bulanan yakni 𝑈5 = 2.100.000 + 4 × 150.000 = 2.700.000 rupiah. \nLangkah 2: Merespon petunjuk pemotongan infak yang diwajibkan asisten pada angka index \nganjil (5 ganjil) pangkas porsi upah yaitu bernilai potongan stabil 10%. Langkah 3: Menyelesaikan \nhasil murni potong yaitu 10% × 𝑅𝑝2.700.000,00 = 𝑅𝑝270.000,00."},{"text":"Besarnya tingkat lonjakan perkembangan dana pendapatan upah kasar sebelum saringan diantara periode penerimaan semester urutan bulan ke-5 dengan tatanan jatah upah kasar mula- mula adalah senilai Rp600.000,00.","answer":"Benar","explanation":"Langkah 1: Mempersiapkan besar honor bruto urutan semester kerja kelima pembukuan di kas \nwaralaba diperoleh 𝑈5 = 𝑅𝑝2.700.000,00. Langkah 2: Mengisikan kas kasar permulaan bulan \nmasa rintisan kesatu pelayanan asisten diperoleh 𝑈1 = 𝑅𝑝2.100.000,00. Langkah 3: Meluncurkan \npengurangan sisa pembanding modal pergerakan honor yaitu sebesar Rp2.700.000,00 - \nRp2.100.000,00 = Rp600.000,00."},{"text":"Pendapatan utuh bersih penampung saku asisten yang sukses diserahkan sesudah pengkondisian kewajiban pangkas sosial dari rekening zakat pangkasan kala melunasi upah di bulan ke-3 berkisar Rp2.260.000,00.","answer":"Salah","explanation":"Langkah 1: Mengatur penghitungan nominal sebelum saringan upah sirkuit pelayanan bulan \nganjil nomor 3 yang ditarik bernilai murni sebesar 𝑈3 = 2.100.000 + (2 × 150.000) = 2.400.000 \nrupiah. Langkah 2: Menggunakan beban persentase pemotong donasi asisten wajib index bernilai \nangka ganjil (3) yaitu saku asisten tersisih potong porsi sebesar 10% bernilai Rp240.000,00. \nLangkah 3: Meluncurkan selisih dana operasional perolehan saku penampung terpegang asisten \nsetelah saringan adalah Rp2.400.000 - Rp240.000 = Rp2.160.000,00."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
