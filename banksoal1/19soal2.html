<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Pengumpulan dan Pengelompokan Data</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · PENGUMPULAN DAN PENGELOMPOKAN DATA</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Dalam sebuah kelas terdapat 25 orang siswa. Setelah dilakukan pendataan mengenai\ntransportasi ke sekolah, diketahui sebanyak 5 orang siswa berjalan kaki. Persentase siswa yang\nberjalan kaki ke sekolah adalah ....","options":[{"key":"A","text":"10%"},{"key":"B","text":"20%"},{"key":"C","text":"25%"},{"key":"D","text":"50%"}],"answer":"B","explanation":"Langkah 1: Hitung persentase siswa berjalan kaki dengan cara membagi banyaknya siswa\nberjalan kaki dengan total siswa, kemudian dikalikan 100%.\nLangkah 2:\n5\n25 × 100% =\n1\n5 × 100% = 20%.\nJawaban Benar: B"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Andi ingin melakukan penyelidikan mengenai kebiasaan sarapan pagi teman sekelasnya sebelum\nmulai belajar. Manakah pertanyaan yang paling tepat diajukan oleh Andi untuk mengumpulkan\ndata tersebut?","options":[{"key":"A","text":"\"Apakah sarapan pagi itu penting bagi kesehatan tubuh?\""},{"key":"B","text":"\"Mengapa kamu suka makan nasi uduk di pagi hari?\""},{"key":"C","text":"\"Menu makanan apa yang paling sering kamu makan untuk sarapan pagi?\""},{"key":"D","text":"\"Berapa banyak kalori yang dibutuhkan tubuh saat sarapan pagi?\""}],"answer":"C","explanation":"Langkah 1: Menganalisis tujuan investigasi yaitu mengetahui kebiasaan sarapan pagi siswa.\nPertanyaan pilihan A mengukur opini tentang pentingnya sarapan, bukan mengidentifikasi\nkebiasaan sarapan siswa.\nPertanyaan pilihan B mengukur alasan subjektif menyukai nasi uduk saja, sehingga datanya\nterlalu sempit.\nPertanyaan pilihan C secara langsung mengumpulkan data jenis makanan yang dikonsumsi oleh\nsetiap siswa sebagai bentuk kebiasaan sarapan mereka.\nPertanyaan pilihan D mengukur pengetahuan sains mengenai kalori.\nJawaban Benar: C"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Seorang ketua OSIS ingin mengetahui jenis ekstrakurikuler yang paling diminati oleh siswa kelas\nVII. Ia membagikan kuesioner pilihan kepada seluruh siswa kelas VII untuk diisi langsung di\nsekolah. Berdasarkan cara memperolehnya, data yang dikumpulkan oleh ketua OSIS tersebut\ndikelompokkan sebagai ....","options":[{"key":"A","text":"data primer"},{"key":"B","text":"data sekunder"},{"key":"C","text":"data eksternal"},{"key":"D","text":"data kelompok"}],"answer":"A","explanation":"Data primer adalah data yang diperoleh secara langsung dari sumber pertama (responden) oleh\npeneliti atau pengumpul data.\nKarena ketua OSIS membagikan kuesioner langsung kepada siswa kelas VII untuk diisi, maka\ndata tersebut didapat dari sumber pertama.\nDengan demikian, data tersebut dikelompokkan sebagai data primer.\nJawaban Benar: A"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Untuk proyek daur ulang di sekolah, lima kelompok siswa di Semarang mengumpulkan botol\nplastik bekas. Berat botol yang terkumpul dari masing-masing kelompok adalah 15 kg, 22 kg, 18\nkg, 𝑥 kg, dan 25 kg. Jika rata-rata berat botol plastik yang dikumpulkan oleh kelima kelompok\ntersebut adalah 21 kg, maka rentang data (selisih berat terbesar dan terkecil) dari botol yang\ndikumpulkan adalah ....","options":[{"key":"A","text":"10 kg"},{"key":"B","text":"12 kg"},{"key":"C","text":"15 kg"},{"key":"D","text":"18 kg"}],"answer":"A","explanation":"Langkah 1: Tentukan nilai 𝑥 dari rata-rata yang diketahui.\n15+22+18+𝑥+25\n5\n= 21 ⟹ 80 + 𝑥=\n105 ⟹ 𝑥= 25 kg.\nLangkah 2: Susun data yang telah lengkap: 15,18,22,25,25. Nilai terbesar adalah 25 kg dan nilai\nterkecil adalah 15 kg. Rentang data = 25 −15 = 10 kg.\nJawaban Benar: A"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Dalam pemilihan ketua OSIS dengan empat calon, tercatat ada 400 suara yang sah. Adi\nmemperoleh 35% suara, Budi memperoleh 20% suara, Cici memperoleh 25% suara, dan sisanya\ndiperoleh oleh Dedi. Berapa banyak suara sah yang diperoleh oleh Dedi?","options":[{"key":"A","text":"20 suara"},{"key":"B","text":"40 suara"},{"key":"C","text":"60 suara"},{"key":"D","text":"80 suara"}],"answer":"D","explanation":"Langkah 1: Tentukan persentase suara Dedi: 100% −(35% + 20% + 25%) = 20%.\nLangkah 2: Hitung banyak suara yang diperoleh Dedi: 20% × 400 = 80 suara.\nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Panitia Festival Kuliner Lumpia Semarang mendata usia para pengunjung stan mereka dan\nmemperoleh informasi bahwa pengunjung berusia di bawah 15 tahun sebanyak 15 orang, usia 15\nsampai 30 tahun sebanyak 25 orang, dan usia di atas 30 tahun sebanyak 10 orang. Berapakah\npersentase pengunjung stan tersebut yang berusia 15 tahun ke atas?","options":[{"key":"A","text":"20%"},{"key":"B","text":"30%"},{"key":"C","text":"50%"},{"key":"D","text":"70%"}],"answer":"D","explanation":"Langkah 1: Hitung total seluruh pengunjung stan: 15 + 25 + 10 = 50 orang.\nLangkah 2: Hitung jumlah pengunjung berusia 15 tahun ke atas (kelompok usia 15 sampai 30\ntahun ditambah usia di atas 30 tahun): 25 + 10 = 35 orang. Hitung persentasenya terhadap total\npengunjung:\n35\n50 × 100% = 70%.\nJawaban Benar: D"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Seorang peneliti botani mengelompokkan data tinggi tanaman (dalam cm) ke dalam kelas interval\nbilangan bulat: Kelas I (10 −14 cm), Kelas II (15 −19 cm), Kelas III (20 −24 cm), dan Kelas IV\n(25 −29 cm). Data tinggi tanaman desimal yang ia peroleh adalah:\n12.5; 14.8; 19.2; 20.0; 24.5; 28.1. Untuk mengelompokkan data desimal ini secara ilmiah dan\nkonsisten ke dalam kelas interval bulat tersebut, solusi pembulatan matematika yang paling tepat\nadalah ....","options":[{"key":"A","text":"Membulatkan setiap data desimal ke bilangan bulat terdekat sehingga 14.8 menjadi 15 (masuk  Kelas II) dan 24.5 dibulatkan ke atas menjadi 25 (masuk Kelas IV)."},{"key":"B","text":"Mengabaikan semua angka di belakang koma (pemotongan/truncation) sehingga 14.8 menjadi  14 (Kelas I) dan 24.5 menjadi 24 (Kelas III) agar semua data masuk kelas yang lebih rendah."},{"key":"C","text":"Menggunakan batas bawah nyata (14.5 dan 24.5) untuk menentukan bahwa 14.8 masuk Kelas  I karena masih di bawah 15, dan 24.5 masuk Kelas III karena belum melewati 24."},{"key":"D","text":"Menolak semua data desimal tersebut dan mengulangi pengukuran tanaman di lapangan  sampai mendapatkan nilai bilangan bulat yang pas."}],"answer":"A","explanation":"Langkah 1: Identifikasi ketidaksesuaian antara data desimal kontinu dan batas interval kelas yang\nberupa bilangan bulat diskret.\nLangkah 2: Terapkan aturan pembulatan matematika standar (jika angka di belakang koma ≥5,\nbulatkan ke atas; jika < 5, bulatkan ke bawah).\nLangkah 3: Konversikan data uji: 14.8 dibulatkan menjadi 15 (Kelas II: 15 −19), 24.5 dibulatkan\nmenjadi 25 (Kelas IV: 25 −29).\nJawaban Benar: A"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Seorang siswa di Jakarta ingin menyajikan data laju inflasi bulanan di Indonesia selama kurun\nwaktu tahun 2024. Siswa tersebut bertujuan agar pembaca dapat dengan mudah mengidentifikasi\ntren naik-turun dan kesinambungan perubahan laju inflasi dari bulan ke bulan. Siswa tersebut\nmenyimpulkan bahwa diagram batang adalah grafik yang paling tepat untuk tujuan tersebut\nkarena dapat membandingkan nilai laju inflasi bulanan secara jelas. Evaluasi yang tepat tentang\nkesimpulan siswa tersebut adalah ....","options":[{"key":"A","text":"Kesimpulan siswa benar karena diagram batang sangat efektif dalam menunjukkan visualisasi  tren perubahan data berkesinambungan dari waktu ke waktu."},{"key":"B","text":"Kesimpulan siswa salah karena data laju inflasi bulanan merupakan data kualitatif sehingga  lebih tepat disajikan menggunakan diagram lingkaran."},{"key":"C","text":"Kesimpulan siswa salah karena diagram garis lebih tepat digunakan untuk memvisualisasikan  tren perkembangan data yang berkesinambungan dari waktu ke waktu."},{"key":"D","text":"Kesimpulan siswa benar karena diagram batang lebih mudah dibaca untuk data berkala  dibandingkan dengan diagram garis yang berpotensi membingungkan pembaca."}],"answer":"C","explanation":"Langkah 1: Analisis jenis data dan tujuan penyajian. Data laju inflasi bulanan selama kurun waktu\ntahun 2024 adalah data deret waktu (time-series) yang berkesinambungan.\nLangkah 2: Tentukan jenis grafik yang sesuai. Untuk memvisualisasikan tren, perkembangan,\ndan kesinambungan perubahan data dari waktu ke waktu, diagram garis (line chart) adalah\nrepresentasi yang paling tepat.\nLangkah 3: Evaluasi kesimpulan siswa. Siswa salah karena diagram batang umumnya digunakan\nuntuk membandingkan kategori-kategori yang berbeda secara diskrit, bukan untuk menunjukkan\ntren yang berkesinambungan waktu demi waktu seperti diagram garis.\nJawaban Benar: C"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Panitia festival seni SMP ingin mengetahui lagu daerah terfavorit siswa untuk menentukan lagu\npembuka festival. Festival ini diikuti oleh seluruh kelas VII, VIII, dan IX. Karena keterbatasan\nwaktu, panitia memutuskan hanya menyebarkan angket di kantin sekolah pada jam istirahat\npertama kepada siswa laki-laki kelas IX yang sedang berkumpul. Kelemahan fatal dari metode\npengumpulan data tersebut adalah ....","options":[{"key":"A","text":"data yang terkumpul terlalu homogen dan tidak merepresentasikan seluruh kelas serta jenis  kelamin siswa di sekolah tersebut"},{"key":"B","text":"metode angket tidak valid untuk mengukur selera musik; panitia seharusnya menggunakan  metode eksperimen laboratorium"},{"key":"C","text":"kantin sekolah adalah tempat yang bising sehingga siswa kemungkinan besar salah dalam  mengisi lembar angket lagu daerah"},{"key":"D","text":"pengumpulan data di jam istirahat pertama tidak efektif karena waktu istirahat yang sangat  singkat membuat data tidak lengkap"}],"answer":"A","explanation":"Langkah 1: Identifikasi populasi target, yaitu seluruh kelas VII, VIII, dan IX baik laki-laki maupun\nperempuan.\nLangkah 2: Analisis sampel yang diambil, yaitu hanya siswa laki-laki kelas IX yang berada di\nkantin pada jam istirahat pertama.\nLangkah 3: Evaluasi kelemahan metode ini di mana sampel sangat bias secara gender (hanya\nlaki-laki) dan angkatan (hanya kelas IX), sehingga data homogen dan tidak representatif.\nJawaban Benar: A"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Sebuah toko buku mencatat jumlah buku tulis yang terjual selama empat hari berturut-turut, yaitu\n12 buku pada hari pertama, 15 buku pada hari kedua, 10 buku pada hari ketiga, dan 18 buku\npada hari keempat. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai\npengelompokan atau pengumpulan data tersebut!","statements":[{"text":"Data jumlah buku tulis yang terjual selama empat hari berturut-turut termasuk dalam jenis data kuantitatif.","answer":"Benar","explanation":"Data berupa bilangan numerik hasil perhitungan (jumlah buku) merupakan tipe data kuantitatif."},{"text":"Hari dengan penjualan buku tulis paling sedikit terjadi pada hari ketiga, yaitu sebanyak 10 buku.","answer":"Benar","explanation":"Dari nilai data 12, 15, 10, dan 18, nilai paling rendah (terkecil) adalah 10 yang dicatat pada hari ketiga."},{"text":"Metode pengumpulan data yang dilakukan oleh pihak pengelola toko diklasifikasikan sebagai pengumpulan data sekunder berupa hasil kuesioner eksternal.","answer":"Salah","explanation":"Pencatatan langsung atas penjualan di kasir sendiri merupakan metode pencatatan dokumen primer internal toko, bukan kuesioner eksternal."},{"text":"Total seluruh buku tulis yang berhasil terjual di toko tersebut selama periode empat hari adalah sebanyak 55 buku.","answer":"Benar","explanation":"Melakukan penjumlahan satu langkah: 12 + 15 + 10 + 18 = 55 buku."}],"explanation":""},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Seorang ketua RT melakukan pendataan dengan mengunjungi rumah-rumah secara langsung\nuntuk menanyakan dan menulis usia seluruh balita yang berada di lingkungannya dalam satuan\ntahun untuk perencanaan posyandu bulanan. Tentukan benar atau salah untuk setiap pernyataan\nmengenai karakteristik pengumpulan data tersebut!","statements":[{"text":"Pencatatan identitas umur merupakan salah satu cara klasifikasi tipe data kuantitatif diskret.","answer":"Benar","explanation":"Usia dalam nominal bilangan hitung yang dikuantifikasi merupakan data numeris bernilai kuantitatif."},{"text":"Metode kunjungan yang ditempuh digolongkan ke dalam pencarian ragam data primer secara berkala.","answer":"Benar","explanation":"Menemui subjek target dan mendatanya secara berkala dikelompokkan ke pengumpulan sumber data primer."},{"text":"Kuesioner wawancara temu muka secara verbal langsung ialah salah satu rujukan sumber perantara primer.","answer":"Benar","explanation":"Pertanyaan wawancara dengan berhadapan mengesahkan hubungan primer pencari dan narasumber langsung."},{"text":"Hasil pencatatan ketua RT dikategorikan sekunder karena masih memerlukan pengarsipan kelurahan.","answer":"Salah","explanation":"Aspek kearsipan berikutnya tidak mendegradasi kedudukan pencatatan dasar orisinalnya dari RT sebagai data primer awal."}],"explanation":""},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Aida hendak menganalisis jumlah jam durasi penyelesaian PR malam dari 40 teman satu\nperkumpulan secara terkomputerisasi dengan fitur poling kuesioner digital dalam platform media\nkomunikasi kelas. Tentukan benar atau salah untuk masing-masing opsi penjelasan tipe data\ndigital di bawah ini!","statements":[{"text":"Upaya penyusunan data dari responden via fasilitas interaktif pesan instan daring dikategorikan teoretis data primer.","answer":"Benar","explanation":"Umpan balik seketika diperoleh secara virtual orisinal dari target amatan lapangan yang memformulasikan data utama awal (primer)."},{"text":"Rekapan tabel pengiriman tersebut menjadi tidak absah bila dicap selaku data numerik kuantitatif karena tidak diukur memakai meteran besi fisik.","answer":"Salah","explanation":"Konsep variabel durasi dalam angka numerik bilangan cacah jam melambangkan bentuk logis data kuantitatif mandiri tanpa harus memandang instrumen analognya."},{"text":"Angka lama waktu jam tidur yang dimasukkan ke jajak pendapat diwujudkan murni pada golongan data kuantitatif kontinu.","answer":"Benar","explanation":"Skala desimal numerik nilai ukuran jam menunjukkan variabel fisik besaran ukuran kuantitas dinamis waktu."},{"text":"Kumpulan tautan rujukan artikel ilmiah dari perpustakaan asing daring mewakili pengenalan kategori teknik inventori primer murni data dasar lapangan.","answer":"Salah","explanation":"Portal ilmiah dan publikasi merupakan kompilator tepercaya informasi tersadur berlingkup basis instrumen arsip pengumpulan jenis sekunder."}],"explanation":""},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Seorang kurir mendata berat paket yang dikirimkannya dalam sehari. Dari 50 paket, diperoleh\ninformasi: 15 paket berukuran sangat kecil (di bawah 1 kg), 20 paket sedang (1 hingga 3 kg), dan\nsisanya paket berat (di atas 3 kg). Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Jumlah paket yang tergolong dalam kategori paket berat (di atas 3 kg) adalah 15 paket.","answer":"Benar","explanation":"Langkah 1: Menghitung total gabungan paket kecil dan sedang yaitu 15 + 20 = 35 paket. Langkah 2: Melakukan pengurangan dengan total keseluruhan paket yaitu 50 −35 = 15 paket."},{"text":"Persentase jumlah paket berukuran sedang yang dikirimkan kurir tersebut mencapai tepat 40%.","answer":"Benar","explanation":"Langkah 1: Membagi porsi kategori paket sedang dengan total paket harian yaitu 20 50. Langkah 2: Mengalikan dengan 100% sehingga diperoleh hasil tepat 40%."},{"text":"Jika dipetakan pada diagram lingkaran, sudut jorong pusat untuk paket berukuran sangat kecil adalah sebesar 100∘.","answer":"Salah","explanation":"Langkah 1: Mencari perbandingan kuantitas paket kecil terhadap keseluruhan paket yaitu 15 50. Langkah 2: Mengonversi ke bagian sudut melingkar 15 50 × 360∘= 108∘, bukan 100∘."},{"text":"Sektor paket dengan berat di atas 3 kg memiliki nilai persentase porsi kontribusi yang tepat sama dengan paket di bawah 1 kg.","answer":"Benar","explanation":"Langkah 1: Mengidentifikasi kuantitas kedua paket tersebut yang sama-sama bernilai 15 paket. Langkah 2: Mengambil simpulan logis bahwa dua nilai kuantitas sama berbanding terhadap populasi sama pasti memberikan persentase yang identik (30%)."}],"explanation":""},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Sebuah badan konservasi meneliti data bibit jati berumur satu bulan di suatu blok persemaian\nberdasarkan metode perkecambahan: hasil semai biji sebanyak 150 batang, kultur jaringan\nsebanyak 180 batang, stek pucuk sebanyak 120 batang, dan okulasi sebanyak 50 batang. Beri\ntanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Data asal usul asal bibit perkecambahan ini merupakan data kategori non-numerik yang dikelompokkan sebagai jenis data kualitatif.","answer":"Benar","explanation":"Langkah 1: Tinjau properti dari klasifikasi kelompok yaitu jenis/sumber asal perkecambahan. Langkah 2: Kelompokkan tipe data non-numeris kategorial ini sebagai data kualitatif. Pernyataan ini benar."},{"text":"Perbandingan kuantitas bibit dari metode kultur jaringan dibanding dengan metode stek pucuk disederhanakan menjadi 4: 3.","answer":"Salah","explanation":"Langkah 1: Identifikasi nilai kultur jaringan (180) dan stek pucuk (120). Langkah 2: Sederhanakan rasio antara keduanya yaitu 180 120 = 3: 2, bukan 4: 3."},{"text":"Jorong daerah bibit hasil okulasi di dalam sajian diagram lingkaran mempunyai ukuran sudut pusat lingkaran sebesar 45∘.","answer":"Salah","explanation":"Langkah 1: Cari total kumulatif jati keseluruhan, 150 + 180 + 120 + 50 = 500 batang. Langkah 2: Sudut bagian okulasi adalah 50 500 × 360∘= 36∘, bukan 45∘."},{"text":"Gabungan kuantitas jati dari asal semai biji dan kultur jaringan membentuk porsi tepat sebesar 66% dari total seluruh populasi.","answer":"Benar","explanation":"Langkah 1: Hitung gabungan dari kelompok biji dan kultur yaitu 150 + 180 = 330 bibit. Langkah 2: Bandingkan proporsinya terhadap total populasi, yaitu 330 500 × 100% = 66%. Pernyataan ini benar."}],"explanation":""},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Sebuah penelitian kecil dilakukan di SMP Kota Padang untuk mencatat jenis jajanan favorit di\nkantin. Dari 50 sampel siswa, didapatkan data: bakso bakar disukai oleh 18 siswa, batagor\ndisukai oleh 12 siswa, cilok disukai oleh 15 siswa, dan sisanya menyukai buah segar. Tentukan\nbenar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Siswa yang menyukai buah segar sebanyak 10 siswa.","answer":"Salah","explanation":"Siswa penyuka buah segar diperoleh melalui hitungan 50 −(18 + 12 + 15) = 50 −45 = 5 siswa, bukan 10."},{"text":"Metode pengumpulan data dengan cara bertanya langsung pada 50 siswa tersebut digolongkan sebagai pengumpulan data sekunder.","answer":"Salah","explanation":"Pengumpulan data yang dilakukan langsung dengan mewawancarai subjek/sampel penelitian merupakan proses perolehan data primer."},{"text":"Persentase siswa yang menyukai batagor adalah 24%.","answer":"Benar","explanation":"Siswa penyuka batagor adalah 12 orang. Persentasenya dari keseluruhan adalah 12 50 × 100% = 24%."},{"text":"Data jenis jajanan ini merupakan data kualitatif nominal karena tidak memiliki tingkatan logis tertentu.","answer":"Benar","explanation":"Jenis jajanan merupakan label nama berupa atribut deskriptif kualitatif yang posisinya sederajat tanpa tata urutan bergradasi logis."}],"explanation":""},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Seorang pengamat mengukur kualitas sanitasi fasilitas umum di stasiun KA melalui angket\nberkala berkriteria nilai skala ordinal 1 −4 (Sangat Kurang, Kurang, Baik, Memuaskan). Pada\nakhir bulan, diperoleh sampel jajak pendapat dari 80 pengguna Toilet Pria (pembagian skor\nberturut-turut dari tingkat 1 sampai 4 adalah 15, 20, 35, 10 orang) dan 100 pengguna Toilet\nWanita (pembagian skor dari tingkat 1 sampai 4 adalah 10, 15, 55, 20 orang). Beri tanda centang\n(v) pada setiap pernyataan yang benar!","statements":[{"text":"Secara kumulatif, nilai rata-rata (mean) kepuasan Toilet Wanita sebesar 2.85 lebih tinggi daripada rata-rata kepuasan Toilet Pria yang hanya bernilai 2.50.","answer":"Benar","explanation":"Step 1: Mean Pria = (15 ∗1 + 20 ∗2 + 35 ∗3 + 10 ∗4)/80 = (15 + 40 + 105 + 40)/80 = 200/80 = 2.50. Step 2: Mean Wanita = (10 ∗1 + 15 ∗2 + 55 ∗3 + 20 ∗4)/100 = (10 + 30 + 165 + 80)/100 = 285/100 = 2.85. Step 3: Mean Toilet Wanita (2.85) memang lebih tinggi dibanding Toilet Pria (2.50). Maka benar."},{"text":"Untuk Toilet Wanita, persentase pelanggan yang minimal menyatakan tingkat layanan sudah 'Baik' (nilai 3 dan 4) adalah sebesar 75 % dari jumlah pengguna toilet di kelompoknya.","answer":"Benar","explanation":"Step 1: Agregat tingkat Baik (skor 3) dan Memuaskan (skor 4) di kelompok Wanita adalah 55 + 20 = 75 responden. Step 2: Populasi responden toilet Wanita adalah 100 responden. Step 3: Persentase proporsinya = 75/100 ∗100% = 75%. Angka persis setara klaim. Maka benar."},{"text":"Modus untuk kelompok pengguna Toilet Pria adalah berada pada tingkat 'Kurang' (skala 2), yang dihitung berdasarkan jumlah responden kumulatif terbanyak.","answer":"Salah","explanation":"Step 1: Data sebaran pemilih pada Toilet Pria adalah 15 (Sangat Kurang), 20 (Kurang), 35 (Baik), dan 10 (Memuaskan). Step 2: Ambil kelompok pemilik suara terbanyak yaitu nilai frekuensi terbesar, diperoleh frekuensi terbesar adalah 35. Step 3: Kelompok pemilik 35 responden ini jatuh ke peringkat indeks kategori tingkat 'Baik' (nilai 3), bukan 'Kurang' (nilai 2). Maka salah."},{"text":"Nilai tanggapan yang disajikan berdasarkan opsi berupa skala sikap stasiun ini digolongkan sebagai data kualitatif ordinal dengan pengumpulan menggunakan teknik data primer.","answer":"Benar","explanation":"Step 1: Opsi berupa tingkatan predikat kualifikasi kaku dengan tingkat ketegasan hierarkis bertangga murni bernilai sebagai data kualitatif ordinal. Step 2: Hasil langsung disaring dari permohonan ke tangan pengunjung pengguna fasilitas langsung sehinggal valid diidentifikasi berposisi data primer. Maka benar."}],"explanation":""},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Dinas Pendidikan Kota mendata preferensi minat baca terhadap tiga genre buku (Fiksi, Sains,\nSejarah) pada sekelompok siswa di dua sekolah menengah pertama. Sampel terdiri dari 120\nsiswa di SMP Jaya dan 160 siswa di SMP Bangsa. Hasil survei mandiri (data primer) di SMP\nJaya menunjukkan sebanyak 55 siswa memilih Fiksi, 45 siswa memilih Sains, dan sisanya\nmemilih Sejarah; sedangkan di SMP Bangsa terdapat 64 siswa memilih Fiksi, 48 siswa memilih\nSains, dan sisanya Sejarah. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Secara proporsional, persentase minat baca genre Sejarah di SMP Bangsa (30%) adalah hampir dua kali lipat lebih besar jika dibandingkan persentase genre Sejarah di SMP Jaya (16.67%).","answer":"Benar","explanation":"Step 1: Hitung jumlah pembaca Sejarah SMP Jaya: 120 −55 −45 = 20 orang. Persentasenya 20/120 ∗100% = 16.67%. Step 2: Hitung jumlah pembaca Sejarah SMP Bangsa: 160 −64 − 48 = 48 orang. Persentasenya 48/160 ∗100% = 30%. Step 3: Proporsi 30% mendekati dua kali dari 16.67% (sekitar 33.34%). Perbandingan tersebut logis dan benar."},{"text":"Untuk menampilkan perkembangan jumlah pembaca total berdasar jenis genre dari kedua sekolah secara berkelanjutan tahun demi tahun, grafik tunggal yang paling direkomendasikan adalah grafik diagram lingkaran.","answer":"Salah","explanation":"Step 1: Menampilkan tren longitudinal 'tahun demi tahun' adalah memantau kelangsungan kontinuitas data seiring waktu. Step 2: Jenis visualisasi yang mampu menampilkan arah gerakan fluktuasi runtun waktu dengan jelas adalah diagram garis (line chart). Step 3: Diagram lingkaran hanya efektif menjelaskan kontribusi parsial bagian di satu waktu stasioner saja. Maka salah."},{"text":"Berdasarkan total kumulatif dari kedua sekolah tersebut, jumlah pembaca buku bertema Sains memiliki frekuensi gabungan tertinggi daripada kedua tema lainnya.","answer":"Salah","explanation":"Step 1: Hitung total peminat masing-masing kategori. Total Fiksi: 55 + 64 = 119 siswa. Step 2: Total Sains: 45 + 48 = 93 siswa. Step 3: Total Sejarah: 20 + 48 = 68 siswa. Modus atau minat tertinggi diperoleh pada buku Fiksi (119 siswa), bukan Sains (93 siswa). Maka salah."},{"text":"Jika peneliti hanya ingin mendapatkan kesimpulan tren umum membaca siswa sekota berdasarkan riset ini tanpa melakukan wawancara langsung, data arsip dinas pendidikan (data sekunder) ini dikategorikan memadai asalkan sampel representatif secara proporsional.","answer":"Benar","explanation":"Step 1: Sifat umum analisis makro (tren kota) dimungkinkan berjalan tanpa penemuan individual mendalam asal kuota responden luas dan adil. Step 2: Pemanfaatan rekap dinas termasuk penggunaan data sekunder berstatus sahih. Step 3: Prinsip generalisasi sampel proporsional tepercaya. Maka benar."}],"explanation":""},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Melakukan investigasi, mengumpulkan, mengolah, \nmenginterpretasi dan menganalisis data serta membedakan jenis \ndata dan menentukan grafik yang sesuai.","question":"Analis laju kendaraan mengamati grafik berkala visualisasi radar Dishub kota dan mengopi\ncatatan kelajuan laju 12 unit mobil (dalam km/jam) pada persimpangan arteri primer padat\nsebagai berikut: 60, 75, 80, 75, 70, 80, 𝑥, 75, 60, 70, 80, dan 80. Berdasarkan laporan\notomatisasi sistem terintegrasi dinas, besarnya rata-rata melaju kelompok kendaraan di sana\nbernilai 74 km/jam. Lakukan analisis statistik atas laju kendaraan ini, kemudian beri tanda\ncentang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Variabel nilai batas 𝑥 yang merepresentasikan batas pacu mobil ke-12 agar nilai rata-ratanya genap mencapai 74 km/jam adalah sebesar 83 km/jam.","answer":"Benar","explanation":"Rata-rata 12 unit mobil = 74 km/jam. Jumlah akumulatif keseluruhan nilai adalah 12 × 74 = 888. Hasil total penjumlahan sebelas komponen data lainnya yang telah tercatat adalah 60 + 75 + 80 + 75 + 70 + 80 + 75 + 60 + 70 + 80 + 80 = 805. Kecepatan mobil ke-12 (𝑥) adalah 888 − 805 = 83 km/jam. Pernyataan benar."},{"text":"Aktivitas analisis dengan mengunduh server data catatan laju ini masuk pengelompokan dokumentasi data sekunder.","answer":"Benar","explanation":"Karena peneliti mengopi data digital terhimpun tidak langsung tanpa menyebarkan sensor manual milik pribadinya sendiri (data sudah didata radar server pihak ketiga yaitu Dinas Perhubungan), ini adalah dokumentasi data sekunder. Pernyataan benar."},{"text":"Hasil sebaran laju mobil mengonformasikan bahwa modus nilai kecepatan lalu lintas titik terhitung sebesar 75 km/jam.","answer":"Salah","explanation":"Berdasarkan sebaran frekuensinya: laju 60 muncul 2 kali, 70 muncul 2 kali, 75 muncul 3 kali, 80 muncul 4 kali, dan 83 muncul 1 kali. Modus data adalah 80 km/jam, bukan 75 km/jam. Pernyataan salah."},{"text":"Jika ditampilkan dengan model bagan balok berdiri (diagram batang), persentase frekuensi batang data 80 km/h menyerap kuota relatif setara sepertiga atau 33.3% dari laju seluruh mobil.","answer":"Benar","explanation":"Banyak mobil berkelajuan 80 km/jam di persimpangan itu berjumlah sebanyak 4 unit dari 12 unit populasi terkelompok. Persentase perbandingan kuotanya = 4 12 × 100% ≈33.3%. Pernyataan benar."}],"explanation":""}];

const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
