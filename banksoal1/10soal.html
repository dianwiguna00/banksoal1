<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Penyajian Data</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT PENYAJIAN DATA</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Sebuah sekolah mencatat jumlah buku paket pelajaran yang dipinjam oleh siswa kelas VII dari\nhari Senin sampai Kamis. Jika batang diagram hari Senin menunjukkan tinggi 30 buku dan hari\nSelasa menunjukkan tinggi 50 buku, selisih jumlah peminjaman buku pada kedua hari tersebut\nadalah ....","options":[{"key":"A","text":"20 buku"},{"key":"B","text":"30 buku"},{"key":"C","text":"50 buku"},{"key":"D","text":"80 buku"}],"answer":"A","explanation":"Langkah 1: Temukan nilai peminjaman pada hari Senin (30 buku) dan hari Selasa (50 buku).\nLangkah 2: Hitung selisih kedua nilai tersebut dengan pengurangan langsung: 50 −30 = 20\nbuku.\nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Di sebuah kelas terdapat 40 siswa, dan 10 siswa di antaranya memilih mengikuti kegiatan\nekstrakurikuler musik. Jika data ini disajikan dalam bentuk diagram lingkaran, berapakah besar\nsudut pusat yang mewakili kelompok musik?","options":[{"key":"A","text":"45∘."},{"key":"B","text":"90∘."},{"key":"C","text":"120∘."},{"key":"D","text":"150∘."}],"answer":"B","explanation":"Besar sudut pusat untuk kelompok musik dihitung dengan:\n𝐽𝑢𝑚𝑙𝑎ℎ 𝑆𝑖𝑠𝑤𝑎 𝑀𝑢𝑠𝑖𝑘\n𝑇𝑜𝑡𝑎𝑙 𝑆𝑖𝑠𝑤𝑎\n× 360∘=\n10\n40 × 360∘=\n1\n4 × 360∘= 90∘.\nJawaban Benar: B."},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Sebuah diagram batang menyajikan data jumlah pengunjung perpustakaan sekolah dari Senin\nsampai Jumat, di mana tinggi batang hari Senin menunjukkan 25 orang, Selasa 30 orang, Rabu\n35 orang, Kamis 20 orang, dan Jumat 40 orang. Berapa jumlah pengunjung perpustakaan pada\nhari Jumat berdasarkan data tersebut?","options":[{"key":"A","text":"20 orang."},{"key":"B","text":"25 orang."},{"key":"C","text":"35 orang."},{"key":"D","text":"40 orang."}],"answer":"D","explanation":"Langkah 1: Cari kategori hari Jumat pada sumbu horizontal diagram.\nLangkah 2: Baca nilai yang ditunjukkan oleh tinggi batang untuk hari Jumat, yaitu 40 orang.\nJawaban Benar: D"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Pengunjung perpustakaan daerah di Makassar selama lima hari berturut-turut tercatat sebagai\nberikut: Senin sebanyak 45 orang, Selasa sebanyak 60 orang, Rabu sebanyak 50 orang, Kamis\nsebanyak 40 orang, dan Jumat sebanyak 55 orang. Berapakah persentase jumlah pengunjung\npada hari Selasa dari total seluruh pengunjung selama lima hari tersebut?","options":[{"key":"A","text":"16%"},{"key":"B","text":"20%"},{"key":"C","text":"22%"},{"key":"D","text":"24%"}],"answer":"D","explanation":"Langkah 1: Hitung total seluruh pengunjung selama lima hari: 45 + 60 + 50 + 40 + 55 = 250\norang.\nLangkah 2: Hitung persentase pengunjung pada hari Selasa:\n60\n250 × 100% = 24%.\nJawaban Benar: D"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Data hasil penjualan bibit tanaman buah di sebuah tempat pembibitan selama empat minggu\nberturut-turut adalah sebagai berikut: minggu I terjual 40 bibit, minggu II terjual 60 bibit, minggu III\nterjual 50 bibit, dan minggu IV terjual 90 bibit. Selisih antara banyak bibit yang terjual pada\nminggu IV dengan rata-rata penjualan bibit per minggu adalah ....","options":[{"key":"A","text":"10 bibit"},{"key":"B","text":"15 bibit"},{"key":"C","text":"20 bibit"},{"key":"D","text":"30 bibit"}],"answer":"D","explanation":"Langkah 1: Hitung rata-rata penjualan bibit tanaman per minggu: Rata-rata =\n40+60+50+90\n4\n=\n240\n4 =\n60 bibit.\nLangkah 2: Cari selisih penjualan pada minggu IV (90 bibit) dengan nilai rata-rata: 90 −60 = 30\nbibit.\nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Data banyaknya buku fiksi yang dibaca oleh sekelompok siswa dalam satu bulan disajikan\nsebagai berikut: 2 siswa membaca 1 buku, 4 siswa membaca 2 buku, 5 siswa membaca 3 buku,\n3 siswa membaca 4 buku, dan 2 siswa membaca 5 buku. Berapakah median dari jumlah buku\nyang dibaca oleh sekelompok siswa tersebut?","options":[{"key":"A","text":"2,0 buku."},{"key":"B","text":"2,5 buku."},{"key":"C","text":"3,0 buku."},{"key":"D","text":"3,5 buku."}],"answer":"C","explanation":"Langkah 1: Urutkan data dan hitung jumlah seluruh siswa (frekuensi total), yaitu 2 + 4 + 5 + 3 +\n2 = 16 siswa.\nLangkah 2: Karena jumlah data genap (𝑛= 16), median terletak di antara data ke-8 dan data ke-\n9.\nData ke-1 sampai ke-2 adalah 1. Data ke-3 sampai ke-6 adalah 2. Data ke-7 sampai ke-11\nadalah 3. Maka, data ke-8 dan data ke-9 adalah 3.\nMedian data adalah\n3+3\n2 = 3,0 buku.\nJawaban Benar: C"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Data penjualan lima jenis rasa es krim di sebuah kedai adalah sebagai berikut: rasa cokelat\nsebanyak 40 porsi, vanila sebanyak 30 porsi, stroberi sebanyak 20 porsi, durian sebanyak 15\nporsi, dan matcha sebanyak 15 porsi. Pemilik kedai ingin membuat diagram lingkaran dari data\ntersebut. Seorang karyawan menghitung sudut sektor untuk rasa cokelat sebesar 120∘ dan rasa\ndurian sebesar 45∘. Setelah mengevaluasi perhitungan tersebut, pernyataan yang benar adalah\n....","options":[{"key":"A","text":"perhitungan karyawan salah untuk kedua rasa es krim tersebut"},{"key":"B","text":"perhitungan karyawan benar untuk rasa cokelat namun salah untuk rasa durian"},{"key":"C","text":"perhitungan karyawan salah untuk rasa cokelat namun benar untuk rasa durian"},{"key":"D","text":"perhitungan karyawan benar untuk kedua rasa es krim tersebut"}],"answer":"D","explanation":"Langkah 1: Menghitung total seluruh porsi es krim yang terjual: 40 + 30 + 20 + 15 + 15 = 120\nporsi.\nLangkah 2: Menghitung sudut sektor untuk rasa cokelat:\n40\n120 × 360∘=\n1\n3 × 360∘= 120∘\n(perhitungan karyawan benar).\nLangkah 3: Menghitung sudut sektor untuk rasa durian:\n15\n120 × 360∘=\n1\n8 × 360∘= 45∘ (perhitungan\nkaryawan benar).\nLangkah 4: Menyimpulkan bahwa perhitungan karyawan untuk kedua rasa es krim tersebut\nadalah benar.\nJawaban Benar: D"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Dua sekolah, SMP Mulia dan SMP Bakti, menyajikan persentase pilihan transportasi siswa\nmereka menggunakan diagram lingkaran. Di SMP Mulia (total 400 siswa), persentase siswa yang\nberjalan kaki adalah 25%. Di SMP Bakti (total 600 siswa), persentase siswa yang berjalan kaki\nadalah 18%. Seorang pengamat mengklaim bahwa jumlah siswa yang berjalan kaki di SMP Mulia\nlebih banyak daripada di SMP Bakti karena persentasenya lebih besar. Evaluasi kebenaran klaim\ntersebut!","options":[{"key":"A","text":"Klaim salah karena jumlah siswa berjalan kaki di SMP Mulia adalah 100 siswa, sedangkan di  SMP Bakti adalah 108 siswa."},{"key":"B","text":"Klaim benar karena 25% dari populasi mana pun pasti selalu lebih banyak daripada 18% dari  populasi lainnya."},{"key":"C","text":"Klaim salah karena jumlah siswa berjalan kaki di SMP Mulia adalah 80 siswa, sedangkan di  SMP Bakti adalah 120 siswa."},{"key":"D","text":"Klaim benar karena selisih persentase sebesar 7% secara mutlak menggambarkan selisih  jumlah siswa yang signifikan."}],"answer":"A","explanation":"Langkah 1: Menghitung banyak siswa berjalan kaki di SMP Mulia = 25% × 400 = 100 siswa.\nLangkah 2: Menghitung banyak siswa berjalan kaki di SMP Bakti = 18% × 600 = 108 siswa.\nLangkah 3: Bandingkan jumlah riil: 100 < 108. Meskipun persentase SMP Mulia lebih besar,\njumlah siswa riil di SMP Bakti lebih banyak karena total populasi dasarnya lebih besar. Klaim\npengamat salah.\nJawaban Benar: A"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Pak Budi memiliki pendapatan bulanan sebesar Rp6.000.000,00 yang dialokasikan berdasarkan\ndiagram lingkaran sebagai berikut: makanan 40%, pendidikan 25%, transportasi 15%, dan\nsisanya untuk tabungan. Untuk mengantisipasi kebutuhan masa depan, Pak Budi berniat\nmemotong anggaran makanan sebesar 10% dari anggaran makanan semula dan dialihkan\nseluruhnya untuk menambah tabungan bulanan. Besar tabungan bulanan Pak Budi setelah\npenyesuaian tersebut adalah ....","options":[{"key":"A","text":"Rp1.240.000,00"},{"key":"B","text":"Rp1.320.000,00"},{"key":"C","text":"Rp1.440.000,00"},{"key":"D","text":"Rp1.560.000,00"}],"answer":"C","explanation":"Hitung persentase tabungan awal: 100% −(40% + 25% + 15%) = 20%. Nominal tabungan awal\n= 20% × 𝑅𝑝6.000.000,00 = 𝑅𝑝1.200.000,00.\nHitung anggaran makanan awal: 40% × 𝑅𝑝6.000.000,00 = 𝑅𝑝2.400.000,00.\nHitung potongan anggaran makanan sebesar 10%: 10% × 𝑅𝑝2.400.000,00 = 𝑅𝑝240.000,00.\nHitung tabungan baru setelah ditambahkan dengan potongan makanan: \\text{Rp}1.200.000,00 +\n\\text{Rp}240.000,00 = \\text{Rp}1.440.000,00$.\nJawaban Benar: C"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Ibu Rani, seorang wali kelas di salah satu SMP, bermaksud membuat media penyajian data grafis\nmengenai pembagian persentase profesi orang tua siswa di kelas bimbingannya yang terdiri atas\nkategori petani (40%), PNS (20%), pegawai swasta (30%), dan wiraswasta (10%). Ia sedang\nmempertimbangkan model visualisasi yang paling efektif agar informasi tersampaikan dengan\njelas. Tentukan benar atau salah untuk setiap pernyataan berikut mengenai kegunaan diagram\ntersebut!","statements":[{"text":"Diagram lingkaran merupakan pilihan visualisasi yang paling ideal untuk menyoroti proporsi dari tiap profesi terhadap total populasi wali murid.","answer":"Benar","explanation":"Tujuan dari penggunaan diagram lingkaran adalah memperlihatkan rasio persentase komponen secara proporsional dari satu data total tunggal (100%)."},{"text":"Diagram batang tidak boleh dipakai untuk visualisasi jenis data profesi ini disebabkan representasi angkanya berupa nilai persentase saja.","answer":"Salah","explanation":"Kesalahan konseptual; nilai persentase atau bagian rasio juga dapat dengan mudah dibandingkan kinerjanya menggunakan sumbu vertikal diagram batang."},{"text":"Apabila Ibu Rani bertujuan untuk melacak adanya tren naik-turun angka mata pencaharian orang tua dari tahun ke tahun, maka diagram garis adalah opsi paling optimal.","answer":"Benar","explanation":"Diagram garis memiliki keunggulan fungsional utama untuk menyajikan data kontinu untuk mengamati dinamika tren perkembangannya waktu demi waktu."},{"text":"Sajian tabel frekuensi sederhana merupakan visualisasi terbaik yang memberikan ilustrasi gambar bentuk geometris paling memikat pemirsa.","answer":"Salah","explanation":"Kesalahan memahami pengertian jenis representasi visual; tabel frekuensi menyajikan sekumpulan nilai nominal murni yang tidak menyertakan gambaran rupa geometris dekoratif seperti halnya grafik sirkuler maupun batang."}],"explanation":""},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Catatan posko donor darah memperlihatkan jumlah volume darah dari empat orang pendonor\nsukarela yaitu Donor P memperoleh 350 mL, Donor Q memperoleh 500 mL, Donor R\nmemperoleh 250 mL, dan Donor S memperoleh 450 mL. Beri tanda centang (✓) pada setiap\npernyataan yang benar berdasarkan data kuantitas tersebut!","statements":[{"text":"Volume darah yang dikumpulkan dari Donor Q adalah yang terbesar yaitu sebesar 500 mL.","answer":"Benar","explanation":"Berdasarkan nilai yang tercatat, Donor Q merupakan peraih angka tertinggi yaitu 500 mL."},{"text":"Volume darah terkecil diperoleh dari Donor R yang mendonasikan sebesar 250 mL.","answer":"Benar","explanation":"Dari seluruh pendonor, nilai 250 mL dari Donor R adalah angka terkecil."},{"text":"Volume darah Donor P tercatat sama banyak dengan jumlah darah yang didonasikan oleh Donor S.","answer":"Salah","explanation":"Volume darah Donor P adalah 350 mL sedangkan Donor S adalah 450 mL, maka tidak sama banyak."},{"text":"Urutan volume darah pendonor dari yang paling banyak ke paling sedikit adalah Donor P, Donor Q, Donor S, lalu Donor R.","answer":"Salah","explanation":"Urutan yang benar dari terbesar adalah Donor Q (500 mL), Donor S (450 mL), Donor P (350 mL), lalu Donor R (250 mL)."}],"explanation":""},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Dari penyelenggaraan pendaftaran kompetisi lari massal, panitia mengumpulkan rincian survei\nkebutuhan ukuran kaos seluruh atlet dengan hasil rincian sebagai berikut: ukuran S dipesan\nsebanyak 40 atlet, M sebanyak 80 atlet, L sebanyak 60 atlet, dan XL sebanyak 20 atlet. Beri\ntanda centang (✓) pada setiap pernyataan yang benar terkait sebaran data fisis logistik pakaian\natlet ini!","statements":[{"text":"Jumlah keseluruhan ketersediaan ukuran kaos yang dibutuhkan khusus untuk kelompok klasifikasi ukuran L tercatat sebanyak 60 kaos.","answer":"Benar","explanation":"Merujuk rincian kebutuhan atlet di lapangan, ukuran jenis L secara langsung bernilai sebesar 60 kaos."},{"text":"Jenis pemesanan ukuran sandang sandaran yang memiliki rekam capaian frekuensi tertinggi dalam pendataan atlet adalah L.","answer":"Salah","explanation":"Permintaan fisis baju tertinggi diraih oleh pemesan tipe ukuran baju M yaitu sebesar 80 pemesan."},{"text":"Golongan kategori atlet yang memesan jenis kaos spesifik tipe ukuran XL adalah kelompok ukuran yang paling minoritas sebesar 20 atlet.","answer":"Benar","explanation":"Data ukuran paling rendah adalah ukuran baju kaos tipe XL yang bernilai minimal senilai 20 kaos."},{"text":"Rancangan penggabungan nilai baju pesanan antara tipe jenis S dan kaos tipe L adalah bernilai sebesar 120 pakaian.","answer":"Salah","explanation":"Penjumlahan unit untuk tipe sandang jenis S digabung dengan L adalah sebesar 40 + 60 = 100 pakaian."}],"explanation":""},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Hasil penjualan panen buah dari kebun Pak Budi dalam seminggu adalah sebagai berikut: Apel\nsebanyak 40 kg, Jeruk sebanyak 50 kg, Mangga sebanyak 30 kg, dan Pisang sebanyak 80 kg.\nPak Budi ingin menyajikan data ini ke dalam bentuk diagram lingkaran untuk keperluan analisis\npasar harian. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Sektor untuk buah Pisang dalam diagram lingkaran adalah sebesar 144∘.","answer":"Benar","explanation":"Langkah 1: Menghitung total berat buah, yaitu 40 + 50 + 30 + 80 = 200 kg. Langkah 2: Menghitung besar sudut untuk buah Pisang, yaitu 80 200 × 360∘= 144∘."},{"text":"Sektor untuk buah Apel dalam diagram lingkaran adalah sebesar 72∘.","answer":"Benar","explanation":"Langkah 1: Menghitung total berat buah, yaitu 200 kg. Langkah 2: Menghitung besar sudut untuk buah Apel, yaitu 40 200 × 360∘= 72∘."},{"text":"Sektor untuk buah Mangga dalam diagram lingkaran adalah sebesar 90∘.","answer":"Salah","explanation":"Langkah 1: Menghitung total berat buah, yaitu 200 kg. Langkah 2: Menghitung besar sudut untuk buah Mangga, yaitu 30 200 × 360∘= 54∘, bukan 90∘."},{"text":"Persentase sektor buah Jeruk dalam diagram lingkaran tersebut adalah 25%.","answer":"Benar","explanation":"Langkah 1: Menghitung total berat buah, yaitu 200 kg. Langkah 2: Menghitung persentase buah Jeruk, yaitu 50 200 × 100% = 25%."}],"explanation":""},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Kasir warung kuliner tradisional mencatat hasil penjualan berbagai macam piring porsi sate yang\nlaku dalam sehari penuh sebagai berikut: sate ayam laku sebanyak 50 porsi, sate kambing\nsebanyak 30 porsi, dan sate sapi sebanyak 20 porsi. Beri tanda centang (✓) pada setiap\npernyataan yang benar mengenai struktur penyajian data tersebut!","statements":[{"text":"Persentase jumlah piring sate kambing yang terjual menyusun 35% dari seluruh porsi penjualan hari itu.","answer":"Salah","explanation":"Langkah 1: Menghitung total piring sate yang terjual dalam sehari yaitu 50 + 30 + 20 = 100 porsi. Langkah 2: Menghitung persentase sate kambing yaitu 30 100 × 100% = 30%, bukan 35%. Maka pernyataan salah."},{"text":"Besar sudut pusat sektor lingkaran yang mewakili penjualan menu piring sate sapi adalah sebesar 108∘.","answer":"Salah","explanation":"Langkah 1: Menghitung total porsi terjual yaitu 100 porsi. Langkah 2: Menghitung besar sudut pusat sektor sate sapi yaitu 20 100 × 360∘= 72∘, bukan 108∘. Maka pernyataan salah."},{"text":"Penjualan sate kambing jika digabung dengan sate sapi menyusun tepat setengah bagian dari keseluruhan sate laku terjual.","answer":"Benar","explanation":"Langkah 1: Menghitung akumulasi jumlah piring sate kambing dan sapi yaitu 30 + 20 = 50 porsi. Langkah 2: Membandingkan gabungan terhadap total (100 porsi) yaitu 50 100 = 1 2 bagian (setengah). Maka pernyataan benar."},{"text":"Sate ayam yang laku terjual dapat diwakilkan oleh bagian diagram lingkaran dengan sudut pusat sektor tepat 180∘.","answer":"Benar","explanation":"Langkah 1: Mengetahui berat proporsi sate ayam laku (50 porsi) dari total seluruhnya (100 porsi). Langkah 2: Mengalikan proporsi dengan lingkaran penuh 50 100 × 360∘= 180∘. Maka pernyataan benar."}],"explanation":""},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Dalam pameran buku sekolah, dicatat data pengunjung stan pustaka selama lima hari berturut-\nturut: Senin 45 orang, Selasa 60 orang, Rabu 55 orang, Kamis 40 orang, dan Jumat 50 orang.\nBeri tanda centang (✓) pada setiap pernyataan yang benar mengenai data jumlah pengunjung\nstan tersebut!","statements":[{"text":"Rata-rata pengunjung per hari adalah 45 orang selama masa pameran tersebut berlangsung.","answer":"Salah","explanation":"Langkah pertama adalah menghitung total jumlah seluruh pengunjung: 45 + 60 + 55 + 40 + 50 = 250 orang. Langkah kedua adalah menghitung rata-rata harian dengan membagi total tersebut terhadap durasi 5 hari: 250/5 = 50 orang. Nilai 45 didasarkan pada kekeliruan menunjuk nilai tengah atau median yang salah urutan. Maka, pernyataan ini salah."},{"text":"Selisih pengunjung antara hari paling ramai dan hari paling sepi di stan tersebut adalah 10 orang.","answer":"Salah","explanation":"Langkah pertama adalah mencari hari dengan pengunjung maksimal (Selasa: 60 orang) dan minimal (Kamis: 40 orang). Langkah kedua adalah menghitung nilai selisih absolut: 60 −40 = 20 orang. Angka 10 didapatkan karena miskonsepsi menghitung selisih bertahap hari sebelumnya secara sewenang-wenang. Maka, pernyataan ini salah."},{"text":"Median dari data jumlah pengunjung harian stan pustaka tersebut adalah 50 orang.","answer":"Benar","explanation":"Langkah pertama adalah menyortir data pengunjung harian dari yang terkecil hingga terbesar secara urut: 40,45,50,55,60. Langkah kedua adalah mencari nilai tengah pada barisan tersebut yang jatuh pada angka urutan ketiga, yaitu 50 orang. Maka, pernyataan ini benar."},{"text":"Jumlah pengunjung pada hari Selasa dan Kamis jika digabungkan bernilai dua kali lipat dari jumlah pengunjung pada hari Jumat.","answer":"Benar","explanation":"Langkah pertama adalah menjumlahkan jumlah pengunjung di hari Selasa (60) dan Kamis (40): 60 + 40 = 100 orang. Langkah kedua adalah menguji kelipatan nilai pengunjung hari Jumat (50): 2 × 50 = 100 orang. Karena nilainya persis sama, penggabungan tersebut bernilai tepat dua kali lipat. Maka, pernyataan ini benar."}],"explanation":""},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Untuk melaporkan kemajuan pendaftaran prestasi siswa tahunan, kepala sekolah merangkum\nrekam data total kelulusan berprestasi sebanyak 100 lulusan istimewa dalam rekam diagram\ngaris runtun durasi lima tahun: rekap Tahun 1 diduduki manis 12 orang pendaftar lulus, laju\npeningkatan di Tahun 2 menggamit sebanyak 18 lulusan, pencapaian Tahun 3 tercatat turun tipis\ndihuni oleh 15 siswa berprestasi, lonjakan performa Tahun 4 merekam tangguh sebanyak 24\norang anak, serta raihan kasta teratas rill Tahun 5 didominasi sebanyak 31 lulusan. Beri tanda\ncentang rujukan kualitatif untuk menetapkan status Benar atau Salah!","statements":[{"text":"Penggambaran tren diagram garis laju akselerasi kelulusan prestasi yang melonjak berkesinambungan berturut-turut tiada putus hanya dicitrakan visual saat garis melintas lurus sepanjang rute Tahun 3 menuju Tahun 4 dilanjutkan Tahun 4 menuju Tahun 5.","answer":"Benar","explanation":"Lintasan data melahirkan pergeseran kemajuan bernilai runtun positif berturut-turut pada dua terminal fase, yakni lonjakan laju transisi kurun dari Tahun 3 ke 4 (surplus melompat sebesar +9 orang) didampingi kurun kelanjutan transit rute Tahun 4 ke 5 (tambahan anyar melompat sebesar +7 orang). Periode selain rute di atas disela oleh pengerutan di lintasan asalnya Tahun 2 menuju 3, sehingga draf representasi terbukti sahih."},{"text":"Jika seluruh kepingan porsi ini dikorelasikan mengisolasikan diagram lingkaran utuh, dimensi busur juring rill pemandu perwakilan rasi kepunyaan lulusan berprestasi Tahun 2 merekam sudut sentral juring berukuran tepat 64, 8∘.","answer":"Benar","explanation":"Jumlah data riil untuk Tahun 2 didata 18 siswa dari total 100 prestasi terkumpul seluruhnya di arsip kelas sekolah. Mengalkulasi draf letak ukuran lebar sudut melingkar sektor data = 18 100 × 360∘= 64, 8∘. Teori penyusunan sudut presisi."},{"text":"Ukuran gap sela persentase di antara andalan performa porsi lulusan siswa berprestasi Tahun 4 dikurangi performa milik siswa Tahun 3 persis bertengger di rentang deviasi bulat bernilai 10%.","answer":"Salah","explanation":"Sumbangan representatif persentase andalan kelulusan siswa berprestasi Tahun 4 bernilai sebesar 24% dan Tahun 3 berkapasitas persis di angka 15%. Selisih tingkat margin performa di antara porsi panen = 24% −15% = 9%. Kesaksian nilai spekulatif 10% dideteksi menyimpang."},{"text":"Jika dipetakan selisihnya, sudut diagram lingkaran milik data lulusan berprestasi rill di Tahun 4 lebih lebar berukuran tepat 43, 2∘ ketimbang cakupan sudut yang diperoleh Tahun 1.","answer":"Benar","explanation":"Di Tahun 4 besar sudut rill melingkar sentralnya setara = 24 100 × 360∘= 86, 4∘, dan porsi kuantitatif kepunyaan kelulusan prestasi di Tahun 1 mendaulat wilayah sudut lingkaran = 12 100 × 360∘= 43, 2∘. Besaran visual jarak sela lebar antarpasar sektor busur = 86, 4∘−43, 2∘= 43, 2∘. Hasil dinilai sah terverifikasi tepat."}],"explanation":""},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Manajemen tim olahraga merekam data tinggi badan fisik untuk 8 orang atlet cadangan baru\ndalam satuan sentimeter, sebagai berikut: 165, 172, 168, 170, 165, 175, 180, dan 165. Sesuai\nkesepakatan jajaran staf pelatih, sebaran fisik tinggi badan cadangan tersebut akan\ndiklasifikasikan ke dalam diagram untuk keperluan seleksi performa regu kejuaraan daerah. Beri\ntanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Bagian persentase sekelompok atlet bertinggi minimum setinggi 172 sentimeter menduduki jatah luasan setengah bagian kuota seluruh cadangan.","answer":"Salah","explanation":"Kumpulan atlet dengan batas minimum tinggi badan 172 cm diwakili oleh yang memiliki ukuran (172, 175, dan 180) sentimeter, yaitu beranggotakan hanya sebanyak 3 orang atlet dari total kuota cadangan yang berisi 8 orang (yaitu setara 37.5%, di bawah target rasio setengah dari bagian seluruh data)."},{"text":"Tiang pilar grafik representatif bagi tinggi badan ukuran 165 sentimeter memiliki dimensi tergambar tertinggi dari yang lainnya pada penataan bentuk diagram batang.","answer":"Benar","explanation":"Variasi tinggi 165 cm berfrekuensi tertinggi sebanyak 3 kali kejadian harian di dalam diagram data batang fisik tersebut."},{"text":"Jika penyajian berupa bundaran dipasang, andil luasan pembagi kelompok cadangan baru bertinggi di bawah 172 sentimeter setara dengan porsi andil persentase 62,5%.","answer":"Benar","explanation":"Tinggi fisik kurang dari 172 cm dicatat oleh data-data (165, 168, dan 170) sentimeter, di mana ada 3 + 1 + 1 = 5 orang atlet cadangan baru dari populasi total, rasio bagian sebarannya adalah 5 8 × 100% = 62.5%."},{"text":"Derajat sudut luas juring yang terbentuk untuk kelompok pemegang fisik puncak tinggi setinggi 180 sentimeter bersudut miring senilai derajat 45∘.","answer":"Benar","explanation":"Populasi bernilai setinggi 180 cm berjumlah sebanyak 1 orang. Besaran nilai rincian busurnya bernilai derajat setara 1 8 × 360∘= 45∘."}],"explanation":""},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menggunakan, menyajikan, membuat, dan menginterpretasi \ndiagram batang dan diagram lingkaran serta melakukan estimasi \nberdasarkan data.","question":"Guru pustaka merekap jumlah kunjungan siswa selama hari kerja (Senin sampai Jumat). Rata-\nrata kunjungan per hari tercatat 45 orang, dengan rincian data Senin sebanyak 30 orang, Selasa\nsebanyak 55 orang, Rabu sebanyak 40 orang, dan Kamis sebanyak 50 orang. Sisa data\npengunjung di hari Jumat masih dihitung kembali untuk kelayakan pembuatan laporan grafis\ndiagram batang. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Kunjungan siswa perpustakaan yang terjadi pada akhir pekan pelayanan yaitu di hari Jumat adalah sebanyak 50 orang.","answer":"Benar","explanation":"Total seluruh kunjungan selama 5 hari = 45 × 5 = 225 orang. Sisa data kunjungan untuk hari Jumat = 225 −(30 + 55 + 40 + 50) = 225 −175 = 50 orang."},{"text":"Perbedaan kontras angka mutlak antara puncak tingkat kedatangan harian dengan batas terbawahnya adalah sebanyak 15 siswa.","answer":"Salah","explanation":"Hari kunjungan tertinggi adalah Selasa (55 siswa) dan terendah Senin (30 siswa). Selisihnya bernilai 55 −30 = 25 siswa, bukan 15 siswa."},{"text":"Modus nilai harian kedatangan tercatat sebesar 50 siswa harian, di mana nilai data ini muncul pada dua hari pelayanan yang terpisah.","answer":"Benar","explanation":"Hari Kamis (50) dan Jumat (50) memiliki nilai sama dan terbanyak frekuensinya dibandingkan hari lain, sehingga modusnya adalah 50 siswa harian."},{"text":"Data mengonfirmasi telah terjadi grafik laju peningkatan minat baca yang berproses naik tepat 20% dari hari Rabu ke hari Kamis.","answer":"Salah","explanation":"Nilai hari Rabu = 40 dan hari Kamis = 50. Persentase peningkatan nilai harian = 50−40 40 × 100% = 25%, bukan 20%."}],"explanation":""}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
