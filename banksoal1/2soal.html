<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Bilangan Rasional</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT BILANGAN RASIONAL</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Membandingkan bilangan rasional","question":"Berat sebuah mangga harum manis adalah 0,48 kg, sedangkan berat sebuah mangga manalagi\nadalah\n1\n2 kg. Manakah perbandingan berat kedua buah mangga yang benar?","options":[{"key":"A","text":"mangga harum manis lebih ringan karena 0,48 <\n1/2"},{"key":"B","text":"mangga harum manis lebih berat karena 0,48 >\n1/2"},{"key":"C","text":"mangga harum manis sama berat karena 0,48 =\n1/2"},{"key":"D","text":"mangga harum manis lebih berat karena 0,48 <\n1/2"}],"answer":"A","explanation":"Langkah 1: Ubah berat mangga manalagi ke bentuk desimal.\nMangga manalagi:\n1\n2 = 0,5 kg.\nMangga harum manis: 0,48 kg.\nLangkah 2: Bandingkan kedua berat.\nKarena 0,48 < 0,5, mangga harum manis lebih ringan daripada mangga manalagi."},{"number":2,"level":2,"type":"Pilihan Ganda","objective":"Membandingkan bilangan rasional","question":"Empat orang bersaudara mencatat sisa kuota internet mereka masing-masing dari paket awal\nyang sama. Sisa kuota Adi adalah\n7\n10 bagian, sisa kuota Beni adalah 0,68 bagian, sisa kuota Citra\nadalah 72% bagian, dan sisa kuota Dani adalah\n2\n3 bagian. Di antara keempat anak tersebut,\nsiapakah yang memiliki sisa kuota internet paling banyak?","options":[{"key":"A","text":"Adi"},{"key":"B","text":"Beni"},{"key":"C","text":"Citra"},{"key":"D","text":"Dani"}],"answer":"C","explanation":"Langkah 1: Konversikan sisa kuota setiap anak ke bentuk desimal untuk memudahkan\nperbandingan. Adi =\n7\n10 = 0,700. Beni = 0,680. Citra = 72% = 0,720. Dani =\n2\n3 ≈0,667.\nLangkah 2: Bandingkan keempat nilai desimal tersebut untuk mencari nilai terbesar. Karena\n0,720 > 0,700 > 0,680 > 0,667, maka sisa kuota paling banyak dimiliki oleh Citra (0,720 bagian)."},{"number":3,"level":3,"type":"Pilihan Ganda","objective":"Membandingkan bilangan rasional","question":"Dalam analisis baku mutu lingkungan, empat sumur resapan warga di sebuah desa di Bali diuji\nkandungan mikroplastiknya. Sumur K terdeteksi mengandung\n5\n14 bagian dari batas aman\nmaksimum, Sumur L mengandung 0,356 bagian, Sumur M mengandung 35,5% bagian, dan\nSumur N mengandung\n4\n11 bagian. Warga sepakat bahwa sumur yang kandungan cemarannya\nmelebihi 0,36 bagian batas aman harus dipasangi filter pemurnian karbon aktif. Sumur manakah\nyang memenuhi syarat wajib dipasangi filter karbon aktif tersebut?","options":[{"key":"A","text":"Sumur K"},{"key":"B","text":"Sumur L"},{"key":"C","text":"Sumur M"},{"key":"D","text":"Sumur N"}],"answer":"D","explanation":"Langkah 1: Konversikan proporsi kandungan mikroplastik setiap sumur ke bentuk desimal.\nSumur K:\n5\n14 ≈0,3571.\nSumur L: 0,356.\nSumur M: 35,5% = 0,355.\nSumur N:\n4\n11 ≈0,3636.\nLangkah 2: Periksa sumur manakah yang memiliki kandungan melebihi 0,36.\nKandungan Sumur K (0,3571 < 0,36), Sumur L (0,356 < 0,36), Sumur M (0,355 < 0,36).\nKandungan Sumur N (0,3636 > 0,36).\nSumur N adalah satu-satunya sumur yang melebihi batas 0,36 sehingga wajib dipasangi filter."},{"number":4,"level":1,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Dani dan Eko mengukur tinggi tanaman mereka masing-masing dalam satuan meter, di mana\ntinggi tanaman Dani adalah 0,75 meter dan tinggi tanaman Eko adalah\n4\n5 meter. Tentukan benar\natau salah untuk setiap pernyataan berikut!","statements":[{"text":"Tinggi tanaman Eko lebih besar dari tinggi tanaman Dani.","answer":"Benar","explanation":"Sebab\n4\n5 = 0,80 meter, dan 0,80 > 0,75 meter."},{"text":"Jika diubah ke desimal, tinggi tanaman Eko adalah 0,45 meter.","answer":"Salah","explanation":"Nilai desimal dari pecahan\n4\n5 adalah 0,80 bukan 0,45."},{"text":"Selisih tinggi tanaman mereka adalah 0,05 meter.","answer":"Benar","explanation":"Selisihnya diperoleh dari 0,80 −0,75 = 0,05 meter."},{"text":"Tanaman Dani lebih tinggi daripada tanaman Eko.","answer":"Salah","explanation":"Hal ini salah karena tanaman Dani (0,75 meter) lebih pendek dari tanaman Eko (0,80 meter)."}]},{"number":5,"level":2,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Laporan laboratorium nutrisi menyatakan porsi kandungan air dari beberapa sampel merek roti\ntawar, yaitu roti K dengan 24,5%, roti L dengan\n6\n25 bagian, roti M dengan 0,242 bagian, dan roti N\ndengan 23%. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Kandungan kadar air dari roti merek K adalah yang paling tinggi dibandingkan seluruh sampel\nroti lainnya.","answer":"Benar","explanation":"Ubah semua bentuk bagian ke nilai representasi desimal: roti K = 24,5% = 0,245, roti L =\n6\n25 =\n0,240, roti M = 0,242, dan roti N = 23% = 0,230. Dengan pembandingan 0,245 > 0,242 > 0,240 >\n0,230. Porsi air roti K adalah yang tertinggi."},{"text":"Kandungan air pada roti tawar merek L lebih sedikit dibandingkan kandungan air pada roti\nmerek N.","answer":"Salah","explanation":"Porsi roti L adalah sebesar 0,24 yang nilainya lebih banyak daripada porsi roti N sebesar 0,23."},{"text":"Sampel roti tawar merek M terbukti mengandung air yang lebih banyak dibandingkan roti\nmerek L.","answer":"Benar","explanation":"Merek roti M mengandung kadar 0,242 yang bernilai lebih besar jika dibandingkan merek L yang\nmemiliki porsi kadar sebesar 0,240."},{"text":"Kandungan air dalam roti tawar merek L bernilai lebih besar jika dibandingkan kandungan air\npada roti tawar merek K.","answer":"Salah","explanation":"Porsi air roti L adalah 0,24 yang secara matematis nilainya lebih kecil dibandingkan roti K (0,245)."}]},{"number":6,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Dua atlet renang amatir mencatatkan proporsi akurasi kemenangannya berdasarkan jumlah\nkompetisi dan konversi hasil menduduki podium satu dari sepuluh besar tanding tahunan daerah.\nDika menyelesaikan balapan renang menguntungkan dengan mematok indeks kemenangan\nbernilai 0,825 poin kemenangan, atlet Toni merengking laju medali murni sepadan\n41\n50 bagian\nkompetisinya, sedangkan Dani mematok performa sukses sebesar 83% pertempuran. Tentukan\nbenar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Atlet senior Toni mendapati taraf keterandalan tertinggi mencatatkan tingkat pengambil poin\nnomor satu dibandingkan catatan kepunyaan atlet renang Dika maupun rekor atlet Dani.","answer":"Salah","explanation":"Kompilasi rasio kesuksesan setelah dikonversi menjadi persentase adalah: Dika = 0,825 =\n82,5%; Toni =\n41\n50 = 82%; dan Dani = 83%. Persentase podium tertinggi disabet Dani, bukan Toni\nyang justru memiliki nilai perolehan terendah. Pernyataan ini salah."},{"text":"Tingkat efektivitas peraihan emas podium paling meyakinkan yang digoreskan atas nama Dani\nterbukti melompat unggul dibandingkan indeks performa berenang dari saku capaian atlet Dika.","answer":"Benar","explanation":"Performa podium dari atlet renang Dani senilai 83% yang apabila disandingkan nilainya memang\nmelompat lebih besar dari poin kemajuan kompetisi renang Dika (82,5%) karena 83% > 82,5%.\nPernyataan ini benar."},{"text":"Rasio raihan keandalan podium juara Dika menyerap persentase kontribusi seimbang setara\ndengan nilai 82,5%, capaian tersebut mendahului dari data kuota peraihan tanding oleh Toni.","answer":"Benar","explanation":"Peraihan angka podium asisten perenang Dika (82,5%) lebih berlimpah nilainya dibanding andil\nmedali kepunyaan renang dari kontribusi berenang atlet Toni yaitu 82%. Keberlakuan kalimat\ntersebut valid/benar."},{"text":"Berdasarkan rasio capaian dari data keseluruhan tanding renang itu, Dani sukses menduduki\nprestasi nomor satu terbaik dan Toni merupakan pemilik sisa catatan bagian tanding tersedikit di\npodium puncak.","answer":"Benar","explanation":"Catatan persentase emas podium urut dari peringkat atas diduduki berurutan oleh Dani (83%) >\nDika (82,5%) > Toni (82%). Jadi analisis pembagi pencetak kesuksesan terbukti runtut secara\ntepat, yang mengonfirmasi bahwa pernyataan bernilai benar."}]},{"number":7,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Dalam pelaksanaan kalibrasi periodik di sebuah SPBU, manajemen meneliti empat unit dispenser\npengisian bahan bakar berdasarkan persentase galat (penyimpangan alat). Dispenser A didapati\nmengalami galat 1/250 bagian takaran, Dispenser B menyimpang sebesar 0,35%, Dispenser C\nmenyimpang sebesar 0,0042 bagian, sedangkan Dispenser D mencatat galat sebanyak 3/800\nbagian takaran. Nilai galat paling dekat ke angka nol diklaim sebagai dispenser terakurat. Beri\ntanda centang (✓) pada setiap pernyataan yang benar mengenai analisis data galat bensin\ndispenser tersebut!","statements":[{"text":"Dispenser C menyajikan pencapaian dispenser dengan akurasi pengerjaan penakaran yang\npaling andal karena indeks angka kesalahannya adalah sebesar 0,0042.","answer":"Salah","explanation":"Menentukan akurasi tertinggi dicapai dari dispenser yang memiliki galat terkecil (mendekati nol).\nUrutan penyimpangan dikonversikan menjadi angka desimal: Dispenser A: 1/250 = 0,0040;\nDispenser B: 0,35% = 0,0035; Dispenser C: 0,0042; Dispenser D: 3/800 = 0,00375. Dengan\ndemikian, dispenser B (0,0035) paling akurat dan dispenser C (0,0042) adalah dispenser paling\nburuk ketepatannya."},{"text":"Dispenser B beroperasi paling presisi atau paling akurat karena berhasil meredam batas\ntingkat galat penakaran terendah senilai desimal 0,0035.","answer":"Benar","explanation":"Karena nilai galat desimal Dispenser B adalah 0,0035 bagian, yang mana bernilai paling rendah\ndi antara Dispenser A, C, dan D, maka unit Dispenser B menyajikan kualitas fungsional pengisian\nbahan bakar minyak terakurat."},{"text":"Urutan dispenser pengisian dari kualitas kerja paling kasar (galat terbesar) menuju kerja paling\npresisi (galat terkecil) adalah Dispenser C, Dispenser A, Dispenser D, lalu Dispenser B.","answer":"Benar","explanation":"Dari pemetaan desimal di langkah pertama: 0,00420 (Dispenser C) > 0,00400 (Dispenser A) >\n0,00375 (Dispenser D) > 0,00350 (Dispenser B). Urutan ini tertulis dengan benar."},{"text":"Rasio deviasi selisih kesalahan takaran di antara pengoperasian mesin Dispenser C dengan\nunit Dispenser A adalah bernilai tepat setara 0,0002 bagian takaran.","answer":"Benar","explanation":"Menghitung nilai selisih galat kedua stasiun takaran: Nilai Dispenser C sebesar 0,0042 bagian\ndikurangkan dengan nilai galat dispenser A senilai 0,0040 bagian, yang mana menyisakan hasil\npenyimpangan selisih bernilai 0,0002 bagian takaran."}]},{"number":8,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Seorang arsitek lanskap memeriksa akurasi deviasi ketinggian ubin taman terhadap bidang datar\npermukaan acuan netral 0,00 cm. Sudut A mencatat deviasi −0,42 cm, Sudut B sebesar −\n3\n8 cm,\nSudut C sebesar −35% cm, dan Sudut D sebesar −\n9\n20 cm. Kualitas pemasangan ubin terbaik\ndiputuskan jika memiliki simpangan mutlak (error) paling kecil. Tentukan benar atau salah untuk\nsetiap pernyataan berikut!","statements":[{"text":"Penyimpangan ketinggian di Sudut D secara nilai koordinat nyata di garis bilangan bernilai\nlebih besar daripada di Sudut A.","answer":"Salah","explanation":"Penyimpangan sudut D adalah −\n9\n20 = −0,45 dan Sudut A adalah −0,42. Secara koordinat\nnumerik, −0,45 < −0,42. Jadi D bernilai lebih kecil."},{"text":"Sudut C dinilai memiliki kualitas pengerjaan ubin terbaik karena tingkat simpangan mutlaknya\npaling dekat ke permukaan datar ideal.","answer":"Benar","explanation":"Sudut C memiliki simpangan mutlak | −35%| = 0,35 cm, di mana nilainya paling dekat dengan 0\ndibandingkan A (0,42), B (0,375), dan D (0,45)."},{"text":"Tingkat kesalahan penyimpangan pada Sudut B dinilai lebih baik (lebih presisi dekat rata-rata\ndatar) dibandingkan Sudut A.","answer":"Benar","explanation":"Penyimpangan absolut B = 0,375 cm dan A = 0,42 cm. Karena 0,375 < 0,42, maka sudut B lebih\nrata/presisi dibanding sudut A."},{"text":"Selisih penyimpangan ketinggian mutlak antara sudut yang paling presisi dengan yang paling\ntidak presisi adalah 0,1 cm.","answer":"Benar","explanation":"Paling presisi (C) dengan nilai mutlak deviasi 0,35 cm dan paling tidak presisi (D) dengan nilai\nmutlak deviasi 0,45 cm memiliki selisih 0,45 −0,35 = 0,1 cm. Pernyataan ini benar."}]},{"number":9,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Pengamatan meteorologi mengukur simpangan rata-rata harian perubahan suhu di pegunungan\ntropis terhadap deviasi nol netral. Empat kota mencatat suhu fluktuasi rata-rata: Kota Angin\nsebesar −\n7/50\n∘C, Kota Beras sebesar −0, 15∘C, Kota Cokelat sebesar −16%∘C, dan Kota Dingin\nsebesar −\n17/125\n∘C. Pengukuran kestabilan tinggi diakui jika memiliki besaran angka mutlak deviasi\nsuhu paling rendah. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Suhu riil yang tercatat di Kota Beras memiliki nilai angka koordinat temperatur yang lebih\nrendah dibanding temperatur Kota Cokelat.","answer":"Salah","explanation":"Konversi deviasi suhu: Kota Angin = −0, 14∘C, Kota Beras = −0, 15∘C, Kota Cokelat = −0, 16∘C,\nKota Dingin = −0, 136∘C. Karena −0,15 > −0,16, suhu riil Kota Beras bernilai koordinat lebih\ntinggi."},{"text":"Kota Dingin menunjukkan tingkat stabilitas iklim tertinggi dikarenakan simpangan deviasinya\nsecara nilai mutlak paling kecil dekat angka nol.","answer":"Benar","explanation":"Kota Dingin mempunyai simpangan absolut | −0,136| = 0, 136∘C. Nilai ini yang paling rendah\ndekat nol dibanding Angin (0,14), Beras (0,15), dan Cokelat (0,16)."},{"text":"Kota Angin memiliki temperatur fluktuatif yang dinilai lebih dekat stabil (presisi) dibandingkan\nKota Beras.","answer":"Benar","explanation":"Impuls kesalahan Kota Angin = 0, 14∘C, Kota Beras = 0, 15∘C. Lebih stabil Angin karena besaran\nmutlak kesalahannya lebih kecil."},{"text":"Kota Cokelat menduduki posisi fluktuasi paling tinggi (terlebar tingkat kesalahan\nsimpangannya) dibanding tiga kota pengamatan lainnya.","answer":"Benar","explanation":"Dengan tingkat simpangan sebesar −16% = −0,16, kesalahan penyimpangan mutlak Kota\nCokelat adalah 0, 16∘C, yaitu tingkat kerenggangan deviasi terlebar/tertinggi."}]},{"number":10,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Sebuah badan pengawas obat dan makanan menguji proporsi kandungan gula dari volume\nkemasan empat merek minuman teh botol yang setara: kemasan merek W memiliki kadar gula\n12,5%, merek X sebesar\n1\n8 bagian, merek Y sebesar 0,13 bagian, dan merek Z sebesar\n3\n25 bagian.\nBeri tanda centang (✓) pada setiap pernyataan yang benar berdasarkan proporsi kandungan gula\npada minuman-minuman tersebut!","statements":[{"text":"Minuman merek W dan merek X memiliki proporsi kandungan gula yang sama besar yaitu\nsebesar 0,125 bagian.","answer":"Benar","explanation":"Langkah 1: Konversi persentase gula merek W ke desimal: 12,5% = 0,125. Langkah 2: Konversi\nbagian gula merek X ke desimal:\n1\n8 = 0,125. Langkah 3: Membandingkan kedua hasil desimal dan\nmendapati keduanya sama-sama bernilai 0,125, sehingga pernyataan benar."},{"text":"Merek Z merupakan produk minuman teh dengan kandungan gula tertinggi di antara keempat\nmerek.","answer":"Salah","explanation":"Langkah 1: Menghitung seluruh kadar dalam desimal: W = 0,125, X = 0,125, Y = 0,130, Z =\n3\n25 =\n0,120. Langkah 2: Menganalisis kadar tertinggi yaitu Y (0,130). Merek Z memiliki kandungan gula\nterendah (0,120), sehingga pernyataan salah."},{"text":"Kandungan gula merek Y lebih besar daripada kandungan gula merek Z.","answer":"Benar","explanation":"Langkah 1: Menggunakan kadar desimal merek Y = 0,130. Langkah 2: Menggunakan kadar\ndesimal merek Z = 0,120. Langkah 3: Menghitung relasi: 0,130 > 0,120 menunjukkan kandungan\ngula merek Y lebih tinggi daripada merek Z, sehingga pernyataan benar."},{"text":"Jika diurutkan dari produk yang paling rendah kandungan gulanya, urutan yang benar adalah\nmerek Z, disusul merek W, merek X, lalu merek Y.","answer":"Benar","explanation":"Langkah 1: Susun proporsi dari yang paling kecil: 0,120 (Z), 0,125 (W), 0,125 (X), 0,130 (Y).\nKarena W dan X setara, penempatan keduanya berturut-turut di posisi tengah adalah sahih\nsecara matematis. Langkah 2: Menerjemahkan urutan ke merek: Z, W, X, Y. Jadi pernyataan\nbenar."}]},{"number":11,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Empat produk zat aditif bahan bakar diuji untuk membandingkan tingkat keiritan bensin pada jenis\nkendaraan yang seragam. Zat aditif P mengurangi konsumsi bahan bakar sebesar 0,085 bagian,\nzat aditif Q mengurangi sebesar\n1\n12 bagian, zat aditif R mengurangi sebesar 8,2%, dan zat aditif S\nmengurangi sebesar\n2\n25 bagian. Beri tanda centang (✓) pada setiap pernyataan yang benar\nmengenai tingkat keefektifan penghematan bahan bakar oleh produk aditif tersebut!","statements":[{"text":"Zat aditif P memiliki kemampuan menghemat bahan bakar paling efektif karena persentasenya\npaling tinggi dibanding aditif lain.","answer":"Benar","explanation":"Langkah 1: Tentukan nilai pengurangan seluruh aditif ke bentuk desimal. P = 0,085; Q =\n1\n12 ≈\n0,083; R = 8,2% = 0,082; S =\n2\n25 = 0,080. Langkah 2: Mencari penghematan terbaik yang paling\ntinggi. Hasil pembandingan adalah P (0,085) menempati angka terbesar, jadi pernyataan benar."},{"text":"Nilai penghematan dari zat aditif Q lebih kecil dibanding nilai penghematan yang dicapai oleh\nzat aditif R.","answer":"Salah","explanation":"Langkah 1: Peroleh nilai aditif Q = 0,083. Langkah 2: Peroleh nilai aditif R = 0,082. Langkah 3:\nRelasi bilangan desimal menunjukkan 0,083 > 0,082 sehingga kemampuan menghemat Q lebih\nbesar daripada R. Pernyataan salah."},{"text":"Tingkat efisiensi dari penggunaan zat aditif S merupakan yang paling rendah di antara\nsemuanya yaitu senilai 8%.","answer":"Benar","explanation":"Langkah 1: Ubah rasio efisiensi S ke desimal:\n2\n25 = 0,080 atau sama dengan 8%. Langkah 2:\nKarena nilai 0,080 merupakan nilai terkecil pada sebaran kelompok uji {0,085; 0,083; 0,082; 0,080},\nperforma aditif S adalah yang terendah. Pernyataan benar."},{"text":"Zat aditif R menghasilkan tingkat keiritan bensin yang lebih besar dari zat aditif P.","answer":"Salah","explanation":"Langkah 1: Konversikan data keiritan R ke bentuk desimal: 8,2% = 0,082. Langkah 2:\nBandingkan terhadap data keiritan P: 0,085. Langkah 3: Evaluasi relasi: 0,082 < 0,085,\nmenunjukkan bahwa R menghasilkan efisiensi keiritan bensin lebih kecil dibanding P. Pernyataan\nsalah."}]},{"number":12,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Empat swalayan besar mencatatkan rasio penjualan pasokan apel merah impor mereka selama\nliburan akhir pekan: Swalayan Segar menjual\n7\n9 bagian pasokan, Swalayan Sehat menjual 0,75\nbagian, Swalayan Prima menjual 78% bagian, dan Swalayan Utama menjual\n19\n25 bagian. Beri\ntanda centang (✓) pada setiap pernyataan yang benar mengenai analisis data penjualan apel dari\nswalayan tersebut!","statements":[{"text":"Swalayan Prima mencatat penjualan bagian apel merah impor paling tinggi di antara semua\ntoko tersebut.","answer":"Benar","explanation":"Langkah 1: Konversi bagian penjualan ke bilangan desimal 4 angka dibelakang koma: Segar =\n7\n9 ≈0,7778; Sehat = 0,7500; Prima = 78% = 0,7800; Utama =\n19\n25 = 0,7600. Langkah 2: Nilai\nmaksimum adalah Prima (0,7800) dibandingkan terhadap yang lain. Pernyataan ini sesuai\nanalisis hitung sehingga benar."},{"text":"Volume penjualan buah di Swalayan Segar lebih banyak bila dibandingkan dengan hasil\npenjualan di Swalayan Utama.","answer":"Benar","explanation":"Langkah 1: Peroleh nilai penjualan Segar = 0,7778 bagian. Langkah 2: Peroleh nilai penjualan\nUtama = 0,7600 bagian. Langkah 3: Hubungan bilangan memperlihatkan 0,7778 > 0,7600. Oleh\nsebab itu, volume penjualan Swalayan Segar di atas Swalayan Utama, sehingga pernyataan\nbenar."},{"text":"Swalayan Sehat merupakan toko yang berhasil menjual pasokannya lebih banyak dibanding\npenjualan Swalayan Utama.","answer":"Salah","explanation":"Langkah 1: Gunakan data pencapaian desimal Swalayan Sehat = 0,7500. Langkah 2: Gunakan\ndata pencapaian desimal Swalayan Utama = 0,7600. Langkah 3: Memperbandingkan desimal:\n0,7500 < 0,7600, menyatakan bahwa Sehat menjual bagian pasokan yang lebih sedikit dibanding\nUtama. Jadi pernyataan salah."},{"text":"Swalayan Sehat memiliki rasio pencapaian target penjualan paling rendah dari keempat\nswalayan.","answer":"Benar","explanation":"Langkah 1: Analisis data set nilai pencapaian swalayan: Segar=0,7778; Sehat=0,7500;\nPrima=0,7800; Utama=0,7600. Langkah 2: Pilih yang memiliki tingkat keberhasilan minimal.\nSesuai data, angka minimal ditempati Sehat (0,7500). Pernyataan benar."}]},{"number":13,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Budi dan Clara mendapatkan uang saku harian masing-masing sebesar Rp200.000,00 dan\nRp250.000,00. Untuk kebutuhan mereka, Budi membelanjakan uang jajannya sebanyak\n3/10\nbagian untuk membeli sepiring makan siang serta menghabiskan sebesar 0,25 bagian untuk\nkebutuhan sarana kelengkapan buku, sementara Clara menghabiskan sebesar 40% dari seluruh\ndana jajan awalnya untuk asupan santap siang dan mendonasikan uang jajan sebesar\n1\n5 bagian\nuntuk memenuhi perlengkapan belajarnya. Tentukan benar atau salah proporsi penggunaan jatah\nanggaran keuangan tersebut!","statements":[{"text":"Budi mempunyai proporsi atau porsi bagian sisa tabungan harian uang saku mula-mula yang\nbernilai lebih besar ketimbang milik Clara.","answer":"Benar","explanation":"Langkah 1: Hitung sisa simpanan Budi: belanjanya\n3\n10 (makan) dan 0,25 (perkakas) setara total:\n30% + 25% = 55%, sehingga simpanannya 45% = 0,45 bagian. Sisa Clara: belanjanya 40%\n(makan) +\n1\n5 = 20%, total belanja = 60%, menyisakan 40% = 0,40 bagian dari mulanya. Langkah\n\n2: Bandingkan laju sisa uang jajannya, karena Budi (45%24) > Clara (40%), terbukti Budi\nmemelihara rasio sisa dana lebih besar. Pernyataan ini benar."},{"text":"Akumulasi nilai kuantitatif sisa total uang saku milik Clara dilaporkan memiliki nominal akhir\nsenilai Rp120.000,00.","answer":"Salah","explanation":"Langkah 1: Anggaran Clara semula adalah Rp250.000,00 dengan rasio bagian sisa yaitu 1 −\n(0,40 + 0,20) = 40% = 0,40. Langkah 2: Hitung nilainya: 0,40 × 𝑅𝑝250.000,00 = 𝑅𝑝100.000,00,\nbukan Rp120.000,00. Pernyataan ini salah."},{"text":"Jika dibandingkan pengeluaran biaya asupan, Clara membayar ongkos santap porsi makan\nsiang yang nominalnya Rp40.000,00 lebih mahal dari yang dibayarkan Budi.","answer":"Benar","explanation":"Langkah 1: Total makan siang Budi:\n3\n10 × 𝑅𝑝200.000,00 = 𝑅𝑝60.000,00. Makan siang Clara:\n40% × 𝑅𝑝250.000,00 = 𝑅𝑝100.000,00. Langkah 2: Ambil perbedaan selisih pengeluarannya:\n𝑅𝑝100.000,00 −𝑅𝑝60.000,00 = 𝑅𝑝40.000,00 lebih besar dibayarkan Clara. Pernyataan ini benar."},{"text":"Persentase simpanan nominal yang dihemat Clara setara bentuk rasio pecahan paling\nsederhananya adalah bernilai sebesar\n9/20.","answer":"Salah","explanation":"Langkah 1: Portion sisa Clara tercatat sebesar 40%. Langkah 2: Nyatakan bentuk rasio porsi\npecahan murni terkecil: 40% =\n40\n100 =\n2\n5, yang bertentangan dengan rasio tertulis sebesar\n9\n20.\nPernyataan ini salah."}]},{"number":14,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Ibu Rita berniat membeli terigu curah untuk usahanya. Empat agen grosir terigu menawarkan\nproduknya dalam pecahan kemasan dan harga satuan sebagai berikut: Toko Alur menawarkan\n3/4\nkg dengan harga Rp9.600,00, Toko Baru menjual kemasan 0,8 kg seharga Rp10.000,00, Toko\nCeria menawarkan kemasan 0,5 kg seharga Rp6.500,00, dan Toko Damai menawarkan kemasan\n3\n5 kg seharga Rp7.500,00. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan\ndengan kehematan harga terigu tersebut!","statements":[{"text":"Terigu di Toko Alur memiliki harga per kg paling murah dibandingkan seluruh toko lainnya.","answer":"Salah","explanation":"Konversi harga per kg: Alur = 𝑅𝑝9.600,00/0,75 = 𝑅𝑝12.800,00; Baru = 𝑅𝑝10.000,00/0,8 =\n𝑅𝑝12.500,00; Ceria = 𝑅𝑝6.500,00/0,5 = 𝑅𝑝13.000,00; Damai = 𝑅𝑝7.500,00/0,6 = 𝑅𝑝12.500,00.\nYang paling murah adalah Baru dan Damai."},{"text":"Harga per kilogram terigu di Toko Baru bernilai persis sama murahnya dengan di Toko Damai.","answer":"Benar","explanation":"Sesuai dengan hasil hitungan rasional, harga per kg di Toko Baru adalah Rp12.500,00 dan di\nToko Damai juga Rp12.500,00."},{"text":"Terigu di Toko Ceria memiliki harga per kilogram paling mahal dibanding toko-toko lainnya.","answer":"Benar","explanation":"Rasio harga per kg di Toko Ceria adalah yang tertinggi yaitu Rp13.000,00 per kilogram."},{"text":"Membeli 2,4 kg terigu di Toko Damai membutuhkan total biaya yang lebih mahal dibandingkan\nmembeli jumlah yang sama di Toko Alur.","answer":"Salah","explanation":"Damai adalah Rp12.500,00/kg dan Alur adalah Rp12.800,00/kg. Maka untuk jumlah yang sama\n(2,4 kg), harga di Damai lebih murah (Rp30.000,00) dibandingkan di Alur (Rp30.720,00)."}]},{"number":15,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Petugas kontrol kualitas memantau perbandingan bagian porsi berat buah jeruk, apel, pir, dan\nmangga yang busuk di dalam beberapa peti kemas persediaan sebelum didistribusikan ke\njaringan minimarket modern. Pemeriksaan mendata rasio sediaan sebagai berikut. Wadah Peti\nKemas Apel mengangkut seberat 3.2 kg buah hancur tak layak konsumsi dari total timbunan awal\nberbobot 40 kg apel. Sisa timbunan sediaan busuk pada Peti Kemas Mangga menunjukkan\nbagian rusak bernilai konstan setara pecahan\n7\n100 bagian dari total buahnya. Sediaan pada isi\nwadah Peti Kemas Jeruk melaporkan berat kerusakan komponen setara angka proporsi sediaan\nnilai senilai 0.075. Sementara, porsi buah rusak yang berdiam pada tumpukan produk buah di\ndalam wadah Peti Kemas Pir mendata rekor buah hancur di persentase senilai 6.5%. Tentukan\nkebenaran dari masing-masing pernyataan berikut!","statements":[{"text":"Isi kemasan Peti Kemas Apel menyumbangkan persentase tingkat porsi kerusakan/buah busuk\ntertinggi jika ditarungkan persentase busuk buah di keempat kemasan peti yang diuji oleh\npetugas.","answer":"Benar","explanation":"Langkah pertama: carilah kadar desimal pembusukan di wadah produk peti Apel yaitu porsi\nseberat 3.2 ÷ 40 = 0.08. Langkah kedua: temukan performa dari keranjang produk sekelilingnya\nyang ditakar pembagian: peti Mangga (\n7\n100 = 0.07), peti Jeruk (0.075), dan peti Pir (6.5% = 0.065).\nLangkah ketiga: adakan pengujian banding terhadap keseluruhan indeks tersebut: didapat\nruntutan pembusukan mangkok buah murni 0.08 > 0.075 > 0.07 > 0.065. Dari temuan angka\npembanding di atas dipastikan peti kemas buah Apel adalah wadah tersubur pertumbuhan busuk\nbuah (tertinggi). Pernyataan BENAR."},{"text":"Struktur isi kemas dalam muatan Peti Kemas Pir berada di jaminan posisi kondisi kualitas\nkomparasi paling aman (terbaik) dikarenakan mendaftarkan tingkat kerusakan pembusukan buah\nyang paling sedikit.","answer":"Benar","explanation":"Langkah pertama: identifikasi data desimal rasio sisa bagian membusuk milik komoditas andalan\nPir, didapat angka sebanding porsi berat senilai 6.5% = 0.065. Langkah kedua: letakkan sejajar\ndengan representasi nominal kebusukan produk pendampingnya yang bernilai sebesar: peti\nmangga (0.070), jeruk (0.075), dan apel (0.080). Langkah ketiga: perhatikan susunannya di mana\ndiperoleh level 0.065 < 0.070 < 0.075 < 0.080. Angka muatan data paling sedikit dari nilai\nkecatatan/kebusukan dipangku oleh Pir sehingga mutlak kualifikasinya merupakan wadah paling\naman terhindar pembusukan terbanyak. Pernyataan BENAR."},{"text":"Kerusakan produk andalan pada tumpukan Peti Kemas Mangga berpotensi menghasilkan\npresentasi pembusukan dengan kadar kerusakan buah melompat lebih besar saat diukur dengan\nmuatan dalam Peti Kemas Jeruk.","answer":"Salah","explanation":"Langkah pertama: carilah kandungan laju rasio pembusukan dari mangga di petinya yaitu bernilai\nsenilai sebesar 7% (or 0.07). Langkah kedua: temukan laju rasio porsi tandingannya berupa\nmuatan persentase pada sediaan isi komoditas buah di wadah Peti Kemas Jeruk yang memuat\ndata 0.075 = 7.5%. Langkah ketiga: selidiki keselarasan hubungan matematika, di mana\ndiperoleh relasi 0.07 < 0.075. Didapatkan tingkat kerusakan Mangga lebih kecil dari persentase\nbuah rusak Jeruk. Maka klaim pada butir di atas SALAH."},{"text":"Besaran jurang kerenggangan perbedaan margin nilai persentase pembusukan buah terburuk\nterhadap tingkat kebusukan yang paling kecil dari total sampel terpilih menyentuh porsi beda\nsenilai persis di beda 1.5%.","answer":"Benar","explanation":"Langkah pertama: kumpulkan nilai puncak kerusakan tingkat pembusukan di tumpukan peti di\natas yaitu terletak di produk peti Apel yang bernilai desimal 0.08 yang dikonversi ke persen:\n0.08 × 100% = 8%. Langkah kedua: temukan tandingan nilai paling mulus terendah kadar\nbusuknya, didapat letak bobot tumpukan peti Pir senilai persen di data ukuran terkecil yaitu 6.5%.\nLangkah ketiga: selesaikan pengoperasian matematika berupa selisih tingkat buah hancur\ntertinggi terhadap paling minimal, diperoleh hasil: 8% −6.5% = 1.5%. Dengan demikian nilai\nmargin rujukan selisih ini sesuai dengan hitungan asli. Pernyataan BENAR."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Membandingkan bilangan rasional","question":"Kepala kantor melakukan evaluasi kecepatan penyelesaian dokumen oleh empat stafnya dalam\nsatu jam dari total target yang sama, dengan hasil sebagai berikut: Dini menyelesaikan\n4\n7 bagian\ndokumen, Eka menyelesaikan 0,55 bagian, Fira menyelesaikan 58%, dan Gita menyelesaikan\n3/5\nbagian dokumen. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai kinerja\npenyelesaian dokumen para staf tersebut!","statements":[{"text":"Gita merupakan staf yang menyelesaikan pekerjaannya paling banyak di antara semua staf\ntersebut.","answer":"Benar","explanation":"Langkah 1: Mengubah semua pencapaian staf ke desimal tiga angka di belakang koma agar\nsetara. Dini =\n4\n7 ≈0,571; Eka = 0,550; Fira = 58% = 0,580; Gita =\n3\n5 = 0,600. Langkah 2:\nMembandingkan nilainya: Gita (0,600) adalah yang terbesar dibanding 0,580, 0,571, dan 0,550.\nJadi pernyataan benar."},{"text":"Bagian pekerjaan yang diselesaikan Fira lebih banyak dibandingkan bagian dokumen yang\ndiselesaikan oleh Dini.","answer":"Benar","explanation":"Langkah 1: Mengetahui bahwa penyelesaian Fira adalah 0,580 bagian. Langkah 2: Mengetahui\npenyelesaian Dini adalah\n4\n7 ≈0,571 bagian. Langkah 3: Membandingkan keduanya: 0,580 >\n0,571, yang berarti bagian dokumen milik Fira lebih besar, sehingga pernyataan benar."},{"text":"Eka memiliki kinerja yang lebih cepat dalam menyelesaikan pekerjaannya daripada Dini.","answer":"Salah","explanation":"Langkah 1: Ambil data nilai desimal Eka = 0,550. Langkah 2: Ambil data nilai desimal Dini =\n4\n7 ≈\n0,571. Langkah 3: Bandingkan kinerja: 0,550 < 0,571. Berhubung bagian penyelesaian Eka lebih\nrendah, kinerjanya lebih lambat dari Dini, sehingga pernyataan salah."},{"text":"Urutan staf dari yang paling sedikit menyelesaikan dokumen hingga yang paling banyak adalah\nEka, Dini, Fira, dan Gita.","answer":"Benar","explanation":"Langkah 1: Kumpulkan desimal penyelesaian terkecil hingga terbesar: 0,550 (Eka) < 0,571 (Dini)\n< 0,580 (Fira) < 0,600 (Gita). Langkah 2: Menyusun urutan nama yaitu Eka, Dini, Fira, kemudian\nGita. Penyusunan ini terbukti tepat, sehingga pernyataan benar."}]},{"number":17,"level":1,"type":"Pilihan Ganda","objective":"Menentukan operasi hitung (penjumlahan, pengurangan,\nperkalian, dan pembagian), menaksir, dan melakukan estimasi\nbilangan rasional serta menyelesaikan permasalahan kontekstual\nyang terkait.","question":"Ibu memerlukan\n3\n4 kg tepung untuk membuat satu loyang kue bolu. Jika Ibu ingin membuat 8\nloyang kue bolu yang sama, berapa kilogram tepung yang dibutuhkan Ibu?","options":[{"key":"A","text":"4 kg."},{"key":"B","text":"6 kg."},{"key":"C","text":"8 kg."},{"key":"D","text":"12 kg."}],"answer":"B","explanation":"Untuk menentukan total berat tepung yang dibutuhkan, kita dapat mengalikan jumlah loyang kue\ndengan kebutuhan tepung per loyang.\nTotal tepung = 8 ×\n3/4\nTotal tepung =\n24\n4 = 6 kg."},{"number":18,"level":2,"type":"Pilihan Ganda","objective":"Menentukan operasi hitung (penjumlahan, pengurangan,\nperkalian, dan pembagian), menaksir, dan melakukan estimasi\nbilangan rasional serta menyelesaikan permasalahan kontekstual\nyang terkait.","question":"Pak Joko memiliki sebatang bambu sepanjang 4\n1\n2 meter. Ia memotong bambu tersebut\nsepanjang 1,25 meter untuk tiang bendera dan 2\n1\n5 meter untuk kerangka layang-layang. Sisa\npanjang bambu yang dimiliki Pak Joko adalah ....","options":[{"key":"A","text":"1,05 meter"},{"key":"B","text":"1,15 meter"},{"key":"C","text":"2,05 meter"},{"key":"D","text":"2,15 meter"}],"answer":"A","explanation":"Langkah 1: Mengubah semua pecahan ke bentuk desimal. 4\n1\n2 = 4,5 meter dan 2\n1\n5 = 2,2 meter.\nLangkah 2: Menghitung total panjang bambu yang digunakan: 1,25 meter (tiang bendera) + 2,2\nmeter (layang-layang) = 3,45 meter.\nLangkah 3: Menghitung sisa panjang bambu dengan mengurangkan panjang awal dengan total\nyang digunakan: 4,5 −3,45 = 1,05 meter."},{"number":19,"level":3,"type":"Pilihan Ganda","objective":"Menentukan operasi hitung (penjumlahan, pengurangan,\nperkalian, dan pembagian), menaksir, dan melakukan estimasi\nbilangan rasional serta menyelesaikan permasalahan kontekstual\nyang terkait.","question":"Adi, Budi, dan Candra berolahraga lari bersama dalam waktu 30 menit. Adi berhasil menempuh\njarak 4 km. Jarak yang ditempuh Budi adalah 1\n1\n4 kali dari jarak yang ditempuh Adi. Sementara itu,\nCandra berhasil menempuh jarak sebesar 0,8 kali dari jarak yang ditempuh Budi. Berapakah total\njarak perjalanan yang berhasil ditempuh oleh ketiga anak tersebut?","options":[{"key":"A","text":"9 km"},{"key":"B","text":"10 km"},{"key":"C","text":"13 km"},{"key":"D","text":"14 km"}],"answer":"C","explanation":"Langkah 1: Identifikasi jarak tempuh Adi, yaitu 4 km.\nLangkah 2: Hitung jarak yang ditempuh oleh Budi. Jarak Budi = 1\n1\n4 × 4 𝑘𝑚= 1,25 × 4 = 5 km.\nLangkah 3: Hitung jarak yang ditempuh oleh Candra berdasarkan hasil jarak Budi. Jarak Candra\n= 0,8 × 5 𝑘𝑚= 4 km.\nLangkah 4: Jumlahkan jarak yang ditempuh oleh ketiga anak tersebut untuk mendapatkan total\njarak keseluruhan. Total jarak = 4 + 5 + 4 = 13 km."},{"number":20,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan operasi hitung (penjumlahan, pengurangan,\nperkalian, dan pembagian), menaksir, dan melakukan estimasi\nbilangan rasional serta menyelesaikan permasalahan kontekstual\nyang terkait.","question":"Pak Joko menanam bibit cabai pada sebidang tanah, di mana bagian depan seluas 0,35 bagian\ntanah digunakan untuk menanam cabai merah, dan\n2\n5 bagian digunakan untuk menanam cabai\nrawit. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Bagian tanah yang ditanami cabai merah nilainya setara dengan persentase 35%.","answer":"Benar","explanation":"Bagian cabai merah jika dinyatakan dalam bentuk persentase adalah 0,35 × 100% = 35%."},{"text":"Bagian tanah yang ditanami cabai rawit nilainya setara dengan persentase 40%.","answer":"Benar","explanation":"Pecahan\n2\n5 dapat diubah ke desimal menjadi 0,4 atau 40% jika diubah ke bentuk persentase."},{"text":"Luas tanah cabai merah lebih besar daripada luas tanah cabai rawit.","answer":"Salah","explanation":"Luas cabai merah adalah 35%, sedangkan cabai rawit adalah 40%. Berarti cabai merah lebih\nkecil dibanding cabai rawit."},{"text":"Jumlah gabungan bagian kedua tanaman cabai tersebut di kebun Pak Joko adalah 0,75 bagian\ndari seluruh tanah.","answer":"Benar","explanation":"Gabungan kedua bagian tersebut bernilai 0,35 + 0,4 = 0,75 bagian dari keseluruhan luas tanah."}]},{"number":21,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan operasi hitung (penjumlahan, pengurangan,\nperkalian, dan pembagian), menaksir, dan melakukan estimasi\nbilangan rasional serta menyelesaikan permasalahan kontekstual\nyang terkait.","question":"Sebuah petunjuk resep menyatakan bahan pembuat satu loyang kue kering membutuhkan\ntepung terigu sebanyak\n3\n4 kg, gula murni sebesar 0,4 kg, serta kandungan margarin lemak padat\nseberat 150 gram atau 0,15 kg. Seseorang ingin menggunakan instruksi resep tersebut untuk\nmembuat adonan sebanyak 5 loyang kue secara bersamaan. Beri tanda centang pada setiap\npernyataan yang benar!","statements":[{"text":"Kebutuhan total bahan dasar tepung terigu bagi semua pembuatan adonan tersebut adalah\nsebanyak 3,25 kg.","answer":"Salah","explanation":"Menghitung kebutuhan bahan dasar terigu untuk seluruh pembuatan 5 adonan loyang yaitu\n5 ×\n3\n4 = 5 × 0,75 = 3,75 kg."},{"text":"Jumlah seluruh takaran bahan gula murni yang harus disiapkan untuk kelima adonan kue\ntersebut adalah tepat 2 kg.","answer":"Benar","explanation":"Kandungan takaran berat total bahan pemanis gula yang diperlukan untuk pembuatan seluruh\nloyang adalah 5 × 0,4 = 2 kg."},{"text":"Kebutuhan total takaran lemak margarin murni bagi keseluruhan pembuatan kue kering adalah\nsebesar 0,75 kg.","answer":"Benar","explanation":"Total seluruh kebutuhan lemak padat mentega margarin murni untuk loyang adalah 5 × 0,15 =\n0,75 kg."},{"text":"Bobot massa kotor gabungan dari ketiga jenis bahan pembuatan adonan seluruh kue tersebut\nmencapai tepat sebesar 6,5 kg.","answer":"Benar","explanation":"Kapasitas total penggabungan semua bahan baku masakan bagi 5 adonan kue tersebut adalah\nsebesar 3,75 + 2 + 0,75 = 6,5 kg."}]},{"number":22,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan operasi hitung (penjumlahan, pengurangan,\nperkalian, dan pembagian), menaksir, dan melakukan estimasi\nbilangan rasional serta menyelesaikan permasalahan kontekstual\nyang terkait.","question":"Sepanjang rol kawat tembaga elastis seberat total berdimensi ukuran 36 meter disediakan guru\nkelas seni pengerajin dekorasi ruang demi mencukupi suplai rancangan arsitektur kreasi ornamen\ntiga buah kubu seniman terpilih. Seniman kelompok A meminta jatah pengeluaran persediaan\nsepanjang 0.35 bagian utuh, seniman dari pilar B menginginkan hak kawat sirkuit sepesat\n4/9\nbagian utuh kawat utama, sedangkan kawat sisanya digunakan khusus buat ornamen struktur\nkreasi milik kelompok Seniman pilar C. Tentukan benar atau salah untuk setiap pernyataan\nberikut!","statements":[{"text":"Volume rentang rol bentang gulungan potong besi lunak elastis yang dilepas penuh sebagai\npenopang utama desain tim seniman bagian pilar C didominasi sepanjang 7.4 meter.","answer":"Benar","explanation":"Langkah 1: Rentang besi penyerapan pilar A = 36 × 0.35 = 12.6 meter. Langkah 2: Bentangan\nlepas buat kelompok B = 36 ×\n4\n9 = 16.0 meter. Langkah 3: Potongan porsi seniman bagian pilar C\n= 36.0 −(12.6 + 16.0) = 36.0 −28.6 = 7.4 meter. Jadi pernyataan rill tepat selaras. (Benar)."},{"text":"Ukuran perbedaan panjang alokasi pembagian penguasaan potongan gulung anyam logam tim\npilar seniman bagian B dan pilar tim kesatu kelompok seniman A tercatat berselisih sepanjang 3.4\nmeter.","answer":"Benar","explanation":"Langkah 1: Panjang alokasi logam anyam B = 16 meter. Langkah 2: Alokasi A = 12.6 meter.\nLangkah 3: Margin potong perbandingan panjang dari kedua kelok lokus kawat adalah = 16.0 −\n12.6 = 3.4 meter. Jadi pernyataan bernilai selaras (Benar)."},{"text":"Kelompok pilar C sukses memakai atau merebut kekuasaan penyerapan dari seluruh suplai\npasokan besi tembaga anyam tersebut sebanyak tepat senilai\n3\n10 bagian jatah porsi penarikan\ntotal milik sekolah.","answer":"Salah","explanation":"Langkah 1: Ciri muat pecahan porsi dari jatah bagian bagian logam pilar C adalah = 7.4 dari total\n36.0 meter kawat utama. Langkah 2: Rasio = 7.4/36.0 = 74/360 = 37/180. Nilai ini tidak setara\ndengan\n3\n10 = 0.3, jadi keliru. (Salah)."},{"text":"Keseluruhan kumulatif kawat elastis kencang perajin kelas ruang seni dari dua wilayah kreasi\npilar proyek ornamen buatan A ditambah bentangan kelompok C adalah 18.5 meter panjang besi\ntembaga anyam.","answer":"Salah","explanation":"Langkah 1: Gulung bentang proyek milik anyaman logam A = 12.6 meter. Langkah 2: Ukur\nbentang miliknya ornamen logam kelompok C = 7.4 meter. Langkah 3: Jumlah hitung keduanya\nsebesar = 12.6 + 7.4 = 20.0 meter total besi tembaga kawat lunak, bukan setinggi nilai 18.5 meter\n(Salah)."}]},{"number":23,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyatakan bilangan yang termasuk\nbilangan rasional","question":"Ibu membuat adonan kue lapis legit khas Palembang dan memerlukan tepung terigu sebanyak\n0,333. .. bagian dari total wadah. Bentuk pecahan sederhana yang paling tepat untuk menyatakan\nbagian tepung terigu tersebut adalah ....","options":[{"key":"A","text":"1/4"},{"key":"B","text":"3/10"},{"key":"C","text":"1/3"},{"key":"D","text":"2/5"}],"answer":"C","explanation":"Misalkan 𝑥= 0,333. ..\nKalikan kedua ruas dengan 10: 10𝑥= 3,333. ..\nKurangkan persamaan kedua dengan persamaan pertama:\n10𝑥−𝑥= 3,333. . . −0,333. ..\n9𝑥= 3\n𝑥=\n3\n9 =\n1\n3.\nJadi, pecahan paling sederhana dari 0,333. .. adalah\n1\n3."},{"number":24,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyatakan bilangan yang termasuk\nbilangan rasional","question":"Seorang penjual es doger di Jakarta mencampurkan\n1\n8 liter sirup merah dan 0,375 liter susu kental\nmanis ke dalam wadah. Berapa liter total volume campuran sirup dan susu tersebut dalam bentuk\npecahan biasa paling sederhana?","options":[{"key":"A","text":"1\n4 liter"},{"key":"B","text":"3\n8 liter"},{"key":"C","text":"1\n2 liter"},{"key":"D","text":"3\n4 liter"}],"answer":"C","explanation":"Langkah 1: Mengubah bilangan desimal 0,375 menjadi bentuk pecahan biasa paling sederhana,\nyaitu 0,375 =\n375\n1000 =\n3\n8 liter.\nLangkah 2: Menjumlahkan kedua volume cairan tersebut, yaitu\n1\n8 +\n3\n8 =\n4\n8 =\n1\n2 liter."},{"number":25,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyatakan bilangan yang termasuk\nbilangan rasional","question":"Empat koperasi nelayan di Sulawesi Utara melaporkan rasio hasil tangkapan ikan cakalang\nterhadap target tahunan mereka. Koperasi A melaporkan sebesar 0,82 bagian, Koperasi B\nsebesar\n5\n6 bagian, Koperasi C sebesar 84%, dan Koperasi D sebesar\n4\n5 bagian. Urutan koperasi\ndari yang memiliki rasio keberhasilan tertinggi ke terendah adalah ....","options":[{"key":"A","text":"Koperasi C, Koperasi B, Koperasi A, Koperasi D."},{"key":"B","text":"Koperasi C, Koperasi A, Koperasi B, Koperasi D."},{"key":"C","text":"Koperasi B, Koperasi C, Koperasi A, Koperasi D."},{"key":"D","text":"Koperasi D, Koperasi A, Koperasi B, Koperasi C."}],"answer":"A","explanation":"Step 1: Konversi semua laporan rasio ke bentuk desimal agar mudah dibandingkan.\nStep 2: Koperasi A = 0,820; Koperasi B =\n5\n6 ≈0,833; Koperasi C = 84% = 0,840; Koperasi D =\n4\n5 =\n0,800.\nStep 3: Bandingkan nilai desimal tersebut: 0,840 > 0,833 > 0,820 > 0,800. Jadi, urutan koperasi\ndari yang tertinggi ke terendah adalah Koperasi C, Koperasi B, Koperasi A, Koperasi D."},{"number":26,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyatakan bilangan yang termasuk\nbilangan rasional","question":"Tiga orang anak mencatat beberapa angka desimal di papan tulis sekolah, yaitu Doni menulis\n−0,375, Eka menulis 1,232323. .. (angka 23 berulang), Feri menulis 0,12345. .. (angka acak tak\n\nberhingga), dan Gani menulis −2,5. Siswa kelas VII diminta meneliti karakter jenis bilangan ini.\nTentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Angka bertanda negatif −0,375 yang tertulis oleh Doni berstatus rasional karena pecahan\ndesimal ini mempunyai ekor koma desimal terhingga yang mantap.","answer":"Benar","explanation":"−0,375 adalah bilangan desimal terbatas yang setara dengan −\n3\n8 yang menjadikannya bilangan\nrasional."},{"text":"Angka 1,232323. .. milik tulisan Eka tergolong rasional akibat bilangan desimalnya dibentuk dari\nsistem bilangan berpola desimal berulang konstan.","answer":"Benar","explanation":"Semua desimal dengan perulangan angka tanpa akhir merupakan bilangan rasional sebab setara\npecahan tertentu, dalam hal ini setara\n122\n99 ."},{"text":"Angka 0,12345. .. milik tulisan Feri adalah bilangan rasional oleh karena deret polanya berlanjut\ndan terbuat oleh penambahan deretan nilai konstan urutan asli.","answer":"Salah","explanation":"Jika nilai angka tidak memiliki perulangan berkala secara stabil meskipun berkelanjutan, maka itu\nterhitung tipe bilangan irasional."},{"text":"Angka −2,5 kepunyaan Gani berstatus bilangan rasional mengingat representasi aslinya\nselaras langsung dengan nilai perbandingan rasio −\n5/2.","answer":"Benar","explanation":"Sesuai dengan konsep matematika rasional, −2,5 = −\n25\n10 = −\n5\n2 yang membuktikan kelayakan\nbilangan tersebut sebagai rasional."}]},{"number":27,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyatakan bilangan yang termasuk\nbilangan rasional","question":"Sebuah badan pemeliharaan prasarana umum mengukur proporsi perkembangan pengaspalan\nberkala jalan raya kabupaten di Blitar: Tim Merah menyelesaikan pengaspalan sepanjang\n4/7\nbagian dari keseluruhan rute kerja yang disyaratkan, sedangkan Tim Putih telah mengaspal rute\naspal jalan sepanjang 0,57 bagian. Beri tanda centang (✓) pada setiap pernyataan yang benar\nmengenai perkembangan rasio kerja aspal dari masing-masing tim pelaksana jalan!","statements":[{"text":"Regu kerja bentukan dari Tim Merah memperoleh ukuran pencapaian aspal yang terukur\nmelebihi ukuran pencapaian lintasan garapan aspal Tim Putih.","answer":"Benar","explanation":"Capaian pekerjaan dari aspal Tim Merah ditulis\n4\n7 bagian. Jika dirasionalkan desimal mendekati\n0,5714 bagian. Ketika dibandingkan dengan target Tim Putih sebesar 0,57 atau 0,5700 bagian,\nterbukti bahwa 0,5714 > 0,5700."},{"text":"Suku pembuat bilangan pecahan dari nilai rasional yang paling presisi murni bagi lintasan\naspal milik Tim Putih adalah rasio pecahan \\frac{57}{100}.","answer":"Benar","explanation":"Persentase progres lintasan pelapisan jalan berasphalt dari Tim Putih mencatatkan bagian target\nharian harganya 0,57. Sesuai konsep pembilang desimal ke dalam bilangan rasional pecahan\npaling tepat diletakkan setara\n57\n100 bagian rute."},{"text":"Batas kelola ruas aspal yang wajib dilanjutkan oleh personil Tim Merah hingga mengakhiri rute\ntuntas seutuhnya bernilai sebesar \\frac{3}{7} bagian target.","answer":"Benar","explanation":"Lintasan utuh rute perolehan adalah unit tunggal bernilai 1. Bila aspal telah diletakkan sebanyak\n4/7\nbagian rute kerja, operasi untuk porsi kelola tersisa: 1 −\n4\n7 =\n7\n7 −\n4\n7 =\n3\n7 sisa ruas kerja aspal yang\ntersisa."},{"text":"Proyek perintisan pengerjaan aspal yang ditunjukkan pelaksana dari Tim Putih berselisih porsi\npersentase setebal 2\\% melampaui Tim Merah.","answer":"Salah","explanation":"Panjang porsi aspal tim aspal Putih = 0,5700 = 57%. Aspal jalan Tim Merah\n4\n7 ≈0,5714 =\n57,14%. Karena yang aslinya Tim Merah lebih unggul 0,14% jalur aspal, data aspal Tim Putih\nyang melebihi rute 2% adalah simpulan yang salah."}]},{"number":28,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyatakan bilangan yang termasuk\nbilangan rasional","question":"Di sebuah laboratorium matematika sekolah, seorang guru meminta kelompok siswa\nmenganalisis nilai kebenaran dan keselarasan dari bentuk desimal berulang 𝑥= 0.5454. .. dan\n𝑦= 0.1212. ... Siswa ditantang melakukan pengujian untuk mengubah masing-masing bilangan ke\npecahan murni, lalu memproses penjumlahan dan perkalian nilai tersebut. Tentukan benar atau\nsalah untuk setiap pernyataan berikut!","statements":[{"text":"Pernyataan bahwa bentuk desimal berulang 𝑥 bernilai bilangan rasional adalah tepat dengan\nrepresentasi pecahan sederhananya senilai\n6/11.","answer":"Benar","explanation":"Jika 𝑥= 0.5454. .., maka 100𝑥= 54.5454. .. dan dengan melakukan pengurangan didapat 99𝑥=\n54 ⟹ 𝑥=\n54\n99 =\n6\n11, yang terbukti berupa bilangan rasional."},{"text":"Hasil penggabungan atau operasi penjumlahan antara nilai 𝑥 dan 𝑦 secara tepat menghasilkan\nangka pecahan senilai\n22/33.","answer":"Benar","explanation":"Operasi penjumlahan: 𝑦= 0.1212. . . ⟹ 100𝑦= 12.1212. . . ⟹ 99𝑦= 12 ⟹ 𝑦=\n4\n33. Sehingga 𝑥+\n𝑦=\n6\n11 +\n4\n33 =\n18\n33 +\n4\n33 =\n22\n33."},{"text":"Selisih antara nilai desimal berulang 𝑥 dengan desimal berulang 𝑦 merupakan bilangan\nirasional karena menghasilkan sisa koma berulang tiada akhir.","answer":"Salah","explanation":"Selisihnya adalah\n6\n11 −\n4\n33 =\n18−4\n33 =\n14\n33. Bentuk pecahan murni dari hasil ini membuktikan bahwa\nselisihnya tetap bilangan rasional."},{"text":"Operasi perkalian nilai 𝑥 dengan nilai 𝑦 menghasilkan bilangan rasional dengan pecahan\nsederhana terkecil berbentuk\n8/121.","answer":"Benar","explanation":"Perkaliannya: 𝑥× 𝑦=\n6\n11 ×\n4\n33 =\n2\n11 ×\n4\n11 =\n8\n121, yang merupakan bentuk pecahan rasional\nsederhana prima relatif."}]},{"number":29,"level":1,"type":"Pilihan Ganda","objective":"Menyatakan bilangan rasional dalam bentuk pecahan dan\ndesimal","question":"Untuk membuat ramuan pewarna batik alami, Tina membutuhkan\n3\n25 kg ekstrak daun tarum.\nBentuk desimal dari berat ekstrak daun tersebut adalah ....","options":[{"key":"A","text":"0,03"},{"key":"B","text":"0,08"},{"key":"C","text":"0,12"},{"key":"D","text":"0,25"}],"answer":"C","explanation":"Ubah pecahan\n3\n25 menjadi desimal dengan mengalikan pembilang dan penyebut dengan 4 agar\npenyebutnya menjadi 100.\n3×4\n25×4 =\n12\n100 = 0,12."},{"number":30,"level":2,"type":"Pilihan Ganda","objective":"Menyatakan bilangan rasional dalam bentuk pecahan dan\ndesimal","question":"Seorang penenun di Sumba membutuhkan benang sepanjang 1,85 meter untuk membuat\nselembar syal tenun motif khas daerah. Jika ia baru memiliki benang sepanjang\n4\n5 meter,\nberapakah kekurangan panjang benang yang dibutuhkannya dalam bentuk desimal?","options":[{"key":"A","text":"0,65 meter."},{"key":"B","text":"0,85 meter."},{"key":"C","text":"0,95 meter."},{"key":"D","text":"1,05 meter."}],"answer":"D","explanation":"Langkah 1: Mengonversi panjang benang yang dimiliki dari bentuk pecahan menjadi desimal,\nyaitu\n4\n5 = 0,8 meter.\nLangkah 2: Menghitung kekurangan benang dengan mengurangkan total kebutuhan dengan\npersediaan yang ada, yaitu 1,85 −0,8 = 1,05 meter."},{"number":31,"level":3,"type":"Pilihan Ganda","objective":"Menyatakan bilangan rasional dalam bentuk pecahan dan\ndesimal","question":"Ibu Siti di Yogyakarta ingin membuat adonan bakpia. Ia membutuhkan tiga bahan utama yaitu\ntepung terigu sebanyak 0,85 kg, gula pasir sebanyak\n3\n5 kg, dan mentega sebanyak 0,35 kg.\nSetelah mengaduk semua bahan, ia merasa adonan terlalu lembek sehingga ia mengambil\nkembali\n1\n8 kg dari campuran bahan tersebut untuk dibuang. Berapakah berat bersih sisa bahan\nadonan bakpia yang digunakan oleh Ibu Siti dalam bentuk desimal?","options":[{"key":"A","text":"1,575 kg"},{"key":"B","text":"1,675 kg"},{"key":"C","text":"1,725 kg"},{"key":"D","text":"1,825 kg"}],"answer":"B","explanation":"Langkah 1: Ubah semua takaran bahan menjadi bentuk desimal. Tepung terigu = 0,85 kg. Gula\npasir =\n3\n5 = 0,6 kg. Mentega = 0,35 kg.\nLangkah 2: Hitung berat total adonan sebelum dikurangi: 0,85 + 0,6 + 0,35 = 1,8 kg.\nLangkah 3: Ubah berat bahan yang dibuang menjadi desimal:\n1\n8 = 0,125 kg. Hitung berat bersih\nsisa bahan: 1,8 −0,125 = 1,675 kg."},{"number":32,"level":1,"type":"Analisis Pernyataan","objective":"Menyatakan bilangan rasional dalam bentuk pecahan dan\ndesimal","question":"Pengrajin mebel perabot tradisional asal Cirebon membutuhkan pengadaan jalinan pilinan kawat\nrotan muda seberat\n1\n8 kg dan kulit lilitan pengikat sintesis seberat 0,48 kg guna pengerjaan\nperbaikan jala sandaran bangku. Tentukan benar atau salah untuk setiap pernyataan berikut\nberkaitan identitas kuantitas timbangan bahan reparasi perabot tersebut!","statements":[{"text":"Beban dari pemakaian anyaman pilinan rotan seberat\n1\n8 kg bila ditransfer dalam format numeris\npecahan desimal senilai sebesar 0,8 kg.","answer":"Salah","explanation":"Tafsiran menaruh pembagi dasar delapan secara tidak aseli didepan koma merupakan bentuk\nmiskonsepsi umum di siswa, di mana konversi pembagian biner dari kawat jala pilinan\n1\n8 yang\ntepat setara desimal 0,125 kg, bukan 0,8 kg. Pernyataan di atas adalah salah."},{"text":"Beban dari pemakaian anyaman pilinan rotan seberat\n1\n8 kg bila ditransfer dalam format numeris\npecahan desimal senilai sebesar 0,125 kg.","answer":"Benar","explanation":"Langkah pembuktian secara biner dari perbandingan penyelesaian rasio rotan didapat lewat\nkonversi rasio: 1 ÷ 8 = 0,125 kg. Angka representasi pecahan ini adalah benar adanya."},{"text":"Bobot bahan berupa lembaran serat lilitan sintesis bertimbangan 0,48 kg setara bobotnya jika\ndiwakili nilai rasio pembilang pecahan terkecil adalah sebesar\n12\n25 kg.","answer":"Benar","explanation":"Formulasi asal pecahan desimal 0,48 dirasionalkan atas perbandingan\n48\n100. Jika dicari FPB dari\nbilangan-bilangan itu maka didapatkan faktor pembagi sepadan bernilai 4 yang menghasilkan\nbobot bilangan terkecil senilai\n12\n25 kg. Ini benar."},{"text":"Dari takaran peruntukan pengikatnya jenis barang berupa tali pengikat bermassa sintetis\nseberat 0,48 kg bernilai lebih berat bebannya dibanding model tali jala rotan kayu.","answer":"Benar","explanation":"Telah divalidasi rotan berkapasitas bobot = 0,125 kg sedangkan lilitan anyaman elastis penutup\nberbahan sintetis memiliki besaran senilai 0,48 kg. Mengetahui nilai 0,48 kg secara linear lebih\ntinggi besar massanya (0,48 > 0,125 kg). Pernyataan di atas terbukti benar."}]},{"number":33,"level":2,"type":"Analisis Pernyataan","objective":"Menyatakan bilangan rasional dalam bentuk pecahan dan\ndesimal","question":"Ibu Dina di Banjarmasin menggunakan minyak kelapa sebanyak 0,45 liter untuk menggoreng\npisang saba, dan ia menyisakan sebanyak\n3\n20 liter minyak kelapa di dalam botol penyimpanannya.\nBantulah Ibu Dina menghitung nilai total bahan miliknya dan berilah tanda centang (✓) pada\nsetiap pernyataan yang benar!","statements":[{"text":"Total minyak kelapa mula-mula yang dimiliki oleh Ibu Dina setara dengan pecahan\n3\n5 liter.","answer":"Benar","explanation":"Langkah pertama: mengonversi jumlah minyak digunakan dan minyak sisa ke bentuk pecahan\nbiasa, yaitu 0,45 =\n45\n100 =\n9\n20 liter dan minyak sisa adalah\n3\n20 liter. Langkah kedua: menghitung total\nmula-mula yaitu\n9\n20 +\n3\n20 =\n12\n20 =\n3\n5 liter. Maka pernyataan bernilai benar."},{"text":"Jumlah sisa minyak kelapa di dalam botol penyimpanan jika dinyatakan dalam bentuk pecahan\ndesimal setara dengan 0,3 liter.","answer":"Salah","explanation":"Langkah pertama: mengidentifikasi pecahan minyak sisa yaitu\n3\n20 liter. Langkah kedua:\nmengonversi pecahan tersebut menjadi desimal,\n3\n20 =\n15\n100 = 0,15 liter, bukan 0,3 liter. Maka\npernyataan bernilai salah."},{"text":"Selisih antara minyak kelapa yang telah digunakan dengan sisa minyak kelapa yang ada di\nbotol adalah 0,3 liter.","answer":"Benar","explanation":"Langkah pertama: mengonversi semua bagian ke bentuk desimal, minyak digunakan = 0,45 liter,\nminyak sisa =\n3\n20 = 0,15 liter. Langkah kedua: mencari selisih dengan pengurangan 0,45 −0,15 =\n0,30 = 0,3 liter. Maka pernyataan bernilai benar."},{"text":"Bentuk pecahan biasa paling sederhana dari representasi volume minyak kelapa yang\ndigunakan adalah\n9\n10 liter.","answer":"Salah","explanation":"Langkah pertama: mengubah minyak digunakan 0,45 liter ke pecahan biasa, yaitu\n45\n100. Langkah\nkedua: menyederhanakan pecahan tersebut dengan membagi pembilang dan penyebut dengan\nFPB-nya (yaitu 5), menjadi\n9\n20 liter, bukan\n9\n10 liter. Maka pernyataan bernilai salah."}]},{"number":34,"level":3,"type":"Analisis Pernyataan","objective":"Menyatakan bilangan rasional dalam bentuk pecahan dan\ndesimal","question":"Karyawan departemen pencampur komposisi ramuan air konsentrat mencocokkan kelonggaran\nvolume di sediaan dua drum pencampuran khusus berukuran menengah: Bejana I bermassa cair\ncadangan residu air setinggi 28,4 liter cairan obat, dan Bejana II berisi air bahan pengisi sisa\nkelarutan air murni setinggi 25\n3\n5 liter. Sisa isi ini direncanakan akan diintegrasikan bersama\nsecara serempak menuju silinder bak muat pengurasan asalnya yang bermuatan batas maksimal\nruang tampungan air setinggi tepat 53,9 liter cairan ramuan konsentrat obat. Tentukan kebenaran\nasumsi matematika logis mengenai penyandingan volumetrik bejana air ini!","statements":[{"text":"Takar cadangan residu bejana pemrosesan sekunder untuk tangki asupan Bejana II bila dinilai\nkembali desimalnya secara akurat adalah sebanding volume tepat sebesar 25,6 liter cairan\nkonsentrat obat.","answer":"Benar","explanation":"Langkah 1: Mengisolasikan bagian harga dari porsi asupan sisa pada penumpukan drum Bejana\nII = 25\n3\n5 liter. Langkah 2: Mengubah fraksional campuran kepunyaan unit bejana dengan\nmembedah jatah desimal pendukung: 25 + 0,60 = 25,6 liter obat cair konsentrat, asersi tersebut\nbenar."},{"text":"Kombinasi takaran akumulasi gabungan ketersediaan cadangan di Bejana I beserta sisa\ncadangan Bejana II menyinergikan pasokan stok bernilai setara isi setinggi 54,15 liter air cairan\nramuan murni.","answer":"Salah","explanation":"Langkah 1: Takaran kargo air wadah utama I adalah 28,4 liter. Langkah 2: Isi kargo tangki\nsekunder II adalah 25,6 liter. Langkah 3: Integrasi operasional penyandingan gabungan massa\nvolume wadah cairan murni: 28,40 + 25,60 = 54,0 liter cairan ramuan secara valid.\nPernyataannya tidak sejalan dengan jumlah yang mengindikasikan 54,15 liter air."},{"text":"Jika sisa volume cairan dari gabungan Bejana I dan Bejana II tersebut dipindahkan seluruhnya\nke dalam tangki silinder pemprosesan utama secara teoretis, sisa luapan cairan yang terbuang\ntumpah bernilai tepat sejauh 0,1 liter volume cairan.","answer":"Benar","explanation":"Langkah 1: Memperhitungkan jumlahan zat volumetrik sesungguhnya = 54,0 liter. Langkah 2:\nMenilik pada keterbatasan kuota tangki penerimaan yang hanya berskala = 53,9 liter cairan obat\nmurni. Langkah 3: Pengurangan sisa luberan hasil luapan penolakan tangki secara presisi: 54,0 −\n53,9 = 0,1 liter, penyimpulannya valid."},{"text":"Nilai selisih isi muat cairan fungsional Bejana I dibandingkan terhadap muatan cair yang\ndikontribusikan tangki asupan Bejana II setara murni dengan volume zat rasional setara desimal\nbernilai 2,8 liter air ramuan.","answer":"Benar","explanation":"Langkah 1: Ukuran dari isi Bejana I = 28,4 L. Langkah 2: Kadar bejana penampungan Bejana II =\n25,6 L. Langkah 3: Perolehan nilai margin hitungan deduksi selisih dari kargo obat primer\npengaku kedua wadah diidentifikasi bernilai: 28,4 −25,6 = 2,8 liter volume cair murni konsentrat\nobat."}]},{"number":35,"level":1,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan keseharian yang melibatkan\nkonsep bilangan rasional, termasuk berkaitan dengan penguatan\nliterasi finansial.","question":"Sebidang tanah berbentuk persegi panjang memiliki panjang\n4\n5 km dan lebar\n1\n2 km. Berapakah\nluas tanah tersebut dalam satuan km\n2?","options":[{"key":"A","text":"3\n10 km\n2."},{"key":"B","text":"2\n5 km\n2."},{"key":"C","text":"1\n2 km\n2."},{"key":"D","text":"13\n10 km\n2."}],"answer":"B","explanation":"Luas persegi panjang dihitung dengan mengalikan panjang dengan lebarnya.\nPerhitungannya adalah:\n4\n5 ×\n1\n2 =\n4×1\n5×2 =\n4\n10.\nSederhanakan pecahan\n4\n10 dengan membagi pembilang dan penyebut dengan 2 menjadi\n2\n5 km\n2."},{"number":36,"level":2,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan keseharian yang melibatkan\nkonsep bilangan rasional, termasuk berkaitan dengan penguatan\nliterasi finansial.","question":"Andi membeli sebuah kaos seharga Rp120.000,00 yang mendapatkan potongan harga sebesar\n20%. Jika ia membayar menggunakan selembar uang Rp100.000,00, berapakah besar uang\nkembalian yang diterima Andi?","options":[{"key":"A","text":"Rp4.000,00."},{"key":"B","text":"Rp24.000,00."},{"key":"C","text":"Rp96.000,00."},{"key":"D","text":"Rp104.000,00."}],"answer":"A","explanation":"Langkah 1: Hitung harga kaos setelah diskon. Diskon yang didapatkan adalah 20% × 120.000 =\n24.000, sehingga harga setelah potongan adalah Rp120.000,00 - Rp24.000,00 = Rp96.000,00.\nLangkah 2: Hitung uang kembalian yang diterima Andi. Uang kembalian adalah Rp100.000,00 -\nRp96.000,00 = Rp4.000,00."},{"number":37,"level":3,"type":"Pilihan Ganda","objective":"Menyelesaikan permasalahan keseharian yang melibatkan\nkonsep bilangan rasional, termasuk berkaitan dengan penguatan\nliterasi finansial.","question":"Danu dan Eko mendirikan sebuah usaha makanan ringan dengan modal bersama. Danu\nmenyetor modal sebesar Rp12.000.000,00 dan Eko menyetor modal sebesar Rp18.000.000,00,\ndengan kesepakatan pembagian keuntungan sebanding dengan nilai investasi modal masing-\nmasing. Di akhir bulan pertama, usaha tersebut mendapatkan total pendapatan kotor sebesar\nRp45.000.000,00. Namun, pendapatan tersebut dipotong biaya operasional sebesar 60% dan\nkerugian bahan baku busuk sebesar\n1\n15 bagian dari sisa pendapatan setelah dikurangi biaya\noperasional. Berapakah besar bagian keuntungan bersih yang akan diterima oleh Eko?","options":[{"key":"A","text":"Rp6.720.000,00"},{"key":"B","text":"Rp8.400.000,00"},{"key":"C","text":"Rp10.080.000,00"},{"key":"D","text":"Rp10.800.000,00"}],"answer":"C","explanation":"Langkah 1: Tentukan rasio pembagian keuntungan berdasarkan porsi modal Eko.\nTotal Modal = Rp12.000.000,00 + Rp18.000.000,00 = Rp30.000.000,00.\nPorsi modal Eko =\n18.000.000\n30.000.000 = 60%.\nLangkah 2: Hitung sisa pendapatan setelah dikurangi biaya operasional.\nPendapatan setelah biaya operasional = (100% −60%) × Rp45.000.000,00 = 40% ×\nRp45.000.000,00 = Rp18.000.000,00.\nLangkah 3: Hitung total keuntungan bersih setelah dikurangi kerugian bahan baku.\nKerugian bahan baku =\n1\n15 × Rp18.000.000,00 = Rp1.200.000,00.\nKeuntungan Bersih = Rp18.000.000,00 − Rp1.200.000,00 = Rp16.800.000,00.\nLangkah 4: Hitung porsi keuntungan bersih milik Eko.\nKeuntungan Eko = 60% × Rp16.800.000,00 = Rp10.080.000,00."},{"number":38,"level":1,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan keseharian yang melibatkan\nkonsep bilangan rasional, termasuk berkaitan dengan penguatan\nliterasi finansial.","question":"Andi mengontrol kedisiplinan keuangan harian dengan memanfaatkan alokasi modal jajan reguler\ndari keluarga sebesar Rp20.000,00 per hari, dengan pembagian persentase penggunaan tepat\n1/2\nbagian ditujukan untuk jajan sehat siang, porsi\n1\n5 bagian untuk membiayai transportasi angkutan\numum, serta mengalirkan sisanya ke wadah celengan pribadi di kamarnya. Tentukan benar atau\nsalah untuk setiap pernyataan berikut!","statements":[{"text":"Pos jatah konsumsi logistik makan siang Andi yang diizinkan untuk digunakan harian adalah\nRp10.000,00.","answer":"Benar","explanation":"Jatah jajan sehat siang Andi adalah\n1\n2 × 𝑅𝑝20.000,00 = 𝑅𝑝10.000,00."},{"text":"Besar biaya yang terpakai demi kebutuhan sarana perpindahan transportasi umum per harinya\nadalah Rp4.000,00.","answer":"Benar","explanation":"Pengeluaran untuk naik transportasi adalah\n1\n5 × 𝑅𝑝20.000,00 = 𝑅𝑝4.000,00."},{"text":"Alokasi porsi nominal rupiah pecahan tabungan celengan setara dengan\n2\n5 bagian dari total\njatah bulanan keseluruhan yang diterimanya.","answer":"Salah","explanation":"Sisa bagian untuk ditabung adalah 1 −\n1\n2 −\n1\n5 =\n10\n10 −\n5\n10 −\n2\n10 =\n3\n10 bagian, bukan\n2\n5 (yang bernilai\n4\n10)."},{"text":"Besar dana simpanan yang didepositokan Andi ke wadah tabungan celengan fisiknya setiap\nhari adalah Rp6.000,00.","answer":"Benar","explanation":"Tabungan celengan per hari: 𝑅𝑝20.000,00 −𝑅𝑝10.000,00 −𝑅𝑝4.000,00 = 𝑅𝑝6.000,00."}]},{"number":39,"level":2,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan keseharian yang melibatkan\nkonsep bilangan rasional, termasuk berkaitan dengan penguatan\nliterasi finansial.","question":"Bu Dina menyerahkan setoran kontan penanaman modal tabungan mula-mula sebesar\nRp5.000.000,00 di perbankan syariah wilayah kabupaten. Pengelola unit memberikan\npenjaminan perlakuan keuntungan berdasar bagi hasil setingkat bunga tunggal kokoh dipasang\nbersuku bunga murni sebesar 5% per tahunnya. Dana dikumpulkan tersebut dikonseptokan akan\nditarik saat penyerahan murni biaya studi masa pendidikan semester lanjutan anaknya kelak\n\nyang butuh pagu pembiayaan Rp5.200.000,00. Tentukan benar atau salah untuk setiap\npernyataan berikut!","statements":[{"text":"Langkah kurun tempo pengendapan tabungan yang barusan ditaruh dalam jangkauan rentang\nwaktu 6 bulan lamanya mengalirkan simpanan dana murni sebesar Rp5.125.000,00.","answer":"Benar","explanation":"Langkah 1: Mengitung imbal bunga murni 6 bulanan simpanan murni aslinya 𝑏𝑢𝑛𝑔𝑎=\n𝑅𝑝5.000.000,00 × 5% ×\n6\n12 = 𝑅𝑝125.000,00. Langkah 2: Melipatgandakannya beserta dana\nlumbung kontan primer 𝑡𝑜𝑡𝑎𝑙= 𝑅𝑝5.000.000,00 + 𝑅𝑝125.000,00 = 𝑅𝑝5.125.000,00."},{"text":"Agar realisasi tumpukan seluruh modal investasi akhir minimal terpenuhi target batas di level\nsekolah Rp5.200.000,00 berjalan tanpa cela, masa pengendapan setoran dituntut sekurang-\nkurangnya 10 bulan masa genap simpanan.","answer":"Benar","explanation":"Langkah 1: Memproses perolehan minimun laba damba sasaran target rill setidaknya sebesar\n𝑅𝑝5.200.000,00 −𝑅𝑝5.000.000,00 = 𝑅𝑝200.000,00. Langkah 2: Menjelmakan formula tempo\ntersaring murni 𝑁=\n200.000×12\n5.000.000×0,05 = 9,6 bulan dibulatkan masa bayar genap diangka kisaran 10\nbulan penuh menabung."},{"text":"Saldo uang atas realisasi laba dividen pertambahan simpanan nasabah andaikata diendapkan\nutuh ditarik saat jatuh tempo jangka umur 2 tahun masa simpan terkumpul tepat senilai\nRp400.000,00.","answer":"Salah","explanation":"Langkah 1: Mencari laba bunga dasar pertahun yang dihasilkan bu dina berkat perimbangan\ntabungannya (𝑅𝑝5.000.000,00 × 5% = 𝑅𝑝250.000,00 pertahun). Langkah 2: Hasil tersebut\ndiproses jika mengendap seumur dua tahunan, menghasilkan total sebesar Rp500.000,00."},{"text":"Persis saat menyentuh waktu tuntas berdurasi genap setahun masa berjalan penuh\nmenabung, andil porsi total dana bunga berkembang tabungan bertambah berlipat senilai\nRp250.000,00.","answer":"Benar","explanation":"Langkah 1: Mengamati ketentuan setahun yaitu 12 bulan atau setingkat 1 kali siklus penalti\npersen aseli bunga tahunan. Langkah 2: Diaplikasikan kepada modal mula Rp5.000.000,00\nmendapatkan besar uang bertambah persis 𝑅𝑝5.000.000,00 × 5% = 𝑅𝑝250.000,00."}]},{"number":40,"level":3,"type":"Analisis Pernyataan","objective":"Menyelesaikan permasalahan keseharian yang melibatkan\nkonsep bilangan rasional, termasuk berkaitan dengan penguatan\nliterasi finansial.","question":"Sebut saja wali murid perlu menebus kelengkapan pengadaan bundel modul buku referensi\ndengan label standard sebesar Rp450.000,00. Terdapat tiga model penawaran skema akuisisi\npemenuhan di lokasi mitra yang berbeda. Toko Pustaka mengenalkan kemudahan denda kredit\ntanpa persentase bunga senilai angsuran nominal Rp160.000,00 per pembayaran sebanyak\nbertahap tiga kali setor bulan berturutan. Toko Ilmu mensyaratkan mekanisme transfer transaksi\ntunai dengan diskon tunggal dari toko yang bernilai pemotongan sebesar 8%, dan Toko Lembar\nmengenalkan diskon langsung bersetuju melayani pelepasan unit paket buku itu langsung di\nbatas net tagihan mutlak senilai harga pas Rp410.000,00. Analisislah strategi kehematan\npengadaan buku berdasarkan perincian kalkulasi matematika finansial di bawah ini!","statements":[{"text":"Memperhitungkan sisa belanja dan ketatnya perolehan harga hemat dari alternatif skema\npembayaran tunai yang ditawarkan, berbelanja langsung di gerai buku milik Toko Lembar tercatat\nmelahirkan penawaran paling ekonomis/paling hemat.","answer":"Benar","explanation":"Mari kita hitung nilai pengorbanan rupiah pembelanja: Total Toko Pustaka = 3 × 𝑅𝑝160.000,00 =\n𝑅𝑝480.000,00. Total Toko Ilmu = 𝑅𝑝450.000,00 −(8% × 𝑅𝑝450.000,00) = 𝑅𝑝450.000,00 −\n𝑅𝑝36.000,00 = 𝑅𝑝414.000,00. Total Toko Lembar = 𝑅𝑝410.000,00. Jadi tingkat silih tanding harga\nakhir: 𝑅𝑝410.000,00 < 𝑅𝑝414.000,00 < 𝑅𝑝480.000,00. Benar bahwa berbelanja di Toko Lembar\nmerupakan transaksi tunai paling hemat di antara semuanya."},{"text":"Penjatuhan aksi pemenuhan transaksi ke gerai komoditas Toko Ilmu mendelegasikan nilai\nbonus kupon pangkasan harga murni bagi wali murid itu sebesar Rp36.000,00.","answer":"Benar","explanation":"Formula diskon pada pemesanan di gerai Toko Ilmu menghasilkan pemotongan sebesar =\n8% × 𝑅𝑝450.000,00 = 𝑅𝑝36.000,00. Dengan demikian pernyataan ini tepat."},{"text":"Mekanisme pengenaan termin jangka dari unit penyedia buku Toko Pustaka memaksakan\npengorbanan tambahan kompensasi selisih denda bunga (dibanding tarif normal aslinya) yang\nmengikat hingga angka sanksi margin bayar sebesar Rp50.000,00.","answer":"Salah","explanation":"Pertambahan sanksi kredit bunga cicilan dari standardisasi pokok normal di toko tersebut yang\ndisandera perorangan cicil Toko Pustaka senilai = 𝑅𝑝480.000,00 −𝑅𝑝450.000,00 = 𝑅𝑝30.000,00\ndan bukannya selevel denda sebesar Rp50.000,00. Maka pernyataan ini tidak tepat."},{"text":"Terdapat nominal batas selisih harga porsi nilai kehematan murni antarpengeluaran kas akhir\nantara skema harga diskon milik Toko Ilmu terhadap total harga pas milik Toko Lembar yang\nberkuantitas nilai sebesar Rp4.000,00.","answer":"Benar","explanation":"Biaya Toko Ilmu adalah 𝑅𝑝414.000,00 dikurangkan harga beli dari pilihan gerai Toko Lembar\nsenilai 𝑅𝑝410.000,00. Rentang harga antarselisih pembayaran tersebut bernilai sebesar\n𝑅𝑝414.000,00 −𝑅𝑝410.000,00 = 𝑅𝑝4.000,00. Maka pernyataan ini terbukti valid."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
