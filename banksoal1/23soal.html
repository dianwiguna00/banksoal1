<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Peluang</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT PELUANG</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Sebuah dadu bermata enam dilambungkan sebanyak 120 kali. Frekuensi harapan munculnya\nmata dadu bernomor kurang dari 5 adalah ....","options":[{"key":"A","text":"20 kali"},{"key":"B","text":"40 kali"},{"key":"C","text":"60 kali"},{"key":"D","text":"80 kali"}],"answer":"D","explanation":"Langkah 1: Tentukan peluang muncul mata dadu kurang dari 5 (1,2,3,4): 𝑃(𝐴) =\n4\n6 =\n2\n3.\nLangkah 2: Hitung frekuensi harapan: 𝐹ℎ= 𝑃(𝐴) × 𝑁=\n2\n3 × 120 = 80 kali.\nJawaban Benar: D"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Pada percobaan melambungkan dua buah koin yang adil secara bersamaan sekali, berapakah\nbanyak anggota ruang sampel yang terbentuk?","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"6"}],"answer":"C","explanation":"Satu koin memiliki 2 sisi (Angka dan Gambar).\nUntuk pelemparan dua koin secara bersamaan, anggota ruang sampelnya adalah 𝑆=\n{(𝐴, 𝐴), (𝐴, 𝐺), (𝐺, 𝐴), (𝐺, 𝐺)}.\nBanyak anggota ruang sampel adalah 𝑛(𝑆) = 2 × 2 = 4.\nJawaban Benar: C"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Di dalam sebuah tas terdapat 12 kelereng putih dan 8 kelereng hitam. Jika diambil satu kelereng\nsecara acak, peluang terambilnya kelereng putih adalah ....","options":[{"key":"A","text":"2/5"},{"key":"B","text":"1/2"},{"key":"C","text":"3/5"},{"key":"D","text":"4/5"}],"answer":"C","explanation":"Langkah 1: Hitung jumlah total kelereng: 12 + 8 = 20 kelereng.\nLangkah 2: Jumlah kelereng putih adalah 12.\nLangkah 3: Hitung peluang terambil kelereng putih:\n12\n20. Sederhanakan pecahan tersebut menjadi\n3\n5.\nJawaban Benar: C"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Dalam sebuah permainan papan tradisional, dua buah dadu dilambungkan secara bersamaan\nsatu kali. Peluang munculnya mata dadu pertama bermata 5 dan mata dadu kedua bermata\ngenap adalah ....","options":[{"key":"A","text":"1/12"},{"key":"B","text":"1/6"},{"key":"C","text":"1/4"},{"key":"D","text":"1/2"}],"answer":"A","explanation":"Langkah 1: Tentukan banyak kejadian yang diinginkan. Kejadian dadu pertama bermata 5 adalah\n𝐴= {5} (1 kemungkinan), sedangkan dadu kedua bermata genap adalah 𝐵= {2,4,6} (3\nkemungkinan). Pasangan kejadian yang memenuhi syarat adalah {(5,2), (5,4), (5,6)} sehingga\njumlah kejadian yang memenuhi adalah 1 × 3 = 3.\nLangkah 2: Tentukan total ruang sampel dari pelemparan dua dadu yaitu 36. Hitung peluang\nkejadian dengan membagi jumlah kejadian dengan ruang sampel, yaitu\n3\n36 =\n1\n12.\nJawaban Benar: A"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Amir melakukan percobaan melambungkan sekeping koin sebanyak 100 kali. Jika sisi angka\nmuncul sebanyak 60 kali, maka peluang empiris munculnya sisi gambar pada percobaan tersebut\nadalah ....","options":[{"key":"A","text":"1/5"},{"key":"B","text":"3/10"},{"key":"C","text":"2/5"},{"key":"D","text":"3/5"}],"answer":"C","explanation":"Langkah 1: Tentukan frekuensi munculnya sisi gambar dari total percobaan: 100 −60 = 40 kali.\nLangkah 2: Hitung peluang empiris dengan membagi frekuensi gambar dengan total percobaan:\n𝑃=\n40\n100 =\n2\n5.\nJawaban Benar: C"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Dalam sebuah kantong terdapat 15 bola merah dan 10 bola hijau. Dilakukan pengambilan satu\nbola secara acak, kemudian bola dikembalikan lagi ke dalam kantong. Percobaan ini diulang\nsebanyak 150 kali. Frekuensi harapan terambilnya bola berwarna hijau adalah ....","options":[{"key":"A","text":"40 kali"},{"key":"B","text":"60 kali"},{"key":"C","text":"90 kali"},{"key":"D","text":"100 kali"}],"answer":"B","explanation":"Langkah 1: Hitung peluang terambilnya bola berwarna hijau. Banyak bola hijau adalah 10 dan\njumlah seluruh bola adalah 15 + 10 = 25 bola. Peluang bola hijau adalah 𝑃(ℎ𝑖𝑗𝑎𝑢) =\n10\n25 =\n2\n5.\nLangkah 2: Hitung frekuensi harapan terambilnya bola hijau dengan mengalikan peluang dengan\njumlah pengulangan percobaan (150 kali), yaitu 𝐹ℎ=\n2\n5 × 150 = 60 kali.\nJawaban Benar: B"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Dalam sebuah permainan kartu angka di kelas, terdapat satu set kartu bernomor urut 1 sampai\n20. Tiga buah kartu diambil satu per satu secara berturut-turut tanpa dikembalikan ke dalam\ntumpukan. Jika kartu pertama yang terambil bernomor 5 dan kartu kedua bernomor 12,\nberapakah peluang kartu ketiga yang terambil bernomor genap?","options":[{"key":"A","text":"4/9"},{"key":"B","text":"1/2"},{"key":"C","text":"5/9"},{"key":"D","text":"2/3"}],"answer":"B","explanation":"Langkah 1: Analisis komposisi kartu awal dari nomor 1 sampai 20, yaitu terdapat 10 kartu\nbernomor ganjil dan 10 kartu bernomor genap.\nLangkah 2: Tentukan sisa kartu setelah dua pengambilan tanpa pengembalian. Pengambilan\npertama: nomor 5 (ganjil), sisa kartu genap tetap 10. Pengambilan kedua: nomor 12 (genap), sisa\nkartu genap berkurang satu menjadi 9 kartu. Total sisa seluruh kartu adalah 20 −2 = 18 kartu.\nLangkah 3: Hitung peluang terambilnya kartu genap pada pengambilan ketiga dari sisa tumpukan\nkartu: 𝑃=\n𝑠𝑖𝑠𝑎 𝑘𝑎𝑟𝑡𝑢 𝑔𝑒𝑛𝑎𝑝\n𝑠𝑖𝑠𝑎 𝑡𝑜𝑡𝑎𝑙 𝑘𝑎𝑟𝑡𝑢=\n9\n18 =\n1\n2.\nJawaban Benar: B"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Dua buah dadu dilambungkan secara bersamaan sebanyak 360 kali. Berapakah frekuensi\nharapan munculnya mata dadu dengan jumlah berupa bilangan prima yang nilainya lebih dari 5?","options":[{"key":"A","text":"60 kali"},{"key":"B","text":"80 kali"},{"key":"C","text":"100 kali"},{"key":"D","text":"120 kali"}],"answer":"B","explanation":"Langkah 1: Mengidentifikasi bilangan prima yang mungkin terbentuk dari jumlah mata dua dadu\n(rentang 2 sampai 12) yang nilainya lebih dari 5, yaitu 7 dan 11.\nLangkah 2: Menghitung banyaknya hasil yang menghasilkan jumlah 7 dan 11. Untuk jumlah 7:\n(1,6), (2,5), (3,4), (4,3), (5,2), (6,1) sebanyak 6 cara. Untuk jumlah 11: (5,6), (6,5) sebanyak 2\ncara. Total kejadian menguntungkan adalah 6 + 2 = 8 cara dari total 36 kemungkinan.\nLangkah 3: Menentukan peluang teoretis kejadian tersebut, yaitu 𝑃=\n8\n36 =\n2\n9.\nLangkah 4: Menghitung frekuensi harapan dengan mengalikan peluang dengan banyaknya\npercobaan, yaitu 𝐹ℎ=\n2\n9 × 360 = 80 kali. Jadi, jawaban yang benar adalah B.\nJawaban Benar: B"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Guru matematika meminta seorang siswa menentukan frekuensi harapan munculnya mata dadu\nberjumlah ganjil pada pelemparan dua dadu secara bersamaan sebanyak 180 kali. Berikut adalah\nlangkah pengerjaan siswa tersebut: (1) Menentukan jumlah kejadian mata dadu berjumlah ganjil,\nyaitu sebanyak 18 kejadian. (2) Menghitung peluang munculnya mata dadu berjumlah ganjil, yaitu\n𝑃=\n18\n36 =\n1\n2. (3) Menghitung frekuensi harapan dengan rumus 𝐹ℎ=\n1\n2 ×\n1\n180. (4) Memperoleh hasil\nakhir 𝐹ℎ=\n1\n360. Pada langkah nomor berapakah siswa tersebut pertama kali melakukan\nkesalahan?","options":[{"key":"A","text":"Langkah 1"},{"key":"B","text":"Langkah 2"},{"key":"C","text":"Langkah 3"},{"key":"D","text":"Langkah 4"}],"answer":"C","explanation":"Langkah 1: Menganalisis Langkah 1 milik siswa. Jumlah kejadian mata dadu berjumlah ganjil dari\npelemparan dua dadu adalah 18 kejadian (ganjil + genap atau genap + ganjil = 3 × 3 + 3 × 3 =\n18). Langkah ini sudah benar.\nLangkah 2: Menganalisis Langkah 2 milik siswa. Peluang mata dadu berjumlah ganjil =\n18\n36 =\n1\n2.\nLangkah ini juga benar.\nLangkah 3: Menganalisis Langkah 3 milik siswa. Rumus frekuensi harapan seharusnya adalah\n𝐹ℎ= 𝑃× 𝑁, dengan 𝑁 adalah banyaknya percobaan. Maka seharusnya 𝐹ℎ=\n1\n2 × 180 = 90 kali.\nRumus yang dituliskan siswa malah membagi dengan jumlah percobaan, sehingga Langkah 3\nsalah.\nJawaban Benar: C"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Di dalam sebuah kotak terdapat empat kelereng putih dan enam kelereng hitam yang serupa\nsecara bentuk dan berat. Tentukan benar atau salah untuk setiap pernyataan berikut jika satu\nkelereng diambil secara acak!","statements":[{"text":"Peluang teoretis terambil kelereng hitam adalah \n3\n5.","answer":"Benar","explanation":"Kelereng hitam ada 6 dan total ada 10 kelereng. Peluang terambil kelereng hitam adalah \n6\n10 =\n3\n5."},{"text":"Banyaknya titik sampel untuk kejadian terambilnya satu kelereng merah dari kotak tersebut \nadalah 1.","answer":"Salah","explanation":"Kotak hanya memuat warna hitam dan putih. Pengambilan kelereng merah memiliki 0 anggota \ntitik sampel."},{"text":"Peluang teoretis terambil kelereng putih dari kotak tersebut adalah \n2\n5.","answer":"Benar","explanation":"Kelereng putih berjumlah 4 kelereng dari total 10. Maka peluangnya adalah \n4\n10 =\n2\n5."},{"text":"Peluang teoretis terambil satu kelereng putih atau kelereng hitam dari kotak tersebut adalah \n1\n10.","answer":"Salah","explanation":"Mengambil putih atau hitam merupakan kejadian pasti yang memuat semua elemen kotak \ntersebut (10 buah kelereng). Sehingga peluangnya bernilai \n10\n10 = 1."}],"explanation":""},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Di sebuah keranjang berisi beberapa buah konsumsi yaitu 8 buah jeruk sehat, 4 buah apel merah\ncerah, serta 8 buah pir kuning madu. Bila satu butir diambil spontan sekali tanpa memilah, jawab\nBENAR atau SALAH pada masing pernyataan peluang nilai berikut!","statements":[{"text":"Nilai peluang memegang sebuah jeruk manis teoretis yang diambil acak bernilai sebesar \n1\n2.","answer":"Salah","explanation":"Total tumpukan buah ada sebanyak 8 + 4 + 8 = 20 buah. Jumlah jeruk melambangkan 8 buah, \npeluang terambilnya jeruk yaitu \n8\n20 =\n2\n5, bukan bernilai \n1\n2."},{"text":"Peluang menemukan buah apel manis secara teoretis bernilai sebesar \n1\n5.","answer":"Benar","explanation":"Banyak buah apel bernomor atau berjumlah 4 dari keseluruhan set keranjang sebanyak 20 butir. \nNilai teoritis adalah \n4\n20 yang disederhanakan sebagai \n1\n5."},{"text":"Nilai peluang mengambil buah dengan tipe pir atau apel cerah pada percobaan ini adalah \nsebesar \n3\n5.","answer":"Benar","explanation":"Jumlah antara tipe buah apel dan pir dikombinasikan berjumlah sebanyak 8 + 4 = 12 buah dari \nwadah berisi 20. Hasilnya berupa peluang bernilai \n12\n20 =\n3\n5."},{"text":"Peluang yang terambil pir kuning segar yang diperoleh dalam pengambilan tunggal bernilai \nsebesar \n1\n4.","answer":"Salah","explanation":"Jumlah buah pir ada sebanyak 8 dari 20 buah yang tersedia, sehingga nilai teoretiknya adalah \n8\n20 \nyang dapat diringkas sebagai \n2\n5."}],"explanation":""},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Tiga buah koin logam adil dilambungkan secara bersamaan sebanyak satu kali. Tentukan benar\natau salah untuk setiap pernyataan berikut!","statements":[{"text":"Peluang muncul ketiga-tiganya gambar dari pelambungan tersebut adalah sebesar \n3\n8.","answer":"Salah","explanation":"Hanya ada 1 kejadian di mana ketiga koin bernilai gambar yaitu (G,G,G). Peluang kejadian \ntersebut adalah \n1\n8."},{"text":"Banyaknya seluruh titik sampel yang mungkin terjadi dari percobaan tersebut adalah 8 \nkejadian.","answer":"Benar","explanation":"Tiga koin logam menghasilkan titik sampel sebanyak 23 = 8 kejadian."},{"text":"Kejadian munculnya minimal dua buah angka memiliki anggota titik sampel sebanyak 4 buah.","answer":"Benar","explanation":"Hasil minimal dua angka adalah (A,A,A), (A,A,G), (A,G,A), dan (G,A,A) yang jumlahnya bernilai 4."},{"text":"Peluang teoretis munculnya tepat satu angka adalah \n1\n2.","answer":"Salah","explanation":"Kejadian tepat satu angka adalah (A,G,G), (G,A,G), dan (G,G,A) yang jumlahnya 3, sehingga \npeluangnya adalah \n3\n8, bukan \n1\n2."}],"explanation":""},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Dua buah dadu bermata enam dilempar bersamaan sekali. Diinginkan untuk menganalisis\nkejadian teoritik jumlah mata dadu yang mungkin muncul pada permukaan atas kedua dadu.\nTentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Peluang muncul mata dadu berjumlah prima adalah \n13\n36.","answer":"Salah","explanation":"Langkah 1: Mengidentifikasi jumlah prima dari hasil jumlahan dua dadu, yaitu 2, 3, 5, 7, dan 11. \nLangkah 2: Menghitung banyaknya titik sampel (total 15) sehingga peluang sebenarnya adalah \n15\n36, bukan \n13\n36. Pernyataan salah."},{"text":"Peluang muncul mata dadu berjumlah kelipatan 4 adalah \n1\n4.","answer":"Benar","explanation":"Langkah 1: Bilangan kelipatan 4 yang mungkin sebagai jumlah adalah 4, 8, dan 12 dengan \njumlah kejadian berturut-turut adalah 3, 5, dan 1. Langkah 2: Menghitung peluang total kejadian \nkelipatan 4, yaitu \n3+5+1\n36\n=\n9\n36 =\n1\n4. Pernyataan benar."},{"text":"Peluang muncul jumlah mata dadu kurang dari atau sama dengan 5 adalah \n5\n18.","answer":"Benar","explanation":"Langkah 1: Menghitung banyak titik sampel dengan jumlah ≤5, yaitu kelompok jumlah 2 (1), 3 \n(2), 4 (3), dan 5 (4) yang beranggotakan total 10 kejadian. Langkah 2: Peluang kejadian tersebut \nadalah \n10\n36 =\n5\n18. Pernyataan benar."},{"text":"Peluang muncul jumlah mata dadu kelipatan 5 adalah \n1\n6.","answer":"Salah","explanation":"Langkah 1: Bilangan kelipatan 5 adalah 5 (4 kejadian) dan 10 (3 kejadian), dengan total 7 titik \nsampel. Langkah 2: Peluang teoretiknya adalah \n7\n36, bukan \n6\n36 atau \n1\n6. Pernyataan salah."}],"explanation":""},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Dalam suatu percobaan melempar sebuah koin logam sebanyak 120 kali, sisi gambar muncul\nsebanyak 45 kali, sedangkan sisanya adalah sisi angka. Tentukan benar atau salah untuk setiap\npernyataan berikut mengenai peluang dan frekuensi relatif dari percobaan tersebut!","statements":[{"text":"Frekuensi relatif munculnya sisi angka dalam percobaan tersebut adalah \n5\n8.","answer":"Benar","explanation":"Jumlah kemunculan sisi angka adalah 120 −45 = 75 kali. Maka, frekuensi relatif sisi angka \nadalah \n75\n120 =\n5\n8."},{"text":"Peluang teoretik munculnya sisi gambar pada pelemparan satu koin logam adalah \n1\n2.","answer":"Benar","explanation":"Ruang sampel pelemparan koin logam adalah {𝐴, 𝐺} dengan ukuran 𝑛(𝑆) = 2. Sisi gambar hanya \nsatu kejadian, sehingga peluang teoretiknya adalah \n1\n2."},{"text":"Frekuensi relatif munculnya sisi gambar dalam percobaan tersebut adalah \n3\n5.","answer":"Salah","explanation":"Frekuensi relatif munculnya sisi gambar didasarkan pada eksperimen nyata yaitu kemunculan \ngambar dibagi total pelemparan, yaitu \n45\n120 =\n3\n8, bukan \n3\n5."},{"text":"Jika koin dilempar sebanyak 120 kali, secara teoretik frekuensi harapan munculnya sisi gambar \nadalah 60 kali.","answer":"Benar","explanation":"Frekuensi harapan secara teoretis diperoleh dari hasil kali peluang teoretik dengan banyaknya \npercobaan, yaitu 𝐹ℎ=\n1\n2 × 120 = 60 kali."}],"explanation":""},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Di dalam suatu boks kartu edukasi terdapat 6 lembar kartu yang diberi nomor 1 sampai 6 secara\nberurutan. Apabila dari boks tersebut diambil secara acak dua buah kartu sekaligus secara\nbersamaan, pilih semua pernyataan yang tepat!","statements":[{"text":"Peluang dari terambilnya dua buah kartu yang bernomor bilangan prima adalah \n1\n5.","answer":"Benar","explanation":"Langkah 1: Kartu prima = {2,3,5}, kejadian memilih 2 prima adalah 𝐶(3,2) = 3 pasang. Ruang \nsampel total pengambilan 2 kartu dari 6 adalah 𝐶(6,2) = 15 pasang. Langkah 2: Hitung rasio \npeluang \n3\n15 =\n1\n5. Pernyataan benar."},{"text":"Peluang dari terambilnya kedua kartu dengan jumlah kedua angkanya berupa bilangan ganjil \nadalah \n3\n5.","answer":"Benar","explanation":"Langkah 1: Supaya ganjil, satu ganjil {1,3,5} dan satu genap {2,4,6}. Banyak cara kombinasi yaitu \n3 × 3 = 9 pasang. Langkah 2: Peluangnya menjadi \n9\n15 =\n3\n5. Pernyataan benar."},{"text":"Peluang terambilnya kedua kartu dengan jumlah kedua nomornya merupakan bilangan genap \nadalah \n4\n15.","answer":"Salah","explanation":"Langkah 1: Kejadian jumlah genap bila keduanya genap (𝐶(3,2) = 3) atau keduanya ganjil \n(𝐶(3,2) = 3), sehingga total 6 pasang. Langkah 2: Peluang aslinya adalah \n6\n15 =\n2\n5. Distraktor \n4\n15 \nterjadi jika hanya salah satu kelompok kartu yang diperhitungkan. Pernyataan salah."},{"text":"Peluang bahwa kedua kartu yang terambil merupakan nomor bilangan genap secara \nbersamaan adalah \n1\n5.","answer":"Benar","explanation":"Langkah 1: Bilangan genap {2,4,6}, kejadian memilih 2 kartu genap adalah 𝐶(3,2) = 3. Langkah \n2: Peluangnya didapat \n3\n15 =\n1\n5. Pernyataan benar."}],"explanation":""},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Seorang ahli meteorologi membandingkan akurasi dari dua model simulasi ramalan cuaca lokal\nselama masa pergantian musim. Model cuaca X memprediksi peluang terjadinya hari hujan di\nsuatu daerah adalah sebesar 0.65 untuk tiap harinya, sementara model Y memprediksi peluang\nterjadinya hujan adalah 0.80 tiap hari. Beri tanda centang (✓) pada setiap pernyataan yang benar\nterkait estimasi kejadian cuaca jika dilakukan observasi pembanding selama rentang waktu 40\nhari!","statements":[{"text":"Proyeksi atau frekuensi harapan terjadinya hari hujan berdasarkan prediksi Model Y selama 40 \nhari pengamatan adalah sebanyak 32 hari.","answer":"Benar","explanation":"Harapan hari hujan menurut Model Y adalah 𝐹ℎ= 0.80 × 40 = 32 hari. Pernyataan ini benar."},{"text":"Harapan teoretik terjadinya hari cerah (tidak hujan) berdasarkan prediksi Model X dalam \nperiode tersebut adalah sebanyak 16 hari.","answer":"Salah","explanation":"Peluang tidak hujan Model X adalah 1 −0.65 = 0.35. Frekuensi harapan tidak hujan adalah \n0.35 × 40 = 14 hari, bukan 16 hari."},{"text":"Selisih harapan jumlah hari yang mengalami hujan berdasarkan perhitungan simulasi kedua \nmodel ramalan cuaca adalah sebanyak 8 hari.","answer":"Salah","explanation":"Harapan hujan Model X adalah 0.65 × 40 = 26 hari. Harapan hujan Model Y adalah 32 hari. \nSelisih harapan hari hujan mereka adalah 32 −26 = 6 hari."},{"text":"Perbandingan frekuensi harapan hari cerah (tidak hujan) antara Model X terhadap Model Y \nuntuk periode 40 hari adalah senilai 7: 4.","answer":"Benar","explanation":"Harapan hari tidak hujan Model X adalah 40 × 0.35 = 14 hari. Harapan tidak hujan Model Y \nadalah 40 × (1 −0.80) = 40 × 0.20 = 8 hari. Rasio hari cerah Model X terhadap Model Y adalah \n14: 8 = 7: 4. Pernyataan ini benar."}],"explanation":""},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Dua pemuda binaan panahan wilayah, Danu dan Bayu, mengecek perbandingan konsistensi\npresisi panah mereka terhadap target merah. Di dalam rekapan rekor awal, dari 80 kali Danu\nmelesatkan anak panahnya, ia menemui kesuksesan mengenai target merah sebanyak 60 kali.\nSedangkan di rekap terpisah dari 100 lemparan anak panah milik Bayu, bidikannya berhasil\nmenembus zona merah 70 kali. Andaikata panitia mempertemukan mereka masing-masing pada\nkompetisi penembakan sebanyak 200 putaran uji yang seimbang di kemudian hari, beri tanda\ncentang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Peluang empiris ketidaksuksesan Danu mendaratkan anak panahnya ke sasaran merah lebih \nrendah daripada porsi peluang murni kegagalan bidik yang dihimpun Bayu.","answer":"Benar","explanation":"Peluang Danu sukses memanah adalah 𝑃(𝑆𝐷) =\n60\n80 = 0,75, maka peluang gagal Danu = 1 −\n0,75 = 0,25. Peluang Bayu sukses memanah adalah 𝑃(𝑆𝐵) =\n70\n100 = 0,7, maka peluang gagal Bayu \n= 1 −0,7 = 0,3. Maka peluang gagal Danu sebesar 0,25 terbukti lebih rendah dibanding peluang \ngagal Bayu sebesar 0,3."},{"text":"Andai Danu diprogram melaksanakan lemparan panah yang baru sejumlah 200 tembakan, ia \ndiharapkan menuntaskan bidikan kena sasaran sebanyak 150 kali.","answer":"Benar","explanation":"Proporsi teoretis presisi milik Danu dari data masa lalu sebesar 0,75. Jika dipatok tantangan \npercobaan sebanyak 200 buah tembakan, maka besarnya frekuensi harapan perkenalan di \nwilayah merah adalah 𝐹ℎ= 0,75 × 200 = 150 kali bidikan terarah."},{"text":"Dari agenda penuntasan 200 peluncuran panah secara bergilir untuk Danu dan Bayu, margin \nselisih frekuensi harapan jumlah bidikan mengenai sasaran bernilai sebanyak 10 kali panah.","answer":"Benar","explanation":"Proyeksi bidikan masuk sasaran merah untuk Danu dalam 200 tembakan = 150 kali. Sementara \nuntuk Bayu, frekuensi harapan masuk sasaran merah = 0,7 × 200 = 140 kali. Selisih frekuensi \nharapan keberhasilan target antara Danu dan Bayu = 150 −140 = 10 kali panah."},{"text":"Peluang teoretik atau empiris mengenai kemahiran bidikan masuk target milik penembak \nkedua yaitu Bayu adalah bernilai setara dengan 0,75.","answer":"Salah","explanation":"Rasio akurasi keberhasilan yang dikoleksi Bayu adalah sebanyak 70 kesuksesan dari total 100 \nlemparan yang dijalani, sebanding nilai peluang empiris = 0,70. Nilai 0,75 melukiskan ketepatan \nporsi menembak Danu, sehingga pernyataan salah."}],"explanation":""},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Menentukan frekuensi relatif, peluang teoritik, dan frekuensi \nharapan serta menyelesaikan permasalahan kontekstual yang \nterkait.","question":"Evaluasi survei moda kendaraan menuju stasiun menyimpulkan potret pergerakan transit\npenumpang KRL: sebesar 80% memakai tumpangan ojek digital instan, 15% murni membawa\ntumpangan roda dua swasta personal pribadi, dan ada sejumlah 5% tercatat menempuh metode\nmelangkah jalan kaki langsung. Berdasarkan rujukan status tepat waktu, tercatat ada 10%\ngolongan pengguna transportasi online terbelit kejadian macet di loket tap-in, bertanding dengan\n20% tingkat kemacetan gerbong milik pembawa motor pribadi, dan lantas 40% frekuensi kasus\nmacet atau kendala di dalam penumpang melangkah rute berjalan kaki. Tentukan benar atau\nsalah gambaran estimasi probabilitas agregasi total keterlambatan sistem kereta listrik ini!","statements":[{"text":"Bobot rasio acak secara agregat umum di mana salah seorang pengguna komuter dari total \nseluruh ragam data pelawat mengalami keterlambatan menuju kursi rangkaian kereta api adalah \nterekam senilai 0,13.","answer":"Benar","explanation":"Formula penaksiran aggregate keterlambatan teoretis dari seluruh rute moda dirumuskan: \n𝑃(𝐿𝑎𝑚𝑏𝑎𝑡) = [𝑃(𝑂𝑗𝑜𝑙) × 𝑃(𝐿|𝑂𝑗𝑜𝑙)] + [𝑃(𝑀𝑜𝑡𝑜𝑟) × 𝑃(𝐿|𝑀𝑜𝑡𝑜𝑟)] + [𝑃(𝐽𝑎𝑙𝑎𝑛) × 𝑃(𝐿|𝐽𝑎𝑙𝑎𝑛)]. \nOperasional perkiraan teoretis mendapati: [0,80 × 0,10] + [0,15 × 0,20] + [0,05 × 0,40] = 0,08 +\n0,03 + 0,02 = 0,13 tepat secara matematis. Simpulan ini akurat dan benar."},{"text":"Proyeksi keseluruhan bagi pelancong stasiun kereta cepat commuter tersebut untuk dipastikan \nsanggup mengakses perjalanannya tepat waktu murni tanpa melampaui limit tenggat (alias lancar \naman) divalidasi dengan angka tebal di 87%.","answer":"Benar","explanation":"Komplementer penemuan probabilitas pengguna tepat waktu dari semua armada transportasi: \n1 −𝑃(𝐿𝑎𝑚𝑏𝑎𝑡) = 1 −0,13 = 0,87. Dikonversikan menuju wujud model bilangan desimal menjadi \ntepat berupa skala persentase senilai 87%. Maka rumusan data di kalimat ini valid."},{"text":"Kemungkinan peluang dijumpai seorang konsumen yang sekaligus mendaftarkan tumpuan \nbepergian melalui taksi online komersial serta terjebak oleh gangguan kemacetan waktu tempuh \nbernilai setara tingkat persentase 0,08.","answer":"Benar","explanation":"Target irisan data pengguna berkorespondensi independen ojol terakumulasi langsung via model \n𝑃(𝑂𝑗𝑜𝑙∩𝐿𝑎𝑚𝑏𝑎𝑡) = 0,80 × 0,10 = 0,08. Komputasi matematis memberikan simpulan bahwa \nklaim bernilai benar."},{"text":"Disoroti dari sumbatan arus kendala di dalam pos pemberhentian, penyumbang kontributor \nterbanyak akan total penumpang KRL terlambat digiring utamanya dari kelambanan orang \nbermoda jalan kaki.","answer":"Salah","explanation":"Menakar bobot sumbatan aktual dari data penarikan bersilang otonom: ojol memasok kerugian \nandil kelambanan seberat 0,08, sepeda pribadi 0,03, sedang kaum pelangkah jalan kaki hanyalah \nsebesar 0,02 dari pangsa transit komuter keseluruhan. Walau rasio laju keterlambatan jalan kaki \ntinggi di level persen lokalnya (40%), penyumbang kuantitas keping nyata dari unit individu macet \nKRL justru terbanyak dipimpin oleh pengguna taksi/ojol dikarenakan jumlah dominasi \nperjalanannya yang raksasa. Kalimat di kuesioner salah."}],"explanation":""}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
