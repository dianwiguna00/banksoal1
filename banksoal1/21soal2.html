<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Notasi Ilmiah dan Bentuk Baku</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT NOTASI ILMIAH DAN BENTUK BAKU</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 1 \n \nLebar celah mikro pada sebuah sensor elektronik adalah 8,4 × 10−6 meter. Bentuk desimal dari \nlebar celah tersebut adalah ....","options":[{"key":"A","text":"0,0000084 meter"},{"key":"B","text":"0,000084 meter"},{"key":"C","text":"0,00084 meter"},{"key":"D","text":"0,0084 meter"}],"answer":"A","explanation":"Lebar celah sensor = 8,4 × 10−6 meter. \nKarena eksponen dari 10 bernilai −6, maka kita harus menggeser koma desimal ke kiri sebanyak \n6 kali. \nGeser koma desimal mulai dari kiri angka 8, menyisipkan 5 buah angka nol tambahan di \nbelakang koma desimal. \nSehingga diperoleh bentuk desimal biasa yaitu 0,0000084 meter. \nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 1 \n \nMassa sebutir debu halus diperkirakan sekitar 8,5 × 10−10 kg. Jika ditulis tanpa pangkat (dalam \nbentuk desimal biasa), massa debu tersebut adalah ....","options":[{"key":"A","text":"0,000000000085 kg"},{"key":"B","text":"0,00000000085 kg"},{"key":"C","text":"0,00000008500 kg"},{"key":"D","text":"0,00000085000 kg"}],"answer":"B","explanation":"Mengubah 8,5 × 10−10 kg menjadi desimal biasa. \nMenggeser koma desimal pada 8,5 ke kiri sebanyak 10 tempat. \nHal ini menghasilkan 9 angka nol di belakang koma sebelum angka 85, yaitu 0,00000000085 kg. \nJawaban Benar: B"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 1 \n \nDi antara bentuk perpangkatan berikut, manakah yang merupakan penulisan bentuk baku (notasi \nilmiah) yang benar untuk suatu bilangan?","options":[{"key":"A","text":"0,45 × 106."},{"key":"B","text":"4,5 × 105."},{"key":"C","text":"45 × 104."},{"key":"D","text":"450 × 103."}],"answer":"B","explanation":"Bentuk baku atau notasi ilmiah didefinisikan sebagai 𝑎× 10𝑛, dengan syarat 1 ≤𝑎< 10 dan 𝑛 \nmerupakan bilangan bulat. \nMari kita analisis nilai 𝑎 pada masing-masing opsi: \n- Opsi A: 𝑎= 0,45 (salah, karena 0,45 < 1) \n- Opsi B: 𝑎= 4,5 (benar, karena 1 ≤4,5 < 10) \n- Opsi C: 𝑎= 45 (salah, karena 45 ≥10) \n- Opsi D: 𝑎= 450 (salah, karena 450 ≥10) \nDengan demikian, penulisan bentuk baku yang benar adalah 4,5 × 105. \nJawaban Benar: B"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 2 \n \nProduksi sampah plastik di suatu wilayah mencapai 12.000 kg per hari. Jika sebanyak 40% dari \nsampah tersebut berhasil didaur ulang, tentukan massa sampah plastik yang tidak didaur ulang \nsetiap harinya dalam satuan gram dan dituliskan dalam bentuk baku.","options":[{"key":"A","text":"7,2 × 103 gram"},{"key":"B","text":"7,2 × 104 gram"},{"key":"C","text":"7,2 × 105 gram"},{"key":"D","text":"7,2 × 106 gram"}],"answer":"D","explanation":"Langkah 1: Menghitung massa sampah yang tidak didaur ulang dalam kg. Persentase sampah \ntidak didaur ulang adalah 100% −40% = 60%. Massa = 60% × 12.000 kg = 7.200 kg. \nLangkah 2: Mengonversi satuan ke gram dan mengubahnya ke bentuk baku. Karena 1 kg = 1.000 \ngram, maka 7.200 kg = 7.200.000 gram = 7,2 × 106 gram. \nJawaban Benar: D"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 2 \n \nSebuah industri percetakan memproduksi sebanyak 4 × 106 lembar halaman buku dalam satu \nhari. Halaman-halaman tersebut dikelompokkan ke dalam bundel berisi masing-masing 250 \nlembar halaman. Jumlah bundel halaman yang dihasilkan dalam satu hari jika dinyatakan dalam \nbentuk baku adalah ....","options":[{"key":"A","text":"1,6 × 102 bundel"},{"key":"B","text":"1,6 × 103 bundel"},{"key":"C","text":"1,6 × 104 bundel"},{"key":"D","text":"1,6 × 105 bundel"}],"answer":"C","explanation":"Langkah 1: Menghitung jumlah bundel dengan membagi total halaman dengan isi per bundel: \n4×106\n250 = 16.000 bundel. \nLangkah 2: Mengubah nilai 16.000 ke dalam bentuk baku menjadi 1,6 × 104 bundel. \nJawaban Benar: C"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 2 \n \nSebuah perkebunan kelapa sawit di Sumatra memiliki luas total 1,8 × 105 hektar yang dibagi rata \nmenjadi 6 wilayah bagian sama luas. Jika 1 hektar setara dengan 10.000 meter persegi, \nberapakah luas masing-masing wilayah bagian tersebut jika dinyatakan dalam meter persegi \ndengan bentuk baku?","options":[{"key":"A","text":"3 × 104 meter persegi."},{"key":"B","text":"3 × 106 meter persegi."},{"key":"C","text":"3 × 108 meter persegi."},{"key":"D","text":"3 × 1010 meter persegi."}],"answer":"C","explanation":"Langkah 1: Hitung luas satu wilayah bagian dalam hektar: \n1,8×105\n6\n= 0,3 × 105 = 3 × 104 hektar. \nLangkah 2: Konversikan luas tersebut ke meter persegi (1 hektar = 104 𝑚2): 3 × 104 × 104 𝑚2 = \n3 × 108 meter persegi. \nJawaban Benar: C"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 3 \n \nDi ruang angkasa, massa sebuah planet katai adalah 4,5 × 1020 kg, sedangkan massa salah satu \nsatelit alamnya (bulan) adalah 1,5 × 1017 kg. Akibat tabrakan beruntun dengan meteorit, massa \nbulan tersebut bertambah sebesar 50% dari massa semulanya. Perbandingan massa planet katai \ntersebut terhadap massa baru bulannya adalah ....","options":[{"key":"A","text":"20 kali lipat"},{"key":"B","text":"200 kali lipat"},{"key":"C","text":"2.000 kali lipat"},{"key":"D","text":"20.000 kali lipat"}],"answer":"C","explanation":"Langkah 1: Hitung pertambahan massa bulan: 50% × (1,5 × 1017) = 0,5 × 1,5 × 1017 =\n0,75 × 1017 kg. \nLangkah 2: Tentukan massa baru bulan tersebut setelah tabrakan: (1,5 × 1017) + (0,75 × 1017) =\n2,25 × 1017 kg. \nLangkah 3: Tentukan berapa kali lipat massa planet dibanding massa baru bulannya dengan \nmelakukan pembagian: \n4,5×1020\n2,25×1017. \nLangkah 4: Hitung hasil pembagian numerik dan eksponen secara terpisah: \n4,5\n2,25 = 2 dan \n1020\n1017 =\n103. Maka diperoleh hasil 2 × 103 = 2.000 kali lipat. \nJawaban Benar: C"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 3 \n \nDua jenis bakteri dikembangkan di sebuah laboratorium biologi. Bakteri P membelah diri menjadi \ndua setiap 30 menit, dengan jumlah awal 2,5 × 104 sel. Bakteri Q membelah diri menjadi dua \nsetiap 45 menit, dengan jumlah awal 1,6 × 105 sel. Setelah 3 jam, seorang asisten laboratorium \n\nmemperkirakan bahwa selisih jumlah kedua bakteri adalah 9,6 × 104 sel. Bagaimanakah analisis \nAnda terhadap hasil perkiraan asisten laboratorium tersebut?","options":[{"key":"A","text":"Perkiraan salah, karena selisih sebenarnya adalah 9,6 × 103 sel."},{"key":"B","text":"Perkiraan salah, karena selisih sebenarnya adalah 9,6 × 105 sel."},{"key":"C","text":"Perkiraan benar, karena 2,56 × 106 dikurangi 1,6 × 106 menghasilkan 9,6 × 104."},{"key":"D","text":"Perkiraan salah, karena selisih sebenarnya adalah 9,6 × 106 sel."}],"answer":"B","explanation":"Langkah 1: Tentukan jumlah pembelahan selama 3 jam (180 menit). Bakteri P membelah \nsebanyak 180/30 = 6 kali. Bakteri Q membelah sebanyak 180/45 = 4 kali. \nLangkah 2: Hitung jumlah akhir Bakteri P. Jumlah akhir P = 2,5 × 104 × 26 = 2,5 × 104 × 64 =\n160 × 104 = 1,6 × 106 sel. \nLangkah 3: Hitung jumlah akhir Bakteri Q. Jumlah akhir Q = 1,6 × 105 × 24 = 1,6 × 105 × 16 =\n25,6 × 105 = 2,56 × 106 sel. \nLangkah 4: Hitung selisih sebenarnya. Selisih = 2,56 × 106 −1,6 × 106 = 0,96 × 106 = 9,6 × 105 \nsel. Berarti perkiraan asisten salah (asisten salah mengurangi pangkat). \nJawaban Benar: B"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Level 3 \n \nSebuah sinyal mikro merambat dengan kecepatan cahaya yaitu 3 × 108 meter per detik. Sinyal \ndipancarkan dari Jakarta menuju sebuah satelit pengorbit rendah yang berada pada jarak \n3,0 × 105 meter. Satelit menerima sinyal tersebut, melakukan pemrosesan data dengan waktu \ntunda 5,0 × 10−4 detik, lalu memancarkannya kembali ke stasiun bumi penerima di Surabaya \nyang juga berjarak 3,0 × 105 meter dari satelit. Berapakah total waktu dari pengiriman awal di \nJakarta hingga sinyal diterima di Surabaya?","options":[{"key":"A","text":"2,5 × 10−3 detik"},{"key":"B","text":"2,5 × 10−2 detik"},{"key":"C","text":"2,5 × 10−1 detik"},{"key":"D","text":"2,5 × 100 detik"}],"answer":"A","explanation":"Langkah 1: Hitung waktu tempuh sinyal dari Jakarta ke satelit (𝑡1). 𝑡1 = 𝑗𝑎𝑟𝑎𝑘/𝑘𝑒𝑐𝑒𝑝𝑎𝑡𝑎𝑛=\n(3,0 × 105)/(3 × 108) = 1,0 × 10−3 = 0,001 detik. \nLangkah 2: Hitung waktu tempuh dari satelit ke Surabaya (𝑡2). Karena jaraknya sama, 𝑡2 =\n1,0 × 10−3 = 0,001 detik. \nLangkah 3: Hitung total waktu pengiriman termasuk waktu tunda pemrosesan (𝑡𝑡𝑢𝑛𝑑𝑎=\n5,0 × 10−4 = 0,0005 detik). Total waktu = 𝑡1 + 𝑡𝑡𝑢𝑛𝑑𝑎+ 𝑡2 = 0,001 + 0,0005 + 0,001 = 0,0025 \ndetik. Nyatakan dalam bentuk baku: 2,5 × 10−3 detik. \nJawaban Benar: A"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Fisikawan merinci bahwa gelombang yang berasal dari instrumen khusus, semisal inframerah \nmemancarkan tingkat panjang rentangan radiasi sebesar 0,00000075 meter. Tentukan benar atau \nsalah untuk setiap pernyataan yang mengevaluasi skenario kebenaran bentuk ilmiah panjang \nradiasi inframerah ini!","statements":[{"text":"Struktur teoretik pendaftaran dari format panjang nominal fisis gelombang tersebut tertata \nsebagai 7,5 × 10−6 meter.","answer":"Salah","explanation":"Tatanan nominal fisis murni mengindikasikan bahwa digit berpangkat desimal bergerak tujuh digit \nposisi koordinat desimal dari bagian kiri aslinya guna mendaratkan format ke angka nominal \nmantisa standar 7,5, melahirkan notasi 7,5 × 10−7, bukan berpangkat eksponen minus enam."},{"text":"Besaran utama yang digunakan dalam menstandarkan fasa bilangan ke rentang bilangan baku \ndiperoleh secara legal senilai bilangan 75 didampingi tanda pemangkat desimal 10−8.","answer":"Salah","explanation":"Penyajian desimal bersistem ilmiah bersumber 75 × 10−8 melabrak aturan primer batas pengait \nkonotasi baku disebabkan letak mantisa primer tergelincir melewati parameter atas batas interval \nmurni di bawah angka 10."},{"text":"Spesifikasi model perwajahan paling akomodatif dan legal dari aturan ilmiah matematika \npanjang gelombang ialah bilangan kuadrat bertanda desimal bernilai riil 7,5 × 10−7 meter.","answer":"Benar","explanation":"Operasi memindahkan digit tanda titik bernilai rill sejauh tujuh posisi pergeseran tepat \nmeredefinisi dimensi numeris angka asli menjadi bentuk penyelesaian notasi baku standar \nbernilai tepat sebesar 7,5 × 10−7."},{"text":"Eksponen yang didapatkan pada identitas nominal berpangkat negatif −7 bermaksud \nmenuntun pencerobohan visual penarikan tanda desimal 7 poin spasial ke wilayah sebelah kanan \nbilangan dari representasi desimal rill orisinalnya.","answer":"Benar","explanation":"Notasi fungsional parameter pemangkatan eksponen yang mempunyai parameter bernilai −7 \nmewajibkan proses migrasi searah lurus letak titik sejauh total tujuh digit penyesuaian kearah \nbarat ataupun arah bagian kanan sampai menyentuh batas tatanan numerik depan desimal \nasalnya."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Hasil pengukuran laboratorium menunjukkan tebal sebuah nanofiber halus berukuran desimal \nsebesar 0,000025 milimeter. Beri tanda centang (✓) pada setiap pernyataan yang benar \nmengenai bentuk baku dari ukuran serat ini!","statements":[{"text":"Bilangan 0,000025 memiliki eksponen pangkat bernilai −5 ketika dikonversi menuju bentuk \nilmiah.","answer":"Benar","explanation":"Titik desimal bergeser ke kanan sejauh lima langkah agar diperoleh bentuk angka 2,5 di mana \npergeseran tersebut dihitung sebagai pangkat −5."},{"text":"Notasi baku tebal serat nanofiber tersebut dapat didefinisikan sebagai 25 × 10−6 milimeter.","answer":"Salah","explanation":"Pilihan koefisien angka baku tidak diperbolehkan bernilai ≥10, sehingga penggunaan angka \nkoefisien utama sebesar 25 tidak diperbolehkan secara formal."},{"text":"Eksponen sepuluh dari diameter nanometer partikel tersebut adalah bilangan bulat bernilai \npositif karena merupakan kelipatan pergeseran ke kanan.","answer":"Salah","explanation":"Pergeseran titik desimal ke sebelah kanan bernilai seperpuluhan sehingga wajib ditunjukkan \ndalam nilai bilangan eksponen bulat yang bernilai negatif."},{"text":"Notasi ilmiah formal dan baku bagi diameter tersebut bernilai utuh 2,5 × 10−5 milimeter.","answer":"Benar","explanation":"Memindahkan penulisan dengan pergeseran 5 tempat memposisikan koma secara seimbang \nyaitu diperoleh 2,5 yang memenuhi persyaratan ilmiah dikali pangkat 10−5."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Dalam lembar ringkasan rumus matematika siswa, tertulis penulisan notasi ilmiah bentuk baku \ndari empat angka biasa. Tentukan benar atau salah untuk setiap analisis nilai di bawah ini!","statements":[{"text":"Bentuk baku notasi ilmiah dari angka bulat biasa 52.000 dapat dinotasikan dengan 5,2 × 104.","answer":"Benar","explanation":"Benar. 52.000 = 5,2 × 104 di mana pergeseran desimal berpindah 4 digit ke sebelah kiri."},{"text":"Notasi bentuk baku dari angka desimal kecil 0,0003 adalah 3 × 10−4.","answer":"Benar","explanation":"Benar. Pada bilangan desimal 0,0003, koma digeser sebanyak 4 kali ke arah kanan sehingga \npangkatnya adalah negatif 4, yang berlanjut menjadi 3 × 10−4."},{"text":"Bentuk baku standar dari nilai desimal 0,025 ditunjukkan secara langsung oleh notasi \n25 × 10−3.","answer":"Salah","explanation":"Salah. Bentuk baku ilmiah aslinya wajib ditulis sebagai 2,5 × 10−2, sebab 25 tidak diperbolehkan \nmenjadi basis di bagian kiri pangkat."},{"text":"Representasi bentuk baku untuk nilai tepat 10.000 digambarkan oleh model bilangan 1 × 105.","answer":"Salah","explanation":"Salah. Bilangan 10.000 hanya mempunyai empat angka nol, maka representasi yang benar \nharuslah berbentuk 1 × 104."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Para analis pangan memperkirakan bahwa secara konvensional, massa rata-rata satu butir biji \nsereal padi halus jenis tertentu berkisar 2,0 × 10−5 kg. Sebuah dolog mengirim pasokan bantuan \ndarurat ke depot daerah penyalur sebanyak 15 buah karung penuh dengan muatan berat per \nkarungnya seberat 50 kg. Beri tanda centang (✓) pada setiap pernyataan yang benar \nberdasarkan pengukuran beras tersebut!","statements":[{"text":"Estimasi hitung matematis kandungan total unit satuan biji sereal di dalam wadah per satu \nkarungnya bernilai sebesar 2,5 × 106 butir biji sereal.","answer":"Benar","explanation":"Jumlah beras di satu karung = \n50 𝑘𝑔\n2,0×10−5 𝑘𝑔/𝑏𝑢𝑡𝑖𝑟= 2.500.000 butir. Penulisan ini secara baku sama \ndengan 2,5 × 106 butir. Pernyataan ini benar."},{"text":"Keseluruhan kuota total beras pada paket pesanan penyaluran 15 karung dari depot utama \nbernilai sama dengan massa 7,5 × 102 kg.","answer":"Benar","explanation":"Berat keseluruhan beras dalam 15 karung = 15 × 50 = 750 kg. Format baku matematika \nmencatatkan 7,5 × 102 kg. Pernyataan ini benar."},{"text":"Hasil dugaan hitung kapasitas total bulir butiran yang terkandung dalam tumpukan paket \npengiriman adalah sebesar 3,75 × 106 butir biji sereal.","answer":"Salah","explanation":"Jumlah total butiran sereal pada 15 karung = 15 × 2.500.000 = 37.500.000 butir. Bentuk baku \nilmiah matematika semestinya tertulis 3,75 × 107 butir sereal, bukan 3,75 × 106 (pangkat ordo \nkurang teliti). Pernyataan ini salah."},{"text":"Massa untuk kuantitas porsi beras sekantong hias berisi penuh sejumlah 2.000 butir biji sereal \nsetara dengan 4,0 × 10−2 kg.","answer":"Benar","explanation":"Massa kantong hias berisi beras = 2.000 𝑏𝑢𝑡𝑖𝑟× (2,0 × 10−5 𝑘𝑔/𝑏𝑢𝑡𝑖𝑟) = 4,0 × 10−2 kg (senilai \n0,04 kg). Pernyataan ini benar."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Sel darah merah manusia memiliki diameter rata-rata sekitar 7,5 × 10−6 meter. Seorang peneliti \ningin menganalisis dimensi ukuran sel tersebut termasuk mengukur jari-jarinya serta \nmemproyeksikan total panjang barisan apabila 2.000 sel darah merah disejajarkan ujung ke ujung \ndalam garis lurus. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan dengan \ndimensi ukuran sel darah merah tersebut!","statements":[{"text":"Jari-jari satu sel darah merah adalah sebesar 3,75 × 10−5 meter.","answer":"Salah","explanation":"Jari-jari sel darah merah dihitung dengan membagi diameter dua, sehingga (7,5 × 10−6) ÷ 2 =\n3,75 × 10−6 meter. Konversi ini salah eksponen pangkat desimal."},{"text":"Total panjang dari barisan sel tersebut adalah 1,5 × 10−3 meter.","answer":"Salah","explanation":"Massa barisan 2.000 sel darah merah yaitu 2.000 × 7,5 × 10−6 = 2 × 103 × 7,5 × 10−6 =\n1,5 × 10−2 meter. Nilai dalam pernyataan kurang satu derajat orde eksponen."},{"text":"Jari-jari dari sebuah sel darah merah jika dituliskan dalam bentuk notasi ilmiah adalah \n3,75 × 10−6 meter.","answer":"Benar","explanation":"Dengan memotong diameter setengah, diperoleh jari-jari sisa senilai 3,75 × 10−6 meter. Ini \nmerepresentasikan bentuk notasi ilmiah baku berukuran kurang dari 1."},{"text":"Panjang barisan lurus yang terbentuk dari sejajarnya sel-sel tersebut setara dengan 1,5 × 10−2 \nmeter.","answer":"Benar","explanation":"Panjang gabungan adalah 15 × 10−3 meter, yang diubah ke bentuk baku ilmiah berderajat \npangkat eksponen bernilai 1,5 × 10−2 meter."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Sebuah tangki penyimpanan minyak dapat menampung minyak sebanyak 125.000 liter. Sebelum \ndijual, minyak dipindahkan ke wadah kecil masing-masing berkapasitas 250 liter sebanyak 150 \nbuah. Sisa minyak di tangki akan ditulis dalam bentuk baku bersatuan desiliter dengan \nmengonversikan 1 liter sama dengan 10 desiliter. Tentukan benar atau salah untuk setiap \npernyataan berikut berdasarkan kondisi tersebut!","statements":[{"text":"Total volume minyak yang dipindahkan dari tangki penyimpan tersebut setara dengan \n3,75 × 105 desiliter.","answer":"Benar","explanation":"Volume minyak yang dipindahkan adalah 150 × 250 = 37.500 liter. Konversi ke desiliter dikalikan \n10, sehingga menjadi 375.000 desiliter, atau 3,75 × 105 desiliter. Pernyataan ini benar."},{"text":"Volume sisa minyak yang tertinggal di dalam tangki utama adalah sebesar 8,75 × 104 liter.","answer":"Benar","explanation":"Sisa minyak adalah volume awal dikurangi volume dipindahkan: 125.000 −37.500 = 87.500 liter. \nDiubah ke bentuk baku menjadi 8,75 × 104 liter. Pernyataan ini benar."},{"text":"Sisa minyak di dalam tangki dalam bentuk baku bersatuan desiliter adalah sebesar 8,75 × 106 \ndesiliter.","answer":"Salah","explanation":"Volume sisa minyak adalah 87.500 liter. Dalam satuan desiliter, dikalikan 10 menjadi 875.000 \ndesiliter. Bentuk bakunya seharusnya 8,75 × 105 desiliter, bukan 8,75 × 106 desiliter. Pernyataan \nini salah."},{"text":"Apabila diubah seluruhnya ke bentuk desiliter, kapasitas wadah awal tangki penyimpanan \nminyak tersebut dapat ditulis sebagai 1,25 × 105 desiliter.","answer":"Salah","explanation":"Kapasitas awal adalah 125.000 liter. Diubah ke desiliter menjadi 1.250.000 desiliter, atau \n1,25 × 106 desiliter dalam bentuk baku, bukan 1,25 × 105 desiliter. Pernyataan ini salah."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Di pos pengontrol satelit meteorologi draf cuaca tercatat adanya dua pulsa gelombang pemancar \ntransmisi radio luar angkasa dengan kebesaran interval durasi pelepasan masing-masing. \nTransmiter satelit fisis rute A menyemburkan pulsa listrik selang durasi kilas sekilas durasi \n6,2 × 10−7 sekon per kedip gelombang, sedangkan rute sinyal transmitter satelit B berkecepatan \npemancaran pemulasan senilai tingkat durasi pelepasan selamanya selebar 1,4 × 10−7 sekon. \nPengawas instrumen mengumpulkan bahwa mesin tangkap telah terekam penuh menangkap \npopulasi kedipan sinyal sebanyak 4.000.000 kedipan rute satelit transmisi A dan 5.000.000 detak \npemancaran pulsa rute satelit transmisi B untuk dibandingkan parameter kecepatan durasi total \nkerjanya. Tentukan benar atau salah untuk setiap pernyataan berikut berkaitan komparasi \ntransmisi data udara nirkabel tersebut!","statements":[{"text":"Massa waktu bentangan akumulatif transmisi gelombang kilasan pelepasan cepat pulsa satelit \ntransmitter lintasan tipe A berdurasi total tepat senilai sebesar 2,48 × 100 sekon.","answer":"Benar","explanation":"Waktu interval pulsa terdistribusi transmisi satelit kawat A = (4 × 106) × (6,2 × 10−7 𝑠) =\n24,8 × 10−1 = 2,48 𝑠𝑒𝑘𝑜𝑛= 2,48 × 100 𝑠."},{"text":"Pelepasan akumulasi waktu tempuh gelombang yang terekam fisis sensor bagi transmiter luar \nangkasa instrumen nirkabel tipe B berdurasi tepat di level ukuran 7 × 10−2 sekon.","answer":"Salah","explanation":"Jumlah siklus B durasi transmisi satelit = (5 × 106) × (1,4 × 10−7 𝑠) = 7,0 × 10−1 = 0,7 𝑠𝑒𝑘𝑜𝑛=\n7 × 10−1 𝑠. Salah pada silsilah pendefinisian peletakan tanda desimal eksponen."},{"text":"Dua silsilah rentetan pemulasan waktu gelombang bila digabung bersatupadu menuntut masa \nwaktu pakai fasa transien penerima senilai ukuran durasi 3,18 × 100 sekon.","answer":"Benar","explanation":"Komponen fasa waktu gabung berkesinambungan penerima kargo satelit = 2,48 + 0,7 =\n3,18 𝑠𝑒𝑘𝑜𝑛. Setara mutlak dalam standar perancangan draf sistem 3,18 × 100 𝑠𝑒𝑘𝑜𝑛."},{"text":"Rentang silsilah margin gap keunggulan aspal kecepatan kelambatan responsifitas sensor \npenyeimbangan transmiter udara lurus fisis A dari tipe satelit B mencatatkan perolehan berselisih \ndurasi setingkat ukuran fasa selembar 1,78 × 10−1 sekon.","answer":"Salah","explanation":"Analisis draf margin waktu penyaring pemancar = 2,48 −0,7 = 1,78 𝑠𝑒𝑘𝑜𝑛= 1,78 × 100 𝑠, \nsedangkan format penyimpulan pilihan opsi menaruhnya secara melenceng dalam sepuluh \npangkat minus satu."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Guna menjaga kelancaran turbin magnet generator energi hulu listrik mini, aliran input fluida \nberasal dari suplai paralel gerbang dua waduk lereng gunung. Pintu bendung Waduk C \nmenggerakkan gelontoran curah debit air sepadan dengan nilai sembur laju air 2,4 × 105 liter tiap \nmenit berlalu, sedangkan di saat bersisian saluran katup inlet Waduk D mentransmisikan debit \nkencang senilai laju hantar konstan 4,8 × 104 liter per detik ke gardu turbin induksi. Tentukan \nbenar atau salah untuk setiap pernyataan seputar volume dinamis alir penggerak PLTA sesudah \nmengoreksi data dengan seksama!","statements":[{"text":"Semburan debit laju alir air dari sumber Waduk D jika dikalibrasi ke dalam bentuk menit setara \ndengan volume pasokan 2,88 × 106 liter per menit.","answer":"Benar","explanation":"Langkah 1: Ketahui kuota suplai awal debit Waduk D bertonggak tingkat hantar 4,8 × 104 L/detik. \nLangkah 2: Mengkonversi durasi aliran menuju bentuk laju menit dengan mengalikan waktu \nsirkulasi detik 60 sekon/menit, didapat total konversi seberat 4,8 × 104 × 60 = 2,88 × 106 \nliter/menit."},{"text":"Akumulasi muatan volume air gabungan dari kedua pintu bendungan tersebut saat dilepaskan \nmengalir simultan adalah 3,12 × 106 liter per menit.","answer":"Benar","explanation":"Langkah 1: Mengumpulkan dua resultan muat pasok energi penggerak kotoran per menit di satu \nunit: Suplai Waduk C bernilai 2,4 × 105 = 0,24 × 106 L/menit. Suplai Waduk D bernilai 2,88 × 106 \nL/menit. Langkah 2: Penjumlahan paralel setinggi 0,24 × 106 + 2,88 × 106 = 3,12 × 106 liter per \nmenit."},{"text":"Selisih kemampuan suplai kapasitas pengaliran dari Waduk D lebih unggul hanya terpaut \n2,4 × 104 liter per menit dari pasokan Waduk C.","answer":"Salah","explanation":"Langkah 1: Mencari besar margin debit aliran antara penyuplai Waduk D (2,88 × 106 L/menit) \ndibanding penyuplai Waduk C (0,24 × 106 L/menit). Langkah 2: Didapat selisih seberat \n2,88 × 106 −0,24 × 106 = 2,64 × 106 liter/menit (nilai numeriknya tidak cocok gap rujukan target \ndi 2,4 × 104 L/menit)."},{"text":"Total pasokan zat alir yang mampu ditransfer dari pintu saluran air Waduk C murni secara \nberturut-turut dalam masa aktif 5 jam pengoperasian mencapai 7,2 × 107 liter.","answer":"Benar","explanation":"Langkah 1: Saluran penggerak hulu Waduk C merambat sebanyak 2,4 × 105 liter per menit. \nLangkah 2: Masa jalajah sisa waktu 5 jam dikalibrasi ke menit adalah 5 × 60 = 300 = 3,0 × 102 \nmenit. Langkah 3: Total gelontoran volume yang meluncur konstan adalah 2,4 × 105 × 3,0 ×\n102 = 7,2 × 107 liter air."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan mengubah bentuk baku serta \nmenyelesaikan permasalahan kontekstual yang terkait","question":"Superkomputer X di laboratorium meteorologi nasional diandalkan untuk menuntaskan suatu \nproses komputasi skema modeling cuaca badai muson berkekuatan 1,8 × 1016 kali basis data \n\ninstruksi algoritma per satu siklus pengamatan, dengan kemampuan kerja superkomputer \ntersebut berdaya hantar rata-rata 2,5 × 1012 instruksi per detik. Demi percepatan pemetaan, \nsuperkomputer Y berkemampuan proses data senilai 1,5 × 1012 instruksi per detik dialihkan \nmenjadi klaster bantuan dengan pengolahan berskala sinkron paralel bersama superkomputer X. \nBeri tanda centang (✓) pada setiap pernyataan yang benar terkait manajemen kalkulasi estimasi \nwaktu tempuh komputasi yang direncanakan!","statements":[{"text":"Jika dikerjakan sendirian oleh superkomputer pertama, maka waktu pengerjaan simulasi tepat \nbernilai 7,2 × 103 detik.","answer":"Benar","explanation":"Langkah 1: Membagi beban data terhadap kapasitas individual alat, yaitu \n1,8×1016\n2,5×1012 = 0,72 × 104 =\n7,2 × 103 sekon."},{"text":"Total operasi per detik saat kedua superkomputer dijalankan bersamaan mencapai 4,0 × 1024 \noperasi per detik.","answer":"Salah","explanation":"Langkah 1: Menggabungkan daya hantar alih dari dua mesin, 2,5 × 1012 + 1,5 × 1012 diperoleh \nhasil penjumlahan setinggi 4,0 × 1012 op/s. Bukan berupa perkalian perpangkatan dasar \nberpangkat eksponen 24."},{"text":"Penggunaan kedua superkomputer secara paralel dapat memotong durasi kerja sebesar \n2,7 × 103 detik dari waktu kerja superkomputer pertama sendirian.","answer":"Benar","explanation":"Langkah 1: Waktu mesin pertama saja adalah 7,2 × 103 = 7.200 detik. Langkah 2: Laju bersama \nsebesar 4,0 × 1012, durasi paralel didapat \n1,8×1016\n4,0×1012 = 4.500 detik. Langkah 3: Hitung selisih hemat \nyaitu 7.200 −4.500 = 2.700 detik = 2,7 × 103 detik."},{"text":"Superkomputer kedua membutuhkan waktu kerja total selama 1,2 × 104 detik jika diberi tugas \nmelakukan simulasi tersebut secara mandiri.","answer":"Benar","explanation":"Langkah 1: Menilai beban data diukur kecepatan unit superkomputer Y saja yaitu \n1,8×1016\n1,5×1012 =\n1,2 × 104 detik."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
