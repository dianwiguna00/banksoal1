<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Persamaan Garis Lurus</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT PERSAMAAN GARIS LURUS</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Seorang ojek online mengenakan tarif awal sebesar Rp10.000,00 dan tarif tambahan sebesar \nRp3.000,00 per kilometer yang dinyatakan dengan persamaan biaya 𝑦= 3000𝑥+ 10000. \nBerapakah gradien dari persamaan biaya tersebut?","options":[{"key":"A","text":"3.000"},{"key":"B","text":"10.000"},{"key":"C","text":"13.000"},{"key":"D","text":"30.000"}],"answer":"A","explanation":"Persamaan biaya dinyatakan dalam bentuk linear 𝑦= 𝑚𝑥+ 𝑐, di mana 𝑚 adalah gradien dan 𝑐 \nadalah konstanta tarif awal. \nDari persamaan 𝑦= 3000𝑥+ 10000, koefisien dari variabel 𝑥 adalah 3000. \nJadi, gradien dari persamaan tersebut adalah 3.000. \nJawaban Benar: A"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Dari persamaan garis lurus 𝑦= −3𝑥+ 8, tentukan gradien dari garis tersebut.","options":[{"key":"A","text":"−8"},{"key":"B","text":"−3"},{"key":"C","text":"3"},{"key":"D","text":"8"}],"answer":"B","explanation":"Langkah 1: Identifikasi persamaan garis lurus dalam bentuk umum 𝑦= 𝑚𝑥+ 𝑐, di mana 𝑚 \nmelambangkan gradien garis. \nLangkah 2: Pada persamaan 𝑦= −3𝑥+ 8, koefisien dari 𝑥 adalah −3, sehingga gradiennya \nadalah 𝑚= −3. \nJawaban Benar: B"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Dua buah kabel listrik pada miniatur jaringan listrik dipasang saling tegak lurus. Jika kabel \npertama dimodelkan oleh garis bergradien 5, gradien dari kabel kedua adalah ....","options":[{"key":"A","text":"−5"},{"key":"B","text":"− 1 5"},{"key":"C","text":"1 5"},{"key":"D","text":"5"}],"answer":"B","explanation":"Langkah 1: Gunakan sifat dua garis yang saling tegak lurus, yaitu hasil kali gradiennya adalah −1 \n(𝑚1 ⋅𝑚2 = −1). \nSubstitusikan gradien pertama 𝑚1 = 5 ke dalam rumus: \n5 ⋅𝑚2 = −1 ⇒𝑚2 = −\n1\n5. \nGradien kabel kedua adalah −\n1\n5. \nJawaban Benar: B"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Sebuah industri rumah tangga batik tulis di Solo mencatat total biaya produksi harian yang \nberbanding lurus secara linear dengan jumlah kain batik yang diproduksi. Biaya untuk \nmemproduksi 10 lembar kain adalah Rp1.200.000,00, sedangkan biaya untuk memproduksi 20 \nlembar kain adalah Rp2.000.000,00. Berapakah biaya tetap operasional harian (biaya awal \nsebelum produksi dimulai) dari industri tersebut?","options":[{"key":"A","text":"Rp200.000,00"},{"key":"B","text":"Rp300.000,00"},{"key":"C","text":"Rp400.000,00"},{"key":"D","text":"Rp500.000,00"}],"answer":"C","explanation":"Langkah 1: Cari biaya variabel per kain batik (gradien 𝑚) dari titik (10,1.200.000) dan \n(20,2.000.000): 𝑚=\n2.000.000−1.200.000\n20−10\n=\n800.000\n10\n= 80.000 rupiah per kain. Diperoleh persamaan \nlinear biaya: 𝑦= 80.000𝑥+ 𝑐. \nLangkah 2: Tentukan biaya tetap harian (𝑐) dengan memasukkan nilai dari salah satu titik, \nmisalnya (10,1.200.000): 1.200.000 = 80.000(10) + 𝑐⇒1.200.000 = 800.000 + 𝑐⇒𝑐= 400.000. \nJadi, biaya tetap operasionalnya adalah Rp400.000,00. \nJawaban Benar: C"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Sebuah jalur pendakian di Gunung Merbabu digambarkan pada bidang Kartesius. Jalur A \nmelewati pos 𝑃(2,3) dan pos 𝑄(4,7). Jalur B dirancang sejajar dengan Jalur A dan harus \nmelewati pos 𝑅(1,5). Persamaan garis yang merepresentasikan Jalur B adalah ....","options":[{"key":"A","text":"2𝑥−𝑦−3 = 0"},{"key":"B","text":"2𝑥−𝑦+ 3 = 0"},{"key":"C","text":"2𝑥−𝑦+ 7 = 0"},{"key":"D","text":"2𝑥−𝑦+ 11 = 0"}],"answer":"B","explanation":"Langkah 1: Tentukan gradien Jalur A (𝑚𝐴) yang melalui titik 𝑃(2,3) dan 𝑄(4,7) menggunakan \nrumus gradien: 𝑚𝐴=\n𝑦2−𝑦1\n𝑥2−𝑥1 =\n7−3\n4−2 =\n4\n2 = 2. Karena Jalur B sejajar dengan Jalur A, maka gradien \nJalur B juga bernilai sama, yaitu 𝑚𝐵= 2. \nLangkah 2: Tentukan persamaan garis Jalur B yang melalui pos 𝑅(1,5) dengan gradien 𝑚𝐵= 2 \nmenggunakan rumus: 𝑦−𝑦1 = 𝑚(𝑥−𝑥1) ⇒𝑦−5 = 2(𝑥−1) ⇒𝑦−5 = 2𝑥−2 ⇒2𝑥−𝑦+ 3 = 0. \nJawaban Benar: B"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Sebuah garis lurus melalui titik (4,2) dan memiliki gradien −\n1\n2. Titik potong garis tersebut dengan \nsumbu 𝑋 adalah ....","options":[{"key":"A","text":"(0,4)"},{"key":"B","text":"(0,8)"},{"key":"C","text":"(4,0)"},{"key":"D","text":"(8,0)"}],"answer":"D","explanation":"Langkah 1: Menyusun persamaan garis lurus yang melalui titik (4,2) dengan gradien 𝑚= −\n1\n2. \n𝑦−𝑦1 = 𝑚(𝑥−𝑥1) ⟹ 𝑦−2 = −\n1\n2 (𝑥−4) ⟹ 𝑦−2 = −\n1\n2 𝑥+ 2 ⟹ 𝑦= −\n1\n2 𝑥+ 4. \nLangkah 2: Menentukan titik potong garis tersebut dengan sumbu 𝑋, yang terjadi saat 𝑦= 0. \n0 = −\n1\n2 𝑥+ 4 ⟹ \n1\n2 𝑥= 4 ⟹ 𝑥= 8. Koordinat titik potongnya adalah (8,0). \nJawaban Benar: D"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Sebuah tangki air di perkebunan kelapa sawit mengalami kebocoran konstan. Pengawas \nmencatat bahwa pada jam ke-2 volume air tersisa 360 liter, dan pada jam ke-5 volume air tersisa \n270 liter. Hubungan antara waktu dalam jam dan volume air di dalam tangki membentuk fungsi \nlinear. Berapakah liter volume air awal di dalam tangki sebelum terjadi kebocoran?","options":[{"key":"A","text":"360 liter"},{"key":"B","text":"380 liter"},{"key":"C","text":"400 liter"},{"key":"D","text":"420 liter"}],"answer":"D","explanation":"Menentukan laju kebocoran air per jam (gradien 𝑚): 𝑚=\n270−360\n5−2\n=\n−90\n3 = −30 liter/jam. \nMenggunakan persamaan fungsi linear volume air 𝑉(𝑡) = 𝑚𝑡+ 𝐶. \n\nSubstitusi 𝑡= 2 dan 𝑉(2) = 360 ke persamaan: 360 = −30(2) + 𝐶 ⟹ 360 = −60 + 𝐶 ⟹ 𝐶=\n420. \nNilai konstanta 𝐶= 420 merepresentasikan volume air awal pada saat 𝑡= 0 yaitu sebesar 420 \nliter. \nJawaban Benar: D"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Sebuah taman berbentuk persegi panjang 𝐴𝐵𝐶𝐷 digambar pada bidang koordinat Kartesius. Titik \n𝐴 berada pada koordinat (1,2) dan titik 𝐵 berada pada (5,5). Sisi 𝐵𝐶 tegak lurus terhadap sisi 𝐴𝐵. \nJika titik 𝐶 memiliki koordinat-x bernilai 2, tentukan koordinat-y dari titik 𝐶.","options":[{"key":"A","text":"6"},{"key":"B","text":"7"},{"key":"C","text":"8"},{"key":"D","text":"9"}],"answer":"D","explanation":"Menghitung gradien sisi 𝐴𝐵 (𝑚𝐴𝐵): 𝑚𝐴𝐵=\n5−2\n5−1 =\n3\n4. \nKarena sisi 𝐵𝐶 tegak lurus dengan 𝐴𝐵, maka gradien sisi 𝐵𝐶 (𝑚𝐵𝐶) memenuhi syarat: 𝑚𝐵𝐶⋅\n𝑚𝐴𝐵= −1 ⟹ 𝑚𝐵𝐶= −\n4\n3. \nMenyusun persamaan garis 𝐵𝐶 yang melalui titik 𝐵(5,5): 𝑦−5 = −\n4\n3 (𝑥−5). \nMensubstitusi absis 𝑥= 2 dari titik 𝐶(2, 𝑦𝐶) ke persamaan tersebut: 𝑦𝐶−5 = −\n4\n3 (2 −5) ⟹ 𝑦𝐶−\n5 = −\n4\n3 (−3) ⟹ 𝑦𝐶−5 = 4 ⟹ 𝑦𝐶= 9. \nJawaban Benar: D"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Soni berencana menyewa mobil di Yogyakarta selama 1 hari penuh. Perusahaan Jasa 𝑃 \nmenawarkan tarif sewa Rp200.000 ditambah Rp2.000 per kilometer yang ditempuh. Sementara \nitu, Perusahaan Jasa 𝑄 menawarkan tarif sewa flat Rp350.000 tanpa biaya tambahan per \nkilometer. Jika Soni memperkirakan jarak perjalanan yang akan ia tempuh adalah 85 km, \nmanakah keputusan sewa yang paling hemat?","options":[{"key":"A","text":"Memilih Jasa 𝑃 karena lebih hemat Rp15.000"},{"key":"B","text":"Memilih Jasa 𝑃 karena lebih hemat Rp20.000"},{"key":"C","text":"Memilih Jasa 𝑄 karena lebih hemat Rp20.000"},{"key":"D","text":"Memilih Jasa 𝑄 karena lebih hemat Rp30.000"}],"answer":"C","explanation":"Langkah 1: Hitung total tarif sewa mobil di Perusahaan Jasa 𝑃 untuk jarak 85 km: 𝐵𝑖𝑎𝑦𝑎𝑃=\n200.000 + 2.000(85) = 200.000 + 170.000 = 370.000. \nLangkah 2: Bandingkan dengan tarif sewa mobil di Perusahaan Jasa 𝑄 yang bersifat flat: \n𝐵𝑖𝑎𝑦𝑎𝑄= 350.000. \nLangkah 3: Hitung selisih biaya untuk menentukan pilihan yang lebih hemat: Selisih = 370.000 −\n350.000 = 20.000. Jadi, memilih Jasa 𝑄 lebih hemat sebesar Rp20.000. \nJawaban Benar: C"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Diberikan persamaan garis lurus 4𝑥+ 2𝑦= 8. Beri tanda centang (✓) pada setiap pernyataan \nyang benar mengenai bentuk dan elemen pembentuk dari persamaan garis tersebut!","statements":[{"text":"Nilai gradien (𝑚) dari persamaan tersebut adalah −2.","answer":"Benar","explanation":"Menghitung secara langsung dari persamaan bertipe implisit menggunakan perbandingan \nkonstanta variabel: 𝑚= −\n𝑎\n𝑏= −\n4\n2 = −2. \nBenar"},{"text":"Titik potong terhadap sumbu-𝑥 terjadi di koordinat (0,4).","answer":"Salah","explanation":"Memotong sumbu-𝑥 pada keadaan saat koordinat 𝑦= 0, yang menghasilkan nilai persamaan \n4𝑥= 8 ⟹ 𝑥= 2. Jadi koordinat potong seharusnya adalah (2,0). \nSalah"},{"text":"Titik potong terhadap sumbu-𝑦 terjadi di koordinat (0,4).","answer":"Benar","explanation":"Keadaan sumbu-𝑦 terpotong apabila nilai koordinat 𝑥= 0, diperoleh persamaan sisa 2𝑦= 8 ⟹\n 𝑦= 4. Jadi berada di koordinat titik (0,4). \nBenar"},{"text":"Jika diubah ke dalam bentuk 𝑦= 𝑚𝑥+ 𝑐, persamaannya menjadi 𝑦= −2𝑥+ 4.","answer":"Benar","explanation":"Memindah posisi suku persamaan aljabar menghasilkan bentuk akhir yaitu 2𝑦= −4𝑥+ 8 yang \nsetara setelah kedua ruas disederhanakan dibagi dua 𝑦= −2𝑥+ 4. \nBenar"}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Diberikan sebuah persamaan garis lurus bentuk implisit 3𝑥−2𝑦+ 6 = 0. Tentukan benar atau \nsalah untuk setiap pernyataan berikut yang membahas penyederhanaan serta komponen dasar \ngaris tersebut!","statements":[{"text":"Bila diubah ke bentuk eksplisit yang setara, persamaan tersebut menjadi 2𝑦= 3𝑥+ 6.","answer":"Benar","explanation":"Memindahkan suku −2𝑦 ke ruas kanan menghasilkan persamaan setara yaitu 3𝑥+ 6 = 2𝑦 atau \ndapat ditulis kembali sebagai 2𝑦= 3𝑥+ 6. \nBenar"},{"text":"Nilai kemiringan (gradien) dari persamaan garis tersebut adalah 3 2.","answer":"Benar","explanation":"Dari bentuk eksplisit 2𝑦= 3𝑥+ 6, jika kedua ruas dibagi 2 diperoleh 𝑦=\n3\n2 𝑥+ 3. Berdasarkan \nbentuk umum 𝑦= 𝑚𝑥+ 𝑐, gradien m bernilai \n3\n2. \nBenar"},{"text":"Nilai konstanta 𝑐 dari garis tersebut ketika dinyatakan dalam format bentuk umum 𝑦= 𝑚𝑥+ 𝑐 adalah −3.","answer":"Salah","explanation":"Bentuk akhir dari penyederhanaan ruas adalah 𝑦=\n3\n2 𝑥+ 3. Di sini terlihat bahwa konstanta c \nbernilai +3, bukan −3. \nSalah"},{"text":"Grafik garis lurus dari persamaan tersebut memotong sumbu 𝑦 secara tepat di koordinat (0,3).","answer":"Benar","explanation":"Sebuah garis memotong sumbu 𝑦 saat nilai 𝑥= 0. Substitusi nilai ke dalam rumus 𝑦=\n3\n2 (0) + 3 \nmenghasilkan 𝑦= 3, maka koordinatnya adalah (0,3). \nBenar"}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Terdapat dua persamaan garis lurus berbeda pada koordinat Kartesius yaitu 𝑔1: 𝑦= −3𝑥+ 1 dan \n𝑔2: 3𝑥+ 𝑦= 6. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai kedudukan \nkedua garis lurus tersebut!","statements":[{"text":"Gradien garis 𝑔1 bernilai positif yaitu sebesar 3.","answer":"Salah","explanation":"Koefisien variabel bebas dari garis pertama 𝑔1 bernilai negatif, yakni 𝑚= −3. \n\nSalah"},{"text":"Gradien garis 𝑔2 setelah diubah ke bentuk implisit/eksplisit diperoleh sebesar −3.","answer":"Benar","explanation":"Bila bentuk 3𝑥+ 𝑦= 6 diredistribusikan, maka terbentuk bentuk setara 𝑦= −3𝑥+ 6, \nmenunjukkan tingkat kemiringan gradien bernilai −3. \nBenar"},{"text":"Kedua garis tersebut bersifat saling sejajar karena memiliki kemiringan (gradien) yang nilainya sama.","answer":"Benar","explanation":"Persamaan hubungan paralel mendefinisikan kedudukan dua arah garis sejajar sejauh bernilai \nsama kemiringan gradiennya, yaitu 𝑚1 = 𝑚2 = −3. \nBenar"},{"text":"Titik potong grafik persamaan garis 𝑔1 terhadap sumbu tegak koordinat-y berada pada titik (0, −1).","answer":"Salah","explanation":"Mengatur substitusi 𝑥= 0 menghasilkan nilai tinggi perpotongan di sumbu-y pada ordinat 1, \ndengan lokasi titiknya di (0,1). \nSalah"}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Stok gips cetakan perancangan karya kerajinan oleh siswa di sanggar budaya berkurang secara \nberkala secara linear per jam pengabdian. Sisa gips setelah proses produksi kerajinan \nberlangsung selama 2 jam yaitu 16 kg, lalu sesudah berjalan mencapai 5 jam sisa bahan \nmenyusut di kisaran 10 kg saja. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Volume persentasi pemakaian konsumsi pembubutan sisa persediaan serbuk gips itu secara tegar luruh sebanyak 3 kg di tiap durasi jalannya produksi kerajinan per jam.","answer":"Salah","explanation":"Rasio per jam penggunaan (gradien turun) didapatkan dari pengolahan selisih angka jumlah \nmassa material: 𝑚=\n10−16\n5−2 =\n−6\n3 = −2 kg per jam. Penyusutan aslinya adalah sebesar 2 kg di \nsetiap waktu operasi pembuatan per jam, bukan 3 kg. \nSalah"},{"text":"Total bahan dasar utama mineral bongkah gips penyusun duga semula sebelum aktivitas pembelahan dimulai di posisi 0 jam seberat 18 kg.","answer":"Salah","explanation":"Perhitungkan nilai persediaan sediaan dasar (intersep) dari persamaan aljabar menggunakan \ndata yang diketahui yaitu titik (2,16): 16 = −2(2) + 𝑐⇒𝑐= 20 kg. Bobot timbangan sisa di awal \nkegiatan fungsional senilai 20 kg. \nSalah"},{"text":"Dengan laju pembongkaran yang senantiasa ajeg konstan stabil tersebut bahan asupan mineral tanah serbuk gips terancam lunas tak berbekas dalam rentang waktu perolehan 10 jam lamanya.","answer":"Benar","explanation":"Lakukan verifikasi waktu ketika seluruh isi dari kantong sisa mencapai keadaan bobot kosong \nbernilai habis 𝑦= 0: 0 = −2𝑥+ 20 ⇒2𝑥= 20 ⇒𝑥= 10. Hasil pembuktian menyetujui sisa habis \ntepat pada 10 jam pengerjaan. \nBenar"},{"text":"Aturan keterikatan linear pola dalam menjelaskan berkurangnya sisa pasokan massa gips (𝑦) di jam ke-𝑥 didokumentasikan bernilai rincian 𝑦= −2𝑥+ 20.","answer":"Benar","explanation":"Dengan menetapkan pergerakan gradien bersumbu miring searah 𝑚= −2 bersama bilangan \nintersep y posisi awal 𝑐= 20, ditarik rute persamaan lintasan relasi linear 𝑦= −2𝑥+ 20. \nBenar"}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Garis lintasan lurus dinotasikan dengan 𝑔 dibentangkan lurus melalui posisi-posisi titik kartesius \n𝐴(−2,3) dan 𝐵(2,5). Terdapat garis kedua bernilai garis tegak lurus ℎ yang berinterseksi silang \nmembelah garis 𝑔. Beri tanda centang (✓) pada setiap pernyataan yang benar mengenai \nkalkulasi nilai hubungan sifat tegak lurus kedua kemiringan!","statements":[{"text":"Tingkat besaran kemiringan gradien asli milik garis dasar g diperoleh bernilai angka 1/2.","answer":"Benar","explanation":"Menghitung gradien garis g: m_g = (5 − 3) / (2 − (−2)) = 2 / 4 = 1/2. Jadi pernyataan ini benar."},{"text":"Gradien garis lintasan persilangan tegak lurus h diidentifikasikan dengan harga hitungan nilai sebesar negatif 2.","answer":"Benar","explanation":"Gunakan aturan garis tegak lurus: m_g × m_h = −1. Karena m_g = 1/2, maka 1/2 × m_h = −1 sehingga m_h = −2."},{"text":"Kalkulasi teoritis persilangan siku antar dua nilai garis menghasilkan formula hasil kalinya wajib senilai −1.","answer":"Benar","explanation":"Berdasarkan sifat dua garis yang saling tegak lurus, hasil kali kedua gradiennya adalah m1 × m2 = −1."},{"text":"Apabila diasumsikan garis siku h diletakkan melewati posisi pusat koordinat awal (0,0), maka model fungsinya bernilai y = 2x.","answer":"Salah","explanation":"Gradien garis h adalah −2, sehingga model garis yang melalui (0,0) seharusnya y = −2x, bukan y = 2x."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Konversi suhu antara satuan Celcius (𝐶) dan Reamur (𝑅) didasari hubungan fungsi persamaan \nlinear yang sederhana dan proporsional. Tercatat ketika instrumen di suhu ruangan mengukur \nCelcius sebesar 25∘, indikasi angka Reamur menampilkan 20∘. Sementara kala diuji di 60∘ \nCelcius, skala pembacaan berada di 48∘ Reamur. Tentukan benar atau salah untuk setiap \npernyataan berikut!","statements":[{"text":"Besaran tingkat kemiringan grafik koefisien dari konversi sistem ukuran tersebut adalah senilai rasio 4 5.","answer":"Benar","explanation":"Gradien penentuan koordinat linear sumbu 𝑅 terhadap sumbu 𝐶 mengandalkan analisis dasar: \n𝑚=\n48−20\n60−25 =\n28\n35 =\n4\n5 = 0.8. \nBenar"},{"text":"Lintasan konversi suhu termometer jika diposisikan digambar dalam sistem koordinat kartesius tepat lurus menyentuh poros koordinat pusat (0,0).","answer":"Benar","explanation":"Substitusikan parameter dari titik ke-1 untuk intersep konstanta 𝑐: 20 =\n4\n5 (25) + 𝑐⇒20 = 20 +\n𝑐⇒𝑐= 0. Karena konstanta pergeseran sumbu bernilai 0, garis pasti melalui (0,0). \nBenar"},{"text":"Kondisi air diuji mendidih mencapai level panas di 100∘ Celcius menyisakan hitungan kesetaraan sebesar 90∘ Reamur.","answer":"Salah","explanation":"Memakai pengoperasian hubungan fungsional didapatkan kalkulasi linear dari suhu aslinya: 𝑅=\n0.8 × 𝐶. Di saat dimasuki level nilai Celcius sebesar 100∘, maka didapatkan Reamur: 0.8 × 100 =\n80∘ Reamur (bukan 90∘). \nSalah"},{"text":"Formula yang mengatur nilai besaran konversi fungsi model nilai Reamur berdasarkan parameter masukan Celcius diuji berupa relasi fungsi 𝑅= 0.8𝐶.","answer":"Benar","explanation":"Berdasar langkah hitung didapat arah gradien 𝑚=\n4\n5 = 0.8 dan juga konstanta intersep sebesar \n𝑐= 0, dengan demikian formula pembentuk bernilai 𝑅= 0.8𝐶. \nBenar"}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Pengoperasian sistem pompa hidrolik suplai limpasan parit embung mini ladang kering direkap \nketinggian pas air di dalam wadah takaran dalam satuan sentimeter (ℎ) berpatokan lamanya \nberputar kipas sedotan pemompa dalam durasi jam bilangan menit yang dinyatakan (𝑡) mengitari \n\naliran linier rata konstan. Detik pencatatan sela mencatat manakala penguras baru berjalan \nmelangkah porsi durasi 5 menit sisa penampang muai meninggi terhitung di kuantitas pas \nsetinggi 50 cm. Sewaktu waktu monitoring melesat melaju meninggi sampai berada di tingkat \npengerukan di durasi waktu menginjak menit ke-20 ketinggian air berkembang naik seiring debit \npompa mengisi pas setinggi 110 cm. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Tingkat pemompaan suplai fluida mendatangkan elevasi naik cairan bendung di kurva rata perubahan dinamis (yaitu arah gradien) berada stabil di laju nominal kuantitas sebesar 4 sentimeter cm di setiap lewatnya penanda menit piringan.","answer":"Salah","explanation":"Formula dari penyusun laju aliran tampungan air embung kering: (𝑡1, ℎ1) = (5,50) serta (𝑡2, ℎ2) =\n(20,110). Menganalisis parameter laju atau tingkat kenaikan debit linear spiral yaitu sumbu \ngradien m: 𝑚=\n110−50\n20−5 =\n60\n15 = 4. Laju meningginya fluida bertambah sebanyak 4 cm per satu \nsatuan waktu durasi menit mengalir, sejalan porsi gradien fungsi. CATATAN KUALITAS SUMBER: PDF menampilkan pernyataan sebesar 4 cm dan perhitungan juga menghasilkan 4 cm, tetapi kunci PDF menandai Salah. Butir ini perlu diperiksa atau dikoreksi oleh penyusun."},{"text":"Jika diuji saat bermulanya tarikan awal penyerotan suplai kubangan lumpur air diletakkan (pompa mula-mula digulirkan sewaktu masa selang awal durasi di letak menit ke-0), ketinggian tumpahan cairan pas bertengger di porsi kedalaman sebesar 30 cm.","answer":"Benar","explanation":"Dapatkan persekutuan as sumbu dasar linear ordinat (intersep sumbu ketinggian c) untuk muara \ndi posisi jam awal tatkala durasi berada di nol melalui korelasi PGL model wadah tampung \nbendung: ℎ−50 = 4(𝑡−5) ⟹ ℎ= 4𝑡−20 + 50 ⟹ ℎ(𝑡) = 4𝑡+ 30 cm. Evaluasi sewaktu \npompa perdana bergerak aktif mengisi tangki wadah air parit di masa selang 𝑡= 0: ℎ(0) = 4(0) +\n30 = 30 cm. Ketinggian sisa dari penampung lumpur air bendung mini mula pertama adalah 30 \ncm. \nBenar"},{"text":"Elevasi muai dari kedalaman aliran bendung ladang pertanian dicalonkan meluber menyentuh penunjuk garis angka pas berkapasitas kedalaman level 150 sentimeter cm sejalan bergulirnya operasional pompa pengeruk di waktu menit ke-30.","answer":"Benar","explanation":"Untuk memastikan sisa keandalan tebakan fungsional porsi level ketinggian ini, masukkan \nvariabel operasional di masa pengisian dilarutkan sejauh selang 𝑡= 30 menit di fungsi linier \nbendungan air sawah yang disubstitusikan: ℎ(30) = 4(30) + 30 = 120 + 30 = 150 cm. Melalui \npenyelesaian komparatif dari data model diperoleh ketinggian elevasi setinggi pas berjarak level \n150 sentimeter cm yang bernilai sah. \nBenar"},{"text":"Peristiwa penambahan debit masukan genangan irigasi pertanian berpasang fungsional secara konstan tersebut ditekankan menyandang karakteristik fungsi linear melaju turun tajam berarah gradien berharga negatif.","answer":"Salah","explanation":"Debit sumur masukan tumpahan air ladang bekerja menaikkan air sejalan bertambahnya menit \n(𝑡) dengan sisa takaran makin tinggi meluap menyentuh kedalaman sentimeter air wadah (ℎ), \nmengukuhkan pilar kemiringan gerak linear naik dinamis menyilang arah Kartesius kanan atas \n(koefisien gradien 𝑚= 4 bermutu positif, melarang sifat asimilasi berharga berkarakter negatif). \nSalah"}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Di sebuah lokasi kawasan komersil metropolitan modern ditetapkan dua opsi alternatif pangkalan \ntempat penyewaan sewa parkir eksklusif kendaraan bermobil. Di lingkungan zona wilayah Parkir \nArea I durasi pemanfaatan tarif parkir konstan setelah dikonsumsi bertarif senilai Rp14.000,00 \nsetelah masa pakai 2 jam dan melaju tarifnya Rp26.000,00 setela sewa menyentuh jangka lama \nsimpan parkir berjalan di level 5 jam. Sementara di lokasi saingan sekitarnya Parkir Area II \nmenyandarkan penulisan perincian model matematis biaya fungsi linear terukur formula \nberbentuk formula 𝑌= 3500𝑥+ 8000 (di mana 𝑥 menyatakan jam dan 𝑌 rupiah). Tentukan benar \natau salah untuk setiap pernyataan berikut!","statements":[{"text":"Berdasarkan rujukan rincian pengolahan, harga pelaju tingkat tarif kenaikan parkir tambahan konstan per jam masa sewa pakai mobil sesudah pengisian dasar waktu harian berlakunya parkir Area I adalah senilai Rp4.000,00.","answer":"Benar","explanation":"Langkah 1: Sajikan dua titik posisi hubungan linier parkir harian pada opsi parkiran Area I menjadi \nletak posisi (2,14000) serta koordinat sebanding lainnya (5,26000). Langkah 2: Lakukan \npergerakan mencari hitungan gradien kenaikan parkir stabil: 𝑚1 =\n26000−14000\n5−2\n=\n12000\n3\n= 4000. \nLangkah 3: Didapatkan kelayakan bertumbuhnya kenaikan tarif stabil tambahan Parkir Area I \nyang sah secara berdaya nyata meluncur senilai harga besaran Rp4.000,00. \nBenar"},{"text":"Pangsa beban utama pembuka pembayaran jasa pengoperasian mula tetap mula-mula dari biaya sewa simpan sebelum terhitung waktu berjalannya jam pemakaian parkir di penataan Parkir Area I dipastikan dipatok di tarif permulaan sebesar Rp6.000,00.","answer":"Benar","explanation":"Langkah 1: Siapkan rute fungsional untuk pangkalan satu menggunakan kemiringan arah \npenunjuk stabil di angka gradien tarif 𝑚1 = 4000. Langkah 2: Model linear ditulis sebagai 𝑌=\n4000𝑥+ 𝐶. Pilih ordinat (2,14000) dalam penghitungan: 14000 = 4000(2) + 𝐶⇒14000 = 8000 +\n𝐶. Langkah 3: Dapat ditentukan secara valid konstanta intercept pembayaran dasar biaya muka-\nmuka sebelum durasi pemarkiran bergerak bertambah yaitu sebesar nilai mutlak Rp6.000,00. \nBenar"},{"text":"Sewa di pangkalan lokasi Parkir Area II mengonsumsi nominal keuangan relatif jauh lebih boros mahal bagi kantong pemilik simpan bilamana menyewa melingkupi kurun sewa pas melintasi angka 4 jam penuh pemanfaatan.","answer":"Salah","explanation":"Langkah 1: Tentukan persaman menyeluruh pengeluaran Parkir Area I: 𝑌𝐼= 4000𝑥+ 6000. Jika \ndicari untuk lama waktu sewa berjalan pas pada kuantitas 4 jam: 𝑌𝐼(4) = 4000(4) + 6000 =\n𝑅𝑝22.000,00. Langkah 2: Hitung pengeluaran sewa opsi Parkir Area II jika memakai limitasi \nvariabel yang sama 𝑥= 4 ke fungsionalnya: 𝑌𝐼𝐼(4) = 3500(4) + 8000 = 14000 + 8000 =\n𝑅𝑝22.000,00. Langkah 3: Karena hasil sewa seimbang setara (yakni pas bernilai pengeluaran \nRp22.000,00 di kedua opsi), maka dakwaan Parkir Area II terdeteksi relatif boros mahal berjarak \nkontras dari Parkir Area I di angka waktu tersebut terbukti keliru karena keduanya seimbang \nseragam nilainya. \nSalah"},{"text":"Teruntuk masa pendiaman berdiam lama kompartemen parkir berkendara jauh lama menyimpang memanjang di rentang garis besar lama simpan parkir melangkahi kuantitas limit melingkari nilai di atas durasi waktu berjalan selama 4 jam, letak Area II berpredikat alternatif penghematan keuangan relatif paling menjanjikan.","answer":"Benar","explanation":"Langkah 1: Selisihkan besar pertumbuhan biaya masing-masing pilar opsi. Kecepatan pangkalan \nArea I (4000 rupiah/jam) beranjak mendaki jauh melebihi kecepatan pangkalan Area II (3500 \n\nrupiah/jam). Langkah 2: Diketahui jembatan penjelajah penampang kedua pilar membelah titik \nkoordinat setara silang biaya pada kedudukan 𝑥= 4. Langkah 3: Berpijak dari hasil banding laju \ntersebut, penambahan unit masa sewa 𝑥> 4 jam mendaki di area I memicu lompatan tagihan \nlebih terjal sedangkan area II berkarakter daki melandai murah (sehingga jauh bernilai hemat \nfungsionalnya untuk dipilih). \nBenar"}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi dan menyelesaikan masalah yang berkaitan \ndengan fungsi linear dan grafiknya (fungsi yang grafiknya berupa \ngaris lurus, berbentuk umum y = ax + b, dengan a dan b sebagai \nkonstanta, grafik berupa garis lurus, gradien/kemiringan) serta \nmembedakan dengan fungsi non linear.","question":"Pengamat UMKM mengobservasi hubungan linear murni antara tren ketetapan patokan kuantitas \nunit produk lokal terhadap kisaran harganya di sentra perkulakan barang. Dari rekaman survei \nempiris yang diperoleh di gerai utama, pada skema penawaran produsen secara linear \ndisederhanakan mengikuti laju persilangan 𝑄𝑠= 0,01𝑃−30 (di mana 𝑃 nominal rupiah per unit). \nSebaliknya pada dinamika pembeli produk terdeteksi jika saat tingkat barang bernilai tinggi di \npatokan seharga Rp10.000,00 jumlah unit komoditi barang yang bersedia diambil pembeli di \npasaran adalah 100 unit, dan jumlah ini tumbuh menjadi sebanyak 140 unit produk pada masa \nketika patokan nilainya diskon turun di harga Rp8.000,00 per unit. Beri tanda centang (✓) pada \nsetiap pernyataan yang benar!","statements":[{"text":"Gradien fisis penurunan jumlah serapan produk akibat fluktuasi as harga pada relasi garis linier permintaan memiliki nilai kelajuan fisis konstan sebesar −0,02.","answer":"Benar","explanation":"Garis lintasan lurus fungsi permintaan 𝑄𝑑 ditelaah atas titik (10000,100) dan (8000,140) \nmenghasilkan koefisien kemiringan fungsional permintaan yaitu 𝑚𝑑=\n140−100\n8000−10000 =\n40\n−2.000 = −0,02. \nBenar"},{"text":"Formulasi dari rupa garis fungsional lurus persamaan fisis garis fungsi permintaan dipetakan dengan tepat melahirkan rumusan rumus yaitu 𝑄𝑑= −0,02𝑃+ 300.","answer":"Benar","explanation":"Konstruksi fungsional model koordinat diatur bertitik lewat 𝑄𝑑−100 = −0,02(𝑃−10.000) ⇒𝑄𝑑−\n100 = −0,02𝑃+ 200 ⇒𝑄𝑑= −0,02𝑃+ 300. \nBenar"},{"text":"Keseimbangan seimbang pasar di antara pembuat dan konsumen (keadaan keseimbangan murni) terbentuk selaras tatkala banderol harga bertengger tepat di nominal Rp11.000,00.","answer":"Benar","explanation":"Posisi titik keseimbangan disinkronisasikan berbanding sepadan melalui 𝑄𝑑= 𝑄𝑠⇒−0,02𝑃+\n300 = 0,01𝑃−30 ⇒330 = 0,03𝑃⇒𝑃= 11.000 rupiah. \nBenar"},{"text":"Pada tingkatan pasar penyeimbang kuantitas unit jumlah kelayakan yang dikontribusikan pabrikan tersebar sepadan di batas sebaran 90 unit produk hiasan.","answer":"Salah","explanation":"Memasukkan angka 𝑃= 11.000 ke model keseimbangan diperoleh 𝑄𝑠= 0,01(11.000) −30 =\n110 −30 = 80 unit produk yang setara dialokasikan laku, bukan sebesar 90 unit. \nSalah"}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
