<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Sampel dan Populasi</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT SAMPEL DAN POPULASI</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Dinas Kesehatan suatu kabupaten ingin mengetahui tingkat kebersihan air sumur milik warga di kabupaten tersebut yang berjumlah 10.000 sumur. Karena keterbatasan waktu dan biaya, petugas hanya mengambil sampel air dari 100 sumur warga yang tersebar secara acak. Tujuan utama dari pengambilan sampel dalam kegiatan tersebut adalah untuk ....","options":[{"key":"A","text":"membuat hasil pemeriksaan air sumur menjadi mutlak benar tanpa kesalahan"},{"key":"B","text":"menghemat waktu, tenaga, dan biaya dalam pengumpulan data kebersihan air"},{"key":"C","text":"meningkatkan jumlah sumur warga yang memiliki air bersih di kabupaten tersebut"},{"key":"D","text":"memastikan seluruh sumur warga diperiksa satu per satu oleh petugas kesehatan"}],"answer":"B","explanation":"Pengambilan sampel dilakukan ketika meneliti seluruh populasi (sensus) tidak memungkinkan \nkarena keterbatasan tertentu. \nTujuan utama dari pengambilan sampel (sampling) adalah agar dapat memperoleh data yang \nmewakili populasi dengan lebih efisien dalam hal waktu, tenaga, dan biaya. \nJawaban Benar: B"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Seorang peneliti ingin mengetahui tingkat kepuasan warga Desa Makmur terhadap layanan kesehatan di puskesmas setempat. Peneliti tersebut menyebarkan kuesioner kepada 50 warga yang kebetulan sedang berkunjung ke puskesmas pada hari Senin. Populasi dalam penelitian tersebut adalah ....","options":[{"key":"A","text":"50 warga Desa Makmur yang mengisi kuesioner"},{"key":"B","text":"petugas kesehatan yang bekerja di puskesmas Desa Makmur"},{"key":"C","text":"seluruh pengunjung puskesmas pada hari Senin saja"},{"key":"D","text":"seluruh warga Desa Makmur"}],"answer":"D","explanation":"Langkah 1: Mengidentifikasi objek penelitian secara keseluruhan (populasi). Objek yang ingin \nditeliti adalah tingkat kepuasan warga Desa Makmur terhadap layanan kesehatan, sehingga \npopulasinya adalah seluruh warga Desa Makmur. \nJawaban Benar: D"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Pak Budi ingin mengetahui tingkat kelayakan huni dari seluruh rumah di Desa Makmur yang berjumlah 500 rumah. Agar sampel yang diambil representatif dan menghemat biaya, langkah yang paling tepat dilakukan oleh Pak Budi adalah ....","options":[{"key":"A","text":"memeriksa seluruh 500 rumah yang ada di Desa Makmur"},{"key":"B","text":"memilih secara acak 50 rumah yang tersebar merata di seluruh wilayah Desa Makmur"},{"key":"C","text":"hanya memeriksa 10 rumah terdekat dari jalan raya utama Desa Makmur"},{"key":"D","text":"memeriksa rumah-rumah milik kerabatnya sendiri saja yang ada di Desa Makmur"}],"answer":"B","explanation":"Sampel yang representatif harus diambil secara acak dan tersebar secara merata agar dapat \nmewakili seluruh karakteristik populasi tanpa bias. \nMemilih secara acak 50 rumah yang tersebar di seluruh wilayah desa merupakan pilihan terbaik \nuntuk mewakili 500 rumah dengan efisien. \nJawaban Benar: B"},{"number":4,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah penelitian dilakukan terhadap lahan pertanian di suatu kecamatan dengan total luas 800 hektar, yang terdiri atas 480 hektar lahan persawahan dan 320 hektar lahan perkebunan. Peneliti ingin mengambil sampel tanah dari total 50 hektar lahan secara proporsional. Berapakah luas lahan perkebunan yang harus diambil sampel tanahnya?","options":[{"key":"A","text":"15 hektar."},{"key":"B","text":"20 hektar."},{"key":"C","text":"30 hektar."},{"key":"D","text":"32 hektar."}],"answer":"B","explanation":"Langkah 1: Tentukan proporsi luas lahan perkebunan dari total luas lahan pertanian. Proporsi \nlahan perkebunan adalah \n320\n800 = 40%. \nLangkah 2: Hitung luas lahan perkebunan dalam sampel. Luas lahan perkebunan yang harus \ndiambil sampelnya adalah 40% × 50 = 20 hektar. \nJawaban Benar: B"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah survei kesehatan gizi anak dilakukan di sebuah posyandu yang memiliki populasi sebanyak 80 balita terdaftar. Jika tim kesehatan menentukan ukuran sampel menggunakan pecahan sampling sebesar 15%, berapakah sisa balita dalam populasi yang tidak terpilih menjadi anggota sampel?","options":[{"key":"A","text":"12 balita"},{"key":"B","text":"15 balita"},{"key":"C","text":"65 balita"},{"key":"D","text":"68 balita"}],"answer":"D","explanation":"Langkah 1: Menghitung jumlah balita yang terpilih menjadi sampel dengan mengalikan \npersentase pecahan sampling dengan total populasi, yaitu 15% × 80 = 12 balita. \nLangkah 2: Menghitung sisa balita dalam populasi yang tidak terpilih dengan mengurangkan total \npopulasi dengan ukuran sampel, yaitu 80 −12 = 68 balita. \nJawaban Benar: D"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah festival kuliner di Bandung dikunjungi oleh 800 orang, yang terdiri atas 480 pengunjung perempuan dan 320 pengunjung laki-laki. Panitia ingin melakukan survei kepuasan rasa makanan tradisional dengan mengambil sampel sebanyak 80 pengunjung menggunakan teknik stratifikasi proporsional. Berapa jumlah pengunjung perempuan yang terpilih sebagai sampel?","options":[{"key":"A","text":"24 orang"},{"key":"B","text":"32 orang"},{"key":"C","text":"40 orang"},{"key":"D","text":"48 orang"}],"answer":"D","explanation":"Langkah 1: Menentukan proporsi pengunjung perempuan terhadap total populasi pengunjung. \nProporsi perempuan = \n480\n800 = 0,6. \nLangkah 2: Menghitung jumlah sampel pengunjung perempuan yang harus dipilih dari total 80 \nsampel. \nJumlah sampel perempuan = 0,6 × 80 = 48 orang. \nJawaban Benar: D"},{"number":7,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Perpustakaan daerah ingin mengetahui tingkat kepuasan pengguna layanan digital yang terdiri atas populasi sebanyak 1200 siswa, 600 guru, dan 200 masyarakat umum. Direncanakan pengambilan sampel sebanyak 100 orang menggunakan teknik sampling acak terstratifikasi proporsional. Namun, karena kesalahan administrasi, petugas malah mengumpulkan data dari 70 siswa, 20 guru, dan 10 masyarakat umum. Berdasarkan kondisi ini, kelompok manakah yang kelebihan sampel (overrepresented) dan yang kekurangan sampel (underrepresented) jika dibandingkan dengan rencana sampling ideal?","options":[{"key":"A","text":"Guru kelebihan sampel sebanyak 10 orang, sedangkan siswa kekurangan sampel sebanyak 10 orang."},{"key":"B","text":"Masyarakat umum kekurangan sampel sebanyak 10 orang, sedangkan siswa kelebihan sampel sebanyak 10 orang."},{"key":"C","text":"Guru kekurangan sampel sebanyak 10 orang, sedangkan masyarakat umum kelebihan sampel sebanyak 10 orang."},{"key":"D","text":"Siswa kelebihan sampel sebanyak 10 orang, sedangkan guru kekurangan sampel sebanyak 10 orang."}],"answer":"D","explanation":"Langkah 1: Hitung total populasi. Total populasi = 1200 + 600 + 200 = 2000 orang. \nLangkah 2: Tentukan proporsi ideal masing-masing kelompok. Siswa = \n1200\n2000 = 60%, Guru = \n600\n2000 =\n30%, Masyarakat = \n200\n2000 = 10%. \nLangkah 3: Hitung alokasi sampel ideal untuk total 100 sampel. Sampel siswa ideal = 60 orang, \nSampel guru ideal = 30 orang, Sampel masyarakat ideal = 10 orang. \nLangkah 4: Bandingkan sampel aktual dengan sampel ideal. Siswa aktual = 70 (kelebihan 10 \norang dari 60), Guru aktual = 20 (kekurangan 10 orang dari 30), Masyarakat aktual = 10 (sesuai \ntarget ideal). \nJawaban Benar: D"},{"number":8,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah perusahaan dengan 400 karyawan yang terdiri atas 200 karyawan bagian Penjualan, 120 karyawan bagian Pemasaran, dan 80 karyawan bagian IT, ingin melakukan survei kepuasan kerja dengan mengambil sampel acak terstrata proporsional sebanyak 100 karyawan. Namun, saat survei dilaksanakan, terdapat kendala pengembalian kuesioner: sebanyak 60% dari sampel Penjualan dan 50% dari sampel IT tidak mengembalikan kuesioner, sedangkan seluruh sampel Pemasaran mengembalikannya dengan lengkap. Berapakah persentase kontribusi kuesioner dari karyawan bagian Pemasaran terhadap total kuesioner yang berhasil dikumpulkan kembali?","options":[{"key":"A","text":"20%."},{"key":"B","text":"30%."},{"key":"C","text":"40%."},{"key":"D","text":"50%."}],"answer":"D","explanation":"Langkah 1: Hitung ukuran sampel awal yang dialokasikan untuk masing-masing bagian \nberdasarkan proporsi populasinya: - Penjualan: \n200\n400 × 100 = 50 karyawan. - Pemasaran: \n120\n400 × 100 = 30 karyawan. - IT: \n80\n400 × 100 = 20 karyawan. \nLangkah 2: Hitung jumlah kuesioner yang berhasil dikumpulkan kembali dari masing-masing \nbagian: - Penjualan: 50 × (1 −0.60) = 20 kuesioner. - Pemasaran: 30 × 1.00 = 30 kuesioner. - IT: \n20 × (1 −0.50) = 10 kuesioner. \nLangkah 3: Hitung total kuesioner yang terkumpul: 20 + 30 + 10 = 60 kuesioner. \nLangkah 4: Hitung persentase kontribusi bagian Pemasaran: \n30\n60 × 100% = 50%. \nJawaban Benar: D"},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah sekolah menengah di Yogyakarta ingin mengetahui makanan tradisional kesukaan siswanya dengan populasi sebanyak 600 siswa, yang terdiri atas 300 siswa kelas VII, 180 siswa kelas VIII, dan 120 siswa kelas IX. Sekolah ingin mengambil sampel sebanyak 80 siswa untuk mengisi kuesioner menggunakan teknik acak terstratifikasi proporsional. Terdapat dua usulan alokasi sampel: Adi mengusulkan memilih 40 siswa kelas VII, 24 siswa kelas VIII, dan 16 siswa kelas IX; sedangkan Budi mengusulkan memilih 30 siswa kelas VII, 30 siswa kelas VIII, dan 20 siswa kelas IX. Berdasarkan prinsip keterwakilan sampel, bagaimanakah penilaian yang tepat terhadap kedua usulan tersebut?","options":[{"key":"A","text":"Usulan Adi salah karena jumlah sampel kelas VII terlalu banyak, sedangkan usulan Budi benar."},{"key":"B","text":"Usulan Adi benar karena proporsi sampel tiap tingkat kelas sesuai dengan proporsi populasi, sedangkan usulan Budi salah."},{"key":"C","text":"Kedua usulan salah karena seharusnya setiap tingkatan kelas diwakili oleh jumlah sampel yang sama banyak yaitu 27 siswa."},{"key":"D","text":"Kedua usulan benar karena total siswa yang terpilih dari kedua usulan tersebut sama-sama berjumlah 80 siswa."}],"answer":"B","explanation":"Langkah 1: Tentukan proporsi tiap tingkatan kelas terhadap total populasi. Proporsi kelas VII \nadalah 300/600 = 0,5, kelas VIII adalah 180/600 = 0,3, dan kelas IX adalah 120/600 = 0,2. \nLangkah 2: Kalikan proporsi masing-masing tingkatan dengan ukuran sampel yang direncanakan \n(80 siswa). Sampel kelas VII = 0,5 × 80 = 40 siswa, kelas VIII = 0,3 × 80 = 24 siswa, dan kelas IX \n= 0,2 × 80 = 16 siswa. \nLangkah 3: Bandingkan hasil perhitungan dengan usulan Adi dan Budi. Usulan Adi (40, 24, 16) \npersis sama dengan hasil perhitungan proporsional, sedangkan usulan Budi (30, 30, 20) tidak \nproporsional. \nJawaban Benar: B"},{"number":10,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Dinas Kesehatan di suatu kota ingin mengetahui persentase balita yang telah mendapatkan imunisasi lengkap secara acak dari total 12.000 balita di wilayah tersebut. Petugas mengumpulkan data resmi milik 150 balita dari beberapa puskesmas untuk dianalisis lebih mendalam. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Populasi dari pengamatan survei tersebut mencakup seluruh balita sebanyak 12.000 anak di kota itu.","answer":"Benar","explanation":"Populasi didefinisikan sebagai keseluruhan unit analisis yang menjadi sasaran penelitian, yang \ndalam kasus ini adalah total 12.000 balita di kota tersebut."},{"text":"Sampel dari penelitian yang dilakukan petugas dinas tersebut adalah sejumlah 150 balita.","answer":"Benar","explanation":"Sampel adalah sebagian dari anggota populasi yang diambil untuk mewakili populasi dalam \npengujian, yakni sebanyak 150 balita yang datanya dikumpulkan."},{"text":"Anggota sampel pada kegiatan evaluasi kesehatan tersebut merupakan total populasi sebanyak 12.000 balita.","answer":"Salah","explanation":"Pernyataan ini terbalik; 12.000 merupakan jumlah seluruh anggota populasi, sedangkan \nsampelnya hanya berupa sebagian kecil kelompok saja."},{"text":"Batasan populasi dalam pelaksanaan riset lapangan tersebut dibatasi hanya untuk kelompok 150 balita saja.","answer":"Salah","explanation":"Pernyataan ini salah karena 150 balita adalah jumlah representatif sampel terkecil yang dipilah, \nbukan populasi keseluruhan objek kajian."}]},{"number":11,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Pemerintah daerah menguji kadar kebersihan lingkungan perumahan warga Asri dengan melakukan wawancara langsung terhadap 12 perwakilan kepala keluarga (KK) dari total 300 KK terdaftar. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Sebanyak 300 KK di perumahan Asri merupakan sampel keseluruhan yang diuji kadar kebersihannya oleh pemerintah.","answer":"Salah","explanation":"Lalai dalam perumpamaan, ukuran 300 merupakan total semesta kepala keluarga perumahan \nalias kuantitas keseluruhan subjek populasi."},{"text":"Seluruh KK yang mendiami wilayah perumahan Asri sejumlah 300 KK terdaftar bertindak sebagai populasi pada survei kebersihan tersebut.","answer":"Benar","explanation":"Benar, objek seutuhnya yang menjadi bahasan sasaran (kepala keluarga sejumlah 300 KK) \ndinilai mutlak merupakan bentuk populasi dari observasi."},{"text":"Pendataan seluruh warga tanpa kecuali, yaitu ke 300 KK sekaligus, merupakan deskripsi dari pengerjaan sampel representatif terkecil.","answer":"Salah","explanation":"Keliru, pemeriksaan mencakup seluruh wilayah bagian yang menyeluruh bukan lagi sistem \npengambilan kelompok sampling melainkan istilah penulisan sensus."},{"text":"Kepala keluarga sebanyak 12 KK terpilih yang diwawancarai merupakan bagian sampel yang dipilih mewakili seluruh populasi perumahan Asri.","answer":"Benar","explanation":"Wawancara dengan jumlah sasaran terbatas (12 KK) mewakili pola keseluruhan kawasan \nperumahan merupakan penentuan pengerjaan bertipe sampel."}]},{"number":12,"level":1,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Seorang juru masak merebus sup kaldu ayam di panci dengan volume total 4 liter. Dirinya menciduk satu sendok makan sup secara seksama guna menilai cita rasa sup buatan itu sebelum dibagikan. Tentukan benar atau salah untuk setiap pernyataan terkait analogi sampel dan populasi ini!","statements":[{"text":"Kuah kaldu ayam sebanyak satu panci penuh merupakan ilustrasi bentuk penarikan dari konsep unit sampel statistik dasar.","answer":"Salah","explanation":"Pernyataan salah karena isi sup penuh di panci yang berjumlah besar tersebut melambangkan \nobjek populasi masakan koki."},{"text":"Kuah sup kaldu kental sebanyak satu sendok makan yang diambil berfungsi mewakili elemen contoh atau sampel pengamatan koki.","answer":"Benar","explanation":"Cairan satu sendok yang diciduk keluar dan siap untuk dicicipi koki berposisi selaku replika atau \nrepresentasi sampel uji rasa."},{"text":"Panci dengan kapasitas masakan total sebesar 4 liter menjadi representasi fisik yang kuat dari analogi cakupan wilayah populasi.","answer":"Benar","explanation":"Wadah wadah sup seberat volume maksimal penampungan merupakan bagian perwujudan \nseluruh batas wilayah cakupan populasi rasa sup."},{"text":"Kuah masakan di satu sendok menceritakan mutu masakan seluruh kuah karena diproses tanpa pergerakan adukan bumbu koki.","answer":"Salah","explanation":"Pernyataan salah karena analogi ini berdasar dari asumsi sup diaduk merata (homogen), \nsehingga porsi satu sendok itu representsatif."}]},{"number":13,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Dalam rangka riset kepustakaan daerah, pengelola ingin mengambil sampel 160 responden dari populasi anggotanya yang terbagi menjadi 400 orang pelajar, 250 orang mahasiswa, dan 150 orang kalangan umum. Pengambilan sampel dilakukan menggunakan teknik proporsional terstrata berdasarkan kelompok anggota. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Sampel untuk kelompok kategori pelajar adalah sebanyak 80 responden.","answer":"Benar","explanation":"Langkah 1: Jumlah total populasi adalah 400 + 250 + 150 = 800 orang. Rasio sampel = \n160/800 = 0,2. Langkah 2: Sampel pelajar = 400 × 0,2 = 80 responden. Pernyataan ini benar."},{"text":"Sampel untuk kelompok kategori mahasiswa adalah sebanyak 50 responden.","answer":"Benar","explanation":"Langkah 1: Rasio sampel adalah 0,2. Langkah 2: Sampel mahasiswa = 250 × 0,2 = 50 \nresponden. Pernyataan ini benar."},{"text":"Sampel untuk kelompok kategori kalangan umum adalah sebanyak 25 responden.","answer":"Salah","explanation":"Langkah 1: Rasio sampel adalah 0,2. Langkah 2: Seharusnya sampel untuk kategori umum \nadalah 150 × 0,2 = 30 responden, bukan 25 responden. Pernyataan ini salah."},{"text":"Rasio jumlah sampel kategori pelajar terhadap kategori kalangan umum adalah 8: 3.","answer":"Benar","explanation":"Langkah 1: Hitung sampel pelajar (80 orang) dan kalangan umum (30 orang). Langkah 2: \nSederhanakan rasionya yaitu 80: 30 = 8: 3. Pernyataan ini benar."}]},{"number":14,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Di sebuah lingkungan jenjang kelas binaan ekstrakurikuler kepanduan terpencar, sub peminat pencinta pramuka diduduki kuantitas massanya oleh sebanyak 50 remaja, pengikut unit orkestrasi alat seni musik modern mencengkeram 30 partisipan belia, serta sisa baris sayap adalah peminat tim naskah inovasi riset KIR berkekuatan sisa 20 murid tangguh dari basis populasi berskala gabungan utuh bernilai sejumlah 100 orang siswa terafiliasi resmi satu klub terpadu tanpa keikutsertaan cabang olahraga lain. Penentu andil mengantarkan kuota bertingkat berlandaskan keterwakilan adil proporsional terpilih sampel kerja senilai sebanyak 20 murid koordinator jajaran eksekutif kepemudaan. Tentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Hasil operasional kompilasi kalkulator pembagian beruntun mendaulatkan bila dari kelompok beraliran bidang sub-ekstra minat kepanduan pramuka ideal dipasang tepat di bobot kedudukan kuantitatif sebesar 10 kader koordinator terpilih.","answer":"Benar","explanation":"Berdasar atas pijakan jatah proporsi keterlibatan faksi kepanduan penilai yang merata: \n(\n50\n100) × 20 = 10 kuota representatif pembina asrama terpilih."},{"text":"Asisten peneliti memboyong sebanyak 10 porsi koresponden secara seimbang bersiap mendaulat kontribusi tanggapan yang khusus mewadahi para remaja kreatif di asuhan naskah inovasi ilmiah bergenre riset KIR.","answer":"Salah","explanation":"Rumusan pencocokan data jatah keterwakilan bidang KIR dihitung proporsional melahirkan \nangka hitung aseli: (\n20\n100) × 20 = 4 koresponden pengabdi karya terpilih murni."},{"text":"Bobot kontribusi pengaruh aseli yang disuarakan untuk meyakinkan aspirasi kelompok faksi anak seni musik modern didapuk murni andil kedudukannya menyamai patokan kuota kuantitatif sebesar 6 koordinator tangguh terpilih.","answer":"Benar","explanation":"Perpaduan stratifikasi pilar olah data kesenian menyodorkan alur: (\n30\n100) × 20 = 6 partisipan murni \nyang bertengger di formasi jatah kepanitiaan sampel jajak minat seni suara."},{"text":"Besaran gabungan pengisian isian draf suara dari asuhan bidang ekstra kombinasi terpadu bernilai muatan karya inovasi riset KIR apabila dikoordinasikan setara padat nilainya di sayap musik sanggup bersanding mengimbangi volume bagian kelompok faksi kepanduan pramuka utuh secara berkeadilan seimbang.","answer":"Benar","explanation":"Formasi akumulasi dari (Seni Musik + Riset Inovasi) memiliki kekuatan andil korespondensi di \nkomparasi gabungan setara: 6 (Kubu Seni) + 4 (Kubu Riset) = 10 kontributor penggerak \nkelompok sampel yang andil, persis memiliki bobot keseimbangan sebanding jatah bagian \nPramuka tunggal di hitungan percontohan jajak minat pramuka (10 murid)."}]},{"number":15,"level":2,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah klinik kesehatan memiliki 360 pasien dengan penyakit kronis yang terdiri atas 120 penderita diabetes, 160 penderita hipertensi, dan 80 penderita penyakit lainnya. Untuk riset efisiensi layanan, diambil sampel sebanyak 45 pasien menggunakan metode stratifikasi proporsional. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Penderita hipertensi yang dipilih menjadi anggota sampel berjumlah 25 orang.","answer":"Salah","explanation":"Jumlah sampel penderita hipertensi adalah (160/360) × 45 = 20 orang, bukan 25 orang."},{"text":"Selisih sampel penderita diabetes dengan penyakit lainnya dalam penelitian adalah 10 orang.","answer":"Salah","explanation":"Sampel diabetes adalah 15 orang dan penyakit lainnya 10 orang, sehingga selisihnya adalah \n15 −10 = 5 orang, bukan 10 orang."},{"text":"Penderita diabetes yang terpilih ke dalam sampel berjumlah 15 orang.","answer":"Benar","explanation":"Proporsi penderita diabetes dalam sampel adalah (120/360) × 45 = 15 orang."},{"text":"Persentase representasi sampel dari seluruh populasi pasien di klinik tersebut adalah 12,5%.","answer":"Benar","explanation":"Rasio total sampel dibanding populasi keseluruhan adalah 45/360 = 1/8 = 12,5%."}]},{"number":16,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah sekolah menengah memiliki total populasi sebanyak 600 siswa dengan rincian 300 siswa kelas VII, 180 siswa kelas VIII, dan 120 siswa kelas IX. Sekolah tersebut merencanakan survei mengenai literasi digital siswa dan akan menarik sampel sebanyak 10% dari total populasi menggunakan metode stratified random sampling agar keterwakilan proporsional dari setiap tingkatan kelas terjaga. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Jumlah siswa kelas VII yang harus dipilih menjadi sampel agar representatif sesuai proporsi adalah sebanyak 30 siswa.","answer":"Benar","explanation":"Ukuran total sampel adalah 10% × 600 = 60 siswa. Keterwakilan proporsional untuk siswa kelas \nVII dihitung dengan mencari persentase kelompok kelas VII dari total populasi, yaitu \n300\n600 × 100% = 50%. Maka jumlah sampel untuk kelas VII adalah 50% × 60 = 30 siswa."},{"text":"Jumlah sampel untuk gabungan kelas VIII dan kelas IX secara akumulatif adalah sebanyak 30 siswa.","answer":"Benar","explanation":"Dengan menggunakan rasio sampling yang sama yaitu 10% dari jumlah populasinya, sampel \nuntuk kelas VIII adalah 10% × 180 = 18 siswa, dan sampel untuk kelas IX adalah 10% × 120 =\n12 siswa. Jika diakumulasikan, totalnya adalah 18 + 12 = 30 siswa."},{"text":"Apabila pihak sekolah salah menerapkan prosedur dengan mengambil sampel dalam jumlah yang sama banyak dari setiap tingkatan kelas, maka persentase perwakilan siswa kelas VII dalam sampel berkurang sebesar 16,7% dibandingkan persentase proporsinya.","answer":"Benar","explanation":"Secara proporsional asli, representasi siswa kelas VII dalam sampel adalah 50% (yaitu 30 dari 60 \nsiswa). Jika kuota dibuat sama rata untuk setiap strata kelas (masing-masing 20 siswa), \npersentase representasi siswa kelas VII turun menjadi \n20\n60 × 100% = 33,3%. Selisih penurunan \nrepresentasinya adalah 50% −33,3% = 16,7%."},{"text":"Dengan metode stratified sampling, jumlah sampel untuk siswa kelas VIII yang terpilih adalah 15 siswa karena merupakan nilai tengah antara kelas VII dan kelas IX.","answer":"Salah","explanation":"Jumlah sampel harus disesuaikan dengan proporsi populasi dari strata kelas VIII, bukan dari \nmencari rata-rata atau nilai tengah di antara dua kelompok kelas lainnya. Perhitungan sampel \nkelas VIII yang tepat berdasarkan proporsi adalah 10% × 180 = 18 siswa."}]},{"number":17,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Manajemen jaringan kedai kopi di perkotaan mengevaluasi kepuasan transaksi pelanggan dengan menyigi riwayat volume jual tiga cabang yang melayani lalu lintas berlainan per hari: Cabang Selatan melayani 600 transaksi harian, Cabang Pusat melayani 900 transaksi harian, dan Cabang Utara melayani sebanyak 1.500 transaksi harian secara rutin. Analis berkehendak mengaudit data dengan skema aslinya menggunakan sampel sebanyak 120 transaksi yang dirakit berstrata seimbang secara proporsional dari himpunan basis populasinya. Evaluasi penentu mutu menguji rencana banding non-proporsional dengan jalan pemantauan jajak opini sebanyak tepat 40 rekap riwayat di tiap-tiap unit operasional secara mandiri. Tentukan benar atau salah untuk setiap pernyataan yang mendiskusikan bobot perimbangan operasional sampel instansi kedai ini!","statements":[{"text":"Jika tata ukur sampling nasional dirakit melalui strata seimbang tepercaya pada rancangan utama, Cabang Utara diwajibkan untuk melunasi ketersediaan data transaksi survei di bawah unit kajian lapangan senilai tepat 60 data.","answer":"Benar","explanation":"Basis pembebanan kumulatif pelayanan kedai mencakup 600 + 900 + 1.500 = 3.000 rincian \nkuitansi penjualan. Dengan menyerap proporsi target 120/3.000 = 4%, kuota murni sasaran \n\nperwakilan ideal transaksi bagi pergerakan operasional Cabang Utara dirangkum se-nominal \n1.500 × 4% = 60 catatan rujukan survei mutu harian."},{"text":"Penerapan perbandingan pintas kuota terdistribusi merata menjejalkan pengurangan signifikan sebesar tepat sepertiga porsi keterwakilan dari hak kontribusi teoretis porsi asalnya milik data Cabang Utara.","answer":"Benar","explanation":"Jatah representasi ilmiah yang dimiliki aslinya oleh Cabang Utara senilai sebaran sebesar 60 \nkuitansi evaluasi terarah. Teknik survei dengan perataan menjatahkan pengambilan kuota harian \nmerosot hingga se-kadar 40 responden data jual, bias negatif penurunannya mencakup \n20\n60 × 100% = 33.33%, atau penyusutan jatah satu sepertiga porsi huni."},{"text":"Dalam pembagian usulan pengimbang data mandiri (40 catatan per toko), bias meluber melebih-lebihi batas (oversampled) dari jatah penyerapan murni di kedai Cabang Selatan menyentuh kisaran penambahan sejumlah 25 rekap kuitansi belanja.","answer":"Salah","explanation":"Hak alokasi sewajarnya untuk jatah pelayanan kedai Cabang Selatan pada teknik seimbang \nproporsional hanya bernilai 600 × 4% = 24 perwakilan instrumen uji. Dengan draf usulan \nseimbang, Cabang Selatan meloncat didudukkan se-bobot 40 responden, mengalami lonjakan \nmeluap di batas selisih absolut tepat sebanyak 40 −24 = 16 kuota pengamatan lapangan saja."},{"text":"Total kumulatif muatan kontribusi kuota teoretis dari target harian kedai Cabang Selatan ditambah sebaran operasional data survei di Cabang Pusat membungkus persis separuh kontribusi dari keseluruhan rancangan survei terstruktur utama.","answer":"Benar","explanation":"Alokasi target berbobot terarah porsi asalnya dari sub-grup Cabang Selatan (24 unit jajak) \ndijumlahkan porsi sasarannya bagi cabang kedai wilayah Pusat (900 × 4% = 36 kuota jajak huni) \nmenghasilkan sumbangan nilai setara sebesar tepat 60 instrumen kuesioner transaksi, yang \nmerepresentasikan rasio bernilai \n60\n120 = 50% dari seluruh rencana."}]},{"number":18,"level":3,"type":"Analisis Pernyataan","objective":"Mengidentifikasi sampel dan populasi dari objek penelitian atau \nsurvei sederhana serta menjelaskan teknik sampling dalam \npenelitian atau pengumpulan data.","question":"Sebuah Kantor Pelayanan Pajak (KPP) memantau pembukuan pajak tahunan bagi kelompok usahawan terafiliasi dari keseluruhan database terekam sebanyak 2.000 entitas badan usaha Mikro, Kecil, dan Menengah (UMKM), yang tersebar berlatar pelaku UMKM tingkatan industri usaha mikro sebanyak 1.200 pengusaha, kelas pelaku unit usaha kecil mandiri sebanyak 500 unit, serta jajaran unit pengembang usaha menengah ke atas sebanyak 300 instansi terdaftar. Pemeriksa menetapkan penentuan subjek wajib pajak pelaku usaha representatif kelaikan patuh laporan sebanyak 200 pemilik instansi via sampling berlapis proporsional terkelola, namun tim asisten membiarkan pengumpulan langsung acak seadanya terjadi di pos pendaftaran loket penerimaan data tanpa pemilah penata lapis kelas yang berhasil menyita kemunculan berkas respon setinggi 100 usahawan mikro, 80 unit bidang skala kecil, dan 20 perwakilan industri unit berskala menengah. Beri tanda centang (✓) pada setiap pernyataan hasil evaluasi kelaikan mutu database penarikan laporan instansi pajak pelaku tersebut yang benar!","statements":[{"text":"Penargetan teoretis optimal berlapis mengindikasikan volume kuota representasi wajib pajak dari golongan entitas usaha kelas mikro sewajarnya melibatkan sebesar tepat 120 subjek.","answer":"Benar","explanation":"Langkah 1: Mencari parameter berat kelas pelaku industri kecil menengah tingkat mikro terhadap \nkedaulatan instansi terdaftar keseluruhan yaitu 1.200/2.000 = 60 persen. Langkah 2: Saringan \ntarget ulas berlapis mewajibkan nilai pengalian proporsinya setara 60% × 200 = 120 pengusaha \nmikro patuh pajak."},{"text":"Jumlah berkas kembalian di lapangan milik bagian unit usaha kecil mandiri nyata terhimpun secara melampaui kelebihan sasaran sebanyak 30 wajib pajak.","answer":"Benar","explanation":"Langkah 1: Menghitung pembagi alokasi bertata penataan optimal wajib pajak usaha kecil \nmandiri yang seimbang proporsinya di estimasi sebesar 500/2.000 × 200 = 50 berkas kepatuhan. \nLangkah 2: Membandingkan perolehan nyata hasil keteledoran bebas tanpa filter sekat tim \nasisten loket (80 unit) terhadap batasan sasaran ideal tersebut didapatkan deviasi tumpuk \nsebesar 80 −50 = 30 responden terambil melompat berlebih."},{"text":"Proporsi sebaran dari unit usaha berstatus berskala mikro dibanding wajib pajak pengelola berstatus tingkat usaha kecil hasil operasional acak asisten masih mencerminkan kaidah pembagi proporsional awal populasi wajib pajak di kota.","answer":"Salah","explanation":"Langkah 1: Menelaah deviasi struktural akibat kekosongan lapisan, pelaku mikro jatuh defisit \nhebat (dari 120 ideal susut menjadi hanya 100 riil), sebaliknya industri usaha kecil meledak \nmelimpah (dari 50 ideal naik pesat menembus 80 riil). Langkah 2: Deviasi membalik kedudukan \nkeseimbangan, berujung penarikan data mentah dinilai melanggar prinsip pembagian teoretis."},{"text":"Pencatatan realisasi kembalian tanggapan subjek usahawan kelas mikro patuh yang terserap di lapangan susut tersisa di angka 100 wajib pajak berisiko menggugurkan kedalaman mutu pembacaan perilaku atas golongan wajib pajak yang paling besar populasinya.","answer":"Benar","explanation":"Langkah 1: Mengidentifikasi bagian kontributor mayoritas pelaku mikro yang menopang muatan \ndatabase kepatuhan wajib pajak (60% populasi umum). Langkah 2: Penipisan data sampel akibat \npenyurutan muatan asisten secara dramatis berimplikasi langsung mengurangi reliabilitas \nprediksi jangkauan dinas KPP terhadap tren pelaporan kepatuhan pembukuan kelompok ekonomi \nkerakyatan terbesar."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
render();
</script>
</body></html>
