<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS BELAJAR | Latihan Interaktif Luas dan Keliling Lingkaran</title>
<style>
:root{--bg:#080d25;--panel:#111b3d;--panel2:#172650;--cyan:#42d9f5;--blue:#477bff;--purple:#8d63ff;--yellow:#ffd45c;--text:#f5f7ff;--muted:#b9c5e6;--green:#43d69a;--red:#ff7186}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#25316a 0,#101738 38%,#080d25 78%);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:20px;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.app{display:block;min-height:100vh}
main{width:100%;max-width:none;min-height:100vh;margin:0;padding:clamp(12px,2vw,28px) clamp(14px,3vw,48px) 112px;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,18px)}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:1.5px}
.top-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;max-width:100%}
.top-control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-caption{font-weight:900;color:var(--cyan);letter-spacing:.5px}
.top-control-group button{min-height:46px;padding:10px 14px}
.level-btn{background:#172348;color:#eaf1ff;border:1px solid #ffffff24}
.level-btn.active{background:linear-gradient(110deg,#2864d9,#714ee4);border-color:#83dfff}
.tool{background:#26345f;color:white;border:1px solid #ffffff20}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:10px 15px;border-radius:999px;background:#17264e;border:1px solid #526ca8;color:#eaf4ff;font-weight:700}
.pill.level{background:#392d70;border-color:#9475ff;color:#e8ddff}
.pill.number{background:#103c55;border-color:#43d9f5;color:#bff7ff}
.card{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,3vw,48px);border-radius:26px;background:linear-gradient(145deg,#14234a,#101a39);border:1px solid #ffffff20;box-shadow:0 20px 55px #03071855}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,24px)}
.card h2{font-size:26px;margin:0}
.objective{font-size:20px;color:#d1ddff;background:#0b1534;padding:14px 16px;border-radius:14px;border-left:4px solid var(--yellow);line-height:1.5;margin-bottom:20px}
.question{font-size:clamp(25px,3vw,42px);line-height:1.48;white-space:pre-wrap;color:#fff;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,22px);align-items:start;grid-auto-rows:min-content}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;color:white;background:#1b2b56;border:2px solid #3b4d7b;padding:16px 18px;border-radius:16px;line-height:1.5;min-height:0;height:auto;align-self:start;white-space:normal;overflow-wrap:anywhere}
.option input{width:24px;height:24px;accent-color:var(--cyan);flex:0 0 auto;margin:4px 0 0}
.option.selected{border-color:var(--cyan);background:#123c58}
.option.correct{border-color:var(--green);background:#104536}
.option.wrong{border-color:var(--red);background:#4a2035}
.option span{min-width:0;flex:1 1 auto;white-space:normal;overflow-wrap:anywhere}
.statement-item{background:#0b1534;border:1px solid #344775;border-radius:16px;padding:18px;margin-bottom:14px}
.statement-text{line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.statement-choices{display:flex;gap:12px;flex-wrap:wrap}
.statement-choice{display:flex;align-items:center;gap:8px;min-height:50px;min-width:130px;background:#1b2b56;border:1px solid #526ca8;border-radius:12px;padding:10px 14px}
.statement-choice input{width:22px;height:22px;accent-color:var(--cyan)}
.statement-choice.selected{border-color:var(--cyan);background:#123c58}
.feedback{margin-top:18px;padding:18px;border-radius:16px;line-height:1.55;display:none;background:#0d2b2b;border:1px solid #35bd91}
.feedback.show{display:block}.feedback.wrong{background:#3a1d30;border-color:#e66b8b}
.explain{margin-top:16px;padding:18px;background:#0b1532;border:1px solid #344775;border-radius:16px;line-height:1.6;white-space:pre-wrap;display:none}
.explain.show{display:block}
.small{color:var(--muted)}
.below-controls{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:rgba(7,13,37,.97);border-top:1px solid #6386d9;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(12px)}
.below-controls button{flex:0 0 auto;min-height:50px;padding:12px 16px}
.primary{background:linear-gradient(100deg,#2386e9,#7556ed);color:white}
.secondary{background:#27365e;color:white;border:1px solid #ffffff24}
footer{text-align:center;color:#8f9fc8;margin:24px 0 8px}
body.projector main{padding:2vh 3vw 112px}
body.projector .card{padding:clamp(22px,4vw,60px)}
body.projector .question{font-size:clamp(28px,3.4vw,48px)}
body.projector .option{font-size:clamp(24px,2.4vw,34px);min-height:96px}
html,body,body *{font-size:20px!important}
.card h2{font-size:26px!important}.question{font-size:clamp(25px,3vw,42px)!important}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.top-controls{justify-content:flex-start;width:100%}.top-control-group{width:100%}.top-control-group button{flex:1 1 auto}}
@media(max-width:700px){main{padding:12px 12px 112px}.options{grid-template-columns:minmax(0,1fr)}.question{font-size:25px!important;line-height:1.45}.option{width:100%;padding:14px 16px}.card{padding:18px}.meta{gap:7px}.pill{padding:8px 11px}.below-controls{gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.below-controls button{padding:11px 13px;min-height:48px}}
@media print{body{background:#fff;color:#111}.top-controls,.below-controls,footer{display:none!important}.card{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}.question{color:#111}.option,.statement-item{background:#fff;color:#111;border:1px solid #aaa}}

/* Standar tipografi KELAS BELAJAR: seluruh teks tepat 20 px */
html, body, body * { font-size: 20px !important; }


/* Penegasan khusus: teks isi soal dan seluruh turunannya tepat 20 px */
html body main .card .question,
html body main .card .question *,
html body main .card #questionText,
html body main .card #questionText *,
html body main .card .statement-item,
html body main .card .statement-item *,
html body main .card .statement-text,
html body main .card .statement-text * {
  font-size: 20px !important;
}

</style>
</head>
<body>
<div class="app"><main>
<div class="top">
 <div><div class="brand">KELAS <span>BELAJAR</span></div><div class="eyebrow">LATIHAN INTERAKTIF · UNIT LUAS DAN KELILING LINGKARAN</div></div>
 <div class="top-controls">
  <div class="top-control-group"><span class="control-caption">LEVEL SOAL</span>
   <button class="level-btn active" data-level="all">Semua Level</button><button class="level-btn" data-level="1">Level 1</button><button class="level-btn" data-level="2">Level 2</button><button class="level-btn" data-level="3">Level 3</button>
  </div>
  <div class="top-control-group"><span class="control-caption">TAMPILAN</span>
   <button class="tool" id="projectorBtn">⛶ Mode Presentasi</button><button class="tool" id="fullscreenBtn">Layar Penuh</button><button class="tool" onclick="window.print()">Cetak</button>
  </div>
 </div>
</div>
<div class="meta"><span class="pill level" id="levelPill">LEVEL 1</span><span class="pill number" id="numberPill">SOAL 1</span><span class="pill" id="typePill">Pilihan Ganda</span><span class="pill" id="progressPill">Terjawab 0 / 40</span></div>
<section class="card">
 <div class="cardhead"><h2 id="questionTitle">Pertanyaan</h2><span class="small" id="counter">1 / 40</span></div>
 <div class="objective" id="objective"></div>
 <div class="question" id="questionText"></div>
 <div id="interactionArea"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explain" id="explanation"></div>
</section>
<footer>KELAS BELAJAR · Belajar Aktif, Berpikir Kritis, Raih Prestasi</footer>
<div class="below-controls">
 <button class="secondary" id="prevBtn">← Soal Sebelumnya</button>
 <button class="primary" id="nextBtn">Soal Selanjutnya →</button>
 <button class="primary" id="checkBtn">Periksa Jawaban</button>
 <button class="secondary" id="revealBtn">Tampilkan Kunci & Pembahasan</button>
 <button class="secondary" id="hideBtn" style="display:none">Sembunyikan Pembahasan</button>
</div>
</main></div>
<script>
const questions = [{"number":1,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 1 \n \nAlas sebuah pot bunga berbentuk lingkaran memiliki panjang jari-jari 10 cm. Luas alas pot bunga \ntersebut adalah .... (Gunakan 𝜋= 3,14)","options":[{"key":"A","text":"31,4 cm 2"},{"key":"B","text":"62,8 cm 2"},{"key":"C","text":"157 cm 2"},{"key":"D","text":"314 cm 2"}],"answer":"D","explanation":"Substitusikan jari-jari 𝑟= 10 cm dan 𝜋= 3,14 ke dalam rumus luas lingkaran. \nRumus luas: 𝐿= 𝜋× 𝑟2 = 3,14 × 102 = 314 cm\n2. \nJawaban Benar: D"},{"number":2,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 1 \n \nKarpet berbentuk lingkaran memiliki panjang jari-jari 7 meter. Berapakah luas karpet tersebut jika \ndigunakan 𝜋=\n22\n7 ?","options":[{"key":"A","text":"22 meter persegi"},{"key":"B","text":"44 meter persegi"},{"key":"C","text":"154 meter persegi"},{"key":"D","text":"308 meter persegi"}],"answer":"C","explanation":"Substitusikan nilai jari-jari 𝑟= 7 meter dan 𝜋=\n22\n7 ke dalam rumus luas lingkaran. \n\nRumus luas: 𝐿= 𝜋× 𝑟2 =\n22\n7 × 7 × 7 = 154 meter persegi. \nJawaban Benar: C"},{"number":3,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 1 \n \nSebuah piring makan berbentuk lingkaran memiliki jari-jari 10 cm. Berapakah luas permukaan \npiring tersebut? (Gunakan 𝜋= 3,14)","options":[{"key":"A","text":"31,4 cm²."},{"key":"B","text":"62,8 cm²."},{"key":"C","text":"314,0 cm²."},{"key":"D","text":"1.256,0 cm²."}],"answer":"C","explanation":"Jari-jari lingkaran 𝑟= 10 cm. \nRumus luas lingkaran adalah 𝐿= 𝜋𝑟2. \nSubstitusi nilai ke dalam rumus: 𝐿= 3,14 × 10 × 10 = 314 cm². \nJawaban Benar: C"},{"number":4,"level":1,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 1 \n \nSebuah kolam hias berbentuk lingkaran memiliki luas 314 m². Jika digunakan nilai 𝜋= 3,14, \nberapakah jari-jari kolam tersebut?","options":[{"key":"A","text":"10 meter"},{"key":"B","text":"20 meter"},{"key":"C","text":"50 meter"},{"key":"D","text":"100 meter"}],"answer":"A","explanation":"Diketahui luas kolam 𝐿= 314 m² dan 𝜋= 3,14. \nRumus luas lingkaran adalah 𝐿= 𝜋𝑟2. \nMaka, 𝑟2 =\n𝐿\n𝜋=\n314\n3,14 = 100. \nJari-jari lingkaran adalah 𝑟= √100 = 10 meter. \nJawaban Benar: A"},{"number":5,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 2 \n \nSebua jendela hias berbentuk setengah lingkaran memiliki diameter sepanjang 140 cm. Keliling \ndari jendela hias tersebut adalah ....","options":[{"key":"A","text":"360 cm"},{"key":"B","text":"290 cm"},{"key":"C","text":"220 cm"},{"key":"D","text":"110 cm"}],"answer":"A","explanation":"Langkah 1: Hitung panjang busur setengah lingkaran: 𝐵𝑢𝑠𝑢𝑟=\n1\n2 × 𝜋× 𝑑=\n1\n2 ×\n22\n7 × 140 = 220 \ncm. \nLangkah 2: Hitung keliling total jendela dengan menjumlahkan panjang busur dan panjang \ndiameter (alas): 𝐾𝑒𝑙𝑖𝑙𝑖𝑛𝑔= 220 + 140 = 360 cm. \nJawaban Benar: A"},{"number":6,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 2 \n \nSebuah pizza berbentuk lingkaran dengan diameter 28 cm dipotong menjadi 8 bagian berbentuk \njuring yang sama besar. Berapakah luas dari satu potong pizza tersebut?","options":[{"key":"A","text":"77 cm²"},{"key":"B","text":"154 cm²"},{"key":"C","text":"308 cm²"},{"key":"D","text":"616 cm²"}],"answer":"A","explanation":"Langkah 1: Menghitung luas seluruh pizza. Diketahui diameter 𝑑= 28 cm, maka jari-jari 𝑟= 14 \ncm. Luas (𝐿) = 𝜋× 𝑟2 =\n22\n7 × 14 × 14 = 616 cm². \nLangkah 2: Menghitung luas satu bagian pizza. Luas satu potong = \n1\n8 × 616 = 77 cm². \nJawaban Benar: A"},{"number":7,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 2 \n \n\nRoda sebuah sepeda memiliki jari-jari 35 cm. Jika sepeda tersebut dikendarai dan menempuh \njarak total 2200 meter, berapakah frekuensi putaran roda sepeda tersebut hingga sampai di \ntujuan?","options":[{"key":"A","text":"10 kali"},{"key":"B","text":"100 kali"},{"key":"C","text":"200 kali"},{"key":"D","text":"1000 kali"}],"answer":"D","explanation":"Langkah 1: Hitung keliling roda sepeda menggunakan rumus 𝐾= 2𝜋𝑟. Dengan 𝑟= 35 cm, \ndiperoleh 𝐾= 2 ×\n22\n7 × 35 = 220 cm. \nLangkah 2: Ubah satuan jarak tempuh sepeda dari meter ke sentimeter, diperoleh 2200 𝑚𝑒𝑡𝑒𝑟=\n220.000 cm. Selanjutnya, hitung banyak putaran roda dengan membagi total jarak dengan keliling \nroda: 𝐵𝑎𝑛𝑦𝑎𝑘 𝑃𝑢𝑡𝑎𝑟𝑎𝑛=\n220.000\n220\n= 1000 kali. \nJawaban Benar: D."},{"number":8,"level":2,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 2 \n \nSelembar karton dipotong hingga membentuk bangun seperempat lingkaran dengan luas daerah \nsebesar 154 cm². Berapakah panjang busur lengkung dari potongan karton seperempat lingkaran \ntersebut? (Gunakan 𝜋=\n22\n7 )","options":[{"key":"A","text":"14 cm."},{"key":"B","text":"22 cm."},{"key":"C","text":"44 cm."},{"key":"D","text":"88 cm."}],"answer":"B","explanation":"Langkah 1: Menentukan jari-jari (𝑟) karton dari luas seperempat lingkaran yang diketahui \nmenggunakan rumus 𝐿=\n1\n4 𝜋𝑟2. Dengan mensubstitusi nilai luas, diperoleh 154 =\n1\n4 ×\n22\n7 × 𝑟2, \nsehingga 154 =\n11\n14 × 𝑟2 ⇒𝑟2 = 154 ×\n14\n11 = 196. Diperoleh 𝑟= √196 = 14 cm. \nLangkah 2: Menghitung panjang busur lengkung seperempat lingkaran tersebut menggunakan \nrumus 𝐵=\n1\n4 × 2𝜋𝑟. Dengan 𝑟= 14 cm, diperoleh 𝐵=\n1\n4 × 2 ×\n22\n7 × 14 = 22 cm. Jawaban Benar: \nB."},{"number":9,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 3 \n \n\nSebuah gerbang masuk tempat wisata didesain berbentuk setengah lingkaran berongga (cincin \nsetengah lingkaran). Diameter luar gerbang tersebut adalah 28 meter dan diameter dalamnya \nadalah 14 meter. Luas permukaan tampak depan dari gerbang tersebut adalah .... (Gunakan 𝜋=\n22\n7 )","options":[{"key":"A","text":"231 m²"},{"key":"B","text":"308 m²"},{"key":"C","text":"462 m²"},{"key":"D","text":"616 m²"}],"answer":"A","explanation":"Langkah 1: Tentukan jari-jari luar (𝑅= 14 m) dan hitung luas setengah lingkaran luar (𝐿𝑙𝑢𝑎𝑟): \n𝐿𝑙𝑢𝑎𝑟=\n1\n2 × 𝜋× 𝑅2 =\n1\n2 ×\n22\n7 × 14 × 14 = 308 m². \nLangkah 2: Tentukan jari-jari dalam (𝑟= 7 m) dan hitung luas setengah lingkaran dalam (𝐿𝑑𝑎𝑙𝑎𝑚): \n𝐿𝑑𝑎𝑙𝑎𝑚=\n1\n2 × 𝜋× 𝑟2 =\n1\n2 ×\n22\n7 × 7 × 7 = 77 m². \nLangkah 3: Kurangi luas luar dengan luas dalam untuk mendapatkan luas tampak depan: \n𝐿𝑔𝑒𝑟𝑏𝑎𝑛𝑔= 308 −77 = 231 m². \nJawaban Benar: A"},{"number":10,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 3 \n \nPak Ahmad memiliki sebuah kolam hias berbentuk lingkaran dengan jari-jari 7 meter. Di sekeliling \nkolam tersebut akan dibuat jalan setapak dari paving block dengan lebar 7 meter. Jika biaya \npemasangan paving block adalah Rp200.000,00 per meter persegi, total biaya minimal yang \nharus dikeluarkan oleh Pak Ahmad untuk membuat jalan setapak tersebut adalah ....","options":[{"key":"A","text":"Rp30.800.000,00"},{"key":"B","text":"Rp61.600.000,00"},{"key":"C","text":"Rp92.400.000,00"},{"key":"D","text":"Rp123.200.000,00"}],"answer":"C","explanation":"Langkah 1: Tentukan jari-jari dalam kolam (𝑟𝑑𝑎𝑙𝑎𝑚= 7 meter) dan jari-jari luar jalan setapak \n(𝑟𝑙𝑢𝑎𝑟= 7 + 7 = 14 meter). \nLangkah 2: Hitung luas jalan setapak: 𝐿= 𝜋× (𝑟𝑙𝑢𝑎𝑟\n2\n−𝑟𝑑𝑎𝑙𝑎𝑚\n2\n) =\n22\n7 × (142 −72) =\n22\n7 × (196 −\n49) =\n22\n7 × 147 = 462 meter persegi. \nLangkah 3: Hitung total biaya minimal: 462 × 𝑅𝑝200.000,00 = 𝑅𝑝92.400.000,00. \nJawaban Benar: C"},{"number":11,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 3 \n \nSiti memiliki sebuah kipas kertas berbentuk juring lingkaran dengan sudut pusat 120∘ dan \npanjang jari-jari 21 cm. Siti ingin menghias seluruh pinggiran kipas tersebut (terdiri dari busur \nlengkung dan dua sisi lurus jari-jarinya) dengan pita renda. Berapakah panjang minimal pita \nrenda yang dibutuhkan oleh Siti? (Gunakan 𝜋=\n22\n7 )","options":[{"key":"A","text":"44 cm"},{"key":"B","text":"65 cm"},{"key":"C","text":"86 cm"},{"key":"D","text":"132 cm"}],"answer":"C","explanation":"Langkah 1: Hitung panjang busur lengkung juring kipas yaitu 𝐵𝑢𝑠𝑢𝑟=\n120∘\n360∘× 2 × 𝜋× 𝑟=\n1\n3 × 2 ×\n22\n7 × 21 = 44 cm. \nLangkah 2: Hitung panjang dua buah sisi lurus jari-jari kipas yaitu 2 × 𝑟= 2 × 21 = 42 cm. \nLangkah 3: Hitung keliling atau panjang minimal pita yaitu 44 + 42 = 86 cm. \nJawaban Benar: C"},{"number":12,"level":3,"type":"Pilihan Ganda","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Level 3 \n \nBu Ratih ingin menghias tudung saji berbentuk setengah bola yang memiliki diameter lingkaran \nbawah 56 cm. Ia akan menutup bagian permukaan luar tudung saji tersebut dengan kain brokat, \nserta memasang pita renda tepat di sekeliling pinggiran bawah tudung saji tersebut. Jika harga \nkain brokat adalah Rp50.000,00 per meter persegi dan harga pita renda adalah Rp10.000,00 per \nmeter, berapakah taksiran biaya minimal yang harus dikeluarkan Bu Ratih? (Catatan: Luas \npermukaan setengah bola tanpa alas adalah 2𝜋𝑟2, gunakan 𝜋=\n22\n7 )","options":[{"key":"A","text":"Rp35.200,00"},{"key":"B","text":"Rp42.240,00"},{"key":"C","text":"Rp59.840,00"},{"key":"D","text":"Rp66.880,00"}],"answer":"B","explanation":"Langkah 1: Tentukan jari-jari tudung saji yaitu 56/2 = 28 cm = 0,28 meter. Hitung luas permukaan \nsetengah bola untuk kain brokat menggunakan rumus 𝐿= 2𝜋𝑟2 = 2 ×\n22\n7 × 0,28 × 0,28 = 0,4928 \nmeter persegi. \nLangkah 2: Hitung biaya pembelian kain brokat, yaitu 0,4928 × 50.000 = 24.640 rupiah. \nLangkah 3: Hitung keliling lingkaran bawah tudung saji menggunakan rumus 𝐾= 𝜋× 𝑑=\n22\n7 × 0,56 = 1,76 meter. \n\nLangkah 4: Hitung biaya pembelian pita renda, yaitu 1,76 × 10.000 = 17.600 rupiah. \nLangkah 5: Hitung total biaya minimal keseluruhan, yaitu 24.640 + 17.600 = 42.240 rupiah. \nJawaban Benar: B"},{"number":13,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Pak Herman menata batu alam melingkari sebuah kolam air mancur dengan diameter 14 m. \nBerdasarkan informasi ini dengan menggunakan 𝜋=\n22\n7 , tentukan nilai dari berbagai dimensi fisik \nkolam air mancur tersebut. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Jari-jari kolam tersebut bernilai sama dengan diameter lingkaran roda biasa, yaitu 14 m.","answer":"Salah","explanation":"Jari-jari didefinisikan sebagai setengah kali diameter, jadi haruslah sepanjang 7 m."},{"text":"Panjang jari-jari kolam air mancur tersebut adalah 7 m.","answer":"Benar","explanation":"Melalui konversi langsung, panjang jari-jari kolam bernilai 𝑟=\n𝑑\n2 =\n14\n2 = 7 m."},{"text":"Panjang lintasan luar atau keliling dari kolam tersebut adalah 44 m.","answer":"Benar","explanation":"Panjang keliling dinding dihitung melalui rumus 𝐾= 𝜋× 𝑑=\n22\n7 × 14 = 44 m."},{"text":"Luas tapak bawah permukaan dari kolam air mancur tersebut adalah 154 m².","answer":"Benar","explanation":"Luas dasar penampang didapat lewat formula 𝐿= 𝜋× 𝑟2 =\n22\n7 × 72 = 154 m²."}]},{"number":14,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Sebuah hiasan jam dinding berbentuk lingkaran sempurna memiliki panjang diameter 40 cm, dan \ndihitung menggunakan nilai pendekatan 𝜋= 3.14. Tentukan benar atau salah untuk setiap \npernyataan berikut!","statements":[{"text":"Jari-jari jam dinding tersebut adalah 80 cm.","answer":"Salah","explanation":"Kesalahan langkah prosedural akibat mengalikan diameter jam dinding dengan 2 bukannya \nmembagi dengan 2."},{"text":"Jari-jari jam dinding tersebut adalah 20 cm.","answer":"Benar","explanation":"Dihitung secara langsung dengan memotong setengah bagian dari panjang diameternya: 𝑟=\n40\n2 =\n20 cm."},{"text":"Keliling jam dinding tersebut adalah 125.6 cm.","answer":"Benar","explanation":"Evaluasi langsung menggunakan keliling berupa hubungan diameter dan keliling: 𝐾= 𝜋𝑑=\n3.14 × 40 = 125.6 cm."},{"text":"Luas jam dinding tersebut adalah 1256 cm².","answer":"Benar","explanation":"Menentukan luasnya secara tepat memakai besaran jari-jari kuadrat: 𝐿= 𝜋𝑟2 = 3.14 × 20 × 20 =\n1256 cm²."}]},{"number":15,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Sebuah jam dinding berbentuk lingkaran memiliki panjang diameter 28 cm. Kita ingin menguji \nbeberapa nilai ukuran fisik dasar dari jam tersebut menggunakan nilai 𝜋=\n22\n7 . Beri tanda centang \n(✓) pada setiap pernyataan yang benar!","statements":[{"text":"Panjang jari-jari jam dinding tersebut adalah 14 cm.","answer":"Benar","explanation":"Jari-jari adalah setengah dari diameter, yaitu 𝑟=\n28\n2 = 14 cm."},{"text":"Keliling jam dinding tersebut adalah 88 cm.","answer":"Benar","explanation":"Keliling dihitung dengan rumus 𝐾= 𝜋× 𝑑=\n22\n7 × 28 = 88 cm."},{"text":"Keliling jam dinding tersebut adalah 44 cm.","answer":"Salah","explanation":"Nilai keliling 44 cm salah karena menggunakan jari-jari dalam rumus diameter di formula keliling."},{"text":"Jari-jari jam dinding tersebut adalah 56 cm.","answer":"Salah","explanation":"Nilai 56 cm salah karena menghitung jari-jari dengan mengalikan diameter dengan 2 alih-alih \nmembaginya."}]},{"number":16,"level":1,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Sebuah taplak meja rajutan berbentuk lingkaran memiliki panjang diameter 70 cm. Gunakan 𝜋=\n22\n7 untuk mengevaluasi keliling dan luas taplak meja tersebut. Tentukan benar atau salah untuk \nsetiap pernyataan berikut!","statements":[{"text":"Keliling taplak meja tersebut adalah 220 cm.","answer":"Benar","explanation":"Menggunakan diameter 70 cm, keliling dihitung sebagai 𝐾= 𝜋× 𝑑=\n22\n7 × 70 = 220 cm."},{"text":"Luas taplak meja tersebut adalah 154 𝑐𝑚2.","answer":"Salah","explanation":"Luas taplak dengan 𝑟= 35 cm dihitung sebagai \n22\n7 × 35 × 35 = 3850 𝑐𝑚2, bukan 154 𝑐𝑚2 \n(miskonsepsi mengalikan dengan 14)."},{"text":"Jari-jari dari taplak meja tersebut adalah 35 cm.","answer":"Benar","explanation":"Jari-jari diperoleh dari setengah diameter yaitu \n70\n2 = 35 cm."},{"text":"Luas dari taplak meja rajutan tersebut adalah 3850 𝑐𝑚2.","answer":"Benar","explanation":"Dengan jari-jari 35 cm, luasnya adalah 𝐿= 𝜋× 𝑟2 =\n22\n7 × 35 × 35 = 3850 𝑐𝑚2."}]},{"number":17,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Di ruangan pameran dinding tergantung dua unit jam penunjuk waktu bermodel kuno melingkar. \nModel pertama didesain dengan jari-jari kaca depan 10 cm, sementara model jam kedua yang \nberdimensi besar diproduksi dengan jari-jari kaca depan 20 cm menggunakan estimasi nilai 𝜋=\n3.14. Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Keliling penampang penutup luar jam berdiameter kaca terkecil (model jam pertama) adalah \n62.8 cm.","answer":"Benar","explanation":"Massa kaca bundar kecil mempunyai keliling bingkai pembatas perimetris senilai: 𝐾1 =\n2 × 3.14 × 10 = 62.8 cm."},{"text":"Jarak panjang tepi jam kedua jika melingkar dikelilingi logam penahan memiliki ukuran yang \nlebih kecil dari model jam dinding pertama.","answer":"Salah","explanation":"Berdasar perhitungan panjang garis tepi, model penampang beradius besar yakni jam dinding \nkedua menghasilkan parameter penutup tepi: 𝐾2 = 125.6 cm. Maka nilainya lebih panjang."},{"text":"Perbandingan luas permukaan penutup jam besar dibandingkan model terkecil menghasilkan \nrasio luas 4: 1.","answer":"Benar","explanation":"Dengan membandingkan luas penampang cakram penutup kedua jam didapatkan perbandingan \nkuadrat berpasangan radius r: 𝐿2: 𝐿1 = (20)2: (10)2 = 400: 100 = 4: 1."},{"text":"Kalkulasi luas area penampang kaca dari unit penutup jam dekoratif terkecil (model jam \npertama) adalah 157 cm².","answer":"Salah","explanation":"Permukaan luar bundar yang menutup area jarum arloji hias pertama berluasan penuh: 𝐿1 =\n3.14 × 102 = 314 cm², bukan 157 cm²."}]},{"number":18,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Sisi permukaan mulut sumur sumbatan beton memiliki penampang sirkular berdiameter \nsepanjang 2.8 meter. Sisi cor sumbatan beton bagian permukaan sirkular sumur tersebut akan \ndiwarnai oleh cat anti karat bertarif Rp15.000,00 per desimeter persegi dan sisi melingkar \nsepanjang tepian akan dibentengi pengait tali pelindung kawat penambat. (Gunakan 𝜋=\n22\n7 ). Beri \ntanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Panjang batas pelat pagar kawat sepanjang pinggir mulut penutup bibir lingkar luar sumur \nadalah 8.8 meter.","answer":"Benar","explanation":"Langkah 1: Ambil rumus keliling dengan diameter 2.8 meter, yaitu 𝐾= 𝜋× 𝑑. Langkah 2: 𝐾=\n22\n7 × 2.8 = 8.8 meter."},{"text":"Luas seluruh permukaan bibir beton penampang sumur dalam desimeter persegi adalah 616 \ndm\n2.","answer":"Benar","explanation":"Langkah 1: Ubah satuan ukuran radius 𝑟= 1.4 meter menjadi desimeter, yaitu 14 desimeter. \nLangkah 2: Hitung daerah wilayah sumbatan = 𝜋× 𝑟2 =\n22\n7 × 14 × 14 = 616 dm\n2."},{"text":"Banyaknya kawat penahan kawat lingkar kawat yang melingkari bibir sumur dalam 2 kali \nputaran penuh minimum adalah 16.6 meter.","answer":"Salah","explanation":"Langkah 1: Cari keliling dari permukaan luar sumbatan sumur = 8.8 meter. Langkah 2: Kalikan 2 \nlintasan bundar, didapatkan kawat = 2 × 8.8 = 17.6 meter, angka opsi salah menduga nilai kawat \npelindung."},{"text":"Biaya yang perlu dianggarkan pembangun untuk kebutuhan mengecat beton pelat sirkular \npenuh penutup sumur tersebut adalah Rp9.240.000,00.","answer":"Benar","explanation":"Langkah 1: Dapat nilai wilayah area lingkaran atas beton sebesar 616 dm\n2. Langkah 2: Kalikan \ndengan tarif pengerjaan yaitu 616 × 15.000 = 𝑅𝑝9.240.000,00."}]},{"number":19,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Sebuah pelat baja berbentuk lingkaran memiliki luas sebesar 1386 𝑐𝑚2. Untuk keperluan suku \ncadang mesin, pelat tersebut akan dilindungi sekeliling pinggirannya dengan pita baja tahan \nkarat. Gunakan 𝜋=\n22\n7 dan beri tanda centang (\\checkmark) pada setiap pernyataan yang benar!","statements":[{"text":"Jari-jari dari pelat baja berbentuk lingkaran tersebut adalah 21 cm.","answer":"Benar","explanation":"Langkah 1: Menyelesaikan model 1386 =\n22\n7 × 𝑟2 ⇒𝑟2 = 441. Langkah 2: Melakukan pengakaran \n𝑟= √441 = 21 cm."},{"text":"Panjang kawat pita pelindung baja yang dipasang mengelilingi tepi pelat tersebut adalah 1.32 \nmeter.","answer":"Benar","explanation":"Langkah 1: Mengetahui panjang jari-jari 21 cm. Langkah 2: Menghitung keliling 𝐾= 2 ×\n22\n7 × 21 =\n132 cm yang kemudian dikonversikan menjadi 1.32 meter."},{"text":"Diameter pelat tersebut jika luasnya mengecil menjadi setengahnya adalah 42 cm.","answer":"Salah","explanation":"Langkah 1: Mengukur jari-jari semula sebesar 21 cm yang memunculkan diameter normal \nsepanjang 42 cm. Langkah 2: Bila luas berkurang, maka diameternya harus berubah menurun, \nsehingga mustahil bernilai tetap 42 cm."},{"text":"Jika panjang pita yang tersedia hanya 1.2 meter, pita tersebut sangat mencukupi untuk \nmelindungi seluruh tepi pelat tersebut.","answer":"Salah","explanation":"Langkah 1: Menghitung kebutuhan pita pengeliling yakni sepanjang 1.32 meter. Langkah 2: \nMembandingkan kecukupannya: Karena 1.2 meter < 1.32 meter, maka bahan pita kurang/tidak \nmencukupi."}]},{"number":20,"level":2,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Feri memutar secara horizontal sebuah kepingan uang logam koin kuno berdiameter sepanjang \n2,8 cm menggelinding di meja lurus dari ujung ke ujung berjarak sepanjang 88 cm. Nilai 𝜋=\n22\n7 . \nTentukan benar atau salah untuk setiap pernyataan berikut!","statements":[{"text":"Batas keliling tepi logam koin bundar kepunyaan Feri yang diukur sekali keliling tepi melingkar \nsama dengan 8,8 cm.","answer":"Benar","explanation":"Langkah 1: Masukkan data diameter koin 2,8 cm ke dalam formula keliling. Langkah 2: Keliling \nkoin = 𝜋𝑑=\n22\n7 × 2,8 = 8,8 cm. Pernyataan BENAR."},{"text":"Sisa keseluruhan jumlah dari putaran putar menggelinding penuh logam koin untuk menyusuri \nsejauh 88 cm jarak kemeja itu adalah 10 putaran penuh.","answer":"Benar","explanation":"Langkah 1: Dapatkan data nilai keliling satu lintasan putar yaitu 8,8 cm. Langkah 2: Bagilah total \njarak perjalanan Feri dengan keliling lingkaran, \n88\n8,8 = 10 putaran. Pernyataan BENAR."},{"text":"Bidang luas seluruh pelat cakram dari bundaran permukaan logam koin kuno tersebut adalah \n24,64 𝑐𝑚2.","answer":"Salah","explanation":"Langkah 1: Temukan dahulu nilai jari-jari penampang yaitu setengah ukuran diameter koin 2,8 \ncm, yakni 1,4 cm. Langkah 2: Hitung dengan benar rumus luas lingkaran, 𝐿= 𝜋𝑟2 =\n22\n7 × 1,4 × 1,4 = 6,16 𝑐𝑚2. Nilai pada pernyataan ini salah akibat memasukka angka diameter 2,8 \ncm langsung ke variabel rumus jari-jari lingkaran (Overgeneralisasi)."},{"text":"Jika logam koin sengaja digulingkan berulang-ulang hingga mencatat keliling putar total sejauh \n20 kali menggelinding di atas lantai kayu datar, total jangkauannya sejauh 176 cm.","answer":"Benar","explanation":"Langkah 1: Ambil data nilai keliling yang berguling satu lintasan koin yaitu 8,8 cm. Langkah 2: \nHitung hasil akhir rentangan lintasan koin, 20 × 8,8 = 176 cm. Pernyataan BENAR."}]},{"number":21,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Arsitek pembangunan aula membidani model lantai dasar mimbar pidato istimewa melingkar \ntepat bertema setengah lingkaran penuh yang ditaksir memiliki bentang diameter potong sirkular \ndasar mimbar selebar 28 𝑚. Pelataran melingkar lantai itu bermotif khusus tahan gores dipasang \nbiaya per murni permukaannya bernilai rupiah standar kustom pasang lantai Rp35.000,00 per \nmeter persegi luas bentangnya. Penggunaan matematis bilangan bulat disarankan berbanding \nlingkar 𝜋=\n22\n7 . Beri tanda centang (✓) pada setiap pernyataan yang benar!","statements":[{"text":"Cakupan permukaan luas bagian lurus sirkulasi aula tempat tumpuan dari dek kayu panggung \nmimbar ini mencapai luasan 616 𝑚2.","answer":"Salah","explanation":"Pernyataan bernilai salah sebab merupakan draf incomplete step atas pelupa nilai proporsional \npanggung pembagi separuhnya lingkaran utuh: Jejari mimbarnya ialah 14 𝑚, maka untuk sebaran \nluasan fungsional dari dasar podium juri yang hanya bernilai porsi panggung setengah bola =\n1\n2 × 𝜋× 𝑟2 =\n1\n2 ×\n22\n7 × 142 = 308 𝑚2."},{"text":"Rantai sekeliling rute lurus pelana panggung pinggiran luar mimbar utuh (terhitung lurus potong \nas tambah sirkular kawat lingkar panggung lengkung) berjejari total 72 𝑚.","answer":"Benar","explanation":"Batas pinggir mimbar terangkai oleh sebilang potong garis diameter melintang horizontal as \n(28 𝑚) serta ditaut dengan lintasan lengkung kurva setengah lingkaran (44 𝑚), maka lilitannya \ntotal kawat penata pagar luar penengah mimbarnya = 44 + 28 = 72 𝑚."},{"text":"Jika sirkulasi sasis seluruh daerah datar dicat berlapis bahan pengkilap antiair seharga jasa \nstandar penata draf, total biaya pelumatan noda panggung menghabiskan anggaran sebesar \nRp10.780.000,00.","answer":"Benar","explanation":"Mengkali luas lantai setengah sasis podium yang terbasah sapuan draf poles cat merah hias \nmelingkar = 308 𝑚2 × 𝑅𝑝35.000,00 = 𝑅𝑝10.780.000,00."},{"text":"Peruntukan khusus rumbai pengait kawat penghubung garis bentang jalur lari kelokan samping \njembatan penata sasis mimbar bagian lengkung horizontal semata butuh panjang lingkar sirkuit \nsenilai 88 𝑚.","answer":"Salah","explanation":"Merupakan representasi model kesalahan operasi perkalian utuh, sebab nilai lintasan \nmelengkung setangah lingkaran dari garis keliling pembatas atas bagian lekukan panggung \nhanyalah sepadat =\n1\n2 × 2 × 𝜋× 𝑟=\n22\n7 × 14 = 44 𝑚 saja."}]},{"number":22,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Nisa akan mempercantik dekorasi tutup stoples bulat hias miliknya dengan membungkus pelat \ntutup tersebut menggunakan helaian kepingan potongan guntingan berbahan flanel bundar \nseragam. Tutup stoples stoples tersebut mempunyai radius bidang pembungkus melingkar \nberjejari 11 cm, sedangkan untuk pengerjaannya Nisa membutuhkan lebar piringan berdimensi \ncadangan sisa tekuk bibir tepi yang lebih besar dengan selisih tambahan lebar radius flanel \nmelingkar 3 cm di tiap lingkar samping tutup agar rapi dibungkus. Pembelian gulung kain flanel \ndibatasi dengan besaran harga jual senilai Rp35.000 untuk tiap kelonggaran cakupan meter \npersegi (𝑚2) permukaannya. Rancanglah efisiensi pendanaan bungkus stoples flanel berjumlah \n10 wadah melingkar memakai model taksiran nilai 𝜋=\n22\n7 lalu dapatkan kesimpulan dari opsi-opsi \nteoretis berikut yang dinilai benar!","statements":[{"text":"Untuk membuat dekorasi sirkular penuh pembungkus pada setiap keping satu biji penutup \nwadah gelas di stoples tersebut diperlukan potongan luas flanel bermatra ukuran seluas 616 \ncm\n2.","answer":"Benar","explanation":"Model potongan bahan berbentuk lingkar penuh flanel pengunggah menyelaraskan \npenggulungan melintang berskala jari-jari target melingkar luar gabung: 𝑟= 11 + 3 = 14 cm. \nTaksiran luas helaian minimal yang murni digunting untuk membungkus satu wadah piringan \nbulat penutup tunggal stoples tersebut: 𝐿𝑝𝑖𝑟𝑖𝑛𝑔𝑎𝑛𝑓𝑙𝑎𝑛𝑒𝑙=\n22\n7 × 14 × 14 = 616 cm\n2. Statemen \nteoretis adalah bernilai tepat dan benar."},{"text":"Akumulasi komposit luas lembar wilayah gulung tekstil bahan pelat flanel bundar melingkar \nkeseluruhan guna menyulap seluruh dekorasi lengkap paket sepuluh unit stoples yakni berbidang \nsebesar 61,6 meter persegi.","answer":"Salah","explanation":"Pada kebutuhan hias total sebanyak 10 tutup botol melingkar diperoleh: 10 × 616 = 6160 cm\n2. \nTransformasikan besaran arealnya dari tangga luasan centimeter persegi ke matra kuadrat \nukuran standard internasional (𝑚2): 6160 𝑐𝑚2/10000 = 0,616 m\n2. Informasi di opsi 61,6 m\n2 \nberstatus keliru besar karena rute operasional matematis penalti pembagian hanya melibatkan \npengonversian bernilai tingkat kelipatan seratus melulu tanpa mawas peningkat berpangkat \ndimensi luasan persegi dua."},{"text":"Tagihan anggaran tunai perancangan hias penutupan dari sebaran bundar lembaran stoples ini \nmemerlukan penyiapan totalitas pendanaan minimum di atas plafon anggaran sebesar Rp30.000.","answer":"Salah","explanation":"Pembiayaan riil yang dituntut dibayarkan kepada agen bahan ialah seberapa lebar kebutuhan \npelat flanel aslinya (0,616 m\n2) kali per meter biaya bahan baja flanel yang tercatat di retail \npenjaja kain: 0,616 𝑚2 × 𝑅𝑝35.000/𝑚2 = 𝑅𝑝21.560. Hal ini menunjukkan total pembebanannya \nterdeteksi jatuh di batas jangkauan nilai di bawah dari budget penampang minimal target sebesar \nRp30.000."},{"text":"Keping pengadaan finansial riil pengerjaan kreasi sirkular tutup wadah penataan jeli milik Nisa \nadalah berjumlah di batas pembelanjaan dengan kas kelonggaran terkecil nominal bayar yakni \nRp21.560.","answer":"Benar","explanation":"Kalkulasi pemicu anggaran biaya yang murni keluar ke pihak loket pembelian atas pesanan \nhelaian 0,616 meter persegi penampang murni adalah sebanding Rp21.560 (selaras kompilasi \nevaluasi numerik runtun pengalian dasar di langkah-langkah terdahulu). Maka kalimat \nkesimpulannya sahih mutlak secara kaidah sains akuntansi-aritmatika sosial kurikulum terkait."}]},{"number":23,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Di lini industri manufaktur terpasang dua roda katrol pembantu dalam mekanis rangkaian ban \nkaret penghantar transmisi sabuk meluncur sekeliling secara terus menerus bebas hambatan \nselip. Jari-jari lingkaran pelek as katrol gir roda besar yang difungsikan untuk katrol penggerak \ndinamo berkisar radial 21 cm, diporokan bersama roda pelek gigi pembantu hias kedua melingkar \ndengan radius roda sasis bagian dalamnya sekecil 14 cm. Roda sabuk penutup hantar ini \ndiidentifikasi berjalan meliliti pinggirannya sepanjang linear lintasan pacu sejauh jarak linear \nperpindahan ban pembantu hantaran 1.320 cm tanpa cacat gesek penahan. Selesaikan teoretis \nlaju lajunya berbasis rumus perbandingan keliling lingkaran dan pemanfaatnya 𝜋=\n22\n7 , tentukan \nkecocokan pernyataan laju ini Benar atau Salah!","statements":[{"text":"Unit komponen transmisi ban roda silinder berukuran penggerak besar dengan radius 21 cm \nmengalami proses gasing berputar sepusat pada tumpuan gir poros as mesinnya menepati \nputaran sebanyak tepat 10 kali putaran dinamo lengkap penuh.","answer":"Benar","explanation":"Keliling katrol besar = 2 × 𝜋× 𝑅= 2 ×\n22\n7 × 21 = 132 cm. Selama tali penggerak melintas \nsepanjang lari = 1.320 cm secara konstan, roda besar katrol harus berputar melingkari kurvanya \nsebanyak =\n1.320\n132 = 10 rotasi roda."},{"text":"Roda unit asis katrol yang digerakkan di tepi sambungan as (katrol beruji kecil dengan radius \n14 cm) memanen aktivitas lari rotasi mengelilingi lintasannya tepat ber-rotasi melingkar sebanyak \n5 putaran penuh lebih banyak dibayangkannya daripada kayuhan laju putar pengisi roda katrol \npenggerak yang bermesin besar.","answer":"Benar","explanation":"Dengan menindaklanjuti proses konseptualisasi spasial dari roda ber-radius = 14 cm: keliling dari \npelek sasis komponen gir katrol pengimbas tersebut adalah 2 ×\n22\n7 × 14 = 88 cm. Siklus \nkelancaran roda gigi berputarnya sejauh laju rantai melintas sabuk dinamo as roda pembantu =\n1.320\n88 = 15 putaran katrol kecil lengkap. Gap nilai frekuensi orbit katrol pengikut dikurangi laju \nporos = 15 −10 = 5 rotasi kelok."},{"text":"Jika dihitung teoretis selisih bentang perimeter keping bibir katrol besar as pembangun kayuh \nterhadap bibir pengikut katrol silinder berdiameter penyeimbang sedang di dalam adalah konstan \nber-perbedaan sejarak melingkar melenceng sepanjang 22 cm lintasan kelok.","answer":"Salah","explanation":"Keliling lingkaran penyeret silinder besar adalah 132 cm dan keliling komponen pelek penarik \nkecil sirkular = 88 cm. Margin dari penyusutan sela panjang lintas katrolnya berdiameter harus \nmenyentuh as = 132 −88 = 44 cm keliling bentang luar kurva tepi geseknya. Salah karena \nhanya parsial pengerjaan menghitung 𝜋× 𝛥𝑟 saja tanpa koefisien putar lingkaran luar penambah \nsasis."},{"text":"Apabila beban mekanis ditinggikan skalanya sehingga ban roda gir raksasa katrol berayun \ncepat memompa gasing lajunya rotasinya seberat sebanyak 30 kali mengambang berorbit \nmelingkar penuh, panjang kelonggaran asah penambat sabuk elastis memindahi perolehan laju \ndorong penampang memisahkan meteran asbes jalan meluncur seuntung laju ber-jarak 1.760 cm \njalur aspal sirkulasi.","answer":"Salah","explanation":"Perpindahan melenggang atas gerak dorong sabuk diporokan di diameter roda poros keliling dari \npelek putar kawat as gir as mesin bermembran pelek lingkar raksasa = 132 cm. Tatkala dipasang \ndipaju lari melajukan gesekan rotasi putar = 30 rotasi siklus penuh gembira, selimut kaitan \nmemanjangkan meter tali penarik as mesinnya hias lintasan kaku sejauh as as jalan sabuk =\n30 × 132 = 3.960 cm tali transmisi keluar berlubang dinamo laju, bukan setingkat kelingkap 1.760 \ncm (yang terambil miskonsepsi melarikan angka silang pembuat parameter sepusat radius katrol \npenambat lainnya)."}]},{"number":24,"level":3,"type":"Analisis Pernyataan","objective":"Menjelaskan, menentukan keliling, dan luas lingkaran","question":"Di sebuah area infrastruktur rekayasa air tanah, ditanam dua lapis pipa sirkulasi logam ganda \nkoaksial (concentric). Pipa saluran silinder bagian luarnya diproduksi dengan rancangan \nketetapan diameter dinding dalam seukuran 56 cm. Sebuah pipa bagian dalam penyeimbang \nudara kecil berbahan plastik antijenuh diinstal sepusat presisi di bagian sumbu tengah \nberdiameter terluar plastik sepanjang 28 cm. Bagian yang terbuka dari luaran tengah tabung \nkosong cincin itu lah yang difungsikan mendebit aliran utama fluida limbah air limbah pabrik. \nManfaatkan perbandingan konstanta 𝜋=\n22\n7 . Telaah validitas keabsahan hitung keempat \npernyataan matematika sirkulasi di bawah!","statements":[{"text":"Panjang kurva perimeter luar pipa utama silinder raksasa tepat bernilai 2 kali keliling lintasan \ndinding pipa plastik seimbang penyearah udara kecil penengah tersebut.","answer":"Benar","explanation":"Keliling dari silinder lingkaran berdiameter berkorespondensi lurus secara linier dengan dimensi \ngaris tengah lubang pipa silinder masing-masing: 𝐾= 𝜋𝑑. Keliling pipa berlubang luar ber-\ndiameter 𝑑1 = 56 cm adalah 176 cm. Keliling lubang tabung sepusat pipa bernomor diameter \nkecil 𝑑2 = 28 cm adalah 88 cm. Rasio rasio keliling bernilai 176 ÷ 88 = 2, terbukti keliling pipa \nluar ganda merupakan 2 kali lipat dibanding dalam."},{"text":"Area kotor bersih aliran ruang pipa yang dapat menyisihkan dan melalukan mengalirnya \nsemburan debutan air bersih secara bebas selaras luasan cincin antar dindip berkontribusi luas \narea sebanyak 1.848 𝑐𝑚2.","answer":"Benar","explanation":"Dengan menjabarkan multistep: Jari-jari lingkaran besar 𝑅1 = 28 cm sehingga diperoleh total area \npenuh 𝐿𝑢𝑎𝑠𝑏𝑒𝑠𝑎𝑟=\n22\n7 × 28 × 28 = 2.464 𝑐𝑚2. Jari-jari tabung pembagi tengah koaksial dalam \n𝑅2 = 14 cm memakan luas padat interior 𝐿𝑢𝑎𝑠𝑑𝑎𝑙𝑎𝑚=\n22\n7 × 14 × 14 = 616 𝑐𝑚2. Area kosong \npenyangga penyaring rongga laju = 𝐿𝑢𝑎𝑠𝑏𝑒𝑠𝑎𝑟−𝐿𝑢𝑎𝑠𝑑𝑎𝑙𝑎𝑚= 2.464 −616 = 1.848 𝑐𝑚2."},{"text":"Jika sirkulasi lintasan hias dipersyaratkan melumuri cat antiminyak proteksi setengah \npenampang sirkulasi lajunya secara silang, jatah volume setengah potongan bidang teraliri air itu \nsetara seluas 924 𝑐𝑚2.","answer":"Benar","explanation":"Mengacu langkah pengerjaan parsial pada bagian sisa bidang celah cincin hantaran: Rongganya \nmengantongi wilayah total hantaran berpotongan kotor luasan sebesar 1.848 𝑐𝑚2. Setengah \n\nbidang luas antrian saluran hantaran memiliki kapasitas nominal luasan cat air saringan air =\n1\n2 × 1.848 𝑐𝑚2 = 924 𝑐𝑚2."},{"text":"Rasio dari porsi persentase penampang plastik pipa bagian udara tersumbat dalam \ndibandingkan luasan daerah jalannya fluida utama adalah berkisar bernilai setara skala proporsi \nangka 1: 4.","answer":"Salah","explanation":"Menggali komparasi proporsi bagian secara presisi melalui integrasi langkah terdahulu: Luas \nsilinder plastik pembantu = 616 𝑐𝑚2 dibandingkan daerah yang dilalui zat fluida air = 1.848 𝑐𝑚2. \nRasio perbandingannya secara rasional sederhana menyentuh angka fraksional tepat 616: 1.848 \nyang jika disederhanakan bernilai = 1: 3. Komparasi perolehan skala yang bernilai 1: 4 \ndiidentifikasi salah."}]}];
let filtered = questions.slice(), current = 0;
const responses = {};
const checked = {};
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function globalIndex(){return questions.indexOf(filtered[current]);}
function answeredCount(){return questions.filter(q=>responses[q.number]!==undefined && (q.type==='Pilihan Ganda'?responses[q.number]!==null:Object.keys(responses[q.number]||{}).length>0)).length;}
function updateProgress(){$('progressPill').textContent=`Terjawab ${answeredCount()} / ${questions.length}`;}
function render(){
 const q=filtered[current]; if(!q)return;
 $('levelPill').textContent='LEVEL '+q.level;$('numberPill').textContent='SOAL '+q.number;
 $('typePill').textContent=q.type;$('counter').textContent=`${current+1} / ${filtered.length}`;
 $('questionTitle').textContent=`Pertanyaan ${q.number}`;
 $('objective').textContent='Tujuan Pembelajaran: '+q.objective;
 $('questionText').textContent=q.question;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('explanation').className='explain';$('explanation').textContent='';$('hideBtn').style.display='none';
 const area=$('interactionArea');area.innerHTML='';
 if(q.type==='Pilihan Ganda'){
   const selected=responses[q.number]||'';
   const wrap=document.createElement('div');wrap.className='options';
   q.options.forEach(o=>{
    const label=document.createElement('label');label.className='option'+(selected===o.key?' selected':'');
    if(checked[q.number]){if(o.key===q.answer)label.classList.add('correct');else if(selected===o.key)label.classList.add('wrong');}
    label.innerHTML=`<input type="radio" name="answer" value="${esc(o.key)}" ${selected===o.key?'checked':''}><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span>`;
    label.querySelector('input').addEventListener('change',()=>{responses[q.number]=o.key;renderKeepScroll();});
    wrap.appendChild(label);
   });area.appendChild(wrap);
 }else{
   const saved=responses[q.number]||{};
   q.statements.forEach((s,i)=>{
    const box=document.createElement('div');box.className='statement-item';
    box.innerHTML=`<div class="statement-text"><b>${i+1}.</b> ${esc(s.text)}</div><div class="statement-choices">
      <label class="statement-choice ${saved[i]==='Benar'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Benar" ${saved[i]==='Benar'?'checked':''}> Benar</label>
      <label class="statement-choice ${saved[i]==='Salah'?'selected':''}"><input type="radio" name="st${q.number}_${i}" value="Salah" ${saved[i]==='Salah'?'checked':''}> Salah</label>
     </div>`;
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(!responses[q.number])responses[q.number]={};responses[q.number][i]=inp.value;renderKeepScroll();}));
    if(checked[q.number]){const chosen=saved[i];const isRight=chosen===s.answer;box.style.borderColor=isRight?'#43d69a':'#ff7186';}
    area.appendChild(box);
   });
 }
 if(checked[q.number])showFeedback(q);
 updateProgress();
}
function renderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function showFeedback(q){
 const fb=$('feedback');fb.classList.add('show');
 if(q.type==='Pilihan Ganda'){
  const chosen=responses[q.number]||'';
  const ok=chosen===q.answer;
  fb.classList.toggle('wrong',!ok);
  fb.textContent=chosen?(ok?'Benar! Jawaban Anda tepat.':'Belum tepat. Periksa kembali pembahasan.'):'Belum ada jawaban yang dipilih.';
 }else{
  const a=responses[q.number]||{};let right=0;
  q.statements.forEach((s,i)=>{if(a[i]===s.answer)right++;});
  const complete=Object.keys(a).length===q.statements.length;
  fb.classList.toggle('wrong',right!==q.statements.length);
  fb.textContent=`Jawaban benar ${right} dari ${q.statements.length} pernyataan.${complete?'':' Masih ada pernyataan yang belum dijawab.'}`;
 }
}
function showExplanation(q){
 const ex=$('explanation');let content='';
 if(q.type==='Pilihan Ganda'){
  const opt=q.options.find(o=>o.key===q.answer);
  content=`Kunci Jawaban: ${q.answer}. ${opt?opt.text:''}\n\n${q.explanation}`;
 }else{
  content=q.statements.map((s,i)=>`${i+1}. Kunci: ${s.answer}\n${s.explanation}`).join('\n\n');
 }
 ex.textContent=content;ex.classList.add('show');$('hideBtn').style.display='inline-block';
}
function check(){const q=filtered[current];if(q.type==='Pilihan Ganda'&&!responses[q.number]){ $('feedback').className='feedback show wrong';$('feedback').textContent='Pilih salah satu jawaban terlebih dahulu.';return;}
 if(q.type!=='Pilihan Ganda'&&Object.keys(responses[q.number]||{}).length!==q.statements.length){$('feedback').className='feedback show wrong';$('feedback').textContent='Jawab semua pernyataan terlebih dahulu.';return;}
 checked[q.number]=true;render();showExplanation(q);
}
function reveal(){const q=filtered[current];checked[q.number]=true;render();showExplanation(q);}
function move(delta){current=Math.max(0,Math.min(filtered.length-1,current+delta));render();window.scrollTo(0,0);}
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('checkBtn').addEventListener('click',check);$('revealBtn').addEventListener('click',reveal);
$('hideBtn').addEventListener('click',()=>{$('explanation').classList.remove('show');$('hideBtn').style.display='none';});
document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 const level=btn.dataset.level;filtered=level==='all'?questions.slice():questions.filter(q=>q.level===Number(level));current=0;render();
}));
$('projectorBtn').addEventListener('click',()=>document.body.classList.toggle('projector'));
